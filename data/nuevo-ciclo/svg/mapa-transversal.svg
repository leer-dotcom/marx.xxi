<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 517" role="img" aria-label="Mapa transversal de los cuatro números: diagnóstico compartido, respuestas rechazadas, propuesta y sus dimensiones, y horizonte.">
<defs><marker id="nc-tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="87" rx="2"/>
<text class="sv-t3" x="10" y="27">DIAGNÓSTICO COMPARTIDO</text>
<rect class="sv-soft" x="4" y="119" width="752" height="102" rx="2"/>
<rect class="sv-soft" x="4" y="323" width="752" height="102" rx="2"/>
<rect class="sv-box-ink" x="12" y="38" width="235" height="57" rx="2"/>
<text class="sv-tw" x="129" y="55.5" text-anchor="middle">Declive del capitalismo</text>
<text class="sv-tw" style="font-weight:400" x="129" y="70.5" text-anchor="middle">rentabilidad en caída, población</text>
<text class="sv-tw" style="font-weight:400" x="129" y="85.5" text-anchor="middle">sobrante, «fin de juego»</text>
<rect class="sv-box-ink" x="263" y="38" width="235" height="57" rx="2"/>
<text class="sv-tw" x="380" y="55.5" text-anchor="middle">Guerra e imperialismo</text>
<text class="sv-tw" style="font-weight:400;font-size:13.9px;letter-spacing:0" x="380" y="70.5" text-anchor="middle">militarismo estructural, Gaza, rearme</text>
<text class="sv-tw" style="font-weight:400" x="380" y="85.5" text-anchor="middle">europeo</text>
<rect class="sv-box-ink" x="513" y="38" width="235" height="57" rx="2"/>
<text class="sv-tw" x="631" y="55.5" text-anchor="middle">El Estado como dictadura de clase</text>
<text class="sv-tw" style="font-weight:400" x="631" y="70.5" text-anchor="middle">Estado dual, Gladio, antiterrorismo,</text>
<text class="sv-tw" style="font-weight:400" x="631" y="85.5" text-anchor="middle">fronteras</text>
<rect class="sv-box-gold" x="12" y="141" width="235" height="72" rx="2"/>
<text class="sv-tg" x="129" y="158.5" text-anchor="middle">Socialdemocracia y reformismo</text>
<text class="sv-tg" x="129" y="173.5" text-anchor="middle">gobernante</text>
<text class="sv-t2" style="font-weight:400" x="129" y="188.5" text-anchor="middle">PSOE, Sumar, IU, Podemos, Weber,</text>
<text class="sv-t2" style="font-weight:400" x="129" y="203.5" text-anchor="middle">neofeudalismo</text>
<rect class="sv-box-gold" x="263" y="141" width="235" height="72" rx="2"/>
<text class="sv-tg" x="380" y="166.0" text-anchor="middle">Campismo y soberanismo</text>
<text class="sv-t2" style="font-weight:400" x="380" y="181.0" text-anchor="middle">pacifismo multipolar, «fantasías de</text>
<text class="sv-t2" style="font-weight:400" x="380" y="196.0" text-anchor="middle">secesión», europeísmo militarista</text>
<rect class="sv-box-gold" x="513" y="141" width="235" height="72" rx="2"/>
<text class="sv-tg" x="631" y="158.5" text-anchor="middle">Espontaneísmo, moralismo,</text>
<text class="sv-tg" x="631" y="173.5" text-anchor="middle">atrapalotodo</text>
<text class="sv-t2" style="font-weight:400" x="631" y="188.5" text-anchor="middle">comunización, frente impopular,</text>
<text class="sv-t2" style="font-weight:400" x="631" y="203.5" text-anchor="middle">feminismo dual</text>
<rect class="sv-box-red" x="12" y="245" width="736" height="54" rx="2"/>
<text class="sv-tr" x="380" y="268.5" text-anchor="middle">Independencia política del proletariado: partido comunista de masas</text>
<text class="sv-t2" style="font-weight:400" x="380" y="283.5" text-anchor="middle">«el gran ausente hoy, a la vez que la única alternativa real»</text>
<rect class="sv-box-blue" x="12" y="345" width="235" height="72" rx="2"/>
<text class="sv-tb" x="129" y="370.0" text-anchor="middle">Instituciones propias</text>
<text class="sv-t2" style="font-weight:400" x="129" y="385.0" text-anchor="middle">prensa obrera, organización</text>
<text class="sv-t2" style="font-weight:400" x="129" y="400.0" text-anchor="middle">territorial, autodefensa, gimnasios</text>
<rect class="sv-box-blue" x="263" y="345" width="235" height="72" rx="2"/>
<text class="sv-tb" x="380" y="370.0" text-anchor="middle">Legalidad e ilegalidad combinadas</text>
<text class="sv-t2" style="font-weight:400" x="380" y="385.0" text-anchor="middle">derechos políticos como armas; el</text>
<text class="sv-t2" style="font-weight:400" x="380" y="400.0" text-anchor="middle">juicio como tribuna</text>
<rect class="sv-box-blue" x="513" y="345" width="235" height="72" rx="2"/>
<text class="sv-tb" x="631" y="362.5" text-anchor="middle">Escala continental e internacional</text>
<text class="sv-t2" style="font-weight:400" x="631" y="377.5" text-anchor="middle">Partido Comunista Europeo, nueva</text>
<text class="sv-t2" style="font-weight:400" x="631" y="392.5" text-anchor="middle">Internacional, EE. UU. Socialistas de</text>
<text class="sv-t2" style="font-weight:400" x="631" y="407.5" text-anchor="middle">Europa</text>
<rect class="sv-box-green" x="12" y="449" width="736" height="54" rx="2"/>
<text class="sv-tgr" x="380" y="472.5" text-anchor="middle">Horizonte: unidad de clase (migrantes, género) y antimperialismo sin campismo — «el enemigo principal está en</text>
<text class="sv-tgr" x="380" y="487.5" text-anchor="middle">casa»; Palestina como prueba</text>
<line class="sv-line-dash" x1="129" y1="95" x2="129" y2="141" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="380" y1="95" x2="380" y2="141" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="631" y1="95" x2="631" y2="141" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line-red" d="M129 213 V229 H380 V245" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-red" x1="380" y1="213" x2="380" y2="245" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line-red" d="M631 213 V229 H380 V245" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M380 299 V322 H129 V345" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="299" x2="380" y2="345" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M380 299 V322 H631 V345" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M129 417 V433 H380 V449" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="417" x2="380" y2="449" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M631 417 V433 H380 V449" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" x="10" y="130" style="paint-order:stroke;stroke:color-mix(in srgb,var(--d-ink) 5.5%,var(--d-bg));stroke-width:5px;stroke-linejoin:round">RESPUESTAS QUE LA REVISTA RECHAZA</text>
<text class="sv-t3" x="10" y="334" style="paint-order:stroke;stroke:color-mix(in srgb,var(--d-ink) 5.5%,var(--d-bg));stroke-width:5px;stroke-linejoin:round">DIMENSIONES DE LA PROPUESTA</text>
</svg>
