<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa transversal de los cinco números: diagnóstico compartido (con el cierre del ciclo progresista), respuestas rechazadas, propuesta y sus dimensiones, y horizonte." viewBox="0 0 760 631" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="156" rx="2"/>
<rect class="sv-soft" x="4" y="188" width="752" height="117" rx="2"/>
<rect class="sv-soft" x="4" y="407" width="752" height="117" rx="2"/>
<text class="sv-t3" x="10" y="27" text-anchor="start">DIAGNÓSTICO COMPARTIDO</text>
<rect class="sv-box-ink" x="12" y="38" width="235" height="72" rx="2"/>
<text class="sv-tw" x="129.5" y="55.5" text-anchor="middle">Declive del capitalismo</text>
<text class="sv-tw" x="129.5" y="70.5" text-anchor="middle" style="font-weight:400">rentabilidad en caída, población</text>
<text class="sv-tw" x="129.5" y="85.5" text-anchor="middle" style="font-weight:400">sobrante, «fin de juego»</text>
<text class="sv-tw" x="129.5" y="100.5" text-anchor="middle" style="font-weight:400;font-size:13.4px;letter-spacing:0">tendencia de larga onda, no una fase</text>
<rect class="sv-box-ink" x="263" y="38" width="235" height="72" rx="2"/>
<text class="sv-tw" x="380.5" y="55.5" text-anchor="middle">Guerra e imperialismo</text>
<text class="sv-tw" x="380.5" y="70.5" text-anchor="middle" style="font-weight:400;font-size:13.4px;letter-spacing:0">militarismo estructural, Gaza, rearme</text>
<text class="sv-tw" x="380.5" y="85.5" text-anchor="middle" style="font-weight:400">europeo</text>
<text class="sv-tw" x="380.5" y="100.5" text-anchor="middle" style="font-weight:400">bloque occidental no monolítico</text>
<rect class="sv-box-ink" x="513" y="38" width="235" height="72" rx="2"/>
<text class="sv-tw" x="630.5" y="63" text-anchor="middle">El Estado como dictadura de clase</text>
<text class="sv-tw" x="630.5" y="78" text-anchor="middle" style="font-weight:400;font-size:13.4px;letter-spacing:0">Estado dual, Gladio, antiterrorismo,</text>
<text class="sv-tw" x="630.5" y="93" text-anchor="middle" style="font-weight:400">fronteras</text>
<rect class="sv-box-ink" x="12" y="122" width="736" height="42" rx="2"/>
<text class="sv-tw" x="380" y="140" text-anchor="middle">El ciclo progresista se ha cerrado como revolución pasiva: de su fracaso nace el ciclo reaccionario</text>
<text class="sv-tw" x="380" y="155" text-anchor="middle" style="font-weight:400;font-size:12.5px">populismo, «socialismo del siglo XXI», ola rosa → ola negra: no reanimar la marca agotada, sino la herramienta nueva</text>
<text class="sv-t3" x="140" y="199" text-anchor="start">RESPUESTAS QUE LA REVISTA RECHAZA</text>
<rect class="sv-box-gold" x="12" y="210" width="235" height="87" rx="2"/>
<text class="sv-tg" x="129.5" y="235" text-anchor="middle">Socialdemocracia y reformismo</text>
<text class="sv-tg" x="129.5" y="250" text-anchor="middle">gobernante</text>
<text class="sv-t2" x="129.5" y="265" text-anchor="middle" style="font-weight:400">PSOE, Sumar, IU, Podemos, Weber,</text>
<text class="sv-t2" x="129.5" y="280" text-anchor="middle" style="font-weight:400">neofeudalismo</text>
<rect class="sv-box-gold" x="263" y="210" width="235" height="87" rx="2"/>
<text class="sv-tg" x="380.5" y="235" text-anchor="middle">Campismo y soberanismo</text>
<text class="sv-t2" x="380.5" y="250" text-anchor="middle" style="font-weight:400;font-size:12.5px">pacifismo multipolar, «fantasías de</text>
<text class="sv-t2" x="380.5" y="265" text-anchor="middle" style="font-weight:400">secesión», europeísmo militarista</text>
<text class="sv-t2" x="380.5" y="280" text-anchor="middle" style="font-weight:400;font-size:12.5px">China y Rusia, «igualmente predatorias»</text>
<rect class="sv-box-gold" x="513" y="210" width="235" height="87" rx="2"/>
<text class="sv-tg" x="630.5" y="227.5" text-anchor="middle">Espontaneísmo, moralismo,</text>
<text class="sv-tg" x="630.5" y="242.5" text-anchor="middle">atrapalotodo</text>
<text class="sv-t2" x="630.5" y="257.5" text-anchor="middle" style="font-weight:400">comunización, frente impopular,</text>
<text class="sv-t2" x="630.5" y="272.5" text-anchor="middle" style="font-weight:400">feminismo dual</text>
<text class="sv-t2" x="630.5" y="287.5" text-anchor="middle" style="font-weight:400">balance veraz del ciclo anterior</text>
<line class="sv-line-dash" x1="129.5" y1="164" x2="129.5" y2="210" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="380.5" y1="164" x2="380.5" y2="210" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="164" x2="630.5" y2="210" marker-end="url(#nc-tr-arrow)"/>
<rect class="sv-box-red" x="12" y="329" width="736" height="54" rx="2"/>
<text class="sv-tr" x="380" y="352.5" text-anchor="middle">Independencia política del proletariado: partido comunista de masas</text>
<text class="sv-t2" x="380" y="367.5" text-anchor="middle" style="font-weight:400">«el gran ausente hoy, a la vez que la única alternativa real»</text>
<path class="sv-line-red" d="M129.5 297 V313 H380 V329" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-red" x1="380" y1="297" x2="380" y2="329" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line-red" d="M630.5 297 V313 H380 V329" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" x="140" y="418" text-anchor="start">DIMENSIONES DE LA PROPUESTA</text>
<rect class="sv-box-blue" x="12" y="429" width="235" height="87" rx="2"/>
<text class="sv-tb" x="129.5" y="461.5" text-anchor="middle">Instituciones propias</text>
<text class="sv-t2" x="129.5" y="476.5" text-anchor="middle" style="font-weight:400">prensa obrera, organización</text>
<text class="sv-t2" x="129.5" y="491.5" text-anchor="middle" style="font-weight:400">territorial, autodefensa, gimnasios</text>
<rect class="sv-box-blue" x="263" y="429" width="235" height="87" rx="2"/>
<text class="sv-tb" x="380.5" y="461.5" text-anchor="middle">Legalidad e ilegalidad combinadas</text>
<text class="sv-t2" x="380.5" y="476.5" text-anchor="middle" style="font-weight:400">derechos políticos como armas; el</text>
<text class="sv-t2" x="380.5" y="491.5" text-anchor="middle" style="font-weight:400">juicio como tribuna</text>
<rect class="sv-box-blue" x="513" y="429" width="235" height="87" rx="2"/>
<text class="sv-tb" x="630.5" y="446.5" text-anchor="middle">Escala continental e internacional</text>
<text class="sv-t2" x="630.5" y="461.5" text-anchor="middle" style="font-weight:400">Partido Comunista Europeo, nueva</text>
<text class="sv-t2" x="630.5" y="476.5" text-anchor="middle" style="font-weight:400">Internacional, EE. UU. Socialistas de</text>
<text class="sv-t2" x="630.5" y="491.5" text-anchor="middle" style="font-weight:400">Europa; en América Latina, la</text>
<text class="sv-t2" x="630.5" y="506.5" text-anchor="middle" style="font-weight:400">unidad continental</text>
<path class="sv-line" d="M380 383 V406 H129.5 V429" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="383" x2="380" y2="429" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M380 383 V406 H630.5 V429" marker-end="url(#nc-tr-arrow)"/>
<rect class="sv-box-green" x="12" y="548" width="736" height="69" rx="2"/>
<text class="sv-tgr" x="380" y="571.5" text-anchor="middle">Horizonte: unidad de clase (migrantes, género) y antimperialismo sin campismo — «el enemigo principal está en</text>
<text class="sv-tgr" x="380" y="586.5" text-anchor="middle">casa»; Palestina como prueba</text>
<text class="sv-t2" x="380" y="603" text-anchor="middle" style="font-weight:400;font-size:12.5px">«el sujeto unitario de clase debe construirse políticamente»: feminizado, formado, migrante, racialmente estratificado</text>
<path class="sv-line" d="M129.5 516 V532 H380 V548" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="516" x2="380" y2="548" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M630.5 516 V532 H380 V548" marker-end="url(#nc-tr-arrow)"/>
</svg>
