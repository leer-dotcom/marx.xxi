<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Árbol con raíz común y dos ramas: el Estado colonial sin metrópoli como avanzadilla se despliega hacia dentro (fascistización y palestinos como humanidad excedente) y hacia fuera (belicismo regional y crisis de mediaciones con EE. UU.), y ambas desembocan en una catástrofe para la Humanidad; abajo, la ausencia de oposición interna frente a la tarea de destruir el Estado de Israel." viewBox="0 0 760 528" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-ink" x="12" y="30" width="736" height="46" rx="2"/>
<text class="sv-tw" x="380" y="49.5" text-anchor="middle">Colonia sin metrópoli = avanzadilla de la barbarie</text>
<text class="sv-tw" x="380" y="64.5" text-anchor="middle" style="font-weight:400">«laboratorio de operaciones»: lo ensayado sobre los palestinos prefigura el futuro de la clase trabajadora mundial</text>
<path class="sv-line" d="M380 76 V90 H220 V136" marker-end="url(#nc-n5a4-arrow)"/>
<path class="sv-line" d="M380 76 V90 H596 V136" marker-end="url(#nc-n5a4-arrow)"/>
<text class="sv-t3" x="228" y="106" text-anchor="start">HACIA DENTRO</text>
<text class="sv-t3" x="604" y="106" text-anchor="start">HACIA FUERA</text>
<rect class="sv-soft" x="4" y="116" width="432" height="232" rx="2"/>
<text class="sv-t3" x="10" y="127">DERIVA INTERNA</text>
<rect class="sv-soft" x="436" y="116" width="320" height="232" rx="2"/>
<text class="sv-t3" x="442" y="127">DERIVA EXTERNA</text>
<rect class="sv-box" x="12" y="136" width="416" height="48" rx="2"/>
<text class="sv-t" x="220" y="156.5" text-anchor="middle">1967 + neoliberalismo + ruptura de Oslo (1993)</text>
<text class="sv-t2" x="220" y="171.5" text-anchor="middle" style="font-weight:400">el «éxito bélico» quiebra la hegemonía laborista</text>
<line class="sv-line" x1="220" y1="184" x2="220" y2="214" marker-end="url(#nc-n5a4-arrow)"/>
<text class="sv-t3" x="228" y="199" text-anchor="start">7 DE OCTUBRE ACELERA</text>
<rect class="sv-box" x="12" y="214" width="416" height="48" rx="2"/>
<text class="sv-t" x="220" y="234.5" text-anchor="middle">Fascistización: revisionismo + kahanismo + mesianismo</text>
<text class="sv-t2" x="220" y="249.5" text-anchor="middle" style="font-weight:400">«sacralización del nacionalismo»: el palestino, enemigo existencial</text>
<line class="sv-line" x1="220" y1="262" x2="220" y2="292" marker-end="url(#nc-n5a4-arrow)"/>
<text class="sv-t3" x="228" y="277" text-anchor="start">ECONOMÍA POLÍTICA</text>
<rect class="sv-box" x="12" y="292" width="416" height="48" rx="2"/>
<text class="sv-t" x="220" y="312.5" text-anchor="middle">Palestinos como humanidad excedente</text>
<text class="sv-t2" x="220" y="327.5" text-anchor="middle" style="font-weight:400">limpieza étnica · apartheid estructural · genocidio directo</text>
<rect class="sv-box" x="444" y="136" width="304" height="48" rx="2"/>
<text class="sv-t" x="596" y="156.5" text-anchor="middle">Belicismo regional</text>
<text class="sv-t2" x="596" y="171.5" text-anchor="middle" style="font-weight:400">Irán (2025, 2026), Líbano, Siria</text>
<line class="sv-line" x1="596" y1="184" x2="596" y2="292" marker-end="url(#nc-n5a4-arrow)"/>
<text class="sv-t3" x="604" y="199" text-anchor="start">DESVELA</text>
<rect class="sv-box" x="444" y="292" width="304" height="48" rx="2"/>
<text class="sv-t" x="596" y="312.5" text-anchor="middle">Crisis de mediaciones EE. UU.–Israel</text>
<text class="sv-t2" x="596" y="327.5" text-anchor="middle" style="font-weight:400">Israel, «(des)ordenador geopolítico»</text>
<path class="sv-line" d="M220 340 V358 H380 V376" marker-end="url(#nc-n5a4-arrow)"/>
<path class="sv-line" d="M596 340 V358 H380 V376" marker-end="url(#nc-n5a4-arrow)"/>
<text class="sv-t3" x="380" y="353" text-anchor="middle">DESEMBOCAN EN</text>
<rect class="sv-box" x="12" y="376" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="396.5" text-anchor="middle">Catástrofe sin precedentes para la Humanidad</text>
<text class="sv-t2" x="380" y="411.5" text-anchor="middle" style="font-weight:400">Israel, «punta de lanza» del futuro si no es derrotado</text>
<rect class="sv-soft" x="4" y="440" width="752" height="76" rx="2"/>
<text class="sv-t3" x="10" y="451">CONCLUSIÓN</text>
<path class="sv-line" d="M380 424 V436 H177 V460" marker-end="url(#nc-n5a4-arrow)"/>
<path class="sv-line-red" d="M380 424 V436 H560 V460" marker-end="url(#nc-n5a4-arrow)"/>
<rect class="sv-box-gold" x="12" y="460" width="330" height="48" rx="2"/>
<text class="sv-tg" x="177" y="480.5" text-anchor="middle">¿Dónde está el John Brown israelí?</text>
<text class="sv-t2" x="177" y="495.5" text-anchor="middle" style="font-weight:400">no hay oposición real dentro de Israel</text>
<rect class="sv-box-red" x="372" y="460" width="376" height="48" rx="2"/>
<text class="sv-tr" x="560" y="480.5" text-anchor="middle">Desionización: destruir el Estado de Israel</text>
<text class="sv-t2" x="560" y="495.5" text-anchor="middle" style="font-weight:400">tarea del proletariado mundial</text>
<line class="sv-line-dash" x1="342" y1="484" x2="372" y2="484" marker-end="url(#nc-n5a4-arrow)"/>
</svg>
