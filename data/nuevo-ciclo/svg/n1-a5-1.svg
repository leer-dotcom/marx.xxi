<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Línea temporal de la expansión del tipo penal de terrorismo en el Estado español, de 1894 a 2015, y los casos recientes que ilustran el paso de la banda armada a la disidencia política.">
<defs><marker id="nc-n1a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="204" rx="2"/>
<text class="sv-t3" x="10" y="27">CAPAS ACUMULADAS DEL TIPO PENAL</text>
<rect class="sv-soft" x="4" y="234" width="752" height="102" rx="2"/>
<text class="sv-t3" x="10" y="245">CASOS</text>
<rect class="sv-box" x="12" y="38" width="172" height="72" rx="2"/>
<text class="sv-t" x="98" y="70.5" text-anchor="middle">1894 · Ley de explosivos</text>
<text class="sv-t2" style="font-weight:400" x="98" y="85.5" text-anchor="middle">castiga el acto (Liceu)</text>
<rect class="sv-box" x="200" y="38" width="172" height="72" rx="2"/>
<text class="sv-t" x="286" y="55.5" text-anchor="middle">1896 · Vínculo con una</text>
<text class="sv-t" x="286" y="70.5" text-anchor="middle">ideología</text>
<text class="sv-t2" style="font-weight:400" x="286" y="85.5" text-anchor="middle">el anarquismo tras el</text>
<text class="sv-t2" style="font-weight:400" x="286" y="100.5" text-anchor="middle">Corpus</text>
<rect class="sv-box" x="388" y="38" width="172" height="72" rx="2"/>
<text class="sv-t" x="474" y="63.0" text-anchor="middle">1934 · Elemento subjetivo</text>
<text class="sv-t2" style="font-weight:400" x="474" y="78.0" text-anchor="middle">«subvertir el orden</text>
<text class="sv-t2" style="font-weight:400" x="474" y="93.0" text-anchor="middle">público»</text>
<rect class="sv-box-gold" x="576" y="38" width="172" height="72" rx="2"/>
<text class="sv-tg" x="662" y="55.5" text-anchor="middle">Franquismo · Peligrosidad</text>
<text class="sv-t2" style="font-weight:400" x="662" y="70.5" text-anchor="middle">barrera de la punibilidad</text>
<text class="sv-t2" style="font-weight:400" x="662" y="85.5" text-anchor="middle">adelantada (Vagos y</text>
<text class="sv-t2" style="font-weight:400" x="662" y="100.5" text-anchor="middle">Maleantes)</text>
<rect class="sv-box" x="12" y="140" width="172" height="72" rx="2"/>
<text class="sv-t" x="98" y="165.0" text-anchor="middle">1978 · Elemento</text>
<text class="sv-t" x="98" y="180.0" text-anchor="middle">estructural</text>
<text class="sv-t2" style="font-weight:400" x="98" y="195.0" text-anchor="middle">lista cerrada: grupo armado</text>
<rect class="sv-box" x="200" y="140" width="172" height="72" rx="2"/>
<text class="sv-t" x="286" y="165.0" text-anchor="middle">1995 · «Acto terrorista»</text>
<text class="sv-t2" style="font-weight:400" x="286" y="180.0" text-anchor="middle">arts. 572-573; organización</text>
<text class="sv-t2" style="font-weight:400" x="286" y="195.0" text-anchor="middle">y grupo</text>
<rect class="sv-box-red" x="388" y="140" width="172" height="72" rx="2"/>
<text class="sv-tr" x="474" y="157.5" text-anchor="middle">LO 2/2015 · Cualquier</text>
<text class="sv-tr" x="474" y="172.5" text-anchor="middle">delito</text>
<text class="sv-t2" style="font-weight:400" x="474" y="187.5" text-anchor="middle">terror como fin;</text>
<text class="sv-t2" style="font-weight:400" x="474" y="202.5" text-anchor="middle">autoadoctrinamiento (575.2)</text>
<rect class="sv-box-ink" x="576" y="140" width="172" height="72" rx="2"/>
<text class="sv-tw" x="662" y="172.5" text-anchor="middle">De banda armada a</text>
<text class="sv-tw" x="662" y="187.5" text-anchor="middle">disidencia política</text>
<rect class="sv-box-gold" x="12" y="256" width="172" height="72" rx="2"/>
<text class="sv-tg" x="98" y="273.5" text-anchor="middle">Pandora · Piñata · Ice</text>
<text class="sv-tg" x="98" y="288.5" text-anchor="middle">(2014-18)</text>
<text class="sv-t2" style="font-weight:400" x="98" y="303.5" text-anchor="middle">archivos y absolución que</text>
<text class="sv-t2" style="font-weight:400" x="98" y="318.5" text-anchor="middle">consagra la vaguedad</text>
<rect class="sv-box-gold" x="200" y="256" width="172" height="72" rx="2"/>
<text class="sv-tg" x="286" y="281.0" text-anchor="middle">Futuro Vegetal (2023-24)</text>
<text class="sv-t2" style="font-weight:400" x="286" y="296.0" text-anchor="middle">«estructura criminal» sin</text>
<text class="sv-t2" style="font-weight:400" x="286" y="311.0" text-anchor="middle">violencia</text>
<rect class="sv-box-gold" x="388" y="256" width="172" height="72" rx="2"/>
<text class="sv-tg" x="474" y="281.0" text-anchor="middle">Palestine Action (2025)</text>
<text class="sv-t2" style="font-weight:400" x="474" y="296.0" text-anchor="middle">ilegalizada; casi 500</text>
<text class="sv-t2" style="font-weight:400" x="474" y="311.0" text-anchor="middle">detenciones</text>
<rect class="sv-box-red" x="576" y="256" width="172" height="72" rx="2"/>
<text class="sv-tr" x="662" y="273.5" text-anchor="middle">Defender los derechos</text>
<text class="sv-tr" x="662" y="288.5" text-anchor="middle">políticos</text>
<text class="sv-t2" style="font-weight:400" x="662" y="303.5" text-anchor="middle">deber de quien quiera</text>
<text class="sv-t2" style="font-weight:400" x="662" y="318.5" text-anchor="middle">demoler la fortaleza</text>
<line class="sv-line" x1="184" y1="74" x2="200" y2="74" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="74" x2="388" y2="74" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="560" y1="74" x2="576" y2="74" marker-end="url(#nc-n1a5-arrow)"/>
<path class="sv-line" d="M662 110 V125 H98 V140" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="184" y1="176" x2="200" y2="176" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="176" x2="388" y2="176" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="560" y1="176" x2="576" y2="176" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="184" y1="292" x2="200" y2="292" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="292" x2="388" y2="292" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line-red" x1="662" y1="212" x2="662" y2="256" marker-end="url(#nc-n1a5-arrow)"/>
</svg>
