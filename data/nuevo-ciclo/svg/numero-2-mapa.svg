<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" role="img" aria-label="Mapa conceptual del número 2 con diez nodos: dominación de clase, sus formas políticas, el movimiento obrero, la clase sin sujeto, la guerra, el trabajo vivo y el partido con su prensa.">
<defs><marker id="nc-m2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-ink" x="263" y="30" width="235" height="72" rx="2"/>
<text class="sv-tw" x="380" y="47.5" text-anchor="middle">Dominación de clase y sus formas</text>
<text class="sv-tw" x="380" y="62.5" text-anchor="middle">políticas</text>
<text class="sv-tw" style="font-weight:400" x="380" y="77.5" text-anchor="middle">el Estado cambia de forma para</text>
<text class="sv-tw" style="font-weight:400" x="380" y="92.5" text-anchor="middle">conservar su contenido (1, 6)</text>
<rect class="sv-box" x="12" y="136" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="153.5" text-anchor="middle">Franquismo → régimen del 78</text>
<text class="sv-t2" style="font-weight:400" x="129" y="168.5" text-anchor="middle">fascismo desarrollado; continuidad del</text>
<text class="sv-t2" style="font-weight:400" x="129" y="183.5" text-anchor="middle">Estado (1)</text>
<rect class="sv-box" x="263" y="136" width="235" height="57" rx="2"/>
<text class="sv-t" x="380" y="161.0" text-anchor="middle">Reformismo digital y Estado gestor</text>
<text class="sv-t2" style="font-weight:400" x="380" y="176.0" text-anchor="middle">neofeudalismo como vestido nuevo (2)</text>
<rect class="sv-box" x="513" y="136" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="161.0" text-anchor="middle">Republicanismo burgués vs. Marx</text>
<text class="sv-t2" style="font-weight:400" x="631" y="176.0" text-anchor="middle">dispersar el poder (6)</text>
<rect class="sv-box" x="12" y="227" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="244.5" text-anchor="middle">El movimiento obrero como motor</text>
<text class="sv-t2" style="font-weight:400" x="129" y="259.5" text-anchor="middle">espejo del régimen; conquistas (1, 3,</text>
<text class="sv-t2" style="font-weight:400" x="129" y="274.5" text-anchor="middle">4)</text>
<rect class="sv-box" x="263" y="227" width="235" height="57" rx="2"/>
<text class="sv-t" x="380" y="244.5" text-anchor="middle">Clase sin sujeto político</text>
<text class="sv-t2" style="font-weight:400" x="380" y="259.5" text-anchor="middle">no hay fuerza obrera en Occidente (3,</text>
<text class="sv-t2" style="font-weight:400" x="380" y="274.5" text-anchor="middle">2, 6)</text>
<rect class="sv-box" x="513" y="227" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="252.0" text-anchor="middle">Guerra, rearme y genocidio</text>
<text class="sv-t2" style="font-weight:400" x="631" y="267.0" text-anchor="middle">población sobrante (3, 6, 4)</text>
<rect class="sv-box" x="12" y="318" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="335.5" text-anchor="middle">Trabajo vivo: fuente de valor y de</text>
<text class="sv-t" x="129" y="350.5" text-anchor="middle">muerte</text>
<text class="sv-t2" style="font-weight:400" x="129" y="365.5" text-anchor="middle">capital vampiro (2, 4)</text>
<rect class="sv-box-red" x="263" y="318" width="235" height="57" rx="2"/>
<text class="sv-tr" x="380" y="343.0" text-anchor="middle">Partido y prensa como mediación</text>
<text class="sv-t2" style="font-weight:400" x="380" y="358.0" text-anchor="middle">entre conciencia y praxis (5, 2, 4)</text>
<rect class="sv-box" x="513" y="318" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="343.0" text-anchor="middle">Ni nacionalismo ni bloques</text>
<text class="sv-t2" style="font-weight:400" x="631" y="358.0" text-anchor="middle">multipolaridad = imperialismo (3, 6)</text>
<path class="sv-line" d="M380 102 V119 H129 V136" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="380" y1="102" x2="380" y2="136" marker-end="url(#nc-m2-arrow)"/>
<path class="sv-line" d="M380 102 V119 H631 V136" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="129" y1="193" x2="129" y2="227" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="135" y="214" text-anchor="start">(1)</text>
<line class="sv-line" x1="380" y1="193" x2="380" y2="227" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="386" y="214" text-anchor="start">multitudes vs. clase (2)</text>
<line class="sv-line" x1="631" y1="193" x2="631" y2="227" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="637" y="214" text-anchor="start">(6)</text>
<line class="sv-line" x1="129" y1="284" x2="129" y2="318" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="135" y="305" text-anchor="start">conquistas (4)</text>
<line class="sv-line-red" x1="380" y1="284" x2="380" y2="318" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="631" y1="284" x2="631" y2="318" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="637" y="305" text-anchor="start">(3, 6)</text>
<line class="sv-line" x1="247" y1="346" x2="263" y2="346" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="513" y1="346" x2="497" y2="346" marker-end="url(#nc-m2-arrow)"/>
</svg>
