<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" role="img" aria-label="Dos carriles de la historia de la OTAN, el oficial y el clandestino, de 1948 a 2026, con el movimiento obrero como blanco y la posición comunista como lección.">
<defs><marker id="nc-n3a2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
