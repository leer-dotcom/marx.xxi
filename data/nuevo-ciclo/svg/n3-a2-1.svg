<text class="sv-t3" x="10" y="27">CARRIL OFICIAL</text>
<rect class="sv-soft" x="4" y="132" width="752" height="132" rx="2"/>
<text class="sv-t3" x="10" y="143">CARRIL CLANDESTINO</text>
<rect class="sv-box" x="12" y="38" width="134" height="72" rx="2"/>
<text class="sv-t" x="79" y="55.5" text-anchor="middle">1949 · Fundación</text>
<text class="sv-t2" style="font-weight:400" x="79" y="70.5" text-anchor="middle">Plan Marshall:</text>
<text class="sv-t2" style="font-weight:400" x="79" y="85.5" text-anchor="middle">integración</text>
<text class="sv-t2" style="font-weight:400" x="79" y="100.5" text-anchor="middle">subordinada</text>
<rect class="sv-box" x="162" y="38" width="134" height="72" rx="2"/>
<text class="sv-t" x="230" y="63.0" text-anchor="middle">1986 · España</text>
<text class="sv-t2" style="font-weight:400" x="230" y="78.0" text-anchor="middle">giro del PSOE y</text>
<text class="sv-t2" style="font-weight:400" x="230" y="93.0" text-anchor="middle">referéndum</text>
<rect class="sv-box" x="313" y="38" width="134" height="72" rx="2"/>
<text class="sv-t" x="380" y="55.5" text-anchor="middle">1999 · Expansión al</text>
<text class="sv-t" x="380" y="70.5" text-anchor="middle">Este</text>
<text class="sv-t2" style="font-weight:400" x="380" y="85.5" text-anchor="middle">cercar a Rusia,</text>
<text class="sv-t2" style="font-weight:400" x="380" y="100.5" text-anchor="middle">ampliar mercados</text>
<rect class="sv-box" x="463" y="38" width="134" height="72" rx="2"/>
<text class="sv-t" x="530" y="55.5" text-anchor="middle">1999-2011 · Guerras</text>
<text class="sv-t" x="530" y="70.5" text-anchor="middle">«humanitarias»</text>
<text class="sv-t2" style="font-weight:400" x="530" y="85.5" text-anchor="middle">Kosovo, Afganistán,</text>
<text class="sv-t2" style="font-weight:400" x="530" y="100.5" text-anchor="middle">Irak, Libia</text>
<rect class="sv-box" x="614" y="38" width="134" height="72" rx="2"/>
<text class="sv-t" x="681" y="63.0" text-anchor="middle">2014-22 · Ucrania</text>
<text class="sv-t" x="681" y="78.0" text-anchor="middle">como proxy</text>
<text class="sv-t2" style="font-weight:400" x="681" y="93.0" text-anchor="middle">rearme: 2 % del PIB</text>
<rect class="sv-box-gold" x="12" y="154" width="134" height="102" rx="2"/>
<text class="sv-tg" x="79" y="194.0" text-anchor="middle">1948 · NSC 10/2</text>
<text class="sv-t2" style="font-weight:400" x="79" y="209.0" text-anchor="middle">CIA en las</text>
<text class="sv-t2" style="font-weight:400" x="79" y="224.0" text-anchor="middle">elecciones italianas</text>
<rect class="sv-box-gold" x="162" y="154" width="134" height="102" rx="2"/>
<text class="sv-tg" x="230" y="171.5" text-anchor="middle">1950 · Redes</text>
<text class="sv-tg" x="230" y="186.5" text-anchor="middle">stay-behind /</text>
<text class="sv-tg" x="230" y="201.5" text-anchor="middle">Gladio</text>
<text class="sv-t2" style="font-weight:400" x="230" y="216.5" text-anchor="middle">con CIA, MI6 y</text>
<text class="sv-t2" style="font-weight:400" x="230" y="231.5" text-anchor="middle">fascistas (Borghese,</text>
<text class="sv-t2" style="font-weight:400" x="230" y="246.5" text-anchor="middle">Gelli)</text>
<rect class="sv-box-gold" x="313" y="154" width="134" height="102" rx="2"/>
<text class="sv-tg" x="380" y="179.0" text-anchor="middle">1969 · Piazza</text>
<text class="sv-tg" x="380" y="194.0" text-anchor="middle">Fontana</text>
<text class="sv-t2" style="font-weight:400" x="380" y="209.0" text-anchor="middle">Estrategia de la</text>
<text class="sv-t2" style="font-weight:400" x="380" y="224.0" text-anchor="middle">Tensión, Años de</text>
<text class="sv-t2" style="font-weight:400" x="380" y="239.0" text-anchor="middle">Plomo</text>
<rect class="sv-box-gold" x="463" y="154" width="134" height="102" rx="2"/>
<text class="sv-tg" x="530" y="186.5" text-anchor="middle">1978 · Moro · 1980</text>
<text class="sv-tg" x="530" y="201.5" text-anchor="middle">· Bolonia</text>
<text class="sv-t2" style="font-weight:400" x="530" y="216.5" text-anchor="middle">contra el compromiso</text>
<text class="sv-t2" style="font-weight:400" x="530" y="231.5" text-anchor="middle">histórico</text>
<rect class="sv-box-gold" x="614" y="154" width="134" height="102" rx="2"/>
<text class="sv-tg" x="681" y="171.5" text-anchor="middle">1984-90 ·</text>
<text class="sv-tg" x="681" y="186.5" text-anchor="middle">Vinciguerra,</text>
<text class="sv-tg" x="681" y="201.5" text-anchor="middle">Casson, Andreotti</text>
<text class="sv-t2" style="font-weight:400" x="681" y="216.5" text-anchor="middle">reconocimiento</text>
<text class="sv-t2" style="font-weight:400" x="681" y="231.5" text-anchor="middle">oficial; Operación</text>
<text class="sv-t2" style="font-weight:400" x="681" y="246.5" text-anchor="middle">Cóndor</text>
<rect class="sv-box-red" x="12" y="286" width="285" height="57" rx="2"/>
<text class="sv-tr" x="154" y="311.0" text-anchor="middle">Blanco: PCI, PCF y movimiento obrero</text>
<text class="sv-t2" style="font-weight:400" x="154" y="326.0" text-anchor="middle">la «amenaza interna»</text>
<rect class="sv-box-ink" x="313" y="286" width="435" height="57" rx="2"/>
<text class="sv-tw" x="530" y="303.5" text-anchor="middle">Lección: dictadura de clase bajo la democracia liberal</text>
<text class="sv-tw" style="font-weight:400" x="530" y="318.5" text-anchor="middle">no a OTAN y UE: desmantelarlas; milicia popular; Estados Unidos</text>
<text class="sv-tw" style="font-weight:400" x="530" y="333.5" text-anchor="middle">Socialistas de Europa; partido comunista europeo</text>
