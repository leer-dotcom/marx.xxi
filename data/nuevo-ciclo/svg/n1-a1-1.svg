<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Línea de ciclos revolucionarios y cadena causal de la encrucijada actual, con la independencia política del proletariado como única salida y dos errores a evitar.">
<defs><marker id="nc-n1a1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="564" height="102" rx="2"/>
<text class="sv-t3" x="10" y="27">CICLOS REVOLUCIONARIOS</text>
<rect class="sv-soft" x="4" y="132" width="752" height="204" rx="2"/>
<text class="sv-t3" x="10" y="143">LA ENCRUCIJADA DEL PRESENTE</text>
<rect class="sv-box" x="12" y="38" width="172" height="72" rx="2"/>
<text class="sv-t" x="98" y="63.0" text-anchor="middle">Ciclo del siglo XX</text>
<text class="sv-t2" style="font-weight:400" x="98" y="78.0" text-anchor="middle">1917-1991: «hablar francés»</text>
<text class="sv-t2" style="font-weight:400" x="98" y="93.0" text-anchor="middle">y «hablar alemán»</text>
<rect class="sv-box" x="200" y="38" width="172" height="72" rx="2"/>
<text class="sv-t" x="286" y="55.5" text-anchor="middle">Cierre y repliegue</text>
<text class="sv-t2" style="font-weight:400" x="286" y="70.5" text-anchor="middle">bancarrota del «socialismo</text>
<text class="sv-t2" style="font-weight:400" x="286" y="85.5" text-anchor="middle">en un solo país» y de las</text>
<text class="sv-t2" style="font-weight:400" x="286" y="100.5" text-anchor="middle">vías nacionales</text>
<rect class="sv-box-red" x="388" y="38" width="172" height="72" rx="2"/>
<text class="sv-tr" x="474" y="55.5" text-anchor="middle">Nuevo ciclo</text>
<text class="sv-tr" x="474" y="70.5" text-anchor="middle">revolucionario</text>
<text class="sv-t2" style="font-weight:400" x="474" y="85.5" text-anchor="middle">disputa abierta entre dos</text>
<text class="sv-t2" style="font-weight:400" x="474" y="100.5" text-anchor="middle">modelos civilizatorios</text>
<rect class="sv-box-gold" x="576" y="38" width="172" height="72" rx="2"/>
<text class="sv-tg" x="662" y="55.5" text-anchor="middle">Dos errores simétricos</text>
<text class="sv-t2" style="font-weight:400" x="662" y="70.5" text-anchor="middle">adanismo (borrón y cuenta</text>
<text class="sv-t2" style="font-weight:400" x="662" y="85.5" text-anchor="middle">nueva) · hagiografía</text>
<text class="sv-t2" style="font-weight:400" x="662" y="100.5" text-anchor="middle">(conectarse a la ola)</text>
<rect class="sv-box-ink" x="12" y="154" width="172" height="72" rx="2"/>
<text class="sv-tw" x="98" y="194.0" text-anchor="middle">Declive capitalista</text>
<rect class="sv-box" x="200" y="154" width="172" height="72" rx="2"/>
<text class="sv-t" x="286" y="171.5" text-anchor="middle">Proletarización masiva +</text>
<text class="sv-t" x="286" y="186.5" text-anchor="middle">fragmentación</text>
<text class="sv-t2" style="font-weight:400" x="286" y="201.5" text-anchor="middle">servicios precarios,</text>
<text class="sv-t2" style="font-weight:400" x="286" y="216.5" text-anchor="middle">poblaciones sobrantes</text>
<rect class="sv-box" x="388" y="154" width="172" height="72" rx="2"/>
<text class="sv-t" x="474" y="171.5" text-anchor="middle">Debilidad política del</text>
<text class="sv-t" x="474" y="186.5" text-anchor="middle">proletariado</text>
<text class="sv-t2" style="font-weight:400" x="474" y="201.5" text-anchor="middle">sin partido ni movimiento</text>
<text class="sv-t2" style="font-weight:400" x="474" y="216.5" text-anchor="middle">obrero</text>
<rect class="sv-box" x="576" y="154" width="172" height="72" rx="2"/>
<text class="sv-t" x="662" y="171.5" text-anchor="middle" style="font-size:12.4px;letter-spacing:0">Hegemonía pequeñoburguesa</text>
<text class="sv-t" x="662" y="186.5" text-anchor="middle">de las protestas</text>
<text class="sv-t2" style="font-weight:400" x="662" y="201.5" text-anchor="middle">15-M, primaveras árabes,</text>
<text class="sv-t2" style="font-weight:400" x="662" y="216.5" text-anchor="middle">Chile</text>
<rect class="sv-box" x="576" y="256" width="172" height="72" rx="2"/>
<text class="sv-t" x="662" y="273.5" text-anchor="middle">Revoluciones burguesas</text>
<text class="sv-t" x="662" y="288.5" text-anchor="middle">obsoletas</text>
<text class="sv-t2" style="font-weight:400" x="662" y="303.5" text-anchor="middle">impotencia del populismo de</text>
<text class="sv-t2" style="font-weight:400" x="662" y="318.5" text-anchor="middle">izquierdas</text>
<rect class="sv-box-gold" x="388" y="256" width="172" height="72" rx="2"/>
<text class="sv-tg" x="474" y="273.5" text-anchor="middle">Ascenso del populismo de</text>
<text class="sv-tg" x="474" y="288.5" text-anchor="middle">derechas</text>
<text class="sv-t2" style="font-weight:400" x="474" y="303.5" text-anchor="middle">fascismo clásico</text>
<text class="sv-t2" style="font-weight:400" x="474" y="318.5" text-anchor="middle">actualizado</text>
<rect class="sv-box-red" x="12" y="256" width="360" height="72" rx="2"/>
<text class="sv-tr" x="192" y="281.0" text-anchor="middle">Salida: independencia política del proletariado</text>
<text class="sv-t2" style="font-weight:400" x="192" y="296.0" text-anchor="middle">partido + movimiento obrero, sin etapismos (la tarea de</text>
<text class="sv-t2" style="font-weight:400" x="192" y="311.0" text-anchor="middle">1850)</text>
<line class="sv-line" x1="184" y1="74" x2="200" y2="74" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="372" y1="74" x2="388" y2="74" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="184" y1="190" x2="200" y2="190" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="372" y1="190" x2="388" y2="190" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="560" y1="190" x2="576" y2="190" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="662" y1="226" x2="662" y2="256" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="576" y1="292" x2="560" y2="292" marker-end="url(#nc-n1a1-arrow)"/>
<path class="sv-line-red" d="M474 226 V241 H192 V256" marker-end="url(#nc-n1a1-arrow)"/>
<text class="sv-t3" x="333" y="237" text-anchor="middle">única revolución posible</text>
</svg>
