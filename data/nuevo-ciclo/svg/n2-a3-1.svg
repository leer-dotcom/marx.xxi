<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-label="Matriz de la clase obrera europea: tendencias a la unificación y fracturas en los planos objetivo y subjetivo, y las tres respuestas erradas ante el rearme.">
<defs><marker id="nc-n2a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="211" width="752" height="87" rx="2"/>
<text class="sv-t3" x="10" y="222">RESPUESTAS ANTE EL REARME</text>
<rect class="sv-box-blue" x="12" y="30" width="360" height="72" rx="2"/>
<text class="sv-tb" x="192" y="47.5" text-anchor="middle">Bases de unión</text>
<text class="sv-t2" style="font-weight:400" x="192" y="62.5" text-anchor="middle">BCE, TJUE, comités de empresa europeos; integración</text>
<text class="sv-t2" style="font-weight:400" x="192" y="77.5" text-anchor="middle">sectorial, convergencia de rentas; apartheid migratorio (10</text>
<text class="sv-t2" style="font-weight:400" x="192" y="92.5" text-anchor="middle">%)</text>
<rect class="sv-box" x="388" y="30" width="360" height="72" rx="2"/>
<text class="sv-t" x="568" y="55.0" text-anchor="middle">Capacidad de lucha débil</text>
<text class="sv-t2" style="font-weight:400" x="568" y="70.0" text-anchor="middle">huelga general en Grecia, Francia, Bélgica; formatos</text>
<text class="sv-t2" style="font-weight:400" x="568" y="85.0" text-anchor="middle">simbólico y minoritario; ninguna fuerza política obrera</text>
<rect class="sv-box-red" x="12" y="132" width="360" height="57" rx="2"/>
<text class="sv-tr" x="192" y="149.5" text-anchor="middle">Cicatrices</text>
<text class="sv-t2" style="font-weight:400" x="192" y="164.5" text-anchor="middle">este-oeste (Bolkestein 2005-06), norte-sur (austeridad, 14N</text>
<text class="sv-t2" style="font-weight:400" x="192" y="179.5" text-anchor="middle">2012)</text>
<rect class="sv-box-red" x="388" y="132" width="360" height="57" rx="2"/>
<text class="sv-tr" x="568" y="149.5" text-anchor="middle">Mediación nacional</text>
<text class="sv-t2" style="font-weight:400" x="568" y="164.5" text-anchor="middle">sindicatos-lobby de concertación, partidos de clases</text>
<text class="sv-t2" style="font-weight:400" x="568" y="179.5" text-anchor="middle">medias, 27 marcos estatales</text>
<rect class="sv-box-gold" x="12" y="233" width="235" height="57" rx="2"/>
<text class="sv-tg" x="129" y="250.5" text-anchor="middle">Cierre nacionalista (derecha)</text>
<text class="sv-t2" style="font-weight:400" x="129" y="265.5" text-anchor="middle">subordinación a EE. UU., hostilidad al</text>
<text class="sv-t2" style="font-weight:400" x="129" y="280.5" text-anchor="middle">migrante</text>
<rect class="sv-box-gold" x="263" y="233" width="235" height="57" rx="2"/>
<text class="sv-tg" x="380" y="250.5" text-anchor="middle">Europeísmo abstracto</text>
<text class="sv-t2" style="font-weight:400" x="380" y="265.5" text-anchor="middle">socialdemocracia, CCOO, CGIL: avalan</text>
<text class="sv-t2" style="font-weight:400" x="380" y="280.5" text-anchor="middle">el rearme</text>
<rect class="sv-box-gold" x="513" y="233" width="235" height="57" rx="2"/>
<text class="sv-tg" x="631" y="250.5" text-anchor="middle">Soberanismo tercermundista</text>
<text class="sv-t2" style="font-weight:400" x="631" y="265.5" text-anchor="middle">lucha de clases subordinada a BRICS o</text>
<text class="sv-t2" style="font-weight:400" x="631" y="280.5" text-anchor="middle">Rusia</text>
<rect class="sv-box-red" x="12" y="320" width="736" height="48" rx="2"/>
<text class="sv-tr" x="380" y="340.5" text-anchor="middle">Movimiento obrero europeo contra el militarismo: elementos políticos avanzados en las luchas</text>
<text class="sv-t2" style="font-weight:400" x="380" y="355.5" text-anchor="middle">romper con las fantasías de secesión nacional y con el militarismo del europeísmo oficial</text>
<text class="sv-t3" x="192" y="20" text-anchor="middle">PLANO OBJETIVO</text>
<text class="sv-t3" x="568" y="20" text-anchor="middle">PLANO SUBJETIVO / POLÍTICO</text>
<path class="sv-line-dash" d="M129 290 V305 H380 V320" marker-end="url(#nc-n2a3-arrow)"/>
<line class="sv-line-dash" x1="380" y1="290" x2="380" y2="320" marker-end="url(#nc-n2a3-arrow)"/>
<path class="sv-line-dash" d="M631 290 V305 H380 V320" marker-end="url(#nc-n2a3-arrow)"/>
</svg>
