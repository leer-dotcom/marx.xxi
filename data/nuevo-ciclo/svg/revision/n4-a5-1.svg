<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 910" role="img" aria-label="Base imperialista de la cuestión migratoria y su expresión doméstica (la subclase migrante), doble estrategia de integración dentro y control fuera, los actores socialdemócratas que la ejecutan o legitiman, las tres fases históricas, la maduración hacia el arraigo individual y la salida de clase antimperialista." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="16">BASE: EL MECANISMO IMPERIALISTA</text>
<rect class="sv-box-ink" x="12" y="22" width="736" height="80.0" rx="2"/>
<text class="sv-tw" x="380" y="42.2" text-anchor="middle">Imperialismo: desarticulación de las periferias (Amin) → presión emigratoria estructural</text>
<text class="sv-tw" x="380" y="57.7" text-anchor="middle">+ estratificación mundial del proletariado, necesaria al capital para:</text>
<text class="sv-tw" style="font-size:13px;font-weight:400" x="380" y="73.2" text-anchor="middle">(1) la paz social del centro · (2) la realización del valor por el consumo de masas · (3) el arbitraje laboral global</text>
<text class="sv-tw" style="font-size:13px;font-weight:400" x="380" y="88.7" text-anchor="middle">La inmigración preocupa no por la mano de obra barata, sino porque cuestiona esa estratificación</text>
<rect class="sv-box" x="12" y="126.0" width="736" height="80.0" rx="2"/>
<text class="sv-t" x="380" y="146.2" text-anchor="middle">Imperialismo en casa: la subclase migrante (estratificación racial del proletariado)</text>
<text class="sv-t2" x="380" y="161.7" text-anchor="middle">capa sujeta a más violencia, disciplina y despojo, insertada como mano de obra barata o reserva desechable</text>
<text class="sv-t2" x="380" y="177.2" text-anchor="middle">brecha salarial: −60 % en el decil más bajo y no menos del 40 % en los seis siguientes (OIT)</text>
<text class="sv-t2" x="380" y="192.7" text-anchor="middle">programa migratorio burgués: gestión geográfica de la estructura de clases global (subordinación congénita, no contingente)</text>
<line class="sv-line" x1="380" y1="102" x2="380" y2="126" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="117">expresión doméstica</text>
<line class="sv-line" x1="380" y1="206" x2="380" y2="234" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="221">la burguesía la gestiona con</text>
<rect class="sv-soft" x="4" y="230.0" width="752" height="122.5" rx="2"/>
<text class="sv-t3" x="18" y="245">DOBLE ESTRATEGIA · PROYECTO PREFERIDO DE LA BURGUESÍA OCCIDENTAL DESDE LA POSGUERRA</text>
<rect class="sv-box" x="12" y="254.0" width="360" height="90.5" rx="2"/>
<text class="sv-tb" x="192" y="280.7" text-anchor="middle">Dentro: integración parcial (derechos vaciados)</text>
<text class="sv-t2" style="font-size:12px" x="192" y="295.2" text-anchor="middle">regularizaciones, arraigo individual, Ley Zerolo, sanidad</text>
<text class="sv-t2" style="font-size:12px" x="192" y="309.7" text-anchor="middle">concesión parcial y vaciada: alivia tensiones domésticas</text>
<text class="sv-t2" style="font-size:12px" x="192" y="324.2" text-anchor="middle">y conserva la fachada liberal (hoy en franco retroceso)</text>
<rect class="sv-box" x="388" y="254.0" width="360" height="90.5" rx="2"/>
<text class="sv-tr" x="568" y="273.4" text-anchor="middle">Fuera: control fronterizo cada vez más férreo</text>
<text class="sv-t2" style="font-size:12px" x="568" y="287.9" text-anchor="middle">CIE, concertinas, externalización, PEMA,</text>
<text class="sv-t2" style="font-size:12px" x="568" y="302.4" text-anchor="middle">cárceles de migrantes en Mauritania (antes que Meloni)</text>
<text class="sv-t2" style="font-size:12px" x="568" y="316.9" text-anchor="middle">«defensa fronteriza bajo pena de muerte»: restringe el</text>
<text class="sv-t2" style="font-size:12px" x="568" y="331.4" text-anchor="middle">acceso periférico al Norte y salvaguarda la paz social</text>
<path class="sv-line" d="M380 352.5 V364.5 H192 V382.5" marker-end="url(#nc-n4a5-arrow)"/>
<path class="sv-line" d="M380 352.5 V364.5 H568 V382.5" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="198" y="376.5">la ejecuta</text>
<text class="sv-t3" x="574" y="376.5">la legitima</text>
<rect class="sv-box" x="12" y="382.5" width="360" height="119.5" rx="2"/>
<text class="sv-t" x="192" y="401.9" text-anchor="middle">PSOE (moderada): perfil de Estado</text>
<text class="sv-t2" style="font-size:12px" x="192" y="416.4" text-anchor="middle">actor principal de las bases institucionales del régimen</text>
<text class="sv-t2" style="font-size:12px" x="192" y="430.9" text-anchor="middle">migratorio; asume y hace propios los marcos comunitarios</text>
<text class="sv-t2" style="font-size:12px" x="192" y="445.4" text-anchor="middle">en el poder: evitar crisis mediáticas para conservar la</text>
<text class="sv-t2" style="font-size:12px" x="192" y="459.9" text-anchor="middle">fachada liberal; reglamentos dictados por la patronal</text>
<text class="sv-t2" style="font-size:12px" x="192" y="474.4" text-anchor="middle">fronteras que matan más que las de Meloni: la paz social</text>
<text class="sv-t2" style="font-size:12px" x="192" y="488.9" text-anchor="middle">europea exige el control fronterizo</text>
<rect class="sv-box-gold" x="388" y="382.5" width="360" height="119.5" rx="2"/>
<text class="sv-tg" x="568" y="401.9" text-anchor="middle">Socialdemocracia radical: IU (1991) → Podemos (2026)</text>
<text class="sv-t2" style="font-size:12px" x="568" y="416.4" text-anchor="middle">puntas del iceberg (Tarajal, 24-J) en vez de análisis:</text>
<text class="sv-t2" style="font-size:12px" x="568" y="430.9" text-anchor="middle">prima el espectáculo y se diluye el objetivo</text>
<text class="sv-t2" style="font-size:12px" x="568" y="445.4" text-anchor="middle">marco liberal (derechos humanos, «discursos de odio»): cada</text>
<text class="sv-t2" style="font-size:12px" x="568" y="459.9" text-anchor="middle">ofensiva del capital se registra como «anomalía»</text>
<text class="sv-t2" style="font-size:12px" x="568" y="474.4" text-anchor="middle">horizonte máximo: derogar la LOEx (una ley, no el orden</text>
<text class="sv-t2" style="font-size:12px" x="568" y="488.9" text-anchor="middle">neocolonial); ineficaz: «ala izquierda del capital»</text>
<rect class="sv-soft" x="4" y="528.0" width="752" height="158.0" rx="2"/>
<text class="sv-t3" x="18" y="543">TRES FASES DEL RÉGIMEN MIGRATORIO ESPAÑOL</text>
<rect class="sv-box" x="12" y="552.0" width="236" height="126.0" rx="2"/>
<text class="sv-t" x="130" y="570.7" text-anchor="middle">1985-99: fundación</text>
<text class="sv-t3" x="130" y="584.2" text-anchor="middle">lenta actualización a Europa</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="597.7" text-anchor="middle">LOEx 7/1985 exigida por Bruselas;</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="611.2" text-anchor="middle">consenso PSOE-PP; sujeto productivo</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="624.7" text-anchor="middle">sin derechos políticos; IU cataliza</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="638.2" text-anchor="middle">reformas universalistas (1991);</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="651.7" text-anchor="middle">visados, Schengen: nace la doble</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="665.2" text-anchor="middle">estrategia (integrar / controlar)</text>
<rect class="sv-box" x="262" y="552.0" width="236" height="126.0" rx="2"/>
<text class="sv-t" x="380" y="570.7" text-anchor="middle">2000-15: consolidación</text>
<text class="sv-t3" x="380" y="584.2" text-anchor="middle">cierta dirección propia</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="597.7" text-anchor="middle">LOEx 4/2000 (IU) → 8/2000 del PP:</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="611.2" text-anchor="middle">«efecto llamada»; Zapatero no toca</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="624.7" text-anchor="middle">la ley del PP: concertinas, CIE,</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="638.2" text-anchor="middle">Frontex, Directiva de la Vergüenza;</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="651.7" text-anchor="middle">regularizar para el boom: la mayor</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="665.2" text-anchor="middle">regularización de la historia</text>
<rect class="sv-box" x="512" y="552.0" width="236" height="126.0" rx="2"/>
<text class="sv-t" x="630" y="570.7" text-anchor="middle">2015-26: cambio de ciclo</text>
<text class="sv-t3" x="630" y="584.2" text-anchor="middle">post-15M: modelo de coalición</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="597.7" text-anchor="middle">Podemos: medidas sin precedente,</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="611.2" text-anchor="middle">pero puntas del iceberg; Aquarius →</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="624.7" text-anchor="middle">continuismo (TEDH, Marruecos, Open</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="638.2" text-anchor="middle">Arms); coalición: prevalece Marlaska,</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="651.7" text-anchor="middle">ILP encallada; ucranianos vs. 24-J,</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="665.2" text-anchor="middle">PEMA, Mauritania, regularización 2026</text>
<line class="sv-line" x1="248" y1="615" x2="262" y2="615" marker-end="url(#nc-n4a5-arrow)"/>
<line class="sv-line" x1="498" y1="615" x2="512" y2="615" marker-end="url(#nc-n4a5-arrow)"/>
<line class="sv-line" x1="380" y1="686" x2="380" y2="712" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="702">tendencia de fondo</text>
<rect class="sv-box-blue" x="12" y="712.0" width="736" height="80.0" rx="2"/>
<text class="sv-tb" x="380" y="732.2" text-anchor="middle">Maduración de la política migratoria burguesa</text>
<text class="sv-t2" x="380" y="747.7" text-anchor="middle">de la regularización extraordinaria (revuelo social, politiza, enfada a Europa) al arraigo individual, despolitizado:</text>
<text class="sv-t2" x="380" y="763.2" text-anchor="middle">un mecanismo de ajuste semiautomático de la reserva de mano de obra a las necesidades del mercado laboral</text>
<text class="sv-t2" x="380" y="778.7" text-anchor="middle">la de 2026, victoria del movimiento antirracista, es también exigencia patronal, parche a sus errores y cálculo electoral</text>
<line class="sv-line" x1="380" y1="792" x2="380" y2="818" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="808">límite estructural → salida</text>
<rect class="sv-box-red" x="12" y="818.0" width="736" height="80.0" rx="2"/>
<text class="sv-tr" x="380" y="838.2" text-anchor="middle">Unidad de clase antimperialista: destruir a la vez, sistemáticamente, imperialismo y racismo</text>
<text class="sv-t2" x="380" y="853.7" text-anchor="middle">la inmigración es la expresión interna del imperialismo; para la burguesía el control de fronteras no es una opción</text>
<text class="sv-t2" x="380" y="869.2" text-anchor="middle">sin una estrategia antimperialista real, la gente seguirá migrando y Europa la seguirá matando, persiguiendo o explotando</text>
<text class="sv-t2" x="380" y="884.7" text-anchor="middle">la socialdemocracia, radical o moderada, repite el chovinismo de la Segunda Internacional: la historia como farsa</text>
</svg>
