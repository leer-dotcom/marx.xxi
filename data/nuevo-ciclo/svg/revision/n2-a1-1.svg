<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Línea temporal del franquismo: la tesis (fascismo desarrollado), dos fases —contrarrevolución y autarquía, desarrollismo y reformismos fallidos— y el movimiento obrero como espejo que fuerza cada mutación del régimen hasta el régimen del 78." viewBox="0 0 760 726" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-red" x="12" y="10" width="736" height="74" rx="2"/>
<text class="sv-tr" x="380" y="35.3" text-anchor="middle">Tesis: el franquismo, una de las formas de fascismo más desarrolladas (forma de Estado y programa económico)</text>
<text class="sv-t2" x="380" y="50.3" text-anchor="middle" style="font-size:12.5px">Forma de Estado contrarrevolucionaria y antiproletaria: respuesta cuando la revolución no triunfa y el orden liberal</text>
<text class="sv-t2" x="380" y="65.3" text-anchor="middle" style="font-size:12.5px">no asegura la acumulación; recomposición del orden burgués por regeneración nacional y violencia masiva [p.6]</text>
<rect class="sv-soft" x="4" y="98" width="752" height="160" rx="2"/>
<text class="sv-t3" x="750" y="110" text-anchor="end">1936-1959 · CONTRARREVOLUCIÓN Y AUTARQUÍA</text>
<rect class="sv-box" x="12" y="120" width="172" height="128" rx="2"/>
<text class="sv-t" x="98" y="157.3" text-anchor="middle">Crisis de la Restauración</text>
<text class="sv-t2" x="98" y="172.3" text-anchor="middle">agraria y obrera; política</text>
<text class="sv-t2" x="98" y="187.3" text-anchor="middle">(turnismo, liberalismo</text>
<text class="sv-t2" x="98" y="202.3" text-anchor="middle">autoritario); colonial.</text>
<text class="sv-t2" x="98" y="217.3" text-anchor="middle">La República la agudiza</text>
<rect class="sv-box-red" x="200" y="120" width="172" height="128" rx="2"/>
<text class="sv-tr" x="286" y="142.3" text-anchor="middle">Guerra de exterminio y</text>
<text class="sv-tr" x="286" y="157.3" text-anchor="middle">botín de guerra</text>
<text class="sv-t2" x="286" y="172.3" text-anchor="middle" style="font-size:12.5px">dos lecciones de los años 20:</text>
<text class="sv-t2" x="286" y="187.3" text-anchor="middle" style="font-size:12.5px">nuevo contenido del Estado</text>
<text class="sv-t2" x="286" y="202.3" text-anchor="middle" style="font-size:12.5px">y violencia sistemática</text>
<text class="sv-t2" x="286" y="217.3" text-anchor="middle" style="font-size:12.5px">LRP 1939 y Ley de 1940:</text>
<text class="sv-t2" x="286" y="232.3" text-anchor="middle" style="font-size:12.5px">acumulación por desposesión</text>
<rect class="sv-box" x="388" y="120" width="172" height="128" rx="2"/>
<text class="sv-t" x="474" y="142.3" text-anchor="middle">Coalición de clase +</text>
<text class="sv-t" x="474" y="157.3" text-anchor="middle">Estado nuevo</text>
<text class="sv-t2" x="474" y="172.3" text-anchor="middle" style="font-size:12.5px">burguesía, clases medias</text>
<text class="sv-t2" x="474" y="187.3" text-anchor="middle" style="font-size:12.5px">leales, propietario rural</text>
<text class="sv-t2" x="474" y="202.3" text-anchor="middle" style="font-size:12.5px">católico, militares, clero</text>
<text class="sv-t2" x="474" y="217.3" text-anchor="middle" style="font-size:12.5px">Caudillo, Fuero del Trabajo</text>
<text class="sv-t2" x="474" y="232.3" text-anchor="middle" style="font-size:12.5px">(1938), OSE, partido-Estado</text>
<rect class="sv-box" x="576" y="120" width="172" height="128" rx="2"/>
<text class="sv-t" x="662" y="149.8" text-anchor="middle">Autarquía: disciplina</text>
<text class="sv-t" x="662" y="164.8" text-anchor="middle">salarial</text>
<text class="sv-t2" x="662" y="179.8" text-anchor="middle">trabajo pagado por debajo</text>
<text class="sv-t2" x="662" y="194.8" text-anchor="middle">de su valor (ISI)</text>
<text class="sv-t2" x="662" y="209.8" text-anchor="middle">huelga general de</text>
<text class="sv-t2" x="662" y="224.8" text-anchor="middle">Barcelona 1951: primer aviso</text>
<line class="sv-line" x1="184" y1="184" x2="200" y2="184" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="372" y1="184" x2="388" y2="184" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="560" y1="184" x2="576" y2="184" marker-end="url(#nc-n2a1-arrow)"/>
<rect class="sv-soft" x="4" y="272" width="752" height="300" rx="2"/>
<text class="sv-t3" x="750" y="284" text-anchor="end">1959-1978 · DESARROLLISMO, REFORMISMOS Y CRISIS</text>
<rect class="sv-box" x="12" y="294" width="234" height="118" rx="2"/>
<text class="sv-t" x="129" y="318.8" text-anchor="middle">Crisis 1956-59 → Plan de</text>
<text class="sv-t" x="129" y="333.8" text-anchor="middle">Estabilización (1959)</text>
<text class="sv-t2" x="129" y="348.8" text-anchor="middle" style="font-size:12.5px">balanza de pagos, inflación,</text>
<text class="sv-t2" x="129" y="363.8" text-anchor="middle" style="font-size:12.5px">conflictividad, legitimidad</text>
<text class="sv-t2" x="129" y="378.8" text-anchor="middle" style="font-size:12.5px">turismo, remesas, inversión extranjera:</text>
<text class="sv-t2" x="129" y="393.8" text-anchor="middle" style="font-size:12.5px">periferia del centro imperialista europeo</text>
<rect class="sv-box" x="262" y="294" width="234" height="118" rx="2"/>
<text class="sv-t" x="379" y="318.8" text-anchor="middle">Ley de Convenios Colectivos</text>
<text class="sv-t" x="379" y="333.8" text-anchor="middle">(1958): negociación por motín</text>
<text class="sv-t2" x="379" y="348.8" text-anchor="middle" style="font-size:12.5px">deroga la prohibición de 1948; las</text>
<text class="sv-t2" x="379" y="363.8" text-anchor="middle" style="font-size:12.5px">luchas obreras fuerzan pactos; elementos</text>
<text class="sv-t2" x="379" y="378.8" text-anchor="middle" style="font-size:12.5px">keynesiano-fordistas; fracasa en los 70</text>
<text class="sv-t2" x="379" y="393.8" text-anchor="middle" style="font-size:12.5px">al romperse los topes salariales</text>
<rect class="sv-box" x="512" y="294" width="234" height="118" rx="2"/>
<text class="sv-t" x="629" y="318.8" text-anchor="middle">«Estado fuerte»: constitución</text>
<text class="sv-t" x="629" y="333.8" text-anchor="middle">económica refundada 1958-63</text>
<text class="sv-t2" x="629" y="348.8" text-anchor="middle" style="font-size:12.5px">Convenios, Plan de Estabilización,</text>
<text class="sv-t2" x="629" y="363.8" text-anchor="middle" style="font-size:12.5px">Seguridad Social; vigila lo social</text>
<text class="sv-t2" x="629" y="378.8" text-anchor="middle" style="font-size:12.5px">contra la proletarización (Bonefeld);</text>
<text class="sv-t2" x="629" y="393.8" text-anchor="middle" style="font-size:12.5px">el nuevo movimiento obrero la fuerza</text>
<line class="sv-line" x1="246" y1="353" x2="262" y2="353" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="496" y1="353" x2="512" y2="353" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line" d="M662 248 V265 H129 V294" marker-end="url(#nc-n2a1-arrow)"/>
<rect class="sv-box" x="12" y="438" width="234" height="118" rx="2"/>
<text class="sv-t" x="129" y="462.8" text-anchor="middle">Reformismo falangista</text>
<text class="sv-t2" x="129" y="477.8" text-anchor="middle" style="font-size:12.5px">OSE, elecciones sindicales (Solís,</text>
<text class="sv-t2" x="129" y="492.8" text-anchor="middle" style="font-size:12.5px">Fraga): integrar al movimiento</text>
<text class="sv-t2" x="129" y="507.8" text-anchor="middle" style="font-size:12.5px">obrero; cauce corporativista</text>
<text class="sv-t2" x="129" y="522.8" text-anchor="middle" style="font-size:12.5px">que pervive hoy; ganado en 1966,</text>
<text class="sv-t2" x="129" y="537.8" text-anchor="middle" style="font-size:12.5px">perdido en 1968</text>
<rect class="sv-box" x="262" y="438" width="234" height="118" rx="2"/>
<text class="sv-t" x="379" y="470.3" text-anchor="middle">Reformismo tecnócrata</text>
<text class="sv-t2" x="379" y="485.3" text-anchor="middle" style="font-size:12.5px">despolitización por el consumo</text>
<text class="sv-t2" x="379" y="500.3" text-anchor="middle" style="font-size:12.5px">y el bienestar material (vía</text>
<text class="sv-t2" x="379" y="515.3" text-anchor="middle" style="font-size:12.5px">ordoliberal: Hacienda, Industria,</text>
<text class="sv-t2" x="379" y="530.3" text-anchor="middle" style="font-size:12.5px">Opus Dei); fracasa con la crisis</text>
<rect class="sv-box-red" x="512" y="438" width="234" height="118" rx="2"/>
<text class="sv-tr" x="629" y="470.3" text-anchor="middle">Ofensiva obrera 1968-73</text>
<text class="sv-t2" x="629" y="485.3" text-anchor="middle" style="font-size:12.5px">«encuentro» obrero-dictadura (1968)</text>
<text class="sv-t2" x="629" y="500.3" text-anchor="middle" style="font-size:12.5px">+ crisis global de 1973: desborda</text>
<text class="sv-t2" x="629" y="515.3" text-anchor="middle" style="font-size:12.5px">los topes salariales; dictadura</text>
<text class="sv-t2" x="629" y="530.3" text-anchor="middle" style="font-size:12.5px">materialmente inviable (1970)</text>
<path class="sv-line" d="M629 412 V425 H129 V438" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line" d="M379 425 V438" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="246" y1="497" x2="262" y2="497" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="496" y1="497" x2="512" y2="497" marker-end="url(#nc-n2a1-arrow)"/>
<rect class="sv-box-ink" x="12" y="602" width="428" height="92" rx="2"/>
<text class="sv-tw" x="226" y="628.8" text-anchor="middle">Movimiento obrero: el «espejo» obsesivo del régimen</text>
<text class="sv-tw" x="226" y="643.8" text-anchor="middle" style="font-weight:400;font-size:12.5px">la negación obsesiva de la lucha de clases prueba su existencia real;</text>
<text class="sv-tw" x="226" y="658.8" text-anchor="middle" style="font-weight:400;font-size:12.5px">la relación capital-trabajo rige cada mutación: 1951, 1956,</text>
<text class="sv-tw" x="226" y="673.8" text-anchor="middle" style="font-weight:400;font-size:12.5px">Asturias 1962, 1968-73 (siempre reconocido como clase dominada)</text>
<rect class="sv-box-blue" x="456" y="602" width="292" height="92" rx="2"/>
<text class="sv-tb" x="602" y="628.8" text-anchor="middle">Régimen del 78: continuidad del Estado,</text>
<text class="sv-tb" x="602" y="643.8" text-anchor="middle">discontinuidad del régimen</text>
<text class="sv-t2" x="602" y="658.8" text-anchor="middle" style="font-size:12.5px">síntesis de oposición (PCE) y reformismo</text>
<text class="sv-t2" x="602" y="673.8" text-anchor="middle" style="font-size:12.5px">franquista: «la ruptura política pendiente»</text>
<path class="sv-line-red" d="M129 602 V556" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line-red" d="M379 602 V556" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line-red" d="M629 556 V587 H602 V602" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="12" y1="712" x2="38" y2="712" marker-end="url(#nc-n2a1-arrow)"/>
<text class="sv-t3" x="44" y="716">sucesión histórica</text>
<line class="sv-line-red" x1="177.283" y1="712" x2="203.283" y2="712" marker-end="url(#nc-n2a1-arrow)"/>
<text class="sv-t3" x="209.283" y="716">presión del movimiento obrero: fuerza la mutación del régimen</text>
</svg>
