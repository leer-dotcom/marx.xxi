<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doble línea temporal del socialismo alemán y ruso antes de 1914 con la combinación de medios legales e ilegales en cada coyuntura, matriz de posiciones ante la reacción de 1907 y la lección que el artículo extrae." viewBox="0 0 760 720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="161" rx="2"/>
<rect class="sv-soft" x="4" y="207" width="752" height="191" rx="2"/>
<rect class="sv-soft" x="4" y="428" width="752" height="258" rx="2"/>
<text class="sv-t3" x="10" y="27">ALEMANIA</text>
<rect class="sv-box" x="12" y="38" width="360" height="131" rx="2"/>
<text class="sv-t" x="192.0" y="56.0" text-anchor="middle">1878-90 · SPD ilegalizado (leyes antisocialistas)</text>
<text class="sv-t2" x="192.0" y="71.0" text-anchor="middle" style="font-size:12px">dirección moderada, sin plan: adhesión a la legalidad y prudencia;</text>
<text class="sv-t2" x="192.0" y="86.0" text-anchor="middle" style="font-size:12px">aun así, 300 publicaciones, periódicos y sindicatos disueltos</text>
<text class="sv-t2" x="192.0" y="101.0" text-anchor="middle" style="font-size:12px">fracción del Reichstag (comité ejecutivo de facto, por inmunidad)</text>
<text class="sv-t2" x="192.0" y="116.0" text-anchor="middle" style="font-size:12px">+ Sozialdemokrat clandestino (Zurich, 1879: educador y organizador</text>
<text class="sv-t2" x="192.0" y="131.0" text-anchor="middle" style="font-size:12px">colectivo) → 1890: 1,5 millones de votos, «época heroica»</text>
<text class="sv-t2" x="192.0" y="146.0" text-anchor="middle" style="font-size:12px">lección: la política comunista es por definición ilegal; el aparato</text>
<text class="sv-t2" x="192.0" y="161.0" text-anchor="middle" style="font-size:12px">técnico es su base material</text>
<rect class="sv-box-red" x="388" y="38" width="360" height="131" rx="2"/>
<text class="sv-tr" x="568.0" y="63.5" text-anchor="middle">1914 · El SPD vota los créditos</text>
<text class="sv-t2" x="568.0" y="78.5" text-anchor="middle" style="font-size:12px">1 millón de militantes, 2,5 millones de sindicados: la lenta</text>
<text class="sv-t2" x="568.0" y="93.5" text-anchor="middle" style="font-size:12px">acumulación legal de Erfurt convertida en dogma; miedo a la</text>
<text class="sv-t2" x="568.0" y="108.5" text-anchor="middle" style="font-size:12px">ilegalización → créditos de guerra y tregua interna</text>
<text class="sv-t2" x="568.0" y="123.5" text-anchor="middle" style="font-size:12px">legalismo = oportunismo (colaboración de clases); socialchovinismo</text>
<text class="sv-t2" x="568.0" y="138.5" text-anchor="middle" style="font-size:12px">y legalismo, dos caras; el aparato legal como fin en sí mismo</text>
<text class="sv-t2" x="568.0" y="153.5" text-anchor="middle" style="font-size:12px">(inversión de medios y fines)</text>
<text class="sv-t3" x="10" y="218">RUSIA</text>
<rect class="sv-box" x="12" y="229" width="172" height="161" rx="2"/>
<text class="sv-t" x="98.0" y="247.0" text-anchor="middle">1900-05 · Iskra</text>
<text class="sv-t2" x="98.0" y="262.0" text-anchor="middle" style="font-size:12px">modelo alemán: periódico que</text>
<text class="sv-t2" x="98.0" y="277.0" text-anchor="middle" style="font-size:12px">organiza una red clandestina</text>
<text class="sv-t2" x="98.0" y="292.0" text-anchor="middle" style="font-size:12px">centralizada (base del POSDR)</text>
<text class="sv-t2" x="98.0" y="307.0" text-anchor="middle" style="font-size:12px">revolucionarios profesionales;</text>
<text class="sv-t2" x="98.0" y="322.0" text-anchor="middle" style="font-size:12px">konspiratsiia: «el fino arte</text>
<text class="sv-t2" x="98.0" y="337.0" text-anchor="middle" style="font-size:12px">de no ser arrestado» (Lih)</text>
<text class="sv-t2" x="98.0" y="352.0" text-anchor="middle" style="font-size:12px">adaptación a la represión, no</text>
<text class="sv-t2" x="98.0" y="367.0" text-anchor="middle" style="font-size:12px">modelo atemporal; contra el</text>
<text class="sv-t2" x="98.0" y="382.0" text-anchor="middle" style="font-size:12px">aventurerismo narodniki</text>
<rect class="sv-box" x="200" y="229" width="172" height="161" rx="2"/>
<text class="sv-t" x="286.0" y="254.5" text-anchor="middle">1905-06 · Abrir el partido</text>
<text class="sv-t2" x="286.0" y="269.5" text-anchor="middle" style="font-size:12px">Domingo Sangriento; Lenin</text>
<text class="sv-t2" x="286.0" y="284.5" text-anchor="middle" style="font-size:12px">contra los bolcheviques</text>
<text class="sv-t2" x="286.0" y="299.5" text-anchor="middle" style="font-size:12px">«formalistas»: principio</text>
<text class="sv-t2" x="286.0" y="314.5" text-anchor="middle" style="font-size:12px">electivo, sindicatos legales,</text>
<text class="sv-t2" x="286.0" y="329.5" text-anchor="middle" style="font-size:12px">sóviets, «armar al pueblo»</text>
<text class="sv-t2" x="286.0" y="344.5" text-anchor="middle" style="font-size:12px">tras la derrota de Moscú:</text>
<text class="sv-t2" x="286.0" y="359.5" text-anchor="middle" style="font-size:12px">contra el boicot, la Duma</text>
<text class="sv-t2" x="286.0" y="374.5" text-anchor="middle" style="font-size:12px">como tribuna (reflujo)</text>
<rect class="sv-box" x="388" y="229" width="172" height="161" rx="2"/>
<text class="sv-t" x="474.0" y="254.5" text-anchor="middle">1907-12 · Reacción</text>
<text class="sv-t2" x="474.0" y="269.5" text-anchor="middle" style="font-size:12px">de 150.000 a unos 10.000</text>
<text class="sv-t2" x="474.0" y="284.5" text-anchor="middle" style="font-size:12px">militantes</text>
<text class="sv-t2" x="474.0" y="299.5" text-anchor="middle" style="font-size:12px">núcleo ilegal + Duma:</text>
<text class="sv-t2" x="474.0" y="314.5" text-anchor="middle" style="font-size:12px">«hablar alemán» (avanzar</text>
<text class="sv-t2" x="474.0" y="329.5" text-anchor="middle" style="font-size:12px">lentamente), ya no «hablar</text>
<text class="sv-t2" x="474.0" y="344.5" text-anchor="middle" style="font-size:12px">francés»</text>
<text class="sv-t2" x="474.0" y="359.5" text-anchor="middle" style="font-size:12px">una minoría de cuadros</text>
<text class="sv-t2" x="474.0" y="374.5" text-anchor="middle" style="font-size:12px">firmes mantiene el partido</text>
<rect class="sv-box-blue" x="576" y="229" width="172" height="161" rx="2"/>
<text class="sv-tb" x="662.0" y="254.5" text-anchor="middle">1914 · POSDR ilegal</text>
<text class="sv-t2" x="662.0" y="269.5" text-anchor="middle" style="font-size:12px">cumple su deber</text>
<text class="sv-t2" x="662.0" y="284.5" text-anchor="middle" style="font-size:12px">internacionalista</text>
<text class="sv-t2" x="662.0" y="299.5" text-anchor="middle" style="font-size:12px">combinó medios legales e</text>
<text class="sv-t2" x="662.0" y="314.5" text-anchor="middle" style="font-size:12px">ilegales y rompió con el</text>
<text class="sv-t2" x="662.0" y="329.5" text-anchor="middle" style="font-size:12px">oportunismo</text>
<text class="sv-t2" x="662.0" y="344.5" text-anchor="middle" style="font-size:12px">«hay parlamentarismo y</text>
<text class="sv-t2" x="662.0" y="359.5" text-anchor="middle" style="font-size:12px">parlamentarismo»: sillones</text>
<text class="sv-t2" x="662.0" y="374.5" text-anchor="middle" style="font-size:12px">ministeriales o cárcel</text>
<line class="sv-line" x1="184" y1="309.5" x2="200" y2="309.5" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="372" y1="309.5" x2="388" y2="309.5" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="560" y1="309.5" x2="576" y2="309.5" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="98" y1="169" x2="98" y2="229" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="106" y="203.0">modelo</text>
<line class="sv-line-dash" x1="662" y1="169" x2="662" y2="229" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="670" y="203.0">contraste</text>
<text class="sv-t3" x="10" y="439">POSICIONES ANTE LA REACCIÓN DE 1907 (USO DE MEDIOS LEGALES E ILEGALES)</text>
<rect class="sv-box-gold" x="12" y="450" width="172" height="101" rx="2"/>
<text class="sv-tg" x="98.0" y="468.0" text-anchor="middle">Liquidadores: sólo</text>
<text class="sv-tg" x="98.0" y="483.0" text-anchor="middle">legal</text>
<text class="sv-t2" x="98.0" y="498.0" text-anchor="middle" style="font-size:12px">Martov, Dan</text>
<text class="sv-t2" x="98.0" y="513.0" text-anchor="middle" style="font-size:12px">volcar todo en las</text>
<text class="sv-t2" x="98.0" y="528.0" text-anchor="middle" style="font-size:12px">organizaciones legales:</text>
<text class="sv-t2" x="98.0" y="543.0" text-anchor="middle" style="font-size:12px">liquidan el partido ilegal</text>
<rect class="sv-box-gold" x="200" y="450" width="172" height="101" rx="2"/>
<text class="sv-tg" x="286.0" y="468.0" text-anchor="middle">Otzovistas: sólo</text>
<text class="sv-tg" x="286.0" y="483.0" text-anchor="middle">ilegal</text>
<text class="sv-t2" x="286.0" y="498.0" text-anchor="middle" style="font-size:12px">bolcheviques de izquierda:</text>
<text class="sv-t2" x="286.0" y="513.0" text-anchor="middle" style="font-size:12px">boicot a la Duma,</text>
<text class="sv-t2" x="286.0" y="528.0" text-anchor="middle" style="font-size:12px">guerrilla; «liquidacionismo</text>
<text class="sv-t2" x="286.0" y="543.0" text-anchor="middle" style="font-size:12px">de izquierda», sectarismo</text>
<rect class="sv-box-gold" x="388" y="450" width="172" height="101" rx="2"/>
<text class="sv-tg" x="474.0" y="468.0" text-anchor="middle">Conciliadores:</text>
<text class="sv-tg" x="474.0" y="483.0" text-anchor="middle">unidad sin</text>
<text class="sv-tg" x="474.0" y="498.0" text-anchor="middle">expulsión</text>
<text class="sv-t2" x="474.0" y="513.0" text-anchor="middle" style="font-size:12px">Plejánov, Trotsky</text>
<text class="sv-t2" x="474.0" y="528.0" text-anchor="middle" style="font-size:12px">critican el liquidacionismo</text>
<text class="sv-t2" x="474.0" y="543.0" text-anchor="middle" style="font-size:12px">pero rechazan expulsar</text>
<rect class="sv-box-red" x="576" y="450" width="172" height="131" rx="2"/>
<text class="sv-tr" x="662.0" y="468.0" text-anchor="middle">Lenin: combinación</text>
<text class="sv-tr" x="662.0" y="483.0" text-anchor="middle">metódica</text>
<text class="sv-t2" x="662.0" y="498.0" text-anchor="middle" style="font-size:12px">contra el</text>
<text class="sv-t2" x="662.0" y="513.0" text-anchor="middle" style="font-size:12px">liquidacionismo «de</text>
<text class="sv-t2" x="662.0" y="528.0" text-anchor="middle" style="font-size:12px">ambos matices»: núcleo</text>
<text class="sv-t2" x="662.0" y="543.0" text-anchor="middle" style="font-size:12px">ilegal sin renunciar a la</text>
<text class="sv-t2" x="662.0" y="558.0" text-anchor="middle" style="font-size:12px">Duma; expulsar a los</text>
<text class="sv-t2" x="662.0" y="573.0" text-anchor="middle" style="font-size:12px">liquidadores</text>
<rect class="sv-box-ink" x="12" y="607" width="736" height="71" rx="2"/>
<text class="sv-tw" x="380.0" y="625.0" text-anchor="middle">Lección: subordinar los medios a la estrategia</text>
<text class="sv-tw" x="380.0" y="640.0" text-anchor="middle" style="font-size:12px;font-weight:400">preservar la independencia política del proletariado</text>
<text class="sv-tw" x="380.0" y="655.0" text-anchor="middle" style="font-size:12px;font-weight:400">no optar en abstracto por legalidad o ilegalidad: ni culto a la legalidad (oportunismo) ni rechazo abstracto de los medios</text>
<text class="sv-tw" x="380.0" y="670.0" text-anchor="middle" style="font-size:12px;font-weight:400">legales; construir en cada contexto formas de organización y lucha que avancen hacia la revolución</text>
<line class="sv-line" x1="662.0" y1="581" x2="662.0" y2="607" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="12" y="704">FLECHAS: SUCESIÓN TEMPORAL · «MODELO»: INFLUENCIA DIRECTA · DISCONTINUA: CONTRASTE ENTRE AMBOS PARTIDOS EN 1914</text>
</svg>
