<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos brazos del control social, coacción y consenso, que parten del Estado en crisis y la población sobrante, confluyen en la delincuencia como mercancía y motor de control (Marx), y debajo la respuesta comunista que el artículo propone como hipótesis." viewBox="0 0 760 771" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="113" width="512" height="351" rx="2"/>
<rect class="sv-soft" x="522" y="113" width="234" height="351" rx="2"/>
<rect class="sv-soft" x="4" y="574" width="752" height="163" rx="2"/>
<rect class="sv-box-ink" x="110" y="14" width="540" height="71" rx="2"/>
<text class="sv-tw" x="380.0" y="32.0" text-anchor="middle">Estado capitalista en crisis → población sobrante</text>
<text class="sv-tw" x="380.0" y="47.0" text-anchor="middle" style="font-size:12px;font-weight:400">no la población pobre sin más: la que el mercado laboral no puede absorber de forma</text>
<text class="sv-tw" x="380.0" y="62.0" text-anchor="middle" style="font-size:12px;font-weight:400">estable (proletarización global, empleo precario, paro, economía informal, trapicheo)</text>
<text class="sv-tw" x="380.0" y="77.0" text-anchor="middle" style="font-size:12px;font-weight:400">fin del pacto social (salarios, bienestar, movilidad): la coacción pasa al primer plano</text>
<rect class="sv-box-red" x="12" y="135" width="244" height="176" rx="2"/>
<text class="sv-tr" x="134.0" y="153.0" text-anchor="middle">Populismo punitivo</text>
<text class="sv-t2" x="134.0" y="168.0" text-anchor="middle" style="font-size:12px">criminalizar pobreza y protesta en lugar</text>
<text class="sv-t2" x="134.0" y="183.0" text-anchor="middle" style="font-size:12px">de integrar como en los «años de oro»</text>
<text class="sv-t2" x="134.0" y="198.0" text-anchor="middle" style="font-size:12px">el partido del orden: ultraderecha (trinomio</text>
<text class="sv-t2" x="134.0" y="213.0" text-anchor="middle" style="font-size:12px">inmigración/inseguridad/terrorismo),</text>
<text class="sv-t2" x="134.0" y="228.0" text-anchor="middle" style="font-size:12px">izquierda progresista (policías de</text>
<text class="sv-t2" x="134.0" y="243.0" text-anchor="middle" style="font-size:12px">proximidad), socialdemocracia que compra</text>
<text class="sv-t2" x="134.0" y="258.0" text-anchor="middle" style="font-size:12px">el discurso (Rufián, Otegui, Delgado:</text>
<text class="sv-t2" x="134.0" y="273.0" text-anchor="middle" style="font-size:12px">la seguridad como «derecho»)</text>
<text class="sv-t2" x="134.0" y="288.0" text-anchor="middle" style="font-size:12px">límites autoritarios: redadas de Trump;</text>
<text class="sv-t2" x="134.0" y="303.0" text-anchor="middle" style="font-size:12px">Bukele, 90.000 presos sin juicio</text>
<rect class="sv-box-red" x="268" y="135" width="244" height="176" rx="2"/>
<text class="sv-tr" x="390.0" y="183.0" text-anchor="middle">Securitización del conflicto social</text>
<text class="sv-t2" x="390.0" y="198.0" text-anchor="middle" style="font-size:12px">los problemas sociales se reinterpretan como</text>
<text class="sv-t2" x="390.0" y="213.0" text-anchor="middle" style="font-size:12px">problemas de seguridad: criminalización de la</text>
<text class="sv-t2" x="390.0" y="228.0" text-anchor="middle" style="font-size:12px">okupación, CIE para migrantes, protesta</text>
<text class="sv-t2" x="390.0" y="243.0" text-anchor="middle" style="font-size:12px">redefinida como amenaza (Palestine Action,</text>
<text class="sv-t2" x="390.0" y="258.0" text-anchor="middle" style="font-size:12px">movilizaciones contra el equipo israelí),</text>
<text class="sv-t2" x="390.0" y="273.0" text-anchor="middle" style="font-size:12px">infiltración policial en los movimientos</text>
<rect class="sv-box-red" x="12" y="323" width="244" height="131" rx="2"/>
<text class="sv-tr" x="134.0" y="341.0" text-anchor="middle">Parapolicía: desokupadoras, fascistas</text>
<text class="sv-tr" x="134.0" y="356.0" text-anchor="middle">callejeros</text>
<text class="sv-t2" x="134.0" y="371.0" text-anchor="middle" style="font-size:12px">los «monstruos» donde el Estado no puede</text>
<text class="sv-t2" x="134.0" y="386.0" text-anchor="middle" style="font-size:12px">actuar abiertamente: violencia externalizada</text>
<text class="sv-t2" x="134.0" y="401.0" text-anchor="middle" style="font-size:12px">y mercantilizada; el Estado se presenta como</text>
<text class="sv-t2" x="134.0" y="416.0" text-anchor="middle" style="font-size:12px">salvación y refuerza la represión («delito</text>
<text class="sv-t2" x="134.0" y="431.0" text-anchor="middle" style="font-size:12px">de odio», usado contra comunistas y</text>
<text class="sv-t2" x="134.0" y="446.0" text-anchor="middle" style="font-size:12px">antifascistas)</text>
<rect class="sv-box-red" x="268" y="323" width="244" height="131" rx="2"/>
<text class="sv-tr" x="390.0" y="348.5" text-anchor="middle">El migrante como enemigo interior</text>
<text class="sv-t2" x="390.0" y="363.5" text-anchor="middle" style="font-size:12px">necesario como mano de obra, no integrable:</text>
<text class="sv-t2" x="390.0" y="378.5" text-anchor="middle" style="font-size:12px">categorías de guerra hacia dentro («invasor»,</text>
<text class="sv-t2" x="390.0" y="393.5" text-anchor="middle" style="font-size:12px">ley de 1798 invocada por Trump)</text>
<text class="sv-t2" x="390.0" y="408.5" text-anchor="middle" style="font-size:12px">los datos lo desmienten: del 0,5-1 % al 14 % de</text>
<text class="sv-t2" x="390.0" y="423.5" text-anchor="middle" style="font-size:12px">población migrante sin más delincuencia; a</text>
<text class="sv-t2" x="390.0" y="438.5" text-anchor="middle" style="font-size:12px">mayor miseria, mayor delincuencia</text>
<rect class="sv-box-blue" x="530" y="135" width="218" height="319" rx="2"/>
<text class="sv-tb" x="639.0" y="232.0" text-anchor="middle">Trabajo social, RMI, escuela</text>
<text class="sv-tb" x="639.0" y="247.0" text-anchor="middle">como gestión del riesgo</text>
<text class="sv-t2" x="639.0" y="262.0" text-anchor="middle" style="font-size:12px">de principios universalistas a</text>
<text class="sv-t2" x="639.0" y="277.0" text-anchor="middle" style="font-size:12px">lógicas moralizantes: quién «merece»</text>
<text class="sv-t2" x="639.0" y="292.0" text-anchor="middle" style="font-size:12px">la ayuda, sanciones graduadas como</text>
<text class="sv-t2" x="639.0" y="307.0" text-anchor="middle" style="font-size:12px">en el derecho penal; «educador de</text>
<text class="sv-t2" x="639.0" y="322.0" text-anchor="middle" style="font-size:12px">calle» en barrios «problemáticos»;</text>
<text class="sv-t2" x="639.0" y="337.0" text-anchor="middle" style="font-size:12px">policía en las escuelas</text>
<text class="sv-t2" x="639.0" y="352.0" text-anchor="middle" style="font-size:12px">policialización del trabajo social,</text>
<text class="sv-t2" x="639.0" y="367.0" text-anchor="middle" style="font-size:12px">trabajosocialización de la policía</text>
<text class="sv-t3" x="12" y="125">COACCIÓN</text>
<text class="sv-t3" x="530" y="125">CONSENSO</text>
<path class="sv-line" d="M380 85 V99 H130 V135" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M380 85 V99 H390 V135" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M380 85 V99 H639 V135" marker-end="url(#nc-n4a2-arrow)"/>
<line class="sv-line" x1="130" y1="311" x2="130" y2="323" marker-end="url(#nc-n4a2-arrow)"/>
<line class="sv-line" x1="390" y1="311" x2="390" y2="323" marker-end="url(#nc-n4a2-arrow)"/>
<rect class="sv-box" x="12" y="488" width="736" height="56" rx="2"/>
<text class="sv-t" x="380.0" y="506.0" text-anchor="middle">Delincuencia como mercancía y motor de control: funcional al orden burgués (Marx, Elogio del crimen)</text>
<text class="sv-t2" x="380.0" y="521.0" text-anchor="middle" style="font-size:12px">produce derecho penal, policía y justicia; hoy también titulares, seguridad privada, cárceles, muros, cámaras y empleo público</text>
<text class="sv-t2" x="380.0" y="536.0" text-anchor="middle" style="font-size:12px">producida, gestionada y capitalizada: «el delincuente transforma el miedo en motor económico»; palo y zanahoria, un mismo entramado</text>
<path class="sv-line" d="M130 454 V468 H250 V488" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M390 454 V468 H250 V488" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M639 454 V468 H520 V488" marker-end="url(#nc-n4a2-arrow)"/>
<text class="sv-t3" x="12" y="586">RESPUESTA COMUNISTA (HIPÓTESIS)</text>
<rect class="sv-box-green" x="12" y="596" width="236" height="131" rx="2"/>
<text class="sv-tgr" x="130.0" y="614.0" text-anchor="middle">Organización en barrios y</text>
<text class="sv-tgr" x="130.0" y="629.0" text-anchor="middle">centros de trabajo</text>
<text class="sv-t2" x="130.0" y="644.0" text-anchor="middle" style="font-size:12px">extender la organización a los distritos</text>
<text class="sv-t2" x="130.0" y="659.0" text-anchor="middle" style="font-size:12px">proletarizados; el debate: paro, vivienda,</text>
<text class="sv-t2" x="130.0" y="674.0" text-anchor="middle" style="font-size:12px">acoso policial (CIS 2009: paro 78,9 %,</text>
<text class="sv-t2" x="130.0" y="689.0" text-anchor="middle" style="font-size:12px">inseguridad 11,8 %); señalar las causas</text>
<text class="sv-t2" x="130.0" y="704.0" text-anchor="middle" style="font-size:12px">estructurales: «las cárceles están llenas</text>
<text class="sv-t2" x="130.0" y="719.0" text-anchor="middle" style="font-size:12px">de pobres»</text>
<rect class="sv-box-green" x="256" y="596" width="236" height="131" rx="2"/>
<text class="sv-tgr" x="374.0" y="621.5" text-anchor="middle">Unidad con el</text>
<text class="sv-tgr" x="374.0" y="636.5" text-anchor="middle">proletariado migrante</text>
<text class="sv-t2" x="374.0" y="651.5" text-anchor="middle" style="font-size:12px">«victoria o derrota»: parte constitutiva e</text>
<text class="sv-t2" x="374.0" y="666.5" text-anchor="middle" style="font-size:12px">indisociable del proletariado revolucionario;</text>
<text class="sv-t2" x="374.0" y="681.5" text-anchor="middle" style="font-size:12px">las divisiones nativo/migrante son una</text>
<text class="sv-t2" x="374.0" y="696.5" text-anchor="middle" style="font-size:12px">herramienta del capital; luchas económicas</text>
<text class="sv-t2" x="374.0" y="711.5" text-anchor="middle" style="font-size:12px">en sectores migrantes</text>
<rect class="sv-box-green" x="500" y="596" width="248" height="131" rx="2"/>
<text class="sv-tgr" x="624.0" y="621.5" text-anchor="middle">Gimnasios populares, gradas,</text>
<text class="sv-tgr" x="624.0" y="636.5" text-anchor="middle">autodefensa → nueva</text>
<text class="sv-tgr" x="624.0" y="651.5" text-anchor="middle">normatividad socialista</text>
<text class="sv-t2" x="624.0" y="666.5" text-anchor="middle" style="font-size:12px">espacios de socialización y politización;</text>
<text class="sv-t2" x="624.0" y="681.5" text-anchor="middle" style="font-size:12px">expropiar a los ricos, no robar entre</text>
<text class="sv-t2" x="624.0" y="696.5" text-anchor="middle" style="font-size:12px">vecinos; no tolerar violencia sexual,</text>
<text class="sv-t2" x="624.0" y="711.5" text-anchor="middle" style="font-size:12px">fascista, étnica ni policial</text>
<path class="sv-line-red" d="M380 544 V566 H242 V596" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line-red" d="M380 544 V566 H374 V596" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line-red" d="M380 544 V566 H624 V596" marker-end="url(#nc-n4a2-arrow)"/>
<text class="sv-t3" x="12" y="755">FLECHA GRIS: CADENA DEL CONTROL SOCIAL · FLECHA DE COLOR: RESPUESTA QUE EL ARTÍCULO PROPONE FRENTE A ELLA</text>
</svg>
