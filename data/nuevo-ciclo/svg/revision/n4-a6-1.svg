<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 858" role="img" aria-label="Cadena de la crisis de hegemonía estadounidense (Arrighi) a la dominación sin hegemonía del trumpismo, al fin del discurso del fanatismo y a la fascistización contemporánea, y bifurcación entre la izquierda conservadora del frente impopular y una política anticapitalista de masas con instituciones propias; al pie, trayectoria y método del entrevistado." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="16">LA CADENA: DE LA CRISIS DE HEGEMONÍA A LA FASCISTIZACIÓN</text>
<rect class="sv-box" x="12" y="22" width="736" height="80.0" rx="2"/>
<text class="sv-t" x="380" y="42.2" text-anchor="middle">Crisis de la hegemonía estadounidense (Arrighi, Adam Smith en Pekín)</text>
<text class="sv-t2" x="380" y="57.7" text-anchor="middle">Vietnam, «crisis señal» (aviso de finitud) → Irak, «crisis terminal»: declive inexorable, aunque de ritmo imprevisible</text>
<text class="sv-t2" x="380" y="73.2" text-anchor="middle">valor diagnóstico: el hegemón ya no tiene los medios (materiales, ideológicos) ni la voluntad de liderar un sistema</text>
<text class="sv-t2" x="380" y="88.7" text-anchor="middle">que beneficia también a los grupos dominantes y a sus socios menores; síntoma previo: el nacionalismo económico de Biden</text>
<line class="sv-line" x1="380" y1="102" x2="380" y2="128" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="118">el trumpismo lo asume abiertamente</text>
<rect class="sv-box" x="12" y="128.0" width="736" height="80.0" rx="2"/>
<text class="sv-t" x="380" y="148.2" text-anchor="middle">Dominación sin hegemonía (Guha, Arrighi): la supremacía transaccional del trumpismo</text>
<text class="sv-t2" x="380" y="163.7" text-anchor="middle">tras la ideología del imperialismo neoliberal (de Bush a Obama, en parte Biden): aceptación abierta de un orden que</text>
<text class="sv-t2" x="380" y="179.2" text-anchor="middle">se desea dominar pero no liderar, con nostalgia del imperialismo del siglo XIX (doctrina «Donroe», Estrategia de Seguridad 2025)</text>
<text class="sv-t2" x="380" y="194.7" text-anchor="middle">aranceles y Groenlandia contra los socios dóciles de Europa y la OTAN; guerra contra Irán y bloqueos del estrecho de Ormuz</text>
<line class="sv-line" x1="380" y1="208" x2="380" y2="234" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="224">otra señal del derrumbe de la hegemonía</text>
<rect class="sv-box" x="12" y="234.0" width="736" height="95.5" rx="2"/>
<text class="sv-t" x="380" y="254.2" text-anchor="middle">Fin del discurso del fanatismo: la «violenta incoherencia» como norma</text>
<text class="sv-t2" x="380" y="269.7" text-anchor="middle">la dicotomía razonable/fanático de la «guerra contra el terror» (Fanatismo) sobra: fuera del marco de «civilización»</text>
<text class="sv-t2" x="380" y="285.2" text-anchor="middle">y derecho internacional, en la celebración de la fuerza pura, ya no hace falta pintar al enemigo como fanático para exterminarlo</text>
<text class="sv-t2" x="380" y="300.7" text-anchor="middle">Trump oscila entre amenazar a Irán con un genocidio nuclear y elogiar a sus homólogos; la lógica mimética venía de antes:</text>
<text class="sv-t2" x="380" y="316.2" text-anchor="middle">el Kurtz de Apocalypse Now, Gaza como «aparcamiento» igual que antes Vietnam y Kampuchea</text>
<line class="sv-line" x1="380" y1="329.5" x2="380" y2="355.5" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="345.5">culto a la violencia → subjetividad fascista</text>
<rect class="sv-box-red" x="12" y="355.5" width="736" height="126.5" rx="2"/>
<text class="sv-tr" x="380" y="375.7" text-anchor="middle">Fascistización: el fascismo no existe a pesar de sus contradicciones, sino gracias a ellas</text>
<text class="sv-t2" x="380" y="391.2" text-anchor="middle">atractivo de una libertad para dominar, brutalizar y humillar; en una época mediatizada y con paramilitarismo débil,</text>
<text class="sv-t2" x="380" y="406.7" text-anchor="middle">se consume de forma vicaria o simbólica</text>
<text class="sv-t2" x="380" y="422.2" text-anchor="middle">el modelo no es el «totalitarismo» nazi sino el «relativismo» de Mussolini: ofrecer cosas distintas a públicos distintos;</text>
<text class="sv-t2" x="380" y="437.7" text-anchor="middle">modular el discurso para reclutar fracciones de clase (Poulantzas); eficacia funcional de lo irracional (David Edgar)</text>
<text class="sv-t2" x="380" y="453.2" text-anchor="middle">contradicciones productivas: estrategia hegemónica sui generis, viejo atractivo de masas + marketing microdirigido,</text>
<text class="sv-t2" x="380" y="468.7" text-anchor="middle">vigilancia algorítmica, silos discursivos</text>
<text class="sv-t3" x="388" y="498">DOS RESPUESTAS AL CAPITALISMO ABISMADO EN LA BARBARIE</text>
<line class="sv-line" x1="380" y1="466.5" x2="380" y2="510"/>
<path class="sv-line-dash" d="M380 510 H192 V522" marker-end="url(#nc-n4a6-arrow)"/>
<path class="sv-line-red" d="M380 510 H568 V522" marker-end="url(#nc-n4a6-arrow)"/>
<rect class="sv-box-gold" x="12" y="522" width="360" height="180.0" rx="2"/>
<text class="sv-tg" x="192" y="547.5" text-anchor="middle">Izquierda conservadora / «frente impopular»</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="561" text-anchor="middle">tras 2008 (Terms of Disorder, con Mandarini; dinámica, no juicio):</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="574.5" text-anchor="middle">horizonte de defender los restos de las conquistas del siglo XX,</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="588" text-anchor="middle">no un proyecto transformador; incluso la insurrección sin</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="601.5" text-anchor="middle">horizonte revolucionario: luchas de circulación (Clover) que</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="615" text-anchor="middle">responden al «abandono organizado» (Gilmore)</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="628.5" text-anchor="middle">frente impopular: registro electoral-defensivo, alianzas con</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="642" text-anchor="middle">liberales y conservadores que renuncian a los fines últimos</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="655.5" text-anchor="middle">colapso climático: conservar lo habitable exige expropiaciones</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="669" text-anchor="middle">a gran escala, ¿reforma o revolución? (NC: la distinción sigue</text>
<text class="sv-t2" style="font-size:11.5px" x="192" y="682.5" text-anchor="middle">plenamente vigente)</text>
<rect class="sv-box-green" x="388" y="522" width="360" height="180.0" rx="2"/>
<text class="sv-tgr" x="568" y="540.7" text-anchor="middle">Política anticapitalista igualitaria de masas</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="554.2" text-anchor="middle">guiada por ideas marxistas, sin exigir lealtad doctrinal</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="567.7" text-anchor="middle">requiere trabajo territorial, institucional y pedagógico</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="581.2" text-anchor="middle">que dote de solidez y arraigo al proyecto:</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="594.7" text-anchor="middle">(1) cambiar condiciones concretas, aunque parciales, para</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="608.2" text-anchor="middle">generar experiencias de poder popular efectivo</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="621.7" text-anchor="middle">(2) espacios e instituciones donde las personas se</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="635.2" text-anchor="middle">transformen a sí mismas y entre sí, a todas las escalas</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="648.7" text-anchor="middle">el imperativo gramsciano (educación, organización, poder</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="662.2" text-anchor="middle">social) permanece; sus condiciones han mutado: quedan</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="675.7" text-anchor="middle">sindicatos y movimientos estudiantiles, pero muchas</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="689.2" text-anchor="middle">«instituciones comunistas» aún están por inventarse</text>
<rect class="sv-soft" x="4" y="712" width="752" height="22" rx="2"/>
<line class="sv-line-dash" x1="18" y1="724" x2="48" y2="724"/>
<text class="sv-t3" x="54" y="727">respuesta existente: registro electoral-defensivo</text>
<line class="sv-line-red" x1="380" y1="724" x2="410" y2="724"/>
<text class="sv-t3" x="416" y="727">respuesta que propone Toscano</text>
<rect class="sv-soft" x="4" y="748" width="752" height="100" rx="2"/>
<text class="sv-t3" x="18" y="763">FUERA DE LA CADENA · TRAYECTORIA Y MÉTODO DEL ENTREVISTADO</text>
<text class="sv-t2" style="font-size:11.5px" x="18" y="783">Formación: simpatías de extrema izquierda desde niño (Moscú, exiliados chilenos, «OTAN NO»); marxismo sistemático sólo desde 2004,</text>
<text class="sv-t2" style="font-size:11.5px" x="18" y="797">en el consejo de Historical Materialism y enseñando sociología en Goldsmiths («David Harvey Studies»)</text>
<text class="sv-t2" style="font-size:11.5px" x="18" y="811">Warwick post-Land: vivero de energía maníaca ya sin sectarismo; Land, reaccionario desde siempre, nunca fue izquierdista (contra Miranda)</text>
<text class="sv-t2" style="font-size:11.5px" x="18" y="825">Método: el rodeo (le détour) por el archivo histórico y teórico, con una dimensión libidinal que protege del desánimo; Yarvin, Thiel o</text>
<text class="sv-t2" style="font-size:11.5px" x="18" y="839">Land no merecen análisis textual (calidad «vergonzosamente pobre»: no son Schmitt ni Gentile)</text>
</svg>
