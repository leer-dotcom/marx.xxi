<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El Estado dual trumpista: marco teórico (capitalista colectivo ideal, Estado de excepción), Estado normativo y Estado prerrogativo bajo un mismo techo, el bloque que lo sostiene, el límite de clase, la comparación con el caso nazi y los escenarios de fascistización." viewBox="0 0 760 716" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="12" y="12" width="736" height="70" rx="2"/>
<text class="sv-t3" x="380" y="27" text-anchor="middle">marco · teoría del estado capitalista</text>
<text class="sv-t2" style="font-size:12px" x="380" y="44" text-anchor="middle">Estado = «capitalista colectivo ideal» (Engels): orden en el caos de la competencia; acumulación, reproducción social, cohesión ideológica</text>
<text class="sv-t2" style="font-size:12px" x="380" y="59" text-anchor="middle">Estado de Derecho de posguerra = excepción «probablemente irrepetible», no tendencia inmanente del capitalismo</text>
<text class="sv-t2" style="font-size:12px" x="380" y="74" text-anchor="middle">Estado de excepción (Poulantzas) = suspensión permanente del Estado de Derecho en crisis orgánica: bonapartismo, dictadura militar, fascismo</text>
<rect class="sv-box-ink" x="12" y="96" width="736" height="62" rx="2"/>
<text class="sv-tw" x="380.0" y="118.0" text-anchor="middle">Estado dual trumpista (Fraenkel): Estado de excepción de facto sin partido-milicia</text>
<text class="sv-tw" style="font-size:12px;font-weight:400" x="380.0" y="133.0" text-anchor="middle">objetivo: frenar el declive hegemónico frente a China en un «juego de suma cero» marcado por la caída de la rentabilidad</text>
<text class="sv-tw" style="font-size:12px;font-weight:400" x="380.0" y="147.0" text-anchor="middle">dualidad prefigurada en el Estado liberal: esfera económica «neutral» / esfera política transformable</text>
<rect class="sv-box-blue" x="12" y="184" width="360" height="88" rx="2"/>
<text class="sv-tb" x="192.0" y="205.0" text-anchor="middle">Estado normativo</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="220.0" text-anchor="middle">derecho privado, contratos, competencia, fiscalidad,</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="234.0" text-anchor="middle">política económica, Reserva Federal: intocado</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="248.0" text-anchor="middle">garantiza la previsibilidad de los beneficios; «no puede</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="262.0" text-anchor="middle">ser suprimido sin dañar el poder de clase capitalista»</text>
<rect class="sv-box-red" x="388" y="184" width="360" height="88" rx="2"/>
<text class="sv-tr" x="568.0" y="205.0" text-anchor="middle">Estado prerrogativo</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="220.0" text-anchor="middle">ICE, deportaciones en caliente (Ley de Enemigos Extranjeros</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="234.0" text-anchor="middle">de 1798), ejecutivo unitario, Anexo F (de 4.000 a ~100.000</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="248.0" text-anchor="middle">cargos políticos), persecución de la izquierda, guerra sin Senado</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="262.0" text-anchor="middle">efecto real: dividir a la clase obrera y devaluar la fuerza de trabajo</text>
<rect class="sv-box" x="12" y="306" width="360" height="74" rx="2"/>
<text class="sv-t" x="192.0" y="327.0" text-anchor="middle">Bloque reaccionario</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="342.0" text-anchor="middle">gran capital fósil y tecnológico · MAGA y milicias</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="356.0" text-anchor="middle">(Proud Boys, Oath Keepers) · GOP · aparato cultural</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="370.0" text-anchor="middle">reedición del «compromiso autoritario» (Paxton)</text>
<rect class="sv-box-gold" x="388" y="306" width="360" height="74" rx="2"/>
<text class="sv-tg" x="568.0" y="327.0" text-anchor="middle">Límite de clase</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="342.0" text-anchor="middle">el gran capital frena la absorción de funciones (Fed</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="356.0" text-anchor="middle">«técnica e independiente»; deportaciones suspendidas por</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="370.0" text-anchor="middle">granjeros y hoteleros): el Estado sigue siendo dual</text>
<rect class="sv-box" x="12" y="414" width="360" height="102" rx="2"/>
<text class="sv-t" x="192.0" y="435.0" text-anchor="middle">Caso nazi: el partido-milicia conquista el Estado</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="450.0" text-anchor="middle">amenaza revolucionaria + Estado débil</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="464.0" text-anchor="middle">la burguesía «invita» al poder (Víctor Manuel III, Hindenburg)</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="478.0" text-anchor="middle">el partido (Gestapo, SS, SA) asume el Estado prerrogativo</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="492.0" text-anchor="middle">y conquista el normativo, salvo la política económica</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="506.0" text-anchor="middle">las SS: espacio donde la base nazi descarga su ira</text>
<rect class="sv-box" x="388" y="414" width="360" height="102" rx="2"/>
<text class="sv-t" x="568.0" y="435.0" text-anchor="middle">Caso trumpista: el Estado integra al movimiento</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="450.0" text-anchor="middle">ni amenaza revolucionaria ni Estado débil: dual, no (todavía) fascista</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="464.0" text-anchor="middle">lo despliega el propio Estado con sus aparatos, no MAGA ni el GOP</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="478.0" text-anchor="middle">el ICE (100.000 M$ en 2029, cuerpo paramilitar leal) es para</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="492.0" text-anchor="middle">la base MAGA lo que las SS para la base nazi; MAGA puede</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="506.0" text-anchor="middle">integrarse en él, pero integrarse no es conquistar</text>
<rect class="sv-box-gold" x="12" y="552" width="736" height="92" rx="2"/>
<text class="sv-tg" x="380.0" y="575.0" text-anchor="middle">Escenarios de fascistización: posible «conquista» del Estado</text>
<text class="sv-t2" style="font-size:12px" x="380.0" y="590.0" text-anchor="middle">conflicto federal-estados (Guardia Nacional en Los Ángeles) · aventurerismo bélico y división del Ejército ·</text>
<text class="sv-t2" style="font-size:12px" x="380.0" y="604.0" text-anchor="middle">Insurrection Act para evitar las midterms de noviembre de 2026 · propuesta de Bannon: el ICE rodea los colegios electorales</text>
<text class="sv-t2" style="font-size:12px" x="380.0" y="618.0" text-anchor="middle">fascistización ideológica y organizativa de MAGA y del GOP · activación de milicias leales a Trump</text>
<text class="sv-t2" style="font-size:12px" x="380.0" y="632.0" text-anchor="middle">«dictadura de la burguesía como último recurso» (Thalheimer) → urge una línea comunista contra la reacción y el fascismo</text>
<path class="sv-line" d="M380 158 V171 H192 V184" marker-end="url(#nc-n3a1-arrow)"/>
<path class="sv-line" d="M380 158 V171 H568 V184" marker-end="url(#nc-n3a1-arrow)"/>
<path class="sv-line" d="M192 306 V291 H568 V272" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="380" y="287" text-anchor="middle">alimenta</text>
<line class="sv-line-dash" x1="568" y1="306" x2="568" y2="272" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="596" y="287" text-anchor="middle">frena</text>
<path class="sv-line-dash" d="M568 516 V532 H380 V552" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="470" y="528" text-anchor="middle">pueden precipitar</text>
<text class="sv-t3" x="380" y="406" text-anchor="middle">comparación · quién ocupa el estado prerrogativo</text>
<rect class="sv-soft" x="12" y="664" width="736" height="40" rx="2"/>
<text class="sv-t3" x="28" y="680">leyenda</text>
<line class="sv-line" x1="100" y1="676" x2="140" y2="676" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t2" style="font-size:12px" x="148" y="680">despliegue / apoyo (lo que ya ocurre)</text>
<line class="sv-line-dash" x1="400" y1="676" x2="440" y2="676" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t2" style="font-size:12px" x="448" y="680">freno o evolución posible (contratendencia)</text>
<text class="sv-t2" style="font-size:11px" x="28" y="697">cuatro sectores del bloque colaboran «de forma incómoda pero eficaz»; el carácter dual es «un proceso en marcha, lejos de haberse completado»</text>
</svg>
