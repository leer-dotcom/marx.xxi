<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fines del proceso ejemplarizante; defensa de connivencia frente a defensa de ruptura comparadas en objetivo, destinatario, identidad del acusado, relación con el tribunal, lugar de los hechos y la política, y técnica; gradación de los efectos de la ruptura según la organización." viewBox="0 0 760 1017" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="822" width="752" height="161" rx="2"/>
<rect class="sv-soft" x="4" y="701" width="752" height="101" rx="2"/>
<rect class="sv-soft" x="4" y="564" width="752" height="131" rx="2"/>
<rect class="sv-soft" x="4" y="427" width="752" height="131" rx="2"/>
<rect class="sv-soft" x="4" y="335" width="752" height="86" rx="2"/>
<rect class="sv-soft" x="4" y="258" width="752" height="71" rx="2"/>
<rect class="sv-soft" x="4" y="166" width="752" height="86" rx="2"/>
<rect class="sv-box-ink" x="12" y="14" width="736" height="56" rx="2"/>
<text class="sv-tw" x="380.0" y="32.0" text-anchor="middle">El proceso ejemplarizante: lo que busca la burguesía</text>
<text class="sv-tw" x="380.0" y="47.0" text-anchor="middle" style="font-size:12px;font-weight:400">legitimar el terror dándole respaldo legal · escenificar el descabezamiento del movimiento · exhibir el poder del Estado</text>
<text class="sv-tw" x="380.0" y="62.0" text-anchor="middle" style="font-size:12px;font-weight:400">sobre la vida y la libertad de los revolucionarios · y, sobre todo, el arrepentimiento del acusado (que no está en sus manos)</text>
<rect class="sv-box-blue" x="12" y="98" width="360" height="56" rx="2"/>
<text class="sv-tb" x="192.0" y="116.0" text-anchor="middle">Defensa de connivencia</text>
<text class="sv-t2" x="192.0" y="131.0" text-anchor="middle" style="font-size:12px">«mortífera» (Vergès): busca excusas, se refugia en lo jurídico</text>
<text class="sv-t2" x="192.0" y="146.0" text-anchor="middle" style="font-size:12px">o se desentiende de los hechos</text>
<rect class="sv-box-red" x="388" y="98" width="360" height="56" rx="2"/>
<text class="sv-tr" x="568.0" y="116.0" text-anchor="middle">Defensa de ruptura</text>
<text class="sv-t2" x="568.0" y="131.0" text-anchor="middle" style="font-size:12px">Bebel y Liebknecht 1872, Varlin 1868, Leviné 1919</text>
<text class="sv-t2" x="568.0" y="146.0" text-anchor="middle" style="font-size:12px">nombrada por Vergès en 1957 (defensas del FLN argelino)</text>
<text class="sv-t3" x="10" y="177">OBJETIVO</text>
<rect class="sv-box" x="12" y="188" width="360" height="56" rx="2"/>
<text class="sv-t" x="192.0" y="213.5" text-anchor="middle">Absolución personal; aceptar la moral burguesa</text>
<text class="sv-t2" x="192.0" y="228.5" text-anchor="middle" style="font-size:12px">someterse por entero al marco legal capitalista</text>
<rect class="sv-box" x="388" y="188" width="360" height="56" rx="2"/>
<text class="sv-t" x="568.0" y="206.0" text-anchor="middle">Convertir al acusado en acusador; afirmar el derecho a</text>
<text class="sv-t" x="568.0" y="221.0" text-anchor="middle">la revolución</text>
<text class="sv-t2" x="568.0" y="236.0" text-anchor="middle" style="font-size:12px">impugnar el orden burgués en su totalidad; el proceso como tribuna</text>
<text class="sv-t3" x="10" y="269">DESTINATARIO</text>
<rect class="sv-box" x="12" y="280" width="360" height="41" rx="2"/>
<text class="sv-t" x="192.0" y="298.0" text-anchor="middle">El tribunal</text>
<text class="sv-t2" x="192.0" y="313.0" text-anchor="middle" style="font-size:12px">y la propia liberación</text>
<rect class="sv-box" x="388" y="280" width="360" height="41" rx="2"/>
<text class="sv-t" x="568.0" y="298.0" text-anchor="middle">El partido y las masas que esperan fuera</text>
<text class="sv-t2" x="568.0" y="313.0" text-anchor="middle" style="font-size:12px">el aviso a navegantes de la burguesía se vuelve altavoz socialista</text>
<text class="sv-t3" x="10" y="346">IDENTIDAD DEL ACUSADO</text>
<rect class="sv-box" x="12" y="357" width="360" height="56" rx="2"/>
<text class="sv-t" x="192.0" y="375.0" text-anchor="middle">Acepta la etiqueta de criminal o se lava las manos</text>
<text class="sv-t2" x="192.0" y="390.0" text-anchor="middle" style="font-size:12px">el «sálvese quien pueda» destruye la confianza de quienes</text>
<text class="sv-t2" x="192.0" y="405.0" text-anchor="middle" style="font-size:12px">arriesgan fuera</text>
<rect class="sv-box" x="388" y="357" width="360" height="56" rx="2"/>
<text class="sv-t" x="568.0" y="375.0" text-anchor="middle">Luchador por un ideal, no un criminal</text>
<text class="sv-t2" x="568.0" y="390.0" text-anchor="middle" style="font-size:12px">«Soldado de la Revolución» (Liebknecht); dos partidos, el del orden</text>
<text class="sv-t2" x="568.0" y="405.0" text-anchor="middle" style="font-size:12px">y el socialista (Varlin); ángulos opuestos a la Fiscalía (Leviné)</text>
<text class="sv-t3" x="10" y="438">TRIBUNAL</text>
<rect class="sv-box" x="12" y="449" width="360" height="101" rx="2"/>
<text class="sv-t" x="192.0" y="497.0" text-anchor="middle">Reconocido como juez</text>
<text class="sv-t2" x="192.0" y="512.0" text-anchor="middle" style="font-size:12px">interlocutor del que se espera una condena más indulgente</text>
<rect class="sv-box" x="388" y="449" width="360" height="101" rx="2"/>
<text class="sv-t" x="568.0" y="467.0" text-anchor="middle">Desautorizado como impostor; la «alta traición» es una</text>
<text class="sv-t" x="568.0" y="482.0" text-anchor="middle">categoría política</text>
<text class="sv-t2" x="568.0" y="497.0" text-anchor="middle" style="font-size:12px">la persecución, termómetro del buen camino (Liebknecht); el juicio,</text>
<text class="sv-t2" x="568.0" y="512.0" text-anchor="middle" style="font-size:12px">resultado de una situación política (Leviné); la alta traición sólo</text>
<text class="sv-t2" x="568.0" y="527.0" text-anchor="middle" style="font-size:12px">se juzga cuando la revolución fracasa (Leviné, Castro sobre Batista,</text>
<text class="sv-t2" x="568.0" y="542.0" text-anchor="middle" style="font-size:12px">consejos de guerra franquistas)</text>
<text class="sv-t3" x="10" y="575">LOS HECHOS Y LA POLÍTICA</text>
<rect class="sv-box" x="12" y="586" width="360" height="101" rx="2"/>
<text class="sv-t" x="192.0" y="634.0" text-anchor="middle">Primer plano: excusas y tecnicismos</text>
<text class="sv-t2" x="192.0" y="649.0" text-anchor="middle" style="font-size:12px">desentenderse de los hechos para alejarse de la condena</text>
<rect class="sv-box" x="388" y="586" width="360" height="101" rx="2"/>
<text class="sv-t" x="568.0" y="604.0" text-anchor="middle">Segundo plano: hablar de política, asumir la condena</text>
<text class="sv-t" x="568.0" y="619.0" text-anchor="middle">(«muertos de permiso»)</text>
<text class="sv-t2" x="568.0" y="634.0" text-anchor="middle" style="font-size:12px">los hechos se reivindican («respondo sin reservas de mis actos»,</text>
<text class="sv-t2" x="568.0" y="649.0" text-anchor="middle" style="font-size:12px">Leviné); la violencia revolucionaria responde a la burguesa; la «paz</text>
<text class="sv-t2" x="568.0" y="664.0" text-anchor="middle" style="font-size:12px">interna» no existe; el estado social «perfectible» (Varlin); la historia</text>
<text class="sv-t2" x="568.0" y="679.0" text-anchor="middle" style="font-size:12px">barrerá a los jueces</text>
<text class="sv-t3" x="10" y="712">FORMA Y TÉCNICA PROCESAL</text>
<rect class="sv-box" x="12" y="723" width="360" height="71" rx="2"/>
<text class="sv-t" x="192.0" y="748.5" text-anchor="middle">La defensa que el tribunal espera</text>
<text class="sv-t2" x="192.0" y="763.5" text-anchor="middle" style="font-size:12px">el «procesado silente» que se ciñe al abogado ordinario y</text>
<text class="sv-t2" x="192.0" y="778.5" text-anchor="middle" style="font-size:12px">responde lo jurídicamente más favorable</text>
<rect class="sv-box" x="388" y="723" width="360" height="71" rx="2"/>
<text class="sv-t" x="568.0" y="741.0" text-anchor="middle">Defensa consciente que sorprende a jueces y abogados</text>
<text class="sv-t2" x="568.0" y="756.0" text-anchor="middle" style="font-size:12px">no busca una condena más indulgente; proceso reglado: calcular los</text>
<text class="sv-t2" x="568.0" y="771.0" text-anchor="middle" style="font-size:12px">momentos; la última palabra como broche político (al Camarada</text>
<text class="sv-t2" x="568.0" y="786.0" text-anchor="middle" style="font-size:12px">Arenas se le arrebató)</text>
<text class="sv-t3" x="10" y="833">EFECTOS DE LA RUPTURA SEGÚN EL GRADO DE ORGANIZACIÓN</text>
<rect class="sv-box-green" x="12" y="844" width="172" height="131" rx="2"/>
<text class="sv-tgr" x="98.0" y="862.0" text-anchor="middle">Organización de masas →</text>
<text class="sv-tgr" x="98.0" y="877.0" text-anchor="middle">Burgos: 16 penas de</text>
<text class="sv-tgr" x="98.0" y="892.0" text-anchor="middle">muerte conmutadas</text>
<text class="sv-t2" x="98.0" y="907.0" text-anchor="middle" style="font-size:12px">huelgas, estado de excepción,</text>
<text class="sv-t2" x="98.0" y="922.0" text-anchor="middle" style="font-size:12px">intervención vaticana,</text>
<text class="sv-t2" x="98.0" y="937.0" text-anchor="middle" style="font-size:12px">secuestro del cónsul alemán:</text>
<text class="sv-t2" x="98.0" y="952.0" text-anchor="middle" style="font-size:12px">una estructura capaz de</text>
<text class="sv-t2" x="98.0" y="967.0" text-anchor="middle" style="font-size:12px">planificar y usar el proceso</text>
<rect class="sv-box-gold" x="200" y="844" width="172" height="131" rx="2"/>
<text class="sv-tg" x="286.0" y="877.0" text-anchor="middle">Partido desarticulado →</text>
<text class="sv-tg" x="286.0" y="892.0" text-anchor="middle">Grimau, PCE(r)</text>
<text class="sv-t2" x="286.0" y="907.0" text-anchor="middle" style="font-size:12px">consejos de guerra sin</text>
<text class="sv-t2" x="286.0" y="922.0" text-anchor="middle" style="font-size:12px">partido detrás: reacción</text>
<text class="sv-t2" x="286.0" y="937.0" text-anchor="middle" style="font-size:12px">internacional, escaso</text>
<text class="sv-t2" x="286.0" y="952.0" text-anchor="middle" style="font-size:12px">movimiento interno</text>
<rect class="sv-box-gold" x="388" y="844" width="172" height="131" rx="2"/>
<text class="sv-tg" x="474.0" y="884.5" text-anchor="middle">Movilización que se</text>
<text class="sv-tg" x="474.0" y="899.5" text-anchor="middle">desinfla → Hásel</text>
<text class="sv-t2" x="474.0" y="914.5" text-anchor="middle" style="font-size:12px">conciencia y movilización</text>
<text class="sv-t2" x="474.0" y="929.5" text-anchor="middle" style="font-size:12px">puntuales que decaen con</text>
<text class="sv-t2" x="474.0" y="944.5" text-anchor="middle" style="font-size:12px">los meses: alcance menor</text>
<rect class="sv-box" x="576" y="844" width="172" height="131" rx="2"/>
<text class="sv-t" x="662.0" y="869.5" text-anchor="middle">Soledad → Miguel</text>
<text class="sv-t" x="662.0" y="884.5" text-anchor="middle">Hernández: la integridad</text>
<text class="sv-t2" x="662.0" y="899.5" text-anchor="middle" style="font-size:12px">rechaza vivienda, pensión y</text>
<text class="sv-t2" x="662.0" y="914.5" text-anchor="middle" style="font-size:12px">vida como autor del régimen;</text>
<text class="sv-t2" x="662.0" y="929.5" text-anchor="middle" style="font-size:12px">elige morir antes que</text>
<text class="sv-t2" x="662.0" y="944.5" text-anchor="middle" style="font-size:12px">claudicar; salva su obra y su</text>
<text class="sv-t2" x="662.0" y="959.5" text-anchor="middle" style="font-size:12px">nombre («Las Cárceles»)</text>
<text class="sv-t3" x="12" y="1001">LA RUPTURA REFUERZA ORGANIZACIONES, AMPLÍA APOYOS, FUERZA REBAJAS O AMNISTÍAS; LA CONNIVENCIA, «MORTÍFERA»</text>
</svg>
