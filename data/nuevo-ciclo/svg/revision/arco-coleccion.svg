<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los cinco números de Nuevo Ciclo como pasos de un mismo argumento: cada uno aborda el mismo problema desde un ángulo distinto y todos desembocan en el partido comunista de masas e internacional." viewBox="0 0 760 491" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
