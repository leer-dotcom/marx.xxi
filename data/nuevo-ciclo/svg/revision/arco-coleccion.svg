<text class="sv-tr" x="380" y="423" text-anchor="middle">Partido comunista de masas, continental e internacional</text>
<text class="sv-t2" x="380" y="441" text-anchor="middle" style="font-size:12px">independencia política de la clase: «el gran ausente hoy, a la vez que la única alternativa real»</text>
