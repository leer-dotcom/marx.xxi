<svg xmlns="http://www.w3.org/2000/svg" aria-label="Los cuatro números de Nuevo Ciclo como pasos de un mismo argumento: cada uno aborda el mismo problema desde un ángulo distinto y todos desembocan en el partido comunista de masas e internacional." role="img" viewBox="0 0 760 404" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-hero-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">EL ARCO DE LOS CUATRO NÚMEROS: UN MISMO PROBLEMA, CUATRO ÁNGULOS, UNA TAREA</text>
<text class="sv-t2" text-anchor="middle" x="380" y="41" style="font-size:11px">Problema común: cómo se reorganizan las fuerzas del proletariado en una era de declive capitalista, guerra, genocidio y giro autoritario de los Estados</text>
<text class="sv-t3" text-anchor="middle" x="380" y="58" style="font-size:10px">CADA NÚMERO VUELVE SOBRE EL MISMO PROBLEMA DESDE UN ÁNGULO DISTINTO  →</text>
<rect class="sv-box" height="204" rx="2" width="172" x="18" y="68"></rect>
<text class="sv-t" text-anchor="middle" x="104.0" y="89" style="font-size:13.4px;letter-spacing:0">#001 · Septiembre 2025</text>
<text class="sv-t3" text-anchor="middle" x="104.0" y="105" style="font-size:9.5px">ÁNGULO DEL NÚMERO</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="119.0" style="font-size:11.5px">fija el diagnóstico</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="132.5" style="font-size:11.5px">de época</text>
<text class="sv-t3" text-anchor="middle" x="104.0" y="161.5" style="font-size:9.5px">TEMAS</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="175.5" style="font-size:11.5px">diagnóstico de época:</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="189.0" style="font-size:11.5px">declive, guerra, represión,</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="202.5" style="font-size:11.5px">Gaza, España</text>
<text class="sv-t3" text-anchor="middle" x="104.0" y="218.0" style="font-size:9.5px">AUTORES</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="232.0" style="font-size:11px">Aguiriano · Miasni · Gallardo</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="245.0" style="font-size:11px">Hernández · Villegas</text>
<text class="sv-t2" text-anchor="middle" x="104.0" y="258.0" style="font-size:11px">entrevista: Ray Brassier</text>
<line class="sv-line" x1="190" y1="170.0" x2="202" y2="170.0" marker-end="url(#nc-hero-arrow)"></line>
<rect class="sv-box" height="204" rx="2" width="172" x="202" y="68"></rect>
<text class="sv-t" text-anchor="middle" x="288.0" y="89" style="font-size:13.4px;letter-spacing:0">#002 · Diciembre 2025</text>
<text class="sv-t3" text-anchor="middle" x="288.0" y="105" style="font-size:9.5px">ÁNGULO DEL NÚMERO</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="119.0" style="font-size:11.5px">las formas de la dominación</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="132.5" style="font-size:11.5px">de clase y la ausencia</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="146.0" style="font-size:11.5px">del sujeto</text>
<text class="sv-t3" text-anchor="middle" x="288.0" y="161.5" style="font-size:9.5px">TEMAS</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="175.5" style="font-size:11.5px">franquismo, neofeudalismo,</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="189.0" style="font-size:11.5px">Europa, siniestralidad,</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="202.5" style="font-size:11.5px">prensa</text>
<text class="sv-t3" text-anchor="middle" x="288.0" y="218.0" style="font-size:9.5px">AUTORES</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="232.0" style="font-size:11px">García · Ferrín · Juncales</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="245.0" style="font-size:11px">Palacios · Volodia</text>
<text class="sv-t2" text-anchor="middle" x="288.0" y="258.0" style="font-size:11px">entrevista: W. C. Roberts</text>
<line class="sv-line" x1="374" y1="170.0" x2="386" y2="170.0" marker-end="url(#nc-hero-arrow)"></line>
<rect class="sv-box" height="204" rx="2" width="172" x="386" y="68"></rect>
<text class="sv-t" text-anchor="middle" x="472.0" y="89" style="font-size:13.4px;letter-spacing:0">#003 · Marzo 2026</text>
<text class="sv-t3" text-anchor="middle" x="472.0" y="105" style="font-size:9.5px">ÁNGULO DEL NÚMERO</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="119.0" style="font-size:11.5px">la reacción como</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="132.5" style="font-size:11.5px">producto del declive</text>
<text class="sv-t3" text-anchor="middle" x="472.0" y="161.5" style="font-size:9.5px">TEMAS</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="175.5" style="font-size:11.5px">Estado dual, OTAN,</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="189.0" style="font-size:11.5px">género, austeridad y</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="202.5" style="font-size:11.5px">fascismo</text>
<text class="sv-t3" text-anchor="middle" x="472.0" y="218.0" style="font-size:9.5px">AUTORES</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="232.0" style="font-size:11px">Gómez y Seijo · Raq · Garde</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="245.0" style="font-size:11px">Royo · Baroud</text>
<text class="sv-t2" text-anchor="middle" x="472.0" y="258.0" style="font-size:11px">entrevista: Jamie Merchant</text>
<line class="sv-line" x1="558" y1="170.0" x2="570" y2="170.0" marker-end="url(#nc-hero-arrow)"></line>
<rect class="sv-box" height="204" rx="2" width="172" x="570" y="68"></rect>
<text class="sv-t" text-anchor="middle" x="656.0" y="89" style="font-size:13.4px;letter-spacing:0">#004 · Junio 2026</text>
<text class="sv-t3" text-anchor="middle" x="656.0" y="105" style="font-size:9.5px">ÁNGULO DEL NÚMERO</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="119.0" style="font-size:11.5px">la coacción, la ley</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="132.5" style="font-size:11.5px">y la resistencia</text>
<text class="sv-t3" text-anchor="middle" x="656.0" y="161.5" style="font-size:9.5px">TEMAS</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="175.5" style="font-size:11.5px">genocidio, delincuencia,</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="189.0" style="font-size:11.5px">ilegalidad, el juez,</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="202.5" style="font-size:11.5px">inmigración</text>
<text class="sv-t3" text-anchor="middle" x="656.0" y="218.0" style="font-size:9.5px">AUTORES</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="232.0" style="font-size:11px">MJ · Mármol · Paula D.</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="245.0" style="font-size:11px">Zafra · Suárez</text>
<text class="sv-t2" text-anchor="middle" x="656.0" y="258.0" style="font-size:11px">entrevista: Alberto Toscano</text>
<rect class="sv-box-red" height="72" rx="2" width="724" x="18" y="314"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="336">Partido comunista de masas, continental e internacional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="354" style="font-size:12px">independencia política de la clase: «el gran ausente hoy, a la vez que la única alternativa real»</text>
<text class="sv-t2" text-anchor="middle" x="380" y="371" style="font-size:11px">con instituciones propias; fórmula de 1850; condición: unidad de clase con el proletariado migrante y todas las trabajadoras</text>
<line class="sv-line-red" x1="104.0" y1="272" x2="104.0" y2="314" marker-end="url(#nc-hero-arrow)"></line>
<line class="sv-line-red" x1="288.0" y1="272" x2="288.0" y2="314" marker-end="url(#nc-hero-arrow)"></line>
<line class="sv-line-red" x1="472.0" y1="272" x2="472.0" y2="314" marker-end="url(#nc-hero-arrow)"></line>
<line class="sv-line-red" x1="656.0" y1="272" x2="656.0" y2="314" marker-end="url(#nc-hero-arrow)"></line>
<text class="sv-t3" text-anchor="middle" x="196.0" y="291" style="font-size:10px">TODOS DESEMBOCAN</text>
<text class="sv-t3" text-anchor="middle" x="196.0" y="303" style="font-size:10px">EN LA MISMA TAREA</text>
</svg>
