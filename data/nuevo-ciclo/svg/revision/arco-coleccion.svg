<text class="sv-t3" x="380" y="22" text-anchor="middle">EL ARCO DE LOS CINCO NÚMEROS: UN MISMO PROBLEMA, CINCO ÁNGULOS, UNA TAREA</text>
<text class="sv-t2" x="380" y="41" text-anchor="middle" style="font-size:11px">Problema común: cómo se reorganizan las fuerzas del proletariado en una era de declive capitalista, guerra, genocidio y giro autoritario de los Estados</text>
<text class="sv-t3" x="380" y="58" text-anchor="middle" style="font-size:10px">CADA NÚMERO VUELVE SOBRE EL MISMO PROBLEMA DESDE UN ÁNGULO DISTINTO  →</text>
