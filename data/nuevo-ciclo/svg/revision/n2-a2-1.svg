<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos columnas enfrentadas: la hipótesis neofeudal y la crítica marxista, en los planos del valor, la acumulación, el sujeto político y las consecuencias prácticas; debajo, la clave de la refutación (el fetichismo tecnológico) y el desafío que la autora propone." viewBox="0 0 760 916" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-blue" x="12" y="10" width="360" height="96" rx="2"/>
<text class="sv-tb" x="192" y="23.8" text-anchor="middle">Hipótesis neo / tecnofeudal</text>
<text class="sv-t2" x="192" y="38.8" text-anchor="middle" style="font-size:12.5px">Dean, Varoufakis, Francia Insumisa</text>
<text class="sv-t2" x="192" y="53.8" text-anchor="middle" style="font-size:12.5px">Neofeudalismo (Dean): élites monopolísticas que someten</text>
<text class="sv-t2" x="192" y="68.8" text-anchor="middle" style="font-size:12.5px">a la población a redes de dependencia. Tecnofeudalismo</text>
<text class="sv-t2" x="192" y="83.8" text-anchor="middle" style="font-size:12.5px">(Varoufakis): soberanía de las big tech por el control de</text>
<text class="sv-t2" x="192" y="98.8" text-anchor="middle" style="font-size:12.5px">datos, algoritmos e infraestructuras, no de los medios</text>
<rect class="sv-box-red" x="388" y="10" width="360" height="96" rx="2"/>
<text class="sv-tr" x="568" y="23.8" text-anchor="middle">Crítica marxista</text>
<text class="sv-t2" x="568" y="38.8" text-anchor="middle" style="font-size:12.5px">Marx, Roberts, Aguiriano</text>
<text class="sv-t2" x="568" y="53.8" text-anchor="middle" style="font-size:12.5px">Triple tesis: el valor sigue teniendo como fuente exclusiva</text>
<text class="sv-t2" x="568" y="68.8" text-anchor="middle" style="font-size:12.5px">el trabajo humano; lo digital no altera la lógica de la</text>
<text class="sv-t2" x="568" y="83.8" text-anchor="middle" style="font-size:12.5px">acumulación; estas teorías promueven la crisis del sujeto</text>
<text class="sv-t2" x="568" y="98.8" text-anchor="middle" style="font-size:12.5px">revolucionario. Son formas ideológicas de la fase actual</text>
<rect class="sv-soft" x="4" y="120" width="752" height="132" rx="2"/>
<text class="sv-t3" x="10" y="131">VALOR</text>
<rect class="sv-box" x="12" y="140" width="360" height="102" rx="2"/>
<text class="sv-t" x="192" y="164.3" text-anchor="middle">Fuente del valor: datos, algoritmos, infraestructuras;</text>
<text class="sv-t" x="192" y="179.3" text-anchor="middle">«fin del trabajo»</text>
<text class="sv-t2" x="192" y="194.3" text-anchor="middle" style="font-size:12.5px">el capital ya no dependería del trabajo vivo; el poder</text>
<text class="sv-t2" x="192" y="209.3" text-anchor="middle" style="font-size:12.5px">productivo se atribuye a la tecnología; de ahí que ya</text>
<text class="sv-t2" x="192" y="224.3" text-anchor="middle" style="font-size:12.5px">no cabría hablar de capitalismo</text>
<rect class="sv-box" x="388" y="140" width="360" height="102" rx="2"/>
<text class="sv-t" x="568" y="156.8" text-anchor="middle">Sólo el trabajo vivo crea valor; el trabajo muerto</text>
<text class="sv-t" x="568" y="171.8" text-anchor="middle">transfiere. Lo que hay es invisibilización y</text>
<text class="sv-t" x="568" y="186.8" text-anchor="middle">fragmentación del trabajo</text>
<text class="sv-t2" x="568" y="201.8" text-anchor="middle" style="font-size:12.5px">máquinas, datos e infraestructuras sólo transfieren el valor</text>
<text class="sv-t2" x="568" y="216.8" text-anchor="middle" style="font-size:12.5px">del trabajo pasado (Grundrisse); trabajo de datos, moderación,</text>
<text class="sv-t2" x="568" y="231.8" text-anchor="middle" style="font-size:12.5px">mantenimiento del algoritmo y programación son trabajo vivo</text>
<line class="sv-line" x1="372" y1="191" x2="388" y2="191" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="262" width="752" height="150" rx="2"/>
<text class="sv-t3" x="10" y="273">ACUMULACIÓN</text>
<rect class="sv-box" x="12" y="282" width="360" height="120" rx="2"/>
<text class="sv-t" x="192" y="315.3" text-anchor="middle">Rentismo y plataformas = regresión a la dependencia</text>
<text class="sv-t" x="192" y="330.3" text-anchor="middle">personal feudal</text>
<text class="sv-t2" x="192" y="345.3" text-anchor="middle" style="font-size:12.5px">deuda, precariedad y vigilancia como nuevo vasallaje;</text>
<text class="sv-t2" x="192" y="360.3" text-anchor="middle" style="font-size:12.5px">nuevos «señores» corporativos y estatales; un nuevo</text>
<text class="sv-t2" x="192" y="375.3" text-anchor="middle" style="font-size:12.5px">modo de producción en avance</text>
<rect class="sv-box" x="388" y="282" width="360" height="120" rx="2"/>
<text class="sv-t" x="568" y="300.3" text-anchor="middle">Rentismo y financiarización = fase de la acumulación;</text>
<text class="sv-t" x="568" y="315.3" text-anchor="middle">expresan la crisis histórica del capital, no un nuevo</text>
<text class="sv-t" x="568" y="330.3" text-anchor="middle">modo de producción</text>
<text class="sv-t2" x="568" y="345.3" text-anchor="middle" style="font-size:12.5px">explotación por dominación impersonal del mercado de trabajo,</text>
<text class="sv-t2" x="568" y="360.3" text-anchor="middle" style="font-size:12.5px">«abierta y flexible» (Roberts); acumulación por medios extra-</text>
<text class="sv-t2" x="568" y="375.3" text-anchor="middle" style="font-size:12.5px">económicos (acumulación originaria); expulsar trabajo vivo hunde</text>
<text class="sv-t2" x="568" y="390.3" text-anchor="middle" style="font-size:12.5px">la rentabilidad y empuja a la especulación (burbuja de la IA)</text>
<line class="sv-line" x1="372" y1="342" x2="388" y2="342" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="422" width="752" height="150" rx="2"/>
<text class="sv-t3" x="10" y="433">SUJETO POLÍTICO</text>
<rect class="sv-box" x="12" y="442" width="360" height="120" rx="2"/>
<text class="sv-t" x="192" y="467.8" text-anchor="middle">Élites vs. multitudes; usuario vs. sistema; Estado</text>
<text class="sv-t" x="192" y="482.8" text-anchor="middle">gestor; partido afectivo</text>
<text class="sv-t2" x="192" y="497.8" text-anchor="middle" style="font-size:12.5px">«ciudadano digital» vs. «nubelistas»: consumidor vigilado,</text>
<text class="sv-t2" x="192" y="512.8" text-anchor="middle" style="font-size:12.5px">productor involuntario de datos; centralidad de los servicios</text>
<text class="sv-t2" x="192" y="527.8" text-anchor="middle" style="font-size:12.5px">(Dean) → Estado mediador que administra la precariedad</text>
<text class="sv-t2" x="192" y="542.8" text-anchor="middle" style="font-size:12.5px">(límite del eurocomunismo); partido como comunidad de afectos</text>
<rect class="sv-box" x="388" y="442" width="360" height="120" rx="2"/>
<text class="sv-t" x="568" y="460.3" text-anchor="middle">Burguesía vs. proletariado; el partido como</text>
<text class="sv-t" x="568" y="475.3" text-anchor="middle">organización de la clase que media entre conciencia y</text>
<text class="sv-t" x="568" y="490.3" text-anchor="middle">praxis</text>
<text class="sv-t2" x="568" y="505.3" text-anchor="middle" style="font-size:12.5px">colectivo organizado, arraigado en la clase y sostenido por la</text>
<text class="sv-t2" x="568" y="520.3" text-anchor="middle" style="font-size:12.5px">teoría (Aguiriano): organiza la lucha de clases, explica cada</text>
<text class="sv-t2" x="568" y="535.3" text-anchor="middle" style="font-size:12.5px">coyuntura, formula políticas socialistas, domina los medios de</text>
<text class="sv-t2" x="568" y="550.3" text-anchor="middle" style="font-size:12.5px">lucha y hegemoniza la conciencia socialista</text>
<line class="sv-line" x1="372" y1="502" x2="388" y2="502" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="582" width="752" height="138" rx="2"/>
<text class="sv-t3" x="10" y="593">CONSECUENCIAS</text>
<rect class="sv-box" x="12" y="602" width="360" height="108" rx="2"/>
<text class="sv-t" x="192" y="629.3" text-anchor="middle">Regular las plataformas: DMA, DSA, Next Generation EU,</text>
<text class="sv-t" x="192" y="644.3" text-anchor="middle">Ley Rider</text>
<text class="sv-t2" x="192" y="659.3" text-anchor="middle" style="font-size:12.5px">limitar monopolios, transparencia algorítmica, «transición</text>
<text class="sv-t2" x="192" y="674.3" text-anchor="middle" style="font-size:12.5px">digital», derechos para el trabajo de plataformas</text>
<text class="sv-t2" x="192" y="689.3" text-anchor="middle" style="font-size:12.5px">(Directiva 2024/2831, Ley 12/2021)</text>
<rect class="sv-box" x="388" y="602" width="360" height="108" rx="2"/>
<text class="sv-t" x="568" y="621.8" text-anchor="middle">Ajuste interno del capital: equipaje teórico de una</text>
<text class="sv-t" x="568" y="636.8" text-anchor="middle">socialdemocracia radical confinada a la redistribución</text>
<text class="sv-t2" x="568" y="651.8" text-anchor="middle" style="font-size:12.5px">traslada la crítica a la circulación y la ética tecnológica;</text>
<text class="sv-t2" x="568" y="666.8" text-anchor="middle" style="font-size:12.5px">institucionaliza el trabajo digital precario; capitalismo</text>
<text class="sv-t2" x="568" y="681.8" text-anchor="middle" style="font-size:12.5px">rearticulado bajo hegemonía tecnológica y financiera, gestionado</text>
<text class="sv-t2" x="568" y="696.8" text-anchor="middle" style="font-size:12.5px">entre socialdemocracia y fascismo</text>
<line class="sv-line" x1="372" y1="656" x2="388" y2="656" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-box-ink" x="12" y="732" width="736" height="70" rx="2"/>
<text class="sv-tw" x="380" y="755.3" text-anchor="middle">Clave de la refutación: el fetichismo tecnológico</text>
<text class="sv-tw" x="380" y="770.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">atribuir a la tecnología un poder productivo propio reproduce el fetichismo de la mercancía: la explotación entre clases</text>
<text class="sv-tw" x="380" y="785.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">aparece como dependencia impersonal frente a algoritmos; la dominación parece técnica cuando sigue siendo relación social</text>
<rect class="sv-box-gold" x="12" y="814" width="736" height="70" rx="2"/>
<text class="sv-tg" x="380" y="837.3" text-anchor="middle">Desafío comunista: reinscribir lo digital en la lógica del capital, no negar su novedad</text>
<text class="sv-t2" x="380" y="852.3" text-anchor="middle" style="font-size:12.5px">dominación digital y precarización global son síntomas del perfeccionamiento del capital, no de su superación;</text>
<text class="sv-t2" x="380" y="867.3" text-anchor="middle" style="font-size:12.5px">una teoría correcta de la crisis funda el partido revolucionario; la clase trabajadora sigue siendo el sujeto histórico</text>
<line class="sv-line" x1="12" y1="902" x2="38" y2="902" marker-end="url(#nc-n2a2-arrow)"/>
<text class="sv-t3" x="44" y="906">respuesta de la crítica marxista a cada plano de la hipótesis</text>
</svg>
