<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embudo causal del sionismo: tres bases (antisemitismo europeo y mito bíblico, tutela imperial, lógica del capital) convergen en un Estado colonial de asentamiento cuya lógica desemboca en el genocidio como esencia y no como excepción; a un lado, las posiciones que el artículo rechaza." viewBox="0 0 760 629" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20">TRES BASES DEL PROYECTO SIONISTA</text>
<rect class="sv-box" x="12" y="30" width="235" height="146" rx="2"/>
<text class="sv-t" x="129.5" y="48.0" text-anchor="middle">Antisemitismo europeo + mito</text>
<text class="sv-t" x="129.5" y="63.0" text-anchor="middle">bíblico secularizado</text>
<text class="sv-t2" x="129.5" y="78.0" text-anchor="middle" style="font-size:12px">pogromos del XIX; exilio y «retorno»</text>
<text class="sv-t2" x="129.5" y="93.0" text-anchor="middle" style="font-size:12px">«un pueblo, una tierra» sólo se</text>
<text class="sv-t2" x="129.5" y="108.0" text-anchor="middle" style="font-size:12px">sostiene religiosamente: la religión</text>
<text class="sv-t2" x="129.5" y="123.0" text-anchor="middle" style="font-size:12px">«siempre opera, aunque sea clandestina»</text>
<text class="sv-t2" x="129.5" y="138.0" text-anchor="middle" style="font-size:12px">fundamentalistas como vanguardia:</text>
<text class="sv-t2" x="129.5" y="153.0" text-anchor="middle" style="font-size:12px">colonialismo mesiánico que santifica</text>
<text class="sv-t2" x="129.5" y="168.0" text-anchor="middle" style="font-size:12px">el exterminio</text>
<rect class="sv-box" x="263" y="30" width="235" height="146" rx="2"/>
<text class="sv-t" x="380.5" y="63.0" text-anchor="middle">Interés imperial británico y</text>
<text class="sv-t" x="380.5" y="78.0" text-anchor="middle">occidental</text>
<text class="sv-t2" x="380.5" y="93.0" text-anchor="middle" style="font-size:12px">Rothschild, Basilea (1897), Balfour</text>
<text class="sv-t2" x="380.5" y="108.0" text-anchor="middle" style="font-size:12px">(1917), Mandato: «baluarte frente a</text>
<text class="sv-t2" x="380.5" y="123.0" text-anchor="middle" style="font-size:12px">Asia» (Herzl)</text>
<text class="sv-t2" x="380.5" y="138.0" text-anchor="middle" style="font-size:12px">los asentamientos sólo prosperan</text>
<text class="sv-t2" x="380.5" y="153.0" text-anchor="middle" style="font-size:12px">bajo amparo del capital occidental</text>
<rect class="sv-box" x="513" y="30" width="235" height="146" rx="2"/>
<text class="sv-t" x="630.5" y="70.5" text-anchor="middle">Lógica de acumulación del capital</text>
<text class="sv-t2" x="630.5" y="85.5" text-anchor="middle" style="font-size:12px">apropiación violenta y guerra (Lenin,</text>
<text class="sv-t2" x="630.5" y="100.5" text-anchor="middle" style="font-size:12px">El imperialismo, fase superior…)</text>
<text class="sv-t2" x="630.5" y="115.5" text-anchor="middle" style="font-size:12px">expansión constante a nuevos</text>
<text class="sv-t2" x="630.5" y="130.5" text-anchor="middle" style="font-size:12px">espacios de inversión para saldar</text>
<text class="sv-t2" x="630.5" y="145.5" text-anchor="middle" style="font-size:12px">sus contradicciones</text>
<rect class="sv-box-ink" x="12" y="206" width="736" height="71" rx="2"/>
<text class="sv-tw" x="380.0" y="224.0" text-anchor="middle">Estado colonial de asentamiento («colonia de trabajo», Machover)</text>
<text class="sv-tw" x="380.0" y="239.0" text-anchor="middle" style="font-size:12px;font-weight:400">objetivo común a todas las corrientes, del laborismo de Ben Gurión al revisionismo de Jabotinsky: colonización militarizada</text>
<text class="sv-tw" x="380.0" y="254.0" text-anchor="middle" style="font-size:12px;font-weight:400">del «modelo Rothschild» (explotar a los nativos en plantaciones) a incorporar a los colonos a la producción tras 1948</text>
<text class="sv-tw" x="380.0" y="269.0" text-anchor="middle" style="font-size:12px;font-weight:400">los colonos ocupan la producción: el trabajo palestino sobra</text>
<path class="sv-line" d="M129 176 V191 H380 V206" marker-end="url(#nc-n4a1-arrow)"/>
<line class="sv-line" x1="380" y1="176" x2="380" y2="206" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M631 176 V191 H380 V206" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box" x="12" y="307" width="360" height="116" rx="2"/>
<text class="sv-t" x="192.0" y="325.0" text-anchor="middle">Proletariado palestino inservible →</text>
<text class="sv-t" x="192.0" y="340.0" text-anchor="middle">expulsión y limpieza étnica</text>
<text class="sv-t2" x="192.0" y="355.0" text-anchor="middle" style="font-size:12px">su mera existencia bloquea tierras y recursos clave:</text>
<text class="sv-t2" x="192.0" y="370.0" text-anchor="middle" style="font-size:12px">Israel, «verdadero motor de limpieza étnica»</text>
<text class="sv-t2" x="192.0" y="385.0" text-anchor="middle" style="font-size:12px">consolidación del Estado y pauperización «son la misma cosa»</text>
<text class="sv-t2" x="192.0" y="400.0" text-anchor="middle" style="font-size:12px">resto palestino: ejército industrial de reserva, empleado o</text>
<text class="sv-t2" x="192.0" y="415.0" text-anchor="middle" style="font-size:12px">expulsado según las necesidades del Estado</text>
<rect class="sv-box" x="388" y="307" width="360" height="116" rx="2"/>
<text class="sv-t" x="568.0" y="332.5" text-anchor="middle">Apartheid jurídico + economía militarizada</text>
<text class="sv-t2" x="568.0" y="347.5" text-anchor="middle" style="font-size:12px">sin constitución: emergencia permanente desde 1948</text>
<text class="sv-t2" x="568.0" y="362.5" text-anchor="middle" style="font-size:12px">14 Leyes Fundamentales (Estado-nación, 2018), Ley de Retorno</text>
<text class="sv-t2" x="568.0" y="377.5" text-anchor="middle" style="font-size:12px">(1950): etnoestado con habitantes de segunda; el Tzahal socializa</text>
<text class="sv-t2" x="568.0" y="392.5" text-anchor="middle" style="font-size:12px">alta tecnología militar: más de ½ de las exportaciones, 17-20 % del</text>
<text class="sv-t2" x="568.0" y="407.5" text-anchor="middle" style="font-size:12px">PIB; perro guardián y laboratorio del imperialismo</text>
<path class="sv-line" d="M380 277 V292 H192 V307" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M380 277 V292 H568 V307" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box-red" x="12" y="453" width="485" height="56" rx="2"/>
<text class="sv-tr" x="254.5" y="471.0" text-anchor="middle">Genocidio en Gaza: salto cualitativo, no excepción</text>
<text class="sv-t2" x="254.5" y="486.0" text-anchor="middle" style="font-size:12px">«inscrito en su ADN»: manifestación de la esencia del Estado, no desviación</text>
<text class="sv-t2" x="254.5" y="501.0" text-anchor="middle" style="font-size:12px">de un gobierno; la fascistización actual sólo lo agudiza</text>
<rect class="sv-box-gold" x="513" y="453" width="235" height="71" rx="2"/>
<text class="sv-tg" x="630.5" y="471.0" text-anchor="middle">Rechazado: dos Estados, pacifismo</text>
<text class="sv-tg" x="630.5" y="486.0" text-anchor="middle">liberal</text>
<text class="sv-t2" x="630.5" y="501.0" text-anchor="middle" style="font-size:12px">incapaces de pensar la acumulación</text>
<text class="sv-t2" x="630.5" y="516.0" text-anchor="middle" style="font-size:12px">«convivencia abstracta» inviable</text>
<path class="sv-line" d="M192 423 V438 H255 V453" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M568 423 V438 H255 V453" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box" x="12" y="539" width="736" height="56" rx="2"/>
<text class="sv-t" x="380.0" y="557.0" text-anchor="middle">Única solución: que Israel deje de existir como Estado sionista · derecho del proletariado palestino a la</text>
<text class="sv-t" x="380.0" y="572.0" text-anchor="middle">resistencia</text>
<text class="sv-t2" x="380.0" y="587.0" text-anchor="middle" style="font-size:12px">no puede existir un Estado sionista democrático; el genocidio no se detiene con un cambio de gobierno</text>
<path class="sv-line-red" d="M255 509 V524 H380 V539" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line-dash" d="M631 524 V539 H520 V539" marker-end="url(#nc-n4a1-arrow)"/>
<text class="sv-t3" x="12" y="613">FLECHA CONTINUA: CADENA CAUSAL · DISCONTINUA: POSICIÓN QUE EL ARTÍCULO RECHAZA FRENTE A SU CONCLUSIÓN</text>
</svg>
