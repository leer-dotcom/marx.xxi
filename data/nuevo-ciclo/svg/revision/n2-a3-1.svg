<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matriz de la clase obrera europea: tendencias a la unificación y fracturas en los planos objetivo y subjetivo, precedida por la tesis de partida, y debajo las tres respuestas erradas ante el rearme y la tarea que el artículo les opone." viewBox="0 0 760 886" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-ink" x="12" y="10" width="736" height="74" rx="2"/>
<text class="sv-tw" x="380" y="35.3" text-anchor="middle">Punto de partida: 220 millones de activos (sobre 450) que «languidecen como sujeto de la historia»</text>
<text class="sv-tw" x="380" y="50.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">lo decisivo no es el tamaño sino la posición en la división mundial del trabajo y el orden imperialista: gran parte es beneficiaria</text>
<text class="sv-tw" x="380" y="65.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">objetiva de ese orden y su modo de vida dificulta un sujeto independiente; pero frenar el «holocausto» exige activarla</text>
<text class="sv-t3" x="192" y="104" text-anchor="middle">PLANO OBJETIVO</text>
<text class="sv-t3" x="568" y="104" text-anchor="middle">PLANO SUBJETIVO / POLÍTICO</text>
<rect class="sv-soft" x="4" y="112" width="752" height="208" rx="2"/>
<text class="sv-t3" x="10" y="123">TENDENCIAS A LA UNIFICACIÓN</text>
<rect class="sv-box-blue" x="12" y="134" width="360" height="176" rx="2"/>
<text class="sv-tb" x="192" y="162.1" text-anchor="middle">Bases de unión</text>
<text class="sv-t2" x="192" y="176.1" text-anchor="middle" style="font-size:12px">1) marcos institucionales comunes: TJUE, comités de empresa</text>
<text class="sv-t2" x="192" y="190.1" text-anchor="middle" style="font-size:12px">europeos y, sobre todo, la disciplina monetaria del BCE</text>
<text class="sv-t2" x="192" y="204.1" text-anchor="middle" style="font-size:12px">(ofensiva contra el fondo de salarios tras la inflación de 2021)</text>
<text class="sv-t2" x="192" y="218.1" text-anchor="middle" style="font-size:12px">2) convergencia económica: jerarquía entre territorios (no</text>
<text class="sv-t2" x="192" y="232.1" text-anchor="middle" style="font-size:12px">entre países), integración sectorial, convergencia de rentas</text>
<text class="sv-t2" x="192" y="246.1" text-anchor="middle" style="font-size:12px">(los salarios medios de Varsovia superan los de Madrid)</text>
<text class="sv-t2" x="192" y="260.1" text-anchor="middle" style="font-size:12px">3) composición de clase homogénea: apartheid migratorio</text>
<text class="sv-t2" x="192" y="274.1" text-anchor="middle" style="font-size:12px">(10 % de la población con derechos minorados; condición</text>
<text class="sv-t2" x="192" y="288.1" text-anchor="middle" style="font-size:12px">inscrita en la CEE); criminalización e islamofobia</text>
<rect class="sv-box" x="388" y="134" width="360" height="176" rx="2"/>
<text class="sv-t" x="568" y="169.1" text-anchor="middle">Capacidad de lucha débil</text>
<text class="sv-t2" x="568" y="183.1" text-anchor="middle" style="font-size:12px">huelga = derecho canalizado por el Estado, «decorado</text>
<text class="sv-t2" x="568" y="197.1" text-anchor="middle" style="font-size:12px">democrático»; huelga general en 5 subregiones: mediterráneos</text>
<text class="sv-t2" x="568" y="211.1" text-anchor="middle" style="font-size:12px">(Grecia, Francia), nórdicos, centro (Alemania, sin ellas),</text>
<text class="sv-t2" x="568" y="225.1" text-anchor="middle" style="font-size:12px">puntual (Irlanda, Bélgica), este (ninguna). Grecia (KKE-PAME)</text>
<text class="sv-t2" x="568" y="239.1" text-anchor="middle" style="font-size:12px">y Francia (CGT): sin logros económicos (jornada 2024; 14 huelgas</text>
<text class="sv-t2" x="568" y="253.1" text-anchor="middle" style="font-size:12px">contra las pensiones 2023) pero sí cualitativos: bloqueo de</text>
<text class="sv-t2" x="568" y="267.1" text-anchor="middle" style="font-size:12px">convoyes y armas a Ucrania e Israel; Bélgica 2025. Formatos</text>
<text class="sv-t2" x="568" y="281.1" text-anchor="middle" style="font-size:12px">simbólico y minoritario (abajo); ninguna fuerza política obrera</text>
<rect class="sv-soft" x="4" y="328" width="752" height="124" rx="2"/>
<text class="sv-t3" x="10" y="339">FORMATOS DE LA HUELGA GENERAL HOY (AMBAS CAJAS: PLANO SUBJETIVO)</text>
<rect class="sv-box" x="12" y="350" width="360" height="92" rx="2"/>
<text class="sv-t" x="192" y="371.1" text-anchor="middle">Modelo «vertical» agotado</text>
<text class="sv-t2" x="192" y="385.1" text-anchor="middle" style="font-size:12px">los grandes sindicatos pactan y la clase secunda; CCOO y UGT no</text>
<text class="sv-t2" x="192" y="399.1" text-anchor="middle" style="font-size:12px">convocan huelga general de 24 h desde 2012 (Portugal, 2013);</text>
<text class="sv-t2" x="192" y="413.1" text-anchor="middle" style="font-size:12px">Italia: rutina presupuestaria (CGIL, UIL); el caso vasco, dinámica</text>
<text class="sv-t2" x="192" y="427.1" text-anchor="middle" style="font-size:12px">propia; en Occidente no hay fuerza política ni cultural obrera</text>
<rect class="sv-box" x="388" y="350" width="360" height="92" rx="2"/>
<text class="sv-t" x="568" y="371.1" text-anchor="middle">Formatos simbólico y minoritario</text>
<text class="sv-t2" x="568" y="385.1" text-anchor="middle" style="font-size:12px">«externa»: huelga como cobertura de movilizaciones amplias (8M</text>
<text class="sv-t2" x="568" y="399.1" text-anchor="middle" style="font-size:12px">2018-20, cuidados Euskadi 2023, Palestina 2024, DANA 2025),</text>
<text class="sv-t2" x="568" y="413.1" text-anchor="middle" style="font-size:12px">desconectada del movimiento obrero; minoritaria: propaganda o</text>
<text class="sv-t2" x="568" y="427.1" text-anchor="middle" style="font-size:12px">coartada legal (USB, COBAS, USI; Green Pass 2021)</text>
<rect class="sv-soft" x="4" y="460" width="752" height="138" rx="2"/>
<text class="sv-t3" x="10" y="471">FRACTURAS</text>
<rect class="sv-box-red" x="12" y="482" width="360" height="106" rx="2"/>
<text class="sv-tr" x="192" y="503.1" text-anchor="middle">Cicatrices</text>
<text class="sv-t2" x="192" y="517.1" text-anchor="middle" style="font-size:12px">este-oeste (Bolkestein 2005-06: «pago en origen» contra los</text>
<text class="sv-t2" x="192" y="531.1" text-anchor="middle" style="font-size:12px">migrantes del este; la CES lo dejó en plan de presión), norte-sur</text>
<text class="sv-t2" x="192" y="545.1" text-anchor="middle" style="font-size:12px">(austeridad, 14N 2012: el centro y norte asumen la tesis de la</text>
<text class="sv-t2" x="192" y="559.1" text-anchor="middle" style="font-size:12px">Troika). Raíz: concertación entre capitales sin fusión</text>
<text class="sv-t2" x="192" y="573.1" text-anchor="middle" style="font-size:12px">(carencia que señala el Informe Draghi, 2024)</text>
<rect class="sv-box-red" x="388" y="482" width="360" height="106" rx="2"/>
<text class="sv-tr" x="568" y="503.1" text-anchor="middle">Mediación nacional</text>
<text class="sv-t2" x="568" y="517.1" text-anchor="middle" style="font-size:12px">sindicatos-lobby de concertación, partidos de clases medias,</text>
<text class="sv-t2" x="568" y="531.1" text-anchor="middle" style="font-size:12px">27 marcos estatales; Estados, lenguas y costumbres hacen del</text>
<text class="sv-t2" x="568" y="545.1" text-anchor="middle" style="font-size:12px">plano europeo una «entelequia lejana»; baja afiliación;</text>
<text class="sv-t2" x="568" y="559.1" text-anchor="middle" style="font-size:12px">sin fuerza política impugnadora, la huelga no puede ser otra</text>
<text class="sv-t2" x="568" y="573.1" text-anchor="middle" style="font-size:12px">cosa que lobby</text>
<rect class="sv-soft" x="4" y="606" width="752" height="150" rx="2"/>
<text class="sv-t3" x="10" y="617">RESPUESTAS ANTE EL REARME</text>
<rect class="sv-box-gold" x="12" y="628" width="235" height="118" rx="2"/>
<text class="sv-tg" x="129.5" y="648.1" text-anchor="middle">Cierre nacionalista (derecha)</text>
<text class="sv-t2" x="129.5" y="662.1" text-anchor="middle" style="font-size:12px">subordinación a EE. UU. en la</text>
<text class="sv-t2" x="129.5" y="676.1" text-anchor="middle" style="font-size:12px">posición de mayor fuerza posible,</text>
<text class="sv-t2" x="129.5" y="690.1" text-anchor="middle" style="font-size:12px">manteniendo la forma nacional;</text>
<text class="sv-t2" x="129.5" y="704.1" text-anchor="middle" style="font-size:12px">hostilidad al migrante y a las clases</text>
<text class="sv-t2" x="129.5" y="718.1" text-anchor="middle" style="font-size:12px">obreras vecinas (chovinismo,</text>
<text class="sv-t2" x="129.5" y="732.1" text-anchor="middle" style="font-size:12px">«hispanistas»)</text>
<rect class="sv-box-gold" x="263" y="628" width="235" height="118" rx="2"/>
<text class="sv-tg" x="380.5" y="655.1" text-anchor="middle">Europeísmo abstracto</text>
<text class="sv-t2" x="380.5" y="669.1" text-anchor="middle" style="font-size:12px">socialdemocracia, CCOO, CGIL: la</text>
<text class="sv-t2" x="380.5" y="683.1" text-anchor="middle" style="font-size:12px">UE como espacio democrático frente</text>
<text class="sv-t2" x="380.5" y="697.1" text-anchor="middle" style="font-size:12px">a EE. UU.; su reverso: avalan</text>
<text class="sv-t2" x="380.5" y="711.1" text-anchor="middle" style="font-size:12px">el rearme contra el «enemigo</text>
<text class="sv-t2" x="380.5" y="725.1" text-anchor="middle" style="font-size:12px">externo» (proxy ucraniano)</text>
<rect class="sv-box-gold" x="513" y="628" width="235" height="118" rx="2"/>
<text class="sv-tg" x="630.5" y="648.1" text-anchor="middle">Soberanismo tercermundista</text>
<text class="sv-t2" x="630.5" y="662.1" text-anchor="middle" style="font-size:12px">izquierda: soberanía nacional frente</text>
<text class="sv-t2" x="630.5" y="676.1" text-anchor="middle" style="font-size:12px">a la UE (chovinismo paralelo); lucha</text>
<text class="sv-t2" x="630.5" y="690.1" text-anchor="middle" style="font-size:12px">de clases subordinada a BRICS o</text>
<text class="sv-t2" x="630.5" y="704.1" text-anchor="middle" style="font-size:12px">Rusia o a las luchas periféricas;</text>
<text class="sv-t2" x="630.5" y="718.1" text-anchor="middle" style="font-size:12px">Europa = «aristocracia obrera»;</text>
<text class="sv-t2" x="630.5" y="732.1" text-anchor="middle" style="font-size:12px">abandona la lucha de clases aquí</text>
<rect class="sv-box-red" x="12" y="776" width="736" height="78" rx="2"/>
<text class="sv-tr" x="380" y="797.1" text-anchor="middle">Movimiento obrero europeo contra el militarismo: elementos políticos avanzados en las luchas</text>
<text class="sv-t2" x="380" y="811.1" text-anchor="middle" style="font-size:12px">romper con las fantasías de secesión nacional y con el militarismo del europeísmo oficial;</text>
<text class="sv-t2" x="380" y="825.1" text-anchor="middle" style="font-size:12px">salir de las tres posturas no es cuestión de voluntad, pero la militancia revolucionaria puede introducir elementos avanzados</text>
<text class="sv-t2" x="380" y="839.1" text-anchor="middle" style="font-size:12px">(p. ej., contra la discriminación racial o sexual); guerra y recortes impondrán un mismo escenario a toda la clase obrera europea</text>
<path class="sv-line-dash" d="M129.5 746 V764 H380 V776" marker-end="url(#nc-n2a3-arrow)"/>
<path class="sv-line-dash" d="M380.5 746 V764 H380 V776" marker-end="url(#nc-n2a3-arrow)"/>
<path class="sv-line-dash" d="M630.5 746 V764 H380 V776" marker-end="url(#nc-n2a3-arrow)"/>
<line class="sv-line-dash" x1="12" y1="872" x2="38" y2="872" marker-end="url(#nc-n2a3-arrow)"/>
<text class="sv-t3" x="44" y="876">respuesta errada a la que se opone la tarea propuesta</text>
</svg>
