<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" role="img" aria-label="Doble línea temporal del socialismo alemán y ruso antes de 1914 con la combinación de medios legales e ilegales en cada coyuntura, y matriz de posiciones ante la reacción de 1907.">
<defs><marker id="nc-n4a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="87" rx="2"/>
<text class="sv-t3" x="10" y="27">ALEMANIA</text>
<rect class="sv-soft" x="4" y="117" width="752" height="132" rx="2"/>
<text class="sv-t3" x="10" y="128">RUSIA</text>
<rect class="sv-soft" x="4" y="263" width="752" height="132" rx="2"/>
<text class="sv-t3" x="10" y="274">POSICIONES ANTE LA REACCIÓN DE 1907</text>
<rect class="sv-box" x="12" y="38" width="285" height="57" rx="2"/>
<text class="sv-t" x="154" y="55.5" text-anchor="middle">1878-90 · SPD ilegalizado</text>
<text class="sv-t2" style="font-weight:400" x="154" y="70.5" text-anchor="middle">fracción del Reichstag + Sozialdemokrat</text>
<text class="sv-t2" style="font-weight:400" x="154" y="85.5" text-anchor="middle">clandestino → «época heroica»</text>
<rect class="sv-box-red" x="463" y="38" width="285" height="57" rx="2"/>
<text class="sv-tr" x="606" y="55.5" text-anchor="middle">1914 · El SPD vota los créditos</text>
<text class="sv-t2" style="font-weight:400" x="606" y="70.5" text-anchor="middle">legalismo = oportunismo; el aparato legal como</text>
<text class="sv-t2" style="font-weight:400" x="606" y="85.5" text-anchor="middle">fin</text>
<rect class="sv-box" x="12" y="139" width="134" height="102" rx="2"/>
<text class="sv-t" x="79" y="171.5" text-anchor="middle">1900-05 · Iskra</text>
<text class="sv-t2" style="font-weight:400" x="79" y="186.5" text-anchor="middle">revolucionarios</text>
<text class="sv-t2" style="font-weight:400" x="79" y="201.5" text-anchor="middle">profesionales;</text>
<text class="sv-t2" style="font-weight:400" x="79" y="216.5" text-anchor="middle">konspiratsiia</text>
<rect class="sv-box" x="162" y="139" width="134" height="102" rx="2"/>
<text class="sv-t" x="230" y="156.5" text-anchor="middle">1905-06 · Abrir el</text>
<text class="sv-t" x="230" y="171.5" text-anchor="middle">partido</text>
<text class="sv-t2" style="font-weight:400" x="230" y="186.5" text-anchor="middle">principio electivo,</text>
<text class="sv-t2" style="font-weight:400" x="230" y="201.5" text-anchor="middle">sóviets, «armar al</text>
<text class="sv-t2" style="font-weight:400" x="230" y="216.5" text-anchor="middle">pueblo»; la Duma</text>
<text class="sv-t2" style="font-weight:400" x="230" y="231.5" text-anchor="middle">como tribuna</text>
<rect class="sv-box" x="313" y="139" width="134" height="102" rx="2"/>
<text class="sv-t" x="380" y="171.5" text-anchor="middle">1907-12 · Reacción</text>
<text class="sv-t2" style="font-weight:400" x="380" y="186.5" text-anchor="middle">núcleo ilegal +</text>
<text class="sv-t2" style="font-weight:400" x="380" y="201.5" text-anchor="middle">Duma: «hablar</text>
<text class="sv-t2" style="font-weight:400" x="380" y="216.5" text-anchor="middle">alemán»</text>
<rect class="sv-box-blue" x="463" y="139" width="285" height="102" rx="2"/>
<text class="sv-tb" x="606" y="186.5" text-anchor="middle">1914 · POSDR ilegal</text>
<text class="sv-t2" style="font-weight:400" x="606" y="201.5" text-anchor="middle">cumple su deber internacionalista</text>
<rect class="sv-box-gold" x="12" y="285" width="134" height="102" rx="2"/>
<text class="sv-tg" x="79" y="325.0" text-anchor="middle">Liquidadores: sólo</text>
<text class="sv-tg" x="79" y="340.0" text-anchor="middle">legal</text>
<text class="sv-t2" style="font-weight:400" x="79" y="355.0" text-anchor="middle">Martov, Dan</text>
<rect class="sv-box-gold" x="162" y="285" width="134" height="102" rx="2"/>
<text class="sv-tg" x="230" y="317.5" text-anchor="middle">Otzovistas: sólo</text>
<text class="sv-tg" x="230" y="332.5" text-anchor="middle">ilegal</text>
<text class="sv-t2" style="font-weight:400" x="230" y="347.5" text-anchor="middle">boicot a la Duma,</text>
<text class="sv-t2" style="font-weight:400" x="230" y="362.5" text-anchor="middle">guerrilla</text>
<rect class="sv-box-gold" x="313" y="285" width="134" height="102" rx="2"/>
<text class="sv-tg" x="380" y="317.5" text-anchor="middle">Conciliadores:</text>
<text class="sv-tg" x="380" y="332.5" text-anchor="middle">unidad sin</text>
<text class="sv-tg" x="380" y="347.5" text-anchor="middle">expulsión</text>
<text class="sv-t2" style="font-weight:400" x="380" y="362.5" text-anchor="middle">Plejánov, Trotsky</text>
<rect class="sv-box-red" x="463" y="285" width="134" height="102" rx="2"/>
<text class="sv-tr" x="530" y="310.0" text-anchor="middle">Lenin: combinación</text>
<text class="sv-tr" x="530" y="325.0" text-anchor="middle">metódica</text>
<text class="sv-t2" style="font-weight:400" x="530" y="340.0" text-anchor="middle">contra el</text>
<text class="sv-t2" style="font-weight:400" x="530" y="355.0" text-anchor="middle">liquidacionismo «de</text>
<text class="sv-t2" style="font-weight:400" x="530" y="370.0" text-anchor="middle">ambos matices»</text>
<rect class="sv-box-ink" x="614" y="285" width="134" height="102" rx="2"/>
<text class="sv-tw" x="681" y="302.5" text-anchor="middle">Lección: subordinar</text>
<text class="sv-tw" x="681" y="317.5" text-anchor="middle">los medios a la</text>
<text class="sv-tw" x="681" y="332.5" text-anchor="middle">estrategia</text>
<text class="sv-tw" style="font-weight:400" x="681" y="347.5" text-anchor="middle">preservar la</text>
<text class="sv-tw" style="font-weight:400" x="681" y="362.5" text-anchor="middle">independencia</text>
<text class="sv-tw" style="font-weight:400" x="681" y="377.5" text-anchor="middle">política</text>
<line class="sv-line" x1="146" y1="190" x2="162" y2="190" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="297" y1="190" x2="313" y2="190" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="447" y1="190" x2="463" y2="190" marker-end="url(#nc-n4a3-arrow)"/>
<path class="sv-line" d="M154 95 V117 H79 V139" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line-dash" x1="606" y1="95" x2="606" y2="139" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="612" y="121" text-anchor="start">contraste</text>
<line class="sv-line" x1="598" y1="336" x2="614" y2="336" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="157" y="113" text-anchor="middle" style="paint-order:stroke;stroke:var(--d-bg);stroke-width:5px;stroke-linejoin:round">modelo</text>
</svg>
