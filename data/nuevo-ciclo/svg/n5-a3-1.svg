<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos columnas sobre la fase expansiva del ciclo 2021-25: lo que el capital gana por la inflación y lo que la clase recibe por el empleo convergen en la paradoja de ganar más y estar más explotados, que da estabilidad al régimen; abajo, la fractura entre precarios y asentados y las reivindicaciones que el artículo propone." viewBox="0 0 760 556" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="84" width="372" height="144" rx="2"/>
<text class="sv-t3" x="10" y="95">LO QUE EL CAPITAL GANA</text>
<rect class="sv-soft" x="384" y="84" width="372" height="144" rx="2"/>
<text class="sv-t3" x="390" y="95">LO QUE LA CLASE RECIBE</text>
<rect class="sv-soft" x="4" y="392" width="752" height="74" rx="2"/>
<text class="sv-t3" x="10" y="403">EFECTO DESIGUAL: FRACTURA INTERNA DE LA CLASE</text>
<rect class="sv-box" x="12" y="16" width="736" height="44" rx="2"/>
<text class="sv-t" x="380" y="34.5" text-anchor="middle">Fase expansiva del ciclo económico (desde 2021)</text>
<text class="sv-t2" x="380" y="49.5" text-anchor="middle">beneficios y valoraciones récord; paro del 10,5 % en 2025</text>
<rect class="sv-box" x="12" y="106" width="356" height="44" rx="2"/>
<text class="sv-t" x="190" y="124.5" text-anchor="middle">Inflación = devaluación salarial indirecta</text>
<text class="sv-t2" x="190" y="139.5" text-anchor="middle">sin culpables inmediatos, desde finales de 2021</text>
<rect class="sv-box" x="392" y="106" width="356" height="44" rx="2"/>
<text class="sv-t" x="570" y="124.5" text-anchor="middle">Más empleo, menos temporalidad, SMI ↑</text>
<text class="sv-t2" x="570" y="139.5" text-anchor="middle">Reforma Laboral de 2021; SMI por encima de la inflación</text>
<rect class="sv-box" x="12" y="176" width="356" height="44" rx="2"/>
<text class="sv-t" x="190" y="194.5" text-anchor="middle">Salario real por hora ↓ · Márgenes ↑</text>
<text class="sv-t2" x="190" y="209.5" text-anchor="middle">venden más caro y pagan lo mismo</text>
<rect class="sv-box" x="392" y="176" width="356" height="44" rx="2"/>
<text class="sv-t" x="570" y="194.5" text-anchor="middle">Renta real de los hogares ↑</text>
<text class="sv-t2" x="570" y="209.5" text-anchor="middle">más tiempo trabajado al año</text>
<rect class="sv-box-red" x="190" y="254" width="380" height="44" rx="2"/>
<text class="sv-tr" x="380" y="272.5" text-anchor="middle">«Ganamos más, pero estamos más explotados»</text>
<text class="sv-t2" x="380" y="287.5" text-anchor="middle">cobramos menos por el mismo trabajo</text>
<rect class="sv-box-blue" x="190" y="326" width="380" height="44" rx="2"/>
<text class="sv-tb" x="380" y="344.5" text-anchor="middle">Estabilidad y adhesión al régimen político</text>
<text class="sv-t2" x="380" y="359.5" text-anchor="middle">gestores capitalistas ideales + sindicatos escuderos</text>
<rect class="sv-box-gold" x="12" y="414" width="356" height="44" rx="2"/>
<text class="sv-tg" x="190" y="432.5" text-anchor="middle">Precarios y migrantes: mejoran</text>
<text class="sv-t2" x="190" y="447.5" text-anchor="middle">pero el 54 % de los extracomunitarios, en pobreza</text>
<rect class="sv-box-gold" x="392" y="414" width="356" height="44" rx="2"/>
<text class="sv-tg" x="570" y="432.5" text-anchor="middle">Sectores asentados: pierden</text>
<text class="sv-t2" x="570" y="447.5" text-anchor="middle">convenios sin cláusulas de revisión salarial</text>
<rect class="sv-box-ink" x="12" y="496" width="736" height="44" rx="2"/>
<text class="sv-tw" x="380" y="514.5" text-anchor="middle">Independencia sindical · igualdad migrante/nativo · indexación salarial</text>
<text class="sv-tw" style="font-weight:400" x="380" y="529.5" text-anchor="middle">sin proyecto político alternativo, toda movilización acaba en la integración</text>
<path class="sv-line" d="M190 60 V106" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M570 60 V106" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M190 150 V176" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M570 150 V176" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M190 220 V238 H300 V254" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M570 220 V238 H460 V254" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M380 298 V326" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M380 370 V392" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M368 436 H392" marker-start="url(#nc-n5a3-arrow)" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M190 458 V496" marker-end="url(#nc-n5a3-arrow)"/>
<path class="sv-line" d="M570 458 V496" marker-end="url(#nc-n5a3-arrow)"/>
<text class="sv-t3" x="196.0" y="77" text-anchor="start">VÍA PRECIOS</text>
<text class="sv-t3" x="576.0" y="77" text-anchor="start">VÍA EMPLEO</text>
<text class="sv-t3" x="196.0" y="233" text-anchor="start">MENOS POR HORA</text>
<text class="sv-t3" x="564.0" y="233" text-anchor="end">MÁS HORAS</text>
<text class="sv-t3" x="386" y="316" text-anchor="start">MODERA EL MALESTAR</text>
<text class="sv-t3" x="380" y="486" text-anchor="middle">REIVINDICACIONES</text>
</svg>
