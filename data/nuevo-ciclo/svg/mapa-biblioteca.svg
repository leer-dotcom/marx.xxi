<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 581" role="img" aria-label="Mapa de la biblioteca en dos niveles: arriba, los cinco principios que fijan los volúmenes de Marx XXI; abajo, las coyunturas que Nuevo Ciclo analiza bajo cada principio; en el centro, el partido comunista de masas como tarea común.">
<defs><marker id="nc-bib-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="254" width="782" height="313" rx="2"/>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(22 133) rotate(-90)" style="font-size:16px;letter-spacing:.2em">MARCO</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(36 133) rotate(-90)" style="letter-spacing:.04em">Marx XXI (principios)</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(22 417.5) rotate(-90)" style="font-size:16px;letter-spacing:.2em">COYUNTURA</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(36 417.5) rotate(-90)" style="letter-spacing:.04em">Nuevo Ciclo (aplicaciones)</text>
<g transform="translate(30 0)">
<rect class="sv-box-ink" x="12" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="79" y="63.0" text-anchor="middle">Qué marxismo</text>
<text class="sv-tw" style="font-weight:400" x="79" y="78.0" text-anchor="middle">Volumen 1: ciencia,</text>
<text class="sv-tw" style="font-weight:400" x="79" y="93.0" text-anchor="middle">filosofía y</text>
<text class="sv-tw" style="font-weight:400" x="79" y="108.0" text-anchor="middle">política; totalidad;</text>
<text class="sv-tw" style="font-weight:400" x="79" y="123.0" text-anchor="middle">Hegel</text>
<rect class="sv-box-ink" x="162" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="230" y="63.0" text-anchor="middle">Contra la</text>
<text class="sv-tw" x="230" y="78.0" text-anchor="middle">socialdemocracia</text>
<text class="sv-tw" style="font-weight:400;font-size:12.0px;letter-spacing:0" x="230" y="93.0" text-anchor="middle">Volumen 2: redistribuir</text>
<text class="sv-tw" style="font-weight:400" x="230" y="108.0" text-anchor="middle">no es criticar;</text>
<text class="sv-tw" style="font-weight:400" x="230" y="123.0" text-anchor="middle">falsos amigos</text>
<rect class="sv-box-ink" x="313" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="380" y="63.0" text-anchor="middle">Independencia</text>
<text class="sv-tw" x="380" y="78.0" text-anchor="middle">política</text>
<text class="sv-tw" style="font-weight:400;font-size:13.5px;letter-spacing:0" x="380" y="93.0" text-anchor="middle">Volumen 3: la clase se</text>
<text class="sv-tw" style="font-weight:400" x="380" y="108.0" text-anchor="middle">constituye en</text>
<text class="sv-tw" style="font-weight:400" x="380" y="123.0" text-anchor="middle">partido; conciencia</text>
<rect class="sv-box-ink" x="463" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="530" y="55.5" text-anchor="middle">Derecho a la</text>
<text class="sv-tw" x="530" y="70.5" text-anchor="middle">revolución</text>
<text class="sv-tw" style="font-weight:400;font-size:13.7px;letter-spacing:0" x="530" y="85.5" text-anchor="middle">Volumen 4: el Estado</text>
<text class="sv-tw" style="font-weight:400" x="530" y="100.5" text-anchor="middle">como forma del</text>
<text class="sv-tw" style="font-weight:400" x="530" y="115.5" text-anchor="middle">capital; derechos</text>
<text class="sv-tw" style="font-weight:400" x="530" y="130.5" text-anchor="middle">como armas</text>
<rect class="sv-box-ink" x="614" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="681" y="70.5" text-anchor="middle">Internacionalismo</text>
<text class="sv-tw" style="font-weight:400;font-size:11.6px;letter-spacing:0" x="681" y="85.5" text-anchor="middle">Volumen 5: Europa como</text>
<text class="sv-tw" style="font-weight:400" x="681" y="100.5" text-anchor="middle">escala mínima; ni</text>
<text class="sv-tw" style="font-weight:400" x="681" y="115.5" text-anchor="middle">OTAN ni BRICS</text>
<rect class="sv-box-red" x="12" y="174" width="736" height="54" rx="2"/>
<text class="sv-tr" x="380" y="205.0" text-anchor="middle">Tarea común: partido comunista de masas, continental e internacional, con instituciones propias</text>
<rect class="sv-box-blue" x="12" y="276" width="134" height="147" rx="2"/>
<text class="sv-tb" x="79" y="301.0" text-anchor="middle">Racionalidad contra</text>
<text class="sv-tb" x="79" y="316.0" text-anchor="middle">adanismo y</text>
<text class="sv-tb" x="79" y="331.0" text-anchor="middle">novedades falsas</text>
<text class="sv-t2" style="font-weight:400" x="79" y="346.0" text-anchor="middle">ciclo revolucionario</text>
<text class="sv-t2" style="font-weight:400" x="79" y="361.0" text-anchor="middle">(#1); neofeudalismo</text>
<text class="sv-t2" style="font-weight:400" x="79" y="376.0" text-anchor="middle">(#2); entrevistas</text>
<text class="sv-t2" style="font-weight:400" x="79" y="391.0" text-anchor="middle">Brassier, Roberts,</text>
<text class="sv-t2" style="font-weight:400" x="79" y="406.0" text-anchor="middle">Merchant, Toscano</text>
<rect class="sv-box-blue" x="162" y="276" width="134" height="147" rx="2"/>
<text class="sv-tb" x="230" y="293.5" text-anchor="middle">El reformismo</text>
<text class="sv-tb" x="230" y="308.5" text-anchor="middle" style="font-size:13.3px;letter-spacing:0">gobernante alimenta</text>
<text class="sv-tb" x="230" y="323.5" text-anchor="middle">la reacción</text>
<text class="sv-t2" style="font-weight:400" x="230" y="338.5" text-anchor="middle">PSOE y Sumar (#1);</text>
<text class="sv-t2" style="font-weight:400" x="230" y="353.5" text-anchor="middle">Weber y la</text>
<text class="sv-t2" style="font-weight:400" x="230" y="368.5" text-anchor="middle">austeridad (#3); IU</text>
<text class="sv-t2" style="font-weight:400" x="230" y="383.5" text-anchor="middle">en el gobierno</text>
<text class="sv-t2" style="font-weight:400" x="230" y="398.5" text-anchor="middle">militarista (#3);</text>
<text class="sv-t2" style="font-weight:400" x="230" y="413.5" text-anchor="middle">inmigración (#4)</text>
<rect class="sv-box-blue" x="313" y="276" width="134" height="147" rx="2"/>
<text class="sv-tb" x="380" y="301.0" text-anchor="middle">Instituciones de la</text>
<text class="sv-tb" x="380" y="316.0" text-anchor="middle">clase</text>
<text class="sv-t2" style="font-weight:400" x="380" y="331.0" text-anchor="middle">movimiento obrero</text>
<text class="sv-t2" style="font-weight:400" x="380" y="346.0" text-anchor="middle">europeo y prensa</text>
<text class="sv-t2" style="font-weight:400" x="380" y="361.0" text-anchor="middle">bolchevique (#2);</text>
<text class="sv-t2" style="font-weight:400" x="380" y="376.0" text-anchor="middle">género y clase (#3);</text>
<text class="sv-t2" style="font-weight:400" x="380" y="391.0" text-anchor="middle">barrios y migrantes</text>
<text class="sv-t2" style="font-weight:400" x="380" y="406.0" text-anchor="middle">(#4)</text>
<rect class="sv-box-blue" x="463" y="276" width="134" height="147" rx="2"/>
<text class="sv-tb" x="530" y="316.0" text-anchor="middle">Coacción, ley y</text>
<text class="sv-tb" x="530" y="331.0" text-anchor="middle">tribuna</text>
<text class="sv-t2" style="font-weight:400" x="530" y="346.0" text-anchor="middle">antiterrorismo (#1);</text>
<text class="sv-t2" style="font-weight:400" x="530" y="361.0" text-anchor="middle">Estado dual y Gladio</text>
<text class="sv-t2" style="font-weight:400" x="530" y="376.0" text-anchor="middle">(#3); legal e</text>
<text class="sv-t2" style="font-weight:400" x="530" y="391.0" text-anchor="middle">ilegal, el juez (#4)</text>
<rect class="sv-box-blue" x="614" y="276" width="134" height="147" rx="2"/>
<text class="sv-tb" x="681" y="301.0" text-anchor="middle">Guerra, Gaza y</text>
<text class="sv-tb" x="681" y="316.0" text-anchor="middle">Europa</text>
<text class="sv-t2" style="font-weight:400" x="681" y="331.0" text-anchor="middle">militarismo y</text>
<text class="sv-t2" style="font-weight:400" x="681" y="346.0" text-anchor="middle">Palestina (#1); OTAN</text>
<text class="sv-t2" style="font-weight:400" x="681" y="361.0" text-anchor="middle">(#3); genocidio y</text>
<text class="sv-t2" style="font-weight:400" x="681" y="376.0" text-anchor="middle">sionismo (#4);</text>
<text class="sv-t2" style="font-weight:400" x="681" y="391.0" text-anchor="middle">Partido Comunista</text>
<text class="sv-t2" style="font-weight:400" x="681" y="406.0" text-anchor="middle">Europeo</text>
<rect class="sv-box-gold" x="12" y="457" width="285" height="102" rx="2"/>
<text class="sv-tg" x="154" y="497.0" text-anchor="middle">Declive del capitalismo: fin de juego,</text>
<text class="sv-tg" x="154" y="512.0" text-anchor="middle">población sobrante</text>
<text class="sv-t2" style="font-weight:400" x="154" y="527.0" text-anchor="middle">lo que la coyuntura añade al marco</text>
<rect class="sv-box-gold" x="313" y="457" width="134" height="102" rx="2"/>
<text class="sv-tg" x="380" y="474.5" text-anchor="middle">Unidad de clase:</text>
<text class="sv-tg" x="380" y="489.5" text-anchor="middle">migrantes y</text>
<text class="sv-tg" x="380" y="504.5" text-anchor="middle">trabajadoras</text>
<text class="sv-t2" style="font-weight:400" x="380" y="519.5" text-anchor="middle">estratificación</text>
<text class="sv-t2" style="font-weight:400" x="380" y="534.5" text-anchor="middle">racial; teoría</text>
<text class="sv-t2" style="font-weight:400" x="380" y="549.5" text-anchor="middle">unitaria</text>
<rect class="sv-box-green" x="463" y="457" width="285" height="102" rx="2"/>
<text class="sv-tgr" x="606" y="497.0" text-anchor="middle">Horizonte: asociación de productores libres</text>
<text class="sv-t2" style="font-weight:400" x="606" y="512.0" text-anchor="middle">la tesis donde los volúmenes dicen más que los</text>
<text class="sv-t2" style="font-weight:400" x="606" y="527.0" text-anchor="middle">números</text>
<path class="sv-line" d="M79 140 V157 H380 V174" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line" d="M230 140 V157 H380 V174" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="380" y1="140" x2="380" y2="174" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line" d="M530 140 V157 H380 V174" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line" d="M681 140 V157 H380 V174" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-dash" d="M380 228 V252 H79 V276" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-dash" d="M380 228 V252 H230 V276" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line-dash" x1="380" y1="228" x2="380" y2="276" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-dash" d="M380 228 V252 H530 V276" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-dash" d="M380 228 V252 H681 V276" marker-end="url(#nc-bib-arrow)"/>
</g>
</svg>
