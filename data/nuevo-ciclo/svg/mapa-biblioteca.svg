<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 427" role="img" aria-label="Mapa de la biblioteca: arriba, los cinco principios que fija cada volumen de Marx XXI; debajo, bajo cada principio, las coyunturas en que Nuevo Ciclo lo pone a prueba; ambas filas desembocan en la tarea común, el partido comunista de masas.">
<defs><marker id="nc-bib-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="164" width="782" height="171" rx="2"/>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(22 89) rotate(-90)" style="font-size:16px;letter-spacing:.2em">MARCO</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(36 89) rotate(-90)" style="letter-spacing:.04em">Marx XXI (principios)</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(22 249.5) rotate(-90)" style="font-size:16px;letter-spacing:.2em">COYUNTURA</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(36 249.5) rotate(-90)" style="letter-spacing:.04em">Nuevo Ciclo (aplicaciones)</text>
<g transform="translate(30 0)">
<rect class="sv-box-ink" x="12" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="79" y="63.0" text-anchor="middle">Qué marxismo</text>
<text class="sv-tw" style="font-weight:400" x="79" y="78.0" text-anchor="middle">Volumen 1: ciencia,</text>
<text class="sv-tw" style="font-weight:400" x="79" y="93.0" text-anchor="middle">filosofía y</text>
<text class="sv-tw" style="font-weight:400" x="79" y="108.0" text-anchor="middle">política; totalidad;</text>
<text class="sv-tw" style="font-weight:400" x="79" y="123.0" text-anchor="middle">Hegel</text>
<rect class="sv-box-ink" x="162" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="230" y="63.0" text-anchor="middle">Contra la</text>
<text class="sv-tw" x="230" y="78.0" text-anchor="middle">socialdemocracia</text>
<text class="sv-tw" style="font-weight:400;font-size:12.0px;letter-spacing:0" x="230" y="93.0" text-anchor="middle">Volumen 2: redistribuir</text>
<text class="sv-tw" style="font-weight:400" x="230" y="108.0" text-anchor="middle">no es criticar;</text>
<text class="sv-tw" style="font-weight:400" x="230" y="123.0" text-anchor="middle">falsos amigos</text>
<rect class="sv-box-ink" x="313" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="380" y="63.0" text-anchor="middle">Independencia</text>
<text class="sv-tw" x="380" y="78.0" text-anchor="middle">política</text>
<text class="sv-tw" style="font-weight:400;font-size:13.5px;letter-spacing:0" x="380" y="93.0" text-anchor="middle">Volumen 3: la clase se</text>
<text class="sv-tw" style="font-weight:400" x="380" y="108.0" text-anchor="middle">constituye en</text>
<text class="sv-tw" style="font-weight:400" x="380" y="123.0" text-anchor="middle">partido; conciencia</text>
<rect class="sv-box-ink" x="463" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="530" y="55.5" text-anchor="middle">Derecho a la</text>
<text class="sv-tw" x="530" y="70.5" text-anchor="middle">revolución</text>
<text class="sv-tw" style="font-weight:400;font-size:13.7px;letter-spacing:0" x="530" y="85.5" text-anchor="middle">Volumen 4: el Estado</text>
<text class="sv-tw" style="font-weight:400" x="530" y="100.5" text-anchor="middle">como forma del</text>
<text class="sv-tw" style="font-weight:400" x="530" y="115.5" text-anchor="middle">capital; derechos</text>
<text class="sv-tw" style="font-weight:400" x="530" y="130.5" text-anchor="middle">como armas</text>
<rect class="sv-box-ink" x="614" y="38" width="134" height="102" rx="2"/>
<text class="sv-tw" x="681" y="70.5" text-anchor="middle">Internacionalismo</text>
<text class="sv-tw" style="font-weight:400;font-size:11.6px;letter-spacing:0" x="681" y="85.5" text-anchor="middle">Volumen 5: Europa como</text>
<text class="sv-tw" style="font-weight:400" x="681" y="100.5" text-anchor="middle">escala mínima; ni</text>
<text class="sv-tw" style="font-weight:400" x="681" y="115.5" text-anchor="middle">OTAN ni BRICS</text>
<rect class="sv-box-blue" x="12" y="176" width="134" height="147" rx="2"/>
<text class="sv-tb" x="79" y="201.0" text-anchor="middle">Racionalidad contra</text>
<text class="sv-tb" x="79" y="216.0" text-anchor="middle">adanismo y</text>
<text class="sv-tb" x="79" y="231.0" text-anchor="middle">novedades falsas</text>
<text class="sv-t2" style="font-weight:400" x="79" y="246.0" text-anchor="middle">ciclo revolucionario</text>
<text class="sv-t2" style="font-weight:400" x="79" y="261.0" text-anchor="middle">(#1); neofeudalismo</text>
<text class="sv-t2" style="font-weight:400" x="79" y="276.0" text-anchor="middle">(#2); entrevistas</text>
<text class="sv-t2" style="font-weight:400" x="79" y="291.0" text-anchor="middle">Brassier, Roberts,</text>
<text class="sv-t2" style="font-weight:400" x="79" y="306.0" text-anchor="middle">Merchant, Toscano</text>
<rect class="sv-box-blue" x="162" y="176" width="134" height="147" rx="2"/>
<text class="sv-tb" x="230" y="193.5" text-anchor="middle">El reformismo</text>
<text class="sv-tb" x="230" y="208.5" text-anchor="middle" style="font-size:13.3px;letter-spacing:0">gobernante alimenta</text>
<text class="sv-tb" x="230" y="223.5" text-anchor="middle">la reacción</text>
<text class="sv-t2" style="font-weight:400" x="230" y="238.5" text-anchor="middle">PSOE y Sumar (#1);</text>
<text class="sv-t2" style="font-weight:400" x="230" y="253.5" text-anchor="middle">Weber y la</text>
<text class="sv-t2" style="font-weight:400" x="230" y="268.5" text-anchor="middle">austeridad (#3); IU</text>
<text class="sv-t2" style="font-weight:400" x="230" y="283.5" text-anchor="middle">en el gobierno</text>
<text class="sv-t2" style="font-weight:400" x="230" y="298.5" text-anchor="middle">militarista (#3);</text>
<text class="sv-t2" style="font-weight:400" x="230" y="313.5" text-anchor="middle">inmigración (#4)</text>
<rect class="sv-box-blue" x="313" y="176" width="134" height="147" rx="2"/>
<text class="sv-tb" x="380" y="201.0" text-anchor="middle">Instituciones de la</text>
<text class="sv-tb" x="380" y="216.0" text-anchor="middle">clase</text>
<text class="sv-t2" style="font-weight:400" x="380" y="231.0" text-anchor="middle">movimiento obrero</text>
<text class="sv-t2" style="font-weight:400" x="380" y="246.0" text-anchor="middle">europeo y prensa</text>
<text class="sv-t2" style="font-weight:400" x="380" y="261.0" text-anchor="middle">bolchevique (#2);</text>
<text class="sv-t2" style="font-weight:400" x="380" y="276.0" text-anchor="middle">género y clase (#3);</text>
<text class="sv-t2" style="font-weight:400" x="380" y="291.0" text-anchor="middle">barrios y migrantes</text>
<text class="sv-t2" style="font-weight:400" x="380" y="306.0" text-anchor="middle">(#4)</text>
<rect class="sv-box-blue" x="463" y="176" width="134" height="147" rx="2"/>
<text class="sv-tb" x="530" y="216.0" text-anchor="middle">Coacción, ley y</text>
<text class="sv-tb" x="530" y="231.0" text-anchor="middle">tribuna</text>
<text class="sv-t2" style="font-weight:400" x="530" y="246.0" text-anchor="middle">antiterrorismo (#1);</text>
<text class="sv-t2" style="font-weight:400" x="530" y="261.0" text-anchor="middle">Estado dual y Gladio</text>
<text class="sv-t2" style="font-weight:400" x="530" y="276.0" text-anchor="middle">(#3); legal e</text>
<text class="sv-t2" style="font-weight:400" x="530" y="291.0" text-anchor="middle">ilegal, el juez (#4)</text>
<rect class="sv-box-blue" x="614" y="176" width="134" height="147" rx="2"/>
<text class="sv-tb" x="681" y="201.0" text-anchor="middle">Guerra, Gaza y</text>
<text class="sv-tb" x="681" y="216.0" text-anchor="middle">Europa</text>
<text class="sv-t2" style="font-weight:400" x="681" y="231.0" text-anchor="middle">militarismo y</text>
<text class="sv-t2" style="font-weight:400" x="681" y="246.0" text-anchor="middle">Palestina (#1); OTAN</text>
<text class="sv-t2" style="font-weight:400" x="681" y="261.0" text-anchor="middle">(#3); genocidio y</text>
<text class="sv-t2" style="font-weight:400" x="681" y="276.0" text-anchor="middle">sionismo (#4);</text>
<text class="sv-t2" style="font-weight:400" x="681" y="291.0" text-anchor="middle">Partido Comunista</text>
<text class="sv-t2" style="font-weight:400" x="681" y="306.0" text-anchor="middle">Europeo</text>
<rect class="sv-box-red" x="12" y="359" width="736" height="54" rx="2"/>
<text class="sv-tr" x="380" y="390.0" text-anchor="middle">Tarea común: partido comunista de masas, continental e internacional, con instituciones propias</text>
