<line class="sv-line" x1="230" y1="140" x2="230" y2="176" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="380" y1="140" x2="380" y2="176" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="530" y1="140" x2="530" y2="176" marker-end="url(#nc-bib-arrow)"/>
