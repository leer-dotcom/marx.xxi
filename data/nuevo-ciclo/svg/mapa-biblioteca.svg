<path class="sv-line-red" d="M230 323 V341 H380 V359" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line-red" x1="380" y1="323" x2="380" y2="359" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-red" d="M530 323 V341 H380 V359" marker-end="url(#nc-bib-arrow)"/>
