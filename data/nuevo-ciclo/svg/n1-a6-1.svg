<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="Trayectoria filosófica de Brassier hacia Marx y diagnóstico político sobre Gaza, unidos por la tesis de que superar el capital es la condición de la razón.">
<defs><marker id="nc-n1a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="251" height="426" rx="2"/>
<text class="sv-t3" x="10" y="27">TRAYECTORIA</text>
<rect class="sv-soft" x="505" y="16" width="251" height="426" rx="2"/>
<text class="sv-t3" x="511" y="27">DIAGNÓSTICO</text>
<rect class="sv-box" x="12" y="38" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="55.5" text-anchor="middle">Posestructuralismo · realismo</text>
<text class="sv-t" x="129" y="70.5" text-anchor="middle">especulativo</text>
<text class="sv-t2" style="font-weight:400" x="129" y="85.5" text-anchor="middle">«comedia de errores»</text>
<rect class="sv-box" x="12" y="125" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="150.0" text-anchor="middle">Badiou: el punto de inflexión</text>
<text class="sv-t2" style="font-weight:400" x="129" y="165.0" text-anchor="middle">comunista y filósofo de primera</text>
<rect class="sv-box" x="12" y="212" width="235" height="48" rx="2"/>
<text class="sv-t" x="129" y="240.0" text-anchor="middle">Hegel: la razón es social (Sellars)</text>
<rect class="sv-box" x="12" y="290" width="235" height="57" rx="2"/>
<text class="sv-t" x="129" y="307.5" text-anchor="middle">Marx: crítica de Hegel</text>
<text class="sv-t2" style="font-weight:400" x="129" y="322.5" text-anchor="middle">las instituciones burguesas dejan un</text>
<text class="sv-t2" style="font-weight:400" x="129" y="337.5" text-anchor="middle">resto de dominación</text>
<rect class="sv-box-blue" x="12" y="377" width="235" height="57" rx="2"/>
<text class="sv-tb" x="129" y="402.0" text-anchor="middle">El capital, «religión cotidiana»,</text>
<text class="sv-tb" x="129" y="417.0" text-anchor="middle">deforma la razón</text>
<rect class="sv-box" x="513" y="38" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="63.0" text-anchor="middle">Academia = funcionarios del Estado</text>
<text class="sv-t" x="631" y="78.0" text-anchor="middle">y del capital</text>
<rect class="sv-box" x="513" y="125" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="142.5" text-anchor="middle">Gaza desnuda la función de la</text>
<text class="sv-t" x="631" y="157.5" text-anchor="middle">universidad</text>
<text class="sv-t2" style="font-weight:400" x="631" y="172.5" text-anchor="middle">4-8 % de filósofos firmantes</text>
<rect class="sv-box" x="513" y="212" width="235" height="48" rx="2"/>
<text class="sv-t" x="631" y="232.5" text-anchor="middle">Líbano: izquierda destruida, BICAR</text>
<text class="sv-t" x="631" y="247.5" text-anchor="middle">como baluarte mínimo</text>
<rect class="sv-box" x="513" y="290" width="235" height="57" rx="2"/>
<text class="sv-t" x="631" y="307.5" text-anchor="middle">Palestina prefigura el futuro:</text>
<text class="sv-t" x="631" y="322.5" text-anchor="middle">población sobrante</text>
<text class="sv-t2" style="font-weight:400" x="631" y="337.5" text-anchor="middle">test del Norte Global</text>
<rect class="sv-box-red" x="513" y="377" width="235" height="57" rx="2"/>
<text class="sv-tr" x="631" y="402.0" text-anchor="middle">Fin de Israel = fin de EE. UU.</text>
<text class="sv-t2" style="font-weight:400" x="631" y="417.0" text-anchor="middle">«Israel les representa»</text>
<rect class="sv-box-red" x="263" y="212" width="235" height="48" rx="2"/>
<text class="sv-tr" x="380" y="232.5" text-anchor="middle">Superar el capital = realizar la</text>
<text class="sv-tr" x="380" y="247.5" text-anchor="middle">razón = lucha antimperialista</text>
<rect class="sv-box-ink" x="263" y="377" width="235" height="57" rx="2"/>
<text class="sv-tw" x="380" y="394.5" text-anchor="middle">Filosofía: llamar al genocidio por</text>
<text class="sv-tw" x="380" y="409.5" text-anchor="middle">su nombre</text>
<text class="sv-tw" style="font-weight:400;font-size:13.9px;letter-spacing:0" x="380" y="424.5" text-anchor="middle">destruir coartadas y racionalizaciones</text>
