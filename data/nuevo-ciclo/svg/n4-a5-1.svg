<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 413" role="img" aria-label="Base imperialista de la cuestión migratoria, doble estrategia de integración dentro y control fuera, los actores que la ejecutan o legitiman, las tres fases históricas y la salida de clase.">
<defs><marker id="nc-n4a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="109" width="752" height="87" rx="2"/>
<text class="sv-t3" x="10" y="120">DOBLE ESTRATEGIA</text>
<rect class="sv-soft" x="4" y="297" width="564" height="102" rx="2"/>
<text class="sv-t3" x="10" y="308">TRES FASES</text>
<rect class="sv-box-ink" x="12" y="30" width="736" height="57" rx="2"/>
<text class="sv-tw" x="380" y="47.5" text-anchor="middle">Imperialismo: desarticulación de las periferias → presión migratoria estructural + estratificación mundial</text>
<text class="sv-tw" x="380" y="62.5" text-anchor="middle">necesaria</text>
<text class="sv-tw" style="font-weight:400" x="380" y="77.5" text-anchor="middle">paz social del centro, realización del valor, arbitraje laboral global: «imperialismo en casa»</text>
<rect class="sv-box-blue" x="12" y="131" width="360" height="57" rx="2"/>
<text class="sv-tb" x="192" y="156.0" text-anchor="middle">Dentro: integración parcial</text>
<text class="sv-t2" style="font-weight:400" x="192" y="171.0" text-anchor="middle">regularizaciones, arraigo individual, Ley Zerolo, sanidad</text>
<rect class="sv-box-red" x="388" y="131" width="360" height="57" rx="2"/>
<text class="sv-tr" x="568" y="148.5" text-anchor="middle">Fuera: control fronterizo</text>
<text class="sv-t2" style="font-weight:400" x="568" y="163.5" text-anchor="middle">CIE, concertinas, externalización, PEMA, cárceles en</text>
<text class="sv-t2" style="font-weight:400" x="568" y="178.5" text-anchor="middle">Mauritania</text>
<rect class="sv-box" x="12" y="218" width="360" height="57" rx="2"/>
<text class="sv-t" x="192" y="235.5" text-anchor="middle">PSOE: perfil de Estado</text>
<text class="sv-t2" style="font-weight:400" x="192" y="250.5" text-anchor="middle">evitar crisis mediáticas; reglamentos dictados por la</text>
<text class="sv-t2" style="font-weight:400" x="192" y="265.5" text-anchor="middle">patronal; fronteras que matan más que las de Meloni</text>
<rect class="sv-box-gold" x="388" y="218" width="360" height="57" rx="2"/>
<text class="sv-tg" x="568" y="235.5" text-anchor="middle">Socialdemocracia radical</text>
<text class="sv-t2" style="font-weight:400" x="568" y="250.5" text-anchor="middle">puntas del iceberg, marco de derechos humanos, derogar la</text>
<text class="sv-t2" style="font-weight:400" x="568" y="265.5" text-anchor="middle">LOEx: «ala izquierda del capital»</text>
<rect class="sv-box" x="12" y="319" width="172" height="72" rx="2"/>
<text class="sv-t" x="98" y="344.0" text-anchor="middle">1985-99</text>
<text class="sv-t2" style="font-weight:400" x="98" y="359.0" text-anchor="middle">LOEx exigida por Bruselas;</text>
<text class="sv-t2" style="font-weight:400" x="98" y="374.0" text-anchor="middle">nace la doble estrategia</text>
<rect class="sv-box" x="200" y="319" width="172" height="72" rx="2"/>
<text class="sv-t" x="286" y="344.0" text-anchor="middle">2000-15</text>
<text class="sv-t2" style="font-weight:400" x="286" y="359.0" text-anchor="middle">CIE, concertinas, Frontex;</text>
<text class="sv-t2" style="font-weight:400" x="286" y="374.0" text-anchor="middle">regularizar para el boom</text>
<rect class="sv-box" x="388" y="319" width="172" height="72" rx="2"/>
<text class="sv-t" x="474" y="336.5" text-anchor="middle">2015-26</text>
<text class="sv-t2" style="font-weight:400" x="474" y="351.5" text-anchor="middle">coalición, 24-J vs.</text>
<text class="sv-t2" style="font-weight:400" x="474" y="366.5" text-anchor="middle">ucranianos, PEMA,</text>
<text class="sv-t2" style="font-weight:400" x="474" y="381.5" text-anchor="middle">regularización de 2026</text>
<rect class="sv-box-red" x="576" y="319" width="172" height="72" rx="2"/>
<text class="sv-tr" x="662" y="336.5" text-anchor="middle">Unidad de clase</text>
<text class="sv-tr" x="662" y="351.5" text-anchor="middle">antimperialista: destruir</text>
<text class="sv-tr" x="662" y="366.5" text-anchor="middle">imperialismo y racismo a</text>
<text class="sv-tr" x="662" y="381.5" text-anchor="middle">la vez</text>
