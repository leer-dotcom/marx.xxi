<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 447" role="img" aria-label="Cuatro paradigmas feministas comparados con la teoría unitaria en cómo explican la opresión y cuál es su límite, con el economicismo como raíz común.">
<defs><marker id="nc-n3a4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="100" width="752" height="132" rx="2"/>
<text class="sv-t3" x="10" y="111">CÓMO EXPLICA LA OPRESIÓN</text>
<rect class="sv-soft" x="4" y="246" width="752" height="117" rx="2"/>
<text class="sv-t3" x="10" y="257">LÍMITE / RESULTADO</text>
<rect class="sv-box-gold" x="12" y="30" width="134" height="48" rx="2"/>
<text class="sv-tg" x="79" y="58.0" text-anchor="middle">Feminismo radical</text>
<rect class="sv-box-gold" x="162" y="30" width="134" height="48" rx="2"/>
<text class="sv-tg" x="230" y="58.0" text-anchor="middle">Feminismo de clase</text>
<rect class="sv-box-gold" x="313" y="30" width="134" height="48" rx="2"/>
<text class="sv-tg" x="380" y="58.0" text-anchor="middle">Interseccionalidad</text>
<rect class="sv-box-gold" x="463" y="30" width="134" height="48" rx="2"/>
<text class="sv-tg" x="530" y="58.0" text-anchor="middle">Teoría queer</text>
<rect class="sv-box-red" x="614" y="30" width="134" height="48" rx="2"/>
<text class="sv-tr" x="681" y="50.5" text-anchor="middle">Teoría unitaria</text>
<text class="sv-tr" x="681" y="65.5" text-anchor="middle">(Vogel)</text>
<rect class="sv-box" x="12" y="122" width="134" height="102" rx="2"/>
<text class="sv-t" x="79" y="162.0" text-anchor="middle">Patriarcado</text>
<text class="sv-t" x="79" y="177.0" text-anchor="middle">transhistórico de</text>
<text class="sv-t" x="79" y="192.0" text-anchor="middle">raíz biológica</text>
<rect class="sv-box" x="162" y="122" width="134" height="102" rx="2"/>
<text class="sv-t" x="230" y="162.0" text-anchor="middle">Doble opresión: la</text>
<text class="sv-t" x="230" y="177.0" text-anchor="middle">mujer trabajadora y</text>
<text class="sv-t" x="230" y="192.0" text-anchor="middle">los cuidados</text>
<rect class="sv-box" x="313" y="122" width="134" height="102" rx="2"/>
<text class="sv-t" x="380" y="154.5" text-anchor="middle">Vectores de</text>
<text class="sv-t" x="380" y="169.5" text-anchor="middle">opresión</text>
<text class="sv-t" x="380" y="184.5" text-anchor="middle">entrecruzados; la</text>
<text class="sv-t" x="380" y="199.5" text-anchor="middle">clase, uno más</text>
<rect class="sv-box" x="463" y="122" width="134" height="102" rx="2"/>
<text class="sv-t" x="530" y="162.0" text-anchor="middle">Identidades que</text>
<text class="sv-t" x="530" y="177.0" text-anchor="middle">disciplinan;</text>
<text class="sv-t" x="530" y="192.0" text-anchor="middle">crítica lingüística</text>
<rect class="sv-box-red" x="614" y="122" width="134" height="102" rx="2"/>
<text class="sv-tr" x="681" y="139.5" text-anchor="middle">Lucha de clases</text>
<text class="sv-tr" x="681" y="154.5" text-anchor="middle">como piedra</text>
<text class="sv-tr" x="681" y="169.5" text-anchor="middle">angular: el género</text>
<text class="sv-tr" x="681" y="184.5" text-anchor="middle">es una relación</text>
<text class="sv-tr" x="681" y="199.5" text-anchor="middle">capitalista</text>
<text class="sv-tr" x="681" y="214.5" text-anchor="middle">(familia nuclear)</text>
<rect class="sv-box" x="12" y="268" width="134" height="87" rx="2"/>
<text class="sv-t" x="79" y="293.0" text-anchor="middle">Esencialismo: terfs</text>
<text class="sv-t" x="79" y="308.0" text-anchor="middle">aliadas con la</text>
<text class="sv-t" x="79" y="323.0" text-anchor="middle">reacción y los</text>
<text class="sv-t" x="79" y="338.0" text-anchor="middle">«rojipardos»</text>
<rect class="sv-box" x="162" y="268" width="134" height="87" rx="2"/>
<text class="sv-t" x="230" y="300.5" text-anchor="middle" style="font-size:13.5px;letter-spacing:0">Sujeto fragmentado;</text>
<text class="sv-t" x="230" y="315.5" text-anchor="middle">no rompe el</text>
<text class="sv-t" x="230" y="330.5" text-anchor="middle">dualismo</text>
<rect class="sv-box" x="313" y="268" width="134" height="87" rx="2"/>
<text class="sv-t" x="380" y="300.5" text-anchor="middle">Relativismo</text>
<text class="sv-t" x="380" y="315.5" text-anchor="middle">interclasista; sin</text>
<text class="sv-t" x="380" y="330.5" text-anchor="middle">sujeto ni programa</text>
<rect class="sv-box" x="463" y="268" width="134" height="87" rx="2"/>
<text class="sv-t" x="530" y="300.5" text-anchor="middle">«Islas de</text>
<text class="sv-t" x="530" y="315.5" text-anchor="middle" style="font-size:13.6px;letter-spacing:0">indeterminación» en</text>
<text class="sv-t" x="530" y="330.5" text-anchor="middle">los márgenes</text>
<rect class="sv-box-red" x="614" y="268" width="134" height="87" rx="2"/>
<text class="sv-tr" x="681" y="285.5" text-anchor="middle">Recomposición del</text>
<text class="sv-tr" x="681" y="300.5" text-anchor="middle">proletariado como</text>
<text class="sv-tr" x="681" y="315.5" text-anchor="middle">sujeto, sin</text>
<text class="sv-tr" x="681" y="330.5" text-anchor="middle">economicismo;</text>
<text class="sv-tr" x="681" y="345.5" text-anchor="middle">alianzas parciales</text>
<rect class="sv-box-ink" x="12" y="385" width="586" height="48" rx="2"/>
<text class="sv-tw" x="305" y="405.5" text-anchor="middle">Raíz común: economicismo y dualismo heredados del movimiento comunista</text>
<text class="sv-tw" style="font-weight:400" x="305" y="420.5" text-anchor="middle">si la clase es sólo economía, el género es «cultura» de un sistema paralelo</text>
<path class="sv-line-dash" d="M305 385 V370 H79 V355" marker-end="url(#nc-n3a4-arrow)"/>
<path class="sv-line-dash" d="M305 385 V370 H230 V355" marker-end="url(#nc-n3a4-arrow)"/>
<path class="sv-line-dash" d="M305 385 V370 H380 V355" marker-end="url(#nc-n3a4-arrow)"/>
<path class="sv-line-dash" d="M305 385 V370 H530 V355" marker-end="url(#nc-n3a4-arrow)"/>
</svg>
