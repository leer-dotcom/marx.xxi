<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" role="img" aria-label="Cadena causal del «fin de juego» de Merchant: de la contradicción entre fuerzas productivas y valorización a las tres formas del capitalismo en declive y a las dos respuestas enfrentadas.">
<defs><marker id="nc-n3a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-ink" x="12" y="30" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="58.0" text-anchor="middle">Contradicción: desarrollar las fuerzas productivas más allá de los límites de la valorización</text>
<rect class="sv-box" x="12" y="108" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="128.5" text-anchor="middle">Caída de la rentabilidad, la productividad y la inversión (composición orgánica alta) → crecimiento de suma cero</text>
<text class="sv-t2" style="font-weight:400" x="380" y="143.5" text-anchor="middle">«la economía privada capitalista está muriendo»; la polarización es consecuencia, no causa</text>
<rect class="sv-box" x="12" y="186" width="235" height="72" rx="2"/>
<text class="sv-t" x="129" y="211.0" text-anchor="middle">Capitalismo de Estado de nuevo tipo</text>
<text class="sv-t2" style="font-weight:400" x="129" y="226.0" text-anchor="middle">subsidios, deuda pública, política</text>
<text class="sv-t2" style="font-weight:400" x="129" y="241.0" text-anchor="middle">industrial (Biden)</text>
<rect class="sv-box" x="263" y="186" width="235" height="72" rx="2"/>
<text class="sv-t" x="380" y="211.0" text-anchor="middle">Neoimperialismo «mafioso»</text>
<text class="sv-t2" style="font-weight:400" x="380" y="226.0" text-anchor="middle">aranceles, Venezuela, Groenlandia,</text>
<text class="sv-t2" style="font-weight:400" x="380" y="241.0" text-anchor="middle">Ormuz</text>
<rect class="sv-box-red" x="513" y="186" width="235" height="72" rx="2"/>
<text class="sv-tr" x="631" y="203.5" text-anchor="middle">Estado de mano dura</text>
<text class="sv-t2" style="font-weight:400" x="631" y="218.5" text-anchor="middle">DHS, ICE: fascismo que emerge desde el</text>
<text class="sv-t2" style="font-weight:400" x="631" y="233.5" text-anchor="middle">Estado en una era prolongada de</text>
<text class="sv-t2" style="font-weight:400" x="631" y="248.5" text-anchor="middle">colapso</text>
<rect class="sv-box-gold" x="12" y="288" width="360" height="72" rx="2"/>
<text class="sv-tg" x="192" y="305.5" text-anchor="middle">Reformismo</text>
<text class="sv-t2" style="font-weight:400" x="192" y="320.5" text-anchor="middle">nacionalismo económico de izquierdas, «fantasías de</text>
<text class="sv-t2" style="font-weight:400" x="192" y="335.5" text-anchor="middle">secesión», socialismo de mercado, triangulación: «condenado</text>
<text class="sv-t2" style="font-weight:400" x="192" y="350.5" text-anchor="middle">a empoderar a la derecha»</text>
<rect class="sv-box-red" x="388" y="288" width="360" height="72" rx="2"/>
<text class="sv-tr" x="568" y="313.0" text-anchor="middle">Estrategia continental</text>
<text class="sv-t2" style="font-weight:400" x="568" y="328.0" text-anchor="middle">Partido Comunista Europeo, nuevas instituciones de lucha de</text>
<text class="sv-t2" style="font-weight:400" x="568" y="343.0" text-anchor="middle">clases, nueva Internacional</text>
<line class="sv-line" x1="380" y1="78" x2="380" y2="108" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M380 156 V171 H129 V186" marker-end="url(#nc-n3a6-arrow)"/>
<line class="sv-line" x1="380" y1="156" x2="380" y2="186" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M380 156 V171 H631 V186" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line-red" d="M631 258 V273 H568 V288" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line-dash" d="M129 258 V273 H192 V288" marker-end="url(#nc-n3a6-arrow)"/>
</svg>
