<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos columnas enfrentadas, democracia por y para el demos frente a oligarquía por y para los pocos, unidas por el ciclo guerra-revolución; a la izquierda las reformas como válvula de escape del miedo a la revolución, a la derecha la seudodemocracia liberal y el fascismo como dos máscaras de la misma oligarquía." viewBox="0 0 760 464" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="276" width="326" height="162" rx="2"/>
<text class="sv-t3" x="320" y="288" text-anchor="end">REFORMAS = VÁLVULA DE ESCAPE</text>
<rect class="sv-soft" x="430" y="276" width="326" height="162" rx="2"/>
<text class="sv-t3" x="746" y="288" text-anchor="end">DOS MÁSCARAS DE LA MISMA OLIGARQUÍA</text>
<rect class="sv-box-blue" x="12" y="30" width="310" height="52" rx="2"/>
<text class="sv-tb" x="167" y="52.5" text-anchor="middle">Democracia: por y para el demos</text>
<text class="sv-t2" style="font-size:12px" x="167" y="67.5" text-anchor="middle">los oi polloi, «la mayoría» o «los muchos»</text>
<rect class="sv-box" x="438" y="30" width="310" height="52" rx="2"/>
<text class="sv-t" x="593" y="52.5" text-anchor="middle">Oligarquía: por y para los oligoi</text>
<text class="sv-t2" style="font-size:12px" x="593" y="67.5" text-anchor="middle">la élite, «la minoría» o «los pocos»</text>
<rect class="sv-box" x="12" y="112" width="310" height="52" rx="2"/>
<text class="sv-t" x="167" y="134.5" text-anchor="middle">Revolución genuina</text>
<text class="sv-t2" style="font-size:12px" x="167" y="149.5" text-anchor="middle">1789, 1917, Revolución china</text>
<rect class="sv-box" x="438" y="112" width="310" height="52" rx="2"/>
<text class="sv-t" x="593" y="134.5" text-anchor="middle">Guerra</text>
<text class="sv-t2" style="font-size:12px" x="593" y="149.5" text-anchor="middle">1914 · Segunda Guerra Mundial</text>
<rect class="sv-box-blue" x="12" y="194" width="310" height="52" rx="2"/>
<text class="sv-tb" x="167" y="216.5" text-anchor="middle">Democratización</text>
<text class="sv-t2" style="font-size:12px" x="167" y="231.5" text-anchor="middle">conquistas para las clases populares</text>
<rect class="sv-box" x="438" y="194" width="310" height="52" rx="2"/>
<text class="sv-t" x="593" y="216.5" text-anchor="middle">Contrarrevolución</text>
<text class="sv-t2" style="font-size:12px" x="593" y="231.5" text-anchor="middle">frena o revierte la democratización</text>
<rect class="sv-box-gold" x="12" y="298" width="310" height="52" rx="2"/>
<text class="sv-tg" x="167" y="320.5" text-anchor="middle">Miedo a la revolución</text>
<text class="sv-t2" style="font-size:12px" x="167" y="335.5" text-anchor="middle">élites tras 1917 y 1945</text>
<rect class="sv-box-gold" x="12" y="376" width="310" height="52" rx="2"/>
<text class="sv-tg" x="167" y="398.5" text-anchor="middle">Concesiones</text>
<text class="sv-t2" style="font-size:12px" x="167" y="413.5" text-anchor="middle">8 horas, Estado del bienestar</text>
<rect class="sv-box-red" x="438" y="298" width="310" height="52" rx="2"/>
<text class="sv-tr" x="593" y="320.5" text-anchor="middle">Seudodemocracia liberal</text>
<text class="sv-t2" style="font-size:12px" x="593" y="335.5" text-anchor="middle">«parece y huele a democracia»</text>
<rect class="sv-box-ink" x="438" y="376" width="310" height="52" rx="2"/>
<text class="sv-tw" x="593" y="398.5" text-anchor="middle">Fascismo</text>
<text class="sv-tw" style="font-size:12px;font-weight:400" x="593" y="413.5" text-anchor="middle">gobierno de la clase alta</text>
<line class="sv-line" x1="167" y1="82" x2="167" y2="112" marker-end="url(#nc-n5a6-arrow)"/>
<line class="sv-line" x1="593" y1="82" x2="593" y2="112" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="173" y="101">obra del demos</text>
<text class="sv-t3" x="599" y="101">obra de las élites</text>
<text class="sv-t3" x="380" y="60" text-anchor="middle">frente a</text>
<line class="sv-line" x1="167" y1="164" x2="167" y2="194" marker-end="url(#nc-n5a6-arrow)"/>
<line class="sv-line" x1="593" y1="164" x2="593" y2="194" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="173" y="183">avanza la</text>
<text class="sv-t3" x="599" y="183">sirve a la</text>
<line class="sv-line-red" x1="438" y1="124" x2="322" y2="124" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="380" y="140" text-anchor="middle">pauperiza →</text>
<text class="sv-t3" x="380" y="152" text-anchor="middle">nueva revolución</text>
<path class="sv-line-red" d="M322 214 H428 V179 H478 V164" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="372" y="230" text-anchor="middle">las élites</text>
<text class="sv-t3" x="372" y="242" text-anchor="middle">responden</text>
<text class="sv-t3" x="372" y="254" text-anchor="middle">con la guerra</text>
<path class="sv-line" d="M167 246 V261 H42 V298" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="173" y="258">espectro de la revolución</text>
<path class="sv-line" d="M593 246 V261 H468 V298" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="599" y="258">dos formas</text>
<line class="sv-line" x1="167" y1="350" x2="167" y2="376" marker-end="url(#nc-n5a6-arrow)"/>
<text class="sv-t3" x="173" y="367">concede para evitar la revolución</text>
<line class="sv-line-dash" x1="593" y1="350" x2="593" y2="376"/>
<text class="sv-t3" x="599" y="367">la burguesía prefiere ésta</text>
<text class="sv-t3" x="12" y="450">FLECHA ROJA: CICLO GUERRA-REVOLUCIÓN · DISCONTINUA: MISMA OLIGARQUÍA</text>
</svg>
