<text class="sv-t3" x="24" y="70">SIN</text>
<text class="sv-t3" x="24" y="84">AUTOCRÍTICA</text>
<rect class="sv-box-red" x="140" y="382" width="230" height="48" rx="2"/>
<text class="sv-tr" x="255.0" y="402.5" text-anchor="middle">Venezuela: neocolonia</text>
<text class="sv-t2" style="font-weight:400" x="255.0" y="417.5" text-anchor="middle">secuestro de Maduro y pacto armado</text>
<rect class="sv-box-red" x="390" y="382" width="230" height="48" rx="2"/>
<text class="sv-tr" x="505.0" y="402.5" text-anchor="middle">Cuba asediada</text>
<text class="sv-t2" style="font-weight:400" x="505.0" y="417.5" text-anchor="middle">corte del petróleo · asedio naval</text>
