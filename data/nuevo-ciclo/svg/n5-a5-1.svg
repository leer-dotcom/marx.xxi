<path class="sv-line-red" d="M600 238 H648 V286" marker-end="url(#nc-n5a5-arrow)"/>
<text class="sv-t3" x="136" y="272">RUEDA DE HÁMSTER</text>
<text class="sv-t3" x="386" y="276">CONTRARREVOLUCIÓN (BENJAMIN)</text>
<text class="sv-t3" x="654" y="272">SALIDA</text>
