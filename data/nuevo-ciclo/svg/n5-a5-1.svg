<text class="sv-t2" x="165" y="468" text-anchor="middle">2002</text>
<text class="sv-t3" x="165" y="492" text-anchor="middle">PORTO ALEGRE</text>
<circle class="sv-dot" cx="280" cy="476" r="4"/>
<text class="sv-t2" x="280" y="468" text-anchor="middle">2007</text>
<text class="sv-t3" x="280" y="492" text-anchor="middle">MARTINS RODRIGUES</text>
<circle class="sv-dot" cx="395" cy="476" r="4"/>
<text class="sv-t2" x="395" y="468" text-anchor="middle">2011</text>
<text class="sv-t3" x="395" y="492" text-anchor="middle">11 GOBIERNOS</text>
<circle class="sv-dot" cx="490" cy="476" r="4"/>
<text class="sv-t2" x="490" y="468" text-anchor="middle">2018</text>
<text class="sv-t3" x="490" y="492" text-anchor="middle">5 GOBIERNOS</text>
<circle class="sv-dot" cx="585" cy="476" r="4"/>
<text class="sv-t2" x="585" y="468" text-anchor="middle">2019-22</text>
<text class="sv-t3" x="585" y="492" text-anchor="middle">SEGUNDA OLA</text>
<circle class="sv-dot" cx="690" cy="476" r="4"/>
<text class="sv-t2" x="690" y="468" text-anchor="middle">TRUMP II</text>
<text class="sv-t3" x="690" y="492" text-anchor="middle">OLA NEGRA</text>
<text class="sv-t3" x="12" y="522">LÍNEA DISCONTINUA: VUELTA AL REFORMISMO SIN AUTOCRÍTICA · FLECHA ROJA: SALIDA QUE PROPONE EL ARTÍCULO</text>
