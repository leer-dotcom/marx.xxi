<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rueda de la ola rosa latinoamericana: el soberanismo reformista gira sobre las tres dependencias que señaló Martins Rodrigues, se agota entre 2011 y 2018 y abre la ola negra tutelada por EE. UU. (Venezuela neocolonia, Cuba asediada); la segunda ola «sanchista» devuelve al inicio y el partido revolucionario de masas es la salida que propone el artículo. Debajo, línea temporal de 1998 a Trump II." viewBox="0 0 760 532" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box" x="180" y="14" width="400" height="48" rx="2"/>
<text class="sv-t" x="380.0" y="34.5" text-anchor="middle">Ola rosa (desde 1998): soberanismo reformista</text>
<text class="sv-t2" style="font-weight:400" x="380.0" y="49.5" text-anchor="middle">Chávez 1998 · nacionalizaciones + renta de los hidrocarburos</text>
<rect class="sv-soft" x="4" y="86" width="752" height="104" rx="2"/>
<text class="sv-t3" x="140" y="97">TRES MOTIVOS DE CADUCIDAD</text>
<text class="sv-t3" x="392" y="97">SEGÚN MARTINS RODRIGUES, 2007</text>
<rect class="sv-box" x="12" y="108" width="236" height="72" rx="2"/>
<text class="sv-t" x="130.0" y="133" text-anchor="middle">Dependencia de los</text>
<text class="sv-t" x="130.0" y="148" text-anchor="middle">hidrocarburos</text>
<text class="sv-t2" style="font-weight:400" x="130.0" y="163" text-anchor="middle">ciclos volátiles del capital</text>
<rect class="sv-box" x="262" y="108" width="236" height="72" rx="2"/>
<text class="sv-t" x="380.0" y="133" text-anchor="middle">Dependencia de otras</text>
<text class="sv-t" x="380.0" y="148" text-anchor="middle">potencias</text>
<text class="sv-t2" style="font-weight:400" x="380.0" y="163" text-anchor="middle">China, Rusia: igual de predatorias</text>
<rect class="sv-box" x="512" y="108" width="236" height="72" rx="2"/>
<text class="sv-t" x="630.0" y="133" text-anchor="middle">Lucha popular encerrada</text>
<text class="sv-t" x="630.0" y="148" text-anchor="middle">en el régimen nacionalista</text>
<text class="sv-t2" style="font-weight:400" x="630.0" y="163" text-anchor="middle">aparato militar apenas reformado</text>
<path class="sv-line" d="M380 62 V74 H130 V108" marker-end="url(#nc-n5a5-arrow)"/>
<line class="sv-line" x1="380" y1="62" x2="380" y2="108" marker-end="url(#nc-n5a5-arrow)"/>
<path class="sv-line" d="M380 62 V74 H630 V108" marker-end="url(#nc-n5a5-arrow)"/>
<rect class="sv-box" x="160" y="214" width="440" height="48" rx="2"/>
<text class="sv-t" x="380.0" y="234.5" text-anchor="middle">Agotamiento del ciclo (2011-2018)</text>
<text class="sv-t2" style="font-weight:400" x="380.0" y="249.5" text-anchor="middle">cae el petróleo · 11 gobiernos de izquierda (2011) → 5 (2018)</text>
<path class="sv-line" d="M130 180 V196 H380 V214" marker-end="url(#nc-n5a5-arrow)"/>
<line class="sv-line" x1="380" y1="180" x2="380" y2="214" marker-end="url(#nc-n5a5-arrow)"/>
<path class="sv-line" d="M630 180 V196 H380 V214" marker-end="url(#nc-n5a5-arrow)"/>
<rect class="sv-box-gold" x="30" y="286" width="200" height="72" rx="2"/>
<text class="sv-tg" x="130.0" y="311" text-anchor="middle">Segunda ola (2019-2022):</text>
<text class="sv-tg" x="130.0" y="326" text-anchor="middle">«sanchistas»</text>
<text class="sv-t2" style="font-weight:400" x="130.0" y="341" text-anchor="middle">Petro, Boric, Lula</text>
<rect class="sv-box-red" x="250" y="286" width="260" height="72" rx="2"/>
<text class="sv-tr" x="380.0" y="318.5" text-anchor="middle">Ola negra + injerencia de EE. UU.</text>
<text class="sv-t2" style="font-weight:400" x="380.0" y="333.5" text-anchor="middle">Bolsonaro, Bukele, Milei, Kast…</text>
<rect class="sv-box-ink" x="548" y="286" width="200" height="72" rx="2"/>
<text class="sv-tw" x="648.0" y="311" text-anchor="middle">Partido revolucionario</text>
<text class="sv-tw" x="648.0" y="326" text-anchor="middle">de masas, continental e</text>
<text class="sv-tw" x="648.0" y="341" text-anchor="middle">internacionalista</text>
