<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos filas enfrentadas al modo del 18 Brumario: arriba el Podemos original, del 15-M al Gobierno de coalición; abajo el Podemos actual, que repite el mismo plan en peores condiciones; ambas se explican por el populismo como forma de la socialdemocracia en crisis, y de ahí salen la marca agotada y la tarea del partido comunista de masas." viewBox="0 0 760 422" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="14" width="728" height="104" rx="2"/>
<text class="sv-t3" x="12" y="27">EL PODEMOS ORIGINAL (2011-2019) · LA PRIMERA FARSA</text>
<rect class="sv-box" x="12" y="40" width="228" height="66" rx="2"/>
<text class="sv-t" x="126.0" y="63.0" text-anchor="middle">15-M (2011) → Marchas de la</text>
<text class="sv-t" x="126.0" y="78.0" text-anchor="middle">Dignidad (2014)</text>
<text class="sv-t2" x="126.0" y="93.0" text-anchor="middle">la fase movimentista se agota</text>
<rect class="sv-box" x="252" y="40" width="228" height="66" rx="2"/>
<text class="sv-t" x="366.0" y="63.0" text-anchor="middle">Podemos (2015): sorpasso al</text>
<text class="sv-t" x="366.0" y="78.0" text-anchor="middle">PSOE</text>
<text class="sv-t2" x="366.0" y="93.0" text-anchor="middle">para gobernar con Sánchez</text>
<rect class="sv-box" x="492" y="40" width="228" height="66" rx="2"/>
<text class="sv-t" x="606.0" y="55.5" text-anchor="middle">Gobierno PSOE-UP</text>
<text class="sv-t" x="606.0" y="70.5" text-anchor="middle">(desde 2019)</text>
<text class="sv-t2" x="606.0" y="85.5" text-anchor="middle">ministerialismo: programa</text>
<text class="sv-t2" x="606.0" y="100.5" text-anchor="middle">abandonado</text>
<rect class="sv-soft" x="4" y="142" width="728" height="104" rx="2"/>
<text class="sv-t3" x="12" y="239">EL PODEMOS ACTUAL (2025-2027) · LA FARSA DE OTRA FARSA</text>
<rect class="sv-box" x="12" y="154" width="228" height="66" rx="2"/>
<text class="sv-t" x="126.0" y="177.0" text-anchor="middle">Ruptura con Sumar: pose</text>
<text class="sv-t" x="126.0" y="192.0" text-anchor="middle">antiguerra</text>
<text class="sv-t2" x="126.0" y="207.0" text-anchor="middle">como si nunca hubiera gobernado</text>
<rect class="sv-box" x="252" y="154" width="228" height="66" rx="2"/>
<text class="sv-t" x="366.0" y="169.5" text-anchor="middle">Plan Diario Red (2025):</text>
<text class="sv-t" x="366.0" y="184.5" text-anchor="middle">sorpasso a Sumar</text>
<text class="sv-t2" x="366.0" y="199.5" text-anchor="middle">para gobernar otra vez con el</text>
<text class="sv-t2" x="366.0" y="214.5" text-anchor="middle">PSOE</text>
<rect class="sv-box" x="492" y="154" width="228" height="66" rx="2"/>
<text class="sv-t" x="606.0" y="169.5" text-anchor="middle">Por Andalucía ·</text>
<text class="sv-t" x="606.0" y="184.5" text-anchor="middle">Montero-Rufián</text>
<text class="sv-t2" x="606.0" y="199.5" text-anchor="middle">disputar el liderazgo de la</text>
<text class="sv-t2" x="606.0" y="214.5" text-anchor="middle">unidad</text>
<path class="sv-line" d="M240 73.0 H252" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line" d="M480 73.0 H492" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line" d="M240 187.0 H252" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line" d="M480 187.0 H492" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line-dash" d="M126.0 106 V154" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line-dash" d="M366.0 106 V154" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line-dash" d="M606.0 106 V154" marker-end="url(#nc-n5a2-arrow)"/>
<text class="sv-t3" x="374.0" y="133" text-anchor="start">repite, en peores condiciones</text>
<rect class="sv-box-ink" x="12" y="276" width="736" height="52" rx="2"/>
<text class="sv-tw" x="380.0" y="299.5" text-anchor="middle">Populismo = forma de la socialdemocracia en crisis · Estado no neutral</text>
<text class="sv-tw" x="380.0" y="314.5" text-anchor="middle" style="font-size:13px;font-weight:400">fines oficiales ≠ fines reales: gobernar el Estado capitalista de la mano del PSOE</text>
<path class="sv-line" d="M720 73.0 H746 V302.0"/>
<path class="sv-line" d="M720 187.0 H746 V302.0 H748" marker-end="url(#nc-n5a2-arrow)"/>
<text class="sv-t3" x="732" y="266" text-anchor="end">raíz común de ambas</text>
<rect class="sv-box" x="12" y="356" width="356" height="52" rx="2"/>
<text class="sv-t" x="190.0" y="379.5" text-anchor="middle">Podemos: la marca está agotada</text>
<text class="sv-t2" x="190.0" y="394.5" text-anchor="middle">«no tiene futuro, solo pasado»; techo del 4-5 %</text>
<rect class="sv-box-red" x="392" y="356" width="356" height="52" rx="2"/>
<text class="sv-tr" x="570.0" y="379.5" text-anchor="middle">Nuevo ciclo: partido comunista de masas</text>
<text class="sv-t2" x="570.0" y="394.5" text-anchor="middle">herramienta nueva, arraigada en las luchas reales</text>
<path class="sv-line" d="M380 328 V342 H190 V356" marker-end="url(#nc-n5a2-arrow)"/>
<path class="sv-line-red" d="M380 328 V342 H570 V356" marker-end="url(#nc-n5a2-arrow)"/>
</svg>
