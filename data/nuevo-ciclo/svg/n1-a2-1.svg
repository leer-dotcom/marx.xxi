<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" role="img" aria-label="Historia de las posiciones marxistas ante la guerra y matriz de las posiciones actuales de la izquierda, todas ellas refutadas por el carácter estructural del militarismo.">
<defs><marker id="nc-n1a2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="564" height="117" rx="2"/>
<text class="sv-t3" x="10" y="27">HISTORIA DE LAS POSICIONES ANTE LA GUERRA</text>
<rect class="sv-soft" x="4" y="147" width="752" height="117" rx="2"/>
<text class="sv-t3" x="10" y="158">POSICIONES ACTUALES DE LA IZQUIERDA</text>
<rect class="sv-box" x="12" y="38" width="172" height="87" rx="2"/>
<text class="sv-t" x="98" y="55.5" text-anchor="middle">Marx y Engels 1848-1871</text>
<text class="sv-t2" style="font-weight:400" x="98" y="70.5" text-anchor="middle">guerras civiles</text>
<text class="sv-t2" style="font-weight:400" x="98" y="85.5" text-anchor="middle">revolucionarias; con la</text>
<text class="sv-t2" style="font-weight:400" x="98" y="100.5" text-anchor="middle">Comuna, la guerra nacional</text>
<text class="sv-t2" style="font-weight:400" x="98" y="115.5" text-anchor="middle">es una añagaza</text>
<rect class="sv-box" x="200" y="38" width="172" height="87" rx="2"/>
<text class="sv-t" x="286" y="55.5" text-anchor="middle">II Internacional</text>
<text class="sv-t" x="286" y="70.5" text-anchor="middle">1889-1914</text>
<text class="sv-t2" style="font-weight:400" x="286" y="85.5" text-anchor="middle">resoluciones correctas,</text>
<text class="sv-t2" style="font-weight:400" x="286" y="100.5" text-anchor="middle">créditos de guerra:</text>
<text class="sv-t2" style="font-weight:400" x="286" y="115.5" text-anchor="middle">pacifismo vs. derrotismo</text>
<rect class="sv-box" x="388" y="38" width="172" height="87" rx="2"/>
<text class="sv-t" x="474" y="55.5" text-anchor="middle">Komintern y guerra fría</text>
<text class="sv-t2" style="font-weight:400" x="474" y="70.5" text-anchor="middle">derrotismo abandonado;</text>
<text class="sv-t2" style="font-weight:400" x="474" y="85.5" text-anchor="middle">frentes únicos,</text>
<text class="sv-t2" style="font-weight:400" x="474" y="100.5" text-anchor="middle">finlandización,</text>
<text class="sv-t2" style="font-weight:400" x="474" y="115.5" text-anchor="middle">eurocomunismo</text>
<rect class="sv-box-ink" x="576" y="38" width="172" height="87" rx="2"/>
<text class="sv-tw" x="662" y="63.0" text-anchor="middle">Militarismo = condición</text>
<text class="sv-tw" x="662" y="78.0" text-anchor="middle">estructural del Estado</text>
<text class="sv-tw" x="662" y="93.0" text-anchor="middle">capitalista</text>
<text class="sv-tw" style="font-weight:400;font-size:13.5px;letter-spacing:0" x="662" y="108.0" text-anchor="middle">no una cuestión de voluntad</text>
<rect class="sv-box-gold" x="12" y="169" width="172" height="87" rx="2"/>
<text class="sv-tg" x="98" y="201.5" text-anchor="middle">Socialchovinismo liberal</text>
<text class="sv-t2" style="font-weight:400" x="98" y="216.5" text-anchor="middle">PSOE: rearme «en interés de</text>
<text class="sv-t2" style="font-weight:400" x="98" y="231.5" text-anchor="middle">España»</text>
<rect class="sv-box-gold" x="200" y="169" width="172" height="87" rx="2"/>
<text class="sv-tg" x="286" y="186.5" text-anchor="middle">Socialchovinismo</text>
<text class="sv-tg" x="286" y="201.5" text-anchor="middle">espontaneísta</text>
<text class="sv-t2" style="font-weight:400" x="286" y="216.5" text-anchor="middle">morenismo: apoyar al</text>
<text class="sv-t2" style="font-weight:400" x="286" y="231.5" text-anchor="middle">«pueblo en armas» sin</text>
<text class="sv-t2" style="font-weight:400" x="286" y="246.5" text-anchor="middle">independencia</text>
<rect class="sv-box-gold" x="388" y="169" width="172" height="87" rx="2"/>
<text class="sv-tg" x="474" y="194.0" text-anchor="middle">Pacifismo abstracto</text>
<text class="sv-t2" style="font-weight:400" x="474" y="209.0" text-anchor="middle">Podemos, Más País, IU:</text>
<text class="sv-t2" style="font-weight:400" x="474" y="224.0" text-anchor="middle">belicistas al pisar el</text>
<text class="sv-t2" style="font-weight:400" x="474" y="239.0" text-anchor="middle">gobierno</text>
<rect class="sv-box-gold" x="576" y="169" width="172" height="87" rx="2"/>
<text class="sv-tg" x="662" y="194.0" text-anchor="middle">Pacifismo multipolar</text>
<text class="sv-t2" style="font-weight:400" x="662" y="209.0" text-anchor="middle">campismo pro-China:</text>
<text class="sv-t2" style="font-weight:400" x="662" y="224.0" text-anchor="middle">ultraimperialismo</text>
<text class="sv-t2" style="font-weight:400" x="662" y="239.0" text-anchor="middle">kautskiano</text>
<rect class="sv-box-red" x="12" y="286" width="736" height="57" rx="2"/>
<text class="sv-tr" x="380" y="303.5" text-anchor="middle">Derrotismo e independencia de clase: cinco tareas — «el enemigo principal está en casa»</text>
<text class="sv-t2" style="font-weight:400" x="380" y="318.5" text-anchor="middle">propaganda · programa (milicia, EE. UU. de Europa) · crítica del campismo y del soberanismo · independencia de clase ·</text>
<text class="sv-t2" style="font-weight:400" x="380" y="333.5" text-anchor="middle">respuesta internacional</text>
<line class="sv-line" x1="184" y1="82" x2="200" y2="82" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="372" y1="82" x2="388" y2="82" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M98 256 V271 H380 V286" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M286 256 V271 H380 V286" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M474 256 V271 H380 V286" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M662 256 V271 H380 V286" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="662" y1="125" x2="662" y2="169" marker-end="url(#nc-n1a2-arrow)"/>
<text class="sv-t3" x="632" y="143" text-anchor="middle" style="paint-order:stroke;stroke:var(--d-bg);stroke-width:5px;stroke-linejoin:round">explica su fracaso</text>
</svg>
