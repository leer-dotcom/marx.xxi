<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cadena causal de la coyuntura española: tres causas (sistema de fronteras de la UE, presión geopolítica, crisis del orden liberal) se condensan en la crisis de Ceuta, que revela el acoso y derribo al gobierno, la deriva nacionalista de la socialdemocracia y la normalización del fascismo, desembocando en una ofensiva contra la clase trabajadora; abajo, la defensa reformista del gobierno frente a la tarea comunista." viewBox="0 0 760 501" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n5a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="392" width="752" height="95" rx="2"/>
<text class="sv-t3" x="12" y="20" text-anchor="start">CAUSAS CONVERGENTES</text>
<rect class="sv-box" x="12" y="30" width="235" height="63" rx="2"/>
<text class="sv-t" x="129.5" y="50.5" text-anchor="middle">Sistema criminal de fronteras</text>
<text class="sv-t" x="129.5" y="65.5" text-anchor="middle">de la UE</text>
<text class="sv-t2" x="129.5" y="80.5" text-anchor="middle">vallas, Frontex, Marruecos</text>
<rect class="sv-box" x="263" y="30" width="235" height="63" rx="2"/>
<text class="sv-t" x="380.5" y="50.5" text-anchor="middle">Presión geopolítica: Marruecos</text>
<text class="sv-t" x="380.5" y="65.5" text-anchor="middle">y eje Washington-Tel Aviv</text>
<text class="sv-t2" x="380.5" y="80.5" text-anchor="middle">flanco migratorio contra Sánchez</text>
<rect class="sv-box" x="513" y="30" width="235" height="63" rx="2"/>
<text class="sv-t" x="630.5" y="50.5" text-anchor="middle">Declive económico y crisis del</text>
<text class="sv-t" x="630.5" y="65.5" text-anchor="middle">orden liberal</text>
<text class="sv-t2" x="630.5" y="80.5" text-anchor="middle">recesión, Trump, Le Pen, AfD</text>
<path class="sv-line" d="M129.5 93 V108 H380 V133" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M380.5 93 V108 H380 V133" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M630.5 93 V108 H380 V133" marker-end="url(#nc-n5a1-arrow)"/>
<text class="sv-t3" x="390" y="127" text-anchor="start">CONDENSADAS EN</text>
<rect class="sv-box-ink" x="12" y="133" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380.0" y="153.5" text-anchor="middle">Crisis de Ceuta (espejo de la coyuntura)</text>
<text class="sv-tw" x="380.0" y="168.5" text-anchor="middle" style="font-size:13px;font-weight:400">cruce masivo de la frontera a finales de julio; pogromos de agosto y septiembre</text>
<path class="sv-line" d="M380 181 V196 H129.5 V221" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M380 181 V196 H380.5 V221" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M380 181 V196 H630.5 V221" marker-end="url(#nc-n5a1-arrow)"/>
<text class="sv-t3" x="390" y="215" text-anchor="start">REVELA</text>
<rect class="sv-box" x="12" y="221" width="235" height="63" rx="2"/>
<text class="sv-t" x="129.5" y="241.5" text-anchor="middle">Acoso y derribo al gobierno</text>
<text class="sv-t" x="129.5" y="256.5" text-anchor="middle">Sánchez</text>
<text class="sv-t2" x="129.5" y="271.5" text-anchor="middle">la corrupción del PSOE, palanca</text>
<rect class="sv-box" x="263" y="221" width="235" height="63" rx="2"/>
<text class="sv-t" x="380.5" y="241.5" text-anchor="middle">Deriva nacionalista de la</text>
<text class="sv-t" x="380.5" y="256.5" text-anchor="middle">socialdemocracia</text>
<text class="sv-t2" x="380.5" y="271.5" text-anchor="middle">Sumar, Podemos y ERC</text>
<rect class="sv-box" x="513" y="221" width="235" height="63" rx="2"/>
<text class="sv-t" x="630.5" y="241.5" text-anchor="middle">Normalización del fascismo</text>
<text class="sv-t2" x="630.5" y="256.5" text-anchor="middle">símbolos fascistas en calles y</text>
<text class="sv-t2" x="630.5" y="271.5" text-anchor="middle">medios</text>
<path class="sv-line" d="M129.5 284 V299 H380 V324" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M380.5 284 V299 H380 V324" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M630.5 284 V299 H380 V324" marker-end="url(#nc-n5a1-arrow)"/>
<text class="sv-t3" x="390" y="318" text-anchor="start">DESEMBOCAN EN</text>
<rect class="sv-box" x="12" y="324" width="736" height="48" rx="2"/>
<text class="sv-t" x="380.0" y="344.5" text-anchor="middle">Hegemonía social del bloque reaccionario → ofensiva contra la clase trabajadora</text>
<text class="sv-t2" x="380.0" y="359.5" text-anchor="middle">el progresismo burgués, sólo el primer obstáculo</text>
<path class="sv-line" d="M380 372 V382 H179.5 V414" marker-end="url(#nc-n5a1-arrow)"/>
<path class="sv-line" d="M380 372 V382 H580.5 V414" marker-end="url(#nc-n5a1-arrow)"/>
<rect class="sv-box-gold" x="12" y="414" width="335" height="63" rx="2"/>
<text class="sv-tg" x="179.5" y="442.0" text-anchor="middle">Defensa del gobierno progresista (reformismo)</text>
<text class="sv-t2" x="179.5" y="457.0" text-anchor="middle">miedo a Vox, chovinismo de la seguridad nacional</text>
<rect class="sv-box-red" x="413" y="414" width="335" height="63" rx="2"/>
<text class="sv-tr" x="580.5" y="434.5" text-anchor="middle">Oposición extraparlamentaria + muro de</text>
<text class="sv-tr" x="580.5" y="449.5" text-anchor="middle">contención</text>
<text class="sv-t2" x="580.5" y="464.5" text-anchor="middle">deslinde con el reformismo; organización comunista</text>
<text class="sv-t3" x="380" y="449.5" text-anchor="middle">FRENTE A</text>
<text class="sv-t3" x="10" y="403">RESPUESTA A LA OFENSIVA</text>
</svg>
