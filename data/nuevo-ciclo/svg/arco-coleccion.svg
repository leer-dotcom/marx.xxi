<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los cinco números de Nuevo Ciclo como pasos de un mismo argumento que desemboca en el partido comunista de masas e internacional." viewBox="0 0 760 276" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-hero-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box" x="12" y="30" width="134" height="134" rx="2"/>
<text class="sv-t" x="79" y="63" text-anchor="middle">Nuevo Ciclo #001</text>
<text class="sv-t" x="79" y="78" text-anchor="middle">Septiembre 2025</text>
<text class="sv-t2" x="79" y="93" text-anchor="middle" style="font-weight:400">diagnóstico de</text>
<text class="sv-t2" x="79" y="108" text-anchor="middle" style="font-weight:400">época: declive,</text>
<text class="sv-t2" x="79" y="123" text-anchor="middle" style="font-weight:400">guerra, represión,</text>
<text class="sv-t2" x="79" y="138" text-anchor="middle" style="font-weight:400">Gaza, España</text>
<line class="sv-line" x1="146" y1="97" x2="162" y2="97" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="162" y="30" width="134" height="134" rx="2"/>
<text class="sv-t" x="229" y="55.5" text-anchor="middle">Nuevo Ciclo #002</text>
<text class="sv-t" x="229" y="70.5" text-anchor="middle">Diciembre 2025</text>
<text class="sv-t2" x="229" y="85.5" text-anchor="middle" style="font-weight:400">franquismo,</text>
<text class="sv-t2" x="229" y="100.5" text-anchor="middle" style="font-weight:400">neofeudalismo,</text>
<text class="sv-t2" x="229" y="115.5" text-anchor="middle" style="font-weight:400">Europa,</text>
<text class="sv-t2" x="229" y="130.5" text-anchor="middle" style="font-weight:400">siniestralidad,</text>
<text class="sv-t2" x="229" y="145.5" text-anchor="middle" style="font-weight:400">prensa</text>
<line class="sv-line" x1="296" y1="97" x2="312" y2="97" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="312" y="30" width="134" height="134" rx="2"/>
<text class="sv-t" x="379" y="70.5" text-anchor="middle">Nuevo Ciclo #003</text>
<text class="sv-t" x="379" y="85.5" text-anchor="middle">Marzo 2026</text>
<text class="sv-t2" x="379" y="100.5" text-anchor="middle" style="font-weight:400">Estado dual, OTAN,</text>
<text class="sv-t2" x="379" y="115.5" text-anchor="middle" style="font-weight:400">género, austeridad y</text>
<text class="sv-t2" x="379" y="130.5" text-anchor="middle" style="font-weight:400">fascismo</text>
<line class="sv-line" x1="446" y1="97" x2="462" y2="97" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="462" y="30" width="134" height="134" rx="2"/>
<text class="sv-t" x="529" y="63" text-anchor="middle">Nuevo Ciclo #004</text>
<text class="sv-t" x="529" y="78" text-anchor="middle">Junio 2026</text>
<text class="sv-t2" x="529" y="93" text-anchor="middle" style="font-weight:400">genocidio,</text>
<text class="sv-t2" x="529" y="108" text-anchor="middle" style="font-weight:400">delincuencia,</text>
<text class="sv-t2" x="529" y="123" text-anchor="middle" style="font-weight:400">ilegalidad, el juez,</text>
<text class="sv-t2" x="529" y="138" text-anchor="middle" style="font-weight:400">inmigración</text>
<line class="sv-line" x1="596" y1="97" x2="612" y2="97" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="612" y="30" width="134" height="134" rx="2"/>
<text class="sv-t" x="679" y="48" text-anchor="middle">Nuevo Ciclo #005</text>
<text class="sv-t" x="679" y="63" text-anchor="middle">Septiembre 2026</text>
<text class="sv-t2" x="679" y="78" text-anchor="middle" style="font-weight:400">fin del ciclo</text>
<text class="sv-t2" x="679" y="93" text-anchor="middle" style="font-weight:400">progresista: Ceuta,</text>
<text class="sv-t2" x="679" y="108" text-anchor="middle" style="font-weight:400">Podemos, fuerza de</text>
<text class="sv-t2" x="679" y="123" text-anchor="middle" style="font-weight:400">trabajo, Israel</text>
<text class="sv-t2" x="679" y="138" text-anchor="middle" style="font-weight:400">fascista, ola rosa y</text>
<text class="sv-t2" x="679" y="153" text-anchor="middle" style="font-weight:400">ola negra</text>
<rect class="sv-box-red" x="12" y="208" width="734" height="54" rx="2"/>
<text class="sv-tr" x="379" y="231" text-anchor="middle">Partido comunista de masas, continental e internacional</text>
<text class="sv-t2" x="379" y="248" text-anchor="middle" style="font-weight:400">independencia política de la clase</text>
<line class="sv-line-red" x1="79" y1="164" x2="79" y2="208" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="229" y1="164" x2="229" y2="208" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="379" y1="164" x2="379" y2="208" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="529" y1="164" x2="529" y2="208" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="679" y1="164" x2="679" y2="208" marker-end="url(#nc-hero-arrow)"/>
<text class="sv-t3" x="237" y="184" text-anchor="start" style="font-size:10px">TODOS DESEMBOCAN</text>
<text class="sv-t3" x="237" y="196" text-anchor="start" style="font-size:10px">EN LA MISMA TAREA</text>
</svg>
