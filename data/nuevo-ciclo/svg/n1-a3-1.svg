<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="Tablero de la situación política española: bloque de gobierno y bloque de derechas bajo el paso del ciclo progresista al reaccionario, con los aparatos del Estado presionando y las tareas comunistas a tres plazos.">
<defs><marker id="nc-n1a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="109" width="301" height="261" rx="2"/>
<text class="sv-t3" x="10" y="120">BLOQUE DE GOBIERNO</text>
<rect class="sv-soft" x="455" y="109" width="301" height="261" rx="2"/>
<text class="sv-t3" x="461" y="120">BLOQUE DE DERECHAS</text>
<rect class="sv-soft" x="4" y="384" width="752" height="102" rx="2"/>
<text class="sv-t3" x="10" y="395">TAREAS COMUNISTAS</text>
<rect class="sv-box-blue" x="12" y="30" width="285" height="57" rx="2"/>
<text class="sv-tb" x="154" y="47.5" text-anchor="middle">Ciclo progresista 2008-2020</text>
<text class="sv-t2" style="font-weight:400" x="154" y="62.5" text-anchor="middle">15-M, Podemos, procés, ola feminista,</text>
<text class="sv-t2" style="font-weight:400" x="154" y="77.5" text-anchor="middle">coalición: agónico, no muere</text>
<rect class="sv-box-red" x="463" y="30" width="285" height="57" rx="2"/>
<text class="sv-tr" x="606" y="47.5" text-anchor="middle">Ciclo reaccionario 2016-</text>
<text class="sv-t2" style="font-weight:400" x="606" y="62.5" text-anchor="middle">Brexit, Trump, Vox, Meloni, Milei: domina,</text>
<text class="sv-t2" style="font-weight:400" x="606" y="77.5" text-anchor="middle">pero no condensa</text>
<rect class="sv-box" x="12" y="131" width="285" height="57" rx="2"/>
<text class="sv-t" x="154" y="148.5" text-anchor="middle">PSOE: organizador de la izquierda</text>
<text class="sv-t2" style="font-weight:400" x="154" y="163.5" text-anchor="middle">sanchismo, amnistía, corrupción de partido</text>
<text class="sv-t2" style="font-weight:400" x="154" y="178.5" text-anchor="middle">profesional</text>
<rect class="sv-box" x="12" y="218" width="285" height="57" rx="2"/>
<text class="sv-t" x="154" y="243.0" text-anchor="middle">Sumar · IU-PCE</text>
<text class="sv-t2" style="font-weight:400" x="154" y="258.0" text-anchor="middle">respiración asistida; sin fuerza propia</text>
<rect class="sv-box" x="12" y="305" width="285" height="57" rx="2"/>
<text class="sv-t" x="154" y="322.5" text-anchor="middle">Podemos (Canal Red)</text>
<text class="sv-t2" style="font-weight:400" x="154" y="337.5" text-anchor="middle">estrategia de tierra quemada: oposición</text>
<text class="sv-t2" style="font-weight:400" x="154" y="352.5" text-anchor="middle">post-Sánchez</text>
<rect class="sv-box" x="463" y="131" width="285" height="57" rx="2"/>
<text class="sv-t" x="606" y="148.5" text-anchor="middle">PP: giro a la derecha</text>
<text class="sv-t2" style="font-weight:400" x="606" y="163.5" text-anchor="middle">pauta Aznar: disciplinar al PSOE, concertación</text>
<text class="sv-t2" style="font-weight:400" x="606" y="178.5" text-anchor="middle">nacional</text>
<rect class="sv-box" x="463" y="218" width="285" height="57" rx="2"/>
<text class="sv-t" x="606" y="243.0" text-anchor="middle">Vox: caudillismo y Patriots</text>
<text class="sv-t2" style="font-weight:400" x="606" y="258.0" text-anchor="middle">inmigración como caballo de Troya</text>
<rect class="sv-box" x="463" y="305" width="285" height="57" rx="2"/>
<text class="sv-t" x="606" y="322.5" text-anchor="middle">Campo neofascista</text>
<text class="sv-t2" style="font-weight:400" x="606" y="337.5" text-anchor="middle">Núcleo Nacional, Revuelta: «brazo auxiliar»</text>
<text class="sv-t2" style="font-weight:400" x="606" y="352.5" text-anchor="middle">(Torre Pacheco)</text>
<rect class="sv-box-gold" x="313" y="218" width="134" height="57" rx="2"/>
<text class="sv-tg" x="380" y="235.5" text-anchor="middle">Aparatos del Estado</text>
<text class="sv-tg" x="380" y="250.5" text-anchor="middle">insumisos</text>
<text class="sv-t2" style="font-weight:400" x="380" y="265.5" text-anchor="middle">judicatura, UCO, GC</text>
<rect class="sv-box" x="12" y="406" width="285" height="72" rx="2"/>
<text class="sv-t" x="154" y="431.0" text-anchor="middle">Corto plazo: deslinde con el ala izquierda</text>
<text class="sv-t" x="154" y="446.0" text-anchor="middle">del sistema de partidos</text>
<text class="sv-t2" style="font-weight:400" x="154" y="461.0" text-anchor="middle">atención al viraje de Podemos</text>
<rect class="sv-box" x="313" y="406" width="134" height="72" rx="2"/>
<text class="sv-t" x="380" y="423.5" text-anchor="middle">Medio plazo:</text>
<text class="sv-t" x="380" y="438.5" text-anchor="middle">independencia</text>
<text class="sv-t" x="380" y="453.5" text-anchor="middle">frente al</text>
<text class="sv-t" x="380" y="468.5" text-anchor="middle">neorreformismo</text>
<rect class="sv-box-red" x="463" y="406" width="285" height="72" rx="2"/>
<text class="sv-tr" x="606" y="423.5" text-anchor="middle">Largo plazo: vanguardia contra la represión</text>
<text class="sv-tr" x="606" y="438.5" text-anchor="middle">y el fascismo</text>
<text class="sv-t2" style="font-weight:400" x="606" y="453.5" text-anchor="middle">frente de autodefensa → partido comunista de</text>
<text class="sv-t2" style="font-weight:400" x="606" y="468.5" text-anchor="middle">masas</text>
<line class="sv-line" x1="297" y1="58" x2="463" y2="58" marker-end="url(#nc-n1a3-arrow)"/>
<text class="sv-t3" x="380" y="48" text-anchor="middle">impasse</text>
<line class="sv-line-red" x1="313" y1="246" x2="297" y2="160" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="297" y1="442" x2="313" y2="442" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="447" y1="442" x2="463" y2="442" marker-end="url(#nc-n1a3-arrow)"/>
</svg>
