<path class="sv-line-red" d="M253 293 V311 H396 V329" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line-red" x1="396" y1="293" x2="396" y2="329" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-red" d="M539 293 V311 H396 V329" marker-end="url(#nc-bib-arrow)"/>
<path class="sv-line-red" d="M682 293 V311 H396 V329" marker-end="url(#nc-bib-arrow)"/>
</svg>
