<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" role="img" aria-label="Mapa de la biblioteca: arriba, los cinco principios que fija cada volumen de Marx XXI; debajo, bajo cada principio, las coyunturas en que Nuevo Ciclo lo pone a prueba; ambas filas desembocan en la tarea común, el partido comunista de masas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-bib-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="142" width="752" height="165" rx="2"/>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(18 69.0) rotate(-90)" style="font-size:16px;letter-spacing:.2em">MARCO</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(33 69.0) rotate(-90)" style="letter-spacing:.04em">Marx XXI (principios)</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(18 224.5) rotate(-90)" style="font-size:16px;letter-spacing:.2em">COYUNTURA</text>
<text class="sv-t3" x="0" y="0" text-anchor="middle" transform="translate(33 224.5) rotate(-90)" style="letter-spacing:.04em">Nuevo Ciclo (aplicaciones)</text>
<rect class="sv-box-ink" x="44" y="22" width="132" height="94" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="110" y="52.5" text-anchor="middle">Qué marxismo</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="110" y="68.0" text-anchor="middle">Volumen 1: ciencia,</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="110" y="82.0" text-anchor="middle">filosofía y política;</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="110" y="96.0" text-anchor="middle">totalidad; Hegel</text>
<rect class="sv-box-ink" x="187" y="22" width="132" height="94" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="253" y="45.0" text-anchor="middle">Contra la</text>
<text class="sv-tw" style="font-size:13.5px" x="253" y="60.0" text-anchor="middle">socialdemocracia</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="253" y="75.5" text-anchor="middle">Volumen 2:</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="253" y="89.5" text-anchor="middle">redistribuir no es</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="253" y="103.5" text-anchor="middle">criticar; falsos amigos</text>
<rect class="sv-box-ink" x="330" y="22" width="132" height="94" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="396" y="45.0" text-anchor="middle">Independencia</text>
<text class="sv-tw" style="font-size:13.5px" x="396" y="60.0" text-anchor="middle">política</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="396" y="75.5" text-anchor="middle">Volumen 3: la clase se</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="396" y="89.5" text-anchor="middle">constituye en partido;</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="396" y="103.5" text-anchor="middle">conciencia</text>
<rect class="sv-box-ink" x="473" y="22" width="132" height="94" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="539" y="45.0" text-anchor="middle">Derecho a la</text>
<text class="sv-tw" style="font-size:13.5px" x="539" y="60.0" text-anchor="middle">revolución</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="539" y="75.5" text-anchor="middle">Volumen 4: el Estado</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="539" y="89.5" text-anchor="middle">como forma del capital;</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="539" y="103.5" text-anchor="middle">derechos como armas</text>
<rect class="sv-box-ink" x="616" y="22" width="132" height="94" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="682" y="52.5" text-anchor="middle">Internacionalismo</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="682" y="68.0" text-anchor="middle">Volumen 5: Europa</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="682" y="82.0" text-anchor="middle">como escala mínima; ni</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="682" y="96.0" text-anchor="middle">OTAN ni BRICS</text>
<rect class="sv-box-blue" x="44" y="156" width="132" height="137" rx="2"/>
<text class="sv-tb" x="110" y="179.0" text-anchor="middle">Racionalidad contra</text>
<text class="sv-tb" x="110" y="194.0" text-anchor="middle">adanismo y</text>
<text class="sv-tb" x="110" y="209.0" text-anchor="middle">novedades falsas</text>
<text class="sv-t2" style="font-size:12px" x="110" y="224.5" text-anchor="middle">ciclo revolucionario</text>
<text class="sv-t2" style="font-size:12px" x="110" y="238.5" text-anchor="middle">(#1); neofeudalismo</text>
<text class="sv-t2" style="font-size:12px" x="110" y="252.5" text-anchor="middle">(#2); entrevistas</text>
<text class="sv-t2" style="font-size:12px" x="110" y="266.5" text-anchor="middle">Brassier, Roberts,</text>
<text class="sv-t2" style="font-size:12px" x="110" y="280.5" text-anchor="middle">Merchant, Toscano</text>
<rect class="sv-box-blue" x="187" y="156" width="132" height="137" rx="2"/>
<text class="sv-tb" x="253" y="179.0" text-anchor="middle">El reformismo</text>
<text class="sv-tb" x="253" y="194.0" text-anchor="middle">gobernante</text>
<text class="sv-tb" x="253" y="209.0" text-anchor="middle">alimenta la reacción</text>
<text class="sv-t2" style="font-size:12px" x="253" y="224.5" text-anchor="middle">PSOE y Sumar (#1);</text>
<text class="sv-t2" style="font-size:12px" x="253" y="238.5" text-anchor="middle">Weber y la austeridad</text>
<text class="sv-t2" style="font-size:12px" x="253" y="252.5" text-anchor="middle">(#3); IU en el gobierno</text>
<text class="sv-t2" style="font-size:12px" x="253" y="266.5" text-anchor="middle">militarista (#3);</text>
<text class="sv-t2" style="font-size:12px" x="253" y="280.5" text-anchor="middle">inmigración (#4)</text>
<rect class="sv-box-blue" x="330" y="156" width="132" height="137" rx="2"/>
<text class="sv-tb" x="396" y="179.5" text-anchor="middle">Instituciones de la</text>
<text class="sv-tb" x="396" y="194.5" text-anchor="middle">clase</text>
<text class="sv-t2" style="font-size:12px" x="396" y="210.0" text-anchor="middle">movimiento obrero</text>
<text class="sv-t2" style="font-size:12px" x="396" y="224.0" text-anchor="middle">europeo y prensa</text>
<text class="sv-t2" style="font-size:12px" x="396" y="238.0" text-anchor="middle">bolchevique (#2);</text>
<text class="sv-t2" style="font-size:12px" x="396" y="252.0" text-anchor="middle">género y clase (#3);</text>
<text class="sv-t2" style="font-size:12px" x="396" y="266.0" text-anchor="middle">barrios y migrantes</text>
<text class="sv-t2" style="font-size:12px" x="396" y="280.0" text-anchor="middle">(#4)</text>
<rect class="sv-box-blue" x="473" y="156" width="132" height="137" rx="2"/>
<text class="sv-tb" x="539" y="193.5" text-anchor="middle">Coacción, ley y</text>
<text class="sv-tb" x="539" y="208.5" text-anchor="middle">tribuna</text>
<text class="sv-t2" style="font-size:12px" x="539" y="224.0" text-anchor="middle">antiterrorismo (#1);</text>
<text class="sv-t2" style="font-size:12px" x="539" y="238.0" text-anchor="middle">Estado dual y Gladio</text>
<text class="sv-t2" style="font-size:12px" x="539" y="252.0" text-anchor="middle">(#3); legal e ilegal, el</text>
<text class="sv-t2" style="font-size:12px" x="539" y="266.0" text-anchor="middle">juez (#4)</text>
<rect class="sv-box-blue" x="616" y="156" width="132" height="137" rx="2"/>
<text class="sv-tb" x="682" y="186.5" text-anchor="middle">Guerra, Gaza y</text>
<text class="sv-tb" x="682" y="201.5" text-anchor="middle">Europa</text>
<text class="sv-t2" style="font-size:12px" x="682" y="217.0" text-anchor="middle">militarismo y Palestina</text>
<text class="sv-t2" style="font-size:12px" x="682" y="231.0" text-anchor="middle">(#1); OTAN (#3);</text>
<text class="sv-t2" style="font-size:12px" x="682" y="245.0" text-anchor="middle">genocidio y sionismo</text>
<text class="sv-t2" style="font-size:12px" x="682" y="259.0" text-anchor="middle">(#4); Partido</text>
<text class="sv-t2" style="font-size:12px" x="682" y="273.0" text-anchor="middle">Comunista Europeo</text>
<rect class="sv-box-red" x="44" y="329" width="704" height="46" rx="2"/>
<text class="sv-tr" x="396" y="357.0" text-anchor="middle">Tarea común: partido comunista de masas, continental e internacional, con instituciones propias</text>
<line class="sv-line" x1="110" y1="116" x2="110" y2="156" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="253" y1="116" x2="253" y2="156" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="396" y1="116" x2="396" y2="156" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="539" y1="116" x2="539" y2="156" marker-end="url(#nc-bib-arrow)"/>
<line class="sv-line" x1="682" y1="116" x2="682" y2="156" marker-end="url(#nc-bib-arrow)"/>
