<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Línea temporal de la integración de España en la OTAN, por periodos, con los hitos del Estado a la izquierda y los de la izquierda política a la derecha, los actores del referéndum de 1986 y la jugada de doble filo de Fraga, mostrando cómo la lucha contra la OTAN acabó convertida en su contrario." viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="12" width="752" height="24" rx="2"/>
<text class="sv-t3" x="192" y="28" text-anchor="middle">el estado</text>
<text class="sv-t3" x="568" y="28" text-anchor="middle">la izquierda</text>
<rect class="sv-box" x="12" y="48" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="68" text-anchor="middle">1945-75 · Franquismo: «apéndice» de la OTAN</text>
<text class="sv-t2" style="font-size:12px" x="192" y="84" text-anchor="middle">socio preferente anticomunista, excluido del bloque;</text>
<text class="sv-t2" style="font-size:12px" x="192" y="98" text-anchor="middle">bases con Eisenhower (1959); visitas de Nixon, Ford, Carter</text>
<rect class="sv-box" x="388" y="48" width="360" height="62" rx="2"/>
<text class="sv-t" x="568" y="68" text-anchor="middle">1974 · El PSOE de Suresnes</text>
<text class="sv-t2" style="font-size:12px" x="568" y="84" text-anchor="middle">refundado con la Fundación Friedrich Ebert: aspira a ser</text>
<text class="sv-t2" style="font-size:12px" x="568" y="98" text-anchor="middle">gran partido de masas y gran partido de Estado</text>
<rect class="sv-box" x="12" y="130" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="150" text-anchor="middle">1976-81 · Transición: Suárez vacila</text>
<text class="sv-t2" style="font-size:12px" x="192" y="166" text-anchor="middle">roza el neutralismo (Cuba, Arafat, No Alineados) → dimisión;</text>
<text class="sv-t2" style="font-size:12px" x="192" y="180" text-anchor="middle">Calvo Sotelo, atlantista firme: CEE y OTAN cogidas de la mano</text>
<rect class="sv-box" x="388" y="130" width="360" height="62" rx="2"/>
<text class="sv-t" x="568" y="150" text-anchor="middle">1977-82 · «OTAN, de entrada no»</text>
<text class="sv-t2" style="font-size:12px" x="568" y="166" text-anchor="middle">el PSOE desborda al PCE en 1977; exige un referéndum como</text>
<text class="sv-t2" style="font-size:12px" x="568" y="180" text-anchor="middle">«arma arrojadiza»; marchas a Torrejón desde 1981</text>
<rect class="sv-box-gold" x="12" y="212" width="360" height="62" rx="2"/>
<text class="sv-tg" x="192" y="232" text-anchor="middle">1981-82 · 23-F → entrada (mayo 1982)</text>
<text class="sv-t2" style="font-size:12px" x="192" y="248" text-anchor="middle">Calvo Sotelo anuncia el ingreso dos días después del golpe;</text>
<text class="sv-t2" style="font-size:12px" x="192" y="262" text-anchor="middle">la CEE «estaba asociada a la pertenencia a la OTAN»</text>
<rect class="sv-box-blue" x="388" y="212" width="360" height="62" rx="2"/>
<text class="sv-tb" x="568" y="232" text-anchor="middle">1981-83 · Movimiento anti-OTAN</text>
<text class="sv-t2" style="font-size:12px" x="568" y="248" text-anchor="middle">Comisión Anti-OTAN (MC, LCR) → CEOP: «OTAN no, bases fuera»;</text>
<text class="sv-t2" style="font-size:12px" x="568" y="262" text-anchor="middle">heterogéneo y de masas; el PCE hundido vuelca ahí sus esfuerzos</text>
<rect class="sv-box" x="12" y="294" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="314" text-anchor="middle">1986 · Referéndum 12-III: «Vota sí»</text>
<text class="sv-t2" style="font-size:12px" x="192" y="330" text-anchor="middle">tres condiciones, plebiscito sobre González, uso masivo de TVE;</text>
<text class="sv-t2" style="font-size:12px" x="192" y="344" text-anchor="middle">sí 56,85 %; pierde en Euskal Herria, Cataluña y Gran Canaria</text>
<rect class="sv-box-blue" x="388" y="294" width="360" height="62" rx="2"/>
<text class="sv-tb" x="568" y="314" text-anchor="middle">1984-86 · PCE → Plataforma Cívica → IU</text>
<text class="sv-t2" style="font-size:12px" x="568" y="330" text-anchor="middle">Mesa Pro Referéndum con el CDS; Plataforma Cívica (1986):</text>
<text class="sv-t2" style="font-size:12px" x="568" y="344" text-anchor="middle">estrategia frentepopulista; IU constituida el 29-IV-1986</text>
<rect class="sv-box-gold" x="12" y="372" width="736" height="62" rx="2"/>
<text class="sv-tg" x="380" y="392" text-anchor="middle">Quién votó qué el 12 de marzo de 1986: la jugada de doble filo</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="407" text-anchor="middle">sí: PSOE, CDS, UGT, PNV y CiU · no: PCE, CCOO, CNT, izquierda radical… y la Coalición Popular de Fraga, para herir al gobierno</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="420" text-anchor="middle">doble filo: aleja del sí a los conservadores, pero alimenta el plebiscito → estrategia del «mal menor» que asume la izquierda reformista</text>
<rect class="sv-box-red" x="12" y="454" width="360" height="62" rx="2"/>
<text class="sv-tr" x="192" y="474" text-anchor="middle">2026 · El final del camino</text>
<text class="sv-t2" style="font-size:12px" x="192" y="490" text-anchor="middle">el gobierno más militarista de la democracia: mayor gasto</text>
<text class="sv-t2" style="font-size:12px" x="192" y="504" text-anchor="middle">militar «siguiendo las instrucciones directas de Donald Trump»</text>
<rect class="sv-box-blue" x="388" y="454" width="360" height="62" rx="2"/>
<text class="sv-tb" x="568" y="474" text-anchor="middle">IU: salvavidas electoral y disolución del PCE</text>
<text class="sv-t2" style="font-size:12px" x="568" y="490" text-anchor="middle">de 4 a 7 diputados (1986), 21 con Anguita (1996); el PCE, facción</text>
<text class="sv-t2" style="font-size:12px" x="568" y="504" text-anchor="middle">«determinante pero dependiente», en el gobierno militarista</text>
<line class="sv-line" x1="192" y1="110" x2="192" y2="130" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="568" y1="110" x2="568" y2="130" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="192" y1="192" x2="192" y2="212" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="568" y1="192" x2="568" y2="212" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="192" y1="274" x2="192" y2="294" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="568" y1="274" x2="568" y2="294" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="192" y1="356" x2="192" y2="372" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="568" y1="356" x2="568" y2="372" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="192" y1="434" x2="192" y2="454" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line" x1="568" y1="434" x2="568" y2="454" marker-end="url(#nc-n3a3-arrow)"/>
<line class="sv-line-dash" x1="388" y1="147" x2="372" y2="147" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="380" y="142" text-anchor="middle">contra la UCD</text>
<line class="sv-line-dash" x1="372" y1="311" x2="388" y2="311" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="380" y="306" text-anchor="middle">convoca / capitaliza</text>
<line class="sv-line-red" x1="388" y1="471" x2="372" y2="471" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="380" y="466" text-anchor="middle">forma parte</text>
<rect class="sv-soft" x="12" y="530" width="736" height="28" rx="2"/>
<text class="sv-t3" x="28" y="548">leyenda</text>
<line class="sv-line" x1="100" y1="544" x2="136" y2="544" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="144" y="548">cronología</text>
<line class="sv-line-dash" x1="250" y1="544" x2="286" y2="544" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="294" y="548">relación entre Estado e izquierda</text>
<line class="sv-line-red" x1="510" y1="544" x2="546" y2="544" marker-end="url(#nc-n3a3-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="554" y="548">la lucha convertida en su contrario</text>
</svg>
