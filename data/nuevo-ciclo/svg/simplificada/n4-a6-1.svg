<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Cadena de la crisis de hegemonía estadounidense (Arrighi) a la dominación sin hegemonía del trumpismo, al fin del discurso del fanatismo y a la fascistización contemporánea, y bifurcación entre la izquierda conservadora del frente impopular y una política anticapitalista de masas con instituciones propias; al pie, trayectoria y método del entrevistado." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="16">LA CADENA: DE LA CRISIS DE HEGEMONÍA A LA FASCISTIZACIÓN</text>
<rect class="sv-box" x="12" y="22" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="40" text-anchor="middle">Crisis de la hegemonía estadounidense (Arrighi, Adam Smith en Pekín)</text>
<text class="sv-t2" style="font-size:12px" x="380" y="57" text-anchor="middle">Vietnam, «crisis señal» → Irak, «crisis terminal»: el hegemón ya no tiene medios ni voluntad de liderar</text>
<line class="sv-line" x1="380" y1="70" x2="380" y2="96" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="87">el trumpismo lo asume abiertamente</text>
<rect class="sv-box" x="12" y="96" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="114" text-anchor="middle">Dominación sin hegemonía (Guha, Arrighi): la supremacía transaccional del trumpismo</text>
<text class="sv-t2" style="font-size:12px" x="380" y="131" text-anchor="middle">dominar sin liderar, con nostalgia del imperialismo del XIX (doctrina «Donroe»): aranceles, Groenlandia, Irán</text>
<line class="sv-line" x1="380" y1="144" x2="380" y2="170" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="161">otra señal del derrumbe de la hegemonía</text>
<rect class="sv-box" x="12" y="170" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="188" text-anchor="middle">Fin del discurso del fanatismo: la «violenta incoherencia» como norma</text>
<text class="sv-t2" style="font-size:12px" x="380" y="205" text-anchor="middle">en la celebración de la fuerza pura ya no hace falta pintar al enemigo como fanático para exterminarlo</text>
<line class="sv-line" x1="380" y1="218" x2="380" y2="244" marker-end="url(#nc-n4a6-arrow)"/>
<text class="sv-t3" x="388" y="235">culto a la violencia → subjetividad fascista</text>
<rect class="sv-box-red" x="12" y="244" width="736" height="62" rx="2"/>
<text class="sv-tr" x="380" y="262" text-anchor="middle">Fascistización: el fascismo no existe a pesar de sus contradicciones, sino gracias a ellas</text>
<text class="sv-t2" style="font-size:12px" x="380" y="278" text-anchor="middle">libertad para dominar y humillar, consumida de forma vicaria; «relativismo» de Mussolini: cosas distintas a públicos</text>
<text class="sv-t2" style="font-size:12px" x="380" y="292" text-anchor="middle">distintos (Poulantzas); viejo atractivo de masas + marketing microdirigido, vigilancia algorítmica, silos discursivos</text>
<text class="sv-t3" x="388" y="322">DOS RESPUESTAS AL CAPITALISMO ABISMADO EN LA BARBARIE</text>
<line class="sv-line" x1="380" y1="306" x2="380" y2="330"/>
<path class="sv-line-dash" d="M380 330 H192 V342" marker-end="url(#nc-n4a6-arrow)"/>
<path class="sv-line-red" d="M380 330 H568 V342" marker-end="url(#nc-n4a6-arrow)"/>
<rect class="sv-box-gold" x="12" y="342" width="360" height="76" rx="2"/>
<text class="sv-tg" x="192" y="360" text-anchor="middle">Izquierda conservadora / «frente impopular»</text>
<text class="sv-t2" style="font-size:12px" x="192" y="376" text-anchor="middle">defender los restos de las conquistas del siglo XX, no un</text>
<text class="sv-t2" style="font-size:12px" x="192" y="390" text-anchor="middle">proyecto transformador; registro electoral-defensivo, alianzas</text>
<text class="sv-t2" style="font-size:12px" x="192" y="404" text-anchor="middle">con liberales y conservadores que renuncian a los fines últimos</text>
<rect class="sv-box-green" x="388" y="342" width="360" height="76" rx="2"/>
<text class="sv-tgr" x="568" y="360" text-anchor="middle">Política anticapitalista igualitaria de masas</text>
<text class="sv-t2" style="font-size:12px" x="568" y="376" text-anchor="middle">guiada por ideas marxistas; trabajo territorial, institucional y</text>
<text class="sv-t2" style="font-size:12px" x="568" y="390" text-anchor="middle">pedagógico: poder popular efectivo e instituciones donde</text>
<text class="sv-t2" style="font-size:12px" x="568" y="404" text-anchor="middle">transformarse; «instituciones comunistas» aún por inventar</text>
<rect class="sv-soft" x="4" y="428" width="752" height="22" rx="2"/>
<line class="sv-line-dash" x1="18" y1="440" x2="48" y2="440"/>
<text class="sv-t3" x="54" y="443">respuesta existente: registro electoral-defensivo</text>
<line class="sv-line-red" x1="380" y1="440" x2="410" y2="440"/>
<text class="sv-t3" x="416" y="443">respuesta que propone Toscano</text>
<rect class="sv-soft" x="4" y="456" width="752" height="56" rx="2"/>
<text class="sv-t3" x="18" y="471">FUERA DE LA CADENA · TRAYECTORIA Y MÉTODO DEL ENTREVISTADO</text>
<text class="sv-t2" style="font-size:12px" x="18" y="489">Formación: extrema izquierda desde niño; marxismo sistemático sólo desde 2004 (Historical Materialism, Goldsmiths)</text>
<text class="sv-t2" style="font-size:12px" x="18" y="503">Método: el rodeo (le détour) por el archivo histórico y teórico; Yarvin, Thiel o Land no merecen análisis textual</text>
</svg>
