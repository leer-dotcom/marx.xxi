<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" role="img" aria-label="Dos columnas enfrentadas: la hipótesis neofeudal y la crítica marxista, en los planos del valor, la acumulación, el sujeto político y las consecuencias prácticas; debajo, la clave de la refutación (el fetichismo tecnológico) y el desafío que la autora propone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-blue" x="12" y="10" width="360" height="58" rx="2"/>
<text class="sv-tb" x="192" y="27.3" text-anchor="middle">Hipótesis neo / tecnofeudal</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="42.3" text-anchor="middle">Dean, Varoufakis, Francia Insumisa: élites</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="57.3" text-anchor="middle">monopolísticas y big tech como nuevos señores</text>
<rect class="sv-box-red" x="388" y="10" width="360" height="58" rx="2"/>
<text class="sv-tr" x="568" y="27.3" text-anchor="middle">Crítica marxista</text>
<text class="sv-t2" style="font-size:12px" x="568" y="42.3" text-anchor="middle">Marx, Roberts, Aguiriano: el trabajo sigue siendo</text>
<text class="sv-t2" style="font-size:12px" x="568" y="57.3" text-anchor="middle">la fuente del valor; formas ideológicas de la fase actual</text>
<rect class="sv-soft" x="4" y="80" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="91">VALOR</text>
<rect class="sv-box" x="12" y="100" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="117.3" text-anchor="middle">Fuente del valor: datos, algoritmos,</text>
<text class="sv-t" style="font-size:13px" x="192" y="132.3" text-anchor="middle">infraestructuras; «fin del trabajo»</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="147.3" text-anchor="middle">el capital ya no dependería del trabajo vivo</text>
<rect class="sv-box" x="388" y="100" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="117.3" text-anchor="middle">Sólo el trabajo vivo crea valor;</text>
<text class="sv-t" style="font-size:13px" x="568" y="132.3" text-anchor="middle">el trabajo muerto transfiere</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="147.3" text-anchor="middle">invisibilización y fragmentación del trabajo</text>
<line class="sv-line" x1="372" y1="129" x2="388" y2="129" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="174" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="185">ACUMULACIÓN</text>
<rect class="sv-box" x="12" y="194" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="211.3" text-anchor="middle">Rentismo y plataformas = regresión</text>
<text class="sv-t" style="font-size:13px" x="192" y="226.3" text-anchor="middle">a la dependencia personal feudal</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="241.3" text-anchor="middle">deuda, precariedad y vigilancia: nuevo vasallaje</text>
<rect class="sv-box" x="388" y="194" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="211.3" text-anchor="middle">Rentismo y financiarización = fase de la</text>
<text class="sv-t" style="font-size:13px" x="568" y="226.3" text-anchor="middle">acumulación, crisis histórica del capital</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="241.3" text-anchor="middle">expulsar trabajo vivo hunde la rentabilidad</text>
<line class="sv-line" x1="372" y1="223" x2="388" y2="223" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="268" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="279">SUJETO POLÍTICO</text>
<rect class="sv-box" x="12" y="288" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="305.3" text-anchor="middle">Élites vs. multitudes; Estado gestor;</text>
<text class="sv-t" style="font-size:13px" x="192" y="320.3" text-anchor="middle">partido afectivo</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="335.3" text-anchor="middle">«ciudadano digital» vs. «nubelistas»</text>
<rect class="sv-box" x="388" y="288" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="305.3" text-anchor="middle">Burguesía vs. proletariado; el partido</text>
<text class="sv-t" style="font-size:13px" x="568" y="320.3" text-anchor="middle">media entre conciencia y praxis</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="335.3" text-anchor="middle">colectivo organizado, arraigado en la clase</text>
<line class="sv-line" x1="372" y1="317" x2="388" y2="317" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-soft" x="4" y="362" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="373">CONSECUENCIAS</text>
<rect class="sv-box" x="12" y="382" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="399.3" text-anchor="middle">Regular las plataformas: DMA, DSA,</text>
<text class="sv-t" style="font-size:13px" x="192" y="414.3" text-anchor="middle">Next Generation EU, Ley Rider</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="429.3" text-anchor="middle">transparencia algorítmica, «transición digital»</text>
<rect class="sv-box" x="388" y="382" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="399.3" text-anchor="middle">Ajuste interno del capital: socialdemocracia</text>
<text class="sv-t" style="font-size:13px" x="568" y="414.3" text-anchor="middle">radical confinada a la redistribución</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="429.3" text-anchor="middle">institucionaliza el trabajo digital precario</text>
<line class="sv-line" x1="372" y1="411" x2="388" y2="411" marker-end="url(#nc-n2a2-arrow)"/>
<rect class="sv-box-ink" x="12" y="460" width="736" height="44" rx="2"/>
<text class="sv-tw" x="380" y="477.8" text-anchor="middle">Clave de la refutación: el fetichismo tecnológico</text>
<text class="sv-tw" x="380" y="492.8" text-anchor="middle" style="font-weight:400;font-size:12px">atribuir a la tecnología un poder productivo propio reproduce el fetichismo de la mercancía</text>
<rect class="sv-box-gold" x="12" y="516" width="736" height="44" rx="2"/>
<text class="sv-tg" x="380" y="533.8" text-anchor="middle">Desafío comunista: reinscribir lo digital en la lógica del capital, no negar su novedad</text>
<text class="sv-t2" style="font-size:12px" x="380" y="548.8" text-anchor="middle">la clase trabajadora sigue siendo el sujeto histórico; una teoría correcta de la crisis funda el partido</text>
<line class="sv-line" x1="12" y1="578" x2="38" y2="578" marker-end="url(#nc-n2a2-arrow)"/>
<text class="sv-t3" x="44" y="582">respuesta de la crítica marxista a cada plano de la hipótesis</text>
</svg>
