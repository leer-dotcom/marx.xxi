<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual de Nuevo Ciclo #001: del declive del capitalismo (arriba) a sus tres manifestaciones —militarismo, genocidio, giro autoritario—, a la debilidad del proletariado y al partido comunista de masas e internacional que todos los textos reclaman (abajo); al pie, el umbral de un nuevo ciclo revolucionario, la leyenda y la clave de artículos." viewBox="0 0 760 568" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-m1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20" text-anchor="start">NUEVO CICLO #001 · MAPA CONCEPTUAL</text>
<text class="sv-t3" x="748" y="20" text-anchor="end">(n) = artículo n del número</text>
<rect class="sv-box-ink" x="195.0" y="30" width="370" height="44.0" rx="2"/>
<text class="sv-tw" x="380.0" y="49.5" text-anchor="middle">Declive del capitalismo</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.0" y="63.0" text-anchor="middle">explica la nueva era de crisis, guerras y autoritarismo (1, 2, 4)</text>
<path class="sv-line" d="M380.0 74.0 V92.0 H129.5 V116.0" marker-end="url(#nc-m1-arrow)"/>
<line class="sv-line" x1="380.0" y1="74.0" x2="380.5" y2="116.0" marker-end="url(#nc-m1-arrow)"/>
<path class="sv-line" d="M380.0 74.0 V92.0 H630.5 V116.0" marker-end="url(#nc-m1-arrow)"/>
<text class="sv-t3" x="387.0" y="105.0" text-anchor="start">se manifiesta en</text>
<rect class="sv-box" x="12" y="116.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="129.5" y="135.5" text-anchor="middle">Militarismo y guerra</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="149.0" text-anchor="middle">condición estructural; rearme europeo (1, 2)</text>
<rect class="sv-box" x="263" y="116.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="380.5" y="135.5" text-anchor="middle">Genocidio en Gaza</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="149.0" text-anchor="middle">operación del bloque occidental (4, 6)</text>
<rect class="sv-box" x="513" y="116.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="630.5" y="135.5" text-anchor="middle">Giro autoritario y penal</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="149.0" text-anchor="middle">terrorismo = disidencia (5)</text>
<line class="sv-line" x1="129.5" y1="160.0" x2="129.5" y2="212.0" marker-end="url(#nc-m1-arrow)"/>
<text class="sv-t3" x="135.5" y="177.0" text-anchor="start">rearme y austeridad (2, 3)</text>
<line class="sv-line" x1="380.5" y1="160.0" x2="380.5" y2="212.0" marker-end="url(#nc-m1-arrow)"/>
<text class="sv-t3" x="386.5" y="190.0" text-anchor="start">desproporción (4)</text>
<line class="sv-line" x1="630.5" y1="160.0" x2="630.5" y2="212.0" marker-end="url(#nc-m1-arrow)"/>
<text class="sv-t3" x="624.5" y="177.0" text-anchor="end">represión: Palestine Action (4, 5)</text>
<rect class="sv-box" x="12" y="212.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="129.5" y="231.5" text-anchor="middle">Ciclo reaccionario español</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="245.0" text-anchor="middle">impasse, austeridad, aparatos insumisos (3)</text>
<rect class="sv-box" x="263" y="212.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="380.5" y="231.5" text-anchor="middle">Debilidad del proletariado</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="245.0" text-anchor="middle">protestas sin partido (1, 3, 4)</text>
<rect class="sv-box" x="513" y="212.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="630.5" y="231.5" text-anchor="middle">Antimperialismo sin campismo</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="245.0" text-anchor="middle">«el enemigo principal está en casa» (2, 4, 6)</text>
<path class="sv-line-red" d="M129.5 256.0 V273.0 H380.5 V290.0" marker-end="url(#nc-m1-arrow)"/>
<line class="sv-line-red" x1="380.5" y1="256.0" x2="380.5" y2="290.0" marker-end="url(#nc-m1-arrow)"/>
<path class="sv-line-red" d="M630.5 256.0 V273.0 H380.5 V290.0" marker-end="url(#nc-m1-arrow)"/>
<rect class="sv-box" x="12" y="290.0" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="129.5" y="309.5" text-anchor="middle">Racionalidad del marxismo</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="323.0" text-anchor="middle">ni adanismo ni hagiografía (1, 2, 6)</text>
<rect class="sv-box-red" x="263" y="290.0" width="235" height="73.5" rx="2"/>
<text class="sv-tr" x="380.5" y="309.5" text-anchor="middle">Partido comunista de masas e</text>
<text class="sv-tr" x="380.5" y="324.5" text-anchor="middle">internacional</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="338.0" text-anchor="middle">restablecer la independencia política</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="352.5" text-anchor="middle">de la clase (1, 2, 3, 4, 6)</text>
<rect class="sv-box" x="513" y="290.0" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="630.5" y="309.5" text-anchor="middle">Deslinde con el reformismo</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="323.0" text-anchor="middle">unidad de acción sobre mínimos (2, 3, 4)</text>
<line class="sv-line-red" x1="247" y1="326.75" x2="263" y2="326.75" marker-end="url(#nc-m1-arrow)"/>
<line class="sv-line-red" x1="513" y1="326.75" x2="498" y2="326.75" marker-end="url(#nc-m1-arrow)"/>
<text class="sv-t3" x="12" y="385.5" text-anchor="start">HORIZONTE DEL NÚMERO · sin flecha: enmarca todo el mapa</text>
<rect class="sv-box-gold" x="12.0" y="393.5" width="736.0" height="44.0" rx="2"/>
<text class="sv-tg" x="380.0" y="413.0" text-anchor="middle">Umbral de un nuevo ciclo revolucionario que arranca desde la debilidad</text>
<text class="sv-t2" style="font-size:12px" x="380.0" y="426.5" text-anchor="middle">fase de acumulación de fuerzas (1); «entre el presente de debilidad y un futuro de potencia» (3, 4)</text>
<rect class="sv-soft" x="12" y="459.5" width="736" height="97" rx="2"/>
<text class="sv-t3" x="24" y="475.5" text-anchor="start">LEYENDA · flecha gris: de la causa a sus efectos (artículos entre paréntesis) · flecha roja: converge en la tarea central</text>
<text class="sv-t3" x="24" y="490.5" text-anchor="start">ARTÍCULOS DEL NÚMERO</text>
<text class="sv-t2" style="font-size:12px" x="24" y="505.5" text-anchor="start">1 · Mario Aguiriano, «Un nuevo ciclo revolucionario»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="520.5" text-anchor="start">2 · Gabriel Miasni, «¿Hacia una nueva era de crisis, guerras y…?»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="535.5" text-anchor="start">3 · Gonzalo Gallardo, «Nuestros enemigos se recolocan»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="505.5" text-anchor="start">4 · Marta Hernández, «Lecciones del movimiento de solidaridad…»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="520.5" text-anchor="start">5 · Paula Villegas, «Nada fuera del Estado»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="535.5" text-anchor="start">6 · Entrevista con Ray Brassier, «La lucha contra el capitalismo…»</text>
</svg>
