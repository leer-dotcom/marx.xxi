<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos carriles de la historia de la OTAN, el oficial y el clandestino, de 1948 a 2026, con el movimiento obrero como blanco, la lectura marxista del terrorismo de Estado y la posición comunista como lección." viewBox="0 0 760 454" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="12" width="752" height="102" rx="2"/>
<text class="sv-t3" x="12" y="25">carril oficial · la otan como actor político-militar</text>
<rect class="sv-box" x="12" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="71" y="52" text-anchor="middle">1949 · Fundación</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="66" text-anchor="middle">Plan Marshall:</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="79" text-anchor="middle">integración</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="92" text-anchor="middle">subordinada</text>
<rect class="sv-box" x="135.6" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="194.6" y="52" text-anchor="middle">1952 · Flanco sur</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="66" text-anchor="middle">Grecia y Turquía;</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="79" text-anchor="middle">garante de dictaduras</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="92" text-anchor="middle">(Salazar, franquismo)</text>
<rect class="sv-box" x="259.2" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="318.2" y="52" text-anchor="middle">1986 · España</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="66" text-anchor="middle">giro del PSOE («de</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="79" text-anchor="middle">entrada no» → sí);</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="92" text-anchor="middle">referéndum</text>
<rect class="sv-box" x="382.8" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="441.8" y="52" text-anchor="middle">1991 · Reinvención</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="66" text-anchor="middle">expansión al Este:</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="79" text-anchor="middle">cercar a Rusia,</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="92" text-anchor="middle">ampliar mercados</text>
<rect class="sv-box" x="506.4" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="565.4" y="52" text-anchor="middle">1999-2011 · Guerras</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="66" text-anchor="middle">«humanitarias»:</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="79" text-anchor="middle">Kosovo, Afganistán,</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="92" text-anchor="middle">Irak, Libia</text>
<rect class="sv-box" x="630" y="34" width="118" height="72" rx="2"/>
<text class="sv-t" style="font-size:12.5px" x="689" y="52" text-anchor="middle">2008-26 · Ucrania</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="66" text-anchor="middle">Crimea 2014, guerra</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="79" text-anchor="middle">2022: «proxy de la</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="92" text-anchor="middle">OTAN»; rearme 2 %</text>
<line class="sv-line" x1="130" y1="70" x2="135.6" y2="70" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="253.6" y1="70" x2="259.2" y2="70" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="377.2" y1="70" x2="382.8" y2="70" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="500.8" y1="70" x2="506.4" y2="70" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="624.4" y1="70" x2="630" y2="70" marker-end="url(#nc-n3a2-arrow)"/>
<rect class="sv-soft" x="4" y="128" width="752" height="102" rx="2"/>
<text class="sv-t3" x="748" y="141" text-anchor="end">carril clandestino · los ejércitos secretos (gladio)</text>
<rect class="sv-box-gold" x="12" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="71" y="168" text-anchor="middle">1948 · Guerra sucia</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="182" text-anchor="middle">directiva NSC 10/2;</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="195" text-anchor="middle">la CIA en las</text>
<text class="sv-t2" style="font-size:11.5px" x="71" y="208" text-anchor="middle">elecciones italianas</text>
<rect class="sv-box-gold" x="135.6" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="194.6" y="168" text-anchor="middle">1950 · Stay-behind</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="182" text-anchor="middle">redes secretas de</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="195" text-anchor="middle">OTAN, CIA y MI6;</text>
<text class="sv-t2" style="font-size:11.5px" x="194.6" y="208" text-anchor="middle">reclutan fascistas</text>
<rect class="sv-box-gold" x="259.2" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="318.2" y="168" text-anchor="middle">1964-70 · Golpes</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="182" text-anchor="middle">Piano Solo (1964);</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="195" text-anchor="middle">Golpe Borghese</text>
<text class="sv-t2" style="font-size:11.5px" x="318.2" y="208" text-anchor="middle">(1970) con la P2</text>
<rect class="sv-box-gold" x="382.8" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="441.8" y="168" text-anchor="middle">1969 · P. Fontana</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="182" text-anchor="middle">Estrategia de la</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="195" text-anchor="middle">Tensión: atentados</text>
<text class="sv-t2" style="font-size:11.5px" x="441.8" y="208" text-anchor="middle">de falsa bandera</text>
<rect class="sv-box-gold" x="506.4" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="565.4" y="168" text-anchor="middle">1978-80 · Moro</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="182" text-anchor="middle">contra el «compromi-</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="195" text-anchor="middle">so histórico» PCI-DC;</text>
<text class="sv-t2" style="font-size:11.5px" x="565.4" y="208" text-anchor="middle">Bolonia 1980</text>
<rect class="sv-box-gold" x="630" y="150" width="118" height="72" rx="2"/>
<text class="sv-tg" style="font-size:12.5px" x="689" y="168" text-anchor="middle">1984-90 · Verdad</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="182" text-anchor="middle">juez Casson;</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="195" text-anchor="middle">Andreotti reconoce</text>
<text class="sv-t2" style="font-size:11.5px" x="689" y="208" text-anchor="middle">Gladio (1990)</text>
<line class="sv-line" x1="130" y1="186" x2="135.6" y2="186" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="253.6" y1="186" x2="259.2" y2="186" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="377.2" y1="186" x2="382.8" y2="186" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="500.8" y1="186" x2="506.4" y2="186" marker-end="url(#nc-n3a2-arrow)"/>
<line class="sv-line" x1="624.4" y1="186" x2="630" y2="186" marker-end="url(#nc-n3a2-arrow)"/>
<path class="sv-line-dash" d="M71 106 V150" marker-end="url(#nc-n3a2-arrow)"/>
<text class="sv-t3" x="79" y="124">el SHAPE (OTAN) coordina la red</text>
<rect class="sv-box-red" x="12" y="256" width="228" height="60" rx="2"/>
<text class="sv-tr" x="126" y="277" text-anchor="middle">Blanco: la «amenaza interna»</text>
<text class="sv-t2" style="font-size:11.5px" x="126" y="292" text-anchor="middle">PCI, PCF y movimiento obrero,</text>
<text class="sv-t2" style="font-size:11.5px" x="126" y="305" text-anchor="middle">movimientos anticoloniales</text>
<rect class="sv-box-blue" x="254" y="256" width="240" height="60" rx="2"/>
<text class="sv-tb" x="374" y="277" text-anchor="middle">Lectura marxista</text>
<text class="sv-t2" style="font-size:11.5px" x="374" y="292" text-anchor="middle">terrorismo de Estado = «instrumento político</text>
<text class="sv-t2" style="font-size:11.5px" x="374" y="305" text-anchor="middle">del capital»; dictadura de clase en democracia</text>
<rect class="sv-box-ink" x="508" y="256" width="240" height="60" rx="2"/>
<text class="sv-tw" x="628" y="277" text-anchor="middle">Lección: no es un capítulo cerrado</text>
<text class="sv-tw" style="font-size:11.5px;font-weight:400" x="628" y="292" text-anchor="middle">la burguesía defiende las libertades solo</text>
<text class="sv-tw" style="font-size:11.5px;font-weight:400" x="628" y="305" text-anchor="middle">mientras no cuestionan su dominio de clase</text>
<path class="sv-line-red" d="M441.8 222 V240 H126 V256" marker-end="url(#nc-n3a2-arrow)"/>
<text class="sv-t3" x="300" y="236" text-anchor="middle">dirigidas contra</text>
<path class="sv-line" d="M689 222 V240 H628 V256" marker-end="url(#nc-n3a2-arrow)"/>
<path class="sv-line" d="M240 286 H254" marker-end="url(#nc-n3a2-arrow)"/>
<path class="sv-line" d="M494 286 H508" marker-end="url(#nc-n3a2-arrow)"/>
<rect class="sv-box-green" x="12" y="340" width="736" height="60" rx="2"/>
<text class="sv-tgr" x="380" y="361" text-anchor="middle">Posición comunista ante la OTAN</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="376" text-anchor="middle">ni OTAN ni BRICS: oposición a todos los bloques imperialistas; rechazar el pacifismo burgués y a la socialdemocracia</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="389" text-anchor="middle">«no» a OTAN y UE = desmantelarlas; milicia popular de los Estados Unidos Socialistas de Europa; partido comunista europeo</text>
<line class="sv-line" x1="628" y1="316" x2="628" y2="340" marker-end="url(#nc-n3a2-arrow)"/>
<rect class="sv-soft" x="12" y="414" width="736" height="28" rx="2"/>
<text class="sv-t3" x="28" y="432">leyenda</text>
<line class="sv-line" x1="100" y1="428" x2="136" y2="428" marker-end="url(#nc-n3a2-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="144" y="432">cronología · de ahí se extrae</text>
<line class="sv-line-red" x1="360" y1="428" x2="396" y2="428" marker-end="url(#nc-n3a2-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="404" y="432">violencia dirigida contra</text>
<line class="sv-line-dash" x1="570" y1="428" x2="606" y2="428" marker-end="url(#nc-n3a2-arrow)"/>
<text class="sv-t2" style="font-size:11.5px" x="614" y="432">coordinación secreta</text>
</svg>
