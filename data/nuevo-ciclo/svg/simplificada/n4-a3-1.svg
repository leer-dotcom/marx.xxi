<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doble línea temporal del socialismo alemán y ruso antes de 1914 con la combinación de medios legales e ilegales en cada coyuntura, matriz de posiciones ante la reacción de 1907 y la lección que el artículo extrae." viewBox="0 0 760 494" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="106" rx="2"/>
<rect class="sv-soft" x="4" y="150" width="752" height="106" rx="2"/>
<rect class="sv-soft" x="4" y="274" width="752" height="192" rx="2"/>
<text class="sv-t3" x="10" y="27">ALEMANIA</text>
<rect class="sv-box" x="12" y="38" width="360" height="76" rx="2"/>
<text class="sv-t" x="192" y="56" text-anchor="middle">1878-90 · SPD ilegalizado (leyes antisocialistas)</text>
<text class="sv-t2" x="192" y="72" text-anchor="middle" style="font-size:12px">fracción del Reichstag + Sozialdemokrat clandestino</text>
<text class="sv-t2" x="192" y="86" text-anchor="middle" style="font-size:12px">→ 1890: 1,5 millones de votos, «época heroica»;</text>
<text class="sv-t2" x="192" y="100" text-anchor="middle" style="font-size:12px">la política comunista es por definición ilegal</text>
<rect class="sv-box-red" x="388" y="38" width="360" height="76" rx="2"/>
<text class="sv-tr" x="568" y="63" text-anchor="middle">1914 · El SPD vota los créditos</text>
<text class="sv-t2" x="568" y="80" text-anchor="middle" style="font-size:12px">la acumulación legal de Erfurt convertida en dogma;</text>
<text class="sv-t2" x="568" y="94" text-anchor="middle" style="font-size:12px">legalismo = oportunismo: el aparato legal como fin en sí</text>
<text class="sv-t3" x="10" y="161">RUSIA</text>
<rect class="sv-box" x="12" y="172" width="172" height="76" rx="2"/>
<text class="sv-t" x="98" y="190" text-anchor="middle">1900-05 · Iskra</text>
<text class="sv-t2" x="98" y="206" text-anchor="middle" style="font-size:12px">modelo alemán: periódico</text>
<text class="sv-t2" x="98" y="220" text-anchor="middle" style="font-size:12px">que organiza una red</text>
<text class="sv-t2" x="98" y="234" text-anchor="middle" style="font-size:12px">clandestina centralizada</text>
<rect class="sv-box" x="200" y="172" width="172" height="76" rx="2"/>
<text class="sv-t" x="286" y="190" text-anchor="middle">1905-06 · Abrir el partido</text>
<text class="sv-t2" x="286" y="206" text-anchor="middle" style="font-size:12px">Domingo Sangriento: abrir</text>
<text class="sv-t2" x="286" y="220" text-anchor="middle" style="font-size:12px">el partido; tras Moscú,</text>
<text class="sv-t2" x="286" y="234" text-anchor="middle" style="font-size:12px">la Duma como tribuna</text>
<rect class="sv-box" x="388" y="172" width="172" height="76" rx="2"/>
<text class="sv-t" x="474" y="190" text-anchor="middle">1907-12 · Reacción</text>
<text class="sv-t2" x="474" y="206" text-anchor="middle" style="font-size:12px">de 150.000 a 10.000</text>
<text class="sv-t2" x="474" y="220" text-anchor="middle" style="font-size:12px">militantes; núcleo ilegal</text>
<text class="sv-t2" x="474" y="234" text-anchor="middle" style="font-size:12px">+ Duma: «hablar alemán»</text>
<rect class="sv-box-blue" x="576" y="172" width="172" height="76" rx="2"/>
<text class="sv-tb" x="662" y="190" text-anchor="middle">1914 · POSDR ilegal</text>
<text class="sv-t2" x="662" y="206" text-anchor="middle" style="font-size:12px">deber internacionalista:</text>
<text class="sv-t2" x="662" y="220" text-anchor="middle" style="font-size:12px">medios legales e ilegales,</text>
<text class="sv-t2" x="662" y="234" text-anchor="middle" style="font-size:12px">rompe con el oportunismo</text>
<line class="sv-line" x1="184" y1="210" x2="200" y2="210" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="372" y1="210" x2="388" y2="210" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="560" y1="210" x2="576" y2="210" marker-end="url(#nc-n4a3-arrow)"/>
<line class="sv-line" x1="98" y1="114" x2="98" y2="172" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="106" y="146">modelo</text>
<line class="sv-line-dash" x1="662" y1="114" x2="662" y2="172" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="670" y="146">contraste</text>
<text class="sv-t3" x="10" y="285">POSICIONES ANTE LA REACCIÓN DE 1907 (USO DE MEDIOS LEGALES E ILEGALES)</text>
<rect class="sv-box-gold" x="12" y="296" width="172" height="76" rx="2"/>
<text class="sv-tg" x="98" y="314" text-anchor="middle">Liquidadores: sólo</text>
<text class="sv-tg" x="98" y="329" text-anchor="middle">legal</text>
<text class="sv-t2" x="98" y="345" text-anchor="middle" style="font-size:12px">Martov, Dan: todo en lo</text>
<text class="sv-t2" x="98" y="359" text-anchor="middle" style="font-size:12px">legal; liquidan el partido</text>
<rect class="sv-box-gold" x="200" y="296" width="172" height="76" rx="2"/>
<text class="sv-tg" x="286" y="314" text-anchor="middle">Otzovistas: sólo</text>
<text class="sv-tg" x="286" y="329" text-anchor="middle">ilegal</text>
<text class="sv-t2" x="286" y="345" text-anchor="middle" style="font-size:12px">boicot a la Duma y</text>
<text class="sv-t2" x="286" y="359" text-anchor="middle" style="font-size:12px">guerrilla: sectarismo</text>
<rect class="sv-box-gold" x="388" y="296" width="172" height="76" rx="2"/>
<text class="sv-tg" x="474" y="314" text-anchor="middle">Conciliadores:</text>
<text class="sv-tg" x="474" y="329" text-anchor="middle">unidad sin expulsión</text>
<text class="sv-t2" x="474" y="345" text-anchor="middle" style="font-size:12px">Plejánov, Trotsky: crítica</text>
<text class="sv-t2" x="474" y="359" text-anchor="middle" style="font-size:12px">pero sin expulsar</text>
<rect class="sv-box-red" x="576" y="296" width="172" height="90" rx="2"/>
<text class="sv-tr" x="662" y="314" text-anchor="middle">Lenin: combinación</text>
<text class="sv-tr" x="662" y="329" text-anchor="middle">metódica</text>
<text class="sv-t2" x="662" y="345" text-anchor="middle" style="font-size:12px">núcleo ilegal sin</text>
<text class="sv-t2" x="662" y="359" text-anchor="middle" style="font-size:12px">renunciar a la Duma;</text>
<text class="sv-t2" x="662" y="373" text-anchor="middle" style="font-size:12px">expulsar liquidadores</text>
<rect class="sv-box-ink" x="12" y="410" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="428" text-anchor="middle">Lección: subordinar los medios a la estrategia</text>
<text class="sv-tw" x="380" y="445" text-anchor="middle" style="font-size:12px;font-weight:400">preservar la independencia política del proletariado: ni culto a la legalidad ni rechazo abstracto de lo legal</text>
<line class="sv-line" x1="662" y1="386" x2="662" y2="410" marker-end="url(#nc-n4a3-arrow)"/>
<text class="sv-t3" x="12" y="484">FLECHAS: SUCESIÓN TEMPORAL · «MODELO»: INFLUENCIA DIRECTA · DISCONTINUA: CONTRASTE ENTRE AMBOS PARTIDOS EN 1914</text>
</svg>
