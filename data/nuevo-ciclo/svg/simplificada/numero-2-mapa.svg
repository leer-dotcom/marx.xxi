<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual de Nuevo Ciclo #002: la dominación de clase y sus formas políticas (arriba) —franquismo y régimen del 78, reformismo digital y Estado gestor, republicanismo burgués—; las realidades que esas formas gestionan —movimiento obrero, clase sin sujeto, guerra y genocidio—; abajo, el trabajo vivo como fuente de valor y de muerte, el rechazo del nacionalismo y los bloques, y la mediación que el número propone: el partido y su prensa. Al pie, dos tesis de fondo (crisis histórica del capital; el marxismo como teoría social), la leyenda y la clave de artículos." viewBox="0 0 760 587" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-m2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20" text-anchor="start">NUEVO CICLO #002 · MAPA CONCEPTUAL</text>
<text class="sv-t3" x="748" y="20" text-anchor="end">(n) = artículo n del número</text>
<rect class="sv-box-ink" x="180.0" y="30" width="400" height="44.0" rx="2"/>
<text class="sv-tw" x="380.0" y="49.5" text-anchor="middle">Dominación de clase y sus formas políticas</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.0" y="63.0" text-anchor="middle">el Estado cambia de forma para conservar su contenido (1, 6)</text>
<path class="sv-line" d="M380.0 74.0 V92.0 H129.5 V116.0" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="380.0" y1="74.0" x2="380.5" y2="116.0" marker-end="url(#nc-m2-arrow)"/>
<path class="sv-line" d="M380.0 74.0 V92.0 H630.5 V116.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="387.0" y="105.0" text-anchor="start">tres formas examinadas</text>
<rect class="sv-box" x="12" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="129.5" y="135.5" text-anchor="middle">Franquismo → régimen del 78</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="149.0" text-anchor="middle">continuidad del Estado, no del régimen (1)</text>
<rect class="sv-box" x="263" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="380.5" y="135.5" text-anchor="middle">Reformismo digital y Estado</text>
<text class="sv-t" x="380.5" y="150.5" text-anchor="middle">gestor</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="164.0" text-anchor="middle">neofeudalismo como vestido nuevo (2)</text>
<rect class="sv-box" x="513" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="630.5" y="135.5" text-anchor="middle">Republicanismo burgués vs. Marx</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="149.0" text-anchor="middle">dispersar el poder (6)</text>
<line class="sv-line" x1="129.5" y1="175.0" x2="129.5" y2="227.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="135.5" y="192.0" text-anchor="start">espejo obrero del régimen (1)</text>
<line class="sv-line" x1="380.5" y1="175.0" x2="380.5" y2="227.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="386.5" y="205.0" text-anchor="start">multitudes vs. clase (2)</text>
<line class="sv-line" x1="630.5" y1="175.0" x2="630.5" y2="227.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="624.5" y="192.0" text-anchor="end">Gaza, anuncio del futuro (6)</text>
<rect class="sv-box" x="12" y="227.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="129.5" y="246.5" text-anchor="middle">El movimiento obrero como motor</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="260.0" text-anchor="middle">espejo del régimen; conquistas (1, 3, 4)</text>
<rect class="sv-box" x="263" y="227.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="380.5" y="246.5" text-anchor="middle">Clase sin sujeto político</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="260.0" text-anchor="middle">no hay fuerza obrera en Occidente (2, 3, 6)</text>
<rect class="sv-box" x="513" y="227.0" width="235" height="44.0" rx="2"/>
<text class="sv-t" x="630.5" y="246.5" text-anchor="middle">Guerra, rearme y genocidio</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="260.0" text-anchor="middle">población sobrante (3, 4, 6)</text>
<line class="sv-line" x1="129.5" y1="271.0" x2="129.5" y2="323.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="135.5" y="288.0" text-anchor="start">conquistas; el «milagro» franquista (1, 4)</text>
<line class="sv-line-red" x1="380.5" y1="271.0" x2="380.5" y2="323.0" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line" x1="630.5" y1="271.0" x2="630.5" y2="323.0" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="624.5" y="288.0" text-anchor="end">ni secesión, ni europeísmo militar,</text>
<text class="sv-t3" x="624.5" y="301.0" text-anchor="end">ni BRICS (3, 6)</text>
<rect class="sv-box" x="12" y="323.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="129.5" y="342.5" text-anchor="middle">Trabajo vivo: fuente de valor y</text>
<text class="sv-t" x="129.5" y="357.5" text-anchor="middle">de muerte</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="371.0" text-anchor="middle">capital vampiro (2, 4)</text>
<rect class="sv-box-red" x="263" y="323.0" width="235" height="59.0" rx="2"/>
<text class="sv-tr" x="380.5" y="342.5" text-anchor="middle">Partido y prensa como mediación</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="356.0" text-anchor="middle">entre conciencia y praxis (2, 4, 5)</text>
<rect class="sv-box" x="513" y="323.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="630.5" y="342.5" text-anchor="middle">Ni nacionalismo ni bloques</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="356.0" text-anchor="middle">multipolaridad = imperialismo (3, 6)</text>
<line class="sv-line-red" x1="247" y1="352.5" x2="263" y2="352.5" marker-end="url(#nc-m2-arrow)"/>
<line class="sv-line-red" x1="513" y1="352.5" x2="498" y2="352.5" marker-end="url(#nc-m2-arrow)"/>
<text class="sv-t3" x="12" y="404.0" text-anchor="start">TESIS DE FONDO DEL NÚMERO · sin flecha: atraviesan todo el mapa</text>
<rect class="sv-box-gold" x="12.0" y="412.0" width="360.0" height="44.0" rx="2"/>
<text class="sv-tg" x="192.0" y="431.5" text-anchor="middle">Crisis histórica del capital, no progreso lineal</text>
<text class="sv-t2" style="font-size:12px" x="192.0" y="445.0" text-anchor="middle">caída de la rentabilidad productiva (2); población sobrante (4, 6)</text>
<rect class="sv-box-gold" x="388.0" y="412.0" width="360.0" height="44.0" rx="2"/>
<text class="sv-tg" x="568.0" y="431.5" text-anchor="middle">El marxismo, teoría social frente al moralismo</text>
<text class="sv-t2" style="font-size:12px" x="568.0" y="445.0" text-anchor="middle">ni espontaneísmo (5) ni política de los afectos (2, 6)</text>
<rect class="sv-soft" x="12" y="478.0" width="736" height="97" rx="2"/>
<text class="sv-t3" x="24" y="494.0" text-anchor="start">LEYENDA · flecha gris: de la dominación a sus formas, a lo que gestionan y a lo que revelan · flecha roja: la mediación</text>
<text class="sv-t3" x="24" y="509.0" text-anchor="start">ARTÍCULOS DEL NÚMERO</text>
<text class="sv-t2" style="font-size:12px" x="24" y="524.0" text-anchor="start">1 · M. García, «Una unidad de destino en lo universal»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="539.0" text-anchor="start">2 · Alba G. Ferrín, «El vestido nuevo del reformismo»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="554.0" text-anchor="start">3 · G. Juncales, «¿Existe el movimiento obrero europeo?»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="524.0" text-anchor="start">4 · Mikel Palacios, «El campo de batalla del trabajo»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="539.0" text-anchor="start">5 · Volodia, «Los bolcheviques y la prensa»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="554.0" text-anchor="start">6 · Entrevista con William Clare Roberts, «Me niego a ser optimista…»</text>
</svg>
