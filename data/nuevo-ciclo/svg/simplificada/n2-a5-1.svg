<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" role="img" aria-label="Los cuatro órganos de prensa bolcheviques como hitos, con la función que ilustra cada uno y los adversarios frente a los que se define, bajo los principios transversales." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="10" y="20">PUNTO DE PARTIDA</text>
<rect class="sv-box" x="12" y="30" width="736" height="44" rx="2"/>
<text class="sv-t" style="font-size:13px" x="380" y="47.8" text-anchor="middle">El periódico político: «condición fundamental para que cualquier clase pueda participar en la vida política» (Lenin)</text>
<text class="sv-t2" style="font-size:12px" x="380" y="62.8" text-anchor="middle">la prensa obrera de masas crea los grandes partidos; en la autocracia rusa, el órgano clandestino es aún más central</text>
<rect class="sv-soft" x="4" y="84" width="752" height="156" rx="2"/>
<text class="sv-t3" x="10" y="97">PRINCIPIOS TRANSVERSALES</text>
<rect class="sv-box-ink" x="12" y="106" width="360" height="58" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="192" y="123.3" text-anchor="middle">Propagandista, agitador y organizador colectivo</text>
<text class="sv-tw" x="192" y="138.3" text-anchor="middle" style="font-weight:400;font-size:12px">transforma el hecho aislado en experiencia común;</text>
<text class="sv-tw" x="192" y="153.3" text-anchor="middle" style="font-weight:400;font-size:12px">une a los grupos aislados por su red de distribución</text>
<rect class="sv-box-ink" x="388" y="106" width="360" height="58" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="568" y="123.3" text-anchor="middle">Libertad de expresión como reverso de la firmeza</text>
<text class="sv-tw" x="568" y="138.3" text-anchor="middle" style="font-weight:400;font-size:12px">cada organización y fracción edita su propia prensa;</text>
<text class="sv-tw" x="568" y="153.3" text-anchor="middle" style="font-weight:400;font-size:12px">la firmeza se defiende con debate racional</text>
<rect class="sv-box-ink" x="12" y="176" width="360" height="58" rx="2"/>
<text class="sv-tw" style="font-size:13.5px" x="192" y="193.3" text-anchor="middle">Konspiratsiya = publicidad máxima, no zagovor</text>
<text class="sv-tw" x="192" y="208.3" text-anchor="middle" style="font-weight:400;font-size:12px">«el noble arte de no ser arrestado»: eludir a la</text>
<text class="sv-tw" x="192" y="223.3" text-anchor="middle" style="font-weight:400;font-size:12px">policía y difundir al círculo más amplio</text>
<rect class="sv-box-ink" x="388" y="176" width="360" height="58" rx="2"/>
<text class="sv-tw" style="font-size:13px" x="568" y="193.3" text-anchor="middle">El publicista de la revolución, no el dictador en la sombra</text>
<text class="sv-tw" x="568" y="208.3" text-anchor="middle" style="font-weight:400;font-size:12px">el jefe político como tribuno que escribe</text>
<text class="sv-tw" x="568" y="223.3" text-anchor="middle" style="font-weight:400;font-size:12px">«la historia del presente» (Liebknecht, Bebel, Engels)</text>
<rect class="sv-soft" x="4" y="250" width="752" height="240" rx="2"/>
<text class="sv-t3" x="10" y="263">ÓRGANOS DE PRENSA (hitos en orden cronológico)</text>
<rect class="sv-box-red" x="12" y="272" width="360" height="58" rx="2"/>
<text class="sv-tr" x="192" y="289.3" text-anchor="middle">Iskra 1900-03</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="304.3" text-anchor="middle">unificar el POSDR; voz pública; agitación política</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="319.3" text-anchor="middle">— contra el culto a la espontaneidad</text>
<rect class="sv-box" x="388" y="272" width="360" height="58" rx="2"/>
<text class="sv-t" x="568" y="289.3" text-anchor="middle">Vperiod · Proletarii 1904-09</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="304.3" text-anchor="middle">minoría subordinada a la mayoría — contra</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="319.3" text-anchor="middle">mencheviques y otzovistas</text>
<rect class="sv-box" x="12" y="354" width="360" height="58" rx="2"/>
<text class="sv-t" x="192" y="371.3" text-anchor="middle">Sotsial-demokrat 1908-17</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="386.3" text-anchor="middle">columna vertebral clandestina; controla al grupo</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="401.3" text-anchor="middle">parlamentario — contra liquidadores</text>
<rect class="sv-box-red" x="388" y="354" width="360" height="58" rx="2"/>
<text class="sv-tr" x="568" y="371.3" text-anchor="middle">Pravda 1912-14</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="386.3" text-anchor="middle">diario legal de masas, 40.000 ejemplares, tribuna</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="401.3" text-anchor="middle">obrera — contra la censura zarista</text>
<rect class="sv-box-blue" x="12" y="438" width="736" height="44" rx="2"/>
<text class="sv-tb" x="380" y="455.8" text-anchor="middle">«Democracia obrera independiente»: un centro de autoridad alternativo al Estado zarista</text>
<text class="sv-t2" style="font-size:12px" x="380" y="470.8" text-anchor="middle">«Sin Pravda, difícilmente habría sido posible»: los propios trabajadores sostenían, escribían y distribuían el diario</text>
<line class="sv-line" x1="372" y1="301" x2="388" y2="301" marker-end="url(#nc-n2a5-arrow)"/>
<path class="sv-line" d="M568 330 V342 H192 V354" marker-end="url(#nc-n2a5-arrow)"/>
<line class="sv-line" x1="372" y1="383" x2="388" y2="383" marker-end="url(#nc-n2a5-arrow)"/>
<path class="sv-line" d="M568 412 V425 H380 V438" marker-end="url(#nc-n2a5-arrow)"/>
</svg>
