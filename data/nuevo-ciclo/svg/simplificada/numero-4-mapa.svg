<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual de Nuevo Ciclo #004: la coacción como forma dominante (arriba), sus tres escenarios unidos por el imperialismo —Gaza, el barrio, la frontera—, la tesis común de que lo que el liberalismo llama excepción es esencia, el marco liberal-socialdemócrata que lo administra, la unidad con el proletariado migrante y, abajo, la organización de masas con instituciones propias, entre la combinación de legalidad e ilegalidad y la ley como campo de batalla. Al pie, la leyenda y la clave de artículos." viewBox="0 0 760 557" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-m4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20" text-anchor="start">NUEVO CICLO #004 · MAPA CONCEPTUAL</text>
<text class="sv-t3" x="748" y="20" text-anchor="end">(n) = artículo n del número</text>
<rect class="sv-box-ink" x="170.0" y="30" width="420" height="44.0" rx="2"/>
<text class="sv-tw" x="380.0" y="49.5" text-anchor="middle">La coacción pasa al primer plano</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.0" y="63.0" text-anchor="middle">consenso agotado; dominación sin hegemonía (1, 2, 5, 6)</text>
<path class="sv-line" d="M380.0 74.0 V92.0 H129.5 V116.0" marker-end="url(#nc-m4-arrow)"/>
<line class="sv-line" x1="380.0" y1="74.0" x2="380.5" y2="116.0" marker-end="url(#nc-m4-arrow)"/>
<path class="sv-line" d="M380.0 74.0 V92.0 H630.5 V116.0" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="387.0" y="105.0" text-anchor="start">unidos por el imperialismo (1, 2, 5)</text>
<rect class="sv-box" x="12" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="129.5" y="135.5" text-anchor="middle">Genocidio: esencia del sionismo</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="149.0" text-anchor="middle">colonia de asentamiento (1)</text>
<rect class="sv-box" x="263" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="380.5" y="135.5" text-anchor="middle">Populismo punitivo y</text>
<text class="sv-t" x="380.5" y="150.5" text-anchor="middle">parapolicía</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="164.0" text-anchor="middle">población sobrante (2, 6)</text>
<rect class="sv-box" x="513" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="630.5" y="135.5" text-anchor="middle">Frontera: imperialismo en casa</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="149.0" text-anchor="middle">subclase migrante (5)</text>
<line class="sv-line" x1="129.5" y1="175.0" x2="129.5" y2="227.0" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="135.5" y="192.0" text-anchor="start">el genocidio no es una desviación (1)</text>
<line class="sv-line" x1="380.5" y1="175.0" x2="380.5" y2="227.0" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="386.5" y="218.0" text-anchor="start">seguridad como «derecho» (2)</text>
<line class="sv-line" x1="630.5" y1="175.0" x2="630.5" y2="227.0" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="624.5" y="192.0" text-anchor="end">devoluciones en caliente</text>
<text class="sv-t3" x="624.5" y="205.0" text-anchor="end">no son anomalía (5)</text>
<rect class="sv-box" x="12" y="227.0" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="129.5" y="246.5" text-anchor="middle">Lo «excepcional» es esencia</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="260.0" text-anchor="middle">genocidio, devoluciones, delito (1, 2, 5)</text>
<rect class="sv-box" x="263" y="227.0" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="380.5" y="246.5" text-anchor="middle">Marco liberal-socialdemócrata =</text>
<text class="sv-t" x="380.5" y="261.5" text-anchor="middle">ala izquierda del capital</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="275.0" text-anchor="middle">derechos humanos, dos Estados,</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="289.5" text-anchor="middle">seguridad (1, 2, 5, 6)</text>
<rect class="sv-box" x="513" y="227.0" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="630.5" y="246.5" text-anchor="middle">Unidad con el proletariado</text>
<text class="sv-t" x="630.5" y="261.5" text-anchor="middle">migrante</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="275.0" text-anchor="middle">destruir imperialismo y racismo (2, 5)</text>
<line class="sv-line" x1="129.5" y1="300.5" x2="129.5" y2="352.5" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="135.5" y="317.5" text-anchor="start">derecho a la resistencia</text>
<text class="sv-t3" x="135.5" y="330.5" text-anchor="start">y a la revolución (1, 3, 4)</text>
<line class="sv-line-red" x1="380.5" y1="300.5" x2="380.5" y2="352.5" marker-end="url(#nc-m4-arrow)"/>
<line class="sv-line" x1="630.5" y1="300.5" x2="630.5" y2="352.5" marker-end="url(#nc-m4-arrow)"/>
<text class="sv-t3" x="624.5" y="317.5" text-anchor="end">LOEx (5): derogarla no basta</text>
<rect class="sv-box" x="12" y="352.5" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="129.5" y="372.0" text-anchor="middle">Legal + ilegal; 1914 como</text>
<text class="sv-t" x="129.5" y="387.0" text-anchor="middle">espejo</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="400.5" text-anchor="middle">oportunismo: medios vueltos fines (3, 5)</text>
<rect class="sv-box-red" x="263" y="352.5" width="235" height="73.5" rx="2"/>
<text class="sv-tr" x="380.5" y="372.0" text-anchor="middle">Organización de masas e</text>
<text class="sv-tr" x="380.5" y="387.0" text-anchor="middle">instituciones propias</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="400.5" text-anchor="middle">prensa, territorio, ruptura ante el</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="415.0" text-anchor="middle">juez (2, 3, 4, 6)</text>
<rect class="sv-box" x="513" y="352.5" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="630.5" y="372.0" text-anchor="middle">La ley: excepción permanente y</text>
<text class="sv-t" x="630.5" y="387.0" text-anchor="middle">campo de batalla</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="400.5" text-anchor="middle">Duma, proceso, delito de odio (2, 3, 4)</text>
<line class="sv-line-red" x1="247" y1="389.25" x2="263" y2="389.25" marker-end="url(#nc-m4-arrow)"/>
<line class="sv-line-red" x1="513" y1="389.25" x2="498" y2="389.25" marker-end="url(#nc-m4-arrow)"/>
<rect class="sv-soft" x="12" y="448.0" width="736" height="97" rx="2"/>
<text class="sv-t3" x="24" y="464.0" text-anchor="start">LEYENDA · flecha gris: de la coacción a sus escenarios, a lo que revelan y a la respuesta · flecha roja: la organización</text>
<text class="sv-t3" x="24" y="479.0" text-anchor="start">ARTÍCULOS DEL NÚMERO</text>
<text class="sv-t2" style="font-size:12px" x="24" y="494.0" text-anchor="start">1 · MJ, «Genocidio, fase superior del sionismo (I)»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="509.0" text-anchor="start">2 · Miguel Mármol, «Delincuencia, capitalismo y control social»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="524.0" text-anchor="start">3 · Paula D., «Fuera de la ley»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="494.0" text-anchor="start">4 · Carlos Zafra, «Los revolucionarios ante el juez»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="509.0" text-anchor="start">5 · Iker Suárez, «Socialdemocracia e inmigración»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="524.0" text-anchor="start">6 · Entrevista con Alberto Toscano, «Trump es la encarnación…»</text>
</svg>
