<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 664" role="img" aria-label="Hipótesis y tres tesis; espiral austeridad-reacción en cuatro estaciones; los casos históricos y actuales con su patrón común; las tres respuestas, de las que sólo el programa mínimo-máximo sale del ciclo hacia la revolución socialista." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="10" y="20">HIPÓTESIS Y TESIS DEL ARTÍCULO</text>
<rect class="sv-box" x="12" y="28" width="736" height="80" rx="2"/>
<text class="sv-t" x="380" y="46" text-anchor="middle">«La historia no se repite, pero a veces rima»: la pérdida de poder económico de las clases</text>
<text class="sv-t" x="380" y="63" text-anchor="middle">medias por inflación, paro y austeridad es «el motor del ascenso de la reacción»</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="80" text-anchor="middle">tres tesis: (1) la austeridad es causa y consecuencia del auge de la derecha radical; (2) los gobiernos liberales y progresistas</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="94" text-anchor="middle">sólo ofrecen medidas parciales cuyo fracaso alimenta la frustración; (3) el programa mínimo-máximo como alternativa a ambos bloques</text>
<rect class="sv-soft" x="4" y="118" width="752" height="138" rx="2"/>
<text class="sv-t3" x="10" y="131">ESPIRAL AUSTERIDAD → REACCIÓN</text>
<rect class="sv-box" x="12" y="156" width="172" height="92" rx="2"/>
<text class="sv-t" x="98" y="176" text-anchor="middle">Austeridad liberal /</text>
<text class="sv-t" x="98" y="193" text-anchor="middle">progresista</text>
<text class="sv-t2" style="font-size:12px" x="98" y="209" text-anchor="middle">Brüning, Scholz-Merz,</text>
<text class="sv-t2" style="font-size:12px" x="98" y="223" text-anchor="middle">Macron, Biden</text>
<text class="sv-t2" style="font-size:11.5px" x="98" y="237" text-anchor="middle">«decisión política», no error</text>
<rect class="sv-box" x="200" y="156" width="172" height="92" rx="2"/>
<text class="sv-t" x="286" y="176" text-anchor="middle">Frustración de clases</text>
<text class="sv-t" x="286" y="193" text-anchor="middle">medias y trabajadoras</text>
<text class="sv-t2" style="font-size:12px" x="286" y="209" text-anchor="middle">inflación, paro, recortes</text>
<text class="sv-t2" style="font-size:11.5px" x="286" y="223" text-anchor="middle">proletarización, abstención;</text>
<text class="sv-t2" style="font-size:11.5px" x="286" y="237" text-anchor="middle">Reform UK: 65 %, coste de vida</text>
<rect class="sv-box-red" x="388" y="156" width="172" height="92" rx="2"/>
<text class="sv-tr" x="474" y="176" text-anchor="middle">Derecha radical en</text>
<text class="sv-tr" x="474" y="193" text-anchor="middle">auge o en el gobierno</text>
<text class="sv-t2" style="font-size:12px" x="474" y="209" text-anchor="middle">AfD, Le Pen, Meloni, Trump II</text>
<text class="sv-t2" style="font-size:11.5px" x="474" y="223" text-anchor="middle">populismo económico y</text>
<text class="sv-t2" style="font-size:11.5px" x="474" y="237" text-anchor="middle">nacionalismo; no es fascismo</text>
<rect class="sv-box-red" x="576" y="156" width="172" height="92" rx="2"/>
<text class="sv-tr" x="662" y="176" text-anchor="middle">Austeridad selectiva +</text>
<text class="sv-tr" x="662" y="193" text-anchor="middle">nacionalismo económico</text>
<text class="sv-t2" style="font-size:12px" x="662" y="209" text-anchor="middle">bienestar recortado,</text>
<text class="sv-t2" style="font-size:12px" x="662" y="223" text-anchor="middle">Estado coercitivo fuerte</text>
<text class="sv-t2" style="font-size:11.5px" x="662" y="237" text-anchor="middle">estancamiento + crisis</text>
<line class="sv-line" x1="184" y1="202" x2="200" y2="202" marker-end="url(#nc-n3a5-arrow)"/>
<line class="sv-line" x1="372" y1="202" x2="388" y2="202" marker-end="url(#nc-n3a5-arrow)"/>
<line class="sv-line" x1="560" y1="202" x2="576" y2="202" marker-end="url(#nc-n3a5-arrow)"/>
<path class="sv-line-red" d="M662 156 V142 H98 V156" marker-end="url(#nc-n3a5-arrow)"/>
<text class="sv-t3" x="380" y="137" text-anchor="middle">el ciclo se reabre: «la historia rima»</text>
<rect class="sv-soft" x="4" y="266" width="752" height="124" rx="2"/>
<text class="sv-t3" x="10" y="279">RESPUESTAS</text>
<rect class="sv-box-blue" x="12" y="290" width="232" height="92" rx="2"/>
<text class="sv-tb" x="128" y="310" text-anchor="middle">Weber, Piketty, Zucman,</text>
<text class="sv-tb" x="128" y="327" text-anchor="middle">Mamdani</text>
<text class="sv-t2" style="font-size:12px" x="128" y="343" text-anchor="middle">política económica antifascista</text>
<text class="sv-t2" style="font-size:12px" x="128" y="357" text-anchor="middle">interclasista; Estado neutral</text>
<text class="sv-t2" style="font-size:11.5px" x="128" y="371" text-anchor="middle">presupone una economía de suma positiva</text>
<rect class="sv-box" x="256" y="290" width="232" height="92" rx="2"/>
<text class="sv-t" x="372" y="314" text-anchor="middle">Izquierda gobernista</text>
<text class="sv-t2" style="font-size:12px" x="372" y="332" text-anchor="middle">versiones aguadas, aplazamientos,</text>
<text class="sv-t2" style="font-size:12px" x="372" y="346" text-anchor="middle">olvidos (Sumar)</text>
<text class="sv-t2" style="font-size:11.5px" x="372" y="362" text-anchor="middle">integrada en el bloque de poder burgués;</text>
<text class="sv-t2" style="font-size:11.5px" x="372" y="376" text-anchor="middle">la decepción alimenta la reacción</text>
<rect class="sv-box-red" x="500" y="290" width="248" height="92" rx="2"/>
<text class="sv-tr" x="624" y="310" text-anchor="middle">Programa mínimo-máximo de una</text>
<text class="sv-tr" x="624" y="327" text-anchor="middle">fuerza independiente</text>
<text class="sv-t2" style="font-size:12px" x="624" y="343" text-anchor="middle">cinco líneas → revolución socialista;</text>
<text class="sv-t2" style="font-size:11.5px" x="624" y="357" text-anchor="middle">fuerza «orientada a disputar el poder</text>
<text class="sv-t2" style="font-size:11.5px" x="624" y="371" text-anchor="middle">y no a administrarlo»</text>
<path class="sv-line-dash" d="M128 266 V260 H278 V248" marker-end="url(#nc-n3a5-arrow)"/>
<path class="sv-line-dash" d="M372 266 V260 H294 V248" marker-end="url(#nc-n3a5-arrow)"/>
<text class="sv-t3" x="392" y="264">← las dos primeras respuestas realimentan la frustración</text>
<rect class="sv-box-ink" x="12" y="404" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="422" text-anchor="middle">Salida del ciclo: «la única manera de aplastar al fascismo es la revolución socialista»</text>
<text class="sv-tw" style="font-size:11.5px" x="380" y="439" text-anchor="middle">programa de mínimos —democratización radical + soberanía proletaria sobre producción y distribución— para construir el partido</text>
<line class="sv-line-red" x1="624" y1="382" x2="624" y2="404" marker-end="url(#nc-n3a5-arrow)"/>
<rect class="sv-soft" x="4" y="464" width="752" height="170" rx="2"/>
<text class="sv-t3" x="10" y="477">CASOS: LAS DOS CARAS DE UNA MONEDA (causa en Alemania, instrumento en Italia) Y EL PRESENTE</text>
<rect class="sv-box-gold" x="12" y="488" width="172" height="78" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="98" y="507" text-anchor="middle">Weimar: Brüning →</text>
<text class="sv-tg" style="font-size:13px" x="98" y="523" text-anchor="middle">NSDAP</text>
<text class="sv-t2" style="font-size:11.5px" x="98" y="540" text-anchor="middle">la austeridad engendra</text>
<text class="sv-t2" style="font-size:11.5px" x="98" y="554" text-anchor="middle">al nazismo: paro ×4</text>
<rect class="sv-box-gold" x="200" y="488" width="172" height="78" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="286" y="507" text-anchor="middle">Italia: Mussolini →</text>
<text class="sv-tg" style="font-size:13px" x="286" y="523" text-anchor="middle">austeridad</text>
<text class="sv-t2" style="font-size:11.5px" x="286" y="540" text-anchor="middle">el fascismo la aplica</text>
<text class="sv-t2" style="font-size:11.5px" x="286" y="554" text-anchor="middle">(Pareto, finanza anglosajona)</text>
<rect class="sv-box-gold" x="388" y="488" width="172" height="78" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="474" y="507" text-anchor="middle">Franquismo: autarquía</text>
<text class="sv-tg" style="font-size:13px" x="474" y="523" text-anchor="middle">1939-59</text>
<text class="sv-t2" style="font-size:11.5px" x="474" y="540" text-anchor="middle">«a cara descubierta»;</text>
<text class="sv-t2" style="font-size:11.5px" x="474" y="554" text-anchor="middle">quiebra de 1959</text>
<rect class="sv-box-gold" x="576" y="488" width="172" height="78" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="662" y="507" text-anchor="middle">Hoy: -1 % de gasto =</text>
<text class="sv-tg" style="font-size:13px" x="662" y="523" text-anchor="middle">+3 % de voto ultra</text>
<text class="sv-t2" style="font-size:11.5px" x="662" y="540" text-anchor="middle">Alemania, Francia, Italia,</text>
<text class="sv-t2" style="font-size:11.5px" x="662" y="554" text-anchor="middle">EE. UU.; Trump II, «laboratorio»</text>
<rect class="sv-box-gold" x="12" y="578" width="736" height="48" rx="2"/>
<text class="sv-tg" x="380" y="596" text-anchor="middle">Patrón común: la austeridad como «solución autoritaria» a las contradicciones del capitalismo en crisis</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="613" text-anchor="middle">costes asimétricos (capital protegido), centralización del poder, criminalización del conflicto social, autarquía, rearme e imperialismo</text>
<text class="sv-t3" x="10" y="652">Leyenda: continua = eslabón de la espiral · roja = el ciclo se reabre / la salida · discontinua = realimenta el ciclo</text>
</svg>
