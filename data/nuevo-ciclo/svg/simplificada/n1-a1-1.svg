<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 558" role="img" aria-label="Línea de ciclos revolucionarios, balance del siglo XX y cadena causal de la encrucijada actual, con la independencia política del proletariado como única salida y los errores a evitar." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="156" rx="2"/>
<text class="sv-t3" x="10" y="27">CICLOS REVOLUCIONARIOS Y BALANCE DEL SIGLO XX</text>
<rect class="sv-box" x="12" y="38" width="172" height="58" rx="2"/>
<text class="sv-t" x="98" y="55.3" text-anchor="middle">Ciclo revolucionario</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="70.3" text-anchor="middle">disputa abierta entre dos</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="85.3" text-anchor="middle">modelos civilizatorios</text>
<rect class="sv-box" x="200" y="38" width="172" height="58" rx="2"/>
<text class="sv-t" x="286" y="55.3" text-anchor="middle">Ciclo del siglo XX</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="70.3" text-anchor="middle">1917-1991: repliegue</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="85.3" text-anchor="middle">transitorio, no derrota</text>
<rect class="sv-box" x="388" y="38" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="55.3" text-anchor="middle">Cierre y repliegue</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="70.3" text-anchor="middle">bancarrota del «socialismo</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="85.3" text-anchor="middle">en un solo país»</text>
<rect class="sv-box-red" x="576" y="38" width="172" height="58" rx="2"/>
<text class="sv-tr" x="662" y="55.3" text-anchor="middle">Nuevo ciclo</text>
<text class="sv-tr" x="662" y="70.3" text-anchor="middle">revolucionario</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="85.3" text-anchor="middle">sobre el declive del capital</text>
<rect class="sv-box-gold" x="12" y="106" width="236" height="58" rx="2"/>
<text class="sv-tg" x="130" y="123.3" text-anchor="middle">Dos errores simétricos</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="138.3" text-anchor="middle">adanismo (borrón y cuenta nueva)</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="153.3" text-anchor="middle">· hagiografía (conectarse a la ola)</text>
<rect class="sv-box-blue" x="262" y="106" width="236" height="58" rx="2"/>
<text class="sv-tb" x="380" y="123.3" text-anchor="middle">Racionalidad del marxismo</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="138.3" text-anchor="middle">4 tesis: emancipación proletaria,</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="153.3" text-anchor="middle">obra propia, socialismo, partido</text>
<rect class="sv-box" x="512" y="106" width="236" height="58" rx="2"/>
<text class="sv-t" x="630" y="123.3" text-anchor="middle">Cómo explicar el fracaso del XX</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="138.3" text-anchor="middle">base material insuficiente +</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="153.3" text-anchor="middle">deformaciones burocráticas</text>
<line class="sv-line-dash" x1="184" y1="67" x2="200" y2="67"/>
<line class="sv-line" x1="372" y1="67" x2="388" y2="67" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="560" y1="67" x2="576" y2="67" marker-end="url(#nc-n1a1-arrow)"/>
<rect class="sv-soft" x="4" y="178" width="752" height="374" rx="2"/>
<text class="sv-t3" x="10" y="189">LA ENCRUCIJADA DEL PRESENTE</text>
<rect class="sv-box-ink" x="12" y="206" width="172" height="58" rx="2"/>
<text class="sv-tw" x="98" y="223.3" text-anchor="middle">Declive capitalista</text>
<text class="sv-tw" x="98" y="238.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">crisis histórica del modo</text>
<text class="sv-tw" x="98" y="253.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">de producción</text>
<rect class="sv-box" x="200" y="206" width="172" height="58" rx="2"/>
<text class="sv-t" x="286" y="223.3" text-anchor="middle">Proletarización masiva</text>
<text class="sv-t" x="286" y="238.3" text-anchor="middle">+ fragmentación</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="253.3" text-anchor="middle">precariedad y sobrantes</text>
<rect class="sv-box" x="388" y="206" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="223.3" text-anchor="middle">Debilidad política</text>
<text class="sv-t" x="474" y="238.3" text-anchor="middle">del proletariado</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="253.3" text-anchor="middle">sin partido ni mov. obrero</text>
<rect class="sv-box" x="576" y="206" width="172" height="58" rx="2"/>
<text class="sv-t" style="font-size:12.4px" x="662" y="223.3" text-anchor="middle">Hegemonía pequeñoburguesa</text>
<text class="sv-t" style="font-size:12.4px" x="662" y="238.3" text-anchor="middle">de las protestas</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="253.3" text-anchor="middle">15-M, primaveras árabes</text>
<rect class="sv-box" x="12" y="282" width="300" height="58" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="162" y="299.3" text-anchor="middle">Integración estatal e imperialismo</text>
<text class="sv-t2" style="font-size:12.5px" x="162" y="314.3" text-anchor="middle">el imperialismo compra la lealtad de</text>
<text class="sv-t2" style="font-size:12.5px" x="162" y="329.3" text-anchor="middle">sectores obreros (Bujarin)</text>
<rect class="sv-box-gold" x="326" y="282" width="300" height="58" rx="2"/>
<text class="sv-tg" x="476" y="299.3" text-anchor="middle">Crítica de la «comunización»</text>
<text class="sv-t2" style="font-size:12.5px" x="476" y="314.3" text-anchor="middle">absolutiza la fragmentación;</text>
<text class="sv-t2" style="font-size:12.5px" x="476" y="329.3" text-anchor="middle">prever formas de acción híbridas</text>
<rect class="sv-box-gold" x="12" y="376" width="236" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="130" y="393.3" text-anchor="middle">Ascenso del populismo de derechas</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="408.3" text-anchor="middle">fascismo actualizado, alineado</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="423.3" text-anchor="middle">con la burguesía</text>
<rect class="sv-box" x="262" y="376" width="236" height="58" rx="2"/>
<text class="sv-t" x="380" y="393.3" text-anchor="middle">Impotencia de las protestas</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="408.3" text-anchor="middle">la pequeña burguesía gravita</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="423.3" text-anchor="middle">hacia una burguesía decadente</text>
<rect class="sv-box" x="512" y="376" width="236" height="58" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="630" y="393.3" text-anchor="middle">Revoluciones burguesas obsoletas</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="408.3" text-anchor="middle">la burguesía ya no es</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="423.3" text-anchor="middle">revolucionaria</text>
<rect class="sv-box-red" x="12" y="468" width="484" height="58" rx="2"/>
<text class="sv-tr" x="254" y="492.8" text-anchor="middle">Salida: independencia política del proletariado</text>
<text class="sv-t2" style="font-size:12.5px" x="254" y="507.8" text-anchor="middle">partido + movimiento obrero, sin etapismos (la tarea de 1850)</text>
<rect class="sv-box-gold" x="512" y="468" width="236" height="58" rx="2"/>
<text class="sv-tg" x="630" y="485.3" text-anchor="middle">Dos errores a evitar hoy</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="500.3" text-anchor="middle">«el general sin ejército»;</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="515.3" text-anchor="middle">etapismo sin partido</text>
<line class="sv-line" x1="184" y1="235" x2="200" y2="235" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="372" y1="235" x2="388" y2="235" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="560" y1="235" x2="576" y2="235" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line-dash" x1="98" y1="264" x2="98" y2="282"/>
<path class="sv-line-dash" d="M286 264 V273 H476 V282"/>
<path class="sv-line" d="M662 264 V362 H380 V376" marker-end="url(#nc-n1a1-arrow)"/>
<text class="sv-t3" x="650" y="358" text-anchor="end">encrucijada: hegemonía pequeñoburguesa + revolución burguesa anacrónica</text>
<line class="sv-line" x1="512" y1="405" x2="498" y2="405" marker-end="url(#nc-n1a1-arrow)"/>
<line class="sv-line" x1="262" y1="405" x2="248" y2="405" marker-end="url(#nc-n1a1-arrow)"/>
<path class="sv-line-red" d="M380 434 V468" marker-end="url(#nc-n1a1-arrow)"/>
<text class="sv-t3" x="392" y="447">la única revolución posible es la socialista,</text>
<text class="sv-t3" x="392" y="460">bloqueada por la debilidad organizativa del proletariado</text>
<line class="sv-line" x1="12" y1="548" x2="40" y2="548"/>
<text class="sv-t3" x="46" y="552">encadenamiento causal</text>
<line class="sv-line-dash" x1="200" y1="548" x2="228" y2="548"/>
<text class="sv-t3" x="234" y="552">análisis complementario</text>
<line class="sv-line-red" x1="400" y1="548" x2="428" y2="548"/>
<text class="sv-t3" x="434" y="552">salida que señala el artículo</text>
</svg>
