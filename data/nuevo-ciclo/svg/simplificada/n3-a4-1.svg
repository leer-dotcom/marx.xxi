<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" role="img" aria-label="Cuatro paradigmas feministas comparados con la teoría unitaria en cómo explican la opresión, qué aportan y cuál es su límite, con el balance del ciclo y el economicismo como raíz común." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="10" y="20">PUNTO DE PARTIDA: BALANCE DEL CICLO FEMINISTA</text>
<rect class="sv-box" x="12" y="28" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="46" text-anchor="middle">Reactivación sin superación: las luchas de género vuelven con las mismas limitaciones de hace diez años</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="63" text-anchor="middle">ciclo aborto → Manada → huelga de 2018 → declive; límite: el interclasismo; aun así, «vector de politización» de una generación</text>
<rect class="sv-box-ink" x="12" y="88" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="106" text-anchor="middle">Raíz común: economicismo y dualismo heredados del movimiento comunista</text>
<text class="sv-tw" style="font-size:12px" x="380" y="123" text-anchor="middle">si la clase es sólo economía, el género es «cultura» de un sistema paralelo (el patriarcado)</text>
<rect class="sv-soft" x="4" y="146" width="752" height="384" rx="2"/>
<text class="sv-t3" x="10" y="159">LOS CUATRO PARADIGMAS (contagiados por la raíz común)</text>
<text class="sv-t3" x="247" y="176" text-anchor="middle">CÓMO EXPLICA LA OPRESIÓN</text>
<text class="sv-t3" x="436" y="176" text-anchor="middle">QUÉ APORTA</text>
<text class="sv-t3" x="631" y="176" text-anchor="middle">LÍMITE / RESULTADO</text>
<path class="sv-line-dash" d="M380 136 V146" marker-end="url(#nc-n3a4-arrow)"/>
<rect class="sv-box" x="136" y="186" width="222" height="78" rx="2"/>
<text class="sv-t" x="247" y="206" text-anchor="middle">Patriarcado transhistórico</text>
<text class="sv-t" x="247" y="223" text-anchor="middle">de raíz biológica</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="239" text-anchor="middle">oprimidas por su capacidad de gestar;</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="253" text-anchor="middle">el patriarcado pervive «como un fósil»</text>
<rect class="sv-box" x="366" y="186" width="140" height="78" rx="2"/>
<text class="sv-t2" style="font-size:11.5px" x="436" y="215" text-anchor="middle">punto de partida del</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="229" text-anchor="middle">feminismo de clase; hoy</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="243" text-anchor="middle">sector institucional</text>
<rect class="sv-box" x="514" y="186" width="234" height="78" rx="2"/>
<text class="sv-t" x="631" y="206" text-anchor="middle">Esencialismo: terfs aliadas</text>
<text class="sv-t" x="631" y="223" text-anchor="middle">con reacción y «rojipardos»</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="239" text-anchor="middle">sin sujeto ni enemigo definidos;</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="253" text-anchor="middle">persigue a trans y trabajadoras sexuales</text>
<rect class="sv-box-gold" x="12" y="186" width="116" height="78" rx="2"/>
<text class="sv-tg" style="font-size:12px" x="70" y="229" text-anchor="middle">Feminismo radical</text>
<rect class="sv-box" x="136" y="272" width="222" height="78" rx="2"/>
<text class="sv-t" x="247" y="292" text-anchor="middle">Doble opresión: la mujer</text>
<text class="sv-t" x="247" y="309" text-anchor="middle">trabajadora y los cuidados</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="325" text-anchor="middle">oprimida en ambos sistemas; «doblemente</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="339" text-anchor="middle">explotadas, doblemente revolucionarias»</text>
<rect class="sv-box" x="366" y="272" width="140" height="78" rx="2"/>
<text class="sv-t2" style="font-size:11.5px" x="436" y="301" text-anchor="middle">acota mejor el sujeto;</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="315" text-anchor="middle">los cuidados, piedra</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="329" text-anchor="middle">angular de las huelgas</text>
<rect class="sv-box" x="514" y="272" width="234" height="78" rx="2"/>
<text class="sv-t" x="631" y="292" text-anchor="middle">Sujeto fragmentado; no rompe</text>
<text class="sv-t" x="631" y="309" text-anchor="middle">el dualismo</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="325" text-anchor="middle">no explica unitariamente ambas opresiones;</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="339" text-anchor="middle">sujeto sólo como parte del proletariado</text>
<rect class="sv-box-gold" x="12" y="272" width="116" height="78" rx="2"/>
<text class="sv-tg" style="font-size:12px" x="70" y="308" text-anchor="middle">Feminismo de</text>
<text class="sv-tg" style="font-size:12px" x="70" y="322" text-anchor="middle">clase</text>
<rect class="sv-box" x="136" y="358" width="222" height="78" rx="2"/>
<text class="sv-t" x="247" y="378" text-anchor="middle">Vectores entrecruzados;</text>
<text class="sv-t" x="247" y="395" text-anchor="middle">la clase, uno más</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="411" text-anchor="middle">nace del feminismo negro de EE. UU.;</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="425" text-anchor="middle">sin jerarquía entre ejes de opresión</text>
<rect class="sv-box" x="366" y="358" width="140" height="78" rx="2"/>
<text class="sv-t2" style="font-size:11.5px" x="436" y="387" text-anchor="middle">rompe el sujeto «mujer»</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="401" text-anchor="middle">monolítico; crítica que</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="415" text-anchor="middle">comparte el marxismo</text>
<rect class="sv-box" x="514" y="358" width="234" height="78" rx="2"/>
<text class="sv-t" x="631" y="378" text-anchor="middle">Relativismo interclasista;</text>
<text class="sv-t" x="631" y="395" text-anchor="middle">sin sujeto ni programa</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="411" text-anchor="middle">frentes interclasistas que alían a las</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="425" text-anchor="middle">trabajadoras con sectores de la burguesía</text>
<rect class="sv-box-gold" x="12" y="358" width="116" height="78" rx="2"/>
<text class="sv-tg" style="font-size:12px" x="70" y="401" text-anchor="middle">Interseccionalidad</text>
<rect class="sv-box" x="136" y="444" width="222" height="78" rx="2"/>
<text class="sv-t" x="247" y="464" text-anchor="middle">Identidades que disciplinan;</text>
<text class="sv-t" x="247" y="481" text-anchor="middle">crítica lingüística</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="497" text-anchor="middle">identidad = violencia que disciplina;</text>
<text class="sv-t2" style="font-size:11.5px" x="247" y="511" text-anchor="middle">emancipación en «los márgenes»</text>
<rect class="sv-box" x="366" y="444" width="140" height="78" rx="2"/>
<text class="sv-t2" style="font-size:11.5px" x="436" y="473" text-anchor="middle">ve que las identidades</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="487" text-anchor="middle">disciplinan y dividen</text>
<text class="sv-t2" style="font-size:11.5px" x="436" y="501" text-anchor="middle">a la clase</text>
<rect class="sv-box" x="514" y="444" width="234" height="78" rx="2"/>
<text class="sv-t" x="631" y="464" text-anchor="middle">«Islas de indeterminación»</text>
<text class="sv-t" x="631" y="481" text-anchor="middle">en los márgenes</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="497" text-anchor="middle">idealismo: crítica del lenguaje, no de las</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="511" text-anchor="middle">relaciones de producción; sin masas</text>
<rect class="sv-box-gold" x="12" y="444" width="116" height="78" rx="2"/>
<text class="sv-tg" style="font-size:12px" x="70" y="487" text-anchor="middle">Teoría queer</text>
<text class="sv-t3" x="10" y="546">LA PROPUESTA</text>
<rect class="sv-box-red" x="136" y="556" width="370" height="78" rx="2"/>
<text class="sv-tr" x="321" y="576" text-anchor="middle">Lucha de clases como piedra angular: el género es</text>
<text class="sv-tr" x="321" y="593" text-anchor="middle">una relación capitalista (familia nuclear)</text>
<text class="sv-t2" style="font-size:11.5px" x="321" y="609" text-anchor="middle">la relación trabajo-capital, fuerza motriz de todas las relaciones sociales;</text>
<text class="sv-t2" style="font-size:11.5px" x="321" y="623" text-anchor="middle">las opresiones de género son «expresiones de la lucha de clases»</text>
<rect class="sv-box-red" x="514" y="556" width="234" height="78" rx="2"/>
<text class="sv-tr" x="631" y="576" text-anchor="middle">Recomposición del proletariado</text>
<text class="sv-tr" x="631" y="593" text-anchor="middle">como sujeto; alianzas parciales</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="609" text-anchor="middle">alianzas con lo más avanzado del feminismo</text>
<text class="sv-t2" style="font-size:11.5px" x="631" y="623" text-anchor="middle">organizado, «sin condescendencia»</text>
<rect class="sv-box-red" x="12" y="556" width="116" height="78" rx="2"/>
<text class="sv-tr" x="70" y="585" text-anchor="middle">Teoría</text>
<text class="sv-tr" x="70" y="601" text-anchor="middle">unitaria</text>
<text class="sv-tr" x="70" y="617" text-anchor="middle">(Vogel)</text>
<text class="sv-t3" x="10" y="654">Leyenda: flecha discontinua = el economicismo heredado contagia a los cuatro paradigmas;</text>
<text class="sv-t3" x="10" y="670">la fila de la propuesta responde a las mismas columnas (explicación y aporte / resultado)</text>
</svg>
