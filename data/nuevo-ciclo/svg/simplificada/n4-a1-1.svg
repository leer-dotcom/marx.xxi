<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embudo causal del sionismo: tres bases (antisemitismo europeo y mito bíblico, tutela imperial, lógica del capital) convergen en un Estado colonial de asentamiento cuya lógica desemboca en el genocidio como esencia y no como excepción; a un lado, las posiciones que el artículo rechaza." viewBox="0 0 760 464" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20">TRES BASES DEL PROYECTO SIONISTA</text>
<rect class="sv-box" x="12" y="30" width="235" height="76" rx="2"/>
<text class="sv-t" x="129.5" y="48" text-anchor="middle">Antisemitismo europeo + mito</text>
<text class="sv-t" x="129.5" y="63" text-anchor="middle">bíblico secularizado</text>
<text class="sv-t2" x="129.5" y="79" text-anchor="middle" style="font-size:12px">pogromos del XIX; exilio y «retorno»;</text>
<text class="sv-t2" x="129.5" y="93" text-anchor="middle" style="font-size:12px">fundamentalistas como vanguardia</text>
<rect class="sv-box" x="263" y="30" width="235" height="76" rx="2"/>
<text class="sv-t" x="380.5" y="48" text-anchor="middle">Interés imperial británico y</text>
<text class="sv-t" x="380.5" y="63" text-anchor="middle">occidental</text>
<text class="sv-t2" x="380.5" y="79" text-anchor="middle" style="font-size:12px">Rothschild, Basilea, Balfour, Mandato:</text>
<text class="sv-t2" x="380.5" y="93" text-anchor="middle" style="font-size:12px">«baluarte frente a Asia» (Herzl)</text>
<rect class="sv-box" x="513" y="30" width="235" height="76" rx="2"/>
<text class="sv-t" x="630.5" y="55" text-anchor="middle">Lógica de acumulación del capital</text>
<text class="sv-t2" x="630.5" y="73" text-anchor="middle" style="font-size:12px">apropiación violenta y guerra (Lenin);</text>
<text class="sv-t2" x="630.5" y="87" text-anchor="middle" style="font-size:12px">expansión constante a nuevos espacios</text>
<rect class="sv-box-ink" x="12" y="134" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="152" text-anchor="middle">Estado colonial de asentamiento («colonia de trabajo», Machover)</text>
<text class="sv-tw" x="380" y="169" text-anchor="middle" style="font-size:12px;font-weight:400">objetivo común a todas las corrientes (Ben Gurión, Jabotinsky): los colonos ocupan la producción, el trabajo palestino sobra</text>
<path class="sv-line" d="M129 106 V120 H380 V134" marker-end="url(#nc-n4a1-arrow)"/>
<line class="sv-line" x1="380" y1="106" x2="380" y2="134" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M631 106 V120 H380 V134" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box" x="12" y="210" width="360" height="68" rx="2"/>
<text class="sv-t" x="192" y="228" text-anchor="middle">Proletariado palestino inservible →</text>
<text class="sv-t" x="192" y="243" text-anchor="middle">expulsión y limpieza étnica</text>
<text class="sv-t2" x="192" y="259" text-anchor="middle" style="font-size:12px">Israel, «verdadero motor de limpieza étnica»;</text>
<text class="sv-t2" x="192" y="273" text-anchor="middle" style="font-size:12px">el resto, ejército industrial de reserva</text>
<rect class="sv-box" x="388" y="210" width="360" height="68" rx="2"/>
<text class="sv-t" x="568" y="234" text-anchor="middle">Apartheid jurídico + economía militarizada</text>
<text class="sv-t2" x="568" y="252" text-anchor="middle" style="font-size:12px">sin constitución; 14 Leyes Fundamentales, Ley de Retorno:</text>
<text class="sv-t2" x="568" y="266" text-anchor="middle" style="font-size:12px">etnoestado; Tzahal: perro guardián y laboratorio imperialista</text>
<path class="sv-line" d="M380 182 V196 H192 V210" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M380 182 V196 H568 V210" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box-red" x="12" y="302" width="485" height="48" rx="2"/>
<text class="sv-tr" x="254.5" y="320" text-anchor="middle">Genocidio en Gaza: salto cualitativo, no excepción</text>
<text class="sv-t2" x="254.5" y="337" text-anchor="middle" style="font-size:12px">«inscrito en su ADN»: esencia del Estado, no desviación de un gobierno</text>
<rect class="sv-box-gold" x="513" y="302" width="235" height="68" rx="2"/>
<text class="sv-tg" x="630.5" y="320" text-anchor="middle">Rechazado: dos Estados, pacifismo</text>
<text class="sv-tg" x="630.5" y="335" text-anchor="middle">liberal</text>
<text class="sv-t2" x="630.5" y="351" text-anchor="middle" style="font-size:12px">incapaces de pensar la acumulación;</text>
<text class="sv-t2" x="630.5" y="365" text-anchor="middle" style="font-size:12px">«convivencia abstracta» inviable</text>
<path class="sv-line" d="M192 278 V290 H255 V302" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line" d="M568 278 V290 H255 V302" marker-end="url(#nc-n4a1-arrow)"/>
<rect class="sv-box" x="12" y="378" width="736" height="58" rx="2"/>
<text class="sv-t" x="380" y="396" text-anchor="middle">Única solución: que Israel deje de existir como Estado sionista · derecho del proletariado palestino a la</text>
<text class="sv-t" x="380" y="411" text-anchor="middle">resistencia</text>
<text class="sv-t2" x="380" y="427" text-anchor="middle" style="font-size:12px">no puede existir un Estado sionista democrático; el genocidio no se detiene con un cambio de gobierno</text>
<path class="sv-line-red" d="M255 350 V364 H380 V378" marker-end="url(#nc-n4a1-arrow)"/>
<path class="sv-line-dash" d="M631 370 V378 H520 V378" marker-end="url(#nc-n4a1-arrow)"/>
<text class="sv-t3" x="12" y="454">FLECHA CONTINUA: CADENA CAUSAL · DISCONTINUA: POSICIÓN QUE EL ARTÍCULO RECHAZA FRENTE A SU CONCLUSIÓN</text>
</svg>
