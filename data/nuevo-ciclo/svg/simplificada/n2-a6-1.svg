<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 762" role="img" aria-label="Republicanismo burgués frente a republicanismo de Marx en tres diferencias y su consecuencia institucional, más la distinción entre instituciones de la libertad e instituciones de la transición, con el contexto de la entrevista (Palestina, población sobrante, Marx revolucionario) y su cierre antioptimista." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="10" y="20">CONTEXTO DE LA ENTREVISTA: PALESTINA, EL ORDEN MUNDIAL Y EL MARX REVOLUCIONARIO</text>
<rect class="sv-box" x="12" y="28" width="236" height="58" rx="2"/>
<text class="sv-t" x="130" y="45.3" text-anchor="middle">Palestina: lo que ha cambiado</text>
<text class="sv-t" x="130" y="60.3" text-anchor="middle">es Occidente</text>
<text class="sv-t2" style="font-size:11.5px" x="130" y="75.3" text-anchor="middle">no el derecho, sino «el hecho de la resistencia»</text>
<rect class="sv-box" x="262" y="28" width="236" height="58" rx="2"/>
<text class="sv-t" x="380" y="45.3" text-anchor="middle">Población «económicamente</text>
<text class="sv-t" x="380" y="60.3" text-anchor="middle">sobrante»</text>
<text class="sv-t2" style="font-size:12px" x="380" y="75.3" text-anchor="middle">8.000 millones; sólo 2.000 rentables</text>
<rect class="sv-box" x="512" y="28" width="236" height="58" rx="2"/>
<text class="sv-t" x="630" y="45.3" text-anchor="middle">Marx revolucionario, no</text>
<text class="sv-t" x="630" y="60.3" text-anchor="middle">filósofo alemán</text>
<text class="sv-t2" style="font-size:12px" x="630" y="75.3" text-anchor="middle">«teoría no significa filosofía»</text>
<text class="sv-t3" x="10" y="106">LA RESPUESTA SOBRE EL REPUBLICANISMO (GUÍA: BRUNO LEIPOLD, CIUDADANO MARX)</text>
<rect class="sv-box-blue" x="12" y="114" width="360" height="44" rx="2"/>
<text class="sv-tb" x="192" y="131.8" text-anchor="middle">Republicanismo burgués</text>
<text class="sv-t2" style="font-size:12px" x="192" y="146.8" text-anchor="middle">uno de muchos republicanismos por los que Marx pasó</text>
<rect class="sv-box-red" x="388" y="114" width="360" height="44" rx="2"/>
<text class="sv-tr" x="568" y="131.8" text-anchor="middle">Republicanismo de Marx</text>
<text class="sv-t2" style="font-size:12px" x="568" y="146.8" text-anchor="middle">«muy diferente en tres sentidos»: socialista y revolucionario</text>
<rect class="sv-soft" x="4" y="168" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="179">ESTADO</text>
<rect class="sv-box" x="12" y="186" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="203.3" text-anchor="middle">Monopolio de la violencia + intercambios</text>
<text class="sv-t" style="font-size:13px" x="192" y="218.3" text-anchor="middle">voluntarios = libertad frente a toda dominación</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="233.3" text-anchor="middle">nadie teme la riqueza ni la coerción</text>
<rect class="sv-box" x="388" y="186" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="203.3" text-anchor="middle">El Estado depende de la riqueza</text>
<text class="sv-t" style="font-size:13px" x="568" y="218.3" text-anchor="middle">concentrada y la protege</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="233.3" text-anchor="middle">la separación «no puede hacerse real jamás»</text>
<line class="sv-line" x1="372" y1="215" x2="388" y2="215" marker-end="url(#nc-n2a6-arrow)"/>
<rect class="sv-soft" x="4" y="256" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="267">MERCADO</text>
<rect class="sv-box" x="12" y="274" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="291.3" text-anchor="middle">Esfera de intercambios voluntarios</text>
<text class="sv-t" style="font-size:13px" x="192" y="306.3" text-anchor="middle">sin dominación</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="321.3" text-anchor="middle">todos se confrontan como iguales</text>
<rect class="sv-box" x="388" y="274" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="291.3" text-anchor="middle">Mercado de trabajo: el miedo al hambre empuja</text>
<text class="sv-t" style="font-size:13px" x="568" y="306.3" text-anchor="middle">a los desposeídos a las garras de los ricos</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="321.3" text-anchor="middle">miedo al hambre, a la exclusión, a la miseria</text>
<line class="sv-line" x1="372" y1="303" x2="388" y2="303" marker-end="url(#nc-n2a6-arrow)"/>
<rect class="sv-soft" x="4" y="344" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="355">ESCALA</text>
<rect class="sv-box" x="12" y="362" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="379.3" text-anchor="middle">Imperio de la ley en un Estado local</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="394.3" text-anchor="middle">desde el marco burgués nada de lo de la</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="409.3" text-anchor="middle">derecha puede conceptualizarse</text>
<rect class="sv-box" x="388" y="362" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="379.3" text-anchor="middle">Economía global vs. Estado local:</text>
<text class="sv-t" style="font-size:13px" x="568" y="394.3" text-anchor="middle">colonias, migraciones, fugas</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="409.3" text-anchor="middle">el poder político persigue siempre al económico</text>
<line class="sv-line" x1="372" y1="391" x2="388" y2="391" marker-end="url(#nc-n2a6-arrow)"/>
<rect class="sv-soft" x="4" y="432" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="443">CONSECUENCIA</text>
<rect class="sv-box" x="12" y="450" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="474.8" text-anchor="middle">Separar y concentrar el poder</text>
<text class="sv-t" style="font-size:13px" x="192" y="489.8" text-anchor="middle">económico y el coercitivo</text>
<rect class="sv-box" x="388" y="450" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="568" y="467.3" text-anchor="middle">Dispersar ambos entre el pueblo: armar al</text>
<text class="sv-t" style="font-size:13px" x="568" y="482.3" text-anchor="middle">proletariado, gestión obrera, desarticular</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="497.3" text-anchor="middle">ejército y burocracia: sigue siendo republicanismo</text>
<line class="sv-line" x1="372" y1="479" x2="388" y2="479" marker-end="url(#nc-n2a6-arrow)"/>
<rect class="sv-soft" x="4" y="520" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="531">DOS CUESTIONES QUE NO COINCIDEN</text>
<rect class="sv-box" x="12" y="538" width="360" height="58" rx="2"/>
<text class="sv-t" x="192" y="555.3" text-anchor="middle">Asociación de productores libres</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="570.3" text-anchor="middle">instituciones de la libertad universal:</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="585.3" text-anchor="middle">cómo sería una sociedad libre</text>
<rect class="sv-box-gold" x="388" y="538" width="360" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="568" y="555.3" text-anchor="middle">Dictadura del proletariado / «de la democracia»</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="570.3" text-anchor="middle">dominar la dominación: pueden</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="585.3" text-anchor="middle">degenerar en nueva dominación</text>
<line class="sv-line-dash" x1="372" y1="567" x2="388" y2="567" marker-end="url(#nc-n2a6-arrow)" marker-start="url(#nc-n2a6-arrow)"/>
<rect class="sv-box" x="12" y="610" width="736" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="380" y="627.3" text-anchor="middle">Ni política prefigurativa ni «Estado popular que nunca se equivoca»: la teoría de la</text>
<text class="sv-t" style="font-size:13px" x="380" y="642.3" text-anchor="middle">transición debe repensarse como teoría de la emancipación</text>
<text class="sv-t2" style="font-size:12px" x="380" y="657.3" text-anchor="middle">contrapoderes bajo la dominación que no se conviertan en nuevos poderes de dominación</text>
<rect class="sv-box-ink" x="12" y="678" width="736" height="44" rx="2"/>
<text class="sv-tw" x="380" y="695.8" text-anchor="middle">«Me niego a ser optimista»</text>
<text class="sv-tw" x="380" y="710.8" text-anchor="middle" style="font-weight:400;font-size:12px">los jóvenes, abiertos al socialismo «¡pero también al fascismo!»; un socialismo regenerado necesita un portador</text>
<text class="sv-t3" x="10" y="740">Leyenda: flecha continua = crítica de Marx a la tesis burguesa de la misma fila</text>
<text class="sv-t3" x="10" y="756">flecha discontinua doble = dos cuestiones distintas que no deben confundirse</text>
</svg>
