<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" role="img" aria-label="Matriz de la clase obrera europea: tendencias a la unificación y fracturas en los planos objetivo y subjetivo, precedida por la tesis de partida, y debajo las tres respuestas erradas ante el rearme y la tarea que el artículo les opone." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-ink" x="12" y="10" width="736" height="44" rx="2"/>
<text class="sv-tw" x="380" y="27.8" text-anchor="middle">Punto de partida: 220 millones de activos (sobre 450) que «languidecen como sujeto de la historia»</text>
<text class="sv-tw" x="380" y="42.8" text-anchor="middle" style="font-weight:400;font-size:12px">lo decisivo no es el tamaño sino la posición en el orden imperialista; frenar el «holocausto» exige activarla</text>
<text class="sv-t3" x="192" y="72" text-anchor="middle">PLANO OBJETIVO</text>
<text class="sv-t3" x="568" y="72" text-anchor="middle">PLANO SUBJETIVO / POLÍTICO</text>
<rect class="sv-soft" x="4" y="80" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="91">TENDENCIAS A LA UNIFICACIÓN</text>
<rect class="sv-box-blue" x="12" y="100" width="360" height="58" rx="2"/>
<text class="sv-tb" x="192" y="117.3" text-anchor="middle">Bases de unión</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="132.3" text-anchor="middle">marcos institucionales comunes (BCE), convergencia</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="147.3" text-anchor="middle">económica, composición de clase homogénea</text>
<rect class="sv-box" x="388" y="100" width="360" height="58" rx="2"/>
<text class="sv-t" x="568" y="117.3" text-anchor="middle">Capacidad de lucha débil</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="132.3" text-anchor="middle">huelga = derecho canalizado por el Estado;</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="147.3" text-anchor="middle">ninguna fuerza política obrera</text>
<rect class="sv-soft" x="4" y="174" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="185">FORMATOS DE LA HUELGA GENERAL HOY (AMBAS CAJAS: PLANO SUBJETIVO)</text>
<rect class="sv-box" x="12" y="194" width="360" height="58" rx="2"/>
<text class="sv-t" x="192" y="211.3" text-anchor="middle">Modelo «vertical» agotado</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="226.3" text-anchor="middle">los grandes sindicatos pactan y la clase secunda;</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="241.3" text-anchor="middle">sin huelga general de 24 h desde 2012</text>
<rect class="sv-box" x="388" y="194" width="360" height="58" rx="2"/>
<text class="sv-t" x="568" y="211.3" text-anchor="middle">Formatos simbólico y minoritario</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="226.3" text-anchor="middle">cobertura de movilizaciones amplias (8M, Palestina);</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="241.3" text-anchor="middle">propaganda o coartada legal</text>
<rect class="sv-soft" x="4" y="268" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="279">FRACTURAS</text>
<rect class="sv-box-red" x="12" y="288" width="360" height="58" rx="2"/>
<text class="sv-tr" x="192" y="305.3" text-anchor="middle">Cicatrices</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="320.3" text-anchor="middle">este-oeste (Bolkestein), norte-sur (austeridad):</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="335.3" text-anchor="middle">concertación entre capitales sin fusión</text>
<rect class="sv-box-red" x="388" y="288" width="360" height="58" rx="2"/>
<text class="sv-tr" x="568" y="305.3" text-anchor="middle">Mediación nacional</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="320.3" text-anchor="middle">sindicatos-lobby, 27 marcos estatales;</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="335.3" text-anchor="middle">sin fuerza impugnadora la huelga es lobby</text>
<rect class="sv-soft" x="4" y="362" width="752" height="84" rx="2"/>
<text class="sv-t3" x="10" y="373">RESPUESTAS ANTE EL REARME</text>
<rect class="sv-box-gold" x="12" y="382" width="235" height="58" rx="2"/>
<text class="sv-tg" x="129.5" y="399.3" text-anchor="middle">Cierre nacionalista (derecha)</text>
<text class="sv-t2" style="font-size:12.5px" x="129.5" y="414.3" text-anchor="middle">subordinación a EE. UU.;</text>
<text class="sv-t2" style="font-size:12.5px" x="129.5" y="429.3" text-anchor="middle">hostilidad al migrante</text>
<rect class="sv-box-gold" x="263" y="382" width="235" height="58" rx="2"/>
<text class="sv-tg" x="380.5" y="399.3" text-anchor="middle">Europeísmo abstracto</text>
<text class="sv-t2" style="font-size:12.5px" x="380.5" y="414.3" text-anchor="middle">la UE como espacio democrático;</text>
<text class="sv-t2" style="font-size:12.5px" x="380.5" y="429.3" text-anchor="middle">avala el rearme</text>
<rect class="sv-box-gold" x="513" y="382" width="235" height="58" rx="2"/>
<text class="sv-tg" x="630.5" y="399.3" text-anchor="middle">Soberanismo tercermundista</text>
<text class="sv-t2" style="font-size:12.5px" x="630.5" y="414.3" text-anchor="middle">soberanía nacional frente a la UE;</text>
<text class="sv-t2" style="font-size:12.5px" x="630.5" y="429.3" text-anchor="middle">Europa = «aristocracia obrera»</text>
<rect class="sv-box-red" x="12" y="464" width="736" height="44" rx="2"/>
<text class="sv-tr" x="380" y="481.8" text-anchor="middle">Movimiento obrero europeo contra el militarismo: elementos políticos avanzados en las luchas</text>
<text class="sv-t2" style="font-size:12px" x="380" y="496.8" text-anchor="middle">romper con las fantasías de secesión nacional y con el militarismo del europeísmo oficial</text>
<path class="sv-line-dash" d="M129.5 440 V452 H380 V464" marker-end="url(#nc-n2a3-arrow)"/>
<path class="sv-line-dash" d="M380.5 440 V452 H380 V464" marker-end="url(#nc-n2a3-arrow)"/>
<path class="sv-line-dash" d="M630.5 440 V452 H380 V464" marker-end="url(#nc-n2a3-arrow)"/>
<line class="sv-line-dash" x1="12" y1="526" x2="38" y2="526" marker-end="url(#nc-n2a3-arrow)"/>
<text class="sv-t3" x="44" y="530">respuesta errada a la que se opone la tarea propuesta</text>
</svg>
