<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="Línea temporal de la expansión del tipo penal de terrorismo en el Estado español, de 1894 a 2015, con las tres líneas maestras que se van acumulando (cualquier delito, fines de subversión, peligrosidad ideológica), y los casos recientes, de Pandora, Piñata e Ice a Futuro Vegetal y Palestine Action, que ilustran el paso de la banda armada a la disidencia política y la conclusión: defender los derechos políticos." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="12" width="752" height="154" rx="2"/>
<text class="sv-t3" x="10" y="23">DOS ESCENAS, UN MISMO DISPOSITIVO</text>
<rect class="sv-box" x="12" y="30" width="230" height="74" rx="2"/>
<text class="sv-t" x="127" y="47.8" text-anchor="middle">2014 · Operaciones</text>
<text class="sv-t" x="127" y="62.8" text-anchor="middle">antianarquistas</text>
<text class="sv-t2" style="font-size:12px" x="127" y="77.8" text-anchor="middle">más de un centenar de personas</text>
<text class="sv-t2" style="font-size:12px" x="127" y="92.8" text-anchor="middle">encausadas (2014-18)</text>
<rect class="sv-box-ink" x="254" y="30" width="252" height="74" rx="2"/>
<text class="sv-tw" x="380" y="47.8" text-anchor="middle">Tesis</text>
<text class="sv-tw" x="380" y="62.8" text-anchor="middle" style="font-weight:400;font-size:12px">la ley antiterrorista: elemento penal</text>
<text class="sv-tw" x="380" y="77.8" text-anchor="middle" style="font-weight:400;font-size:12px">del giro autoritario y medio de</text>
<text class="sv-tw" x="380" y="92.8" text-anchor="middle" style="font-weight:400;font-size:12px">criminalización de la disidencia</text>
<rect class="sv-box" x="518" y="30" width="230" height="74" rx="2"/>
<text class="sv-t" x="633" y="55.3" text-anchor="middle">2025 · Palestine Action</text>
<text class="sv-t2" style="font-size:12px" x="633" y="70.3" text-anchor="middle">ilegalizada con la ley antiterrorista;</text>
<text class="sv-t2" style="font-size:12px" x="633" y="85.3" text-anchor="middle">el apoyo verbal pasa a ser delito</text>
<rect class="sv-box-blue" x="12" y="116" width="736" height="44" rx="2"/>
<text class="sv-tb" x="380" y="133.8" text-anchor="middle">Tres líneas maestras de la legislación antiterrorista actual (capas acumuladas)</text>
<text class="sv-t2" style="font-size:12px" x="380" y="148.8" text-anchor="middle">1) cualquier delito · 2) con fines de subversión del orden público · 3) o sin delito: peligrosidad ideológica</text>
<rect class="sv-soft" x="4" y="174" width="752" height="166" rx="2"/>
<text class="sv-t3" x="10" y="185">CAPAS ACUMULADAS DEL TIPO PENAL</text>
<rect class="sv-box" x="12" y="194" width="172" height="58" rx="2"/>
<text class="sv-t" x="98" y="211.3" text-anchor="middle">1894 · Ley de</text>
<text class="sv-t" x="98" y="226.3" text-anchor="middle">explosivos</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="241.3" text-anchor="middle">castiga el acto (Liceu)</text>
<rect class="sv-box" x="200" y="194" width="172" height="58" rx="2"/>
<text class="sv-t" x="286" y="211.3" text-anchor="middle">1896 · Vínculo con</text>
<text class="sv-t" x="286" y="226.3" text-anchor="middle">una ideología</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="241.3" text-anchor="middle">el anarquismo tras el Corpus</text>
<rect class="sv-box" x="388" y="194" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="211.3" text-anchor="middle">1934 · Elemento</text>
<text class="sv-t" x="474" y="226.3" text-anchor="middle">subjetivo</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="241.3" text-anchor="middle">«subvertir el orden público»</text>
<rect class="sv-box-gold" x="576" y="194" width="172" height="58" rx="2"/>
<text class="sv-tg" x="662" y="211.3" text-anchor="middle">Franquismo ·</text>
<text class="sv-tg" x="662" y="226.3" text-anchor="middle">Peligrosidad</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="241.3" text-anchor="middle">punibilidad adelantada</text>
<rect class="sv-box" x="12" y="276" width="172" height="58" rx="2"/>
<text class="sv-t" x="98" y="293.3" text-anchor="middle">1978 · Elemento</text>
<text class="sv-t" x="98" y="308.3" text-anchor="middle">estructural</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="323.3" text-anchor="middle">lista cerrada: grupo armado</text>
<rect class="sv-box" x="200" y="276" width="172" height="58" rx="2"/>
<text class="sv-t" x="286" y="293.3" text-anchor="middle">1995 · «Acto</text>
<text class="sv-t" x="286" y="308.3" text-anchor="middle">terrorista»</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="323.3" text-anchor="middle">organización y grupo; art. 578</text>
<rect class="sv-box-red" x="388" y="276" width="172" height="58" rx="2"/>
<text class="sv-tr" x="474" y="293.3" text-anchor="middle">LO 2/2015 · Cualquier</text>
<text class="sv-tr" x="474" y="308.3" text-anchor="middle">delito</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="323.3" text-anchor="middle">terror como fin (art. 575.2)</text>
<rect class="sv-box-ink" x="576" y="276" width="172" height="58" rx="2"/>
<text class="sv-tw" x="662" y="293.3" text-anchor="middle">De banda armada a</text>
<text class="sv-tw" x="662" y="308.3" text-anchor="middle">disidencia política</text>
<text class="sv-tw" x="662" y="323.3" text-anchor="middle" style="font-weight:400;font-size:11.5px">ya no se exige violencia armada</text>
<line class="sv-line" x1="184" y1="214" x2="200" y2="214" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="214" x2="388" y2="214" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="560" y1="214" x2="576" y2="214" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="184" y1="296" x2="200" y2="296" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="296" x2="388" y2="296" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="560" y1="296" x2="576" y2="296" marker-end="url(#nc-n1a5-arrow)"/>
<path class="sv-line" d="M662 252 V262 H98 V276" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line-red" x1="662" y1="334" x2="662" y2="368" marker-end="url(#nc-n1a5-arrow)"/>
<rect class="sv-soft" x="4" y="348" width="752" height="170" rx="2"/>
<text class="sv-t3" x="10" y="359">CASOS: LA LAXITUD PUESTA A PRUEBA</text>
<rect class="sv-box-gold" x="12" y="368" width="172" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="98" y="385.3" text-anchor="middle">Pandora I y II (2014-15)</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="400.3" text-anchor="middle">11 imputados por los GAC;</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="415.3" text-anchor="middle">archivada</text>
<rect class="sv-box-gold" x="200" y="368" width="172" height="58" rx="2"/>
<text class="sv-tg" x="286" y="385.3" text-anchor="middle">Piñata (2015-18)</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="400.3" text-anchor="middle">33 detenciones;</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="415.3" text-anchor="middle">archivada en 2018</text>
<rect class="sv-box-gold" x="388" y="368" width="172" height="58" rx="2"/>
<text class="sv-tg" x="474" y="385.3" text-anchor="middle">Ice (2015-18)</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="400.3" text-anchor="middle">única con juicio: absolución</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="415.3" text-anchor="middle">que consagra la vaguedad</text>
<rect class="sv-box-gold" x="12" y="454" width="172" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="98" y="471.3" text-anchor="middle">Futuro Vegetal (2023-24)</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="486.3" text-anchor="middle">«estructura criminal»</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="501.3" text-anchor="middle">sin violencia</text>
<rect class="sv-box-gold" x="200" y="454" width="172" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="286" y="471.3" text-anchor="middle">Palestine Action (2025)</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="486.3" text-anchor="middle">ilegalizada; casi 500</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="501.3" text-anchor="middle">detenciones</text>
<rect class="sv-box" x="388" y="454" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="471.3" text-anchor="middle">Misma lógica, dentro</text>
<text class="sv-t" x="474" y="486.3" text-anchor="middle">y fuera</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="501.3" text-anchor="middle">Soulèvements, Hasél, CDR</text>
<rect class="sv-box-red" x="576" y="368" width="172" height="144" rx="2"/>
<text class="sv-tr" x="662" y="420.8" text-anchor="middle">Defender los derechos</text>
<text class="sv-tr" x="662" y="435.8" text-anchor="middle">políticos</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="450.8" text-anchor="middle">deber de quien quiera</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="465.8" text-anchor="middle">demoler la fortaleza</text>
<line class="sv-line" x1="184" y1="388" x2="200" y2="388" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="388" x2="388" y2="388" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="184" y1="474" x2="200" y2="474" marker-end="url(#nc-n1a5-arrow)"/>
<line class="sv-line" x1="372" y1="474" x2="388" y2="474" marker-end="url(#nc-n1a5-arrow)"/>
<path class="sv-line" d="M474 426 V436 H98 V454" marker-end="url(#nc-n1a5-arrow)"/>
<text class="sv-t3" x="106" y="450">Pandora · Piñata · Ice: archivos y absolución que consagra la vaguedad</text>
<text class="sv-t3" x="12" y="534">LEYENDA · flechas: sucesión cronológica (capas que se acumulan; casos) · roja: conclusión que se extrae</text>
</svg>
