<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 538" role="img" aria-label="Cadena causal del «fin de juego» de Merchant: de la contradicción entre fuerzas productivas y valorización a las tres formas del capitalismo en declive, por qué la burguesía no lo salvará y las dos respuestas enfrentadas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="10" y="20">RAÍZ: EL «FIN DE JUEGO» (ENDGAME / COLAPSO)</text>
<rect class="sv-box-ink" x="12" y="28" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="46" text-anchor="middle">Contradicción: desarrollar las fuerzas productivas más allá de los límites de la valorización</text>
<text class="sv-tw" style="font-size:11.5px" x="380" y="63" text-anchor="middle">raíz del nacionalismo económico, el militarismo y el giro autoritario: la decadencia del modo de producción</text>
<rect class="sv-box" x="12" y="96" width="736" height="76" rx="2"/>
<text class="sv-t" x="380" y="114" text-anchor="middle">Caída de la rentabilidad, la productividad y la inversión (composición orgánica alta) →</text>
<text class="sv-t" x="380" y="131" text-anchor="middle">crecimiento de suma cero</text>
<text class="sv-t2" style="font-size:12px" x="380" y="148" text-anchor="middle">«la economía privada capitalista está muriendo»; la polarización es consecuencia, no causa</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="162" text-anchor="middle">los Estados «sobornan» a los capitalistas con billones de dinero público; «la única pregunta es qué forma tomará la catástrofe»</text>
<line class="sv-line" x1="380" y1="76" x2="380" y2="96" marker-end="url(#nc-n3a6-arrow)"/>
<text class="sv-t3" x="10" y="188">TRES FORMAS DEL CAPITALISMO EN DECLIVE</text>
<rect class="sv-box" x="12" y="214" width="236" height="78" rx="2"/>
<text class="sv-t" x="130" y="234" text-anchor="middle">Capitalismo de Estado de</text>
<text class="sv-t" x="130" y="251" text-anchor="middle">nuevo tipo</text>
<text class="sv-t2" style="font-size:12px" x="130" y="267" text-anchor="middle">subsidios, deuda pública, política</text>
<text class="sv-t2" style="font-size:12px" x="130" y="281" text-anchor="middle">industrial (Biden)</text>
<rect class="sv-box" x="262" y="214" width="236" height="78" rx="2"/>
<text class="sv-t" x="380" y="238" text-anchor="middle">Neoimperialismo «mafioso»</text>
<text class="sv-t2" style="font-size:12px" x="380" y="256" text-anchor="middle">aranceles, Venezuela, Groenlandia;</text>
<text class="sv-t2" style="font-size:12px" x="380" y="270" text-anchor="middle">«ofertas que no puedes rechazar»;</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="284" text-anchor="middle">apertura forzosa de mercados</text>
<rect class="sv-box-red" x="512" y="214" width="236" height="78" rx="2"/>
<text class="sv-tr" x="630" y="238" text-anchor="middle">Estado de mano dura</text>
<text class="sv-t2" style="font-size:12px" x="630" y="256" text-anchor="middle">DHS, ICE: fascismo que emerge desde</text>
<text class="sv-t2" style="font-size:12px" x="630" y="270" text-anchor="middle">el Estado en una era de colapso</text>
<text class="sv-t2" style="font-size:11.5px" x="630" y="284" text-anchor="middle">ICE, decimotercer mayor ejército del país</text>
<path class="sv-line" d="M380 172 V200 H130 V214" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M380 172 V200 H380 V214" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M380 172 V200 H630 V214" marker-end="url(#nc-n3a6-arrow)"/>
<rect class="sv-box" x="12" y="322" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="340" text-anchor="middle">La burguesía no salvará el capitalismo</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="357" text-anchor="middle">la caída de la tasa de ganancia es transnacional: ninguna clase dominante nacional puede resolverla; el liderazgo burgués está agotado</text>
<path class="sv-line" d="M130 292 V306 H380 V322" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M380 292 V306 H380 V322" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line" d="M630 292 V306 H380 V322" marker-end="url(#nc-n3a6-arrow)"/>
<text class="sv-t3" x="10" y="388">DOS RESPUESTAS ENFRENTADAS</text>
<rect class="sv-box-gold" x="12" y="412" width="360" height="78" rx="2"/>
<text class="sv-tg" x="192" y="432" text-anchor="middle">Reformismo</text>
<text class="sv-t2" style="font-size:12px" x="192" y="449" text-anchor="middle">nacionalismo económico de izquierdas, «fantasías de</text>
<text class="sv-t2" style="font-size:12px" x="192" y="463" text-anchor="middle">secesión», socialismo de mercado, triangulación:</text>
<text class="sv-t2" style="font-size:12px" x="192" y="477" text-anchor="middle">«condenado a empoderar a la derecha»</text>
<rect class="sv-box-red" x="388" y="412" width="360" height="78" rx="2"/>
<text class="sv-tr" x="568" y="432" text-anchor="middle">Estrategia continental</text>
<text class="sv-t2" style="font-size:12px" x="568" y="449" text-anchor="middle">Partido Comunista Europeo, nuevas instituciones de</text>
<text class="sv-t2" style="font-size:12px" x="568" y="463" text-anchor="middle">lucha de clases, nueva Internacional</text>
<text class="sv-t2" style="font-size:11.5px" x="568" y="477" text-anchor="middle">ganar una mayoría política no es ganar una mayoría parlamentaria</text>
<path class="sv-line-dash" d="M380 370 V398 H192 V412" marker-end="url(#nc-n3a6-arrow)"/>
<path class="sv-line-red" d="M380 370 V398 H568 V412" marker-end="url(#nc-n3a6-arrow)"/>
<text class="sv-t3" x="10" y="510">Leyenda: continua = cadena causal · discontinua = respuesta que el entrevistado rechaza</text>
<text class="sv-t3" x="10" y="526">roja = respuesta compartida por entrevistador y entrevistado</text>
</svg>
