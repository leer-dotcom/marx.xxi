<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual de Nuevo Ciclo #003: el declive de la rentabilidad como raíz (arriba), sus tres expresiones políticas —Estado dual trumpista, austeridad reaccionaria, OTAN y Gladio como dictadura de clase—, lo que cada una exige —unidad de economía y política, programa mínimo-máximo, desmantelar OTAN y UE— y, abajo, la comprensión unitaria de la clase, la fuerza independiente de escala continental que el número propone y el reformismo gobernante que alimenta la reacción. Al pie, la leyenda y la clave de artículos." viewBox="0 0 760 542" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-m3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20" text-anchor="start">NUEVO CICLO #003 · MAPA CONCEPTUAL</text>
<text class="sv-t3" x="748" y="20" text-anchor="end">(n) = artículo n del número</text>
<rect class="sv-box-ink" x="170.0" y="30" width="420" height="44.0" rx="2"/>
<text class="sv-tw" x="380.0" y="49.5" text-anchor="middle">Declive: caída de la rentabilidad</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.0" y="63.0" text-anchor="middle">«fin de juego»: crecimiento convertido en suma cero (1, 5, 6)</text>
<path class="sv-line" d="M380.0 74.0 V92.0 H129.5 V116.0" marker-end="url(#nc-m3-arrow)"/>
<line class="sv-line" x1="380.0" y1="74.0" x2="380.5" y2="116.0" marker-end="url(#nc-m3-arrow)"/>
<path class="sv-line" d="M380.0 74.0 V92.0 H630.5 V116.0" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="387.0" y="105.0" text-anchor="start">sus tres expresiones políticas</text>
<rect class="sv-box" x="12" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="129.5" y="135.5" text-anchor="middle">Estado dual trumpista</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="149.0" text-anchor="middle">prerrogativo sin partido-milicia (1, 5, 6)</text>
<rect class="sv-box" x="263" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="380.5" y="135.5" text-anchor="middle">Austeridad → reacción</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="149.0" text-anchor="middle">Weimar, Italia, franquismo, hoy (1, 2, 5, 6)</text>
<rect class="sv-box" x="513" y="116.0" width="235" height="59.0" rx="2"/>
<text class="sv-t" x="630.5" y="135.5" text-anchor="middle">OTAN y Gladio: dictadura de</text>
<text class="sv-t" x="630.5" y="150.5" text-anchor="middle">clase</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="164.0" text-anchor="middle">democracia liberal como fachada (1, 2, 3, 5)</text>
<line class="sv-line" x1="129.5" y1="175.0" x2="129.5" y2="227.0" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="135.5" y="192.0" text-anchor="start">dualidad prefigurada en el</text>
<text class="sv-t3" x="135.5" y="205.0" text-anchor="start">Estado liberal (1)</text>
<line class="sv-line" x1="380.5" y1="175.0" x2="380.5" y2="227.0" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="386.5" y="205.0" text-anchor="start">la austeridad no es «error técnico» (5)</text>
<line class="sv-line" x1="630.5" y1="175.0" x2="630.5" y2="227.0" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="624.5" y="192.0" text-anchor="end">ni reformar ni salir en solitario (2, 3)</text>
<rect class="sv-box" x="12" y="227.0" width="235" height="58.5" rx="2"/>
<text class="sv-t" x="129.5" y="246.5" text-anchor="middle">Separación economía / política</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="260.0" text-anchor="middle">núcleo que el fascismo radicaliza (1, 4, 5)</text>
<rect class="sv-box" x="263" y="227.0" width="235" height="58.5" rx="2"/>
<text class="sv-t" x="380.5" y="246.5" text-anchor="middle">Programa mínimo-máximo</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="260.0" text-anchor="middle">disputar el poder, no administrarlo (1, 5, 6)</text>
<rect class="sv-box" x="513" y="227.0" width="235" height="58.5" rx="2"/>
<text class="sv-t" x="630.5" y="246.5" text-anchor="middle">Desmantelar OTAN y UE</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="260.0" text-anchor="middle">milicia popular; EE. UU. Socialistas de</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="274.5" text-anchor="middle">Europa (2, 3, 6)</text>
<line class="sv-line" x1="129.5" y1="285.5" x2="129.5" y2="337.5" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="135.5" y="302.5" text-anchor="start">dualismo heredado del</text>
<text class="sv-t3" x="135.5" y="315.5" text-anchor="start">economicismo (4)</text>
<line class="sv-line-red" x1="380.5" y1="285.5" x2="380.5" y2="337.5" marker-end="url(#nc-m3-arrow)"/>
<line class="sv-line" x1="630.5" y1="285.5" x2="630.5" y2="337.5" marker-end="url(#nc-m3-arrow)"/>
<text class="sv-t3" x="624.5" y="302.5" text-anchor="end">¿dónde quedó «OTAN no, bases fuera»? (3)</text>
<rect class="sv-box" x="12" y="337.5" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="129.5" y="357.0" text-anchor="middle">Género: comprensión unitaria de</text>
<text class="sv-t" x="129.5" y="372.0" text-anchor="middle">la clase</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="385.5" text-anchor="middle">contra el economicismo (1, 4, 5, 6)</text>
<rect class="sv-box-red" x="263" y="337.5" width="235" height="73.5" rx="2"/>
<text class="sv-tr" x="380.5" y="357.0" text-anchor="middle">Fuerza independiente a escala</text>
<text class="sv-tr" x="380.5" y="372.0" text-anchor="middle">continental</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="385.5" text-anchor="middle">Partido Comunista Europeo, nueva</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="400.0" text-anchor="middle">Internacional (2, 3, 6)</text>
<rect class="sv-box" x="513" y="337.5" width="235" height="73.5" rx="2"/>
<text class="sv-t" x="630.5" y="357.0" text-anchor="middle">El reformismo gobernante</text>
<text class="sv-t" x="630.5" y="372.0" text-anchor="middle">alimenta la reacción</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="385.5" text-anchor="middle">IU 1986→2026; Sumar; Podemos (2, 3, 5)</text>
<line class="sv-line-red" x1="247" y1="374.25" x2="263" y2="374.25" marker-end="url(#nc-m3-arrow)"/>
<line class="sv-line-red" x1="513" y1="374.25" x2="498" y2="374.25" marker-end="url(#nc-m3-arrow)"/>
<rect class="sv-soft" x="12" y="433.0" width="736" height="97" rx="2"/>
<text class="sv-t3" x="24" y="449.0" text-anchor="start">LEYENDA · flecha gris: del declive a sus expresiones, a lo que exigen y a su consecuencia · flecha roja: la fuerza propuesta</text>
<text class="sv-t3" x="24" y="464.0" text-anchor="start">ARTÍCULOS DEL NÚMERO</text>
<text class="sv-t2" style="font-size:12px" x="24" y="479.0" text-anchor="start">1 · Lorién Gómez e Ismael Seijo, «El Estado dual trumpista»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="494.0" text-anchor="start">2 · Raq, «La guardia pretoriana del imperialismo»</text>
<text class="sv-t2" style="font-size:12px" x="24" y="509.0" text-anchor="start">3 · Garde, «España y la OTAN»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="479.0" text-anchor="start">4 · Irene Royo, «Género y clase en tiempos de reacción»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="494.0" text-anchor="start">5 · Mateo Baroud, «Economía política del fascismo…»</text>
<text class="sv-t2" style="font-size:12px" x="392" y="509.0" text-anchor="start">6 · Entrevista con Jamie Merchant, «La economía privada capitalista…»</text>
</svg>
