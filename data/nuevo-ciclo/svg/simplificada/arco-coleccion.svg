<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los cuatro números de Nuevo Ciclo como pasos de un mismo argumento: cada uno aborda el mismo problema desde un ángulo distinto y todos desembocan en el partido comunista de masas e internacional." viewBox="0 0 760 275" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-hero-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="380" y="22" text-anchor="middle">EL ARCO DE LOS CUATRO NÚMEROS: UN MISMO PROBLEMA, CUATRO ÁNGULOS, UNA TAREA</text>
<text class="sv-t2" style="font-size:12px" x="380" y="41" text-anchor="middle">Problema común: cómo se reorganizan las fuerzas del proletariado en una era de declive, guerra, genocidio y autoritarismo</text>
<text class="sv-t3" x="380" y="58" text-anchor="middle">CADA NÚMERO VUELVE SOBRE EL MISMO PROBLEMA DESDE UN ÁNGULO DISTINTO  →</text>
<rect class="sv-box" x="18" y="68" width="172" height="103" rx="2"/>
<text class="sv-t" style="font-size:13.4px;letter-spacing:0" x="104.0" y="87" text-anchor="middle">#001 · Septiembre 2025</text>
<text class="sv-t2" style="font-size:12px" x="104.0" y="101.5" text-anchor="middle">fija el diagnóstico de época</text>
<text class="sv-t3" style="font-size:10px" x="104.0" y="115.0" text-anchor="middle">TEMAS</text>
<text class="sv-t2" style="font-size:12px" x="104.0" y="128.0" text-anchor="middle">declive, guerra, represión,</text>
<text class="sv-t2" style="font-size:12px" x="104.0" y="142.5" text-anchor="middle">Gaza, España</text>
<line class="sv-line" x1="190" y1="119.5" x2="202" y2="119.5" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="202" y="68" width="172" height="103" rx="2"/>
<text class="sv-t" style="font-size:13.4px;letter-spacing:0" x="288.0" y="87" text-anchor="middle">#002 · Diciembre 2025</text>
<text class="sv-t2" style="font-size:12px" x="288.0" y="101.5" text-anchor="middle">dominación de clase y</text>
<text class="sv-t2" style="font-size:12px" x="288.0" y="116.0" text-anchor="middle">ausencia del sujeto</text>
<text class="sv-t3" style="font-size:10px" x="288.0" y="129.5" text-anchor="middle">TEMAS</text>
<text class="sv-t2" style="font-size:12px" x="288.0" y="142.5" text-anchor="middle">franquismo, neofeudalismo,</text>
<text class="sv-t2" style="font-size:12px" x="288.0" y="157.0" text-anchor="middle">Europa, siniestralidad, prensa</text>
<line class="sv-line" x1="374" y1="119.5" x2="386" y2="119.5" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="386" y="68" width="172" height="103" rx="2"/>
<text class="sv-t" style="font-size:13.4px;letter-spacing:0" x="472.0" y="87" text-anchor="middle">#003 · Marzo 2026</text>
<text class="sv-t2" style="font-size:12px" x="472.0" y="101.5" text-anchor="middle">la reacción, producto</text>
<text class="sv-t2" style="font-size:12px" x="472.0" y="116.0" text-anchor="middle">del declive</text>
<text class="sv-t3" style="font-size:10px" x="472.0" y="129.5" text-anchor="middle">TEMAS</text>
<text class="sv-t2" style="font-size:12px" x="472.0" y="142.5" text-anchor="middle">Estado dual, OTAN, género,</text>
<text class="sv-t2" style="font-size:12px" x="472.0" y="157.0" text-anchor="middle">austeridad y fascismo</text>
<line class="sv-line" x1="558" y1="119.5" x2="570" y2="119.5" marker-end="url(#nc-hero-arrow)"/>
<rect class="sv-box" x="570" y="68" width="172" height="103" rx="2"/>
<text class="sv-t" style="font-size:13.4px;letter-spacing:0" x="656.0" y="87" text-anchor="middle">#004 · Junio 2026</text>
<text class="sv-t2" style="font-size:12px" x="656.0" y="101.5" text-anchor="middle">la coacción, la ley</text>
<text class="sv-t2" style="font-size:12px" x="656.0" y="116.0" text-anchor="middle">y la resistencia</text>
<text class="sv-t3" style="font-size:10px" x="656.0" y="129.5" text-anchor="middle">TEMAS</text>
<text class="sv-t2" style="font-size:12px" x="656.0" y="142.5" text-anchor="middle">genocidio, delincuencia,</text>
<text class="sv-t2" style="font-size:12px" x="656.0" y="157.0" text-anchor="middle">ilegalidad, el juez, inmigración</text>
<line class="sv-line-red" x1="104.0" y1="171" x2="104.0" y2="213" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="288.0" y1="171" x2="288.0" y2="213" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="472.0" y1="171" x2="472.0" y2="213" marker-end="url(#nc-hero-arrow)"/>
<line class="sv-line-red" x1="656.0" y1="171" x2="656.0" y2="213" marker-end="url(#nc-hero-arrow)"/>
<text class="sv-t3" x="196.0" y="188" text-anchor="middle">TODOS DESEMBOCAN</text>
<text class="sv-t3" x="196.0" y="201" text-anchor="middle">EN LA MISMA TAREA</text>
<rect class="sv-box-red" x="18" y="213" width="724" height="48" rx="2"/>
<text class="sv-tr" x="380" y="232.5" text-anchor="middle">Partido comunista de masas, continental e internacional</text>
<text class="sv-t2" style="font-size:12px" x="380" y="247" text-anchor="middle">independencia política de la clase: «el gran ausente hoy, a la vez que la única alternativa real»; unidad con el proletariado migrante</text>
</svg>
