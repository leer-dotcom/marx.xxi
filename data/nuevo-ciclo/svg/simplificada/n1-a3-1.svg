<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-label="Tablero de la situación política española: punto de partida (qué hacer y por dónde empezar), paso del ciclo progresista al reaccionario e impasse, bloque de gobierno y bloque de derechas con los aparatos del Estado presionando y la clase media inestable en disputa, enemigos múltiples y tareas comunistas a tres plazos que culminan en el partido comunista de masas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="12" width="752" height="68" rx="2"/>
<text class="sv-t3" x="10" y="23">PUNTO DE PARTIDA</text>
<rect class="sv-box" x="12" y="30" width="736" height="44" rx="2"/>
<text class="sv-t" x="380" y="47.8" text-anchor="middle">Qué hacer y por dónde empezar: concretar el proyecto comunista en la coyuntura</text>
<text class="sv-t2" style="font-size:12px" x="380" y="62.8" text-anchor="middle">recomponer un proyecto político independiente (comunista) → ruptura de clase y de masas: análisis situado</text>
<text class="sv-t3" x="10" y="100">CICLOS POLÍTICOS BURGUESES</text>
<rect class="sv-box-blue" x="12" y="108" width="250" height="58" rx="2"/>
<text class="sv-tb" x="137" y="125.3" text-anchor="middle">Ciclo progresista 2008-2020</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="140.3" text-anchor="middle">15-M, Podemos, procés, coalición:</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="155.3" text-anchor="middle">agónico, no muere</text>
<rect class="sv-box-red" x="498" y="108" width="250" height="58" rx="2"/>
<text class="sv-tr" x="623" y="125.3" text-anchor="middle">Ciclo reaccionario 2016-</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="140.3" text-anchor="middle">Brexit, Trump, Vox, Milei:</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="155.3" text-anchor="middle">domina, pero no condensa</text>
<line class="sv-line" x1="262" y1="120" x2="498" y2="120" marker-end="url(#nc-n1a3-arrow)"/>
<text class="sv-t3" x="380" y="113" text-anchor="middle">desplazado por</text>
<rect class="sv-box-ink" x="290" y="134" width="180" height="58" rx="2"/>
<text class="sv-tw" x="380" y="151.3" text-anchor="middle">Largo impasse español</text>
<text class="sv-tw" x="380" y="166.3" text-anchor="middle" style="font-weight:400;font-size:11.5px">el progresista agoniza sin morir;</text>
<text class="sv-tw" x="380" y="181.3" text-anchor="middle" style="font-weight:400;font-size:11.5px">el reaccionario no condensa</text>
<rect class="sv-soft" x="4" y="202" width="262" height="314" rx="2"/>
<rect class="sv-soft" x="494" y="202" width="262" height="314" rx="2"/>
<text class="sv-t3" x="10" y="213">BLOQUE DE GOBIERNO</text>
<text class="sv-t3" x="500" y="213">BLOQUE DE DERECHAS</text>
<rect class="sv-box" x="12" y="224" width="250" height="58" rx="2"/>
<text class="sv-t" x="137" y="241.3" text-anchor="middle">PSOE: organizador de la izquierda</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="256.3" text-anchor="middle">sanchismo, amnistía, corrupción</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="271.3" text-anchor="middle">de partido profesional</text>
<rect class="sv-box" x="498" y="224" width="250" height="58" rx="2"/>
<text class="sv-t" x="623" y="241.3" text-anchor="middle">Hitos del ciclo reaccionario</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="256.3" text-anchor="middle">Colón 2019 → Noviembre Nacional</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="271.3" text-anchor="middle">2023 (Ferraz): gobierno «ilegítimo»</text>
<rect class="sv-box-gold" x="290" y="234" width="180" height="58" rx="2"/>
<text class="sv-tg" x="380" y="251.3" text-anchor="middle">Aparatos del Estado</text>
<text class="sv-tg" x="380" y="266.3" text-anchor="middle">insumisos</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="281.3" text-anchor="middle">judicatura, UCO, GC</text>
<rect class="sv-box" x="12" y="296" width="250" height="58" rx="2"/>
<text class="sv-t" x="137" y="313.3" text-anchor="middle">Sumar · IU-PCE</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="328.3" text-anchor="middle">respiración asistida;</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="343.3" text-anchor="middle">sin fuerza propia</text>
<rect class="sv-box" x="498" y="296" width="250" height="58" rx="2"/>
<text class="sv-t" x="623" y="313.3" text-anchor="middle">PP: giro a la derecha</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="328.3" text-anchor="middle">pauta Aznar: disciplinar al PSOE;</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="343.3" text-anchor="middle">gobierno PP-Vox, lo más probable</text>
<rect class="sv-box" x="12" y="368" width="250" height="58" rx="2"/>
<text class="sv-t" x="137" y="385.3" text-anchor="middle">Podemos (Canal Red)</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="400.3" text-anchor="middle">tierra quemada: oposición</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="415.3" text-anchor="middle">post-Sánchez</text>
<rect class="sv-box" x="498" y="368" width="250" height="58" rx="2"/>
<text class="sv-t" x="623" y="385.3" text-anchor="middle">Vox: caudillismo y Patriots</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="400.3" text-anchor="middle">inmigración como caballo de Troya;</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="415.3" text-anchor="middle">desplazar el marco de lo aceptable</text>
<rect class="sv-box" x="290" y="368" width="180" height="58" rx="2"/>
<text class="sv-t" x="380" y="385.3" text-anchor="middle">Clase media inestable</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="400.3" text-anchor="middle">«centro sociológico» del</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="415.3" text-anchor="middle">turnismo, en descomposición</text>
<rect class="sv-box" x="12" y="450" width="250" height="58" rx="2"/>
<text class="sv-t" style="font-size:12.4px" x="137" y="467.3" text-anchor="middle">Dilema de la unidad y «excepción española»</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="482.3" text-anchor="middle">sin unidad ganan PP y Vox; el</text>
<text class="sv-t2" style="font-size:12.5px" x="137" y="497.3" text-anchor="middle">progresismo podría implosionar</text>
<rect class="sv-box" x="498" y="450" width="250" height="58" rx="2"/>
<text class="sv-t" x="623" y="467.3" text-anchor="middle">Campo neofascista</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="482.3" text-anchor="middle">Núcleo Nacional, Revuelta: «brazo</text>
<text class="sv-t2" style="font-size:12.5px" x="623" y="497.3" text-anchor="middle">auxiliar» (Torre Pacheco)</text>
<rect class="sv-box" x="290" y="450" width="180" height="58" rx="2"/>
<text class="sv-t" x="380" y="467.3" text-anchor="middle">Enemigos múltiples,</text>
<text class="sv-t" x="380" y="482.3" text-anchor="middle">no «masa reaccionaria»</text>
<text class="sv-t2" style="font-size:11.5px" x="380" y="497.3" text-anchor="middle">cada correlación impone tareas</text>
<line class="sv-line-red" x1="290" y1="264" x2="262" y2="264" marker-end="url(#nc-n1a3-arrow)"/>
<path class="sv-line-dash" d="M498 238 H484 V254 H470" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line-dash" x1="290" y1="397" x2="262" y2="397"/>
<line class="sv-line-dash" x1="470" y1="397" x2="498" y2="397"/>
<text class="sv-t3" x="380" y="439" text-anchor="middle">en disputa</text>
<rect class="sv-soft" x="4" y="526" width="752" height="154" rx="2"/>
<text class="sv-t3" x="10" y="537">TAREAS COMUNISTAS</text>
<line class="sv-line" x1="380" y1="508" x2="380" y2="548" marker-end="url(#nc-n1a3-arrow)"/>
<rect class="sv-box" x="12" y="548" width="240" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="132" y="565.3" text-anchor="middle">Corto plazo: deslinde con el ala</text>
<text class="sv-t" style="font-size:13px" x="132" y="580.3" text-anchor="middle">izquierda del sistema de partidos</text>
<text class="sv-t2" style="font-size:12.5px" x="132" y="595.3" text-anchor="middle">atención al viraje de Podemos</text>
<rect class="sv-box" x="260" y="548" width="240" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="380" y="565.3" text-anchor="middle">Medio plazo: independencia</text>
<text class="sv-t" style="font-size:13px" x="380" y="580.3" text-anchor="middle">frente al neorreformismo</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="595.3" text-anchor="middle">sin herramientas propias no hay atajos</text>
<rect class="sv-box-red" x="508" y="548" width="240" height="58" rx="2"/>
<text class="sv-tr" style="font-size:13px" x="628" y="565.3" text-anchor="middle">Largo plazo: vanguardia contra</text>
<text class="sv-tr" style="font-size:13px" x="628" y="580.3" text-anchor="middle">la represión y el fascismo</text>
<text class="sv-t2" style="font-size:12.5px" x="628" y="595.3" text-anchor="middle">frente de autodefensa → partido</text>
<rect class="sv-box-ink" x="12" y="628" width="736" height="44" rx="2"/>
<text class="sv-tw" x="380" y="645.8" text-anchor="middle">Partido comunista de masas: «el gran ausente hoy, a la vez que la única alternativa real»</text>
<text class="sv-tw" x="380" y="660.8" text-anchor="middle" style="font-weight:400;font-size:12px">socialismo como fuerza de oposición, no de turnismo; medir cada decisión por la capacidad de lucha de la clase</text>
<line class="sv-line" x1="252" y1="568" x2="260" y2="568" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="500" y1="568" x2="508" y2="568" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="132" y1="606" x2="132" y2="628" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="380" y1="606" x2="380" y2="628" marker-end="url(#nc-n1a3-arrow)"/>
<line class="sv-line" x1="628" y1="606" x2="628" y2="628" marker-end="url(#nc-n1a3-arrow)"/>
<text class="sv-t3" x="256" y="621" text-anchor="middle">niveles de un proceso único</text>
<text class="sv-t3" x="12" y="694">LEYENDA · continua: sucesión / desemboca en · roja: presión sobre el gobierno · discontinua: relación (simpatía, disputa)</text>
</svg>
