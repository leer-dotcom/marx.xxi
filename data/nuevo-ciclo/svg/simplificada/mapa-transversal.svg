<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa transversal de los cuatro números: diagnóstico compartido en seis tesis, respuestas rechazadas, propuesta (partido comunista de masas) y sus tres dimensiones, y horizonte." viewBox="0 0 760 700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-tr-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="20" width="752" height="174" rx="2"/>
<text class="sv-t3" x="10" y="31" text-anchor="start">DIAGNÓSTICO COMPARTIDO</text>
<rect class="sv-box-ink" x="12" y="42" width="235" height="68" rx="2"/>
<text class="sv-tw" x="129.5" y="63" text-anchor="middle">Declive del capitalismo</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="129.5" y="76.5" text-anchor="middle">rentabilidad en caída, población</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="129.5" y="91.0" text-anchor="middle">sobrante, «fin de juego»</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="129.5" y="103" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-ink" x="263" y="42" width="235" height="68" rx="2"/>
<text class="sv-tw" x="380.5" y="63" text-anchor="middle">Guerra e imperialismo</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.5" y="76.5" text-anchor="middle">militarismo estructural, Gaza,</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.5" y="91.0" text-anchor="middle">rearme europeo</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="380.5" y="103" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-ink" x="513" y="42" width="235" height="68" rx="2"/>
<text class="sv-tw" style="font-size:13.4px;letter-spacing:0" x="630.5" y="63" text-anchor="middle">El Estado como dictadura de clase</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="630.5" y="76.5" text-anchor="middle">Estado dual, Gladio, antiterrorismo,</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="630.5" y="91.0" text-anchor="middle">fronteras</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="630.5" y="103" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-ink" x="12" y="118" width="235" height="68" rx="2"/>
<text class="sv-tw" style="font-size:13.2px;letter-spacing:0" x="129.5" y="139" text-anchor="middle">Lo que parece excepción es esencia</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="129.5" y="152.5" text-anchor="middle">genocidio, devoluciones, delincuencia,</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="129.5" y="167.0" text-anchor="middle">muertes en el trabajo, austeridad</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="129.5" y="179" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-ink" x="263" y="118" width="235" height="68" rx="2"/>
<text class="sv-tw" style="font-size:13.2px;letter-spacing:0" x="380.5" y="139" text-anchor="middle">Trabajo vivo, proletariado sin sujeto</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.5" y="152.5" text-anchor="middle">sólo el trabajo vivo crea valor; clase</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="380.5" y="167.0" text-anchor="middle">mayoritaria pero fragmentada</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="380.5" y="179" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-ink" x="513" y="118" width="235" height="68" rx="2"/>
<text class="sv-tw" style="font-size:13.2px;letter-spacing:0" x="630.5" y="139" text-anchor="middle">Sin partido, las luchas son impotentes</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="630.5" y="152.5" text-anchor="middle">protestas post-2008 bajo hegemonía</text>
<text class="sv-tw" style="font-weight:400;font-size:12px" x="630.5" y="167.0" text-anchor="middle">pequeñoburguesa</text>
<text class="sv-tw" style="font-size:9.5px;font-weight:400;letter-spacing:.06em" x="630.5" y="179" text-anchor="middle">#1 · #2 · #3 · #4</text>
<line class="sv-line-dash" x1="129.5" y1="186" x2="129.5" y2="244" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="380.5" y1="186" x2="380.5" y2="244" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="186" x2="630.5" y2="244" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="137.5" y="200" text-anchor="start">respuestas al diagnóstico</text>
<text class="sv-t3" style="font-size:10px" x="137.5" y="212" text-anchor="start">que la revista rechaza</text>
<rect class="sv-soft" x="4" y="222" width="752" height="116" rx="2"/>
<text class="sv-t3" x="255.0" y="233" text-anchor="middle">RESPUESTAS QUE LA REVISTA RECHAZA</text>
<rect class="sv-box-gold" x="12" y="244" width="235" height="86" rx="2"/>
<text class="sv-tg" x="129.5" y="265" text-anchor="middle">Socialdemocracia y reformismo</text>
<text class="sv-tg" x="129.5" y="280" text-anchor="middle">gobernante</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="293.5" text-anchor="middle">PSOE, Sumar, IU, Podemos, Weber,</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="308.0" text-anchor="middle">neofeudalismo: alimentan la reacción</text>
<text class="sv-t3" style="font-size:9.5px" x="129.5" y="323" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-gold" x="263" y="244" width="235" height="86" rx="2"/>
<text class="sv-tg" x="380.5" y="265" text-anchor="middle">Campismo y soberanismo</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="278.5" text-anchor="middle">pacifismo multipolar, «fantasías de</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="293.0" text-anchor="middle">secesión», europeísmo militarista</text>
<text class="sv-t3" style="font-size:9.5px" x="380.5" y="323" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-gold" x="513" y="244" width="235" height="86" rx="2"/>
<text class="sv-tg" x="630.5" y="265" text-anchor="middle">Espontaneísmo, moralismo,</text>
<text class="sv-tg" x="630.5" y="280" text-anchor="middle">atrapalotodo</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="293.5" text-anchor="middle">comunización, frente impopular,</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="308.0" text-anchor="middle">feminismo dual, adanismo</text>
<text class="sv-t3" style="font-size:9.5px" x="630.5" y="323" text-anchor="middle">#1 · #2 · #3 · #4</text>
<path class="sv-line-red" d="M129.5 330 V350 H380 V370" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line-red" x1="380" y1="330" x2="380" y2="370" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line-red" d="M630.5 330 V350 H380 V370" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="392" y="362" text-anchor="start">deslinde de campos «mediante la argumentación y la polémica»</text>
<rect class="sv-box-red" x="12" y="370" width="736" height="56" rx="2"/>
<text class="sv-tr" x="380" y="392" text-anchor="middle">Independencia política del proletariado: partido comunista de masas</text>
<text class="sv-t2" style="font-size:12px" x="380" y="408" text-anchor="middle">«el gran ausente hoy, a la vez que la única alternativa real»; fórmula de 1850; programa mínimo-máximo</text>
<text class="sv-t3" style="font-size:9.5px" x="380" y="419" text-anchor="middle">#1 (TODO EL NÚMERO) · #2 · #3 · #4</text>
<rect class="sv-soft" x="4" y="462" width="752" height="108" rx="2"/>
<text class="sv-t3" x="255.0" y="473" text-anchor="middle">DIMENSIONES DE LA PROPUESTA</text>
<path class="sv-line" d="M380 426 V446 H129.5 V484" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="426" x2="380" y2="484" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M380 426 V446 H630.5 V484" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="392" y="441" text-anchor="start">se desarrolla en tres dimensiones</text>
<rect class="sv-box-blue" x="12" y="484" width="235" height="78" rx="2"/>
<text class="sv-tb" x="129.5" y="505" text-anchor="middle">Instituciones propias</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="518.5" text-anchor="middle">prensa obrera, organización</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="533.0" text-anchor="middle">territorial, autodefensa, gimnasios</text>
<text class="sv-t3" style="font-size:9.5px" x="129.5" y="555" text-anchor="middle">#1 · #2 · #3 · #4</text>
<rect class="sv-box-blue" x="263" y="484" width="235" height="78" rx="2"/>
<text class="sv-tb" x="380.5" y="505" text-anchor="middle">Legalidad e ilegalidad combinadas</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="518.5" text-anchor="middle">derechos políticos como armas; el</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="533.0" text-anchor="middle">juicio como tribuna</text>
<text class="sv-t3" style="font-size:9.5px" x="380.5" y="555" text-anchor="middle">#1 · #2 · #4</text>
<rect class="sv-box-blue" x="513" y="484" width="235" height="78" rx="2"/>
<text class="sv-tb" x="630.5" y="505" text-anchor="middle">Escala continental e internacional</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="518.5" text-anchor="middle">Partido Comunista Europeo, nueva</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="533.0" text-anchor="middle">Internacional; desmantelar OTAN y UE</text>
<text class="sv-t3" style="font-size:9.5px" x="630.5" y="555" text-anchor="middle">#1 · #2 · #3 · #4</text>
<path class="sv-line" d="M129.5 562 V582 H380 V602" marker-end="url(#nc-tr-arrow)"/>
<line class="sv-line" x1="380" y1="562" x2="380" y2="602" marker-end="url(#nc-tr-arrow)"/>
<path class="sv-line" d="M630.5 562 V582 H380 V602" marker-end="url(#nc-tr-arrow)"/>
<text class="sv-t3" style="font-size:10px" x="392" y="594" text-anchor="start">realizan</text>
<rect class="sv-box-green" x="12" y="602" width="736" height="56" rx="2"/>
<text class="sv-tgr" x="380" y="624" text-anchor="middle">Horizonte: unidad de clase y antimperialismo sin campismo — «el enemigo principal está en casa»</text>
<text class="sv-t2" style="font-size:12px" x="380" y="640" text-anchor="middle">«el futuro de Palestina es el futuro de la humanidad» (Brassier); Palestina como prueba</text>
<text class="sv-t3" style="font-size:9.5px" x="380" y="651" text-anchor="middle">EN TODOS LOS NÚMEROS</text>
<rect class="sv-soft" x="4" y="668" width="752" height="24" rx="2"/>
<text class="sv-t3" style="font-size:9.5px" x="380" y="684" text-anchor="middle">DISCONTINUA: RESPUESTAS RECHAZADAS · ROJA: DESLINDE HACIA LA PROPUESTA · CONTINUA: DESARROLLO Y REALIZACIÓN · #N = NÚMEROS</text>
</svg>
