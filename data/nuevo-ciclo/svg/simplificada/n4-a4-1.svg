<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fines del proceso ejemplarizante; defensa de connivencia frente a defensa de ruptura comparadas en objetivo, destinatario, identidad del acusado, relación con el tribunal, lugar de los hechos y la política, y técnica; gradación de los efectos de la ruptura según la organización." viewBox="0 0 760 696" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="554" width="752" height="113" rx="2"/>
<rect class="sv-soft" x="4" y="483" width="752" height="67" rx="2"/>
<rect class="sv-soft" x="4" y="412" width="752" height="67" rx="2"/>
<rect class="sv-soft" x="4" y="327" width="752" height="81" rx="2"/>
<rect class="sv-soft" x="4" y="256" width="752" height="67" rx="2"/>
<rect class="sv-soft" x="4" y="185" width="752" height="67" rx="2"/>
<rect class="sv-soft" x="4" y="114" width="752" height="67" rx="2"/>
<rect class="sv-box-ink" x="12" y="12" width="736" height="46" rx="2"/>
<text class="sv-tw" x="380" y="30" text-anchor="middle">El proceso ejemplarizante: lo que busca la burguesía</text>
<text class="sv-tw" x="380" y="46" text-anchor="middle" style="font-size:12px;font-weight:400">legitimar el terror · escenificar el descabezamiento del movimiento · sobre todo, el arrepentimiento del acusado</text>
<rect class="sv-box-blue" x="12" y="66" width="360" height="42" rx="2"/>
<text class="sv-tb" x="192" y="83" text-anchor="middle">Defensa de connivencia</text>
<text class="sv-t2" x="192" y="99" text-anchor="middle" style="font-size:12px">«mortífera» (Vergès): excusas y refugio en lo jurídico</text>
<rect class="sv-box-red" x="388" y="66" width="360" height="42" rx="2"/>
<text class="sv-tr" x="568" y="83" text-anchor="middle">Defensa de ruptura</text>
<text class="sv-t2" x="568" y="99" text-anchor="middle" style="font-size:12px">Bebel y Liebknecht 1872, Varlin 1868, Leviné 1919; Vergès 1957</text>
<text class="sv-t3" x="10" y="124">OBJETIVO</text>
<rect class="sv-box" x="12" y="132" width="360" height="44" rx="2"/>
<text class="sv-t" x="192" y="150" text-anchor="middle">Absolución personal; aceptar la moral burguesa</text>
<text class="sv-t2" x="192" y="166" text-anchor="middle" style="font-size:12px">someterse por entero al marco legal capitalista</text>
<rect class="sv-box" x="388" y="132" width="360" height="44" rx="2"/>
<text class="sv-t" x="568" y="150" text-anchor="middle">El acusado se vuelve acusador; derecho a la revolución</text>
<text class="sv-t2" x="568" y="166" text-anchor="middle" style="font-size:12px">impugnar el orden burgués en su totalidad; el proceso como tribuna</text>
<text class="sv-t3" x="10" y="195">DESTINATARIO</text>
<rect class="sv-box" x="12" y="203" width="360" height="44" rx="2"/>
<text class="sv-t" x="192" y="221" text-anchor="middle">El tribunal</text>
<text class="sv-t2" x="192" y="237" text-anchor="middle" style="font-size:12px">y la propia liberación</text>
<rect class="sv-box" x="388" y="203" width="360" height="44" rx="2"/>
<text class="sv-t" x="568" y="221" text-anchor="middle">El partido y las masas que esperan fuera</text>
<text class="sv-t2" x="568" y="237" text-anchor="middle" style="font-size:12px">el aviso a navegantes de la burguesía se vuelve altavoz socialista</text>
<text class="sv-t3" x="10" y="266">IDENTIDAD DEL ACUSADO</text>
<rect class="sv-box" x="12" y="274" width="360" height="44" rx="2"/>
<text class="sv-t" x="192" y="292" text-anchor="middle">Acepta la etiqueta de criminal o se lava las manos</text>
<text class="sv-t2" x="192" y="308" text-anchor="middle" style="font-size:12px">el «sálvese quien pueda» destruye la confianza de los de fuera</text>
<rect class="sv-box" x="388" y="274" width="360" height="44" rx="2"/>
<text class="sv-t" x="568" y="292" text-anchor="middle">Luchador por un ideal, no un criminal</text>
<text class="sv-t2" x="568" y="308" text-anchor="middle" style="font-size:12px">«Soldado de la Revolución» (Liebknecht); dos partidos (Varlin)</text>
<text class="sv-t3" x="10" y="337">TRIBUNAL</text>
<rect class="sv-box" x="12" y="345" width="360" height="58" rx="2"/>
<text class="sv-t" x="192" y="370" text-anchor="middle">Reconocido como juez</text>
<text class="sv-t2" x="192" y="386" text-anchor="middle" style="font-size:12px">interlocutor del que se espera una condena más indulgente</text>
<rect class="sv-box" x="388" y="345" width="360" height="58" rx="2"/>
<text class="sv-t" x="568" y="363" text-anchor="middle">Desautorizado como impostor; la «alta traición» es una</text>
<text class="sv-t" x="568" y="378" text-anchor="middle">categoría política</text>
<text class="sv-t2" x="568" y="394" text-anchor="middle" style="font-size:12px">la persecución, termómetro del buen camino (Liebknecht)</text>
<text class="sv-t3" x="10" y="422">LOS HECHOS Y LA POLÍTICA</text>
<rect class="sv-box" x="12" y="430" width="360" height="44" rx="2"/>
<text class="sv-t" x="192" y="448" text-anchor="middle">Primer plano: excusas y tecnicismos</text>
<text class="sv-t2" x="192" y="464" text-anchor="middle" style="font-size:12px">desentenderse de los hechos para alejarse de la condena</text>
<rect class="sv-box" x="388" y="430" width="360" height="44" rx="2"/>
<text class="sv-t" x="568" y="448" text-anchor="middle">Segundo plano: hablar de política, asumir la condena</text>
<text class="sv-t2" x="568" y="464" text-anchor="middle" style="font-size:12px">«muertos de permiso»: los hechos se reivindican (Leviné)</text>
<text class="sv-t3" x="10" y="493">FORMA Y TÉCNICA PROCESAL</text>
<rect class="sv-box" x="12" y="501" width="360" height="44" rx="2"/>
<text class="sv-t" x="192" y="519" text-anchor="middle">La defensa que el tribunal espera</text>
<text class="sv-t2" x="192" y="535" text-anchor="middle" style="font-size:12px">el «procesado silente» ceñido al abogado ordinario</text>
<rect class="sv-box" x="388" y="501" width="360" height="44" rx="2"/>
<text class="sv-t" x="568" y="519" text-anchor="middle">Defensa consciente que sorprende a jueces y abogados</text>
<text class="sv-t2" x="568" y="535" text-anchor="middle" style="font-size:12px">proceso reglado; la última palabra como broche político</text>
<text class="sv-t3" x="10" y="564">EFECTOS DE LA RUPTURA SEGÚN EL GRADO DE ORGANIZACIÓN</text>
<rect class="sv-box-green" x="12" y="572" width="172" height="90" rx="2"/>
<text class="sv-tgr" x="98" y="590" text-anchor="middle">Organización de masas →</text>
<text class="sv-tgr" x="98" y="605" text-anchor="middle">Burgos: 16 conmutadas</text>
<text class="sv-t2" x="98" y="621" text-anchor="middle" style="font-size:12px">huelgas y secuestro del</text>
<text class="sv-t2" x="98" y="635" text-anchor="middle" style="font-size:12px">cónsul: estructura capaz</text>
<text class="sv-t2" x="98" y="649" text-anchor="middle" style="font-size:12px">de usar el proceso</text>
<rect class="sv-box-gold" x="200" y="572" width="172" height="90" rx="2"/>
<text class="sv-tg" x="286" y="590" text-anchor="middle">Partido desarticulado →</text>
<text class="sv-tg" x="286" y="605" text-anchor="middle">Grimau, PCE(r)</text>
<text class="sv-t2" x="286" y="621" text-anchor="middle" style="font-size:12px">consejos de guerra sin</text>
<text class="sv-t2" x="286" y="635" text-anchor="middle" style="font-size:12px">partido detrás: reacción</text>
<text class="sv-t2" x="286" y="649" text-anchor="middle" style="font-size:12px">internacional, poca interna</text>
<rect class="sv-box-gold" x="388" y="572" width="172" height="90" rx="2"/>
<text class="sv-tg" x="474" y="590" text-anchor="middle">Movilización que se</text>
<text class="sv-tg" x="474" y="605" text-anchor="middle">desinfla → Hásel</text>
<text class="sv-t2" x="474" y="621" text-anchor="middle" style="font-size:12px">conciencia y movilización</text>
<text class="sv-t2" x="474" y="635" text-anchor="middle" style="font-size:12px">puntuales que decaen con</text>
<text class="sv-t2" x="474" y="649" text-anchor="middle" style="font-size:12px">los meses: alcance menor</text>
<rect class="sv-box" x="576" y="572" width="172" height="90" rx="2"/>
<text class="sv-t" x="662" y="590" text-anchor="middle">Soledad → Miguel</text>
<text class="sv-t" x="662" y="605" text-anchor="middle">Hernández: la integridad</text>
<text class="sv-t2" x="662" y="621" text-anchor="middle" style="font-size:12px">rechaza vivienda, pensión</text>
<text class="sv-t2" x="662" y="635" text-anchor="middle" style="font-size:12px">y vida; elige morir antes</text>
<text class="sv-t2" x="662" y="649" text-anchor="middle" style="font-size:12px">que claudicar</text>
<text class="sv-t3" x="12" y="686">LA RUPTURA REFUERZA ORGANIZACIONES, AMPLÍA APOYOS, FUERZA REBAJAS O AMNISTÍAS; LA CONNIVENCIA, «MORTÍFERA»</text>
</svg>
