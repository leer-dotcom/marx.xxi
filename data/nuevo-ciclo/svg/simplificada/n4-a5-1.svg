<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" role="img" aria-label="Base imperialista de la cuestión migratoria y su expresión doméstica (la subclase migrante), doble estrategia de integración dentro y control fuera, los actores socialdemócratas que la ejecutan o legitiman, las tres fases históricas, la maduración hacia el arraigo individual y la salida de clase antimperialista." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="16">BASE: EL MECANISMO IMPERIALISTA</text>
<rect class="sv-box-ink" x="12" y="22" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="40" text-anchor="middle">Imperialismo: desarticulación de las periferias (Amin) → presión emigratoria estructural</text>
<text class="sv-tw" style="font-size:12px;font-weight:400" x="380" y="57" text-anchor="middle">estratificación mundial del proletariado: paz social del centro, consumo de masas, arbitraje laboral global</text>
<line class="sv-line" x1="380" y1="70" x2="380" y2="96" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="87">expresión doméstica</text>
<rect class="sv-box" x="12" y="96" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="114" text-anchor="middle">Imperialismo en casa: la subclase migrante (estratificación racial del proletariado)</text>
<text class="sv-t2" style="font-size:12px" x="380" y="131" text-anchor="middle">capa sujeta a más violencia, disciplina y despojo; brecha salarial: −60 % en el decil más bajo (OIT)</text>
<line class="sv-line" x1="380" y1="144" x2="380" y2="170" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="161">la burguesía la gestiona con</text>
<rect class="sv-soft" x="4" y="166" width="752" height="92" rx="2"/>
<text class="sv-t3" x="18" y="181">DOBLE ESTRATEGIA · PROYECTO PREFERIDO DE LA BURGUESÍA OCCIDENTAL DESDE LA POSGUERRA</text>
<rect class="sv-box" x="12" y="190" width="360" height="62" rx="2"/>
<text class="sv-tb" x="192" y="208" text-anchor="middle">Dentro: integración parcial (derechos vaciados)</text>
<text class="sv-t2" style="font-size:12px" x="192" y="224" text-anchor="middle">regularizaciones, arraigo individual, Ley Zerolo, sanidad:</text>
<text class="sv-t2" style="font-size:12px" x="192" y="238" text-anchor="middle">concesión vaciada que alivia tensiones (hoy en retroceso)</text>
<rect class="sv-box" x="388" y="190" width="360" height="62" rx="2"/>
<text class="sv-tr" x="568" y="208" text-anchor="middle">Fuera: control fronterizo cada vez más férreo</text>
<text class="sv-t2" style="font-size:12px" x="568" y="224" text-anchor="middle">CIE, concertinas, externalización, PEMA, Mauritania:</text>
<text class="sv-t2" style="font-size:12px" x="568" y="238" text-anchor="middle">restringe el acceso al Norte y salvaguarda la paz social</text>
<path class="sv-line" d="M380 258 V270 H192 V288" marker-end="url(#nc-n4a5-arrow)"/>
<path class="sv-line" d="M380 258 V270 H568 V288" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="198" y="282">la ejecuta</text>
<text class="sv-t3" x="574" y="282">la legitima</text>
<rect class="sv-box" x="12" y="288" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="306" text-anchor="middle">PSOE (moderada): perfil de Estado</text>
<text class="sv-t2" style="font-size:12px" x="192" y="322" text-anchor="middle">actor principal del régimen migratorio; fronteras que</text>
<text class="sv-t2" style="font-size:12px" x="192" y="336" text-anchor="middle">matan más que las de Meloni: la paz social europea lo exige</text>
<rect class="sv-box-gold" x="388" y="288" width="360" height="62" rx="2"/>
<text class="sv-tg" x="568" y="306" text-anchor="middle">Socialdemocracia radical: IU (1991) → Podemos (2026)</text>
<text class="sv-t2" style="font-size:12px" x="568" y="322" text-anchor="middle">puntas del iceberg (Tarajal, 24-J) en vez de análisis;</text>
<text class="sv-t2" style="font-size:12px" x="568" y="336" text-anchor="middle">horizonte máximo: derogar la LOEx; «ala izquierda del capital»</text>
<rect class="sv-soft" x="4" y="366" width="752" height="98" rx="2"/>
<text class="sv-t3" x="18" y="381">TRES FASES DEL RÉGIMEN MIGRATORIO ESPAÑOL</text>
<rect class="sv-box" x="12" y="390" width="236" height="68" rx="2"/>
<text class="sv-t" x="130" y="408" text-anchor="middle">1985-99: fundación</text>
<text class="sv-t3" x="130" y="421" text-anchor="middle">lenta actualización a Europa</text>
<text class="sv-t2" style="font-size:12px" x="130" y="436" text-anchor="middle">LOEx 7/1985 exigida por Bruselas;</text>
<text class="sv-t2" style="font-size:12px" x="130" y="450" text-anchor="middle">Schengen: nace la doble estrategia</text>
<rect class="sv-box" x="262" y="390" width="236" height="68" rx="2"/>
<text class="sv-t" x="380" y="408" text-anchor="middle">2000-15: consolidación</text>
<text class="sv-t3" x="380" y="421" text-anchor="middle">cierta dirección propia</text>
<text class="sv-t2" style="font-size:12px" x="380" y="436" text-anchor="middle">LOEx 4/2000 (IU) → 8/2000 del PP;</text>
<text class="sv-t2" style="font-size:12px" x="380" y="450" text-anchor="middle">Zapatero: concertinas, CIE, Frontex</text>
<rect class="sv-box" x="512" y="390" width="236" height="68" rx="2"/>
<text class="sv-t" x="630" y="408" text-anchor="middle">2015-26: cambio de ciclo</text>
<text class="sv-t3" x="630" y="421" text-anchor="middle">post-15M: modelo de coalición</text>
<text class="sv-t2" style="font-size:12px" x="630" y="436" text-anchor="middle">Aquarius → continuismo; prevalece</text>
<text class="sv-t2" style="font-size:12px" x="630" y="450" text-anchor="middle">Marlaska; PEMA, regularización 2026</text>
<line class="sv-line" x1="248" y1="421" x2="262" y2="421" marker-end="url(#nc-n4a5-arrow)"/>
<line class="sv-line" x1="498" y1="421" x2="512" y2="421" marker-end="url(#nc-n4a5-arrow)"/>
<line class="sv-line" x1="380" y1="464" x2="380" y2="490" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="481">tendencia de fondo</text>
<rect class="sv-box-blue" x="12" y="490" width="736" height="48" rx="2"/>
<text class="sv-tb" x="380" y="508" text-anchor="middle">Maduración de la política migratoria burguesa</text>
<text class="sv-t2" style="font-size:12px" x="380" y="525" text-anchor="middle">de la regularización extraordinaria al arraigo individual: ajuste semiautomático de la reserva de mano de obra</text>
<line class="sv-line" x1="380" y1="538" x2="380" y2="564" marker-end="url(#nc-n4a5-arrow)"/>
<text class="sv-t3" x="388" y="555">límite estructural → salida</text>
<rect class="sv-box-red" x="12" y="564" width="736" height="48" rx="2"/>
<text class="sv-tr" x="380" y="582" text-anchor="middle">Unidad de clase antimperialista: destruir a la vez, sistemáticamente, imperialismo y racismo</text>
<text class="sv-t2" style="font-size:12px" x="380" y="599" text-anchor="middle">sin estrategia antimperialista real, Europa seguirá matando, persiguiendo o explotando a quien migra</text>
</svg>
