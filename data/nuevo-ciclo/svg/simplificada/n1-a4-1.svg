<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 759" role="img" aria-label="Cadena causal del genocidio y de la represión del movimiento propalestino como efectos del declive capitalista (giro militarista y giro autoritario), con la brecha de legitimidad del Estado liberal como razón de la represión; debajo, la debilidad del movimiento como efecto de la debilidad organizativa de la clase, las organizaciones que no sirven, los mínimos programáticos, el balance de acciones y el partido revolucionario internacional que reclama el artículo." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="12" width="752" height="82" rx="2"/>
<text class="sv-t3" x="10" y="23">OBJETO Y CRONOLOGÍA (OCTUBRE DE 2023 – 2025)</text>
<rect class="sv-box" x="12" y="30" width="230" height="58" rx="2"/>
<text class="sv-t" x="127" y="47.3" text-anchor="middle">Objeto: Occidente</text>
<text class="sv-t2" style="font-size:12px" x="127" y="62.3" text-anchor="middle">bloque imperialista implicado</text>
<text class="sv-t2" style="font-size:12px" x="127" y="77.3" text-anchor="middle">en el genocidio; nuestro marco</text>
<rect class="sv-box" x="254" y="30" width="494" height="58" rx="2"/>
<text class="sv-t" x="501" y="47.3" text-anchor="middle">Un «doble siniestro»: ofensiva israelí y represión del movimiento</text>
<text class="sv-t2" style="font-size:12px" x="501" y="62.3" text-anchor="middle">Gaza, Cisjordania, Líbano, Irán; hambruna · prohibición de manifestaciones, acampadas</text>
<text class="sv-t2" style="font-size:12px" x="501" y="77.3" text-anchor="middle">desalojadas, Mahmoud Khalil, ilegalizaciones, Kneecap, Harvard</text>
<rect class="sv-soft" x="4" y="98" width="752" height="306" rx="2"/>
<text class="sv-t3" x="10" y="109">DOS TENDENCIAS Y EL PROCESO QUE LES DA UNIDAD</text>
<rect class="sv-box-ink" x="150" y="118" width="460" height="42" rx="2"/>
<text class="sv-tw" x="380" y="134.8" text-anchor="middle">Declive capitalista / declive del bloque occidental</text>
<text class="sv-tw" x="380" y="149.8" text-anchor="middle" style="font-weight:400;font-size:12px">sustituir el orden liberal post-1945 por dictadura burguesa descarnada</text>
<rect class="sv-box" x="12" y="172" width="360" height="42" rx="2"/>
<text class="sv-t" x="192" y="188.8" text-anchor="middle">Giro militarista</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="203.8" text-anchor="middle">competencia entre bloques → guerra</text>
<rect class="sv-box" x="388" y="172" width="360" height="42" rx="2"/>
<text class="sv-t" x="568" y="188.8" text-anchor="middle">Giro autoritario</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="203.8" text-anchor="middle">Estados blindados para la lucha de clases</text>
<rect class="sv-box-red" x="12" y="226" width="360" height="42" rx="2"/>
<text class="sv-tr" x="192" y="242.8" text-anchor="middle">Genocidio como operación del bloque occidental</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="257.8" text-anchor="middle">Israel no es exterior a EE. UU.: división del trabajo</text>
<rect class="sv-box" x="388" y="226" width="320" height="42" rx="2"/>
<text class="sv-t" x="548" y="242.8" text-anchor="middle">El propio Israel abandona su máscara liberal</text>
<text class="sv-t2" style="font-size:12.5px" x="548" y="257.8" text-anchor="middle">sionismo mesiánico → régimen dictatorial abierto</text>
<rect class="sv-box-blue" x="12" y="282" width="600" height="42" rx="2"/>
<text class="sv-tb" x="312" y="298.8" text-anchor="middle">Brecha de legitimidad del Estado liberal</text>
<text class="sv-t2" style="font-size:12px" x="312" y="313.8" text-anchor="middle">«bien común» vs. compromisos imperialistas: un movimiento consecuente es enemigo de su Estado</text>
<rect class="sv-box-gold" x="12" y="340" width="360" height="58" rx="2"/>
<text class="sv-tg" x="192" y="357.3" text-anchor="middle">Tesis que une las dos partes</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="372.3" text-anchor="middle">la debilidad del movimiento expresa la debilidad</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="387.3" text-anchor="middle">de las fuerzas contrarias al Estado imperialista</text>
<rect class="sv-box-red" x="388" y="340" width="360" height="58" rx="2"/>
<text class="sv-tr" x="568" y="357.3" text-anchor="middle">Represión del movimiento propalestino</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="372.3" text-anchor="middle">palo y zanahoria; proporcional al vínculo con Israel;</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="387.3" text-anchor="middle">las declaraciones hipócritas, su complemento</text>
<path class="sv-line" d="M380 160 V168 H192 V172" marker-end="url(#nc-n1a4-arrow)"/>
<path class="sv-line" d="M380 160 V168 H568 V172" marker-end="url(#nc-n1a4-arrow)"/>
<line class="sv-line" x1="192" y1="214" x2="192" y2="226" marker-end="url(#nc-n1a4-arrow)"/>
<line class="sv-line" x1="568" y1="214" x2="568" y2="226" marker-end="url(#nc-n1a4-arrow)"/>
<line class="sv-line" x1="192" y1="268" x2="192" y2="282" marker-end="url(#nc-n1a4-arrow)"/>
<text class="sv-t3" x="198" y="277">abre</text>
<path class="sv-line" d="M450 324 V332 H568 V340" marker-end="url(#nc-n1a4-arrow)"/>
<text class="sv-t3" x="574" y="335">razón de ser</text>
<path class="sv-line" d="M730 214 V340" marker-end="url(#nc-n1a4-arrow)"/>
<text class="sv-t3" x="724" y="306" text-anchor="end">blinda</text>
<line class="sv-line" x1="192" y1="324" x2="192" y2="340" marker-end="url(#nc-n1a4-arrow)"/>
<line class="sv-line" x1="352" y1="398" x2="352" y2="430" marker-end="url(#nc-n1a4-arrow)"/>
<rect class="sv-soft" x="4" y="410" width="752" height="329" rx="2"/>
<text class="sv-t3" x="10" y="421">NUESTRO CAMPO: POR QUÉ EL MOVIMIENTO ES DÉBIL</text>
<rect class="sv-box" x="12" y="430" width="360" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="192" y="447.3" text-anchor="middle">Debilidad de las organizaciones obreras tras 2008-20</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="462.3" text-anchor="middle">fracaso del ciclo 2008-20, declive del movimiento</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="477.3" text-anchor="middle">obrero, liquidación de los partidos proletarios</text>
<rect class="sv-box" x="388" y="430" width="360" height="58" rx="2"/>
<text class="sv-t" x="568" y="447.3" text-anchor="middle">Debilidad del movimiento propalestino</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="462.3" text-anchor="middle">desproporción entre los hechos y la respuesta;</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="477.3" text-anchor="middle">sin organizaciones la opinión no se vuelve praxis</text>
<rect class="sv-box" x="12" y="507" width="240" height="42" rx="2"/>
<text class="sv-t" style="font-size:13px" x="132" y="523.8" text-anchor="middle">Socialdemocracia: leal al Estado</text>
<text class="sv-t2" style="font-size:12.5px" x="132" y="538.8" text-anchor="middle">condenas simbólicas, apoyo de facto</text>
<rect class="sv-box" x="260" y="507" width="240" height="42" rx="2"/>
<text class="sv-t" x="380" y="523.8" text-anchor="middle">«Atrapalotodo»</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="538.8" text-anchor="middle">renuncia a politizar: paraguas vacío</text>
<rect class="sv-box" x="508" y="507" width="240" height="42" rx="2"/>
<text class="sv-t" x="628" y="523.8" text-anchor="middle">Campaña de tema único</text>
<text class="sv-t2" style="font-size:12.5px" x="628" y="538.8" text-anchor="middle">no basta por sí misma (Vietnam)</text>
<rect class="sv-box-gold" x="12" y="568" width="240" height="42" rx="2"/>
<text class="sv-tg" style="font-size:12.4px" x="132" y="584.8" text-anchor="middle">Deslinde: el sionismo, no Netanyahu</text>
<text class="sv-t2" style="font-size:12.5px" x="132" y="599.8" text-anchor="middle">Estado único secular, no dos Estados</text>
<rect class="sv-box" x="260" y="568" width="240" height="42" rx="2"/>
<text class="sv-t" style="font-size:12.8px" x="380" y="584.8" text-anchor="middle">Deslinde de campos, sin sectarismo</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="599.8" text-anchor="middle">mínimos comunes, sin equidistancia</text>
<rect class="sv-box-gold" x="508" y="568" width="240" height="42" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="628" y="584.8" text-anchor="middle">Derecho a la resistencia armada</text>
<text class="sv-t2" style="font-size:12.5px" x="628" y="599.8" text-anchor="middle">del pueblo colonizado, sin condiciones</text>
<rect class="sv-box" x="12" y="629" width="178" height="42" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="101" y="645.8" text-anchor="middle">Acampadas</text>
<text class="sv-t2" style="font-size:11.5px" x="101" y="660.8" text-anchor="middle">acción de masas internacional</text>
<rect class="sv-box" x="198" y="629" width="178" height="42" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="287" y="645.8" text-anchor="middle">Boicot obrero</text>
<text class="sv-t2" style="font-size:11.5px" x="287" y="660.8" text-anchor="middle">los puertos, fuerza de clase</text>
<rect class="sv-box" x="384" y="629" width="178" height="42" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="473" y="645.8" text-anchor="middle">Manifestaciones</text>
<text class="sv-t2" style="font-size:11.5px" x="473" y="660.8" text-anchor="middle">masivas pero vagas</text>
<rect class="sv-box" x="570" y="629" width="178" height="42" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="659" y="645.8" text-anchor="middle">Acción directa</text>
<text class="sv-t2" style="font-size:11.5px" x="659" y="660.8" text-anchor="middle">gran impacto, alta represión</text>
<rect class="sv-box-red" x="12" y="691" width="736" height="42" rx="2"/>
<text class="sv-tr" x="380" y="707.8" text-anchor="middle">Partido revolucionario internacional arraigado en los centros de trabajo</text>
<text class="sv-t2" style="font-size:12px" x="380" y="722.8" text-anchor="middle">ata el combate contra el genocidio a la lucha contra todo el poder burgués; internacional, no sólo internacionalista</text>
<line class="sv-line" x1="372" y1="450" x2="388" y2="450" marker-end="url(#nc-n1a4-arrow)"/>
<line class="sv-line" x1="568" y1="488" x2="568" y2="495" marker-end="url(#nc-n1a4-arrow)"/>
<text class="sv-t3" x="380" y="502" text-anchor="middle">¿qué organizaciones? · tres mediaciones que no sirven</text>
<text class="sv-t3" x="380" y="563" text-anchor="middle">mínimos programáticos: unidad parcial pero firme</text>
<text class="sv-t3" x="380" y="624" text-anchor="middle">balance de las formas de acción (éxito proporcional al arraigo)</text>
<line class="sv-line" x1="380" y1="671" x2="380" y2="691" marker-end="url(#nc-n1a4-arrow)"/>
<text class="sv-t3" x="388" y="685">conclusión estratégica</text>
<text class="sv-t3" x="12" y="753">LEYENDA · flecha continua: produce / conduce a · rótulos sobre las flechas: tipo de relación</text>
</svg>
