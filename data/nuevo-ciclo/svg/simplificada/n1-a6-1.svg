<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-label="Trayectoria filosófica de Brassier hacia Marx (origen de clase, posestructuralismo y realismo especulativo, Badiou, defensa de la razón, Hegel y Sellars, crítica de Marx a Hegel, el capital como religión cotidiana) y diagnóstico político (academia, Gaza, Líbano y BICAR, teoría marxista, Postone, Palestina como futuro, fin de Israel ligado al fin de EE. UU.), unidos por la tesis de que superar el capital es la condición de la razón y la lucha anticapitalista es antimperialista; cierre: la filosofía debe llamar al genocidio por su nombre." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="251" height="592" rx="2"/>
<rect class="sv-soft" x="505" y="16" width="251" height="592" rx="2"/>
<text class="sv-t3" x="10" y="27">TRAYECTORIA</text>
<text class="sv-t3" x="511" y="27">DIAGNÓSTICO</text>
<rect class="sv-box" x="12" y="38" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="55.3" text-anchor="middle">Origen de clase y academia</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="70.3" text-anchor="middle">diez años de trabajo manual;</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="85.3" text-anchor="middle">filosofía a los 30</text>
<rect class="sv-box" x="12" y="110" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="127.3" text-anchor="middle">Posestructuralismo ·</text>
<text class="sv-t" x="129.5" y="142.3" text-anchor="middle">realismo especulativo</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="157.3" text-anchor="middle">«comedia de errores»</text>
<rect class="sv-box" x="12" y="182" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="206.8" text-anchor="middle">Badiou: el punto de inflexión</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="221.8" text-anchor="middle">comunista y filósofo de primera</text>
<rect class="sv-box" x="12" y="254" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="271.3" text-anchor="middle">Defensa de la razón contra</text>
<text class="sv-t" x="129.5" y="286.3" text-anchor="middle">el irracionalismo</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="301.3" text-anchor="middle">dos Ilustraciones; vuelta a Hegel y Marx</text>
<rect class="sv-box" x="12" y="326" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="343.3" text-anchor="middle">Hegel: la razón es social</text>
<text class="sv-t" x="129.5" y="358.3" text-anchor="middle">(Sellars)</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="373.3" text-anchor="middle">abre las puertas a Marx</text>
<rect class="sv-box" x="12" y="398" width="235" height="58" rx="2"/>
<text class="sv-t" x="129.5" y="415.3" text-anchor="middle">Marx: crítica de Hegel</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="430.3" text-anchor="middle">las instituciones burguesas dejan</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="445.3" text-anchor="middle">un resto de dominación</text>
<rect class="sv-box-blue" x="12" y="470" width="235" height="58" rx="2"/>
<text class="sv-tb" x="129.5" y="487.3" text-anchor="middle">El capital, «religión cotidiana»,</text>
<text class="sv-tb" x="129.5" y="502.3" text-anchor="middle">deforma la razón</text>
<text class="sv-t2" style="font-size:12px" x="129.5" y="517.3" text-anchor="middle">la mistificación por excelencia</text>
<rect class="sv-box" x="513" y="38" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="55.3" text-anchor="middle">Beirut, 2008: ver desde</text>
<text class="sv-t" x="630.5" y="70.3" text-anchor="middle">las víctimas</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="85.3" text-anchor="middle">llamar a la barbarie por su nombre</text>
<rect class="sv-box" x="513" y="110" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="127.3" text-anchor="middle">Academia = funcionarios del</text>
<text class="sv-t" x="630.5" y="142.3" text-anchor="middle">Estado y del capital</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="157.3" text-anchor="middle">justificaciones al orden neoliberal</text>
<rect class="sv-box" x="513" y="182" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="199.3" text-anchor="middle">Gaza desnuda la función</text>
<text class="sv-t" x="630.5" y="214.3" text-anchor="middle">de la universidad</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="229.3" text-anchor="middle">4-8 % de filósofos firmantes</text>
<rect class="sv-box" x="513" y="254" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="271.3" text-anchor="middle">Líbano: izquierda destruida,</text>
<text class="sv-t" x="630.5" y="286.3" text-anchor="middle">BICAR como baluarte mínimo</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="301.3" text-anchor="middle">PCL: 1,07 % en 2022</text>
<rect class="sv-box" x="513" y="326" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="343.3" text-anchor="middle">Teoría marxista hoy</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="358.3" text-anchor="middle">resurgir tras 2008; Théorie</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="373.3" text-anchor="middle">Communiste, valiosa pero dudosa</text>
<rect class="sv-box" x="513" y="398" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="415.3" text-anchor="middle">Contra Postone</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="430.3" text-anchor="middle">teoría del antisemitismo: analogía</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="445.3" text-anchor="middle">tosca de uso sionista</text>
<rect class="sv-box" x="513" y="470" width="235" height="58" rx="2"/>
<text class="sv-t" x="630.5" y="487.3" text-anchor="middle">Palestina prefigura el futuro:</text>
<text class="sv-t" x="630.5" y="502.3" text-anchor="middle">población sobrante</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="517.3" text-anchor="middle">test del Norte Global</text>
<rect class="sv-box-red" x="513" y="542" width="235" height="58" rx="2"/>
<text class="sv-tr" x="630.5" y="559.3" text-anchor="middle">Fin de Israel = fin de EE. UU.</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="574.3" text-anchor="middle">«Israel les representa»;</text>
<text class="sv-t2" style="font-size:12px" x="630.5" y="589.3" text-anchor="middle">contra el optimismo de Pappé</text>
<rect class="sv-box" x="263" y="38" width="235" height="58" rx="2"/>
<text class="sv-t" x="380.5" y="55.3" text-anchor="middle">Presentación (redacción)</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="70.3" text-anchor="middle">Londres, 1965; Hegel, Sellars y Marx</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="85.3" text-anchor="middle">como fuentes; entrevista de 2025</text>
<rect class="sv-box-red" x="263" y="470" width="235" height="58" rx="2"/>
<text class="sv-tr" x="380.5" y="487.3" text-anchor="middle">Superar el capital = realizar la</text>
<text class="sv-tr" x="380.5" y="502.3" text-anchor="middle">razón = lucha antimperialista</text>
<text class="sv-t2" style="font-size:12px" x="380.5" y="517.3" text-anchor="middle">anticapitalismo = antimperialismo</text>
<rect class="sv-box-ink" x="263" y="542" width="235" height="58" rx="2"/>
<text class="sv-tw" x="380.5" y="559.3" text-anchor="middle">Filosofía: llamar al genocidio</text>
<text class="sv-tw" x="380.5" y="574.3" text-anchor="middle">por su nombre</text>
<text class="sv-tw" x="380.5" y="589.3" text-anchor="middle" style="font-weight:400;font-size:12px">destruir coartadas y racionalizaciones</text>
<line class="sv-line" x1="129.5" y1="96" x2="129.5" y2="110" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="129.5" y1="168" x2="129.5" y2="182" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="129.5" y1="240" x2="129.5" y2="254" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="129.5" y1="312" x2="129.5" y2="326" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="129.5" y1="384" x2="129.5" y2="398" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="129.5" y1="456" x2="129.5" y2="470" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="96" x2="630.5" y2="110" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="168" x2="630.5" y2="182" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="240" x2="630.5" y2="254" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="312" x2="630.5" y2="326" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line-dash" x1="630.5" y1="384" x2="630.5" y2="398" marker-end="url(#nc-n1a6-arrow)"/>
