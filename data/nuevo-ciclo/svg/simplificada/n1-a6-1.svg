<line class="sv-line" x1="247" y1="499" x2="263" y2="499" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="513" y1="499" x2="498" y2="499" marker-end="url(#nc-n1a6-arrow)"/>
<line class="sv-line" x1="380.5" y1="528" x2="380.5" y2="542" marker-end="url(#nc-n1a6-arrow)"/>
<text class="sv-t3" x="12" y="624">LEYENDA · continua: trayectoria y conclusión (conduce a) · discontinua: orden de los temas del diagnóstico</text>
</svg>
