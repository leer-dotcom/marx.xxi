<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-label="Línea temporal del franquismo: la tesis (fascismo desarrollado), dos fases —contrarrevolución y autarquía, desarrollismo y reformismos fallidos— y el movimiento obrero como espejo que fuerza cada mutación del régimen hasta el régimen del 78." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-box-red" x="12" y="10" width="736" height="44" rx="2"/>
<text class="sv-tr" x="380" y="27.8" text-anchor="middle">Tesis: el franquismo, una de las formas de fascismo más desarrolladas (forma de Estado y programa económico)</text>
<text class="sv-t2" style="font-size:12px" x="380" y="42.8" text-anchor="middle">forma de Estado contrarrevolucionaria y antiproletaria: recomposición del orden burgués por violencia masiva</text>
<rect class="sv-soft" x="4" y="68" width="752" height="86" rx="2"/>
<text class="sv-t3" x="750" y="80" text-anchor="end">1936-1959 · CONTRARREVOLUCIÓN Y AUTARQUÍA</text>
<rect class="sv-box" x="12" y="90" width="172" height="58" rx="2"/>
<text class="sv-t" x="98" y="107.3" text-anchor="middle">Crisis de la Restauración</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="122.3" text-anchor="middle">agraria, obrera, política</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="137.3" text-anchor="middle">y colonial</text>
<rect class="sv-box-red" x="200" y="90" width="172" height="58" rx="2"/>
<text class="sv-tr" x="286" y="107.3" text-anchor="middle">Guerra de exterminio y</text>
<text class="sv-tr" x="286" y="122.3" text-anchor="middle">botín de guerra</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="137.3" text-anchor="middle">acumulación por desposesión</text>
<rect class="sv-box" x="388" y="90" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="107.3" text-anchor="middle">Coalición de clase +</text>
<text class="sv-t" x="474" y="122.3" text-anchor="middle">Estado nuevo</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="137.3" text-anchor="middle">Caudillo, Fuero del Trabajo</text>
<rect class="sv-box" x="576" y="90" width="172" height="58" rx="2"/>
<text class="sv-t" x="662" y="107.3" text-anchor="middle">Autarquía: disciplina</text>
<text class="sv-t" x="662" y="122.3" text-anchor="middle">salarial</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="137.3" text-anchor="middle">Barcelona 1951: primer aviso</text>
<line class="sv-line" x1="184" y1="120" x2="200" y2="120" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="372" y1="120" x2="388" y2="120" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="560" y1="120" x2="576" y2="120" marker-end="url(#nc-n2a1-arrow)"/>
<rect class="sv-soft" x="4" y="166" width="752" height="168" rx="2"/>
<text class="sv-t3" x="750" y="178" text-anchor="end">1959-1978 · DESARROLLISMO, REFORMISMOS Y CRISIS</text>
<rect class="sv-box" x="12" y="188" width="234" height="58" rx="2"/>
<text class="sv-t" x="129" y="205.3" text-anchor="middle">Crisis 1956-59 → Plan de</text>
<text class="sv-t" x="129" y="220.3" text-anchor="middle">Estabilización (1959)</text>
<text class="sv-t2" style="font-size:12.5px" x="129" y="235.3" text-anchor="middle">periferia del centro imperialista</text>
<rect class="sv-box" x="262" y="188" width="234" height="58" rx="2"/>
<text class="sv-t" x="379" y="205.3" text-anchor="middle">Ley de Convenios Colectivos</text>
<text class="sv-t" x="379" y="220.3" text-anchor="middle">(1958): negociación por motín</text>
<text class="sv-t2" style="font-size:12.5px" x="379" y="235.3" text-anchor="middle">las luchas obreras fuerzan pactos</text>
<rect class="sv-box" x="512" y="188" width="234" height="58" rx="2"/>
<text class="sv-t" x="629" y="205.3" text-anchor="middle">«Estado fuerte»: constitución</text>
<text class="sv-t" x="629" y="220.3" text-anchor="middle">económica refundada 1958-63</text>
<text class="sv-t2" style="font-size:12.5px" x="629" y="235.3" text-anchor="middle">el nuevo movimiento obrero la fuerza</text>
<rect class="sv-box" x="12" y="270" width="234" height="58" rx="2"/>
<text class="sv-t" x="129" y="287.3" text-anchor="middle">Reformismo falangista</text>
<text class="sv-t2" style="font-size:12.5px" x="129" y="302.3" text-anchor="middle">OSE, elecciones sindicales:</text>
<text class="sv-t2" style="font-size:12.5px" x="129" y="317.3" text-anchor="middle">integrar al movimiento obrero</text>
<rect class="sv-box" x="262" y="270" width="234" height="58" rx="2"/>
<text class="sv-t" x="379" y="287.3" text-anchor="middle">Reformismo tecnócrata</text>
<text class="sv-t2" style="font-size:12.5px" x="379" y="302.3" text-anchor="middle">despolitización por el consumo</text>
<text class="sv-t2" style="font-size:12.5px" x="379" y="317.3" text-anchor="middle">(vía ordoliberal, Opus Dei)</text>
<rect class="sv-box-red" x="512" y="270" width="234" height="58" rx="2"/>
<text class="sv-tr" x="629" y="287.3" text-anchor="middle">Ofensiva obrera 1968-73</text>
<text class="sv-t2" style="font-size:12.5px" x="629" y="302.3" text-anchor="middle">desborda los topes salariales:</text>
<text class="sv-t2" style="font-size:12.5px" x="629" y="317.3" text-anchor="middle">dictadura inviable (1970)</text>
<line class="sv-line" x1="246" y1="218" x2="262" y2="218" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="496" y1="218" x2="512" y2="218" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line" d="M662 148 V159 H129 V188" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line" d="M629 246 V258 H129 V270" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line" d="M379 258 V270" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="246" y1="300" x2="262" y2="300" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="496" y1="300" x2="512" y2="300" marker-end="url(#nc-n2a1-arrow)"/>
<rect class="sv-box-ink" x="12" y="360" width="428" height="58" rx="2"/>
<text class="sv-tw" x="226" y="377.3" text-anchor="middle">Movimiento obrero: el «espejo» obsesivo del régimen</text>
<text class="sv-tw" x="226" y="392.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">la relación capital-trabajo rige cada mutación:</text>
<text class="sv-tw" x="226" y="407.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">1951, 1956, Asturias 1962, 1968-73</text>
<rect class="sv-box-blue" x="456" y="360" width="292" height="58" rx="2"/>
<text class="sv-tb" style="font-size:13px" x="602" y="377.3" text-anchor="middle">Régimen del 78: continuidad del Estado,</text>
<text class="sv-tb" style="font-size:13px" x="602" y="392.3" text-anchor="middle">discontinuidad del régimen</text>
<text class="sv-t2" style="font-size:12.5px" x="602" y="407.3" text-anchor="middle">«la ruptura política pendiente»</text>
<path class="sv-line-red" d="M129 360 V328" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line-red" d="M379 360 V328" marker-end="url(#nc-n2a1-arrow)"/>
<path class="sv-line-red" d="M629 328 V340 H602 V360" marker-end="url(#nc-n2a1-arrow)"/>
<line class="sv-line" x1="12" y1="436" x2="38" y2="436" marker-end="url(#nc-n2a1-arrow)"/>
<text class="sv-t3" x="44" y="440">sucesión histórica</text>
<line class="sv-line-red" x1="177.283" y1="436" x2="203.283" y2="436" marker-end="url(#nc-n2a1-arrow)"/>
<text class="sv-t3" x="209.283" y="440">presión del movimiento obrero: fuerza la mutación del régimen</text>
</svg>
