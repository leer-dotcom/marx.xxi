<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="Cadena causal de la siniestralidad laboral: de la extracción de beneficio a las muertes de 2024, con los factores que la frenan, la ocultan o la agravan, y la respuesta propuesta." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n2a4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="20">Cadena causal: del beneficio a las muertes (flechas continuas)</text>
<rect class="sv-box-ink" x="12" y="32" width="172" height="74" rx="2"/>
<text class="sv-tw" style="font-size:13px" x="98" y="49.8" text-anchor="middle">Extracción de beneficio:</text>
<text class="sv-tw" style="font-size:13px" x="98" y="64.8" text-anchor="middle">el capital vampiro</text>
<text class="sv-tw" x="98" y="79.8" text-anchor="middle" style="font-weight:400;font-size:12px">guerra de clases larvada:</text>
<text class="sv-tw" x="98" y="94.8" text-anchor="middle" style="font-weight:400;font-size:12px">300.000 muertes al año</text>
<rect class="sv-box" x="200" y="32" width="172" height="74" rx="2"/>
<text class="sv-t" x="286" y="49.8" text-anchor="middle">Ritmos, jornadas,</text>
<text class="sv-t" x="286" y="64.8" text-anchor="middle">flexibilidad, vida</text>
<text class="sv-t" x="286" y="79.8" text-anchor="middle">laboral alargada</text>
<text class="sv-t2" style="font-size:12px" x="286" y="94.8" text-anchor="middle">poder despótico del empleador</text>
<rect class="sv-box" x="388" y="32" width="172" height="74" rx="2"/>
<text class="sv-t" x="474" y="49.8" text-anchor="middle">Riesgo → siniestro</text>
<text class="sv-t2" style="font-size:12px" x="474" y="64.8" text-anchor="middle">condiciones, no contenido</text>
<text class="sv-t2" style="font-size:12px" x="474" y="79.8" text-anchor="middle">del trabajo, fijan la</text>
<text class="sv-t2" style="font-size:12px" x="474" y="94.8" text-anchor="middle">peligrosidad</text>
<rect class="sv-box-red" x="576" y="32" width="172" height="74" rx="2"/>
<text class="sv-tr" x="662" y="49.8" text-anchor="middle">833 muertes en 2024</text>
<text class="sv-tr" x="662" y="64.8" text-anchor="middle">(2,5 al día)</text>
<text class="sv-t2" style="font-size:12px" x="662" y="79.8" text-anchor="middle">agricultura, manufactura,</text>
<text class="sv-t2" style="font-size:12px" x="662" y="94.8" text-anchor="middle">construcción, transporte</text>
<line class="sv-line" x1="184" y1="69" x2="200" y2="69" marker-end="url(#nc-n2a4-arrow)"/>
<line class="sv-line" x1="372" y1="69" x2="388" y2="69" marker-end="url(#nc-n2a4-arrow)"/>
<line class="sv-line" x1="560" y1="69" x2="576" y2="69" marker-end="url(#nc-n2a4-arrow)"/>
<rect class="sv-box-blue" x="12" y="148" width="172" height="74" rx="2"/>
<text class="sv-tb" x="98" y="173.3" text-anchor="middle">Centro vs. periferia</text>
<text class="sv-t2" style="font-size:12px" x="98" y="188.3" text-anchor="middle">la barbarie se desplaza al</text>
<text class="sv-t2" style="font-size:12px" x="98" y="203.3" text-anchor="middle">Sur Global: 2 de cada 3 muertes</text>
<rect class="sv-box-blue" x="200" y="148" width="172" height="74" rx="2"/>
<text class="sv-tb" x="286" y="165.8" text-anchor="middle">Freno histórico: el</text>
<text class="sv-tb" x="286" y="180.8" text-anchor="middle">movimiento obrero</text>
<text class="sv-t2" style="font-size:12px" x="286" y="195.8" text-anchor="middle">Leyes de Fábrica, 8 horas,</text>
<text class="sv-t2" style="font-size:12px" x="286" y="210.8" text-anchor="middle">LPRL 1995</text>
<rect class="sv-box-gold" x="388" y="148" width="172" height="74" rx="2"/>
<text class="sv-tg" x="474" y="165.8" text-anchor="middle">Mutuas e</text>
<text class="sv-tg" x="474" y="180.8" text-anchor="middle">infrarregistro</text>
<text class="sv-t2" style="font-size:12px" x="474" y="195.8" text-anchor="middle">8.000-8.500 muertes por</text>
<text class="sv-t2" style="font-size:12px" x="474" y="210.8" text-anchor="middle">enfermedad (amianto)</text>
<rect class="sv-box-gold" x="576" y="148" width="172" height="74" rx="2"/>
<text class="sv-tg" x="662" y="165.8" text-anchor="middle">Reformas laborales y</text>
<text class="sv-tg" x="662" y="180.8" text-anchor="middle">de la jubilación</text>
<text class="sv-t2" style="font-size:12px" x="662" y="195.8" text-anchor="middle">del Gobierno progresista:</text>
<text class="sv-t2" style="font-size:12px" x="662" y="210.8" text-anchor="middle">«criminal»</text>
<line class="sv-line-dash" x1="98" y1="148" x2="98" y2="106" marker-end="url(#nc-n2a4-arrow)"/>
<text class="sv-t3" x="104" y="131">desplaza</text>
<line class="sv-line-dash" x1="286" y1="148" x2="286" y2="106" marker-end="url(#nc-n2a4-arrow)"/>
<text class="sv-t3" x="292" y="131">limita</text>
<line class="sv-line-dash" x1="474" y1="148" x2="474" y2="106" marker-end="url(#nc-n2a4-arrow)"/>
<text class="sv-t3" x="480" y="131">ocultan</text>
<line class="sv-line-red" x1="662" y1="148" x2="662" y2="106" marker-end="url(#nc-n2a4-arrow)"/>
<text class="sv-t3" x="668" y="131">agravan</text>
<rect class="sv-box-blue" x="12" y="238" width="736" height="44" rx="2"/>
<text class="sv-tb" x="380" y="255.8" text-anchor="middle">Serie histórica en el Estado español: minería y pesca, amianto y grisú</text>
<text class="sv-t2" style="font-size:12px" x="380" y="270.8" text-anchor="middle">más de 2.000 muertes al año en los 80 y 90 → menos de 500 tras la crisis → unas 800 tras las reformas laborales</text>
<rect class="sv-box-red" x="12" y="306" width="736" height="58" rx="2"/>
<text class="sv-tr" x="380" y="323.3" text-anchor="middle">Respuesta: denuncia sistemática, memoria de cada víctima, prensa obrera,</text>
<text class="sv-tr" x="380" y="338.3" text-anchor="middle">socialismo como control consciente de la producción</text>
<text class="sv-t2" style="font-size:12px" x="380" y="353.3" text-anchor="middle">señalar a cada responsable; reducir ritmos y jornadas, acortar la vida laboral, extender seguridad e higiene</text>
<line class="sv-line" x1="380" y1="282" x2="380" y2="306" marker-end="url(#nc-n2a4-arrow)"/>
<text class="sv-t3" x="12" y="384">Leyenda: flecha continua = cadena causal · discontinua = factor que la desplaza, limita u oculta · roja = la agrava</text>
</svg>
