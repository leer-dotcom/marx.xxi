<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" role="img" aria-label="Tesis del militarismo estructural, historia de las posiciones marxistas ante la guerra, el presente de crisis y rearme, y matriz de las posiciones actuales de la izquierda, todas ellas refutadas por el carácter estructural del militarismo, frente a las cinco tareas comunistas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n1a2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="16" width="752" height="88" rx="2"/>
<text class="sv-t3" x="10" y="27">EL POLVORÍN NO TIENE AFUERA</text>
<rect class="sv-box" x="12" y="38" width="236" height="58" rx="2"/>
<text class="sv-t" x="130" y="55.3" text-anchor="middle">El polvorín no tiene afuera</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="70.3" text-anchor="middle">quien renuncie a la carrera por</text>
<text class="sv-t2" style="font-size:12.5px" x="130" y="85.3" text-anchor="middle">la hegemonía es subalterno</text>
<rect class="sv-box" x="262" y="38" width="236" height="58" rx="2"/>
<text class="sv-t" x="380" y="55.3" text-anchor="middle">Hegemonía: tres instancias</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="70.3" text-anchor="middle">productiva, financiera y militar;</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="85.3" text-anchor="middle">la militar es la última en perderse</text>
<rect class="sv-box" x="512" y="38" width="236" height="58" rx="2"/>
<text class="sv-t" style="font-size:12.8px" x="630" y="55.3" text-anchor="middle">Guerras progresistas / reaccionarias</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="70.3" text-anchor="middle">tareas distintas según el carácter</text>
<text class="sv-t2" style="font-size:12.5px" x="630" y="85.3" text-anchor="middle">de la guerra y el escenario global</text>
<rect class="sv-soft" x="4" y="110" width="752" height="160" rx="2"/>
<text class="sv-t3" x="10" y="121">HISTORIA DE LAS POSICIONES ANTE LA GUERRA</text>
<rect class="sv-box" x="12" y="132" width="172" height="58" rx="2"/>
<text class="sv-t" x="98" y="149.3" text-anchor="middle">Marx y Engels 1848-1871</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="164.3" text-anchor="middle">guerras civiles; la Comuna</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="179.3" text-anchor="middle">y el militarismo (Engels)</text>
<rect class="sv-box" x="200" y="132" width="172" height="58" rx="2"/>
<text class="sv-t" style="font-size:13px" x="286" y="149.3" text-anchor="middle">II Internacional 1889-1914</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="164.3" text-anchor="middle">capitalismo → militarismo;</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="179.3" text-anchor="middle">pacifismo vs. derrotismo</text>
<rect class="sv-box" x="388" y="132" width="172" height="58" rx="2"/>
<text class="sv-t" x="474" y="149.3" text-anchor="middle">Komintern y guerra fría</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="164.3" text-anchor="middle">derrotismo abandonado:</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="179.3" text-anchor="middle">defensa de la URSS, frentes</text>
<rect class="sv-box" x="576" y="132" width="172" height="58" rx="2"/>
<text class="sv-t" style="font-size:13.5px" x="662" y="149.3" text-anchor="middle">Mundo unipolar 1991-2008</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="164.3" text-anchor="middle">comunistas disueltos en</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="179.3" text-anchor="middle">la izquierda pacifista</text>
<rect class="sv-box-blue" x="12" y="204" width="360" height="58" rx="2"/>
<text class="sv-tb" x="192" y="221.3" text-anchor="middle">Derrotismo revolucionario (Lenin)</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="236.3" text-anchor="middle">las armas contra el propio gobierno;</text>
<text class="sv-t2" style="font-size:12.5px" x="192" y="251.3" text-anchor="middle">sólo posible cuando el poder está sobre la mesa</text>
<rect class="sv-box-gold" x="388" y="204" width="360" height="58" rx="2"/>
<text class="sv-tg" style="font-size:13px" x="568" y="221.3" text-anchor="middle">Frentes únicos antimperialistas (colonias)</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="236.3" text-anchor="middle">subordinación a burguesías nacionales:</text>
<text class="sv-t2" style="font-size:12.5px" x="568" y="251.3" text-anchor="middle">aniquilamiento o subalternidad</text>
<line class="sv-line" x1="184" y1="161" x2="200" y2="161" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="372" y1="161" x2="388" y2="161" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="560" y1="161" x2="576" y2="161" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line-dash" x1="286" y1="190" x2="286" y2="204"/>
<line class="sv-line-dash" x1="474" y1="190" x2="474" y2="204"/>
<rect class="sv-soft" x="4" y="276" width="752" height="88" rx="2"/>
<text class="sv-t3" x="10" y="287">HOY: NUEVA ERA DE CRISIS Y GUERRAS</text>
<rect class="sv-box" x="12" y="298" width="548" height="58" rx="2"/>
<text class="sv-t" x="286" y="315.3" text-anchor="middle">Fin del mundo unipolar y economía de guerra</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="330.3" text-anchor="middle">crisis de 2007, guerras por delegación, China y BRICS; ReArm Europe,</text>
<text class="sv-t2" style="font-size:12.5px" x="286" y="345.3" text-anchor="middle">5 % del PIB en gasto militar; Trump: «paz a través de la fuerza»</text>
<rect class="sv-box-ink" x="576" y="298" width="172" height="58" rx="2"/>
<text class="sv-tw" x="662" y="315.3" text-anchor="middle">Militarismo = condición</text>
<text class="sv-tw" x="662" y="330.3" text-anchor="middle">estructural del Estado</text>
<text class="sv-tw" x="662" y="345.3" text-anchor="middle" style="font-weight:400;font-size:12.5px">no una cuestión de voluntad</text>
<rect class="sv-soft" x="4" y="370" width="752" height="202" rx="2"/>
<text class="sv-t3" x="10" y="381">POSICIONES ACTUALES DE LA IZQUIERDA</text>
<rect class="sv-box-gold" x="12" y="412" width="172" height="58" rx="2"/>
<text class="sv-tg" x="98" y="429.3" text-anchor="middle">Socialchovinismo liberal</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="444.3" text-anchor="middle">PSOE: rearme «en interés</text>
<text class="sv-t2" style="font-size:12.5px" x="98" y="459.3" text-anchor="middle">de España»</text>
<rect class="sv-box-gold" x="200" y="412" width="172" height="58" rx="2"/>
<text class="sv-tg" x="286" y="429.3" text-anchor="middle">Socialchovinismo</text>
<text class="sv-tg" x="286" y="444.3" text-anchor="middle">espontaneísta</text>
<text class="sv-t2" style="font-size:12px" x="286" y="459.3" text-anchor="middle">morenismo: «pueblo en armas»</text>
<rect class="sv-box-gold" x="388" y="412" width="172" height="58" rx="2"/>
<text class="sv-tg" x="474" y="429.3" text-anchor="middle">Pacifismo abstracto</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="444.3" text-anchor="middle">Podemos, IU: capitalismo</text>
<text class="sv-t2" style="font-size:12.5px" x="474" y="459.3" text-anchor="middle">sin guerras</text>
<rect class="sv-box-gold" x="576" y="412" width="172" height="58" rx="2"/>
<text class="sv-tg" x="662" y="429.3" text-anchor="middle">Pacifismo multipolar</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="444.3" text-anchor="middle">campismo pro-China:</text>
<text class="sv-t2" style="font-size:12.5px" x="662" y="459.3" text-anchor="middle">ultraimperialismo kautskiano</text>
<rect class="sv-box-red" x="12" y="506" width="736" height="58" rx="2"/>
<text class="sv-tr" x="380" y="523.3" text-anchor="middle">Derrotismo e independencia de clase: cinco tareas — «el enemigo principal está en casa»</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="538.3" text-anchor="middle">propaganda belicismo-capitalismo · programa actualizado (milicia popular) · crítica del campismo</text>
<text class="sv-t2" style="font-size:12.5px" x="380" y="553.3" text-anchor="middle">y del soberanismo · independencia de clase · respuesta internacional</text>
<line class="sv-line" x1="662" y1="356" x2="662" y2="396"/>
<line class="sv-line" x1="98" y1="396" x2="662" y2="396"/>
<line class="sv-line" x1="98" y1="396" x2="98" y2="412" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="286" y1="396" x2="286" y2="412" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="474" y1="396" x2="474" y2="412" marker-end="url(#nc-n1a2-arrow)"/>
<line class="sv-line" x1="662" y1="396" x2="662" y2="412" marker-end="url(#nc-n1a2-arrow)"/>
<text class="sv-t3" x="650" y="391" text-anchor="end">explica el fracaso de las cuatro posiciones</text>
<path class="sv-line-dash" d="M98 470 V490 H380 V506" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M286 470 V490 H380 V506" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M474 470 V490 H380 V506" marker-end="url(#nc-n1a2-arrow)"/>
<path class="sv-line-dash" d="M662 470 V490 H380 V506" marker-end="url(#nc-n1a2-arrow)"/>
<text class="sv-t3" x="380" y="486" text-anchor="middle">frente a todas ellas</text>
<line class="sv-line" x1="12" y1="586" x2="40" y2="586"/>
<text class="sv-t3" x="46" y="590">sucesión histórica / explicación</text>
<line class="sv-line-dash" x1="260" y1="586" x2="288" y2="586"/>
<text class="sv-t3" x="294" y="590">aclaración o posición a la que se opone</text>
</svg>
