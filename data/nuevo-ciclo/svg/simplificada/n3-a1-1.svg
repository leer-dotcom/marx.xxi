<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El Estado dual trumpista: marco teórico (capitalista colectivo ideal, Estado de excepción), Estado normativo y Estado prerrogativo bajo un mismo techo, el bloque que lo sostiene, el límite de clase, la comparación con el caso nazi y los escenarios de fascistización." viewBox="0 0 760 556" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n3a1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="12" y="12" width="736" height="56" rx="2"/>
<text class="sv-t3" x="380" y="27" text-anchor="middle">marco · teoría del estado capitalista</text>
<text class="sv-t2" style="font-size:12px" x="380" y="44" text-anchor="middle">Estado = «capitalista colectivo ideal» (Engels) · Estado de Derecho de posguerra = excepción «probablemente irrepetible»</text>
<text class="sv-t2" style="font-size:12px" x="380" y="59" text-anchor="middle">Estado de excepción (Poulantzas) = suspensión permanente del Estado de Derecho en crisis orgánica</text>
<rect class="sv-box-ink" x="12" y="82" width="736" height="48" rx="2"/>
<text class="sv-tw" x="380" y="103" text-anchor="middle">Estado dual trumpista (Fraenkel): Estado de excepción de facto sin partido-milicia</text>
<text class="sv-tw" style="font-size:12px;font-weight:400" x="380" y="120" text-anchor="middle">objetivo: frenar el declive hegemónico frente a China · dualidad prefigurada en el Estado liberal</text>
<rect class="sv-box-blue" x="12" y="156" width="360" height="62" rx="2"/>
<text class="sv-tb" x="192" y="176" text-anchor="middle">Estado normativo</text>
<text class="sv-t2" style="font-size:12px" x="192" y="192" text-anchor="middle">derecho privado, contratos, política económica, Fed: intocado</text>
<text class="sv-t2" style="font-size:12px" x="192" y="206" text-anchor="middle">garantiza la previsibilidad de los beneficios</text>
<rect class="sv-box-red" x="388" y="156" width="360" height="62" rx="2"/>
<text class="sv-tr" x="568" y="176" text-anchor="middle">Estado prerrogativo</text>
<text class="sv-t2" style="font-size:12px" x="568" y="192" text-anchor="middle">ICE, deportaciones, ejecutivo unitario, Anexo F,</text>
<text class="sv-t2" style="font-size:12px" x="568" y="206" text-anchor="middle">persecución de la izquierda, guerra sin Senado</text>
<rect class="sv-box" x="12" y="252" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="272" text-anchor="middle">Bloque reaccionario</text>
<text class="sv-t2" style="font-size:12px" x="192" y="288" text-anchor="middle">gran capital fósil y tecnológico · MAGA y milicias · GOP ·</text>
<text class="sv-t2" style="font-size:12px" x="192" y="302" text-anchor="middle">aparato cultural: «compromiso autoritario» (Paxton)</text>
<rect class="sv-box-gold" x="388" y="252" width="360" height="62" rx="2"/>
<text class="sv-tg" x="568" y="272" text-anchor="middle">Límite de clase</text>
<text class="sv-t2" style="font-size:12px" x="568" y="288" text-anchor="middle">el gran capital frena la absorción de funciones (Fed,</text>
<text class="sv-t2" style="font-size:12px" x="568" y="302" text-anchor="middle">deportaciones suspendidas): el Estado sigue siendo dual</text>
<text class="sv-t3" x="380" y="338" text-anchor="middle">comparación · quién ocupa el estado prerrogativo</text>
<rect class="sv-box" x="12" y="346" width="360" height="62" rx="2"/>
<text class="sv-t" x="192" y="366" text-anchor="middle">Caso nazi: el partido-milicia conquista el Estado</text>
<text class="sv-t2" style="font-size:12px" x="192" y="382" text-anchor="middle">amenaza revolucionaria + Estado débil; la burguesía «invita»</text>
<text class="sv-t2" style="font-size:12px" x="192" y="396" text-anchor="middle">el partido (Gestapo, SS, SA) asume el Estado prerrogativo</text>
<rect class="sv-box" x="388" y="346" width="360" height="62" rx="2"/>
<text class="sv-t" x="568" y="366" text-anchor="middle">Caso trumpista: el Estado integra al movimiento</text>
<text class="sv-t2" style="font-size:12px" x="568" y="382" text-anchor="middle">ni amenaza revolucionaria ni Estado débil: dual, no (todavía) fascista</text>
<text class="sv-t2" style="font-size:12px" x="568" y="396" text-anchor="middle">el ICE es para la base MAGA lo que las SS para la base nazi</text>
<rect class="sv-box-gold" x="12" y="444" width="736" height="62" rx="2"/>
<text class="sv-tg" x="380" y="465" text-anchor="middle">Escenarios de fascistización: posible «conquista» del Estado</text>
<text class="sv-t2" style="font-size:12px" x="380" y="481" text-anchor="middle">conflicto federal-estados · guerra · Insurrection Act · midterms 2026 con el ICE · fascistización de MAGA y del GOP</text>
<text class="sv-t2" style="font-size:12px" x="380" y="495" text-anchor="middle">«dictadura de la burguesía como último recurso» (Thalheimer) → urge una línea comunista contra la reacción y el fascismo</text>
<path class="sv-line" d="M380 130 V143 H192 V156" marker-end="url(#nc-n3a1-arrow)"/>
<path class="sv-line" d="M380 130 V143 H568 V156" marker-end="url(#nc-n3a1-arrow)"/>
<path class="sv-line" d="M192 252 V235 H568 V218" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="380" y="231" text-anchor="middle">alimenta</text>
<line class="sv-line-dash" x1="568" y1="252" x2="568" y2="218" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="596" y="231" text-anchor="middle">frena</text>
<path class="sv-line-dash" d="M568 408 V426 H380 V444" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t3" x="470" y="422" text-anchor="middle">pueden precipitar</text>
<rect class="sv-soft" x="12" y="518" width="736" height="28" rx="2"/>
<text class="sv-t3" x="28" y="536">leyenda</text>
<line class="sv-line" x1="100" y1="532" x2="140" y2="532" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t2" style="font-size:12px" x="148" y="536">despliegue / apoyo (lo que ya ocurre)</text>
<line class="sv-line-dash" x1="400" y1="532" x2="440" y2="532" marker-end="url(#nc-n3a1-arrow)"/>
<text class="sv-t2" style="font-size:12px" x="448" y="536">freno o evolución posible (contratendencia)</text>
</svg>
