<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos brazos del control social, coacción y consenso, que parten del Estado en crisis y la población sobrante, confluyen en la delincuencia como mercancía y motor de control (Marx), y debajo la respuesta comunista que el artículo propone como hipótesis." viewBox="0 0 760 484" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="nc-n4a2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" x="4" y="90" width="512" height="180" rx="2"/>
<rect class="sv-soft" x="522" y="90" width="234" height="180" rx="2"/>
<rect class="sv-soft" x="4" y="356" width="752" height="100" rx="2"/>
<rect class="sv-box-ink" x="110" y="14" width="540" height="48" rx="2"/>
<text class="sv-tw" x="380" y="32" text-anchor="middle">Estado capitalista en crisis → población sobrante</text>
<text class="sv-tw" x="380" y="49" text-anchor="middle" style="font-size:12px;font-weight:400">población que el mercado no absorbe; fin del pacto social: la coacción pasa al primer plano</text>
<rect class="sv-box-red" x="12" y="112" width="244" height="68" rx="2"/>
<text class="sv-tr" x="134" y="130" text-anchor="middle">Populismo punitivo</text>
<text class="sv-t2" x="134" y="146" text-anchor="middle" style="font-size:12px">criminalizar pobreza y protesta en lugar</text>
<text class="sv-t2" x="134" y="160" text-anchor="middle" style="font-size:12px">de integrar; el partido del orden, de la</text>
<text class="sv-t2" x="134" y="174" text-anchor="middle" style="font-size:12px">ultraderecha a la socialdemocracia</text>
<rect class="sv-box-red" x="268" y="112" width="244" height="68" rx="2"/>
<text class="sv-tr" x="390" y="130" text-anchor="middle">Securitización del conflicto social</text>
<text class="sv-t2" x="390" y="146" text-anchor="middle" style="font-size:12px">los problemas sociales se reinterpretan</text>
<text class="sv-t2" x="390" y="160" text-anchor="middle" style="font-size:12px">como problemas de seguridad: okupación,</text>
<text class="sv-t2" x="390" y="174" text-anchor="middle" style="font-size:12px">CIE, protesta como amenaza, infiltración</text>
<rect class="sv-box-red" x="12" y="192" width="244" height="70" rx="2"/>
<text class="sv-tr" x="134" y="210" text-anchor="middle">Parapolicía: desokupadoras, fascistas</text>
<text class="sv-tr" x="134" y="225" text-anchor="middle">callejeros</text>
<text class="sv-t2" x="134" y="241" text-anchor="middle" style="font-size:12px">violencia externalizada y mercantilizada;</text>
<text class="sv-t2" x="134" y="255" text-anchor="middle" style="font-size:12px">el Estado se presenta como salvación</text>
<rect class="sv-box-red" x="268" y="192" width="244" height="70" rx="2"/>
<text class="sv-tr" x="390" y="212" text-anchor="middle">El migrante como enemigo interior</text>
<text class="sv-t2" x="390" y="229" text-anchor="middle" style="font-size:12px">mano de obra necesaria, no integrable;</text>
<text class="sv-t2" x="390" y="243" text-anchor="middle" style="font-size:12px">«invasor»: categorías de guerra; los datos</text>
<text class="sv-t2" x="390" y="257" text-anchor="middle" style="font-size:12px">lo desmienten: más miseria, más delincuencia</text>
<rect class="sv-box-blue" x="530" y="112" width="218" height="150" rx="2"/>
<text class="sv-tb" x="639" y="160" text-anchor="middle">Trabajo social, RMI, escuela</text>
<text class="sv-tb" x="639" y="175" text-anchor="middle">como gestión del riesgo</text>
<text class="sv-t2" x="639" y="192" text-anchor="middle" style="font-size:12px">de principios universalistas a lógicas</text>
<text class="sv-t2" x="639" y="206" text-anchor="middle" style="font-size:12px">moralizantes: quién «merece» la ayuda;</text>
<text class="sv-t2" x="639" y="220" text-anchor="middle" style="font-size:12px">policialización del trabajo social,</text>
<text class="sv-t2" x="639" y="234" text-anchor="middle" style="font-size:12px">trabajosocialización de la policía</text>
<text class="sv-t3" x="12" y="102">COACCIÓN</text>
<text class="sv-t3" x="530" y="102">CONSENSO</text>
<path class="sv-line" d="M380 62 V76 H130 V112" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M380 62 V76 H390 V112" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M380 62 V76 H639 V112" marker-end="url(#nc-n4a2-arrow)"/>
<line class="sv-line" x1="130" y1="180" x2="130" y2="192" marker-end="url(#nc-n4a2-arrow)"/>
<line class="sv-line" x1="390" y1="180" x2="390" y2="192" marker-end="url(#nc-n4a2-arrow)"/>
<rect class="sv-box" x="12" y="292" width="736" height="48" rx="2"/>
<text class="sv-t" x="380" y="310" text-anchor="middle">Delincuencia como mercancía y motor de control: funcional al orden burgués (Marx, Elogio del crimen)</text>
<text class="sv-t2" x="380" y="327" text-anchor="middle" style="font-size:12px">produce derecho penal, policía, cárceles, muros, cámaras y titulares: «el delincuente transforma el miedo en motor económico»</text>
<path class="sv-line" d="M130 262 V276 H250 V292" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M390 262 V276 H250 V292" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line" d="M639 262 V276 H520 V292" marker-end="url(#nc-n4a2-arrow)"/>
<text class="sv-t3" x="12" y="368">RESPUESTA COMUNISTA (HIPÓTESIS)</text>
<rect class="sv-box-green" x="12" y="378" width="236" height="70" rx="2"/>
<text class="sv-tgr" x="130" y="396" text-anchor="middle">Organización en barrios y</text>
<text class="sv-tgr" x="130" y="411" text-anchor="middle">centros de trabajo</text>
<text class="sv-t2" x="130" y="427" text-anchor="middle" style="font-size:12px">el debate: paro, vivienda, acoso policial;</text>
<text class="sv-t2" x="130" y="441" text-anchor="middle" style="font-size:12px">«las cárceles están llenas de pobres»</text>
<rect class="sv-box-green" x="256" y="378" width="236" height="70" rx="2"/>
<text class="sv-tgr" x="374" y="396" text-anchor="middle">Unidad con el</text>
<text class="sv-tgr" x="374" y="411" text-anchor="middle">proletariado migrante</text>
<text class="sv-t2" x="374" y="427" text-anchor="middle" style="font-size:12px">parte indisociable del proletariado</text>
<text class="sv-t2" x="374" y="441" text-anchor="middle" style="font-size:12px">revolucionario; luchas en sectores migrantes</text>
<rect class="sv-box-green" x="500" y="378" width="248" height="70" rx="2"/>
<text class="sv-tgr" x="624" y="396" text-anchor="middle">Gimnasios populares, gradas,</text>
<text class="sv-tgr" x="624" y="411" text-anchor="middle">autodefensa → nueva normatividad</text>
<text class="sv-t2" x="624" y="427" text-anchor="middle" style="font-size:12px">socialización y politización; expropiar a</text>
<text class="sv-t2" x="624" y="441" text-anchor="middle" style="font-size:12px">los ricos, no robar entre vecinos</text>
<path class="sv-line-red" d="M380 340 V360 H242 V378" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line-red" d="M380 340 V360 H374 V378" marker-end="url(#nc-n4a2-arrow)"/>
<path class="sv-line-red" d="M380 340 V360 H624 V378" marker-end="url(#nc-n4a2-arrow)"/>
<text class="sv-t3" x="12" y="474">FLECHA GRIS: CADENA DEL CONTROL SOCIAL · FLECHA DE COLOR: RESPUESTA QUE EL ARTÍCULO PROPONE FRENTE A ELLA</text>
</svg>
