<svg xmlns="http://www.w3.org/2000/svg" aria-label="Dos columnas con línea temporal central: a la izquierda la secuencia histórica de Zetkin a Lenin (1896-1921), a la derecha la secuencia actual desde el economicismo y la incorporación al salario hasta la necesidad del frente; ambas convergen en el nodo central frente socialista de mujeres como forma transitoria para construir el Partido, flanqueado por los dos errores a evitar y seguido de la fila de sus funciones" role="img" viewBox="0 0 760 512">
<defs><marker id="m3-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="30">HISTORIA · 1896–1921</text>
<text class="sv-t3" text-anchor="end" x="748" y="30">ACTUALIDAD</text>
<path class="sv-line-dash" d="M380 46 V346"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="80">1896</text>
<text class="sv-t3" text-anchor="middle" x="380" y="142">1907–1910</text>
<text class="sv-t3" text-anchor="middle" x="380" y="204">1920</text>
<text class="sv-t3" text-anchor="middle" x="380" y="266">1921</text>
<text class="sv-t3" text-anchor="middle" x="380" y="328">Lenin</text>
<rect class="sv-box-blue" height="52" rx="2" width="235" x="12" y="50"></rect>
<text class="sv-t" text-anchor="middle" x="129" y="71" style="font-size:13.2px;letter-spacing:0">Zetkin: «cuestión femenina moderna»</text>
<text class="sv-t2" text-anchor="middle" x="129" y="88">lucha de clase; voto como instrumento</text>
<path class="sv-line" d="M129 102 V110" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="52" rx="2" width="235" x="12" y="112"></rect>
<text class="sv-t" text-anchor="middle" x="129" y="133">Conferencias de 1907 y 1910</text>
<text class="sv-t2" text-anchor="middle" x="129" y="150">oficina internacional, Die Gleichheit</text>
<path class="sv-line" d="M129 164 V172" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="52" rx="2" width="235" x="12" y="174"></rect>
<text class="sv-t" text-anchor="middle" x="129" y="195">Principio-guía y Directrices</text>
<text class="sv-t2" text-anchor="middle" x="129" y="212">agitación socialista, no feminista</text>
<path class="sv-line" d="M129 226 V234" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="52" rx="2" width="235" x="12" y="236"></rect>
<text class="sv-t" text-anchor="middle" x="129" y="257">III Congreso de la Comintern</text>
<text class="sv-t2" text-anchor="middle" x="129" y="274" style="font-size:12.8px;letter-spacing:0">tesis para la propaganda entre las mujeres</text>
<path class="sv-line" d="M129 288 V296" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="52" rx="2" width="235" x="12" y="298"></rect>
<text class="sv-t" text-anchor="middle" x="129" y="319">Lenin: organismos específicos</text>
<text class="sv-t2" text-anchor="middle" x="129" y="336">del partido, no organizaciones separadas</text>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="50"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="71" style="font-size:13.7px;letter-spacing:0">Economicismo + salarización masiva</text>
<text class="sv-t2" text-anchor="middle" x="630" y="88">años 60-70: condiciones del feminismo</text>
<path class="sv-line" d="M630 102 V110" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="112"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="133">Feminismo hegemónico</text>
<text class="sv-t2" text-anchor="middle" x="630" y="150" style="font-size:12.8px;letter-spacing:0">moviliza, pero sin programa emancipador</text>
<path class="sv-line" d="M630 164 V172" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="174"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="195">Sujetos devaluados, miseria moral</text>
<text class="sv-t2" text-anchor="middle" x="630" y="212">identidades interclasistas → reformismo</text>
<path class="sv-line" d="M630 226 V234" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="236"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="257">Ofensiva burguesa actual</text>
<text class="sv-t2" text-anchor="middle" x="630" y="274">precariedad, cuidados, violencia</text>
<path class="sv-line" d="M129 350 V364 H300 V374" marker-end="url(#m3-4-arrow)"></path>
<path class="sv-line" d="M630 288 V364 H460 V374" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-ink" height="56" rx="2" width="410" x="175" y="376"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="399">Frente socialista de mujeres</text>
<text class="sv-tw" text-anchor="middle" x="380" y="417">forma transitoria para construir el Partido Comunista</text>
<rect class="sv-box-red" height="56" rx="2" width="150" x="12" y="376"></rect>
<text class="sv-tr" text-anchor="middle" x="87" y="396">Error: identitarismo</text>
<text class="sv-t2" text-anchor="middle" x="87" y="412" style="font-size:11.4px;letter-spacing:0">«oprimido = revolucionario»</text>
<rect class="sv-box-red" height="56" rx="2" width="150" x="598" y="376"></rect>
<text class="sv-tr" text-anchor="middle" x="673" y="396" style="font-size:11.7px;letter-spacing:0">Error: falso universalismo</text>
<text class="sv-t2" text-anchor="middle" x="673" y="412">economicista</text>
<path class="sv-line" d="M380 432 V444 M82 444 H674 M82 444 V454 M230 444 V454 M378 444 V454 M526 444 V454 M674 444 V454"></path>
<rect class="sv-box-green" height="48" rx="2" width="140" x="12" y="456"></rect>
<text class="sv-t2" text-anchor="middle" x="82" y="476">Desmontar la identidad</text>
<text class="sv-t2" text-anchor="middle" x="82" y="491">interclasista «mujer»</text>
<rect class="sv-box-green" height="48" rx="2" width="140" x="160" y="456"></rect>
<text class="sv-t2" text-anchor="middle" x="230" y="476">Romper con el</text>
<text class="sv-t2" text-anchor="middle" x="230" y="491">programa reformista</text>
<rect class="sv-box-green" height="48" rx="2" width="140" x="308" y="456"></rect>
<text class="sv-t2" text-anchor="middle" x="378" y="476">Difundir conciencia</text>
<text class="sv-t2" text-anchor="middle" x="378" y="491">socialista</text>
<rect class="sv-box-green" height="48" rx="2" width="140" x="456" y="456"></rect>
<text class="sv-t2" text-anchor="middle" x="526" y="476">Neutralizar la</text>
<text class="sv-t2" text-anchor="middle" x="526" y="491">función de la opresión</text>
<rect class="sv-box-green" height="48" rx="2" width="140" x="604" y="456"></rect>
<text class="sv-t2" text-anchor="middle" x="674" y="476">Educar en ética</text>
<text class="sv-t2" text-anchor="middle" x="674" y="491">comunista</text>
</svg>
