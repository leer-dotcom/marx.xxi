<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición en dos columnas entre el republicanismo y la crítica marxiana de la economía política, en seis filas: salario, tipo de dominio, diagnóstico, papel del Estado, remedio y concepto de libertad" role="img" viewBox="0 0 760 480">
<defs><marker id="m2-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-red" height="44" rx="2" width="275" x="175" y="18"></rect><text class="sv-tr" text-anchor="middle" x="312" y="36">Republicanismo</text><text class="sv-t3" text-anchor="middle" x="312" y="52">Kant · Domènech · Liria-Alegre · Polanyi</text>
<rect class="sv-box-blue" height="44" rx="2" width="275" x="465" y="18"></rect><text class="sv-tb" text-anchor="middle" x="602" y="36">Marx</text><text class="sv-t3" text-anchor="middle" x="602" y="52">crítica de la economía política</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="70"></rect><text class="sv-t" text-anchor="middle" x="90" y="102">El salario</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="70"></rect><text class="sv-t2" text-anchor="middle" x="312" y="94">Servicio que no se vende:</text><text class="sv-t2" text-anchor="middle" x="312" y="110">«esclavitud a tiempo parcial»</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="70"></rect><text class="sv-t2" text-anchor="middle" x="602" y="94">Venta real de fuerza de trabajo;</text><text class="sv-t2" text-anchor="middle" x="602" y="110">media una «esclavitud absoluta»</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="132"></rect><text class="sv-t" text-anchor="middle" x="90" y="156">Tipo de</text><text class="sv-t" text-anchor="middle" x="90" y="172">dominio</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="132"></rect><text class="sv-t2" text-anchor="middle" x="312" y="156">Personal y directo</text><text class="sv-t2" text-anchor="middle" x="312" y="172">(loi de famille, amo y siervo)</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="132"></rect><text class="sv-t2" text-anchor="middle" x="602" y="156">Impersonal: el capital como sujeto,</text><text class="sv-t2" text-anchor="middle" x="602" y="172">relación global de reproducción</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="194"></rect><text class="sv-t" text-anchor="middle" x="90" y="218">Diagnóstico del</text><text class="sv-t" text-anchor="middle" x="90" y="234">capitalismo</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="194"></rect><text class="sv-t2" text-anchor="middle" x="312" y="218">Ficción jurídica, «confusión»</text><text class="sv-t2" text-anchor="middle" x="312" y="234">interesada de la economía política</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="194"></rect><text class="sv-t2" text-anchor="middle" x="602" y="218">Forma social necesaria: la práctica,</text><text class="sv-t2" text-anchor="middle" x="602" y="234">no la intención, hace la mercancía</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="256"></rect><text class="sv-t" text-anchor="middle" x="90" y="280">Papel del</text><text class="sv-t" text-anchor="middle" x="90" y="296">Estado</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="256"></rect><text class="sv-t2" text-anchor="middle" x="312" y="280">Soberanía que decide</text><text class="sv-t2" text-anchor="middle" x="312" y="296">qué es y qué no es mercancía</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="256"></rect><text class="sv-t2" text-anchor="middle" x="602" y="280">Sometido a las leyes de la</text><text class="sv-t2" text-anchor="middle" x="602" y="296">reproducción social (Hegel)</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="318"></rect><text class="sv-t" text-anchor="middle" x="90" y="350">Remedio</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="318"></rect><text class="sv-t2" text-anchor="middle" x="312" y="342">Desmercantilizar tierra, dinero y</text><text class="sv-t2" text-anchor="middle" x="312" y="358">trabajo; renta básica</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="318"></rect><text class="sv-t2" text-anchor="middle" x="602" y="342">Abolir a la vez el trabajo asalariado</text><text class="sv-t2" text-anchor="middle" x="602" y="358">y la forma-mercancía</text>
<rect class="sv-soft" height="56" rx="2" width="140" x="20" y="380"></rect><text class="sv-t" text-anchor="middle" x="90" y="412">Libertad</text>
<rect class="sv-box" height="56" rx="2" width="275" x="175" y="380"></rect><text class="sv-t2" text-anchor="middle" x="312" y="404">Independencia civil</text><text class="sv-t2" text-anchor="middle" x="312" y="420">(sui iuris): un amo justo</text>
<rect class="sv-box" height="56" rx="2" width="275" x="465" y="380"></rect><text class="sv-t2" text-anchor="middle" x="602" y="404">«No tener ningún amo»:</text><text class="sv-t2" text-anchor="middle" x="602" y="420">libertad absoluta</text>
<line class="sv-line-red" marker-end="url(#m2-3-arrow)" x1="312" x2="590" y1="444" y2="444"></line>
<text class="sv-tr" text-anchor="middle" x="455" y="466">toda redistribución presupone una acumulación capitalista exitosa</text>
</svg>
