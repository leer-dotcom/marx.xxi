<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición entre la Esquerra Independentista con su Unitat Popular y el Movimiento Socialista en seis filas, y debajo el silogismo tachado opresión nacional, conciencia de clase, socialismo con sus tres refutaciones" role="img" viewBox="0 0 760 510">
<defs><marker id="m2-8-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-red" height="36" rx="2" width="280" x="150" y="18"></rect><text class="sv-tr" text-anchor="middle" x="290" y="34">Esquerra Independentista</text><text class="sv-t3" text-anchor="middle" x="290" y="48">Unitat Popular</text>
<rect class="sv-box-blue" height="36" rx="2" width="300" x="440" y="18"></rect><text class="sv-tb" text-anchor="middle" x="590" y="34">Movimiento Socialista</text><text class="sv-t3" text-anchor="middle" x="590" y="48">comunismo como totalidad</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="62"></rect><text class="sv-t" text-anchor="middle" x="80" y="88">Marco</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="62"></rect><text class="sv-t2" text-anchor="middle" x="290" y="81">tres ejes superpuestos:</text><text class="sv-t2" text-anchor="middle" x="290" y="96">nacional · social · género</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="62"></rect><text class="sv-t2" text-anchor="middle" x="590" y="81">totalidad: las opresiones son</text><text class="sv-t2" text-anchor="middle" x="590" y="96">encarnaciones del poder burgués</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="112"></rect><text class="sv-t" text-anchor="middle" x="80" y="138">Sujeto</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="112"></rect><text class="sv-t2" text-anchor="middle" x="290" y="131">«clases populares», nación,</text><text class="sv-t2" text-anchor="middle" x="290" y="146">movimiento ancho interclasista</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="112"></rect><text class="sv-t2" text-anchor="middle" x="590" y="131">proletariado como clase</text><text class="sv-t2" text-anchor="middle" x="590" y="146">políticamente independiente</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="162"></rect><text class="sv-t" text-anchor="middle" x="80" y="188">Horizonte</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="162"></rect><text class="sv-t2" text-anchor="middle" x="290" y="181">independencia → socialismo</text><text class="sv-t2" text-anchor="middle" x="290" y="196">(etapismo, nación personificada)</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="162"></rect><text class="sv-t2" text-anchor="middle" x="590" y="181">internacionalismo proletario:</text><text class="sv-t2" text-anchor="middle" x="590" y="196">la nacionalidad del trabajador: la del trabajo</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="212"></rect><text class="sv-t" text-anchor="middle" x="80" y="230">Relación con</text><text class="sv-t" text-anchor="middle" x="80" y="245">el Estado</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="212"></rect><text class="sv-t2" text-anchor="middle" x="290" y="231">naturalización, acción institucional,</text><text class="sv-t2" text-anchor="middle" x="290" y="246">municipalismo, investiduras</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="212"></rect><text class="sv-t2" text-anchor="middle" x="590" y="231">extinción del Estado;</text><text class="sv-t2" text-anchor="middle" x="590" y="246">poder independiente</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="262"></rect><text class="sv-t" text-anchor="middle" x="80" y="280">Toma del</text><text class="sv-t" text-anchor="middle" x="80" y="295">poder</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="262"></rect><text class="sv-t2" text-anchor="middle" x="290" y="281">desgaste defensivo a largo plazo,</text><text class="sv-t2" text-anchor="middle" x="290" y="296">ciclos electorales</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="262"></rect><text class="sv-t2" text-anchor="middle" x="590" y="281">construcción de organización comunista:</text><text class="sv-t2" text-anchor="middle" x="590" y="296">tesis, capacidades, encuadramiento</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="312"></rect><text class="sv-t" text-anchor="middle" x="80" y="338">Identidad</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="312"></rect><text class="sv-t2" text-anchor="middle" x="290" y="331">nacionalismo + obrerismo</text><text class="sv-t2" text-anchor="middle" x="290" y="346">(identidades a perpetuar)</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="312"></rect><text class="sv-t2" text-anchor="middle" x="590" y="331">la clase como relación a superar:</text><text class="sv-t2" text-anchor="middle" x="590" y="346">libre asociación</text>
<text class="sv-t3" x="20" y="388">EL SILOGISMO QUE SE DERRUMBA</text>
<rect class="sv-box" height="40" rx="2" width="170" x="60" y="396"></rect><text class="sv-t" text-anchor="middle" x="145" y="420">Opresión nacional</text>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="230" x2="295" y1="416" y2="416"></line>
<rect class="sv-box" height="40" rx="2" width="170" x="295" y="396"></rect><text class="sv-t" text-anchor="middle" x="380" y="420">Conciencia de clase</text>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="465" x2="530" y1="416" y2="416"></line>
<rect class="sv-box" height="40" rx="2" width="170" x="530" y="396"></rect><text class="sv-t" text-anchor="middle" x="615" y="420">Socialismo</text>
<line class="sv-line-red" x1="50" x2="710" y1="444" y2="388"></line>
<text class="sv-tr" text-anchor="middle" x="380" y="462">1 · la independencia crea un nuevo Estado burgués en competencia interestatal</text>
<text class="sv-tr" text-anchor="middle" x="380" y="479">2 · conciencia nacional ≠ conciencia de clase (el caso del País Valenciano)</text>
<text class="sv-tr" text-anchor="middle" x="380" y="496">3 · ninguna independencia histórica derivó en un Estado socialista</text>
</svg>
