<svg xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de bifurcación: de la crisis ecológica como crisis capitalista y orgánica se pasa a la proletarización de las clases medias y la sociedad en tercios, que se abre en tres salidas (escenario progresista, escenario conservador y recomposición del proletariado); esta última se despliega en una escalera de hegemonía socialista precedida por el candado de la independencia política, mientras un recuadro contrasta la hegemonía populista con la gramsciana" role="img" viewBox="0 0 760 480">
<defs><marker id="m3-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="48" rx="2" width="360" x="200" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="43">Crisis ecológica = crisis capitalista = crisis orgánica</text>
<path class="sv-line" d="M380 62 V78" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-gold" height="60" rx="2" width="420" x="170" y="80"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="103">Proletarización de las clases medias del centro</text>
<text class="sv-t2" text-anchor="middle" x="380" y="121">«sociedad en tercios»: patriciado rentista · en proletarización · excluidos</text>
<path class="sv-line" d="M380 140 V158 H122 V178" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 140 V178" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 158 H638 V178" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-red" height="66" rx="2" width="220" x="12" y="180"></rect>
<text class="sv-tr" text-anchor="middle" x="122" y="201">Escenario progresista</text>
<text class="sv-t2" text-anchor="middle" x="122" y="217">socialdemocracia verde, errejonismo:</text>
<text class="sv-t2" text-anchor="middle" x="122" y="232">clase media + restos de clase obrera</text>
<rect class="sv-box-red" height="66" rx="2" width="220" x="270" y="180"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="201">Escenario conservador</text>
<text class="sv-t2" text-anchor="middle" x="380" y="217">derecha radical: la clase media</text>
<text class="sv-t2" text-anchor="middle" x="380" y="232">contra el proletariado migrante</text>
<rect class="sv-box-green" height="66" rx="2" width="220" x="528" y="180"></rect>
<text class="sv-tgr" text-anchor="middle" x="638" y="201">Tercera opción</text>
<text class="sv-t2" text-anchor="middle" x="638" y="217">el proletariado se recompone como</text>
<text class="sv-t2" text-anchor="middle" x="638" y="232">sujeto y subordina a la clase media</text>
<text class="sv-t3" text-anchor="middle" x="246" y="270">ambos escenarios pueden aislar a la clase media y abrir la tercera opción</text>
<text class="sv-t3" x="12" y="296">DOS SENTIDOS DE HEGEMONÍA</text>
<rect class="sv-box-red" height="110" rx="2" width="165" x="12" y="304"></rect>
<text class="sv-tr" text-anchor="middle" x="94" y="326">Hegemonía populista</text>
<text class="sv-t2" text-anchor="middle" x="94" y="345" style="font-size:12.2px;letter-spacing:0">discurso, «sentidos comunes»</text>
<text class="sv-t2" text-anchor="middle" x="94" y="360">99 % contra 1 %</text>
<text class="sv-t2" text-anchor="middle" x="94" y="375">el Estado como instrumento</text>
<text class="sv-t2" text-anchor="middle" x="94" y="390">alianzas interclasistas</text>
<text class="sv-t3" text-anchor="middle" x="192" y="364">vs</text>
<rect class="sv-box-blue" height="110" rx="2" width="165" x="207" y="304"></rect>
<text class="sv-tb" text-anchor="middle" x="289" y="326">Hegemonía gramsciana</text>
<text class="sv-t2" text-anchor="middle" x="289" y="345">unidad de lo económico,</text>
<text class="sv-t2" text-anchor="middle" x="289" y="360">lo político y lo militar</text>
<text class="sv-t2" text-anchor="middle" x="289" y="375" style="font-size:12.8px;letter-spacing:0">bloque histórico: tres grados</text>
<text class="sv-t2" text-anchor="middle" x="289" y="390">de relación de fuerzas</text>
<path class="sv-line-red" d="M638 246 V290" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-ink" height="52" rx="2" width="348" x="400" y="292"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="313">Candado: independencia política primero</text>
<text class="sv-tw" text-anchor="middle" x="574" y="331">Movimiento Socialista → Partido → Estado Socialista</text>
<path class="sv-line" d="M454 344 V410" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="400" y="412"></rect>
<text class="sv-t" text-anchor="middle" x="454" y="430">1. Unificar</text>
<text class="sv-t2" text-anchor="middle" x="454" y="445">el tercio en</text>
<text class="sv-t2" text-anchor="middle" x="454" y="460">proletarización</text>
<path class="sv-line" d="M508 441 H518" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="520" y="382"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="400">2. Subordinar</text>
<text class="sv-t2" text-anchor="middle" x="574" y="415">sectores al</text>
<text class="sv-t2" text-anchor="middle" x="574" y="430" style="font-size:11.6px;letter-spacing:0">proyecto comunista</text>
<path class="sv-line" d="M628 411 H638" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="640" y="352"></rect>
<text class="sv-t" text-anchor="middle" x="694" y="370">3. Apoyos</text>
<text class="sv-t2" text-anchor="middle" x="694" y="385">tácticos, con</text>
<text class="sv-t2" text-anchor="middle" x="694" y="400" style="font-size:11.5px;letter-spacing:0">separación orgánica</text>
</svg>
