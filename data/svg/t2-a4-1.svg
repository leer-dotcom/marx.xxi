<svg xmlns="http://www.w3.org/2000/svg" aria-label="Cadena causal desde la acumulación originaria hasta el dominio impersonal y sus tendencias, junto a una matriz de dos por dos que clasifica los momentos keynesianos según su motor y su efecto sobre la dependencia proletaria" role="img" viewBox="0 0 760 440">
<defs><marker id="m2-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-red" height="44" rx="2" width="250" x="20" y="30"></rect><text class="sv-tr" text-anchor="middle" x="145" y="48">Acumulación originaria</text><text class="sv-t2" text-anchor="middle" x="145" y="64">separación productores / medios</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="145" x2="145" y1="74" y2="94"></line>
<rect class="sv-box" height="44" rx="2" width="250" x="20" y="96"></rect><text class="sv-t" text-anchor="middle" x="145" y="114">Trabajo privado e independiente</text><text class="sv-t2" text-anchor="middle" x="145" y="130">producción sin plan común</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="145" x2="145" y1="140" y2="160"></line>
<rect class="sv-box" height="44" rx="2" width="250" x="20" y="162"></rect><text class="sv-t" text-anchor="middle" x="145" y="180">Mercado central</text><text class="sv-t2" text-anchor="middle" x="145" y="196">«porque hay mercado, ponemos precio»</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="145" x2="145" y1="206" y2="226"></line>
<rect class="sv-box" height="44" rx="2" width="250" x="20" y="228"></rect><text class="sv-t" text-anchor="middle" x="145" y="246">Sistema de precios + competencia</text><text class="sv-t2" text-anchor="middle" x="145" y="262">por la plusvalía · por el salario</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="145" x2="145" y1="272" y2="292"></line>
<rect class="sv-box" height="44" rx="2" width="250" x="20" y="294"></rect><text class="sv-t" text-anchor="middle" x="145" y="312">Dominio impersonal</text><text class="sv-t2" text-anchor="middle" x="145" y="328">personificaciones del capital</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="145" x2="145" y1="338" y2="358"></line>
<rect class="sv-box-ink" height="44" rx="2" width="250" x="20" y="360"></rect><text class="sv-tw" text-anchor="middle" x="145" y="378">Tendencias</text><text class="sv-tw" text-anchor="middle" x="145" y="394">↓ ganancia · ↓ condiciones · paro</text>
<text class="sv-t3" text-anchor="middle" x="145" y="428">origen clasista del precio y de la competencia</text>
<text class="sv-t" text-anchor="middle" x="530" y="36">Dos tipos de «momento keynesiano»</text>
<text class="sv-t3" text-anchor="middle" x="500" y="66">reduce la dependencia</text>
<text class="sv-t3" text-anchor="middle" x="665" y="66">refuerza la dependencia</text>
<rect class="sv-soft" height="110" rx="2" width="90" x="320" y="80"></rect><text class="sv-t2" text-anchor="middle" x="365" y="128">motor:</text><text class="sv-t" text-anchor="middle" x="365" y="143">lucha obrera</text>
<rect class="sv-soft" height="110" rx="2" width="90" x="320" y="200"></rect><text class="sv-t2" text-anchor="middle" x="365" y="241">motor:</text><text class="sv-t" text-anchor="middle" x="365" y="256">inversión</text><text class="sv-t" text-anchor="middle" x="365" y="271">decadente</text>
<rect class="sv-box-green" height="110" rx="2" width="160" x="420" y="80"></rect><text class="sv-tgr" text-anchor="middle" x="500" y="126">Estado de bienestar</text><text class="sv-t2" text-anchor="middle" x="500" y="143">posguerra: servicios</text><text class="sv-t2" text-anchor="middle" x="500" y="158">arrancados por la lucha</text>
<rect class="sv-box" height="110" rx="2" width="150" x="590" y="80"></rect><text class="sv-t2" text-anchor="middle" x="665" y="140">—</text>
<rect class="sv-box" height="110" rx="2" width="160" x="420" y="200"></rect><text class="sv-t2" text-anchor="middle" x="500" y="260">—</text>
<rect class="sv-box-red" height="110" rx="2" width="150" x="590" y="200"></rect><text class="sv-tr" text-anchor="middle" x="665" y="236">Plan Roosevelt</text><text class="sv-tr" text-anchor="middle" x="665" y="253">post-2008</text><text class="sv-tr" text-anchor="middle" x="665" y="270">ERTEs y rescates 2022</text><text class="sv-t3" text-anchor="middle" x="665" y="290">ofensiva del capital</text>
<rect class="sv-box-gold" height="80" rx="2" width="420" x="320" y="330"></rect>
<text class="sv-tg" text-anchor="middle" x="530" y="352">Ideología keynesiana (hoy)</text>
<text class="sv-t2" text-anchor="middle" x="530" y="370">Estado como instrumento neutro · reparto justo</text>
<text class="sv-t2" text-anchor="middle" x="530" y="386">niega la competencia · culpa a «los ricos» de la inflación</text>
<text class="sv-t3" text-anchor="middle" x="530" y="402">igual que liberales y fascistas</text>
</svg>
