<svg xmlns="http://www.w3.org/2000/svg" aria-label="Mapa conceptual del volumen 1 con doce nodos: crítica de la economía política y totalidad, dialéctica hegeliana, crisis, ideología burguesa, fetichismo, comunismo, clase obrera organizada, salidas falsas, opresiones específicas y vida cotidiana, Estado y democracia, teoría y praxis, y derrota histórica y posmodernidad, unidos por aristas etiquetadas que indican en qué artículos se desarrolla cada relación." role="img" viewBox="0 0 760 450">
