<svg xmlns="http://www.w3.org/2000/svg" aria-label="Embudo de maduración y depuración de las tres Internacionales, con lo que cada una expulsó y la causa de su ocaso, y la nueva Internacional de los comunistas como tarea actual" role="img" viewBox="0 0 760 340">
<defs><marker id="m5-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="230" y="24">MADURACIÓN Y DEPURACIÓN DEL INTERNACIONALISMO</text>
<path class="sv-box" d="M20 40 L440 40 L400 108 L60 108 Z"></path>
<text class="sv-t" text-anchor="middle" x="230" y="66">I Internacional (AIT, 1864-1876)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="84">todas las corrientes: sindicatos, proudhonianos,</text>
<text class="sv-t2" text-anchor="middle" x="230" y="99">bakuninistas, marxistas</text>
<path class="sv-box-blue" d="M60 120 L400 120 L360 188 L100 188 Z"></path>
<text class="sv-tb" text-anchor="middle" x="230" y="146">II Internacional (1889-1914)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="164">sin anarquistas: partidos obreros</text>
<text class="sv-t2" text-anchor="middle" x="230" y="179">de masas con hegemonía marxista</text>
<path class="sv-box-red" d="M100 200 L360 200 L320 268 L140 268 Z"></path>
<text class="sv-tr" text-anchor="middle" x="230" y="226">III Internacional (1919-1943)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="244">solo comunistas: ruptura</text>
<text class="sv-t2" text-anchor="middle" x="230" y="259">con el oportunismo</text>
<text class="sv-t2" x="460" y="68">expulsa: proudhonianos y bakuninistas</text>
<text class="sv-t3" x="460" y="84">ocaso: no logra constituirse en partido</text>
<text class="sv-t2" x="460" y="148">expulsa: anarquistas (1891-1896)</text>
<text class="sv-t3" x="460" y="164">ocaso: brecha palabras-hechos (1914)</text>
<text class="sv-t2" x="460" y="228">excluye: reformistas y centristas</text>
<text class="sv-t3" x="460" y="244">ocaso: subordinación al Estado soviético</text>
<path class="sv-line-red" d="M230 268 L230 286" marker-end="url(#m5-5-arrow)"></path>
<rect class="sv-box-ink" height="44" rx="2" width="720" x="20" y="288"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="306">Hoy: una nueva Internacional de los comunistas</text>
<text class="sv-tw" text-anchor="middle" x="380" y="323">acuerdos programáticos · acción política internacional · partidos continentales · ni apologética ni adanismo</text>
</svg>
