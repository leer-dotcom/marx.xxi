<svg xmlns="http://www.w3.org/2000/svg" aria-label="Matriz de las tres posiciones socialistas ante la cuestión colonial —indiferentista, etapista o multipolarista e independencia política— con su tesis, su ejemplo histórico y su resultado" role="img" viewBox="0 0 760 320">
<rect class="sv-box" height="44" rx="2" width="220" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="41">Posición indiferentista</text>
<rect class="sv-box-gold" height="44" rx="2" width="220" x="270" y="14"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="34">Posición etapista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50">hoy: multipolarismo</text>
<rect class="sv-box-red" height="44" rx="2" width="220" x="520" y="14"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="41">Independencia política</text>
<rect class="sv-box" height="72" rx="2" width="220" x="20" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="130" y="103">la opresión nacional no pesa;</text>
<text class="sv-t2" text-anchor="middle" x="130" y="118">solo cuenta la lucha de clases «pura»</text>
<text class="sv-t2" text-anchor="middle" x="130" y="133">(economismo imperialista)</text>
<rect class="sv-box-gold" height="72" rx="2" width="220" x="270" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="380" y="103">primero la liberación nacional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="118">con la burguesía nacional,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="133">después el socialismo</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="630" y="103">fuerza proletaria propia;</text>
<text class="sv-t2" text-anchor="middle" x="630" y="118">alianzas parciales sin ceder</text>
<text class="sv-t2" text-anchor="middle" x="630" y="133">la dirección ni frentes permanentes</text>
<rect class="sv-box" height="72" rx="2" width="220" x="20" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="130" y="185">tratar Palestina como choque</text>
<text class="sv-t2" text-anchor="middle" x="130" y="200">entre Estados capitalistas</text>
<text class="sv-t2" text-anchor="middle" x="130" y="215">y no como lucha anticolonial</text>
<rect class="sv-box-gold" height="72" rx="2" width="220" x="270" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="380" y="185">frente único antimperialista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="200">(IV Congreso, 1922): Turquía,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="215">China, Irán 1979 (Tudeh)</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="630" y="185">tesis Lenin–Roy (1920);</text>
<text class="sv-t2" text-anchor="middle" x="630" y="200">China, Cuba y Vietnam triunfaron</text>
<text class="sv-t2" text-anchor="middle" x="630" y="215">contra el comunismo oficial</text>
<rect class="sv-box" height="56" rx="2" width="220" x="20" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="130" y="267">impotencia; alimenta</text>
<text class="sv-t" text-anchor="middle" x="130" y="282">a los socialimperialistas</text>
<rect class="sv-box-gold" height="56" rx="2" width="220" x="270" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="380" y="267">subordinación o aniquilamiento</text>
<text class="sv-t" text-anchor="middle" x="380" y="282">de los comunistas</text>
<rect class="sv-box-red" height="56" rx="2" width="220" x="520" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="630" y="267">enlaza anticolonialismo</text>
<text class="sv-t" text-anchor="middle" x="630" y="282">y socialismo</text>
<text class="sv-t3" text-anchor="middle" x="380" y="310">no identificar la crisis de la hegemonía de EE. UU. con la crisis del imperialismo</text>
</svg>
