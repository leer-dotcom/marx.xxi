<svg xmlns="http://www.w3.org/2000/svg" aria-label="Embudo de maduración y depuración de las tres Internacionales, con la base social, el legado, lo que cada una expulsó y la causa de su ocaso; debajo, los epígonos y el escenario actual, y la nueva Internacional de los comunistas con sus fundamentos y las lecciones de los orígenes" role="img" viewBox="0 0 760 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="230" y="24">MADURACIÓN Y DEPURACIÓN DEL INTERNACIONALISMO</text>
<text class="sv-t3" text-anchor="middle" x="600" y="24">QUÉ APORTÓ · A QUIÉN EXPULSÓ · POR QUÉ CAYÓ</text>
<path class="sv-box" d="M20 40 L440 40 L400 128 L60 128 Z"></path>
<text class="sv-t" text-anchor="middle" x="230" y="66">I Internacional (AIT, 1864-1876)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="86">todas las corrientes: sindicatos, proudhonianos,</text>
<text class="sv-t2" text-anchor="middle" x="230" y="102">bakuninistas, marxistas</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="56">base social: artesanos en proletarización (Francia),</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="70">obreros de la construcción (Gran Bretaña)</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="84">legado: conquista del poder político como «gran deber»,</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="98">política exterior obrera independiente, autoemancipación</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="112">expulsa: proudhonianos y bakuninistas</text>
<text class="sv-t3" x="455" y="126">ocaso: no logra constituirse en partido</text>
<path class="sv-box-blue" d="M60 140 L400 140 L360 228 L100 228 Z"></path>
<text class="sv-tb" text-anchor="middle" x="230" y="166">II Internacional (1889-1914)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="186">sin anarquistas: partidos obreros</text>
<text class="sv-t2" text-anchor="middle" x="230" y="202">de masas con hegemonía marxista</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="156">base social: proletariado industrial en expansión</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="170">legado: los medios de la política obrera (Primero de Mayo,</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="184">8 de Marzo, prensa, huelga de masas, programas)</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="198">expulsa: anarquistas (1891-1896)</text>
<text class="sv-t3" x="455" y="212">ocaso: brecha palabras-hechos (1914)</text>
<text class="sv-t3" x="455" y="226">por burocratización: SPD 1 millón, sindicatos 4</text>
<path class="sv-box-red" d="M100 240 L360 240 L320 328 L140 328 Z"></path>
<text class="sv-tr" text-anchor="middle" x="230" y="266">III Internacional (1919-1943)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="286">solo comunistas: ruptura</text>
<text class="sv-t2" text-anchor="middle" x="230" y="302">con el oportunismo</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="256">base social: comunistas, fuerzas reducidas y una</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="270">generación joven; continuidad con el ala revolucionaria</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="284">legado: 4 primeros congresos, «un paso más», no un modelo</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="298">acabado (dictadura del proletariado, partido, Frente Único)</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="312">excluye: reformistas y centristas</text>
<text class="sv-t3" x="455" y="326">ocaso: subordinación al Estado soviético</text>
<path class="sv-line-red" d="M230 328 L230 344" marker-end="url(#m5-5-arrow)"></path>
<rect class="sv-soft" height="58" rx="2" width="720" x="20" y="346"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="362">EPÍGONOS Y ESCENARIO ACTUAL</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="379">Cominform (1947) · IV Internacional (1938) rota en al menos 21 «cuartas» · bordiguismo, hoxhaísmo, maoísmo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="395">hoy: sectas como las previas al movimiento obrero de masas + un movimiento obrero con hegemonía reformista abrumadora</text>
<path class="sv-line-red" d="M380 404 L380 420" marker-end="url(#m5-5-arrow)"></path>
<rect class="sv-box-ink" height="44" rx="2" width="720" x="20" y="422"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="440">Hoy: una nueva Internacional de los comunistas</text>
<text class="sv-tw" text-anchor="middle" x="380" y="457">acuerdos programáticos · acción política internacional · partidos continentales · ni apologética ni adanismo</text>
<rect class="sv-box" height="112" rx="2" width="352" x="20" y="476"></rect>
<text class="sv-t" text-anchor="middle" x="196" y="494">Qué Internacional: fundamentos</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="511">acción política independiente y revolucionaria de la clase</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="524">obrera + un breve programa general; gestiona las diferencias</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="537">compatibles; junto a formas de unidad más amplias</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="550">unidad por acuerdos programáticos, estratégicos y tácticos,</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="563">no por fidelidad a la autoridad doctrinal de un individuo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="576">partidos de escala continental (Partido Comunista Europeo)</text>
<rect class="sv-box" height="112" rx="2" width="352" x="388" y="476"></rect>
<text class="sv-t" text-anchor="middle" x="564" y="494">Lecciones de los orígenes de cada Internacional</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="511">I: tareas concretas donde el marco nacional ya es insuficiente</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="524">(Palestina hoy como la cuestión polaca en los años 60)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="537">II: jornadas comunes (Primero de Mayo); sin concesiones</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="550">programáticas en nombre de la «amplitud»</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="563">III: la ruptura con el reformismo, concebida y organizada</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="576">internacionalmente desde el inicio</text>
<rect class="sv-soft" height="76" rx="2" width="720" x="20" y="594"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="610">MÉTODO Y LEYENDA</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11px" x="380" y="626">ni apologética («cosplay») ni adanismo («alzheimer»): la maduración es una metáfora temporal y normativa;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11px" x="380" y="640">aprovechar la quiebra del reformismo por su izquierda; el internacionalismo es el «test de Litmus» de la independencia política</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="654">flecha = sucesión histórica · el embudo se estrecha = depuración de corrientes</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="667">a la derecha: base social, legado, a quién expulsó y la causa de la caída de cada Internacional</text>
</svg>
