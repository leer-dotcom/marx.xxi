<svg xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de bifurcación: la crisis ecosocial se ramifica en tecnoutopismo, catastrofismo y pacto verde; la versión crítica del pacto verde (negacionismo verde, reforma permanente) sigue una estrategia neogramsciana que confía en el Estado capitalista, atraviesa el embudo de los mecanismos de contención del Estado y las tres contingencias de actuar contra la acumulación, y desemboca en transición capitalista, ecofascismo o colapso; la vía del poder socialista independiente, con las reformas como medio, conduce al comunismo sin crecimiento; una nota recoge los referentes históricos del manifiesto" role="img" viewBox="0 0 760 862" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-10-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="56" rx="2" width="250" x="255" y="12"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="33">Crisis ecosocial</text>
<text class="sv-tw" text-anchor="middle" x="380" y="49" style="font-size:11px">inflación de 2022, carestía, revueltas</text>
<text class="sv-tw" text-anchor="middle" x="380" y="61" style="font-size:10.5px">tras tres décadas de fracaso del desarrollo sostenible</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="330" x2="105" y1="68" y2="100"></line>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="360" x2="275" y1="68" y2="100"></line>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="430" x2="580" y1="68" y2="100"></line>
<rect class="sv-box" height="50" rx="2" width="150" x="30" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="121">Tecnoutopismo</text>
<text class="sv-t3" text-anchor="middle" x="105" y="138">innovación salvadora</text>
<rect class="sv-box" height="50" rx="2" width="150" x="200" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="275" y="121">Catastrofismo</text>
<text class="sv-t3" text-anchor="middle" x="275" y="138">colapsología, huida</text>
<text class="sv-t3" text-anchor="middle" x="190" y="171">apolíticos: descartados por el pacto verde</text>
<rect class="sv-box-green" height="50" rx="2" width="300" x="430" y="100"></rect>
<text class="sv-tgr" text-anchor="middle" x="580" y="121">Pacto verde / Green New Deal</text>
<text class="sv-t3" text-anchor="middle" x="580" y="138">proyecto político: relanzar la acumulación</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="150" y2="184"></line>
<rect class="sv-box" height="118" rx="2" width="300" x="430" y="184"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="204">Versión crítica: Tejero y Santiago</text>
<text class="sv-t2" text-anchor="middle" x="580" y="221" style="font-size:12.5px">diagnóstico: descarbonizar, eficiencia, circular</text>
<text class="sv-t2" text-anchor="middle" x="580" y="237" style="font-size:12.5px">medios: Estado, elecciones, capitales «verdes»</text>
<text class="sv-t3" text-anchor="middle" x="580" y="254" style="font-size:10.5px">«negacionismo verde»: el crecimiento es</text>
<text class="sv-t3" text-anchor="middle" x="580" y="267" style="font-size:10.5px">incompatible con la transición, pero salvar al</text>
<text class="sv-t3" text-anchor="middle" x="580" y="280" style="font-size:10.5px">capitalismo sería la condición de superarlo;</text>
<text class="sv-t3" text-anchor="middle" x="580" y="293" style="font-size:10.5px">«reforma permanente» = Bernstein en verde</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="302" y2="332"></line>
<rect class="sv-box" height="76" rx="2" width="300" x="430" y="332"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="352">Estrategia neogramsciana</text>
<text class="sv-t2" text-anchor="middle" x="580" y="368" style="font-size:12px">«pueblo del clima»; bloque histórico con los</text>
<text class="sv-t2" text-anchor="middle" x="580" y="383" style="font-size:12px">capitales «verdes» (¿quién lo dirigirá?); guerra de</text>
<text class="sv-t2" text-anchor="middle" x="580" y="398" style="font-size:12px">posiciones sin guerra de movimientos: lo electoral</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="408" y2="438"></line>
<rect class="sv-box" height="76" rx="2" width="300" x="430" y="438"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="458">El Estado capitalista</text>
<text class="sv-t2" text-anchor="middle" x="580" y="474" style="font-size:12px">instancia separada que impone normas vinculantes</text>
<text class="sv-t2" text-anchor="middle" x="580" y="489" style="font-size:12px">a propietarios en competencia; de clase, pero no</text>
<text class="sv-t2" text-anchor="middle" x="580" y="504" style="font-size:12px">instrumento; conforma ciudadanos libres e iguales</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="514" y2="544"></line>
<path class="sv-box-red" d="M430 544 L730 544 L700 636 L460 636 Z"></path>
<text class="sv-tr" text-anchor="middle" x="580" y="565">Mecanismos de contención del Estado</text>
<text class="sv-t2" text-anchor="middle" x="580" y="583" style="font-size:11px">procedimientos de decisión · intereses de aparatos</text>
<text class="sv-t2" text-anchor="middle" x="580" y="599" style="font-size:11px">lógica estatal (sentido común burgués)</text>
<text class="sv-t2" text-anchor="middle" x="580" y="614" style="font-size:11px">cooptación de representantes (Syriza)</text>
<text class="sv-t3" text-anchor="middle" x="580" y="629" style="font-size:10px">limitan la intervención rupturista</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="636" y2="662"></line>
<rect class="sv-soft" height="74" rx="2" width="300" x="430" y="662"></rect>
<text class="sv-t3" text-anchor="middle" x="580" y="678" style="font-size:11px">¿puede el Estado ir contra la acumulación?</text>
<text class="sv-t2" text-anchor="middle" x="580" y="694" style="font-size:11.5px">sí, pero: pierde sus recursos · conflicto con quienes</text>
<text class="sv-t2" text-anchor="middle" x="580" y="708" style="font-size:11.5px">personifican el capital · peores condiciones de vida</text>
<text class="sv-t2" text-anchor="middle" x="580" y="722" style="font-size:11px">→ inviable electoralmente; peor aún en la UE y el mercado mundial</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="560" x2="390" y1="736" y2="772"></line>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="540" y1="736" y2="772"></line>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="600" x2="675" y1="736" y2="772"></line>
<rect class="sv-box" height="50" rx="2" width="140" x="320" y="772"></rect>
<text class="sv-t" text-anchor="middle" x="390" y="793">Transición verde</text>
<text class="sv-t2" text-anchor="middle" x="390" y="810">capitalista</text>
<rect class="sv-box" height="50" rx="2" width="130" x="475" y="772"></rect>
<text class="sv-t" text-anchor="middle" x="540" y="802">Ecofascismo</text>
<rect class="sv-box" height="50" rx="2" width="110" x="620" y="772"></rect>
<text class="sv-t" text-anchor="middle" x="675" y="802">Colapso</text>
<text class="sv-t3" text-anchor="middle" x="525" y="846">la crisis decidirá entre estas salidas si no hay poder independiente</text>
<line class="sv-line-dash" marker-end="url(#m2-10-arrow)" x1="430" x2="200" y1="292" y2="332"></line>
<text class="sv-t3" text-anchor="start" x="30" y="298" style="font-size:10.5px">la discrepancia está</text>
<text class="sv-t3" text-anchor="start" x="30" y="311" style="font-size:10.5px">en los medios, no en</text>
<text class="sv-t3" text-anchor="start" x="30" y="324" style="font-size:10.5px">el diagnóstico</text>
<rect class="sv-box-blue" height="108" rx="2" width="300" x="30" y="332"></rect>
<text class="sv-tb" text-anchor="middle" x="180" y="352">Poder socialista independiente</text>
<text class="sv-t2" text-anchor="middle" x="180" y="369" style="font-size:12.5px">reformas como medio, revolución como fin</text>
<text class="sv-t2" text-anchor="middle" x="180" y="384" style="font-size:12.5px">(Luxemburgo frente al falso dilema)</text>
<text class="sv-t3" text-anchor="middle" x="180" y="401" style="font-size:10.5px">la «falacia funcionalista», al revés: no hay cierre</text>
<text class="sv-t3" text-anchor="middle" x="180" y="414" style="font-size:10.5px">perfecto, pero sin poder independiente el orden</text>
<text class="sv-t3" text-anchor="middle" x="180" y="427" style="font-size:10.5px">integra las demandas y reorienta el crecimiento</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="180" x2="180" y1="440" y2="470"></line>
<rect class="sv-box-blue" height="50" rx="2" width="250" x="55" y="470"></rect>
<text class="sv-tb" text-anchor="middle" x="180" y="491">Comunismo sin crecimiento</text>
<text class="sv-t3" text-anchor="middle" x="180" y="508">frente a la transición capitalista</text>
<rect class="sv-soft" height="118" rx="2" width="300" x="30" y="550"></rect>
<text class="sv-t3" text-anchor="middle" x="180" y="567" style="font-size:10.5px">LOS REFERENTES HISTÓRICOS DEL MANIFIESTO</text>
<text class="sv-t2" text-anchor="middle" x="180" y="584" style="font-size:11.5px">New Deal y «espíritu del 45»: contaron con la presión</text>
<text class="sv-t2" text-anchor="middle" x="180" y="598" style="font-size:11.5px">de un movimiento obrero hoy ausente, en plena</text>
<text class="sv-t2" text-anchor="middle" x="180" y="612" style="font-size:11.5px">expansión keynesiano-fordista</text>
<text class="sv-t2" text-anchor="middle" x="180" y="629" style="font-size:11.5px">ofensiva neoliberal: sí fue revolución desde arriba,</text>
<text class="sv-t2" text-anchor="middle" x="180" y="643" style="font-size:11.5px">pero de las élites y para las élites</text>
<text class="sv-t2" text-anchor="middle" x="180" y="660" style="font-size:11.5px">la «larga marcha» de los Verdes: camino a ninguna parte</text>
</svg>
