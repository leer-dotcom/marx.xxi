<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: auge de movimientos culturales y declive de la clase, con la tentación populista y la exigencia de un compromiso crítico. Debajo, doble vía desde un nodo central de disolución de la comunidad real bajo el dinero y la Ley: una vía superior de reapropiación alienada que conduce a las comunidades ilusorias (religión, nación, Estado, derechos) y, en un desvío, a los partidos socialistas que imitan al Estado; una vía inferior de reapropiación real que pasa por la socialización del trabajo, la auto-organización de la clase, la democracia de la clase como un todo y el control social de la producción. Flechas de crítica positiva conectan ambas vías. Abajo, el pronóstico de Marx, el dilema actual del socialismo y la leyenda." role="img" viewBox="0 0 760 704" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-11-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="76" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="34">Punto de partida (conferencia de 1988): movimientos culturales y declive de la clase</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="52">movimientos religiosos, nacionales, lingüísticos; muchos ex socialistas: dejar la base obrera por un partido populista y liberal-democrático</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="67">Clarke: el compromiso con esas expresiones ha de ser crítico (bases reales y forma mistificada); la movilización de clase ha sido la excepción,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="82">no la regla: el problema es el mismo que afrontó Marx al penetrar las formas mistificadas de la opresión</text>
<rect class="sv-box-ink" height="80" rx="2" width="200" x="20" y="266"></rect>
<text class="sv-tw" text-anchor="middle" x="120" y="290">Disolución de la</text>
<text class="sv-tw" text-anchor="middle" x="120" y="307">comunidad real</text>
<text class="sv-tw" text-anchor="middle" x="120" y="324">bajo el dinero y la Ley</text>
<text class="sv-t3" x="20" y="364">alienación de los poderes sociales;</text>
<text class="sv-t3" x="20" y="378">existencia desdoblada del individuo</text>
<text class="sv-t3" x="20" y="392">(alienación histórica, no psicológica:</text>
<text class="sv-t3" x="20" y="406">a diferencia de Feuerbach)</text>
<path class="sv-line-red" d="M220 286 C 260 286, 260 166, 300 166" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tr" x="20" y="156">REAPROPIACIÓN ALIENADA</text>
<text class="sv-t3" x="20" y="172">la lucha por la humanidad aparece</text>
<text class="sv-t3" x="20" y="186">como lucha por derechos y poder estatal</text>
<rect class="sv-box-red" height="110" rx="2" width="200" x="300" y="126"></rect>
<text class="sv-tr" text-anchor="middle" x="400" y="150">Comunidades ilusorias</text>
<text class="sv-t2" text-anchor="middle" x="400" y="167">religión, nación, Estado,</text>
<text class="sv-t2" text-anchor="middle" x="400" y="182">lucha por derechos;</text>
<text class="sv-t2" text-anchor="middle" x="400" y="197">límites de la democracia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="213">compensan la falta de comunidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="228">real; el Estado, la más abstracta</text>
<line class="sv-line-dash" marker-end="url(#m1-11-arrow)" x1="500" x2="540" y1="166" y2="166"></line>
<text class="sv-t3" text-anchor="middle" x="520" y="116">desvío</text>
<rect class="sv-box" height="110" rx="2" width="200" x="540" y="126"></rect>
<text class="sv-t" text-anchor="middle" x="640" y="150">Partidos socialistas</text>
<text class="sv-t2" text-anchor="middle" x="640" y="167">orientados al poder estatal:</text>
<text class="sv-t2" text-anchor="middle" x="640" y="182">imitan la comunidad ilusoria</text>
<text class="sv-t2" text-anchor="middle" x="640" y="197">del Estado (fracaso contingente)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="213">no necesario: reveses políticos y</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="228">degeneración, en el Este y el Oeste</text>
<path class="sv-line-dash" d="M400 236 V346" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tgr" x="408" y="258">crítica positiva:</text>
<text class="sv-t2" x="408" y="274">reconocer las aspiraciones</text>
<text class="sv-t2" x="408" y="288">genuinas bajo la forma alienada</text>
<text class="sv-t2" style="font-size:12px" x="408" y="304">y reconstruir un movimiento donde se</text>
<text class="sv-t2" style="font-size:12px" x="408" y="318">expresen y resuelvan democráticamente</text>
<path class="sv-line-red" d="M220 326 C 260 326, 260 391, 300 391" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tgr" x="20" y="440">REAPROPIACIÓN REAL</text>
<text class="sv-t3" x="20" y="456">única base para superar las</text>
<text class="sv-t3" x="20" y="470">formas alienadas de existencia</text>
<text class="sv-t3" x="20" y="484">y de conciencia (religiosa, política)</text>
<rect class="sv-box-green" height="90" rx="2" width="200" x="300" y="346"></rect>
<text class="sv-tgr" text-anchor="middle" x="400" y="370">Socialización del trabajo</text>
<text class="sv-t2" text-anchor="middle" x="400" y="387">el capital reúne a los obreros</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="404">destruye las viejas comunidades</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="419">y crea los fundamentos de nuevas</text>
<rect class="sv-box-green" height="90" rx="2" width="200" x="540" y="346"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="370">Auto-organización</text>
<text class="sv-t2" text-anchor="middle" x="640" y="387">de la clase obrera</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="404">no suprime por sí los conflictos:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="419">único medio de resolverlos</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="500" x2="540" y1="391" y2="391"></line>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="640" x2="640" y1="436" y2="452"></line>
<rect class="sv-box-green" height="90" rx="2" width="200" x="540" y="452"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="476">Democracia de la clase</text>
<text class="sv-t2" text-anchor="middle" x="640" y="493">como un todo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="510">ni socialdemocracia ni democracia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="525">formal que silencie a las minorías</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="540" x2="500" y1="497" y2="497"></line>
<rect class="sv-box-green" height="90" rx="2" width="200" x="300" y="452"></rect>
<text class="sv-tgr" text-anchor="middle" x="400" y="476">Control social de</text>
<text class="sv-t2" text-anchor="middle" x="400" y="493">la producción: comunidad real</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="510">reapropiación de los poderes</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="525">colectivos del trabajo</text>
<rect class="sv-soft" height="96" rx="2" width="720" x="20" y="562"></rect>
<text class="sv-t3" x="30" y="580">EL PRONÓSTICO DE MARX Y EL DILEMA ACTUAL</text>
<text class="sv-t2" style="font-size:12px" x="30" y="598">Marx esperaba un progreso de la conciencia religiosa → política → social; subestimó la resiliencia de las dos primeras y la dificultad</text>
<text class="sv-t2" style="font-size:12px" x="30" y="613">de la clase para organizarse; pero su tesis no es economicista: la clase organizada es la única base de las aspiraciones materiales y espirituales.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="632">Dilema: disolverse en un partido liberal-democrático aliado con el dinero y el Estado (formas alienadas de poder social),</text>
<text class="sv-t2" style="font-size:12px" x="30" y="647">o renovarse con nuevas formas de organización que sirvan de marco a la auténtica participación democrática de la clase como un todo.</text>
<rect class="sv-soft" height="32" rx="2" width="720" x="20" y="666"></rect>
<text class="sv-t3" x="30" y="687">LEYENDA</text>
<line class="sv-line-red" marker-end="url(#m1-11-arrow)" x1="110" x2="140" y1="683" y2="683"></line>
<text class="sv-t3" x="150" y="687">vías de reapropiación</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="310" x2="340" y1="683" y2="683"></line>
<text class="sv-t3" x="350" y="687">sucesión en la vía real</text>
<line class="sv-line-dash" marker-end="url(#m1-11-arrow)" x1="520" x2="550" y1="683" y2="683"></line>
<text class="sv-t3" x="560" y="687">desvío / crítica positiva</text>
</svg>
