<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, qué significa organizar el socialismo: recomponer al proletariado como sujeto político hacia el Partido, con la organización como mediación entre subjetividades y conciencia socialista. A la izquierda, mapa de capas superpuestas (tejido global, Unión Europea, Estado español, naciones oprimidas y el resto, megaciudad, provincia, ruralidad y barrio) articuladas por el trabajo político; a la derecha, los dos límites de la táctica, la propuesta de marcos de referencia racionales y la regla de acumulación de fuerzas; debajo, las tres respuestas descartadas: federalismo, nacionalismo revolucionario y nacionalismo español, y la conclusión: hacer políticamente posible lo estratégicamente necesario" role="img" viewBox="0 0 760 788" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="20">QUÉ SIGNIFICA «ORGANIZAR EL SOCIALISMO EN TODOS LOS TERRITORIOS»</text>
<rect class="sv-soft" height="62" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" text-anchor="start" x="20" y="45" style="font-size:11.3px;letter-spacing:0">Poner las bases para recomponer al proletariado como sujeto político en tránsito hacia el Partido comunista: articular la militancia</text>
<text class="sv-t2" text-anchor="start" x="20" y="60" style="font-size:11.3px;letter-spacing:0">existente en una constelación de organizaciones que permeen en todo contexto. La organización es una mediación entre las subjetividades</text>
<text class="sv-t2" text-anchor="start" x="20" y="75" style="font-size:11.3px;letter-spacing:0">existentes y la conciencia socialista: las atiende para transformarlas, no para eternizarlas. El territorio no lo determina un solo polo.</text>
<text class="sv-t3" x="12" y="114">CAPAS SUPERPUESTAS</text>
<rect class="sv-box" height="354" rx="2" width="360" x="12" y="124"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="144">Tejido global · organización internacional</text>
<text class="sv-t2" text-anchor="middle" x="192" y="159" style="font-size:11.3px;letter-spacing:0">premisa: la organización ha de ser internacional</text>
<rect class="sv-box-blue" height="294" rx="2" width="320" x="32" y="168"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="188">Unión Europea · escala mínima</text>
<text class="sv-t2" text-anchor="middle" x="192" y="203" style="font-size:11.3px;letter-spacing:0">bloque supraestatal: misma necesidad, sin europeísmo</text>
<rect class="sv-box-gold" height="234" rx="2" width="280" x="52" y="212"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="232">Estado español · marco ineludible</text>
<text class="sv-t2" text-anchor="middle" x="192" y="246" style="font-size:10.7px;letter-spacing:0">marco de la acumulación (normativa laboral, oligopolios)</text>
<text class="sv-t2" text-anchor="middle" x="192" y="259" style="font-size:10.7px;letter-spacing:0">y de las luchas espontáneas (Hasel, Cádiz, Inditex);</text>
<text class="sv-t2" text-anchor="middle" x="192" y="272" style="font-size:10.7px;letter-spacing:0">reconocerlo es el primer paso para superarlo</text>
<rect class="sv-box-red" height="74" rx="2" width="120" x="68" y="290"></rect>
<text class="sv-t" text-anchor="middle" x="128" y="311" style="font-size:12.2px;letter-spacing:0">Naciones oprimidas</text>
<text class="sv-t2" text-anchor="middle" x="128" y="327" style="font-size:10.7px;letter-spacing:0">Cataluña, Euskal Herria</text>
<text class="sv-t2" text-anchor="middle" x="128" y="342" style="font-size:10.6px;letter-spacing:0">marcos propios de lucha</text>
<text class="sv-t2" text-anchor="middle" x="128" y="357" style="font-size:10.2px;letter-spacing:0">desde la lucha de clases</text>
<rect class="sv-box" height="74" rx="2" width="120" x="196" y="290"></rect>
<text class="sv-t" text-anchor="middle" x="256" y="311">«El resto»</text>
<text class="sv-t2" text-anchor="middle" x="256" y="327" style="font-size:11.0px;letter-spacing:0">heterogéneo, no nación</text>
<text class="sv-t2" text-anchor="middle" x="256" y="342" style="font-size:12.6px;letter-spacing:0">problema asimétrico</text>
<text class="sv-t2" text-anchor="middle" x="256" y="357" style="font-size:10.2px;letter-spacing:0">(Castilla, País Llionés…)</text>
<rect class="sv-box-green" height="64" rx="2" width="248" x="68" y="374"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="394">Megaciudad · provincia · ruralidad</text>
<text class="sv-t2" text-anchor="middle" x="192" y="410">islas turistificadas · barrio</text>
<text class="sv-t2" text-anchor="middle" x="192" y="425" style="font-size:10.8px;letter-spacing:0">geografía económica desigual (p. ej. Madrid)</text>
<text class="sv-tr" text-anchor="middle" x="192" y="498">El trabajo político articula las capas</text>
<text class="sv-t2" text-anchor="middle" x="192" y="514" style="font-size:11.3px;letter-spacing:0">no adscripción a una sola; «piensa globalmente, actúa</text>
<text class="sv-t2" text-anchor="middle" x="192" y="528" style="font-size:11.3px;letter-spacing:0">localmente» borra la mediación organizativa</text>
<text class="sv-t3" x="400" y="114">DOS LÍMITES DE LA TÁCTICA</text>
<rect class="sv-box" height="104" rx="2" width="348" x="400" y="124"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="146">Articularse a escala estatal y europea</text>
<text class="sv-t2" text-anchor="middle" x="574" y="163">sin legitimar el marco: funcionalidad</text>
<text class="sv-t2" text-anchor="middle" x="574" y="178">estratégica, ni nacionalismo ni europeísmo</text>
<text class="sv-t2" text-anchor="middle" x="574" y="193" style="font-size:11.3px;letter-spacing:0">lección: 1873 proteccionismo → II Internacional</text>
<text class="sv-t2" text-anchor="middle" x="574" y="208" style="font-size:11.3px;letter-spacing:0">presa de las nacionalidades → 1914; bolcheviques</text>
<rect class="sv-box" height="104" rx="2" width="348" x="400" y="238"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="260">Trabajar las particularidades nacionales</text>
<text class="sv-t2" text-anchor="middle" x="574" y="277">oprimidas desde el internacionalismo,</text>
<text class="sv-t2" text-anchor="middle" x="574" y="292">sin negarlas ni mistificarlas</text>
<text class="sv-t2" text-anchor="middle" x="574" y="307" style="font-size:11.3px;letter-spacing:0">conciencia nacional explicable por la lucha de</text>
<text class="sv-t2" text-anchor="middle" x="574" y="322" style="font-size:11.3px;letter-spacing:0">clases, no por sustratos «culturalistas»</text>
<path class="sv-line" d="M574 342 V358" marker-end="url(#m3-5-arrow)"></path>
<rect class="sv-box-ink" height="128" rx="2" width="348" x="400" y="360"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="384">Propuesta: marcos de referencia</text>
<text class="sv-tw" text-anchor="middle" x="574" y="402">racionales y estratégicos</text>
<text class="sv-tw" text-anchor="middle" x="574" y="422">espacio social en disputa con dimensión política,</text>
<text class="sv-tw" text-anchor="middle" x="574" y="439">no mera adscripción voluntaria</text>
<text class="sv-tw" text-anchor="middle" x="574" y="458" style="font-size:11.4px;letter-spacing:0">criterio: capacidad de intervenir políticamente a esa escala</text>
<text class="sv-tw" text-anchor="middle" x="574" y="474" style="font-size:11.4px;letter-spacing:0">contraejemplo: castellanismo de 17 provincias, sin sujeto</text>
<rect class="sv-soft" height="58" rx="2" width="348" x="400" y="498"></rect>
<text class="sv-t2" text-anchor="middle" x="574" y="515" style="font-size:11.3px;letter-spacing:0">Fase actual: el proletariado no puede disputar territorios;</text>
<text class="sv-t2" text-anchor="middle" x="574" y="530" style="font-size:11.3px;letter-spacing:0">acumulación de fuerzas y elección táctica de dónde ponerlas</text>
<text class="sv-t2" text-anchor="middle" x="574" y="545" style="font-size:11.3px;letter-spacing:0">(p. ej. ruptura juvenil → no priorizar zonas sin jóvenes)</text>
<text class="sv-t3" x="12" y="574">TRES RESPUESTAS EN VÍA MUERTA</text>
<rect class="sv-box-red" height="110" rx="2" width="235" x="12" y="584"></rect>
<text class="sv-tr" text-anchor="middle" x="129" y="606">Federalismo</text>
<text class="sv-t2" text-anchor="middle" x="129" y="623">negación abstracta de la opresión</text>
<text class="sv-t2" text-anchor="middle" x="129" y="638">nacional → reproduce el marco estatal</text>
<text class="sv-t2" text-anchor="middle" x="129" y="653">y acaba en nacionalismo español</text>
<text class="sv-t2" text-anchor="middle" x="129" y="668" style="font-size:11.3px;letter-spacing:0">autonomismo y anarquismo: «todo</text>
<text class="sv-t2" text-anchor="middle" x="129" y="683" style="font-size:11.3px;letter-spacing:0">nacionalismo es fascismo»; retórica sin apoyo</text>
<rect class="sv-box-red" height="110" rx="2" width="235" x="262" y="584"></rect>
<text class="sv-tr" text-anchor="middle" x="379" y="606">Nacionalismo revolucionario</text>
<text class="sv-t2" text-anchor="middle" x="379" y="623">equipara opresiones no equiparables</text>
<text class="sv-t2" text-anchor="middle" x="379" y="638" style="font-size:12.9px;letter-spacing:0">→ territorialismo de la «España vaciada»</text>
<text class="sv-t2" text-anchor="middle" x="379" y="653">o muleta de la socialdemocracia</text>
<text class="sv-t2" text-anchor="middle" x="379" y="668" style="font-size:11.3px;letter-spacing:0">(rendición de JxC al PSOE); «cárcel de</text>
<text class="sv-t2" text-anchor="middle" x="379" y="683" style="font-size:11.3px;letter-spacing:0">pueblos» como rodeo que acaba en extravío</text>
<rect class="sv-box-red" height="110" rx="2" width="235" x="513" y="584"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="606">Nacionalismo español</text>
<text class="sv-t2" text-anchor="middle" x="630" y="623">patriotismo del PCE en la guerra</text>
<text class="sv-t2" text-anchor="middle" x="630" y="638">→ nuevo españolismo de masas</text>
<text class="sv-t2" text-anchor="middle" x="630" y="653">tras el 1-O</text>
<text class="sv-t2" text-anchor="middle" x="630" y="668" style="font-size:11.3px;letter-spacing:0">Reconstrucción Comunista, II Congreso</text>
<text class="sv-t2" text-anchor="middle" x="630" y="683" style="font-size:11.3px;letter-spacing:0">del PCTE (2021), tolerancia con Armesilla</text>
<text class="sv-t2" text-anchor="middle" x="380" y="714" style="font-size:11.6px;letter-spacing:0">todas asumen mistificaciones nacionalistas… o su negación abstracta</text>
<rect class="sv-soft" height="48" rx="2" width="736" x="12" y="728"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="747" style="font-size:11.6px;letter-spacing:0">Conclusión: frente a las inercias (voluntarismo identitario, inmediatismo local), marcos adoptados racional y</text>
<text class="sv-t2" text-anchor="middle" x="380" y="762" style="font-size:11.6px;letter-spacing:0">estratégicamente para conectar las realidades superpuestas: «hacer políticamente posible lo estratégicamente necesario»</text>
</svg>
