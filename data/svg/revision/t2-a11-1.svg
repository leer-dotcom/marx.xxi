<svg xmlns="http://www.w3.org/2000/svg" aria-label="Péndulo cuyo eje es el ideal de un capitalismo sin contradicciones, del que cuelgan dos polos que se refuerzan, el servilismo reformista y el voluntarismo anarquista, y que desembocan ambos en la melancolía de izquierda; arriba, la premisa reformista y por qué las reformas socializadoras exacerban las contradicciones; fuera del péndulo, la salida: reforma subordinada al fin socialista y partido independiente" role="img" viewBox="0 0 760 618" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-11-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-gold" height="74" rx="2" width="520" x="120" y="12"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="35">Ideal de un capitalismo sin contradicciones</text>
<text class="sv-t2" text-anchor="middle" x="380" y="53" style="font-size:11px">«ideal regulativo»: perseguirlo es una tarea infinita · crítica de Luxemburgo (Reforma o revolución) a Bernstein</text>
<text class="sv-t3" text-anchor="middle" x="380" y="71">«caballo de Troya» del pensamiento de izquierda</text>
<rect class="sv-soft" height="72" rx="2" width="720" x="20" y="92"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="108" style="font-size:10.5px">La premisa reformista: el capitalismo puede «perfeccionarse» atenuando sus contradicciones; el Estado burgués sirve para ello</text>
<text class="sv-t2" text-anchor="middle" x="380" y="126" style="font-size:11.5px">pero las reformas «socializadoras» las exacerban: los sindicatos no tocan la extracción de plusvalor;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="141" style="font-size:11.5px">el crédito subprime catalizó la Gran Recesión (2008). Las crisis no son accidentes eliminables: son esenciales</text>
<text class="sv-t2" text-anchor="middle" x="380" y="156" style="font-size:11.5px">a la reproducción del capital (resuelven la tensión entre producción en expansión y mercado limitado)</text>
<circle class="sv-dot" cx="380" cy="164" r="5"></circle>
<line class="sv-line" x1="380" x2="150" y1="164" y2="202"></line>
<line class="sv-line" x1="380" x2="610" y1="164" y2="202"></line>
<rect class="sv-box-red" height="206" rx="2" width="240" x="30" y="202"></rect>
<text class="sv-tr" text-anchor="middle" x="150" y="225">Servilismo reformista</text>
<text class="sv-t2" text-anchor="middle" x="150" y="245">parlamento y Estado de bienestar</text>
<text class="sv-t2" text-anchor="middle" x="150" y="262">DSA / Jacobin, redistribución</text>
<text class="sv-t2" text-anchor="middle" x="150" y="279">sindicatos y crédito «socializadores»</text>
<text class="sv-t2" text-anchor="middle" x="150" y="296">oportunismo cortoplacista</text>
<text class="sv-t2" text-anchor="middle" x="150" y="312" style="font-size:11px">(en beneficio de los burócratas del partido)</text>
<text class="sv-t2" text-anchor="middle" x="150" y="327" style="font-size:11px">Reed y Benn Michaels: sermón redistributivo</text>
<text class="sv-t2" text-anchor="middle" x="150" y="343" style="font-size:11.5px">redistribuir es imposible: la distribución</text>
<text class="sv-t2" text-anchor="middle" x="150" y="357" style="font-size:11.5px">es inseparable de la producción (plustrabajo)</text>
<text class="sv-t2" text-anchor="middle" x="150" y="372" style="font-size:11.5px">efecto: refuerza el trabajo asalariado</text>
<text class="sv-t2" text-anchor="middle" x="150" y="386" style="font-size:11.5px">y prepara la próxima crisis</text>
<text class="sv-t3" text-anchor="middle" x="150" y="401" style="font-size:10px">Bernstein: el movimiento lo es todo</text>
<rect class="sv-box-red" height="206" rx="2" width="240" x="490" y="202"></rect>
<text class="sv-tr" text-anchor="middle" x="610" y="225">Voluntarismo / anarquismo</text>
<text class="sv-t2" text-anchor="middle" x="610" y="245">«acciones mágicas»: ladrillo, ocupación</text>
<text class="sv-t2" text-anchor="middle" x="610" y="262">BLM, Occupy, zonas autónomas</text>
<text class="sv-t2" text-anchor="middle" x="610" y="279">doblegar la realidad a la voluntad</text>
<text class="sv-t2" text-anchor="middle" x="610" y="296">complemento callejero del reformismo</text>
<text class="sv-t2" text-anchor="middle" x="610" y="312" style="font-size:11px">(tomar la calle para hacer «palpable y real»</text>
<text class="sv-t2" text-anchor="middle" x="610" y="326" style="font-size:11px">el ideal: «democracia socialista aquí y ahora»)</text>
<text class="sv-t2" text-anchor="middle" x="610" y="343" style="font-size:11.5px">perseguir el ideal regulativo:</text>
<text class="sv-t2" text-anchor="middle" x="610" y="357" style="font-size:11.5px">tarea infinita de la política de izquierda</text>
<text class="sv-t2" text-anchor="middle" x="610" y="372" style="font-size:11.5px">efecto: enmascara la necesidad de una toma</text>
<text class="sv-t2" text-anchor="middle" x="610" y="386" style="font-size:11.5px">disciplinada del Estado por la clase obrera</text>
<text class="sv-t3" text-anchor="middle" x="610" y="401" style="font-size:10px">utopismo abstracto</text>
<line class="sv-line-red" marker-end="url(#m2-11-arrow)" marker-start="url(#m2-11-arrow)" x1="272" x2="488" y1="294" y2="294"></line>
<text class="sv-tr" text-anchor="middle" x="380" y="285">se refuerzan</text>
<text class="sv-t3" text-anchor="middle" x="380" y="310" style="font-size:10.5px">mala infinitud: vacilación sin fin</text>
<text class="sv-t3" text-anchor="middle" x="380" y="324" style="font-size:10.5px">entre servilismo y voluntarismo</text>
<text class="sv-t3" text-anchor="middle" x="380" y="344" style="font-size:10.5px">dos caras de la misma moneda:</text>
<text class="sv-t3" text-anchor="middle" x="380" y="358" style="font-size:10.5px">utopismo abstracto y derrotismo</text>
<text class="sv-t3" text-anchor="middle" x="380" y="378" style="font-size:10px">(Bernstein: el «movimiento» vale más</text>
<text class="sv-t3" text-anchor="middle" x="380" y="391" style="font-size:10px">que todos sus fines)</text>
<line class="sv-line" marker-end="url(#m2-11-arrow)" x1="150" x2="250" y1="408" y2="452"></line>
<line class="sv-line" marker-end="url(#m2-11-arrow)" x1="610" x2="510" y1="408" y2="452"></line>
<rect class="sv-box" height="104" rx="2" width="380" x="190" y="452"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="474">Melancolía de izquierda (Benjamin)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="492" style="font-size:11.5px">cinismo: reconocer tácitamente que el propio proyecto es imposible</text>
<text class="sv-t2" text-anchor="middle" x="380" y="507" style="font-size:11.5px">y romantizar los fracasos como derrota trágica inevitable</text>
<text class="sv-t2" text-anchor="middle" x="380" y="522" style="font-size:11.5px">derrotismo implícito en el antirracismo abstracto: batalla eterna</text>
<text class="sv-t2" text-anchor="middle" x="380" y="537" style="font-size:11.5px">contra una supremacía blanca históricamente indeterminada</text>
<text class="sv-t2" text-anchor="middle" x="380" y="551" style="font-size:10.5px">extremo: afropesimismo (escisión ontológica por raza) · «camarillas, no partidos»</text>
<text class="sv-t3" text-anchor="middle" x="660" y="432">fuera del péndulo</text>
<rect class="sv-box-blue" height="164" rx="2" width="160" x="580" y="440"></rect>
<text class="sv-tb" text-anchor="middle" x="660" y="461">Salida (Luxemburgo)</text>
<text class="sv-t2" text-anchor="middle" x="660" y="479">reforma subordinada</text>
<text class="sv-t2" text-anchor="middle" x="660" y="495">al fin socialista</text>
<text class="sv-t2" text-anchor="middle" x="660" y="511">partido independiente</text>
<text class="sv-t2" text-anchor="middle" x="660" y="527">abolir el salariado</text>
<text class="sv-t2" text-anchor="middle" x="660" y="545" style="font-size:11px">cada decisión: ¿qué exige</text>
<text class="sv-t2" text-anchor="middle" x="660" y="559" style="font-size:11px">la emancipación aquí y ahora?</text>
<text class="sv-t2" text-anchor="middle" x="660" y="575" style="font-size:11px">no bastan un Green New Deal</text>
<text class="sv-t2" text-anchor="middle" x="660" y="589" style="font-size:11px">ni Medicare for All</text>
<text class="sv-t3" text-anchor="middle" x="660" y="600" style="font-size:10px">no la reforma como fin en sí</text>
<text class="sv-t3" text-anchor="middle" x="380" y="578" style="font-size:10px">«el reformismo es el muerto viviente de la lucha por el socialismo, y la idea</text>
<text class="sv-t3" text-anchor="middle" x="380" y="591" style="font-size:10px">de un capitalismo perfeccionado es la fuerza que lo mantiene en marcha»</text>
</svg>
