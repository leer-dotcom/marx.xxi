<svg xmlns="http://www.w3.org/2000/svg" aria-label="Línea temporal de la hegemonía estadounidense de 1944 a 2008 con sus hitos y las cuatro fases: contención, rollback y neoliberalismo, hegemonía sin contrapeso y declive con giro agresivo, cada una con su contenido" role="img" viewBox="0 0 760 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-2-tl" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<path class="sv-line" d="M14 120 L746 120" marker-end="url(#m5-2-tl)"></path>
<path class="sv-line-dash" d="M30 120 L30 100"></path>
