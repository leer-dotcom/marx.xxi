<text class="sv-t3" text-anchor="middle" x="138" y="92">1948</text>
<text class="sv-t2" text-anchor="middle" x="138" y="76">Plan Marshall</text>
<path class="sv-line-dash" d="M192 120 L192 140"></path>
<circle class="sv-dot-b" cx="192" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="192" y="154">1949</text>
<text class="sv-t2" text-anchor="middle" x="192" y="172">OTAN</text>
<path class="sv-line-dash" d="M246 120 L246 100"></path>
<circle class="sv-dot" cx="246" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="246" y="92">1950</text>
<text class="sv-t2" text-anchor="middle" x="246" y="61">NSC-68 y</text>
<text class="sv-t2" text-anchor="middle" x="246" y="76">Guerra de Corea</text>
<path class="sv-line-dash" d="M300 120 L300 140"></path>
<circle class="sv-dot-b" cx="300" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="300" y="154">1961</text>
<text class="sv-t2" text-anchor="middle" x="300" y="172">Eisenhower: el</text>
<text class="sv-t2" text-anchor="middle" x="300" y="187">complejo militar-</text>
<text class="sv-t2" text-anchor="middle" x="300" y="202">industrial</text>
<path class="sv-line-dash" d="M354 120 L354 100"></path>
<circle class="sv-dot" cx="354" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="354" y="92">1965</text>
<text class="sv-t2" text-anchor="middle" x="354" y="61">Indonesia:</text>
<text class="sv-t2" text-anchor="middle" x="354" y="76">método Yakarta</text>
<path class="sv-line-dash" d="M408 120 L408 140"></path>
<circle class="sv-dot-b" cx="408" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="408" y="154">1971-72</text>
<text class="sv-t2" text-anchor="middle" x="408" y="172">fin de la</text>
<text class="sv-t2" text-anchor="middle" x="408" y="187">convertibilidad;</text>
<text class="sv-t2" text-anchor="middle" x="408" y="202">Nixon en Pekín</text>
<path class="sv-line-dash" d="M462 120 L462 100"></path>
<circle class="sv-dot" cx="462" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="462" y="92">1973</text>
<text class="sv-t2" text-anchor="middle" x="462" y="61">petrodólar; Chile:</text>
<text class="sv-t2" text-anchor="middle" x="462" y="76">«Yakarta viene»</text>
<path class="sv-line-dash" d="M516 120 L516 140"></path>
<circle class="sv-dot-b" cx="516" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="516" y="154">1982-83</text>
<text class="sv-t2" text-anchor="middle" x="516" y="172">deuda: México;</text>
<text class="sv-t2" text-anchor="middle" x="516" y="187">Iniciativa de</text>
<text class="sv-t2" text-anchor="middle" x="516" y="202">Defensa Estratégica</text>
<path class="sv-line-dash" d="M570 120 L570 100"></path>
<circle class="sv-dot" cx="570" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="570" y="92">1991</text>
<text class="sv-t2" text-anchor="middle" x="570" y="61">caída URSS;</text>
<text class="sv-t2" text-anchor="middle" x="570" y="76">OTAN al Este</text>
<path class="sv-line-dash" d="M624 120 L624 140"></path>
<circle class="sv-dot-b" cx="624" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="624" y="154">2001</text>
<text class="sv-t2" text-anchor="middle" x="624" y="172">11-S, guerra</text>
<text class="sv-t2" text-anchor="middle" x="624" y="187">contra el terror</text>
<path class="sv-line-dash" d="M678 120 L678 100"></path>
<circle class="sv-dot" cx="678" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="678" y="92">2003</text>
<text class="sv-t2" text-anchor="middle" x="678" y="61">Irak: decretos</text>
<text class="sv-t2" text-anchor="middle" x="678" y="76">de privatización</text>
<path class="sv-line-dash" d="M732 120 L732 140"></path>
<circle class="sv-dot-b" cx="732" cy="120" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="726" y="154">2008</text>
<text class="sv-t2" text-anchor="middle" x="726" y="172">crisis: fin</text>
<text class="sv-t2" text-anchor="middle" x="726" y="187">del impulso</text>
<rect class="sv-box-green" height="24" rx="2" width="332" x="20" y="222"></rect>
<text class="sv-t3" text-anchor="middle" x="186" y="238">1945-1965</text>
<rect class="sv-box-gold" height="24" rx="2" width="200" x="356" y="222"></rect>
<text class="sv-t3" text-anchor="middle" x="456" y="238">1965-1991</text>
<rect class="sv-box-blue" height="24" rx="2" width="100" x="560" y="222"></rect>
<text class="sv-t3" text-anchor="middle" x="610" y="238">1991-2008</text>
<rect class="sv-box-red" height="24" rx="2" width="82" x="664" y="222"></rect>
<text class="sv-t3" text-anchor="middle" x="705" y="238">2008-hoy</text>
<rect class="sv-box-green" height="56" rx="2" width="720" x="20" y="260"></rect>
<text class="sv-tgr" text-anchor="start" x="30" y="279">1945-1965 · Contención: concesiones (zanahoria) y palo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="295">zanahoria: concesiones a gran escala a la clase obrera occidental y a los capitales nacionales del Sur Global;</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="309">palo: amenaza (o realidad: Corea) de agresión militar y contrainsurgencia; el gasto militar sostiene la acumulación</text>
<rect class="sv-box-gold" height="56" rx="2" width="720" x="20" y="322"></rect>
<text class="sv-tg" text-anchor="start" x="30" y="341">1965-1991 · Rollback y neoliberalismo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="357">sobreproducción y caída de la tasa de ganancia: las concesiones se retiran; laboratorios neoliberales: Indonesia y Chile, no Thatcher;</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="371">lo hace posible la derrota del proletariado mundial y de los nacionalismos del Sur (1965-80); Nixon en Pekín aísla a la URSS</text>
<rect class="sv-box-blue" height="56" rx="2" width="720" x="20" y="384"></rect>
<text class="sv-tb" text-anchor="start" x="30" y="403">1991-2008 · Hegemonía sin contrapeso</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="419">la OTAN se expande al Este; FMI y Banco Mundial imponen el Consenso de Washington con la socialdemocracia como ejecutora;</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="433">Oriente Medio como eje coercitivo (Golfo, Kosovo, Afganistán, Irak): los intereses propios se presentan como los del «mundo libre»</text>
<rect class="sv-box-red" height="56" rx="2" width="720" x="20" y="446"></rect>
<text class="sv-tr" text-anchor="start" x="30" y="465">2008-hoy · Declive y giro agresivo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="481">2008 revela el agotamiento productivo: crecimiento global apenas superior al 1 %, desindustrialización, pérdida de supremacía tecnológica;</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="495">China como nueva gran amenaza: desmantelar la propia «globalización» en favor de un orden más militarista y neocolonial</text>
<text class="sv-t3" text-anchor="middle" x="380" y="512">espaciado no proporcional; los hitos alternan arriba y abajo sólo por legibilidad</text>
</svg>
