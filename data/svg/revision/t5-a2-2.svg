<text class="sv-t3" text-anchor="middle" x="44" y="92">1944</text>
<text class="sv-t2" text-anchor="middle" x="44" y="61">Bretton Woods:</text>
<text class="sv-t2" text-anchor="middle" x="44" y="76">dólar = oro</text>
