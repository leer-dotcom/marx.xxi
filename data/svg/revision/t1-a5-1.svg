<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: la dialéctica como lógica de la enajenación y la ambigüedad de la potencialidad del ser genérico; debajo, la distinción entre externalización y enajenación (Testa, Adorno). Contraste entre el modelo procesual de la alienación, una secuencia lineal de esencia, externalización, enajenación y recuperación, y el modelo de la seipseigualdad auto-escindida, un bucle en que la práctica externalizante, la enajenación en dinero y valor, la retroyección y la determinabilidad reconocida ex post se encadenan sin punto libre de enajenación. Debajo, el dilema inmanencia-trascendencia que el bucle disuelve, con la réplica de la explotación y la objeción empirista, y la consecuencia para el imperativo comunista: la historia nos desposee aun cuando nos provee del único recurso para nuestra liberación." role="img" viewBox="0 0 760 950" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: UNA AMBIGÜEDAD EN LA POTENCIALIDAD DEL SER GENÉRICO</text>
<rect class="sv-soft" height="76" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">La dialéctica es la lógica de la enajenación; su «sangre universal» es la negatividad autorrelacionada: para Hegel, el Concepto</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">Absoluto; para Marx, la «actividad libre y consciente» del ser genérico (conjunto históricamente variable de relaciones sociales).</text>
<text class="sv-t2" style="font-size:12px" x="30" y="71">Lectura correcta pero ambigua: si prácticas y formas sociales (dinero, valor) se co-constituyen, ¿con qué fundamento se afirma que</text>
<text class="sv-t2" style="font-size:12px" x="30" y="86">las prácticas guardan un potencial no realizado que excede esas formas? ¿Con qué parámetro medir ese potencial no actualizado?</text>
<rect class="sv-box-green" height="78" rx="2" width="720" x="20" y="116"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="136">Externalización (Entäusserung) y enajenación (Entfremdung): la distinción de Testa, con Adorno</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="154">Toda enajenación es externalización, pero no toda externalización es enajenación: el Espíritu se libera de la naturaleza</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="169">(independencia) y genera la cultura como segunda naturaleza reificada que lo subyuga (dependencia): instituciones, costumbres y</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="184">normas que funcionan «como si fueran Naturaleza». «Cada de-naturalización autoconsciente engendra una renaturalización inconsciente».</text>
<text class="sv-t3" x="20" y="218">MODELO PROCESUAL (POR ESTADIOS)</text>
<text class="sv-t3" x="20" y="233">LA LECTURA QUE BRASSIER CRITICA</text>
<rect class="sv-box" height="64" rx="2" width="320" x="20" y="244"></rect>
<text class="sv-t" text-anchor="middle" x="180.0" y="266.0">Esencia originaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="283.0">ser genérico como sustancia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="298.0">esencia fija que decide de antemano lo posible</text>
<rect class="sv-box" height="64" rx="2" width="320" x="20" y="330"></rect>
<text class="sv-t" text-anchor="middle" x="180.0" y="352.0">Externalización</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="369.0">Entäusserung</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="384.0">el Espíritu se emancipa de la sujeción a la necesidad</text>
<rect class="sv-box-red" height="64" rx="2" width="320" x="20" y="416"></rect>
<text class="sv-tr" text-anchor="middle" x="180.0" y="437.8">Enajenación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="454.2">Entfremdung, segunda naturaleza</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="469.2">nueva subyugación: doble objetivación (Feuerbach)</text>
<rect class="sv-box" height="64" rx="2" width="320" x="20" y="502"></rect>
<text class="sv-t" text-anchor="middle" x="180.0" y="524.0">Liberación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="541.0">recuperación de la esencia perdida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="556.0">(Marx ya excluye la vuelta a la interioridad)</text>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180.0" x2="180.0" y1="308" y2="330"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180.0" x2="180.0" y1="394" y2="416"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180.0" x2="180.0" y1="480" y2="502"></line>
<text class="sv-tr" text-anchor="middle" x="180.0" y="592">crítica: reifica los momentos</text>
<text class="sv-t2" text-anchor="middle" x="180.0" y="610">(esencia previa y recuperación final)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="628">restituye la articulación aristotélica esencia/devenir</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="643">que la seipseigualdad auto-escindida hace añicos.</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="658">«La enajenación es la sombra de la externalización»:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180.0" y="673">re-externalizar la enajenación es re-enajenarla a su vez.</text>
<text class="sv-t3" x="370" y="218">SEIPSEIGUALDAD AUTO-ESCINDIDA (BUCLE)</text>
<text class="sv-t3" x="370" y="233">LA LECTURA DE BRASSIER</text>
<rect class="sv-box-blue" height="76" rx="2" width="170" x="370" y="244"></rect>
<text class="sv-tb" text-anchor="middle" x="455.0" y="264.0">Práctica</text>
<text class="sv-tb" text-anchor="middle" x="455.0" y="279.5">externalizante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455.0" y="296.0">el ser genérico se externaliza</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455.0" y="311.0">necesariamente (produce)</text>
<rect class="sv-box-red" height="76" rx="2" width="170" x="570" y="244"></rect>
<text class="sv-tr" text-anchor="middle" x="655.0" y="264.2">Enajenación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655.0" y="280.8">dinero, valor</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655.0" y="295.8">«poder enajenado de la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655.0" y="310.8">humanidad» (Marx, 1844)</text>
<rect class="sv-box" height="76" rx="2" width="170" x="570" y="392"></rect>
<text class="sv-t" text-anchor="middle" x="655.0" y="412.0">Retroyección</text>
<text class="sv-t" text-anchor="middle" x="655.0" y="428.0">de precondiciones</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655.0" y="445.0">retroyectar una no-libertad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655.0" y="460.0">previa para medir la actual</text>
<rect class="sv-box" height="76" rx="2" width="170" x="370" y="392"></rect>
<text class="sv-t" text-anchor="middle" x="455.0" y="412.0">Determinabilidad</text>
<text class="sv-t" text-anchor="middle" x="455.0" y="428.0">reconocida ex post</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455.0" y="445.0">universalidad negativa, sin</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455.0" y="460.0">sustancia (Skempton)</text>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="540" x2="570" y1="282.0" y2="282.0"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="655.0" x2="655.0" y1="320" y2="392"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="570" x2="540" y1="430.0" y2="430.0"></line>
<line class="sv-line-red" marker-end="url(#m1-5-arrow)" x1="455.0" x2="455.0" y1="392" y2="320"></line>
<text class="sv-t3" x="463.0" y="360.0">nueva externalización</text>
<text class="sv-tr" text-anchor="middle" x="555.0" y="494">no hay punto libre de enajenación</text>
<text class="sv-t2" text-anchor="middle" x="555.0" y="512">la potencialidad se determina ex post, no ex ante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="555.0" y="530">sólo lo que ha devenido es retroactivamente esencial (Hegel):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="555.0" y="545">la actualización es desubstancialización, no consumación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="555.0" y="560">de una esencia (Aristóteles). La sujeción es también capacitación:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="555.0" y="575">distinguir compulsión y libertad es siempre histórico y retroactivo.</text>
<text class="sv-t3" text-anchor="middle" x="555.0" y="596">flecha gris: sucesión · flecha de color: cierre del bucle</text>
<rect class="sv-box-gold" height="142" rx="2" width="720" x="20" y="684"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="706">DILEMA QUE EL BUCLE DISUELVE (inmanencia / trascendencia)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="726">o el ser genérico se funde con las relaciones vigentes (y entonces no son deficientes)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="744">o las trasciende como esencia ahistórica (resubstancialización idealista)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="764">Réplica «lo que está mal es la explotación»: políticamente saludable, pero elude el problema filosófico.</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="779">Objeción empirista: «núcleo idealista» de Marx (lo que es no debe ser): el comunismo sería un ideal, no el «movimiento real».</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="794">Disolución: la determinabilidad genérica no preexiste a su enajenación en dinero y valor, deviene posible a través de ella;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="809">su negatividad no es «propiedad» de lo humano (contra Heidegger): depende de la impropiedad, la accidentalidad de su enajenación.</text>
<text class="sv-t3" x="20" y="846">CONSECUENCIA: ENAJENANDO LA LIBERTAD (EL IMPERATIVO COMUNISTA)</text>
<rect class="sv-soft" height="82" rx="2" width="720" x="20" y="854"></rect>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="871">El comunismo no recupera una esencia perdida: percibe la autonomía del dinero como enajenación de una actividad enajenante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="886">y hace apropiables como obra nuestra las posibilidades así generadas. Objetivación y sujeción son un movimiento único:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="901">no hay relato de una superación definitiva de la necesidad de superar, ni autopropiedad libre de enajenación.</text>
<text class="sv-t" text-anchor="middle" x="380" y="924">«La historia nos desposee aun cuando nos provee del único recurso para nuestra liberación»</text>
</svg>
