<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición en dos columnas entre el republicanismo y la crítica marxiana de la economía política, en nueve filas: salario, tipo de dominio, diagnóstico, papel del Estado, remedio, fetichismo, tipo de crítica, revolución y concepto de libertad; con el mérito y el límite de la lectura republicana arriba y la crítica del voluntarismo redistributivo abajo" role="img" viewBox="0 0 760 666" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="28">mérito de la lectura republicana: desenterrar la herencia republicana de Marx (1793) frente al adanismo del marxismo vulgar</text>
<text class="sv-t3" text-anchor="middle" x="380" y="42">límite: el énfasis en la continuidad diluye su originalidad y reduce su programa a la democracia revolucionaria jacobina</text>
<rect class="sv-box-red" height="44" rx="2" width="275" x="175" y="54"/>
<text class="sv-tr" text-anchor="middle" x="312" y="72">Republicanismo</text>
<text class="sv-t3" text-anchor="middle" x="312" y="88">Kant · Domènech · Liria-Alegre · Polanyi</text>
<rect class="sv-box-blue" height="44" rx="2" width="275" x="465" y="54"/>
<text class="sv-tb" text-anchor="middle" x="602" y="72">Marx</text>
<text class="sv-t3" text-anchor="middle" x="602" y="88">crítica de la economía política</text>
<rect class="sv-soft" height="58" rx="2" width="140" x="20" y="106"/>
<text class="sv-t" text-anchor="middle" x="90" y="140.0">El salario</text>
<rect class="sv-box" height="58" rx="2" width="275" x="174.5" y="106"/>
<text class="sv-t2" text-anchor="middle" x="312" y="124.5" style="font-size:12px">Servicio que no se vende (Kant:</text>
<text class="sv-t2" text-anchor="middle" x="312" y="139.5" style="font-size:12px">praestatio operae no es venta):</text>
<text class="sv-t2" text-anchor="middle" x="312" y="154.5" style="font-size:12px">«esclavitud a tiempo parcial»</text>
<rect class="sv-box" height="58" rx="2" width="275" x="464.5" y="106"/>
<text class="sv-t2" text-anchor="middle" x="602" y="124.5" style="font-size:12px">Venta real de fuerza de trabajo, no de</text>
<text class="sv-t2" text-anchor="middle" x="602" y="139.5" style="font-size:12px">trabajo: equivalentes + plusvalor a la vez;</text>
<text class="sv-t2" text-anchor="middle" x="602" y="154.5" style="font-size:12px">media una «esclavitud absoluta»</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="170"/>
<text class="sv-t" text-anchor="middle" x="90" y="189.0">Tipo de</text>
<text class="sv-t" text-anchor="middle" x="90" y="205.0">dominio</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="170"/>
<text class="sv-t2" text-anchor="middle" x="312" y="188.5">Personal y directo</text>
<text class="sv-t2" text-anchor="middle" x="312" y="204.5">(loi de famille, amo y siervo)</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="170"/>
<text class="sv-t2" text-anchor="middle" x="602" y="188.5">Impersonal: el capital como sujeto,</text>
<text class="sv-t2" text-anchor="middle" x="602" y="204.5">relación global de reproducción</text>
<rect class="sv-soft" height="58" rx="2" width="140" x="20" y="220"/>
<text class="sv-t" text-anchor="middle" x="90" y="246.0">Diagnóstico del</text>
<text class="sv-t" text-anchor="middle" x="90" y="262.0">capitalismo</text>
<rect class="sv-box" height="58" rx="2" width="275" x="174.5" y="220"/>
<text class="sv-t2" text-anchor="middle" x="312" y="238.5" style="font-size:12px">Ficción jurídica, «confusión»</text>
<text class="sv-t2" text-anchor="middle" x="312" y="253.5" style="font-size:12px">interesada de la economía política;</text>
<text class="sv-t2" text-anchor="middle" x="312" y="268.5" style="font-size:12px">mercancías «ficticias» (Polanyi)</text>
<rect class="sv-box" height="58" rx="2" width="275" x="464.5" y="220"/>
<text class="sv-t2" text-anchor="middle" x="602" y="238.5" style="font-size:12px">Forma social necesaria: la práctica,</text>
<text class="sv-t2" text-anchor="middle" x="602" y="253.5" style="font-size:12px">no la intención, hace la mercancía;</text>
<text class="sv-t2" text-anchor="middle" x="602" y="268.5" style="font-size:12px">el mercado central presupone la desposesión</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="284"/>
<text class="sv-t" text-anchor="middle" x="90" y="303.0">Papel del</text>
<text class="sv-t" text-anchor="middle" x="90" y="319.0">Estado</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="284"/>
<text class="sv-t2" text-anchor="middle" x="312" y="302.5">Soberanía que decide</text>
<text class="sv-t2" text-anchor="middle" x="312" y="318.5">qué es y qué no es mercancía</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="284"/>
<text class="sv-t2" text-anchor="middle" x="602" y="302.5">Sometido a las leyes de la</text>
<text class="sv-t2" text-anchor="middle" x="602" y="318.5">reproducción social (Hegel)</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="334"/>
<text class="sv-t" text-anchor="middle" x="90" y="361.0">Remedio</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="334"/>
<text class="sv-t2" text-anchor="middle" x="312" y="352.5">Desmercantilizar tierra, dinero y</text>
<text class="sv-t2" text-anchor="middle" x="312" y="368.5">trabajo; renta básica</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="334"/>
<text class="sv-t2" text-anchor="middle" x="602" y="352.5">Abolir a la vez el trabajo asalariado</text>
<text class="sv-t2" text-anchor="middle" x="602" y="368.5">y la forma-mercancía (relación interna)</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="384"/>
<text class="sv-t" text-anchor="middle" x="90" y="411.0">Fetichismo</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="384"/>
<text class="sv-t2" text-anchor="middle" x="312" y="402.5">«Advertencia propedéutica», retórica</text>
<text class="sv-t2" text-anchor="middle" x="312" y="418.5">hegelianizante sin papel en El Capital</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="384"/>
<text class="sv-t2" text-anchor="middle" x="602" y="402.5">Núcleo: relaciones sociales de poder</text>
<text class="sv-t2" text-anchor="middle" x="602" y="418.5">objetivadas como «leyes económicas»</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="434"/>
<text class="sv-t" text-anchor="middle" x="90" y="453.0">Tipo de</text>
<text class="sv-t" text-anchor="middle" x="90" y="469.0">crítica</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="434"/>
<text class="sv-t2" text-anchor="middle" x="312" y="452.5">Normativa y dogmática: derechos</text>
<text class="sv-t2" text-anchor="middle" x="312" y="468.5">inalienables, principios republicanos</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="434"/>
<text class="sv-t2" text-anchor="middle" x="602" y="452.5">Inmanente: el capital crea las</text>
<text class="sv-t2" text-anchor="middle" x="602" y="468.5">condiciones de su propia superación</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="484"/>
<text class="sv-t" text-anchor="middle" x="90" y="511.0">Revolución</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="484"/>
<text class="sv-t2" text-anchor="middle" x="312" y="502.5">Democracia revolucionaria jacobina;</text>
<text class="sv-t2" text-anchor="middle" x="312" y="518.5">límite: el proceso constituyente nacional</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="484"/>
<text class="sv-t2" text-anchor="middle" x="602" y="502.5">Continuidad y ruptura: afirmar el trabajo</text>
<text class="sv-t2" text-anchor="middle" x="602" y="518.5">social negando su forma privada</text>
<rect class="sv-soft" height="44" rx="2" width="140" x="20" y="534"/>
<text class="sv-t" text-anchor="middle" x="90" y="561.0">Libertad</text>
<rect class="sv-box" height="44" rx="2" width="275" x="174.5" y="534"/>
<text class="sv-t2" text-anchor="middle" x="312" y="552.5">Independencia civil (sui iuris);</text>
<text class="sv-t2" text-anchor="middle" x="312" y="568.5">de hecho, un «amo justo»</text>
<rect class="sv-box" height="44" rx="2" width="275" x="464.5" y="534"/>
<text class="sv-t2" text-anchor="middle" x="602" y="552.5">«No tener ningún amo»:</text>
<text class="sv-t2" text-anchor="middle" x="602" y="568.5">libertad absoluta</text>
<rect class="sv-soft" height="60" rx="2" width="720" x="20" y="590"/>
<text class="sv-tr" text-anchor="middle" x="380" y="610">toda redistribución presupone una acumulación capitalista exitosa</text>
<text class="sv-t2" text-anchor="middle" x="380" y="627" style="font-size:12px">crítica hegeliana del voluntarismo: «para pagar una renta básica hace falta dinero» que ya circule bajo la lógica capitalista;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="642" style="font-size:12px">la redistribución del valor presupone la creciente explotación del trabajo, no armoniza los antagonismos</text>
</svg>
