<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición entre la Esquerra Independentista con su Unitat Popular y el Movimiento Socialista en nueve filas, precedida por la hipótesis de que la Unitat Popular expresa los intereses de la clase media, y debajo el silogismo tachado opresión nacional, conciencia de clase, socialismo con sus tres refutaciones" role="img" viewBox="0 0 760 748" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-8-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="16"></rect>
<text class="sv-t3" text-anchor="start" x="32" y="32">HIPÓTESIS</text>
<text class="sv-t2" text-anchor="middle" x="400" y="32">la Unitat Popular es una expresión estratégica de los intereses de la clase media;</text>
<text class="sv-t2" text-anchor="middle" x="400" y="48" style="font-size:12px">«nacionalismo revolucionario» es un oxímoron: el nacionalismo subordina al proletariado al Estado y al capital</text>
<rect class="sv-box-red" height="36" rx="2" width="280" x="150" y="68"></rect>
<text class="sv-tr" text-anchor="middle" x="290" y="84">Esquerra Independentista</text>
<text class="sv-t3" text-anchor="middle" x="290" y="98">Unitat Popular</text>
<rect class="sv-box-blue" height="36" rx="2" width="300" x="440" y="68"></rect>
<text class="sv-tb" text-anchor="middle" x="590" y="84">Movimiento Socialista</text>
<text class="sv-t3" text-anchor="middle" x="590" y="98">comunismo como totalidad</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="112"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="139.0">Marco</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="112"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="131.0">tres ejes superpuestos:</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="146.0">nacional · social · género</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="112"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="131.0">totalidad: las opresiones son</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="146.0">encarnaciones del poder burgués</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="162"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="189.0">Sujeto</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="162"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="181.0">«clases populares», nación,</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="196.0">movimiento ancho interclasista</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="162"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="181.0">proletariado como clase</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="196.0">políticamente independiente</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="212"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="239.0">Horizonte</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="212"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="231.0">independencia → socialismo</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="246.0">(etapismo, nación personificada)</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="212"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="231.0">internacionalismo proletario:</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="246.0">«la nacionalidad del trabajador es la del trabajo»</text>
<rect class="sv-soft" height="68" rx="2" width="120" x="20" y="262"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="293.0">Nación y</text>
<text class="sv-t" text-anchor="middle" x="80" y="308.0">cultura</text>
<rect class="sv-box" height="68" rx="2" width="280" x="150" y="262"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="293.0">nación esencializada (coraje, resistencia);</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="308.0">«identidad de país» (Arran, 2018)</text>
<rect class="sv-box" height="68" rx="2" width="300" x="440" y="262"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="279.5" style="font-size:12px">nacionalidad: conciencia de comunidad del</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="293.5" style="font-size:12px">productor de mercancías (Dachevsky); el capital</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="307.5" style="font-size:12px">homogeneiza: acabar con la dominación, no</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="321.5" style="font-size:12px">positivizar una nación</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="336"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="355.0">Relación con</text>
<text class="sv-t" text-anchor="middle" x="80" y="370.0">el Estado</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="336"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="355.0">naturalización, acción institucional,</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="370.0">municipalismo, investiduras</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="336"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="355.0">extinción del Estado;</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="370.0">poder independiente</text>
<rect class="sv-soft" height="56" rx="2" width="120" x="20" y="386"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="411.0">Reformas y</text>
<text class="sv-t" text-anchor="middle" x="80" y="426.0">demandas</text>
<rect class="sv-box" height="56" rx="2" width="280" x="150" y="386"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="404.5" style="font-size:12px">nacen y mueren en la necesidad inmediata:</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="418.5" style="font-size:12px">vía institucional (pactos de la CUP)</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="432.5" style="font-size:12px">o inasumibles (sólo discursivas)</text>
<rect class="sv-box" height="56" rx="2" width="300" x="440" y="386"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="404.5" style="font-size:12px">reformas que evidencian el carácter de clase</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="418.5" style="font-size:12px">del Estado y mejoran las condiciones de lucha,</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="432.5" style="font-size:12px">insertas en una estrategia revolucionaria</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="448"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="467.0">Toma del</text>
<text class="sv-t" text-anchor="middle" x="80" y="482.0">poder</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="448"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="467.0">desgaste defensivo a largo plazo,</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="482.0">ciclos electorales</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="448"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="467.0">construcción de organización comunista:</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="482.0">tesis, capacidades, encuadramiento</text>
<rect class="sv-soft" height="56" rx="2" width="120" x="20" y="498"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="523.0">Movimiento</text>
<text class="sv-t" text-anchor="middle" x="80" y="538.0">popular</text>
<rect class="sv-box" height="56" rx="2" width="280" x="150" y="498"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="516.5" style="font-size:12px">militantes «enviados» a colectivos locales</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="530.5" style="font-size:12px">para ganar popularidad; consignas</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="544.5" style="font-size:12px">marcadas por los ciclos electorales</text>
<rect class="sv-box" height="56" rx="2" width="300" x="440" y="498"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="516.5" style="font-size:12px">socializar las tesis comunistas y</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="530.5" style="font-size:12px">desarrollar espacios de</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="544.5" style="font-size:12px">encuadramiento político</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="560"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="587.0">Identidad</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="560"></rect>
<text class="sv-t2" text-anchor="middle" x="290.0" y="579.0">nacionalismo + obrerismo</text>
<text class="sv-t2" text-anchor="middle" x="290.0" y="594.0">(identidades a perpetuar)</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="560"></rect>
<text class="sv-t2" text-anchor="middle" x="590.0" y="579.0">la clase como relación a superar:</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="594.0">libre asociación</text>
<text class="sv-t3" text-anchor="start" x="20" y="624">EL SILOGISMO QUE SE DERRUMBA · «la independencia facilita el socialismo»</text>
<rect class="sv-box" height="40" rx="2" width="170" x="60" y="632"></rect>
<text class="sv-t" text-anchor="middle" x="145" y="656">Opresión nacional</text>
<rect class="sv-box" height="40" rx="2" width="170" x="295" y="632"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="656">Conciencia de clase</text>
<rect class="sv-box" height="40" rx="2" width="170" x="530" y="632"></rect>
<text class="sv-t" text-anchor="middle" x="615" y="656">Socialismo</text>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="230" x2="295" y1="652" y2="652"></line>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="465" x2="530" y1="652" y2="652"></line>
<line class="sv-line-red" x1="50" x2="710" y1="680" y2="624"></line>
<text class="sv-tr" text-anchor="middle" x="380" y="698">1 · la independencia crea un nuevo Estado burgués (coercitivo) en competencia interestatal</text>
<text class="sv-tr" text-anchor="middle" x="380" y="715" style="font-size:12.5px">2 · conciencia nacional ≠ conciencia de clase (cientos de miles de trabajadores catalanes; el caso del País Valenciano)</text>
<text class="sv-tr" text-anchor="middle" x="380" y="732" style="font-size:11.5px">3 · las independencias las lideran clases emergentes que buscan un mercado propio; ninguna independencia histórica derivó en un Estado socialista</text>
</svg>
