<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: la lectura de la Tesis XI como primado de la razón práctica y la crítica de Adorno al visado práctico. Tres posiciones sobre la relación entre teoría y praxis: dualismo absoluto del positivismo, identidad inmediata del activismo y, en el centro, la discontinuidad o tensión máxima de Adorno, con una flecha de ida y vuelta entre teoría y praxis verdadera. Dos notas: el respiro de la teoría (la filosofía sigue viva porque se dejó pasar el momento de su realización) y la respuesta al Gran Hotel Abismo (pensar es un hacer; falsa actividad según Žižek). Debajo, la cadena principio de intercambio, pensamiento identificante, pensamiento cosificado y praxis ilusoria, fundada en la identidad como protoforma de la ideología, y la conclusión: sólo en la máxima tensión, praxis dinamizadora y teoría sin engaños." role="img" viewBox="0 0 760 790" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: LA TESIS XI LEÍDA COMO PRIMADO DE LA RAZÓN PRÁCTICA</text>
<rect class="sv-soft" height="88" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">Lectura habitual de la undécima tesis sobre Feuerbach como «punto sin retorno»: consumación práctica inmediata de la teoría (la lechuza</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">de Minerva sólo vuela si al amanecer exhorta el canto del gallo galo). Adorno se opone al «visado práctico» exigido a toda teoría: la</text>
<text class="sv-t2" style="font-size:12px" x="30" y="71">degrada «al papel de criada», idealiza su carácter instrumental, apologiza la objetividad social como segunda naturaleza (la primera</text>
<text class="sv-t2" style="font-size:12px" x="30" y="86">naturaleza como «sustrato de su dominación») y mutila el pensamiento con fines operativos. Todo pensamiento tiene un telos práctico,</text>
<text class="sv-t2" style="font-size:12px" x="30" y="101">pero no debe imponérsele deliberadamente: la acción inmediata como fin de toda teoría degenera en un ejercicio falto de concepto.</text>
<text class="sv-t3" x="20" y="138">TRES POSICIONES Y UNA TENSIÓN</text>
<rect class="sv-box" height="92" rx="2" width="220" x="20" y="148"></rect>
<text class="sv-t" text-anchor="middle" x="130.0" y="176.5">Dualismo absoluto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130.0" y="193.5">positivismo: teoría y praxis</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130.0" y="208.5">separadas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130.0" y="223.5">el mundo objetivo «está ahí» como Otro</text>
<rect class="sv-box-green" height="92" rx="2" width="220" x="270" y="148"></rect>
<text class="sv-tgr" text-anchor="middle" x="380.0" y="176.2">Discontinuidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="192.8">tensión máxima (Adorno):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="207.8">no-identidad en la identidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="222.8">ni uno ni absolutamente distintas</text>
<rect class="sv-box-red" height="92" rx="2" width="220" x="520" y="148"></rect>
<text class="sv-tr" text-anchor="middle" x="630.0" y="176.2">Identidad inmediata</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630.0" y="192.8">idealismo subjetivo / activismo:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630.0" y="207.8">la teoría como criada</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630.0" y="222.8">objetividad constituida por el sujeto</text>
<line class="sv-line-dash" x1="240" x2="270" y1="194.0" y2="194.0"></line>
<line class="sv-line-dash" x1="490" x2="520" y1="194.0" y2="194.0"></line>
<text class="sv-t2" style="font-size:11.5px" text-anchor="start" x="20" y="257">dualidad e identidad no fundan una antítesis superior:</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="start" x="20" y="271">son compatibles (el objeto como obstáculo a superar)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="end" x="740" y="257">invertir las tornas no arregla nada: el divorcio</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="end" x="740" y="271">aplaza la consumación práctica de la teoría</text>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="380" x2="380" y1="240" y2="286"></line>
<rect class="sv-box-blue" height="76" rx="2" width="220" x="130" y="286"></rect>
<text class="sv-tb" text-anchor="middle" x="240.0" y="306.2">Teoría</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="240.0" y="322.8">figura no idéntica de la praxis</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="240.0" y="337.8">condición de la praxis y momento</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="240.0" y="352.8">abstraído de la praxis social</text>
<rect class="sv-box-blue" height="76" rx="2" width="220" x="410" y="286"></rect>
<text class="sv-tb" text-anchor="middle" x="520.0" y="306.2">Praxis verdadera</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="520.0" y="322.8">en relación con las tensiones objetivas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="520.0" y="337.8">analiza los factores que reproducen</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="520.0" y="352.8">la realidad fáctica</text>
<line class="sv-line-red" marker-end="url(#m1-6-arrow)" marker-start="url(#m1-6-arrow)" x1="350" x2="410" y1="324.0" y2="324.0"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="384">la contemplación es un momento de la praxis; pensar es un hacer</text>
<text class="sv-t3" x="20" y="402">POR QUÉ LA TEORÍA TIENE UN «RESPIRO»</text>
<text class="sv-t3" x="390" y="402">CONTRA EL «GRAN HOTEL ABISMO» (LUKÁCS)</text>
<rect class="sv-soft" height="100" rx="2" width="350" x="20" y="410"></rect>
<rect class="sv-soft" height="100" rx="2" width="350" x="390" y="410"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="427.0">Lo desesperado de una situación en que la praxis necesaria está</text>
<text class="sv-t2" style="font-size:12px" x="30" y="441.5">deformada da al pensamiento «un respiro que sería un crimen</text>
<text class="sv-t2" style="font-size:12px" x="30" y="456.0">práctico no aprovechar». «La filosofía sigue viva porque se dejó</text>
<text class="sv-t2" style="font-size:12px" x="30" y="470.5">pasar el momento de su realización». Las teorías no concebidas</text>
<text class="sv-t2" style="font-size:12px" x="30" y="485.0">con miras a su aplicación son las más fructíferas en la práctica.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="499.5">Del hechizo de la praxis sólo se escapa mediante la praxis.</text>
<text class="sv-t2" style="font-size:12px" x="400" y="427.0">Pensar es un hacer: la teoría es praxis social inserta en los</text>
<text class="sv-t2" style="font-size:12px" x="400" y="441.5">conflictos de su tiempo. Frente a Aristóteles, Adorno acentúa</text>
<text class="sv-t2" style="font-size:12px" x="400" y="456.0">el carácter práctico de la suspensión práctica. Žižek: actuar</text>
<text class="sv-t2" style="font-size:12px" x="400" y="470.5">puede ser una manera de no actuar (falsa actividad del neurótico</text>
<text class="sv-t2" style="font-size:12px" x="400" y="485.0">obsesivo); la urgencia es el momento para reflexionar. Concepto</text>
<text class="sv-t2" style="font-size:12px" x="400" y="499.5">enfático de experiencia: entender por qué se pasó el instante.</text>
<text class="sv-t3" x="20" y="540">CADENA DE CORRESPONDENCIAS · FUNDAMENTO: LA IDENTIDAD ES LA PROTOFORMA DE LA IDEOLOGÍA</text>
<rect class="sv-box" height="80" rx="2" width="160" x="20" y="550"></rect>
<text class="sv-t" text-anchor="middle" x="100.0" y="572.0">Principio de</text>
<text class="sv-t" text-anchor="middle" x="100.0" y="588.0">intercambio</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100.0" y="605.0">iguala lo desigual: del</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100.0" y="620.0">valor de uso al valor</text>
<rect class="sv-box" height="80" rx="2" width="160" x="200" y="550"></rect>
<text class="sv-t" text-anchor="middle" x="280.0" y="572.0">Pensamiento</text>
<text class="sv-t" text-anchor="middle" x="280.0" y="588.0">identificante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280.0" y="605.0">adaequatio del concepto;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280.0" y="620.0">anula las diferencias</text>
<rect class="sv-box-red" height="80" rx="2" width="160" x="380" y="550"></rect>
<text class="sv-tr" text-anchor="middle" x="460.0" y="572.0">Pensamiento</text>
<text class="sv-tr" text-anchor="middle" x="460.0" y="587.5">cosificado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460.0" y="604.0">programa instrumental</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460.0" y="619.0">para la acción</text>
<rect class="sv-box-red" height="80" rx="2" width="160" x="580" y="550"></rect>
<text class="sv-tr" text-anchor="middle" x="660.0" y="572.2">Praxis ilusoria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="660.0" y="588.8">activismo irreflexivo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="660.0" y="603.8">pseudo-actividad que</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="660.0" y="618.8">refuerza el hechizo</text>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="180" x2="200" y1="590.0" y2="590.0"></line>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="360" x2="380" y1="590.0" y2="590.0"></line>
<line class="sv-line-red" marker-end="url(#m1-6-arrow)" marker-start="url(#m1-6-arrow)" x1="540" x2="580" y1="590.0" y2="590.0"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="652">iguala lo desigual → anula las diferencias → programa instrumental ↔ pseudo-actividad</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="380" y="668">la identidad imita la falsa identidad de sujeto y objeto y perpetúa «el principio del sojuzgamiento» contra el que lucha la praxis verdadera</text>
<rect class="sv-box-green" height="56" rx="2" width="720" x="20" y="684"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="706">Sólo en la máxima tensión dialéctica entre teoría y praxis: una praxis dinamizadora y una teoría sin engaños</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="726">«si teoría y praxis no son inmediatamente uno, ni absolutamente distintas, entonces su relación es una relación de discontinuidad»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="762">flecha doble de color: relación de ida y vuelta (tensión, correspondencia) · flecha gris: paso o consecuencia</text>
<text class="sv-t3" text-anchor="middle" x="380" y="778">línea discontinua: los dos polos rechazados a ambos lados de la posición adorniana</text>
</svg>
