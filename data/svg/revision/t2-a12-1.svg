<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, las dos definiciones analíticas de Hägglund: socialdemocracia como redistribución sin tocar la producción de valor y socialismo democrático como revaluación revolucionaria del valor. A la izquierda, pirámide de dependencia: la producción de valor capitalista sostiene la riqueza disponible, que sostiene el Estado de bienestar y la renta básica, con un bucle de retroalimentación negativa y la crisis de los 70; a la derecha, matriz que muestra que neoliberalismo y socialdemocracia solo tocan la distribución, mientras el socialismo democrático toca también la producción de valor, con la renta básica universal como síntoma y la conclusión: redistribuir no es criticar el capitalismo" role="img" viewBox="0 0 760 712" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-12-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="106" rx="2" width="720" x="20" y="12"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="32">Dos definiciones analíticas (Hägglund, Esta vida)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50" style="font-size:11.5px">Socialdemocracia: toda forma de socialismo o marxismo que se limita a la redistribución sin lidiar con la producción de valor</text>
<text class="sv-t2" text-anchor="middle" x="380" y="65" style="font-size:11.5px">Socialismo democrático: la noción marxiana de comunismo; exige la revaluación revolucionaria del valor (abolir el trabajo</text>
<text class="sv-t2" text-anchor="middle" x="380" y="80" style="font-size:11.5px">asalariado y transformar cómo nos reproducimos material, social e institucionalmente), sólo posible superando el capitalismo</text>
<text class="sv-t2" text-anchor="middle" x="380" y="96" style="font-size:11px">«valor» aquí no es el tiempo de trabajo al que nos somete el capitalismo, sino lo que colectivamente consideramos que merece la pena;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="110" style="font-size:11px">la medida capitalista del valor es una forma de dominación y alienación social que debe superarse para una vida emancipada</text>
<text class="sv-t" text-anchor="start" x="20" y="152">Dependencia asimétrica</text>
<text class="sv-t3" text-anchor="start" x="20" y="170">el bienestar depende del capitalismo,</text>
<text class="sv-t3" text-anchor="start" x="20" y="184">no el capitalismo del bienestar</text>
<rect class="sv-box-red" height="96" rx="2" width="300" x="30" y="200"></rect>
<text class="sv-tr" text-anchor="middle" x="180" y="222">Estado de bienestar / renta básica</text>
<text class="sv-t2" text-anchor="middle" x="180" y="240" style="font-size:11.5px">conquista del capitalismo «blando» del siglo XX</text>
<text class="sv-t2" text-anchor="middle" x="180" y="254" style="font-size:11.5px">Suecia: sanidad, guarderías y educación gratuitas</text>
<text class="sv-t2" text-anchor="middle" x="180" y="268" style="font-size:11.5px">fruto de la organización obrera desde el siglo XIX</text>
<text class="sv-t2" text-anchor="middle" x="180" y="282" style="font-size:11px">y del crecimiento post-1945; sólo toca la distribución</text>
<rect class="sv-box" height="56" rx="2" width="270" x="45" y="330"></rect>
<text class="sv-t" text-anchor="middle" x="180" y="352">Riqueza disponible</text>
<text class="sv-t2" text-anchor="middle" x="180" y="370" style="font-size:11px">generada por la explotación del trabajo asalariado</text>
<rect class="sv-box-ink" height="130" rx="2" width="320" x="20" y="420"></rect>
<text class="sv-tw" text-anchor="middle" x="180" y="442">Producción de valor capitalista</text>
<text class="sv-tw" text-anchor="middle" x="180" y="460" style="font-size:12px">trabajo asalariado para el beneficio</text>
<text class="sv-tw" text-anchor="middle" x="180" y="478" style="font-size:10.5px">prioridad del beneficio inscrita en la medida de la riqueza</text>
<text class="sv-tw" text-anchor="middle" x="180" y="492" style="font-size:10.5px">(no en los tejemanejes de una élite); el fin de la economía</text>
<text class="sv-tw" text-anchor="middle" x="180" y="506" style="font-size:10.5px">queda fuera de toda deliberación democrática</text>
<text class="sv-tw" text-anchor="middle" x="180" y="522" style="font-size:10.5px">la medida valora el trabajo socialmente necesario, no el</text>
<text class="sv-tw" text-anchor="middle" x="180" y="536" style="font-size:10.5px">tiempo libre disponible; exige desempleo y tiende a la crisis</text>
<line class="sv-line" marker-end="url(#m2-12-arrow)" x1="180" x2="180" y1="420" y2="386"></line>
<text class="sv-t3" text-anchor="start" x="190" y="407">financia</text>
<line class="sv-line" marker-end="url(#m2-12-arrow)" x1="180" x2="180" y1="330" y2="296"></line>
<text class="sv-t3" text-anchor="start" x="190" y="317">financia</text>
<path class="sv-line-dash" d="M330 248 H362 V485 H342" marker-end="url(#m2-12-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="366" y="370" style="font-size:10px">bucle</text>
<text class="sv-t3" text-anchor="middle" x="180" y="572" style="font-size:10.5px">Bucle de retroalimentación negativa (línea discontinua)</text>
<text class="sv-t2" text-anchor="middle" x="180" y="588" style="font-size:11px">cuanto menos se explotan nuestras vidas para el beneficio,</text>
<text class="sv-t2" text-anchor="middle" x="180" y="602" style="font-size:11px">menos riqueza queda para financiar bienestar y RBU:</text>
<text class="sv-t2" text-anchor="middle" x="180" y="616" style="font-size:11px">contradicción práctica inevitable → degeneración o disolución</text>
<text class="sv-t3" text-anchor="middle" x="180" y="636" style="font-size:10.5px">Crisis de los 70: menos riqueza a distribuir</text>
<text class="sv-t2" text-anchor="middle" x="180" y="652" style="font-size:11px">se imponen las estrategias neoliberales para relanzar la</text>
<text class="sv-t2" text-anchor="middle" x="180" y="666" style="font-size:11px">acumulación (mercado: desregulación financiera, privatizaciones, recortes);</text>
<text class="sv-t2" text-anchor="middle" x="180" y="680" style="font-size:11px">pero el derrumbe del bienestar no se debe sólo a la ideología neoliberal:</text>
<text class="sv-t2" text-anchor="middle" x="180" y="694" style="font-size:11px">tratarla como causa impide entender el sistema económico</text>
<text class="sv-t" text-anchor="middle" x="570" y="152">¿Qué transforma cada posición?</text>
<text class="sv-t3" text-anchor="middle" x="547" y="182">la distribución</text>
<text class="sv-t3" text-anchor="middle" x="547" y="196">de la riqueza</text>
<text class="sv-t3" text-anchor="middle" x="677" y="182">la producción</text>
<text class="sv-t3" text-anchor="middle" x="677" y="196">(medida) del valor</text>
<text class="sv-t2" text-anchor="end" x="478" y="248">Neoliberalismo</text>
<rect class="sv-box-green" height="66" rx="2" width="125" x="485" y="210"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="234">sí</text>
<text class="sv-t3" text-anchor="middle" x="547" y="251" style="font-size:10px">desregulación,</text>
<text class="sv-t3" text-anchor="middle" x="547" y="265" style="font-size:10px">privatizaciones</text>
<rect class="sv-box-red" height="66" rx="2" width="125" x="615" y="210"></rect>
<text class="sv-tr" text-anchor="middle" x="677" y="248">no</text>
<text class="sv-t2" text-anchor="end" x="478" y="316">Social-</text>
<text class="sv-t2" text-anchor="end" x="478" y="330">democracia</text>
<rect class="sv-box-green" height="66" rx="2" width="125" x="485" y="286"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="310">sí</text>
<text class="sv-t3" text-anchor="middle" x="547" y="327" style="font-size:10px">Estado de bienestar,</text>
<text class="sv-t3" text-anchor="middle" x="547" y="341" style="font-size:10px">RBU: redistribuye</text>
<rect class="sv-box-red" height="66" rx="2" width="125" x="615" y="286"></rect>
<text class="sv-tr" text-anchor="middle" x="677" y="324">no</text>
<text class="sv-t2" text-anchor="end" x="478" y="392">Socialismo</text>
<text class="sv-t2" text-anchor="end" x="478" y="406">democrático</text>
<rect class="sv-box-green" height="66" rx="2" width="125" x="485" y="362"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="400">sí</text>
<rect class="sv-box-green" height="66" rx="2" width="125" x="615" y="362"></rect>
<text class="sv-tgr" text-anchor="middle" x="677" y="386">sí: revaluación</text>
<text class="sv-t3" text-anchor="middle" x="677" y="403" style="font-size:10px">del valor;</text>
<text class="sv-t3" text-anchor="middle" x="677" y="417" style="font-size:10px">abolir el salariado</text>
<rect class="sv-line-dash" height="146" rx="2" width="133" x="611" y="206"></rect>
<text class="sv-t3" text-anchor="middle" x="612" y="448">neoliberalismo y socialdemocracia comparten</text>
<text class="sv-t3" text-anchor="middle" x="612" y="462">la misma contradicción del valor</text>
<rect class="sv-soft" height="118" rx="2" width="340" x="400" y="480"></rect>
<text class="sv-t3" text-anchor="middle" x="570" y="498" style="font-size:10.5px">La renta básica universal como síntoma</text>
<text class="sv-t2" text-anchor="middle" x="570" y="514" style="font-size:11px">revela los límites de toda política socialdemócrata:</text>
<text class="sv-t2" text-anchor="middle" x="570" y="528" style="font-size:11px">nunca cuestiona la medida ni la producción del valor</text>
<text class="sv-t2" text-anchor="middle" x="570" y="544" style="font-size:11px">llamarla solución al trabajo asalariado es «peligrosamente</text>
<text class="sv-t2" text-anchor="middle" x="570" y="558" style="font-size:11px">engañoso»: depende por completo de él (redistribuye riqueza</text>
<text class="sv-t2" text-anchor="middle" x="570" y="572" style="font-size:11px">generada por el salariado) y perpetúa esa dependencia;</text>
<text class="sv-t2" text-anchor="middle" x="570" y="586" style="font-size:11px">ninguna renta básica nos libra de la explotación</text>
<text class="sv-t3" text-anchor="middle" x="570" y="630" style="font-size:10.5px">Conclusión</text>
<text class="sv-t2" text-anchor="middle" x="570" y="648" style="font-size:11.5px">«Criticar la distribución actual de la riqueza capitalista</text>
<text class="sv-t2" text-anchor="middle" x="570" y="663" style="font-size:11.5px">—y defender su redistribución—</text>
<text class="sv-t2" text-anchor="middle" x="570" y="678" style="font-size:11.5px">no es una crítica del capitalismo»</text>
<text class="sv-t2" text-anchor="middle" x="570" y="696" style="font-size:11px">la emancipación exige revaluar el valor y superar el capitalismo</text>
</svg>
