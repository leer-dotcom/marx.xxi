<svg xmlns="http://www.w3.org/2000/svg" aria-label="Marco superior: la relación orgánica entre capital y Estado (Estado político separado, Artous). Cadena causal en dos niveles. Nivel global: acumulación mundial, centro y periferia, transferencia de valor al centro, imposibilidad de compensar con productividad, superexplotación y profundización neoliberal. Nivel de la ciudadanía: ciudadanía marshalliana, neoliberalización, despojo de derechos sociales con deuda e individuación, derechos civiles y políticos formales y anticiudadanía. Una flecha de salida apunta a la ciudadanía sustantiva centrada en lo común. Leyenda de líneas al pie." role="img" viewBox="0 0 760 674" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-13-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="62" rx="2" width="720" x="20" y="18"></rect>
<text class="sv-t" x="30" y="40">MARCO · LA RELACIÓN ORGÁNICA ENTRE CAPITAL Y ESTADO</text>
<text class="sv-t2" style="font-size:12px" x="30" y="57">soberanía cristalizada en el «Estado político separado»: Estado representativo fundado en el enunciado</text>
<text class="sv-t2" style="font-size:12px" x="30" y="72">«real e imaginario» de la ciudadanía igualitaria (Artous); centro–periferia: relaciones de clase mediadas por Estados (Salama)</text>
<text class="sv-t3" x="20" y="100">NIVEL GLOBAL: LA DEPENDENCIA</text>
<rect class="sv-box" height="76" rx="2" width="220" x="20" y="110"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="132">Acumulación a escala mundial</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="148">constituye a la vez Estados-nación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="162">centrales y periféricos; en la periferia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="176">el Estado deriva del capital mundial</text>
<rect class="sv-box" height="76" rx="2" width="220" x="270" y="110"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="132">Centro / periferia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="148">unidad diferenciada (Osorio)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="162">capitalismo desarrollado y dependiente:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="176">éste se expande como reflejo de aquél</text>
<rect class="sv-box-gold" height="76" rx="2" width="220" x="520" y="110"></rect>
<text class="sv-tg" text-anchor="middle" x="630" y="132">Transferencia de valor</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="148">al centro (intercambio desigual)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="162">parte del plusvalor producido en la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="176">periferia se acumula en el centro</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="240" x2="270" y1="148" y2="148"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="490" x2="520" y1="148" y2="148"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="630" x2="630" y1="186" y2="214"></line>
<rect class="sv-box" height="92" rx="2" width="220" x="520" y="214"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="236">No puede compensar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="252">baja composición orgánica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="266">y dependencia tecnológica: no cabe</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="280">elevar la productividad para frenar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="294">la transferencia (Carcanholo, Osorio)</text>
<rect class="sv-box-red" height="92" rx="2" width="220" x="270" y="214"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="236">Superexplotación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="252">jornada, intensidad, salario bajo el valor</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="266">expropiación del trabajo necesario;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="280">salarios que no siguen el valor;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="294">ejército de reserva; fondo de consumo</text>
<rect class="sv-box" height="92" rx="2" width="220" x="20" y="214"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="236">El neoliberalismo la profundiza</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="252">privatización, reprimarización</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="266">extranjerización y apertura externa;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="280">financiarización, desindustrialización,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="294">precarización y vulnerabilidad externa</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="520" x2="490" y1="252" y2="252"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="270" x2="240" y1="252" y2="252"></line>
<path class="sv-line-dash" marker-end="url(#m1-13-arrow)" d="M130 306 V336 H380 V366"></path>
<text class="sv-t3" x="140" y="328">restauración del poder de clase</text>
<text class="sv-t3" x="20" y="356">NIVEL DE LA CIUDADANÍA</text>
<rect class="sv-box-blue" height="92" rx="2" width="220" x="20" y="366"></rect>
<text class="sv-tb" text-anchor="middle" x="130" y="388">Ciudadanía marshalliana</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="404">1930-1970: derechos sociales</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="418">ciclo keynesiano-desarrollista;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="432">integra derechos sociales pero</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="446">reafirma la lógica del capital</text>
<rect class="sv-box" height="92" rx="2" width="220" x="270" y="366"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="388">Neoliberalización</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="404">desde 1973 (Harvey, Garretón)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="418">nuevo patrón de acumulación y modelo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="432">de civilización; Estado mínimo para los</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="446">subalternos, fuerte para el capital</text>
<rect class="sv-box" height="92" rx="2" width="220" x="520" y="366"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="388">Despojo + deuda + individuación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="404">empresario de sí (Lazzarato)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="418">desposesión (Harvey); Estado subsidiario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="432">«todos son deudores»: acreedor / deudor;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="446">libertad negativa y autorresponsabilidad</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="240" x2="270" y1="404" y2="404"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="490" x2="520" y1="404" y2="404"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="630" x2="630" y1="458" y2="486"></line>
<rect class="sv-box" height="92" rx="2" width="220" x="520" y="486"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="508">Derechos civiles y políticos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="524">formales sin los sociales</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="538">regresión respecto a la tesis tripartita</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="552">de Marshall: sin derechos sociales no se</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="566">puede disputar el poder de las élites</text>
<rect class="sv-box-red" height="92" rx="2" width="220" x="270" y="486"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="508">Anticiudadanía</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="524">incompatible incluso con el liberalismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="538">anula el ideal liberal de Marshall;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="552">los Estados periféricos, engranaje de la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="566">acumulación: políticas compensatorias</text>
<rect class="sv-box-green" height="92" rx="2" width="220" x="20" y="486"></rect>
<text class="sv-tgr" text-anchor="middle" x="130" y="508">Ciudadanía sustantiva</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="524">interdependencia en lo común</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="538">imposible bajo la lógica del capital;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="552">el siglo XX no la conoció (proyectos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="566">de propiedad estatal); por construir</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="520" x2="490" y1="524" y2="524"></line>
<line class="sv-line-red" marker-end="url(#m1-13-arrow)" x1="270" x2="240" y1="524" y2="524"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="606">salida: fuera de la lógica del intercambio y de la propiedad estatal, desde el sur</text>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="618"></rect>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="34" x2="64" y1="634" y2="634"></line>
<text class="sv-t3" x="72" y="638">encadenamiento causal</text>
<line class="sv-line-dash" marker-end="url(#m1-13-arrow)" x1="240" x2="270" y1="634" y2="634"></line>
<text class="sv-t3" x="278" y="638">del nivel global al de la ciudadanía</text>
<line class="sv-line-red" marker-end="url(#m1-13-arrow)" x1="530" x2="560" y1="634" y2="634"></line>
<text class="sv-t3" x="568" y="638">salida fuera del capital</text>
</svg>
