<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: lo real como intimidación, la economía como su saber y el realismo capitalista, con la caverna de Platón. Debajo, diagrama en capas tipo máscara sobre lo real: el emblema democrático, el semblante de la democracia parlamentaria (orientaciones, gran centro blando, voto del miedo, endogamia democrática) y el real capitalista. Una flecha vertical, el acontecimiento que divide el semblante, atraviesa las capas y conduce a un recuadro de salida: la hipótesis comunista, con sus elementos, su sujeto, el aristocratismo para todos, un solo mundo y la democracia como igualdad." role="img" viewBox="0 0 760 596" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-12-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="72" rx="2" width="720" x="20" y="18"></rect>
<text class="sv-t" x="30" y="40">PUNTO DE PARTIDA · LO REAL COMO INTIMIDACIÓN</text>
<text class="sv-t2" style="font-size:12px" x="30" y="58">lo real se impone y parece imposible pensar más allá; la economía es la «ciencia» que detenta su saber: lo real es el capitalismo;</text>
<text class="sv-t2" style="font-size:12px" x="30" y="73">realismo capitalista (Fisher): no se imagina alternativa; caverna de Platón: salir exige reconocer lo real del semblante y dividirlo</text>
<rect class="sv-box-gold" height="106" rx="2" width="470" x="20" y="110"></rect>
<text class="sv-tg" x="30" y="132">CAPA 1 · EMBLEMA DEMOCRÁTICO</text>
<text class="sv-t2" x="30" y="152">lo intocable del sistema simbólico; legitima todo en su nombre;</text>
<text class="sv-t2" x="30" y="168">demócrata egoísta, juventud eterna, «diviértanse», presente hipostasiado;</text>
<text class="sv-t2" x="30" y="184">«opinión autoritaria» frente a la que la filosofía debe ser crítica</text>
<text class="sv-t2" style="font-size:12px" x="30" y="202">mundo de sustituibilidad universal, sin verdadera lógica ni mundo</text>
<rect class="sv-box-blue" height="178" rx="2" width="470" x="20" y="232"></rect>
<text class="sv-tb" x="30" y="254">CAPA 2 · SEMBLANTE: DEMOCRACIA PARLAMENTARIA</text>
<text class="sv-t2" x="30" y="274">alternancia dentro del capital; cuatro orientaciones y «gran centro blando»;</text>
<text class="sv-t2" x="30" y="290">neutralización de la alteridad fuerte; voto del miedo (esencial y derivado):</text>
<text class="sv-t2" x="30" y="306">el voto como operación del Estado, el miedo valida al Estado;</text>
<text class="sv-t2" x="30" y="322">frontera entre mundo democrático y «antidemocrático»: el canalla es el otro</text>
<text class="sv-t2" style="font-size:12px" x="30" y="340">dos partidos de gobierno (no se tocará el capital) + extrema izquierda moderada</text>
<text class="sv-t2" style="font-size:12px" x="30" y="355">+ extrema derecha identitaria; miedo esencial (privilegiados ante la alteridad)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="370">y miedo derivado (temor al primero): «toda cadena de miedos conduce a la nada»;</text>
<text class="sv-t2" style="font-size:12px" x="30" y="385">terror democrático encubierto; endogamia: «un demócrata quiere únicamente a</text>
<text class="sv-t2" style="font-size:12px" x="30" y="400">otro demócrata» (papeles, fronteras, integración exigida); Derrida: Canallas</text>
<rect class="sv-box-ink" height="108" rx="2" width="470" x="20" y="426"></rect>
<text class="sv-tw" x="30" y="448">CAPA 3 · REAL CAPITALISTA</text>
<text class="sv-tw" x="30" y="468">negocios e intereses, no buenas intenciones; saqueo imperial;</text>
<text class="sv-tw" x="30" y="484">crisis y corrupción inherentes desde el origen;</text>
<text class="sv-tw" x="30" y="500">mundialización que une objetos y signos y divide a los cuerpos</text>
<text class="sv-tw" style="font-size:12px" x="30" y="518">«democracia imaginaria»: obra que el capital interpreta; sujeta a él desde el origen</text>
<line class="sv-line-red" marker-end="url(#m1-12-arrow)" x1="520" x2="520" y1="534" y2="118"></line>
<text class="sv-tr" text-anchor="middle" x="520" y="562">acontecimiento político (violento, no falsa división):</text>
<text class="sv-t2" text-anchor="middle" x="520" y="578">dividir el semblante, arrancar la máscara</text>
<line class="sv-line-red" marker-end="url(#m1-12-arrow)" x1="520" x2="550" y1="250" y2="250"></line>
<rect class="sv-box-green" height="356" rx="2" width="190" x="550" y="110"></rect>
<text class="sv-tgr" text-anchor="middle" x="645" y="134">Hipótesis comunista</text>
<text class="sv-t2" text-anchor="middle" x="645" y="158">fin del capitalismo</text>
<text class="sv-t2" text-anchor="middle" x="645" y="174">desprivatizar la producción</text>
<text class="sv-t2" text-anchor="middle" x="645" y="190">extinción del Estado</text>
<text class="sv-t2" text-anchor="middle" x="645" y="206">fin de la división</text>
<text class="sv-t2" text-anchor="middle" x="645" y="220">manual / intelectual</text>
<text class="sv-t2" text-anchor="middle" x="645" y="242">sujeto no prefijado,</text>
<text class="sv-t2" text-anchor="middle" x="645" y="256">internacionalista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="270">y con visión estratégica global,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="285">sin separarse del movimiento</text>
<text class="sv-t2" text-anchor="middle" x="645" y="308">aristocratismo para todos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="322">(los guardianes de Platón)</text>
<text class="sv-t2" text-anchor="middle" x="645" y="344">«existe un solo mundo»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="358">(principio contra muros y guerras)</text>
<text class="sv-t2" text-anchor="middle" x="645" y="380">democracia = igualdad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="394">(conservar un uso positivo)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="645" y="416">crítica con las experiencias pasadas;</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="645" y="431">necesaria incluso para el reformismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="645" y="446">(acuerdo Badiou–Gauchet)</text>
</svg>
