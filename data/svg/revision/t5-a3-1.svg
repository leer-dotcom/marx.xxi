<svg xmlns="http://www.w3.org/2000/svg" aria-label="Matriz de las tres posiciones socialistas ante la cuestión colonial —indiferentista, etapista o multipolarista e independencia política— con su tesis, su ejemplo histórico, su resultado y su forma actual ante Palestina e Irán, y debajo las tareas desde el centro imperialista" role="img" viewBox="0 0 760 540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect class="sv-box" height="44" rx="2" width="220" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="41">Posición indiferentista</text>
<rect class="sv-box-gold" height="44" rx="2" width="220" x="270" y="14"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="34">Posición etapista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50">hoy: multipolarismo</text>
<rect class="sv-box-red" height="44" rx="2" width="220" x="520" y="14"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="41">Independencia política</text>
<rect class="sv-box" height="72" rx="2" width="220" x="20" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="130" y="103">la opresión nacional no pesa;</text>
<text class="sv-t2" text-anchor="middle" x="130" y="118">solo cuenta la lucha de clases «pura»</text>
<text class="sv-t2" text-anchor="middle" x="130" y="133">(economismo imperialista)</text>
<rect class="sv-box-gold" height="72" rx="2" width="220" x="270" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="380" y="103">primero la liberación nacional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="118">con la burguesía nacional,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="133">después el socialismo</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="630" y="103">fuerza proletaria propia;</text>
<text class="sv-t2" text-anchor="middle" x="630" y="118">alianzas parciales sin ceder</text>
<text class="sv-t2" text-anchor="middle" x="630" y="133">la dirección ni frentes permanentes</text>
<rect class="sv-box" height="72" rx="2" width="220" x="20" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="130" y="185">tratar Palestina como choque</text>
<text class="sv-t2" text-anchor="middle" x="130" y="200">entre Estados capitalistas</text>
<text class="sv-t2" text-anchor="middle" x="130" y="215">y no como lucha anticolonial</text>
<rect class="sv-box-gold" height="72" rx="2" width="220" x="270" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="380" y="185">frente único antimperialista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="200">(IV Congreso, 1922): Turquía,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="215">China, Irán 1979 (Tudeh)</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="152"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="168">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="630" y="185">tesis Lenin–Roy (1920);</text>
<text class="sv-t2" text-anchor="middle" x="630" y="200">China, Cuba y Vietnam triunfaron</text>
<text class="sv-t2" text-anchor="middle" x="630" y="215">contra el comunismo oficial</text>
<rect class="sv-box" height="72" rx="2" width="220" x="20" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="130" y="267">impotencia; alimenta</text>
<text class="sv-t" text-anchor="middle" x="130" y="282">a los socialimperialistas</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="130" y="298">hace el juego al imperialismo</text>
<rect class="sv-box-gold" height="72" rx="2" width="220" x="270" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="380" y="267">subordinación o aniquilamiento</text>
<text class="sv-t" text-anchor="middle" x="380" y="282">de los comunistas</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="298">ceder la dirección de una etapa: renuncia</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="234"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="250">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="630" y="267">enlaza anticolonialismo</text>
<text class="sv-t" text-anchor="middle" x="630" y="282">y socialismo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="630" y="298">antimperialismo proletario y socialista</text>
<rect class="sv-box" height="100" rx="2" width="220" x="20" y="316"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="332">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="349">ante la agresión a Irán: no adaptar</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="364">la táctica, «indiferentismo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="379">impotente y cómplice»;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="394">no reconocer el peso de la</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="409">dominación colonial y semicolonial</text>
<rect class="sv-box-gold" height="100" rx="2" width="220" x="270" y="316"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="332">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="349">sin bloque socialista que empuje</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="364">las luchas anticoloniales; un mundo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="379">multipolar reproduce la dominación;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="394">potencia circunstancialmente</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="409">progresista ≠ esencialmente tal</text>
<rect class="sv-box-red" height="100" rx="2" width="220" x="520" y="316"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="332">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="349">derecho del pueblo iraní a defenderse</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="364">sin cerrar filas con la República</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="379">Islámica; en el centro: enfrentar a</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="394">la oligarquía occidental; una línea</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="409">general, distintas líneas por territorio</text>
<rect class="sv-box-ink" height="74" rx="2" width="720" x="20" y="428"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="447">Tareas desde el centro imperialista</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12.5px" x="380" y="463">programa mínimo: fin del comercio de armas y de la transferencia tecnológica con Israel · boicot efectivo ·</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12.5px" x="380" y="479">redes con organizaciones populares palestinas · lucha contra las bases y la OTAN en el propio territorio</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12.5px" x="380" y="495">sólo un partido comunista puede elevar la solidaridad a lucha contra el propio Estado y sus partidos leales</text>
<text class="sv-t3" text-anchor="middle" x="380" y="526">no identificar la crisis de la hegemonía de EE. UU. con la crisis del imperialismo</text>
</svg>
