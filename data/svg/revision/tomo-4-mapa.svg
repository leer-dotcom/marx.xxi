<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 4: en el centro el derecho a la revolución, fundado por la soberanía popular, puesto a la orden del día por la crisis revolucionaria y ejercido por el partido comunista; revoca el Estado capitalista, cuyo giro autoritario recorta los derechos políticos que son condición del partido; partido y crisis conquistan el Estado-Comuna, que realiza la soberanía popular y cuya pérdida genera oportunismo e izquierdismo; la guerra imperialista acelera el giro autoritario y el derrotismo exige un internacionalismo que es condición de supervivencia del Estado-Comuna. Cada arista indica los artículos que la desarrollan; al pie, leyenda de colores y clave de los siete artículos." viewBox="0 0 760 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-s-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M660 56 V18 H14 V221 H40"/>
<text class="sv-t3" text-anchor="middle" x="380" y="13">la realiza plenamente (pueblo armado, revocabilidad, fin de la separación de poderes) (1, 7)</text>
<path class="sv-line-dash" marker-end="url(#m4-s-arrow)" d="M620 56 V37 H123 V56"/>
<text class="sv-t3" text-anchor="middle" x="380" y="31">su pérdida (5, 7)</text>
<path class="sv-line-dash" marker-end="url(#m4-s-arrow)" d="M720 70 H752 V540 H123 V520"/>
<text class="sv-t3" text-anchor="middle" x="380" y="555">su pérdida (5, 7)</text>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M720 355 H740 V87 H720"/>
<text class="sv-t3" text-anchor="middle" transform="rotate(-90 731 220)" x="731" y="220">condición de supervivencia (2, 6, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="206" y1="87" x2="297" y2="87"/>
<text class="sv-t3" text-anchor="middle" x="251" y="80">la presupone</text>
<text class="sv-t3" text-anchor="middle" x="251" y="103">falsamente</text>
<text class="sv-t3" text-anchor="middle" x="251" y="116">(1, 2, 5, 7)</text>
<line class="sv-line-red" marker-end="url(#m4-s-arrow)" x1="380" y1="118" x2="380" y2="190"/>
<text class="sv-t3" text-anchor="end" x="373" y="158">a la orden del día (1)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="463" y1="87" x2="554" y2="87"/>
<text class="sv-t3" text-anchor="middle" x="508" y="80">mayoría</text>
<text class="sv-t3" text-anchor="middle" x="508" y="103">decisiva (1, 3)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="637" y1="190" x2="637" y2="118"/>
<text class="sv-t3" text-anchor="end" x="630" y="158">conquista del poder (1, 3, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="206" y1="221" x2="297" y2="221"/>
<text class="sv-t3" text-anchor="middle" x="251" y="214">funda</text>
<text class="sv-t3" text-anchor="middle" x="251" y="237">(1, 3, 7)</text>
<line class="sv-line-red" marker-end="url(#m4-s-arrow)" x1="554" y1="221" x2="463" y2="221"/>
<text class="sv-t3" text-anchor="middle" x="508" y="214">ejerce y</text>
<text class="sv-t3" text-anchor="middle" x="508" y="237">prepara</text>
<text class="sv-t3" text-anchor="middle" x="508" y="250">(1, 3, 7)</text>
<line class="sv-line-red" marker-end="url(#m4-s-arrow)" x1="297" y1="252" x2="206" y2="324"/>
<text class="sv-t3" x="262" y="300">revoca (1, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="123" y1="458" x2="123" y2="386"/>
<text class="sv-t3" x="129" y="426">se integra (2, 5, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="206" y1="386" x2="297" y2="458"/>
<text class="sv-t3" x="238" y="404">produce en la crisis</text>
<text class="sv-t3" x="266" y="418">(2, 4, 6)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="380" y1="458" x2="380" y2="386"/>
<text class="sv-t3" x="387" y="426">recorta (4, 6)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="463" y1="324" x2="554" y2="252"/>
<text class="sv-t3" x="520" y="300">condición de</text>
<text class="sv-t3" x="520" y="314">posibilidad (3, 4, 6, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="554" y1="489" x2="463" y2="489"/>
<text class="sv-t3" text-anchor="middle" x="508" y="482">acelera</text>
<text class="sv-t3" text-anchor="middle" x="508" y="505">(2, 4, 6)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="637" y1="458" x2="637" y2="386"/>
<text class="sv-t3" text-anchor="end" x="630" y="426">derrotismo: lo exige (2, 6, 7)</text>
<rect class="sv-box" rx="2" x="40" y="56" width="166" height="62"/>
<text class="sv-t" text-anchor="middle" x="123" y="76">Izquierdismo</text>
<text class="sv-t2" text-anchor="middle" x="123" y="92">sectarismo</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="123" y="107">fetichismo del momento</text>
<rect class="sv-box-red" rx="2" x="297" y="56" width="166" height="62"/>
<text class="sv-tr" text-anchor="middle" x="380" y="76">Crisis</text>
<text class="sv-t2" text-anchor="middle" x="380" y="92">revolucionaria</text>
<text class="sv-t2" style="font-size:10.5px" text-anchor="middle" x="380" y="107">hoy no la hay: «hablar alemán»</text>
<rect class="sv-box-blue" rx="2" x="554" y="56" width="166" height="62"/>
<text class="sv-tb" text-anchor="middle" x="637" y="76">Estado-Comuna</text>
<text class="sv-t2" text-anchor="middle" x="637" y="92">república democrática</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="637" y="107">programa mínimo</text>
<rect class="sv-box-blue" rx="2" x="40" y="190" width="166" height="62"/>
<text class="sv-tb" text-anchor="middle" x="123" y="210">Soberanía popular</text>
<text class="sv-t2" text-anchor="middle" x="123" y="226">democracia íntegra</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="123" y="241">autoemancipación</text>
<rect class="sv-box-red" rx="2" x="297" y="190" width="166" height="62"/>
<text class="sv-tr" text-anchor="middle" x="380" y="210">Derecho a la revolución</text>
<text class="sv-t2" text-anchor="middle" x="380" y="226">núcleo del volumen</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="241">nadie lo concede ni lo niega</text>
<rect class="sv-box-green" rx="2" x="554" y="190" width="166" height="62"/>
<text class="sv-tgr" text-anchor="middle" x="637" y="210">Partido comunista</text>
<text class="sv-t2" text-anchor="middle" x="637" y="226">de masas</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="637" y="241">prepara, conquista, ejerce</text>
<rect class="sv-box-ink" rx="2" x="40" y="324" width="166" height="62"/>
<text class="sv-tw" text-anchor="middle" x="123" y="344">Estado capitalista</text>
<text class="sv-tw" text-anchor="middle" x="123" y="360">imperio de la Ley</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="123" y="375">separación · oligarquía</text>
<rect class="sv-box-green" rx="2" x="297" y="324" width="166" height="62"/>
<text class="sv-tgr" text-anchor="middle" x="380" y="344">Derechos políticos</text>
<text class="sv-t2" text-anchor="middle" x="380" y="360">armas, no fines</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="375">conquistas proletarias</text>
<rect class="sv-box-blue" rx="2" x="554" y="324" width="166" height="62"/>
<text class="sv-tb" text-anchor="middle" x="637" y="344">Internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="637" y="360">partido europeo</text>
<text class="sv-t2" style="font-size:10.5px" text-anchor="middle" x="637" y="375">EE. UU. Socialistas de Europa</text>
<rect class="sv-box" rx="2" x="40" y="458" width="166" height="62"/>
<text class="sv-t" text-anchor="middle" x="123" y="478">Oportunismo</text>
<text class="sv-t2" text-anchor="middle" x="123" y="494">reformismo, frentismo</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="123" y="509">centrismo, partidos amplios</text>
<rect class="sv-box-gold" rx="2" x="297" y="458" width="166" height="62"/>
<text class="sv-tg" text-anchor="middle" x="380" y="478">Giro autoritario</text>
<text class="sv-t2" text-anchor="middle" x="380" y="494">penal · UE · rearme</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="509">responde a la crisis</text>
<rect class="sv-box-gold" rx="2" x="554" y="458" width="166" height="62"/>
<text class="sv-tg" text-anchor="middle" x="637" y="478">Guerra imperialista</text>
<text class="sv-t2" text-anchor="middle" x="637" y="494">derrotismo doble</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="637" y="509">ni OTAN ni BRICS</text>
<rect class="sv-soft" rx="2" x="40" y="568" width="680" height="112"/>
<text class="sv-t3" x="50" y="586">rojo: derecho a la revolución y crisis · verde: partido y derechos políticos · negro: Estado capitalista</text>
<text class="sv-t3" x="50" y="600">dorado: giro autoritario y guerra · azul: soberanía, Estado-Comuna e internacionalismo · blanco: desviaciones</text>
<text class="sv-t3" x="50" y="614">flecha roja: aristas del derecho a la revolución · discontinua: pérdida del Estado-Comuna · (n): artículos</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="634">1 · Volodia — Sobre el derecho a la revolución</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="648">2 · Seijo — Socialismo y guerra: derrotismo</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="662">3 · Santander — La batalla por la democracia</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="676">4 · Jugo — Giro autoritario: reformas penales</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="634">5 · Miasni — 15M, Podemos y sus raíces</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="648">6 · Ruiz — Giro autoritario y poder oligárquico en la UE</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="662">7 · Aguiriano — ¡Viva la Comuna! Marxismo y Estado</text>
</svg>
