<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la triple operación de la economía política, desde el individuo abstracto poseedor de mercancías hasta la fórmula trinitaria, con el carácter ideológico, burgués y fetichista de la economía política y la forma-salario como origen de la apariencia; abajo, un árbol en que la concepción burguesa de la producción se ramifica en economía política clásica, socialdemocracia, estalinismo y teoría radical contemporánea, frente al nodo de Marx y la conclusión: ni economicismo ni pluralismo de esferas." role="img" viewBox="0 0 760 652" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="22">LA TRIPLE OPERACIÓN DE LA ECONOMÍA POLÍTICA</text>
<rect class="sv-box" height="74" rx="2" width="132" x="20" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="86" y="54">Punto de partida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="86" y="70">individuo abstracto</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="86" y="84">poseedor de mercancías</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="86" y="98">libres e iguales</text>
<rect class="sv-box" height="74" rx="2" width="132" x="167" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="233" y="54">1. Separar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233" y="70">forma social /</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233" y="84">contenido natural</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233" y="98">(punto ciego)</text>
<rect class="sv-box" height="74" rx="2" width="132" x="314" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="54">2. Naturalizar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="70">el contenido</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="84">(la producción)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="380" y="98">3 factores productivos</text>
<rect class="sv-box" height="74" rx="2" width="132" x="461" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="527" y="54">3. Naturalizar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="527" y="70">la forma</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="527" y="84">(la distribución)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="527" y="98">tres clases, armonía</text>
<rect class="sv-box-gold" height="74" rx="2" width="132" x="608" y="34"></rect>
<text class="sv-tg" text-anchor="middle" x="674" y="54">Fórmula trinitaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="674" y="70">capital-interés,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="674" y="84">tierra-renta,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="674" y="98">trabajo-salario</text>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="152" x2="167" y1="71" y2="71"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="299" x2="314" y1="71" y2="71"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="446" x2="461" y1="71" y2="71"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="593" x2="608" y1="71" y2="71"></line>
<rect class="sv-soft" height="76" rx="2" width="720" x="20" y="122"></rect>
<text class="sv-t3" x="30" y="140">POR QUÉ ES IDEOLOGÍA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="156">ideológica: naturaliza lo histórico y universaliza lo específico</text>
<text class="sv-t2" style="font-size:12px" x="30" y="170">burguesa: naturaliza las relaciones burguesas de producción</text>
<text class="sv-t2" style="font-size:12px" x="30" y="184">fetichista: inviste a las cosas de poderes sociales</text>
<text class="sv-t3" x="425" y="140">DE DÓNDE NACE LA APARIENCIA (MARX)</text>
<text class="sv-t2" style="font-size:12px" x="425" y="156">forma-salario: el valor de la fuerza de trabajo aparece</text>
<text class="sv-t2" style="font-size:12px" x="425" y="170">como valor del trabajo y oculta el plustrabajo; así</text>
<text class="sv-t2" style="font-size:12px" x="425" y="184">renta y ganancia parecen frutos de tierra y capital</text>
<line class="sv-line-dash" marker-end="url(#m1-2-arrow)" x1="380" x2="380" y1="198" y2="238"></line>
<text class="sv-t3" x="390" y="222">naturaliza las apariencias</text>
<rect class="sv-box-red" height="56" rx="2" width="360" x="200" y="238"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="260">Raíz común: concepción burguesa de la producción</text>
<text class="sv-t2" text-anchor="middle" x="380" y="278">como base técnica + relaciones de distribución</text>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="380" x2="100" y1="294" y2="356"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="380" x2="280" y1="294" y2="356"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="380" x2="460" y1="294" y2="356"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="380" x2="647" y1="294" y2="356"></line>
<rect class="sv-box" height="92" rx="2" width="170" x="15" y="356"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="376">Economía política</text>
<text class="sv-t" text-anchor="middle" x="100" y="391">clásica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="408">Smith, Mill</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="422">sólo la coacción política</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="436">distorsiona la «armonía»</text>
<rect class="sv-box" height="92" rx="2" width="170" x="195" y="356"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="376">Socialdemocracia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="394">Kautsky: reformismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="408">como consecuencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="422">retoques en la distribución</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="436">por Estado o sindicato</text>
<rect class="sv-box" height="92" rx="2" width="170" x="375" y="356"></rect>
<text class="sv-t" text-anchor="middle" x="460" y="376">«Marxismo ortodoxo»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="394">estalinista: base técnica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="408">+ distribución</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="422">primacía de las fuerzas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="436">productivas; evolucionismo</text>
<rect class="sv-box" height="92" rx="2" width="185" x="555" y="356"></rect>
<text class="sv-t" text-anchor="middle" x="647" y="376">Teoría «radical» actual</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="394">Brown, Deleuze-Guattari,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="408">«Marx failed to consider»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="422">Brown: cuatro reducciones;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="436">D-G: lucha de códigos</text>
<text class="sv-t3" text-anchor="middle" x="370" y="466">afirmación del proletariado: imagen negativa de la ideología burguesa</text>
<text class="sv-tr" text-anchor="middle" x="380" y="492">frente a todas ellas</text>
<rect class="sv-box-ink" height="74" rx="2" width="600" x="80" y="502"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="524">MARX: la contradicción está dentro de la producción (valor de uso / valor);</text>
<text class="sv-tw" text-anchor="middle" x="380" y="542">el capital es una relación social; el fetichismo es real</text>
<text class="sv-tw" style="font-size:12.5px" text-anchor="middle" x="380" y="562">lo que las salidas en falso pierden: abolir la forma-valor = autoabolición del proletariado</text>
<rect class="sv-soft" height="58" rx="2" width="720" x="20" y="590"></rect>
<text class="sv-t3" x="30" y="607">CONCLUSIÓN</text>
<text class="sv-t2" style="font-size:12px" x="30" y="623">Ni economicismo ni «pluralismo» de esferas autónomas: crítica revolucionaria de las relaciones sociales objetivadas en ellas.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="637">Identificar a Marx con una «teoría económica» condena a la teoría radical a «caer detrás de Marx».</text>
</svg>
