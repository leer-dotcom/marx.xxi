<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, las herramientas del análisis marxista de coyuntura; después, línea temporal en tres ciclos de acumulación (keynesiano, neoliberal y nuevo keynesianismo de ofensiva, dividido en dominancia monetaria y fiscal) con la tasa de ganancia descendiendo en escalones; debajo, las lecciones de cada tramo, que fundamentan las cinco conclusiones estratégicas y convergen en el nodo final: Partido independiente a escala europea e internacional" role="img" viewBox="0 0 760 946" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>

<text class="sv-t3" x="12" y="20">MÉTODO: ANÁLISIS MARXISTA DE COYUNTURA («CONOCER PARA TRANSFORMAR»)</text>
<rect class="sv-soft" height="60" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="22" y="46" style="font-size:12px">Dos herramientas: el ciclo de acumulación (periodo entre crisis severas: la crisis es inicio y fin de cada ciclo, y cada ciclo relanza</text>
<text class="sv-t2" x="22" y="61" style="font-size:12px">la acumulación en condiciones más precarias) y la perspectiva de clase (la acumulación adopta la forma de una lucha de clases: la</text>
<text class="sv-t2" x="22" y="76" style="font-size:12px">reproducción capitalista es ya ofensiva del capital sobre el trabajo). «Renunciar al conocimiento científico implica renunciar a la revolución».</text>

<text class="sv-tr" x="12" y="112">tasa de ganancia: cae en escalones y nunca recupera los niveles previos</text>
<path class="sv-line-red" d="M20 134 H200 L230 158 H430 L460 182 H745"></path>
<circle class="sv-dot" cx="215" cy="146" r="5"></circle><text class="sv-t3" text-anchor="middle" x="215" y="178">crisis 70s</text>
<circle class="sv-dot" cx="445" cy="170" r="5"></circle><text class="sv-t3" text-anchor="middle" x="445" y="202">crisis 2008</text>

<rect class="sv-box-blue" height="104" rx="2" width="200" x="12" y="214"></rect>
<text class="sv-t" text-anchor="middle" x="112" y="234">Ciclo keynesiano · 1945–70s</text>
<text class="sv-t2" text-anchor="middle" x="112" y="251" style="font-size:12px">integración sistémica, pacto</text>
<text class="sv-t2" text-anchor="middle" x="112" y="265" style="font-size:12px">interclasista «de pies de barro»</text>
<text class="sv-t2" text-anchor="middle" x="112" y="279" style="font-size:12px">salario directo, indirecto y diferido</text>
<text class="sv-t2" text-anchor="middle" x="112" y="293" style="font-size:12px">sin tocar el poder burgués; las leyes</text>
<text class="sv-t2" text-anchor="middle" x="112" y="307" style="font-size:12px">que lo expanden acaban hundiéndolo</text>
<rect class="sv-box-gold" height="104" rx="2" width="220" x="224" y="214"></rect>
<text class="sv-t" text-anchor="middle" x="334" y="234">Ciclo neoliberal · 70s/80s–2008</text>
<text class="sv-t2" text-anchor="middle" x="334" y="251" style="font-size:12px">ofensiva de clase: Estado + mercado,</text>
<text class="sv-t2" text-anchor="middle" x="334" y="265" style="font-size:12px">UE como dispositivo, financiarización</text>
<text class="sv-t2" text-anchor="middle" x="334" y="279" style="font-size:12px">Estado: desregulación, privatización,</text>
<text class="sv-t2" text-anchor="middle" x="334" y="293" style="font-size:12px">represión, BC antiinflación; mercado:</text>
<text class="sv-t2" text-anchor="middle" x="334" y="307" style="font-size:12px">devaluación salarial, deslocalización</text>
<rect class="sv-box-red" height="104" rx="2" width="292" x="456" y="214"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="234">Nuevo keynesianismo de ofensiva · 2008–</text>
<text class="sv-t2" text-anchor="middle" x="602" y="251" style="font-size:12px">de ofensiva: el Estado sostiene a un capital</text>
<text class="sv-t2" text-anchor="middle" x="602" y="265" style="font-size:12px">estructuralmente débil; la proletarización se</text>
<text class="sv-t2" text-anchor="middle" x="602" y="279" style="font-size:12px">intensifica y retroceden los derechos políticos;</text>
<text class="sv-t2" text-anchor="middle" x="602" y="293" style="font-size:12px">sus dos bazas (Banco Central y gasto estatal)</text>
<text class="sv-t2" text-anchor="middle" x="602" y="307" style="font-size:12px">fracasan; la guerra mundial se vuelve factible</text>
<path class="sv-line" d="M602 318 V330" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box" height="66" rx="2" width="292" x="456" y="332"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="350">Dominancia monetaria · 2008–2020</text>
<text class="sv-t2" text-anchor="middle" x="602" y="365" style="font-size:11.5px">BC market maker of last resort (Fed +900 %, BCE +300 %);</text>
<text class="sv-t2" text-anchor="middle" x="602" y="378" style="font-size:11.5px">austeridad = presupuesto reordenado en clave de clase;</text>
<text class="sv-t2" text-anchor="middle" x="602" y="391" style="font-size:11.5px">liberalismo autoritario: poder al ejecutivo europeo (UE)</text>
<path class="sv-line" d="M602 398 V406" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box" height="80" rx="2" width="292" x="456" y="408"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="426">Dominancia fiscal · pandemia–</text>
<text class="sv-t2" text-anchor="middle" x="602" y="441" style="font-size:11.5px">industria, rearme: política industrial (IRA, NGEU,</text>
<text class="sv-t2" text-anchor="middle" x="602" y="454" style="font-size:11.5px">Chips Act) de resultados pobres; inflación; rearme</text>
<text class="sv-t2" text-anchor="middle" x="602" y="467" style="font-size:11.5px">(2 % OTAN); guerras por delegación (Ucrania, Gaza):</text>
<text class="sv-t2" text-anchor="middle" x="602" y="480" style="font-size:11.5px">la guerra = competencia empresarial por otros medios</text>

<path class="sv-line-dash" d="M112 318 V496" marker-end="url(#m3-2-arrow)"></path>
<path class="sv-line-dash" d="M334 318 V496" marker-end="url(#m3-2-arrow)"></path>
<path class="sv-line-dash" d="M602 488 V496" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-soft" height="64" rx="2" width="200" x="12" y="498"></rect>
<text class="sv-tb" text-anchor="middle" x="112" y="518">Lección</text>
<text class="sv-t2" text-anchor="middle" x="112" y="534">el reformismo fracasa incluso</text>
<text class="sv-t2" text-anchor="middle" x="112" y="549">como proyecto armonizador</text>
<rect class="sv-soft" height="64" rx="2" width="220" x="224" y="498"></rect>
<text class="sv-tb" text-anchor="middle" x="334" y="518">Lección</text>
<text class="sv-t2" text-anchor="middle" x="334" y="534">no ideología sino reacción de clase;</text>
<text class="sv-t2" text-anchor="middle" x="334" y="549">cada ciclo deja bases más endebles</text>
<rect class="sv-soft" height="64" rx="2" width="292" x="456" y="498"></rect>
<text class="sv-tb" text-anchor="middle" x="602" y="518">Lección</text>
<text class="sv-t2" text-anchor="middle" x="602" y="534">austeridad de clase, liberalismo</text>
<text class="sv-t2" text-anchor="middle" x="602" y="549">autoritario, rearme y guerra</text>
<path class="sv-line" d="M112 562 V574 H378"></path>
<path class="sv-line" d="M334 562 V574"></path>
<path class="sv-line" d="M602 562 V574 H382"></path>
<path class="sv-line" d="M380 574 V598" marker-end="url(#m3-2-arrow)"></path>
<text class="sv-t3" x="12" y="592">CINCO CONCLUSIONES ESTRATÉGICAS</text>
<text class="sv-t3" text-anchor="end" x="748" y="592">discontinua: deja una lección · continua: fundamenta</text>
<rect class="sv-box" height="50" rx="2" width="736" x="12" y="600"></rect>
<text class="sv-t" x="22" y="630" style="font-size:13px">1 · Escala europea</text>
<text class="sv-t2" x="196" y="616" style="font-size:11.5px">Europa es el espacio geográfico mínimo de la organización socialista: política</text>
<text class="sv-t2" x="196" y="629" style="font-size:11.5px">monetaria y fiscal delegadas en Comisión y BCE; el nivel supranacional reduce al</text>
<text class="sv-t2" x="196" y="642" style="font-size:11.5px">nacional. Horizonte final: internacional (sólo un poder global anula al capital).</text>
<rect class="sv-box" height="50" rx="2" width="736" x="12" y="656"></rect>
<text class="sv-t" x="22" y="686" style="font-size:13px">2 · Juventud</text>
<text class="sv-t2" x="196" y="672" style="font-size:11.5px">la juventud es el nuevo proletariado masivo (mano de obra excedentaria, parcial</text>
<text class="sv-t2" x="196" y="685" style="font-size:11.5px">y precaria, sin acceso a vivienda ni suministros): es coherente que la primera</text>
<text class="sv-t2" x="196" y="698" style="font-size:11.5px">expresión política de la organización socialista tenga carácter juvenil.</text>
<rect class="sv-box" height="50" rx="2" width="736" x="12" y="712"></rect>
<text class="sv-t" x="22" y="742" style="font-size:13px">3 · Frentes del bienestar</text>
<text class="sv-t2" x="196" y="728" style="font-size:11.5px">los Estados tendrán que reducir el salario indirecto y diferido; las luchas por</text>
<text class="sv-t2" x="196" y="741" style="font-size:11.5px">sanidad, educación, cultura, cuidados, pensiones o desempleo tienen interés general:</text>
<text class="sv-t2" x="196" y="754" style="font-size:11.5px">unifican a la clase contra el capital en su conjunto y contra el Estado.</text>
<rect class="sv-box" height="50" rx="2" width="736" x="12" y="768"></rect>
<text class="sv-t" x="22" y="798" style="font-size:13px">4 · Crisis y Partido</text>
<text class="sv-t2" x="196" y="784" style="font-size:11.5px">la tendencia al colapso hace de la crisis el horizonte de la intervención, pero</text>
<text class="sv-t2" x="196" y="797" style="font-size:11.5px">«no toda situación revolucionaria origina una revolución»: el gobierno nunca «caerá»</text>
<text class="sv-t2" x="196" y="810" style="font-size:11.5px">si no se le «hace caer»; hace falta la fuerza permanentemente organizada (Gramsci).</text>
<rect class="sv-box" height="50" rx="2" width="736" x="12" y="824"></rect>
<text class="sv-t" x="22" y="854" style="font-size:13px">5 · Guerra mundial</text>
<text class="sv-t2" x="196" y="840" style="font-size:11.5px">punto más alto de la decadencia: agotado el poder pacificador del mercado, la</text>
<text class="sv-t2" x="196" y="853" style="font-size:11.5px">guerra es necesidad sistémica del capital; no hay crítica real a la guerra sin</text>
<text class="sv-t2" x="196" y="866" style="font-size:11.5px">crítica al capitalismo, ni paz sin un poder socialista organizado a nivel global.</text>
<path class="sv-line" d="M380 874 V886" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box-ink" height="44" rx="2" width="460" x="150" y="888"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="907">Partido independiente, a escala europea como mínimo e internacional</text>
<text class="sv-tw" text-anchor="middle" x="380" y="924">construido antes de la crisis: «paciencia estratégica»</text>
</svg>
