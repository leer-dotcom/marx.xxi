<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la derrota del ciclo revolucionario del siglo XX (giro de los setenta, contrarrevolución conservadora, caída de la URSS) desemboca en el nodo negro de derrota histórica y posmodernidad. De él parten tres caminos: a la izquierda la vía positiva de los movimientos parciales y las organizaciones comunistas reformistas; a la derecha la vía negativa vulgar de la reacción y los rojipardos; ambas desembocan en un callejón sin salida que reproduce las dinámicas posmodernas. En el centro, la tercera postura atraviesa y supera la posmodernidad hacia un nuevo movimiento comunista construido desde abajo. Abajo, las premisas de ese potencial bloque y la leyenda." role="img" viewBox="0 0 760 716" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-10-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="80" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="34">Derrota del ciclo revolucionario del siglo XX</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="52">giro de los setenta y «contrarrevolución conservadora» de los ochenta: fracaso del 68, crisis del eurocomunismo, Chile,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="67">Thatcher y Reagan, crisis del petróleo, del fordismo keynesiano al posfordismo flexible; la caída de la URSS consuma la derrota;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="82">entra en crisis la idea de progreso y el capitalismo aparece como invencible (Fukuyama)</text>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="94" y2="112"></line>
<rect class="sv-box-ink" height="70" rx="2" width="340" x="210" y="112"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="134">DERROTA HISTÓRICA → POSMODERNIDAD</text>
<text class="sv-tw" text-anchor="middle" x="380" y="152">modernidad cansada, crisis de los metarrelatos</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="380" y="170">(Lyotard); tres posturas ante ella, con Jameson</text>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="260" x2="130" y1="182" y2="244"></line>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="182" y2="244"></line>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="500" x2="630" y1="182" y2="244"></line>
<rect class="sv-box" height="140" rx="2" width="220" x="20" y="244"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="266">Vía positiva</text>
<text class="sv-t2" text-anchor="middle" x="130" y="284">movimientos parciales,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="299">interseccionalidad;</text>
<text class="sv-t2" text-anchor="middle" x="130" y="314">organizaciones reformistas:</text>
<text class="sv-t2" text-anchor="middle" x="130" y="329">economicismo, sindicalismo,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="344">estancamiento, burocracia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="360">(aceptación: totalidad como suma</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="375">de partes que acaba en el Estado)</text>
<rect class="sv-box-green" height="140" rx="2" width="220" x="270" y="244"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="266">Tercera postura</text>
<text class="sv-t2" text-anchor="middle" x="380" y="284">comprender la posmodernidad,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="299">atravesarla y superarla;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="314">recuperar la totalidad;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="329">sujeto universal heterogéneo;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="344">internacionalismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="360">(ni aceptar ni condenar en abstracto:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="375">superar el capitalismo tardío)</text>
<rect class="sv-box" height="140" rx="2" width="220" x="520" y="244"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="266">Vía negativa vulgar</text>
<text class="sv-t2" text-anchor="middle" x="630" y="284">reacción y «rojipardos»:</text>
<text class="sv-t2" text-anchor="middle" x="630" y="299">nostalgia, nación, familia,</text>
<text class="sv-t2" text-anchor="middle" x="630" y="314">Estado fuerte, figuras</text>
<text class="sv-t2" text-anchor="middle" x="630" y="329">de alteridad; ontología</text>
<text class="sv-t2" text-anchor="middle" x="630" y="344">del todo armónico roto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="360">(rechazo abstracto; pasado idealizado;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="375">base del fascismo: excluirlos)</text>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="130" x2="130" y1="384" y2="430"></line>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="630" x2="630" y1="384" y2="430"></line>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="384" y2="430"></line>
<rect class="sv-box-red" height="72" rx="2" width="220" x="20" y="430"></rect>
<text class="sv-tr" text-anchor="middle" x="130" y="452">Callejón sin salida</text>
<text class="sv-t2" text-anchor="middle" x="130" y="469">actor secundario del capital</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="486">(gestionar mejor o peor el capital)</text>
<rect class="sv-box-red" height="72" rx="2" width="220" x="520" y="430"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="452">Callejón sin salida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="469">reproduce las dinámicas posmodernas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="486">(que dice combatir: estética, identidad)</text>
<line class="sv-line-dash" x1="240" x2="270" y1="466" y2="466"></line>
<line class="sv-line-dash" x1="490" x2="520" y1="466" y2="466"></line>
<rect class="sv-box-green" height="72" rx="2" width="220" x="270" y="430"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="452">Nuevo movimiento comunista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="469">bloque construido desde abajo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="486">sindicatos de base, ateneos, revistas</text>
<text class="sv-t3" text-anchor="middle" x="380" y="524">ambas vías laterales reproducen la posmodernidad; sólo la central la atraviesa</text>
<text class="sv-t3" text-anchor="middle" x="380" y="538">el rechazo abstracto es estéril: todos actuamos inmersos en la lógica posmoderna</text>
<rect class="sv-soft" height="112" rx="2" width="720" x="20" y="552"></rect>
<text class="sv-t3" x="30" y="570">PREMISAS DEL POTENCIAL BLOQUE (TERCERA POSTURA)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="588">· reelaborar el marxismo desde sus propias bases teóricas y filosóficas (universalidad, totalidad, sujeto revolucionario)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="603">· proletariado universal que respeta su heterogeneidad: igualdad de las opresiones (clase, género, raza), raíz común en la sociedad de clases</text>
<text class="sv-t2" style="font-size:12px" x="30" y="618">· asumir la derrota del ciclo del siglo XX y criticar sus experiencias (ni reivindicación ciega ni hacer como si nada hubiera pasado)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="633">· situarse en el presente: contradicciones del capitalismo tardío; proletariado más numeroso e internacional que nunca</text>
<text class="sv-t2" style="font-size:12px" x="30" y="648">· recuperar la perspectiva internacionalista frente al repliegue nacional; contactos y espacios comunes desde abajo</text>
<rect class="sv-soft" height="32" rx="2" width="720" x="20" y="672"></rect>
<text class="sv-t3" x="30" y="693">LEYENDA</text>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="110" x2="140" y1="689" y2="689"></line>
<text class="sv-t3" x="150" y="693">vía que atraviesa la posmodernidad</text>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="400" x2="430" y1="689" y2="689"></line>
<text class="sv-t3" x="440" y="693">vías que se cierran</text>
<line class="sv-line-dash" x1="590" x2="620" y1="689" y2="689"></line>
<text class="sv-t3" x="630" y="693">mismo callejón</text>
</svg>
