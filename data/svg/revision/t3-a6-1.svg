<svg xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de bifurcación: de la crisis ecológica como crisis capitalista y orgánica (multidimensional, procesual, contradicción interna; no revolucionaria por sí misma) se pasa a la proletarización de las clases medias y la sociedad en tercios, con el mecanismo que la produce (fin de los modos de vida y de la apropiación barata), que se abre en tres salidas (escenario progresista, escenario conservador y recomposición del proletariado); esta última se despliega en una escalera de hegemonía socialista precedida por el candado de la independencia política, mientras un recuadro contrasta la hegemonía populista con la gramsciana; abajo, la crítica del populismo verde y la autonomía de lo político en versión verde, y los apuntes estratégicos finales con la cita de Gramsci" role="img" viewBox="0 0 760 806" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="48" rx="2" width="360" x="200" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="43">Crisis ecológica = crisis capitalista = crisis orgánica</text>
<rect class="sv-soft" height="62" rx="2" width="736" x="12" y="72"></rect>
<text class="sv-t2" text-anchor="start" x="20" y="89" style="font-size:11.2px;letter-spacing:0">Multidimensional (climática, energética, de biodiversidad), procesual (degradación, no apocalipsis) y hecha de rupturas metabólicas; ocurre en</text>
<text class="sv-t2" text-anchor="start" x="20" y="104" style="font-size:11.2px;letter-spacing:0">el mundo del capital, que «organiza la naturaleza misma»: contradicción interna, ligada a la crisis de rentabilidad, sobreacumulación, población</text>
<text class="sv-t2" text-anchor="start" x="20" y="119" style="font-size:11.2px;letter-spacing:0">excedente y deuda. Orgánica (Gramsci): «resquebrajamiento de los fundamentos» de la sociedad dominante; no revolucionaria por sí misma.</text>
<path class="sv-line" d="M380 134 V150" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-gold" height="110" rx="2" width="480" x="140" y="152"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="175">Proletarización de las clases medias del centro</text>
<text class="sv-t2" text-anchor="middle" x="380" y="193">«sociedad en tercios»: patriciado rentista · en proletarización · excluidos</text>
<text class="sv-t2" text-anchor="middle" x="380" y="210.0" style="font-size:11.2px;letter-spacing:0">la crisis hace saltar los modos de vida de clase media (turismo low cost, petroagricultura,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="223.5" style="font-size:11.2px;letter-spacing:0">moda) y la apropiación barata de tierra, energía y alimentos; cae el salario indirecto y se</text>
<text class="sv-t2" text-anchor="middle" x="380" y="237.0" style="font-size:11.2px;letter-spacing:0">polariza el consumo → homogeneización cultural. Sacristán: el proletariado del centro</text>
<text class="sv-t2" text-anchor="middle" x="380" y="250.5" style="font-size:11.2px;letter-spacing:0">deja de ser «parasitario» (por posición social y política, no por tamaño)</text>
<path class="sv-line" d="M380 262 V280 H122 V300" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 262 V300" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 280 H638 V300" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-red" height="66" rx="2" width="220" x="12" y="302"></rect>
<text class="sv-tr" text-anchor="middle" x="122" y="323">Escenario progresista</text>
<text class="sv-t2" text-anchor="middle" x="122" y="339">socialdemocracia verde, errejonismo:</text>
<text class="sv-t2" text-anchor="middle" x="122" y="354">clase media + restos de clase obrera</text>
<rect class="sv-box-red" height="66" rx="2" width="220" x="270" y="302"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="323">Escenario conservador</text>
<text class="sv-t2" text-anchor="middle" x="380" y="339">derecha radical: la clase media</text>
<text class="sv-t2" text-anchor="middle" x="380" y="354">contra el proletariado migrante</text>
<rect class="sv-box-green" height="66" rx="2" width="220" x="528" y="302"></rect>
<text class="sv-tgr" text-anchor="middle" x="638" y="323">Tercera opción</text>
<text class="sv-t2" text-anchor="middle" x="638" y="339">el proletariado se recompone como</text>
<text class="sv-t2" text-anchor="middle" x="638" y="354">sujeto y subordina a la clase media</text>
<text class="sv-t3" text-anchor="middle" x="246" y="392">ambos escenarios pueden aislar a la clase media y abrir la tercera opción</text>
<text class="sv-t3" text-anchor="middle" x="246" y="408">sin fuerza organizada, el doble poder favorece a la burguesía</text>
<text class="sv-t3" x="12" y="428">DOS SENTIDOS DE HEGEMONÍA</text>
<rect class="sv-box-red" height="142" rx="2" width="165" x="12" y="436"></rect>
<text class="sv-tr" text-anchor="middle" x="94" y="458">Hegemonía populista</text>
<text class="sv-t2" text-anchor="middle" x="94" y="477" style="font-size:12.2px;letter-spacing:0">discurso, «sentidos comunes»</text>
<text class="sv-t2" text-anchor="middle" x="94" y="492">99 % contra 1 %</text>
<text class="sv-t2" text-anchor="middle" x="94" y="507" style="font-size:12.6px;letter-spacing:0">el Estado como instrumento</text>
<text class="sv-t2" text-anchor="middle" x="94" y="522">alianzas interclasistas</text>
<text class="sv-t2" text-anchor="middle" x="94" y="537" style="font-size:11.6px;letter-spacing:0">«articular mayorías» en</text>
<text class="sv-t2" text-anchor="middle" x="94" y="552" style="font-size:11.6px;letter-spacing:0">sentido cultural-electoral</text>
<text class="sv-t3" text-anchor="middle" x="192" y="496">vs</text>
<rect class="sv-box-blue" height="142" rx="2" width="165" x="207" y="436"></rect>
<text class="sv-tb" text-anchor="middle" x="289" y="458">Hegemonía gramsciana</text>
<text class="sv-t2" text-anchor="middle" x="289" y="477">unidad de lo económico,</text>
<text class="sv-t2" text-anchor="middle" x="289" y="492">lo político y lo militar</text>
<text class="sv-t2" text-anchor="middle" x="289" y="507" style="font-size:12.8px;letter-spacing:0">bloque histórico: tres grados</text>
<text class="sv-t2" text-anchor="middle" x="289" y="522">de relación de fuerzas</text>
<text class="sv-t2" text-anchor="middle" x="289" y="537" style="font-size:11.6px;letter-spacing:0">(el militar, «inmediatamente</text>
<text class="sv-t2" text-anchor="middle" x="289" y="552" style="font-size:11.6px;letter-spacing:0">decisivo»); socialismo</text>
<text class="sv-t2" text-anchor="middle" x="289" y="567" style="font-size:11.6px;letter-spacing:0">comprensible → deseable</text>
<path class="sv-line-red" d="M638 368 V412" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-ink" height="70" rx="2" width="348" x="400" y="414"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="435">Candado: independencia política primero</text>
<text class="sv-tw" text-anchor="middle" x="574" y="453">Movimiento Socialista → Partido → Estado Socialista</text>
<text class="sv-tw" text-anchor="middle" x="574" y="471" style="font-size:11.4px;letter-spacing:0">desplegar la hegemonía antes del candado = liquidacionismo</text>
<path class="sv-line" d="M454 484 V548" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="400" y="550"></rect>
<text class="sv-t" text-anchor="middle" x="454" y="568">1. Unificar</text>
<text class="sv-t2" text-anchor="middle" x="454" y="583">el tercio en</text>
<text class="sv-t2" text-anchor="middle" x="454" y="598">proletarización</text>
<path class="sv-line" d="M508 579 H518" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="520" y="520"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="538">2. Subordinar</text>
<text class="sv-t2" text-anchor="middle" x="574" y="553">sectores al</text>
<text class="sv-t2" text-anchor="middle" x="574" y="568" style="font-size:11.6px;letter-spacing:0">proyecto comunista</text>
<path class="sv-line" d="M628 549 H638" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="58" rx="2" width="108" x="640" y="490"></rect>
<text class="sv-t" text-anchor="middle" x="694" y="508">3. Apoyos</text>
<text class="sv-t2" text-anchor="middle" x="694" y="523">tácticos, con</text>
<text class="sv-t2" text-anchor="middle" x="694" y="538" style="font-size:11.3px;letter-spacing:0">separación orgánica</text>
<text class="sv-t3" text-anchor="middle" x="574" y="622">principal: 1 · secundario y contingente: 2 y 3</text>
<text class="sv-t3" x="12" y="648">CONTRA EL POPULISMO VERDE Y LA AUTONOMÍA DE LO POLÍTICO «VERDE»</text>
<rect class="sv-box-red" height="136" rx="2" width="420" x="12" y="656"></rect>
<text class="sv-tr" text-anchor="middle" x="222" y="677" style="font-size:12.6px;letter-spacing:0">Populismo verde (Tejero, Santiago Muiño, Green New Deal)</text>
<text class="sv-t2" text-anchor="middle" x="222" y="694" style="font-size:11.2px;letter-spacing:0">reedita a Tronti: renuncia a la lucha económica, reduce la política al Estado</text>
<text class="sv-t2" text-anchor="middle" x="222" y="708" style="font-size:11.2px;letter-spacing:0">y sueña una alianza entre capital avanzado y «clases populares» (medias).</text>
<text class="sv-t2" text-anchor="middle" x="222" y="722" style="font-size:11.2px;letter-spacing:0">El Estado capitalista no tiene ni «autonomía relativa»: forma fetichizada de</text>
<text class="sv-t2" text-anchor="middle" x="222" y="736" style="font-size:11.2px;letter-spacing:0">las relaciones sociales, atrapado entre competitividad y paz social («perversa</text>
<text class="sv-t2" text-anchor="middle" x="222" y="750" style="font-size:11.2px;letter-spacing:0">trinidad»: estancamiento, humanidad sobrante, colapso) → política climática</text>
<text class="sv-t2" text-anchor="middle" x="222" y="764" style="font-size:11.2px;letter-spacing:0">reactiva; «la clase obrera no puede tomar la máquina del Estado tal como está».</text>
<text class="sv-t2" text-anchor="middle" x="222" y="778" style="font-size:11.2px;letter-spacing:0">El capital es una relación de la que también el 99 % forma parte.</text>
<text class="sv-t3" x="448" y="648">APUNTES ESTRATÉGICOS</text>
<rect class="sv-box-green" height="136" rx="2" width="300" x="448" y="656"></rect>
<text class="sv-tgr" text-anchor="middle" x="598" y="677">Frente a la crisis ecológica</text>
<text class="sv-t2" text-anchor="middle" x="598" y="694" style="font-size:11.2px;letter-spacing:0">autodefensa socialista también del «cuerpo</text>
<text class="sv-t2" text-anchor="middle" x="598" y="708" style="font-size:11.2px;letter-spacing:0">inorgánico» (la naturaleza) · control proletario</text>
<text class="sv-t2" text-anchor="middle" x="598" y="722" style="font-size:11.2px;letter-spacing:0">progresivo del metabolismo · economía</text>
<text class="sv-t2" text-anchor="middle" x="598" y="736" style="font-size:11.2px;letter-spacing:0">planificada de productores libremente asociados</text>
<text class="sv-t2" text-anchor="middle" x="598" y="750" style="font-size:11.2px;letter-spacing:0">Gramsci: «el elemento decisivo de toda situación</text>
<text class="sv-t2" text-anchor="middle" x="598" y="764" style="font-size:11.2px;letter-spacing:0">es la fuerza permanentemente organizada»</text>
<text class="sv-t2" text-anchor="middle" x="598" y="778" style="font-size:11.2px;letter-spacing:0">con prudencia epistémica y radicalidad política</text>
</svg>
