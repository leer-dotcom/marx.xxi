<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, cadena causal de la competencia entre capitales a la guerra imperialista y el recorte de derechos, con el bucle por el que la guerra relanza la acumulación; en medio, los tres invariantes de la posición marxista; abajo, triángulo de respuestas: centrismo y frente-populismo, frentismo antiimperialista, y en el vértice el derrotismo revolucionario doble con sus cuatro mediaciones" role="img" viewBox="0 0 760 724" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="16">DE LA COMPETENCIA A LA GUERRA (cadena causal)</text>
<rect class="sv-box" height="80" rx="2" width="140" x="12" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="82.0" y="44">Competencia</text>
<text class="sv-t" text-anchor="middle" x="82.0" y="59.5">entre capitales</text>
<text class="sv-t2" text-anchor="middle" x="82.0" y="72.5" style="font-size:11.5px">obliga a revolucionar la</text>
<text class="sv-t2" text-anchor="middle" x="82.0" y="85.5" style="font-size:11.5px">producción y expulsa</text>
<text class="sv-t2" text-anchor="middle" x="82.0" y="98.5" style="font-size:11.5px">trabajo vivo</text>
<rect class="sv-box" height="80" rx="2" width="140" x="160" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="230.0" y="44">Caída de la tasa</text>
<text class="sv-t" text-anchor="middle" x="230.0" y="59.5">de ganancia</text>
<text class="sv-t2" text-anchor="middle" x="230.0" y="74.0">sobreproducción</text>
<text class="sv-t2" text-anchor="middle" x="230.0" y="87.0" style="font-size:11.5px">la crisis purga el</text>
<text class="sv-t2" text-anchor="middle" x="230.0" y="100.0" style="font-size:11.5px">capital sobrante</text>
<rect class="sv-box" height="80" rx="2" width="140" x="308" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="378.0" y="44">Nacionalismo</text>
<text class="sv-t" text-anchor="middle" x="378.0" y="59.5">económico</text>
<text class="sv-t2" text-anchor="middle" x="378.0" y="74.0">aranceles · rearme</text>
<text class="sv-t2" text-anchor="middle" x="378.0" y="87.0" style="font-size:11.5px">rescate estatal y</text>
<text class="sv-t2" text-anchor="middle" x="378.0" y="100.0" style="font-size:11.5px">política industrial</text>
<rect class="sv-box-red" height="80" rx="2" width="140" x="456" y="26"></rect>
<text class="sv-tr" text-anchor="middle" x="526.0" y="44">Guerra</text>
<text class="sv-tr" text-anchor="middle" x="526.0" y="59.0">imperialista</text>
<text class="sv-t2" text-anchor="middle" x="526.0" y="72.0" style="font-size:11.5px">declive de EE. UU.</text>
<text class="sv-t2" text-anchor="middle" x="526.0" y="85.0" style="font-size:11.5px">frente a China; rearme</text>
<text class="sv-t2" text-anchor="middle" x="526.0" y="98.0" style="font-size:11.5px">europeo, Ucrania, Israel</text>
<rect class="sv-box" height="80" rx="2" width="140" x="604" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="674.0" y="44">Austeridad y</text>
<text class="sv-t" text-anchor="middle" x="674.0" y="59.5">recorte de</text>
<text class="sv-t" text-anchor="middle" x="674.0" y="75.0">derechos políticos</text>
<text class="sv-t2" text-anchor="middle" x="674.0" y="88.0" style="font-size:11.5px">reverso interior del</text>
<text class="sv-t2" text-anchor="middle" x="674.0" y="101.0" style="font-size:11.5px">belicismo</text>
<path class="sv-line" d="M152 66.0 L158 66.0" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line" d="M300 66.0 L306 66.0" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line-red" d="M448 66.0 L454 66.0" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line" d="M596 66.0 L602 66.0" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line-dash" d="M526.0 106 L526.0 120 L230.0 120 L230.0 108" marker-end="url(#m4-2-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="378.0" y="134">la guerra destruye capital aceleradamente y puede relanzar la acumulación</text>
<text class="sv-t3" x="12" y="162">LA POSICIÓN DEL MARXISMO REVOLUCIONARIO: tres invariantes (no una copia mecánica del pasado)</text>
<rect class="sv-box-red" height="58" rx="2" width="736" x="12" y="170"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="188" style="font-size:12.5px">1 · Derrotismo: oponerse al propio bloque en nombre de la unidad del proletariado internacional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="204" style="font-size:12.5px">2 · Oposición a la guerra imperialista sin pacifismo: se apoyan las guerras con fines emancipatorios</text>
<text class="sv-t2" text-anchor="middle" x="380" y="220" style="font-size:12.5px">3 · Todo acto orientado a la conquista proletaria del poder: «convertir la guerra imperialista en guerra civil»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="242" style="font-size:10.5px">el defensismo de Marx y Engels (capitalismo ascendente) fue legítimo; el de la II Internacional en 1914, una traición</text>
<text class="sv-t3" x="12" y="264">¿QUÉ RESPUESTA? TRES RESPUESTAS ANTE LA GUERRA: el fetiche de la unidad frente al derrotismo doble</text>
<rect class="sv-box-gold" height="92" rx="2" width="236" x="12" y="272"></rect>
<text class="sv-tg" text-anchor="middle" x="130.0" y="290">Centrismo / frente-populismo</text>
<text class="sv-t2" text-anchor="middle" x="130.0" y="304.5">unidad con la propia burguesía</text>
<text class="sv-t3" text-anchor="middle" x="130.0" y="317.5">OTAN · PSOE-Sumar · LFI</text>
<text class="sv-t2" text-anchor="middle" x="130.0" y="330.5" style="font-size:11.5px">oportunismo como mínimo común;</text>
<text class="sv-t2" text-anchor="middle" x="130.0" y="343.5" style="font-size:11.5px">social-imperialismo con fraseología</text>
<text class="sv-t2" text-anchor="middle" x="130.0" y="356.5" style="font-size:11.5px">socialista (gasto militar, armas a Israel)</text>
<rect class="sv-box-gold" height="92" rx="2" width="236" x="512" y="272"></rect>
<text class="sv-tg" text-anchor="middle" x="630.0" y="290">Frentismo antiimperialista</text>
<text class="sv-t2" text-anchor="middle" x="630.0" y="304.5">unidad con las burguesías rivales</text>
<text class="sv-t3" text-anchor="middle" x="630.0" y="317.5">BRICS · multipolarismo</text>
<text class="sv-t2" text-anchor="middle" x="630.0" y="330.5" style="font-size:11.5px">«el enemigo de mi enemigo es mi amigo»</text>
<text class="sv-t2" text-anchor="middle" x="630.0" y="343.5" style="font-size:11.5px">ilusión kautskiana del ultraimperialismo</text>
<text class="sv-t2" text-anchor="middle" x="630.0" y="356.5" style="font-size:11.5px">→ «antiimperialismo de los idiotas»</text>
<line class="sv-line-dash" x1="248" x2="512" y1="318.0" y2="318.0"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="312.0">fetiche de la unidad</text>
<text class="sv-t3" text-anchor="middle" x="380" y="332.0" style="font-size:10.5px">ambas comparten el social-pacifismo:</text>
<text class="sv-t3" text-anchor="middle" x="380" y="345.0" style="font-size:10.5px">(un capitalismo pacífico: ONU, arbitraje)</text>
<rect class="sv-box-red" height="96" rx="2" width="300" x="230.0" y="400"></rect>
<text class="sv-tr" text-anchor="middle" x="380.0" y="418">Derrotismo revolucionario doble</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="432.5">el enemigo principal está en casa,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="447.0">pero sin amistad con las rivales</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="461.5">independencia de clase + internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="474.5" style="font-size:11.5px">organizativo: una Internacional con</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="487.5" style="font-size:11.5px">orientaciones vinculantes (lección bolchevique)</text>
<path class="sv-line-dash" d="M130.0 364 L270.0 400"></path>
<path class="sv-line-dash" d="M630.0 364 L490.0 400"></path>
<text class="sv-t3" text-anchor="middle" x="175" y="394">ni OTAN…</text>
<text class="sv-t3" text-anchor="middle" x="585" y="394">…ni BRICS</text>
<path class="sv-line-red" d="M380 496 L380 534" marker-end="url(#m4-2-arrow)"></path>
<text class="sv-t3" x="390" y="520">mediaciones: aterrizar los principios</text>
<rect class="sv-box-blue" height="80" rx="2" width="178" x="12" y="536"></rect>
<text class="sv-tb" text-anchor="middle" x="101.0" y="554">Derechos políticos</text>
<text class="sv-t2" text-anchor="middle" x="101.0" y="568.5">condición de la actividad</text>
<text class="sv-t2" text-anchor="middle" x="101.0" y="581.5" style="font-size:11.5px">comunista organizada; hoy</text>
<text class="sv-t2" text-anchor="middle" x="101.0" y="594.5" style="font-size:11.5px">ya mermados (represión del</text>
<text class="sv-t2" text-anchor="middle" x="101.0" y="607.5" style="font-size:11.5px">movimiento propalestino)</text>
<rect class="sv-box-blue" height="80" rx="2" width="178" x="198" y="536"></rect>
<text class="sv-tb" text-anchor="middle" x="287.0" y="554">Medidas transicionales</text>
<text class="sv-t2" text-anchor="middle" x="287.0" y="568.5">pan, paz y tierra · créditos</text>
<text class="sv-t2" text-anchor="middle" x="287.0" y="581.5" style="font-size:11.5px">no a la paz entre clases, no</text>
<text class="sv-t2" text-anchor="middle" x="287.0" y="594.5" style="font-size:11.5px">a los créditos de guerra; «todo</text>
<text class="sv-t2" text-anchor="middle" x="287.0" y="607.5" style="font-size:11.5px">el poder a los soviets»</text>
<rect class="sv-box-blue" height="80" rx="2" width="178" x="384" y="536"></rect>
<text class="sv-tb" text-anchor="middle" x="473.0" y="554">Política militar</text>
<text class="sv-t2" text-anchor="middle" x="473.0" y="568.5">republicano-democrática</text>
<text class="sv-t2" text-anchor="middle" x="473.0" y="581.5" style="font-size:11.5px">romper la coherencia de la</text>
<text class="sv-t2" text-anchor="middle" x="473.0" y="594.5" style="font-size:11.5px">organización armada burguesa;</text>
<text class="sv-t2" text-anchor="middle" x="473.0" y="607.5" style="font-size:11.5px">fraternizar, no desertar</text>
<rect class="sv-box-blue" height="80" rx="2" width="178" x="570" y="536"></rect>
<text class="sv-tb" text-anchor="middle" x="659.0" y="554">Partido internacional</text>
<text class="sv-t2" text-anchor="middle" x="659.0" y="568.5">orientaciones vinculantes</text>
<text class="sv-t2" text-anchor="middle" x="659.0" y="581.5" style="font-size:11.5px">se construye con paciencia en</text>
<text class="sv-t2" text-anchor="middle" x="659.0" y="594.5" style="font-size:11.5px">todo momento, no en la huelga</text>
<text class="sv-t2" text-anchor="middle" x="659.0" y="607.5" style="font-size:11.5px">revolucionaria (vs. Barbaria)</text>
<rect class="sv-soft" height="54" rx="2" width="736" x="12" y="632"></rect>
<text class="sv-t3" x="22" y="648">EL COMUNISMO, «UNA TENSA CUERDA SOBRE UN PRECIPICIO»</text>
<text class="sv-t2" x="22" y="664" style="font-size:12px">ni coalición oportunista (desviación de derecha) ni minorías conspirativas e insurreccionales (desviación de izquierda):</text>
<text class="sv-t2" x="22" y="678" style="font-size:12px">el desafío táctico es convertir la tendencia a la guerra en construcción partidaria</text>
<line class="sv-line" x1="20" x2="50" y1="708" y2="708" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="58" y="712">causa → efecto</text>
<line class="sv-line-dash" x1="163.28" x2="193.28" y1="708" y2="708" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="201.28" y="712">relación · crítica</text>
<line class="sv-line-red" x1="328.64" x2="358.64" y1="708" y2="708" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="366.64" y="712">eje de la respuesta marxista</text>
</svg>
