<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 1 con doce nodos: crítica de la economía política y totalidad, dialéctica hegeliana, crisis, ideología burguesa, fetichismo, comunismo, clase obrera organizada, salidas falsas, opresiones específicas y vida cotidiana, Estado y democracia, teoría y praxis, y derrota histórica y posmodernidad, unidos por aristas etiquetadas que indican en qué artículos se desarrolla cada relación; al pie, la clave de los quince artículos." viewBox="0 0 760 700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-mapa-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<path class="sv-line" marker-end="url(#m1-mapa-arrow)" d="M96 60 V24 H472 V60"/>
<text class="sv-t3" text-anchor="middle" x="284" y="19">la crisis como escasez de plusvalía (art. 1)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="200" y1="82" x2="180" y2="82"/>
<text class="sv-t3" text-anchor="middle" x="190" y="52">contra el kantismo (3)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="96" y1="124" x2="96" y2="246"/>
<text class="sv-t3" x="102" y="170">el capital es</text>
<text class="sv-t3" x="102" y="184">relación social (1, 2)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="284" y1="124" x2="284" y2="246"/>
<text class="sv-t3" x="290" y="146">de la esencia al</text>
<text class="sv-t3" x="290" y="160">concepto (4, 5)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="472" y1="124" x2="472" y2="246"/>
<text class="sv-t3" x="478" y="170">facilita, no garantiza,</text>
<text class="sv-t3" x="478" y="184">la subjetividad (1)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="660" y1="124" x2="660" y2="246"/>
<text class="sv-t3" text-anchor="end" x="654" y="206">reformismo (1, 2, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="388" y1="268" x2="368" y2="268"/>
<text class="sv-t3" text-anchor="middle" x="378" y="226">abole la forma-valor</text>
<text class="sv-t3" text-anchor="middle" x="378" y="240">(1, 7, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="96" y1="310" x2="96" y2="432"/>
<text class="sv-t3" text-anchor="end" x="90" y="330">vida</text>
<text class="sv-t3" text-anchor="end" x="90" y="344">cotidiana</text>
<text class="sv-t3" text-anchor="end" x="90" y="358">(8, 13,</text>
<text class="sv-t3" text-anchor="end" x="90" y="372">14, 15)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="170" y1="310" x2="220" y2="432"/>
<text class="sv-t3" x="106" y="392">formas</text>
<text class="sv-t3" x="106" y="406">alienadas</text>
<text class="sv-t3" x="106" y="420">(2, 11, 12, 13)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="284" y1="310" x2="284" y2="432"/>
<text class="sv-t3" x="290" y="332">extinción del Estado,</text>
<text class="sv-t3" x="290" y="346">un solo mundo (4, 12, 13)</text>
<path class="sv-line-dash" marker-end="url(#m1-mapa-arrow)" d="M620 310 V376 H304 V432"/>
<text class="sv-t3" x="312" y="396">integración estatal</text>
<text class="sv-t3" x="312" y="410">(7, 8, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="472" y1="432" x2="472" y2="310"/>
<text class="sv-t3" x="478" y="396">condición del</text>
<text class="sv-t3" x="478" y="410">movimiento (6, 7)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="660" y1="432" x2="660" y2="310"/>
<text class="sv-t3" x="666" y="332">dos vías</text>
<text class="sv-t3" x="666" y="346">falsas (9, 10)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="576" y1="454" x2="556" y2="454"/>
<text class="sv-t3" text-anchor="middle" x="566" y="516">respiro del pensamiento (6, 10)</text>
<rect class="sv-box-ink" rx="2" x="12" y="60" width="168" height="64"/>
<text class="sv-tw" text-anchor="middle" x="96" y="81">Crítica de la economía</text>
<text class="sv-tw" text-anchor="middle" x="96" y="98">política · totalidad</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="96" y="115">ciencia · filosofía · política</text>
<rect class="sv-box" rx="2" x="200" y="60" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="284" y="81">Dialéctica</text>
<text class="sv-t" text-anchor="middle" x="284" y="98">hegeliana</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="115">esencia, concepto, alienación</text>
<rect class="sv-box" rx="2" x="388" y="60" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="472" y="81">Crisis y caída de la</text>
<text class="sv-t" text-anchor="middle" x="472" y="98">tasa de ganancia</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="472" y="115">inmanente a la acumulación</text>
<rect class="sv-box" rx="2" x="576" y="60" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="660" y="81">Ideología burguesa:</text>
<text class="sv-t" text-anchor="middle" x="660" y="98">escisión de esferas</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="660" y="115">producción vs. distribución</text>
<rect class="sv-box-red" rx="2" x="12" y="246" width="168" height="64"/>
<text class="sv-tr" text-anchor="middle" x="96" y="267">Fetichismo: dinero,</text>
<text class="sv-tr" text-anchor="middle" x="96" y="284">Estado, Ley</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="96" y="301">poder social enajenado</text>
<rect class="sv-box-green" rx="2" x="200" y="246" width="168" height="64"/>
<text class="sv-tgr" text-anchor="middle" x="284" y="267">Comunismo: asociación</text>
<text class="sv-tgr" text-anchor="middle" x="284" y="284">de productores libres</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="301">abolición de la forma-valor</text>
<rect class="sv-box-blue" rx="2" x="388" y="246" width="168" height="64"/>
<text class="sv-tb" text-anchor="middle" x="472" y="267">Clase obrera organizada</text>
<text class="sv-tb" text-anchor="middle" x="472" y="284">movimiento de clase</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="472" y="301">auto-organización desde abajo</text>
<rect class="sv-box-red" rx="2" x="576" y="246" width="168" height="64"/>
<text class="sv-tr" text-anchor="middle" x="660" y="267">Salidas falsas</text>
<text class="sv-t2" text-anchor="middle" x="660" y="284">reformismo · nostalgia</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="660" y="301">identidad esencializada</text>
<rect class="sv-box" rx="2" x="12" y="432" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="96" y="453">Opresiones específicas</text>
<text class="sv-t" text-anchor="middle" x="96" y="470">y vida cotidiana</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="96" y="487">sexo-género · eros · deuda</text>
<rect class="sv-box-gold" rx="2" x="200" y="432" width="168" height="64"/>
<text class="sv-tg" text-anchor="middle" x="284" y="453">Estado, democracia</text>
<text class="sv-tg" text-anchor="middle" x="284" y="470">y ciudadanía</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="487">comunidad ilusoria · semblante</text>
<rect class="sv-box" rx="2" x="388" y="432" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="472" y="453">Teoría y praxis</text>
<text class="sv-t" text-anchor="middle" x="472" y="470">vanguardia</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="472" y="487">contra el activismo irreflexivo</text>
<rect class="sv-box" rx="2" x="576" y="432" width="168" height="64"/>
<text class="sv-t" text-anchor="middle" x="660" y="453">Derrota histórica</text>
<text class="sv-t" text-anchor="middle" x="660" y="470">y posmodernidad</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="660" y="487">realismo capitalista</text>
<rect class="sv-soft" rx="2" x="12" y="536" width="732" height="152"/>
<text class="sv-t3" x="24" y="554">flecha: un concepto fundamenta o conduce a otro · discontinua: igual, arista larga · (n): artículos que la desarrollan</text>
<text class="sv-t2" style="font-size:12px" x="24" y="576">1 · Ruiz — La crisis del capital</text>
<text class="sv-t2" style="font-size:12px" x="24" y="591">2 · Aguiriano — Marx sin atributos</text>
<text class="sv-t2" style="font-size:12px" x="24" y="606">3 · Fernández Barcina — Historia y sistema en Marx</text>
<text class="sv-t2" style="font-size:12px" x="24" y="621">4 · Moreno Tonda — Hegel y Marx sobre la libertad</text>
<text class="sv-t2" style="font-size:12px" x="24" y="636">5 · Brassier — Extraña igualdad (alienación)</text>
<text class="sv-t2" style="font-size:12px" x="24" y="651">6 · Fernández Bustos — Teoría y praxis en Adorno</text>
<text class="sv-t2" style="font-size:12px" x="24" y="666">7 · Plana — El legado del leninismo</text>
<text class="sv-t2" style="font-size:12px" x="24" y="681">8 · Bedmar — Frente al feminismo</text>
<text class="sv-t2" style="font-size:12px" x="390" y="576">9 · Rodríguez Rojo — Romanticismo económico</text>
<text class="sv-t2" style="font-size:12px" x="390" y="591">10 · Rodríguez Cueto — Comunismo y posmodernidad</text>
<text class="sv-t2" style="font-size:12px" x="390" y="606">11 · Clarke — Dinero, Estado, comunidad ilusoria</text>
<text class="sv-t2" style="font-size:12px" x="390" y="621">12 · Najarro — Badiou y la democracia</text>
<text class="sv-t2" style="font-size:12px" x="390" y="636">13 · Vidal-Molina y Vargas-Muñoz — Ciudadanía</text>
<text class="sv-t2" style="font-size:12px" x="390" y="651">14 · Arconada — El eros enajenado</text>
<text class="sv-t2" style="font-size:12px" x="390" y="666">15 · Del Pino — El fantasma de Marx (fetichismo)</text>
</svg>
