<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: el leninismo como cuenta pendiente, el ¿Qué hacer? como acción de vanguardia y el reproche de intelectualismo. Círculos concéntricos: en el centro las luchas económicas y sindicales (embrión de conciencia sólo en el momento álgido), rodeadas por el movimiento de clase del proletariado (comunidad política, unitaria pero no uniforme) y, como sector más avanzado dentro de ese anillo, la vanguardia y la teoría revolucionaria. Dos flechas salen del centro: espontáneamente hacia el oportunismo y, mediante lucha teórica y organización, hacia el potencial revolucionario. A la derecha, la línea temporal rusa 1880, 1890 y 1900. Debajo, por qué la conciencia desde fuera no es inversión idealista; la ambivalencia del proletariado, la teoría como condición de posibilidad y la vanguardia como parte de un todo en movimiento; y la conclusión sobre la hipostatización soviética y el proletariado ausente de hoy." role="img" viewBox="0 0 760 992" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-7-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: UNA CUENTA PENDIENTE CON EL LENINISMO</text>
<rect class="sv-soft" height="74" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">Leninismo: el conjunto de experiencias revolucionarias inspiradas por la teoría de Lenin, no la coartada ideológica del «socialismo real».</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">Las deudas históricas no se saldan apelando a la crítica: exigen práctica revolucionaria y rigor teórico. El ¿Qué hacer? es una «acción de</text>
<text class="sv-t2" style="font-size:12px" x="30" y="71">vanguardia», un ejercicio de voluntad política que resulta de la intelección de una situación histórica concreta. Reproche a desmontar:</text>
<text class="sv-t2" style="font-size:12px" x="30" y="86">«intelectualismo» y «vanguardismo», una élite activa y consciente (la vanguardia) frente a una masa pasiva y sin conciencia (populismo ruso).</text>
<circle class="sv-box-blue" cx="270" cy="320" r="180"></circle>
<circle class="sv-box" cx="270" cy="320" r="84"></circle>
<text class="sv-t" text-anchor="middle" x="270" y="306">Luchas económicas</text>
<text class="sv-t2" text-anchor="middle" x="270" y="322">sindicales, restringidas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="338">«embrión» de conciencia sólo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="353">en el momento álgido</text>
<text class="sv-tb" text-anchor="middle" x="270" y="424">Movimiento de clase del proletariado</text>
<text class="sv-t2" text-anchor="middle" x="270" y="440">organizaciones, teoría, internacionalismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="455">comunidad política contra otra clase,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="470">unitaria pero no uniforme</text>
<rect class="sv-box-red" height="60" rx="2" width="200" x="170" y="152"></rect>
<text class="sv-tr" text-anchor="middle" x="270.0" y="171.8">Vanguardia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270.0" y="188.2">teoría revolucionaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270.0" y="203.2">parte de un todo en movimiento</text>
<line class="sv-line-red" marker-end="url(#m1-7-arrow)" x1="270" x2="270" y1="236" y2="212"></line>
<text class="sv-t3" x="282" y="223">los elementos más avanzados</text>
<text class="sv-t3" x="282" y="236">elevan su conciencia</text>
<text class="sv-t3" x="20" y="124">desde fuera de la lucha económica,</text>
<text class="sv-t3" x="20" y="138">pero desde dentro del movimiento:</text>
<text class="sv-t3" x="20" y="152">lucha teórica entre destacamentos</text>
<line class="sv-line-dash" x1="120" x2="168" y1="162" y2="178"></line>
<path class="sv-line-dash" marker-end="url(#m1-7-arrow)" d="M186,320 H130 V520"></path>
<text class="sv-t3" text-anchor="end" x="122" y="444">espontáneamente:</text>
<text class="sv-t3" text-anchor="end" x="122" y="458">se realiza en el</text>
<text class="sv-t3" text-anchor="end" x="122" y="472">proceso mismo de</text>
<text class="sv-t3" text-anchor="end" x="122" y="486">las luchas</text>
<rect class="sv-box" height="64" rx="2" width="220" x="20" y="522"></rect>
<text class="sv-t" text-anchor="middle" x="130.0" y="544.2">Oportunismo</text>
<text class="sv-t2" style="font-size:11.8px" text-anchor="middle" x="130.0" y="561.2">Bernstein: «el movimiento lo es todo»</text>
<text class="sv-t2" style="font-size:11.8px" text-anchor="middle" x="130.0" y="576.0">sindicalista, reformista</text>
<path class="sv-line-red" marker-end="url(#m1-7-arrow)" d="M354,320 H410 V520"></path>
<text class="sv-t3" x="418" y="444">lucha teórica</text>
<text class="sv-t3" x="418" y="458">y organización:</text>
<text class="sv-t3" x="418" y="472">«por fuera» de lo</text>
<text class="sv-t3" x="418" y="486">sindical</text>
<rect class="sv-box-red" height="64" rx="2" width="240" x="290" y="522"></rect>
<text class="sv-tr" text-anchor="middle" x="410.0" y="543.8">Potencial revolucionario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="410.0" y="560.2">autonegación del proletariado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="410.0" y="575.2">negar la fuerza de trabajo: trabajo vivo</text>
<text class="sv-t3" x="560" y="124">EL CASO RUSO</text>
<line class="sv-line" marker-end="url(#m1-7-arrow)" x1="575" x2="575" y1="140" y2="480"></line>
<circle class="sv-dot" cx="575" cy="160" r="5"></circle>
<text class="sv-t" x="589" y="156">1880</text>
<text class="sv-t2" x="589" y="172">núcleos intelectuales</text>
<text class="sv-t2" x="589" y="186">sin movimiento</text>
<text class="sv-t2" style="font-size:12px" x="589" y="200">Plejánov, Axelrod: parte del</text>
<text class="sv-t2" style="font-size:12px" x="589" y="214">movimiento internacional,</text>
<text class="sv-t2" style="font-size:12px" x="589" y="228">no de las luchas rusas</text>
<circle class="sv-dot" cx="575" cy="265" r="5"></circle>
<text class="sv-t" x="589" y="261">1890</text>
<text class="sv-t2" x="589" y="277">oleada huelguística;</text>
<text class="sv-t2" x="589" y="291">los marxistas como</text>
<text class="sv-t2" style="font-size:12px" x="589" y="305">destacamento</text>
<text class="sv-t2" style="font-size:12px" x="589" y="319">huelgas de 1895-96:</text>
<text class="sv-t2" style="font-size:12px" x="589" y="333">conciencia «embrionaria»</text>
<circle class="sv-dot" cx="575" cy="370" r="5"></circle>
<text class="sv-t" x="589" y="366">1900</text>
<text class="sv-t2" x="589" y="382">economismo →</text>
<text class="sv-t2" x="589" y="396">oportunismo</text>
<text class="sv-t2" style="font-size:12px" x="589" y="410">dos corrientes antagónicas;</text>
<text class="sv-t2" style="font-size:12px" x="589" y="424">Lenin: necesidad de la</text>
<text class="sv-t2" style="font-size:12px" x="589" y="438">«conciencia desde fuera»</text>
<text class="sv-t3" x="20" y="612">POR QUÉ LA «CONCIENCIA DESDE FUERA» NO ES INVERSIÓN IDEALISTA NI PASIVIDAD DE LAS MASAS</text>
<rect class="sv-soft" height="60" rx="2" width="720" x="20" y="620"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="637">El ser social está ligado a actos de conciencia (Lukács); la conciencia es activa y constitutiva («no sólo refleja el mundo objetivo, sino que</text>
<text class="sv-t2" style="font-size:12px" x="30" y="652">lo crea», Lenin). La teoría es una forma particular de la conciencia del movimiento, no un saber por encima del proceso social. Lo político es</text>
<text class="sv-t2" style="font-size:12px" x="30" y="667">«concentrado» de lo económico, no su opuesto. Que el marxismo ruso naciera en 1880 sin movimiento obrero es un hecho empírico, no una tesis.</text>
<text class="sv-t3" x="20" y="706">TRES PRESUPUESTOS QUE SOSTIENEN EL ESQUEMA</text>
<rect class="sv-box-blue" height="122" rx="2" width="230" x="20" y="714"></rect>
<text class="sv-tb" style="font-size:13px" text-anchor="middle" x="135.0" y="734.5">Ambivalencia del proletariado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="750.5">capital (fuerza de trabajo) y</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="765.5">no-capital (trabajo vivo). Mejorar la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="780.5">venta de la fuerza de trabajo afirma</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="795.5">el capital; sindicatos reaccionarios</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="810.5">cuando el Estado integra sus</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135.0" y="825.5">reivindicaciones</text>
<rect class="sv-box" height="122" rx="2" width="230" x="265" y="714"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="380.0" y="734.5">Teoría ≠ movimiento revolucionario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="750.5">la teoría revolucionaria es condición</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="765.5">de posibilidad, no el movimiento</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="780.5">mismo. La conciencia revolucionaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="795.5">sólo existe en la acción que</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="810.5">revoluciona; su germen se reconoce</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="825.5">retroactivamente</text>
<rect class="sv-box-red" height="122" rx="2" width="230" x="510" y="714"></rect>
<text class="sv-tr" style="font-size:13px" text-anchor="middle" x="625.0" y="734.5">Vanguardia: parte de un todo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="750.5">concepto militar: avanzadilla de una</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="765.5">fuerza en movimiento; se constituye</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="780.5">«impulsando adelante» (Marx, 1848 y</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="795.5">1871). División trabajo manual /</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="810.5">intelectual: asimetría en elaborar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625.0" y="825.5">la teoría, no en aprehenderla</text>
<text class="sv-t3" x="20" y="862">CONCLUSIÓN</text>
<rect class="sv-soft" height="74" rx="2" width="720" x="20" y="870"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="887">La hipostatización de la vanguardia como entidad autosustentada, capaz de sobrevivir a la desarticulación del movimiento, no es de Lenin:</text>
<text class="sv-t2" style="font-size:12px" x="30" y="902">es obra del dogma de Estado soviético y de la aristocracia obrera estajanovista. Hoy el proletariado está ausente, sin articulación política</text>
<text class="sv-t2" style="font-size:12px" x="30" y="917">ni vanguardia: de nada sirve apelar a las partes mutiladas de un cuerpo que ya no existe; reanimar el espíritu exige escindirse</text>
<text class="sv-t2" style="font-size:12px" x="30" y="932">de los cuerpos extraños que retienen la potencia revolucionaria y dotarse de uno propio.</text>
<text class="sv-t3" text-anchor="middle" x="380" y="964">flecha de color: realización organizada, elevación de la conciencia · flecha discontinua: deriva espontánea</text>
<text class="sv-t3" text-anchor="middle" x="380" y="980">línea de puntos: ubicación de la vanguardia (fuera de lo sindical, dentro del movimiento)</text>
</svg>
