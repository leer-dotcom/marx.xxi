<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, matriz de tres acuerdos compartidos y un desacuerdo entre socialdemocracia y socialismo; en medio, la cadena del primer argumento: socialidad disociada, compulsión M a M prima, capital como valor-en-proceso, subordinación de capitalistas y Estado, reformas decisivas rescindidas o superación; abajo, cadena causal desde la proliferación de sistemas nacionales de innovación hasta el estancamiento secular, que bifurca en barbarie o socialización de la inversión" role="img" viewBox="0 0 760 743" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-9-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="start" x="20" y="22">PUNTO DE PARTIDA · tres acuerdos y un desacuerdo</text>
<rect class="sv-box-red" height="26" rx="2" width="250" x="230" y="30"></rect>
<text class="sv-tr" text-anchor="middle" x="355" y="47">Socialdemocracia</text>
<rect class="sv-box-blue" height="26" rx="2" width="250" x="490" y="30"></rect>
<text class="sv-tb" text-anchor="middle" x="615" y="47">Socialismo</text>
<rect class="sv-soft" height="28" rx="2" width="200" x="20" y="62"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="80">1. florecimiento humano parcial</text>
<rect class="sv-box" height="28" rx="2" width="510" x="230" y="62"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="80" style="font-size:12px">acuerdo: el capitalismo lo impulsó (ciencia, esperanza de vida, igualdad legal)</text>
<rect class="sv-soft" height="28" rx="2" width="200" x="20" y="96"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="114">2. limitado y precario</text>
<rect class="sv-box" height="28" rx="2" width="510" x="230" y="96"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="114" style="font-size:12px">acuerdo: recursos para el beneficio privado, desigualdades de poder y acceso</text>
<rect class="sv-soft" height="28" rx="2" width="200" x="20" y="130"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="148">3. imperativo de un mundo mejor</text>
<rect class="sv-box" height="28" rx="2" width="510" x="230" y="130"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="148" style="font-size:12px">acuerdo: construir un mundo que impulse el florecimiento más allá del capitalismo</text>
<rect class="sv-soft" height="74" rx="2" width="200" x="20" y="164"></rect>
<text class="sv-t" text-anchor="middle" x="120" y="196">4. los defectos son…</text>
<text class="sv-t3" text-anchor="middle" x="120" y="214">el desacuerdo</text>
<rect class="sv-box-red" height="74" rx="2" width="250" x="230" y="164"></rect>
<text class="sv-t2" text-anchor="middle" x="355" y="182">remediables con regulación</text>
<text class="sv-t3" text-anchor="middle" x="355" y="198" style="font-size:10.5px">codeterminación, renta mínima,</text>
<text class="sv-t3" text-anchor="middle" x="355" y="212" style="font-size:10.5px">pleno empleo, impuestos a la riqueza,</text>
<text class="sv-t3" text-anchor="middle" x="355" y="226" style="font-size:10.5px">regulación financiera, antimonopolio…</text>
<rect class="sv-box-blue" height="74" rx="2" width="250" x="490" y="164"></rect>
<text class="sv-t2" text-anchor="middle" x="615" y="182">intrínsecos: «features, not bugs»</text>
<text class="sv-t3" text-anchor="middle" x="615" y="198" style="font-size:10.5px">valorización como fin;</text>
<text class="sv-t3" text-anchor="middle" x="615" y="212" style="font-size:10.5px">las reformas decisivas → superación</text>
<text class="sv-t3" text-anchor="middle" x="615" y="226" style="font-size:10.5px">de la era capitalista</text>
<text class="sv-t3" text-anchor="start" x="20" y="266">ARGUMENTO 1 · qué es el capital (El Capital, Marx)</text>
<rect class="sv-box" height="54" rx="2" width="170" x="20" y="274"></rect>
<text class="sv-t" text-anchor="middle" x="105.0" y="293">Socialidad disociada</text>
<text class="sv-t2" text-anchor="middle" x="105.0" y="308" style="font-size:11.5px">producción privada sin</text>
<text class="sv-t2" text-anchor="middle" x="105.0" y="321" style="font-size:11.5px">coordinación social</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="190" x2="200" y1="301.0" y2="301.0"></line>
<rect class="sv-box" height="54" rx="2" width="170" x="200" y="274"></rect>
<text class="sv-t" text-anchor="middle" x="285.0" y="293">Compulsión M → M′</text>
<text class="sv-t2" text-anchor="middle" x="285.0" y="308" style="font-size:11.5px">valorización como fin;</text>
<text class="sv-t2" text-anchor="middle" x="285.0" y="321" style="font-size:11.5px">no el consumo (A. Smith)</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="370" x2="380" y1="301.0" y2="301.0"></line>
<rect class="sv-box" height="54" rx="2" width="170" x="380" y="274"></rect>
<text class="sv-t" text-anchor="middle" x="465.0" y="293" style="font-size:13px">Capital: valor-en-proceso</text>
<text class="sv-t2" text-anchor="middle" x="465.0" y="308" style="font-size:11.5px">región de la ontología social</text>
<text class="sv-t2" text-anchor="middle" x="465.0" y="321" style="font-size:11.5px">con poder real sobre el mundo</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="550" x2="560" y1="301.0" y2="301.0"></line>
<rect class="sv-box" height="54" rx="2" width="170" x="560" y="274"></rect>
<text class="sv-t" text-anchor="middle" x="645.0" y="293">Todo subordinado</text>
<text class="sv-t2" text-anchor="middle" x="645.0" y="308" style="font-size:11.5px">también capitalistas y Estado</text>
<text class="sv-t2" text-anchor="middle" x="645.0" y="321" style="font-size:11px">(«El Capital, no Los Capitalistas»)</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="645.0" x2="645.0" y1="328" y2="346"></line>
<rect class="sv-box-ink" height="62" rx="2" width="720" x="20" y="346"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="364" style="font-size:13px">Los males que lamenta la socialdemocracia son rasgos del sistema;</text>
<text class="sv-tw" text-anchor="middle" x="380" y="381" style="font-size:13px">una reforma decisiva se rescinde o se inserta en la superación del capitalismo</text>
<text class="sv-tw" text-anchor="middle" x="380" y="398" style="font-size:11px">(como la esclavitud: hubo formas más humanas, ninguna aceptable → imperativo de disolver las relaciones de las que emerge el capital)</text>
<text class="sv-t3" text-anchor="start" x="20" y="438">ARGUMENTO 2 · en qué se ha convertido el capitalismo</text>
<rect class="sv-box" height="50" rx="2" width="170" x="20" y="446"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="466">Proliferan los sistemas</text>
<text class="sv-t2" text-anchor="middle" x="105" y="482">nacionales de innovación</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="190" x2="205" y1="471.0" y2="471.0"></line>
<rect class="sv-box" height="50" rx="2" width="170" x="205" y="446"></rect>
<text class="sv-t" text-anchor="middle" x="290" y="466">Duplicación rápida</text>
<text class="sv-t2" text-anchor="middle" x="290" y="482">de las innovaciones</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="375" x2="390" y1="471.0" y2="471.0"></line>
<rect class="sv-box" height="50" rx="2" width="170" x="390" y="446"></rect>
<text class="sv-t" text-anchor="middle" x="475" y="466">Ventana de ganancia</text>
<text class="sv-t2" text-anchor="middle" x="475" y="482">extraordinaria más corta</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="560" x2="575" y1="471.0" y2="471.0"></line>
<rect class="sv-box" height="50" rx="2" width="170" x="575" y="446"></rect>
<text class="sv-t" text-anchor="middle" x="660" y="466">Sobreacumulación</text>
<text class="sv-t2" text-anchor="middle" x="660" y="482">en los sectores dinámicos</text>
<text class="sv-t3" text-anchor="start" x="20" y="510" style="font-size:10px">sistemas costosos (I+D, universidades, capital riesgo, abogados de propiedad</text>
<text class="sv-t3" text-anchor="start" x="20" y="523" style="font-size:10px">intelectual); hoy hay más y mejores que nunca · fin de las ventajas competitivas de</text>
<text class="sv-t3" text-anchor="start" x="20" y="536" style="font-size:10px">décadas (Reino Unido; EEUU y Alemania; fordismo): ningún grupo de capitales volverá a gozarlas</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="660" x2="660" y1="496" y2="548"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="575" y="548"></rect>
<text class="sv-t" text-anchor="middle" x="660" y="566">Caída de la tasa</text>
<text class="sv-t2" text-anchor="middle" x="660" y="582">de ganancia</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="575" x2="552" y1="570" y2="570"></line>
<rect class="sv-box-ink" height="44" rx="2" width="260" x="290" y="548"></rect>
<text class="sv-tw" text-anchor="middle" x="420" y="566">Estancamiento secular</text>
<text class="sv-tw" text-anchor="middle" x="420" y="582">«no habrá más eras doradas»</text>
<text class="sv-t3" text-anchor="end" x="275" y="562" style="font-size:10.5px">por exceso de innovación,</text>
<text class="sv-t3" text-anchor="end" x="275" y="576" style="font-size:10.5px">no por escasez (vs. Gordon)</text>
<text class="sv-t3" text-anchor="end" x="275" y="590" style="font-size:10.5px">ni por exceso de ahorro</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="380" x2="240" y1="592" y2="628"></line>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="460" x2="580" y1="592" y2="628"></line>
<rect class="sv-box-red" height="64" rx="2" width="320" x="50" y="630"></rect>
<text class="sv-tr" text-anchor="middle" x="210" y="650">Formas brutales de valorización: barbarie</text>
<text class="sv-t2" text-anchor="middle" x="210" y="667" style="font-size:11.5px">guerra al trabajo (más explotación) · monopolios</text>
<text class="sv-t2" text-anchor="middle" x="210" y="682" style="font-size:11.5px">de propiedad intelectual · financiarización y burbujas</text>
<rect class="sv-box-green" height="64" rx="2" width="320" x="420" y="630"></rect>
<text class="sv-tgr" text-anchor="middle" x="580" y="650">Socialización radical de la inversión</text>
<text class="sv-t2" text-anchor="middle" x="580" y="667" style="font-size:11.5px">socialismo (el Green New Deal no basta:</text>
<text class="sv-t2" text-anchor="middle" x="580" y="682" style="font-size:11.5px">el proyecto socialdemócrata deviene socialista)</text>
<text class="sv-t3" text-anchor="middle" x="210" y="712" style="font-size:10px">la vía «sana» del desarrollo capitalista está fuera de oferta:</text>
<text class="sv-t3" text-anchor="middle" x="210" y="725" style="font-size:10px">la alternativa de Luxemburgo, socialismo o barbarie, es inevitable</text>
<text class="sv-t3" text-anchor="middle" x="580" y="712" style="font-size:10px">GND financiado con dinero-crédito de bancos centrales →</text>
<text class="sv-t3" text-anchor="middle" x="580" y="725" style="font-size:10px">sobreacumulación aún más rápida antes de ninguna «edad dorada»</text>
</svg>
