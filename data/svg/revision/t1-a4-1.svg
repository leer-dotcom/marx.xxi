<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, por qué volver a Hegel (repetir Lenin; la Lógica es emancipadora). Tres filas paralelas de tránsito: lógica del ser, de la esencia y del concepto; familia, sociedad civil y Estado; premodernidad, reino de la necesidad y reino de la libertad. Una barrera marca el bloqueo bajo el capitalismo entre la segunda y la tercera columna (el Estado sometido al mercado; situación objetivamente irracional), con la nota de que esto no va contra Hegel; una flecha alternativa salta hacia la asociación libre de productores. Abajo, del pseudoactivismo a la refundación teórica." role="img" viewBox="0 0 760 562" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">POR QUÉ VOLVER A HEGEL</text>
<rect class="sv-soft" height="56" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">Repetir el gesto de Lenin (Cuadernos filosóficos, 1914): sacar al marxismo del «fango» del Diamat con la mano amiga de Hegel</text>
<text class="sv-t2" style="font-size:12px" x="30" y="55">y repensar qué es una sociedad emancipada. La Lógica es emancipadora: las categorías no son etiquetas, sino formas que</text>
<text class="sv-t2" style="font-size:12px" x="30" y="69">estructuran la conciencia y la relación con lo real; aprehenderlas unilateralmente produce atomismo (Houlgate, Pippin).</text>
<text class="sv-t3" x="15" y="126">LÓGICA</text>
<text class="sv-t3" x="15" y="202">ETICIDAD</text>
<text class="sv-t3" x="15" y="278">HISTORIA</text>
<rect class="sv-box" height="64" rx="2" width="200" x="100" y="90"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="126">Lógica del ser</text>
<rect class="sv-box-blue" height="64" rx="2" width="200" x="315" y="90"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="110">Lógica de la esencia</text>
<text class="sv-t2" text-anchor="middle" x="415" y="126">oposición, apariencia</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="415" y="142">negatividad, ilusión, reflexión</text>
<rect class="sv-box-green" height="64" rx="2" width="200" x="530" y="90"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="110">Lógica del concepto</text>
<text class="sv-t2" text-anchor="middle" x="630" y="126">unidad libre de U-P-S</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="630" y="142">«el concepto es lo libre»</text>
<rect class="sv-box" height="64" rx="2" width="200" x="100" y="166"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="202">Familia</text>
<rect class="sv-box-blue" height="64" rx="2" width="200" x="315" y="166"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="186">Sociedad civil</text>
<text class="sv-t2" text-anchor="middle" x="415" y="202" style="font-size:12.3px;letter-spacing:0">sistema de necesidades, mercado</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="415" y="218">mercado «bestia salvaje»; plebe</text>
<rect class="sv-box-green" height="64" rx="2" width="200" x="530" y="166"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="186">Estado</text>
<text class="sv-t2" text-anchor="middle" x="630" y="202">libertad concreta</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="630" y="218">vive de la lucha reglada de clases</text>
<rect class="sv-box" height="64" rx="2" width="200" x="100" y="242"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="272">(premoderno)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="200" y="290">relación inmediata y natural</text>
<rect class="sv-box-blue" height="64" rx="2" width="200" x="315" y="242"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="262">Reino de la necesidad</text>
<text class="sv-t2" text-anchor="middle" x="415" y="278">capitalismo</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="415" y="294">individualidad desgarrada</text>
<rect class="sv-box-green" height="64" rx="2" width="200" x="530" y="242"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="262">Reino de la libertad</text>
<text class="sv-t2" text-anchor="middle" x="630" y="278">comunismo</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="630" y="294">universalidad activa + subjetividad</text>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="122" y2="122"></line>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="198" y2="198"></line>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="274" y2="274"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="122" y2="122"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="198" y2="198"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="274" y2="274"></line>
<line class="sv-line-red" x1="522" x2="522" y1="78" y2="316"></line>
<rect class="sv-soft" height="76" rx="2" width="310" x="430" y="324"></rect>
<text class="sv-tr" x="438" y="341">bloqueo bajo el capitalismo:</text>
<text class="sv-t2" style="font-size:12px" x="438" y="356">el Estado, sometido al mercado, no realiza la libertad:</text>
<text class="sv-t2" style="font-size:12px" x="438" y="370">«junta administradora de los negocios comunes de la</text>
<text class="sv-t2" style="font-size:12px" x="438" y="384">clase burguesa»; los individuos no se reconocen en sus</text>
<text class="sv-t2" style="font-size:12px" x="438" y="398">instituciones → situación objetivamente irracional</text>
<rect class="sv-soft" height="76" rx="2" width="380" x="20" y="324"></rect>
<text class="sv-t3" x="28" y="341">ESTO NO VA CONTRA HEGEL, SINO A SU FAVOR</text>
<text class="sv-t2" style="font-size:12px" x="28" y="356">«lo racional es real» no canoniza lo inmediato; el contenido de</text>
<text class="sv-t2" style="font-size:12px" x="28" y="370">los conceptos es histórico y la Lógica es un «work in progress».</text>
<text class="sv-t2" style="font-size:12px" x="28" y="384">Tesis (Abazari, Pippin): bajo el capitalismo no hay tránsito de la</text>
<text class="sv-t2" style="font-size:12px" x="28" y="398">esencia al concepto, del reino de la necesidad al de la libertad.</text>
<path class="sv-line-red" d="M415 306 V432 H540" marker-end="url(#m1-4-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="200" x="540" y="408"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="428">Asociación libre</text>
<text class="sv-t2" text-anchor="middle" x="640" y="444">de productores (comuna)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="460">metabolismo bajo control colectivo</text>
<text class="sv-tr" x="20" y="428">salto: abolición de la propiedad privada,</text>
<text class="sv-t2" x="20" y="444">el trabajo asalariado y la familia burguesa</text>
<text class="sv-t2" style="font-size:12px" x="20" y="460">(pilar de la reproducción social del obrero)</text>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="20" x2="50" y1="484" y2="484"></line>
<text class="sv-t3" x="58" y="488">tránsito que exige el concepto, bloqueado bajo el capitalismo</text>
<line class="sv-line-red" marker-end="url(#m1-4-arrow)" x1="470" x2="500" y1="484" y2="484"></line>
<text class="sv-t3" x="508" y="488">única transición real: el salto</text>
<rect class="sv-soft" height="56" rx="2" width="720" x="20" y="496"></rect>
<text class="sv-t3" x="30" y="513">TAREA</text>
<text class="sv-t2" style="font-size:12px" x="90" y="513">pasar de un pseudoactivismo (praxis vacía, recurrente e inercial) a una refundación teórica: pensar aquí y hoy</text>
<text class="sv-t2" style="font-size:12px" x="30" y="528">qué es ser libre; un marxismo hegeliano que cuestione la inteligibilidad de un comunismo nacido de las entrañas</text>
<text class="sv-t2" style="font-size:12px" x="30" y="543">del capitalismo. Sólo en una sociedad comunista puede la libertad elevarse hasta su concepto.</text>
</svg>
