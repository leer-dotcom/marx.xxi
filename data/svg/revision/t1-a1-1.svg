<svg xmlns="http://www.w3.org/2000/svg" aria-label="Oposición entre la teoría de la realización y la teoría de la valorización (causa, síntoma, crítica, raíz teórica e implicación política), y cadena cíclica de la valorización: competencia, innovación, composición orgánica, caída de la tasa de ganancia contrarrestada por la tasa de explotación, detención de la acumulación, crisis, concentración y nueva fase de acumulación; abajo, la conclusión política: sólo la clase trabajadora organizada puede abolir el capital." role="img" viewBox="0 0 760 610" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">DOS EXPLICACIONES MARXISTAS DE LA CRISIS</text>
<rect class="sv-soft" height="286" rx="2" width="350" x="20" y="24"></rect>
<rect class="sv-box-blue" height="32" rx="2" width="330" x="30" y="34"></rect>
<text class="sv-tb" text-anchor="middle" x="195" y="55">Teoría de la realización (subconsumismo)</text>
<text class="sv-t3" x="30" y="86">CAUSA</text>
<text class="sv-t2" x="30" y="101">contradicción producción-consumo; anarquía del mercado</text>
<text class="sv-t3" x="30" y="122">SÍNTOMA LEÍDO COMO CAUSA</text>
<text class="sv-t2" x="30" y="137">sobreproducción, demanda insuficiente, salarios bajos</text>
<text class="sv-t3" x="30" y="158">CRÍTICA DE RUIZ</text>
<text class="sv-t2" style="font-size:12px" x="30" y="173">la sobreproducción es constante en todo el ciclo; los salarios</text>
<text class="sv-t2" style="font-size:12px" x="30" y="187">no caen antes de la recesión: la demanda insuficiente es efecto</text>
<text class="sv-t3" x="30" y="208">RAÍZ TEÓRICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="223">escisión marginalista entre lo económico y lo social;</text>
<text class="sv-t2" style="font-size:12px" x="30" y="237">separa producción y distribución: más Keynes que Marx</text>
<text class="sv-t3" x="30" y="258">IMPLICACIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="273">reformismo keynesiano: capitalismo injusto pero eterno,</text>
<text class="sv-t2" style="font-size:12px" x="30" y="287">corregible por redistribución</text>
<rect class="sv-soft" height="286" rx="2" width="350" x="390" y="24"></rect>
<rect class="sv-box-red" height="32" rx="2" width="330" x="400" y="34"></rect>
<text class="sv-tr" text-anchor="middle" x="565" y="55">Teoría de la valorización (rentabilidad)</text>
<text class="sv-t3" x="400" y="86">CAUSA</text>
<text class="sv-t2" x="400" y="101">rentabilidad: la crisis nace en la acumulación misma</text>
<text class="sv-t3" x="400" y="122">LO QUE SE VE COMO SÍNTOMA</text>
<text class="sv-t2" x="400" y="137">mercancías invendibles = escasez de plusvalía</text>
<text class="sv-t3" x="400" y="158">LEY TENDENCIAL</text>
<text class="sv-t2" style="font-size:12px" x="400" y="173">caída de la tasa de ganancia: lo que salva a cada capital</text>
<text class="sv-t2" style="font-size:12px" x="400" y="187">(↑ productividad) condena al capital en general</text>
<text class="sv-t3" x="400" y="208">RAÍZ TEÓRICA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="223">totalidad (Lukács): economía y sociedad son una unidad;</text>
<text class="sv-t2" style="font-size:12px" x="400" y="237">la ley del valor es ante todo un funcionamiento social</text>
<text class="sv-t3" x="400" y="258">IMPLICACIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="273">crisis inherente al capital; sólo cabe su abolición</text>
<text class="sv-t2" style="font-size:12px" x="400" y="287">(la crítica de la economía política como arma, no descripción)</text>
<text class="sv-t3" x="20" y="334">CADENA CÍCLICA DE LA VALORIZACIÓN</text>
<rect class="sv-box" height="44" rx="2" width="160" x="20" y="346"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="372">Competencia</text>
<rect class="sv-box" height="44" rx="2" width="160" x="200" y="346"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="365">Innovación técnica</text>
<text class="sv-t2" text-anchor="middle" x="280" y="380">(más capital fijo)</text>
<rect class="sv-box" height="44" rx="2" width="160" x="380" y="346"></rect>
<text class="sv-t" text-anchor="middle" x="460" y="365">↑ composición</text>
<text class="sv-t" text-anchor="middle" x="460" y="380">orgánica del capital</text>
<rect class="sv-box-red" height="44" rx="2" width="160" x="560" y="346"></rect>
<text class="sv-tr" text-anchor="middle" x="640" y="372">↓ tasa de ganancia</text>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="180" x2="200" y1="368" y2="368"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="360" x2="380" y1="368" y2="368"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="540" x2="560" y1="368" y2="368"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="640" x2="640" y1="390" y2="470"></line>
<text class="sv-t3" x="650" y="433">ley tendencial</text>
<rect class="sv-soft" height="58" rx="2" width="360" x="200" y="401"></rect>
<text class="sv-t3" x="208" y="417">FACTOR CONTRARRESTANTE FUNDAMENTAL</text>
<text class="sv-t2" style="font-size:12px" x="208" y="433">↑ tasa de explotación (plusvalor / valor generado): se dirime</text>
<text class="sv-t2" style="font-size:12px" x="208" y="447">socialmente, por la lucha de clases, no técnicamente; no es calculable</text>
<rect class="sv-box" height="44" rx="2" width="160" x="560" y="470"></rect>
<text class="sv-t" text-anchor="middle" x="640" y="489">Detención de</text>
<text class="sv-t" text-anchor="middle" x="640" y="504">la acumulación</text>
<rect class="sv-box-ink" height="44" rx="2" width="160" x="380" y="470"></rect>
<text class="sv-tw" text-anchor="middle" x="460" y="489">CRISIS</text>
<text class="sv-tw" text-anchor="middle" x="460" y="504">reajuste violento</text>
<rect class="sv-box" height="44" rx="2" width="160" x="200" y="470"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="489">↑ concentración</text>
<text class="sv-t" text-anchor="middle" x="280" y="504">↑ tasa de explotación</text>
<rect class="sv-box-blue" height="44" rx="2" width="160" x="20" y="470"></rect>
<text class="sv-tb" text-anchor="middle" x="100" y="489">Nueva fase</text>
<text class="sv-tb" text-anchor="middle" x="100" y="504">de acumulación</text>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="560" x2="540" y1="492" y2="492"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="380" x2="360" y1="492" y2="492"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="200" x2="180" y1="492" y2="492"></line>
<line class="sv-line-red" marker-end="url(#m1-1-arrow)" x1="100" x2="100" y1="470" y2="390"></line>
<text class="sv-t3" text-anchor="middle" transform="rotate(-90 88 430)" x="88" y="430">el ciclo se reabre</text>
<rect class="sv-soft" height="62" rx="2" width="720" x="20" y="534"></rect>
<text class="sv-t3" x="30" y="551">CONCLUSIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="567">La crisis es un «mecanismo sanador» necesario que ningún agente (técnicos, Estado, burguesía) puede evitar: el capital somete</text>
<text class="sv-t2" style="font-size:12px" x="30" y="581">también al capitalista. La miseria no activa por sí sola la subjetividad revolucionaria: hace falta un proyecto organizado.</text>
</svg>
