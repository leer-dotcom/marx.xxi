<svg xmlns="http://www.w3.org/2000/svg" aria-label="Inversión de la jerarquía entre medios y fines con el socialismo en un solo país, con los dos pilares internacionalistas de Lenin que desaparecen; debajo, los tres pilares del estalinismo con sus antecedentes de preguerra y el mecanismo material de su retorno" role="img" viewBox="0 0 760 686" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">INVERSIÓN DE LA JERARQUÍA ENTRE MEDIOS Y FINES</text>
<path class="sv-line-dash" d="M380 32 L380 318"></path>
<text class="sv-t3" text-anchor="middle" x="195" y="44">ANTES · 1917-1923 · retiradas reconocidas</text>
<rect class="sv-box" height="44" rx="2" width="280" x="55" y="56"></rect>
<text class="sv-t" text-anchor="middle" x="195" y="75">Estado soviético</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="195" y="92">defendido a cualquier precio, pero no como fin en sí</text>
<path class="sv-line" d="M195 100 L195 146" marker-end="url(#m5-4-arrow)"></path>
<text class="sv-t3" x="203" y="127">instrumento subordinado a</text>
<rect class="sv-box-red" height="44" rx="2" width="280" x="55" y="148"></rect>
<text class="sv-tr" text-anchor="middle" x="195" y="175">Revolución mundial</text>
<text class="sv-t" text-anchor="middle" x="195" y="214">Los dos pilares del programa de Lenin:</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="231">1 · el poder soviético es soporte de la revolución mundial</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="246">(cabe arriesgar su pérdida por la revolución alemana)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="261">2 · la revolución aislada en una economía atrasada</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="276">está condenada a hundirse sin extenderse</text>
<text class="sv-t2" text-anchor="middle" x="195" y="295">Brest-Litovsk (1918) y NEP (1921):</text>
<text class="sv-t2" text-anchor="middle" x="195" y="310">zigzags reversibles, nunca «avances»</text>
<text class="sv-t3" text-anchor="middle" x="565" y="44">DESPUÉS · 1924- · la retirada como avance</text>
<rect class="sv-box" height="44" rx="2" width="280" x="425" y="56"></rect>
<text class="sv-t" text-anchor="middle" x="565" y="75">Revolución mundial</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="565" y="92">proletariado mundial y Comintern</text>
<path class="sv-line-red" d="M565 100 L565 146" marker-end="url(#m5-4-arrow)"></path>
<text class="sv-t3" x="573" y="127">instrumento de la defensa de</text>
<rect class="sv-box-ink" height="44" rx="2" width="280" x="425" y="148"></rect>
<text class="sv-tw" text-anchor="middle" x="565" y="175">Estado soviético (URSS)</text>
<text class="sv-t" text-anchor="middle" x="565" y="214">Socialismo en un solo país (Stalin, 1924-26):</text>
<text class="sv-t2" text-anchor="middle" x="565" y="231">la capitulación convertida en principio</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="565" y="248">desaparecen los dos pilares: el aislamiento deja de ser</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="565" y="263">un límite y se vuelve programa positivo; el proletariado</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="565" y="278">de los demás países, sometido a los intereses de la URSS</text>
<text class="sv-t2" text-anchor="middle" x="565" y="297">1929, Gran Viraje: tercera retirada, una huida</text>
<text class="sv-t2" text-anchor="middle" x="565" y="312">hacia adelante presentada como ofensiva</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="328"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="345">LO QUE SE DISPUTABA EN 1924-26 NO ERA SI CONSTRUIR EL SOCIALISMO, SINO LA JERARQUÍA</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="380" y="363">¿la extensión de la revolución es condición de construir el socialismo en la URSS, o la construcción en la URSS es condición de extenderla?</text>
<text class="sv-t3" text-anchor="middle" x="380" y="398">LOS TRES PILARES DEL ESTALINISMO Y SUS ANTECEDENTES DE PREGUERRA</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10.5px" x="380" y="413">(posiciones del ala derecha del socialismo, derrotadas por el marxismo desde los años 70 del siglo XIX)</text>
<rect class="sv-box-gold" height="150" rx="2" width="220" x="20" y="424"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="446">Socialismo en un solo país</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="130" y="463">socialismo = construcción económica</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="130" y="477">nacionalmente delimitada</text>
<text class="sv-t2" text-anchor="middle" x="130" y="496">← socialismo nacional de Lassalle,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="511">Dühring, Schäffle y Vollmar</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="130" y="528">socialchovinismo germinal del que brotó</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="130" y="541">el ala reformista que traicionó en 1914</text>
<rect class="sv-box-gold" height="150" rx="2" width="220" x="270" y="424"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="446">Estado permanente</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="463">el Estado sobrevive a la «desaparición»</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="477">de las clases y ya no debe extinguirse</text>
<text class="sv-t2" text-anchor="middle" x="380" y="496">← «Estado popular libre» /</text>
<text class="sv-t2" text-anchor="middle" x="380" y="511">«Estado de todo el pueblo»</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="528">premisas en la «victoria del socialismo»</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="541">(1934) y la Constitución de 1936</text>
<rect class="sv-box-gold" height="150" rx="2" width="220" x="520" y="424"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="446">Estatalización = socialismo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="630" y="463">socialismo burocrático y redistributivo:</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="630" y="477">burócratas propietarios de cargos</text>
<text class="sv-t2" text-anchor="middle" x="630" y="496">← socialismo de Estado</text>
<text class="sv-t2" text-anchor="middle" x="630" y="511">bismarckiano</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="630" y="528">Engels: si estatalizar el tabaco</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="630" y="541">fuera socialismo, Napoleón y</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="630" y="554">Metternich lo serían</text>
<path class="sv-line" d="M380 574 L380 586" marker-end="url(#m5-4-arrow)"></path>
<rect class="sv-box" height="84" rx="2" width="720" x="20" y="588"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="608">Mecanismo del retorno: adaptación de un aparato, no adhesión deliberada a Lassalle o Bernstein</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="626">condiciones materiales (atraso, aislamiento) presionan sobre un aparato que prioriza su propia conservación sobre sus fines;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="642">en cada caso: concesión táctica → presentada como principio teórico → rehabilitación de una posición derrotada décadas atrás</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="660">a lo que se suma una «política de la movilización» mesiánica (Priestland): estabilidad de aparato + campañas voluntaristas</text>
</svg>
