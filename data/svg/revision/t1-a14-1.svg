<svg xmlns="http://www.w3.org/2000/svg" aria-label="Triángulo de Penrose cuyos tres lados son la inmediatez y expropiación del tiempo, el control-estimulación y el empoderamiento bajo la mirada masculina, y el singular como no-lugar; en el centro, el eros enajenado como mercancías relacionadas frente a relaciones mercantilizadas. Cajas laterales describen cada lado, con los modelos del empoderamiento (femme fatale, Carrie Bradshaw) y la anotación final de la autora sobre la superación parcial. Debajo, una línea causal: tiempo abstracto laboral, aceleración de toda la vida, apps de citas, complicidad exigida a contrarreloj y frustración con autoculpa." role="img" viewBox="0 0 760 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-14-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="22">TRIÁNGULO DE PENROSE: UNA FIGURA SIN SALIDA</text>
<rect class="sv-soft" height="64" rx="2" width="300" x="440" y="8"></rect>
<text class="sv-t3" x="450" y="24">NOTA</text>
<text class="sv-t2" style="font-size:12px" x="450" y="40">la autora llama «triángulo de Penrose» al circuito del</text>
<text class="sv-t2" style="font-size:12px" x="450" y="54">empoderamiento bajo la mirada masculina; aquí se extiende</text>
<text class="sv-t2" style="font-size:12px" x="450" y="68">a los tres lados. Las líneas discontinuas describen cada lado.</text>
<path class="sv-box-red" d="M380 40 L560 380 L516 380 L380 116 Z"></path>
<path class="sv-box-blue" d="M560 380 L200 380 L226 344 L516 344 Z"></path>
<path class="sv-box-gold" d="M200 380 L380 40 L403 78 L244 380 Z"></path>
<text class="sv-tr" text-anchor="middle" x="380" y="242">EROS ENAJENADO</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="260">«mercancías relacionadas»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="274">la mercancía como única</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="288">forma de experiencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="302">(reificación: Lukács, Jappe)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="380" y="316">no «relaciones mercantilizadas»:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="330">no hay arquetipo previo al capital</text>
<rect class="sv-box-gold" height="120" rx="2" width="180" x="20" y="120"></rect>
<text class="sv-tg" text-anchor="middle" x="110" y="142">Inmediatez</text>
<text class="sv-t2" text-anchor="middle" x="110" y="159">expropiación del tiempo;</text>
<text class="sv-t2" text-anchor="middle" x="110" y="174">el otro como información;</text>
<text class="sv-t2" text-anchor="middle" x="110" y="189">culto a la velocidad</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="110" y="205">del tiempo concreto (quehaceres)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="110" y="219">al tiempo abstracto (Kurz);</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="110" y="233">el otro, «evacuado» con rapidez</text>
<line class="sv-line-dash" x1="200" x2="296" y1="180" y2="195"></line>
<rect class="sv-box-red" height="134" rx="2" width="180" x="560" y="120"></rect>
<text class="sv-tr" text-anchor="middle" x="650" y="142">Control-estimulación</text>
<text class="sv-t2" text-anchor="middle" x="650" y="159">liberalización sexual;</text>
<text class="sv-t2" text-anchor="middle" x="650" y="174">empoderamiento bajo</text>
<text class="sv-t2" text-anchor="middle" x="650" y="189">la mirada masculina</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="205">del control-represión al Destape</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="219">(nicho de mercado); «si complace,</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="233">empodera»; la «libre elección»</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="247">es una farsa</text>
<line class="sv-line-dash" x1="560" x2="464" y1="180" y2="195"></line>
<rect class="sv-box-blue" height="92" rx="2" width="460" x="150" y="404"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="426">Singular como no-lugar</text>
<text class="sv-t2" text-anchor="middle" x="380" y="443">soltería como negación de sí; enajenación relacional</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="459">no-lugar (De Certeau, Augé): vía de paso, nunca destino; las apps sólo ponen</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="473">al individuo en contacto «con otra imagen de sí mismo»; como el obrero no se ve</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="487">en el producto acabado, el individuo no se ve reflejado en la relación</text>
<line class="sv-line-dash" x1="380" x2="380" y1="380" y2="404"></line>
<rect class="sv-soft" height="112" rx="2" width="180" x="20" y="262"></rect>
<text class="sv-t3" x="30" y="280">ANOTACIÓN FINAL</text>
<text class="sv-t2" style="font-size:12px" x="30" y="296">el circuito bajo la mirada</text>
<text class="sv-t2" style="font-size:12px" x="30" y="310">masculina no condena toda</text>
<text class="sv-t2" style="font-size:12px" x="30" y="324">liberación: entenderlo como</text>
<text class="sv-t2" style="font-size:12px" x="30" y="338">consecuencia histórica permite</text>
<text class="sv-t2" style="font-size:12px" x="30" y="352">superarlo parcialmente y tomar</text>
<text class="sv-t2" style="font-size:12px" x="30" y="366">perspectiva</text>
<rect class="sv-box" height="126" rx="2" width="180" x="560" y="262"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="650" y="284">Modelos del empoderamiento</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="300">femme fatale: moldeada por el</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="313">male gaze; Carrie Bradshaw elige</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="326">«libremente» consumir y ser</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="339">consumida; validación masculina</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="352">como reforzador potente;</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="365">consumo compulsivo de cuerpos</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="378">ad infinitum</text>
<line class="sv-line-dash" x1="560" x2="520" y1="300" y2="300"></line>
<text class="sv-t3" x="20" y="514">LÍNEA CAUSAL</text>
<rect class="sv-box" height="106" rx="2" width="134" x="20.0" y="524"></rect>
<text class="sv-t" text-anchor="middle" x="87.0" y="544">Tiempo abstracto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="87.0" y="560">en el trabajo (Kurz)</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="87.0" y="576">del tiempo de quehaceres</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="87.0" y="589">al cronómetro; se lucha</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="87.0" y="602">sólo por acortarlo (Vega)</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="154.0" x2="166.5" y1="546" y2="546"></line>
<rect class="sv-box" height="106" rx="2" width="134" x="166.5" y="524"></rect>
<text class="sv-t" text-anchor="middle" x="233.5" y="544">Aceleración de</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233.5" y="560">toda la vida</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="233.5" y="576">expropiación del tiempo</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="233.5" y="589">como falta de tiempo;</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="233.5" y="602">culto a la velocidad</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="300.5" x2="313.0" y1="546" y2="546"></line>
<rect class="sv-box" height="106" rx="2" width="134" x="313.0" y="524"></rect>
<text class="sv-t" text-anchor="middle" x="380.0" y="544">Apps de citas</text>
<text class="sv-t2" style="font-size:10px" text-anchor="middle" x="380.0" y="560">match → cita → evaluación</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380.0" y="576">Tinder/Bumble: hablar,</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380.0" y="589">evaluar, volver o no</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380.0" y="602">según la «química»</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="447.0" x2="459.5" y1="546" y2="546"></line>
<rect class="sv-box" height="106" rx="2" width="134" x="459.5" y="524"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="526.5" y="544">Complicidad exigida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="526.5" y="560">a contrarreloj</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="576">esperada en los primeros</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="589">encuentros; expectativa</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="602">irreal, alimentada por</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="615">productos narrativos</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="593.5" x2="606.0" y1="546" y2="546"></line>
<rect class="sv-box-red" height="106" rx="2" width="134" x="606.0" y="524"></rect>
<text class="sv-tr" text-anchor="middle" x="673.0" y="544">Frustración</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="673.0" y="560">y autoculpa</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="673.0" y="576">compromiso previo con el</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="673.0" y="589">logro → angustia; «soy</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="673.0" y="602">incapaz de enamorarme»</text>
</svg>
