<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tres pilares fundidos del poder imperial estadounidense: financiero-monetario, normativo-institucional y militar, sobre la base de la apropiación de plusvalor global; arriba, por qué el mercado mundial necesita un hegemón; abajo, las socias del dominio y sus fisuras" role="img" viewBox="0 0 760 584" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="66" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="35">Hegemonía estadounidense</text>
<text class="sv-tw" text-anchor="middle" style="font-size:13px" x="380" y="52">un orden particular presentado como interés universal (coerción + consentimiento)</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12px" x="380" y="69">ni el hegemón ni las potencias imperialistas son demiurgos: «aurigas» del carro incontrolable de la acumulación</text>
<rect class="sv-box" height="66" rx="2" width="720" x="20" y="92"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="112">Por qué hace falta un hegemón</text>
<text class="sv-t2" text-anchor="middle" x="380" y="128">la ley del valor opera en un espacio fragmentado en Estados, sin banco central ni marco jurídico internacionales;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="144">el hegemón acumula ventajas productivas, financieras, tecnológicas y militares y provee liquidez, activos seguros, reglas y coerción</text>
<rect class="sv-box-gold" height="200" rx="2" width="234" x="20" y="184"></rect>
<text class="sv-tg" text-anchor="middle" x="137" y="208">Financiero-monetario</text>
<text class="sv-t2" text-anchor="middle" x="137" y="234">dólar como dinero mundial</text>
<text class="sv-t2" text-anchor="middle" x="137" y="258">señoreaje y bonos del Tesoro</text>
<text class="sv-t2" text-anchor="middle" x="137" y="282">FMI y Banco Mundial: deuda</text>
<text class="sv-t2" text-anchor="middle" x="137" y="306">petrodólar</text>
<text class="sv-t2" text-anchor="middle" x="137" y="330">sanciones y SWIFT</text>
<text class="sv-t3" text-anchor="middle" x="137" y="362">«guerra por otros medios»</text>
<path class="sv-line-dash" d="M137 158 L137 180" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M137 422 L137 390" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box-blue" height="200" rx="2" width="234" x="263" y="184"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="208">Normativo-institucional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="234">Bretton Woods (1944)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="258">Doctrina Truman y «mundo libre»</text>
<text class="sv-t2" text-anchor="middle" x="380" y="278" style="font-size:12px">Consenso de Washington;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="292" style="font-size:12px">orden «basado en reglas»</text>
<text class="sv-t2" text-anchor="middle" x="380" y="306">fijar las reglas de comercio y propiedad</text>
<text class="sv-t2" text-anchor="middle" x="380" y="330">socialdemocracia cómplice</text>
<text class="sv-t3" text-anchor="middle" x="380" y="362" style="font-size:11px">reproducir la correlación de fuerzas</text>
<path class="sv-line-dash" d="M380 158 L380 180" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M380 422 L380 390" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box-red" height="200" rx="2" width="234" x="506" y="184"></rect>
<text class="sv-tr" text-anchor="middle" x="623" y="208">Militar</text>
<text class="sv-t2" text-anchor="middle" x="623" y="234">OTAN (1949)</text>
<text class="sv-t2" text-anchor="middle" x="623" y="258">NSC-68: militarización permanente</text>
<text class="sv-t2" text-anchor="middle" x="623" y="282">complejo militar-industrial</text>
<text class="sv-t2" text-anchor="middle" x="623" y="306">~520 bases en el exterior</text>
<text class="sv-t2" text-anchor="middle" x="623" y="330">Defensa Antimisiles</text>
<text class="sv-t3" text-anchor="middle" x="623" y="362">garantía última del orden</text>
<path class="sv-line-dash" d="M623 158 L623 180" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M623 422 L623 390" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box" height="48" rx="2" width="720" x="20" y="422"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="442">Base: apropiación de plusvalor global</text>
<text class="sv-t2" text-anchor="middle" x="380" y="459">cadenas globales de valor · división salarial internacional · intercambio desigual por composición orgánica</text>
<rect class="sv-box-green" height="66" rx="2" width="354" x="20" y="486"></rect>
<text class="sv-tgr" text-anchor="middle" x="197" y="506">Socias del dominio</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="197" y="522">burguesías de Europa occidental, Japón y Corea del Sur:</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="197" y="538">una clase capitalista que opera ya a escala transnacional</text>
<rect class="sv-box-red" height="66" rx="2" width="354" x="386" y="486"></rect>
<text class="sv-tr" text-anchor="middle" x="563" y="506">Fisuras: un sistema bajo tensión</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="563" y="522">crisis de rentabilidad desde los 70 que la financiarización aplaza;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="563" y="538">ascenso de China: rutas alternativas y pagos sin dólar</text>
<path class="sv-line-dash" d="M20 570 L46 570" marker-end="url(#m5-2-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="52" y="574">se concreta en</text>
<path class="sv-line" d="M170 570 L196 570" marker-end="url(#m5-2-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="202" y="574">sostiene</text>
</svg>
