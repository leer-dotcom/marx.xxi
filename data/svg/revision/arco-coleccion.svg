<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arco temático de los cinco volúmenes: del marxismo como teoría a la organización internacional; cada volumen presupone el anterior" role="img" viewBox="0 0 760 372" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0-arc" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">EL ARCO DE LA COLECCIÓN: DE LA CRÍTICA TEÓRICA A LA ORGANIZACIÓN INTERNACIONAL</text>
<g>
<rect class="sv-box" height="164" rx="2" width="138" x="20.0" y="40"></rect>
<text class="sv-tr" text-anchor="middle" x="89.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 1 · 2021</text>
<text class="sv-t" text-anchor="middle" x="89.0" y="79">Qué marxismo</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="96" style="font-size:11.5px">«Un marxismo para</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="110" style="font-size:11.5px">el siglo XXI»</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="130" style="font-size:12px">unidad teoría-política</text>
<text class="sv-t3" text-anchor="middle" x="89.0" y="144" style="font-size:9.5px">pregunta del volumen</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="158" style="font-size:11px">¿Qué marxismo</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="171" style="font-size:11px">hace falta hoy?</text>
<text class="sv-t3" text-anchor="middle" x="89.0" y="197" style="font-size:10px">15 artículos</text>
</g>
<g>
<rect class="sv-box" height="164" rx="2" width="138" x="165.5" y="40"></rect>
<text class="sv-tr" text-anchor="middle" x="234.5" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 2 · 2022</text>
<text class="sv-t" text-anchor="middle" x="234.5" y="79" style="font-size:13.4px;letter-spacing:0">Deslinde de campos</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="96" style="font-size:11.5px">«Contra la</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="110" style="font-size:11.5px">socialdemocracia»</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="130" style="font-size:12px">frente al reformismo</text>
<text class="sv-t3" text-anchor="middle" x="234.5" y="144" style="font-size:9.5px">pregunta del volumen</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="158" style="font-size:11px">¿Por qué la social-</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="171" style="font-size:11px">democracia no es</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="184" style="font-size:11px">una alternativa?</text>
<text class="sv-t3" text-anchor="middle" x="234.5" y="197" style="font-size:10px">13 artículos</text>
</g>
<g>
<rect class="sv-box" height="164" rx="2" width="138" x="311.0" y="40"></rect>
<text class="sv-tr" text-anchor="middle" x="380.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 3 · 2024</text>
<text class="sv-t" text-anchor="middle" x="380.0" y="79">Independencia</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="96" style="font-size:11.5px">«Independencia</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="110" style="font-size:11.5px">política»</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="130" style="font-size:12px">construir el partido</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="144" style="font-size:9.5px">pregunta del volumen</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="158" style="font-size:11px">¿Cómo reconstituir la</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="171" style="font-size:11px">independencia política</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="184" style="font-size:11px">del proletariado?</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="197" style="font-size:10px">8 artículos</text>
</g>
<g>
<rect class="sv-box" height="164" rx="2" width="138" x="456.5" y="40"></rect>
<text class="sv-tr" text-anchor="middle" x="525.5" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 4 · 2025</text>
<text class="sv-t" text-anchor="middle" x="525.5" y="79" style="font-size:13.4px;letter-spacing:0">Revolución y Estado</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="96" style="font-size:11.5px">«El derecho a</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="110" style="font-size:11.5px">la revolución»</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="130" style="font-size:12px">Estado y Comuna</text>
<text class="sv-t3" text-anchor="middle" x="525.5" y="144" style="font-size:9.5px">pregunta del volumen</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="158" style="font-size:11px">¿Qué es el derecho</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="171" style="font-size:11px">a la revolución?</text>
<text class="sv-t3" text-anchor="middle" x="525.5" y="197" style="font-size:10px">7 artículos</text>
</g>
<g>
<rect class="sv-box" height="164" rx="2" width="138" x="602.0" y="40"></rect>
<text class="sv-tr" text-anchor="middle" x="671.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 5 · 2026</text>
<text class="sv-t" text-anchor="middle" x="671.0" y="79" style="font-size:13.4px;letter-spacing:0">Internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="96" style="font-size:11.5px">«Internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="110" style="font-size:11.5px">proletario»</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="130" style="font-size:12px">guerra e Internacional</text>
<text class="sv-t3" text-anchor="middle" x="671.0" y="144" style="font-size:9.5px">pregunta del volumen</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="158" style="font-size:11px">¿Qué significa el</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="171" style="font-size:11px">internacionalismo ante</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="184" style="font-size:11px">la guerra imperialista?</text>
<text class="sv-t3" text-anchor="middle" x="671.0" y="197" style="font-size:10px">5 artículos</text>
</g>
<path class="sv-line-red" d="M89.0 232 H671.0" marker-end="url(#m0-arc)"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="222" style="font-size:10.5px">CADA VOLUMEN PRESUPONE EL ANTERIOR</text>
<circle class="sv-dot" cx="89.0" cy="232" r="6"></circle>
<text class="sv-t2" text-anchor="middle" x="89.0" y="262" style="font-size:12px">Totalidad, crisis,</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="277" style="font-size:12px">Hegel, fetichismo,</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="292" style="font-size:12px">comunidad ilusoria,</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="307" style="font-size:12px">proletariado ausente</text>
<circle class="sv-dot" cx="234.5" cy="232" r="6"></circle>
<text class="sv-t2" text-anchor="middle" x="234.5" y="262" style="font-size:12px">Estado no neutral,</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="277" style="font-size:12px">redistribuir ≠ criticar,</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="292" style="font-size:12px">dominio impersonal,</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="307" style="font-size:12px">populismo interclasista</text>
<circle class="sv-dot" cx="380.0" cy="232" r="6"></circle>
<text class="sv-t2" text-anchor="middle" x="380.0" y="262" style="font-size:12px">Conciencia socialista,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="277" style="font-size:12px">hegemonía, transición,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="292" style="font-size:12px">partido antes de la crisis,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="307" style="font-size:12px">proletarización juvenil</text>
<circle class="sv-dot" cx="525.5" cy="232" r="6"></circle>
<text class="sv-t2" text-anchor="middle" x="525.5" y="262" style="font-size:12px">Giro autoritario,</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="277" style="font-size:12px">derechos como armas,</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="292" style="font-size:12px">democracia = dictadura</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="307" style="font-size:12px">del proletariado</text>
<circle class="sv-dot" cx="671.0" cy="232" r="6"></circle>
<text class="sv-t2" text-anchor="middle" x="671.0" y="262" style="font-size:12px">Derrotismo, Palestina,</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="277" style="font-size:12px">balance del estalinismo,</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="292" style="font-size:12px">ni OTAN ni BRICS+,</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="307" style="font-size:12px">nueva Internacional</text>
<text class="sv-t3" text-anchor="middle" x="380" y="338">TEORÍA  →  CRÍTICA DE LOS &quot;FALSOS AMIGOS&quot;  →  SUJETO  →  PODER  →  ESCALA MUNDIAL</text>
</svg>
