<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la forma capitalista del desarrollo en cuatro pasos: producción delegada en las mercancías, plusvalía relativa bajo la competencia, segregación de la clase obrera y límite histórico (lucha de clases, centralización en el Estado, control consciente). Abajo, la línea de los tres estadios de los Grundrisse: dependencia personal, independencia personal fundada en la dependencia de las cosas y libre individualidad. Dos flechas de retorno, del segundo al primer estadio, señalan las corrientes criticadas: Castoriadis y Marcuse, Illich, Polanyi, Schumacher y el decrecimiento, con la réplica de Mattick y la nota sobre Benjamin. Una flecha discontinua hacia delante marca el ecosocialismo con planificación como veta rescatable, con su acierto y su riesgo proudhoniano." role="img" viewBox="0 0 760 700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-9-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="20">1. LA FORMA CAPITALISTA DEL DESARROLLO DE LAS FUERZAS PRODUCTIVAS</text>
<rect class="sv-soft" height="124" rx="2" width="720" x="20" y="28"></rect>
<rect class="sv-box" height="106" rx="2" width="166" x="28" y="36"></rect>
<text class="sv-t" text-anchor="middle" x="111" y="56">Producción delegada</text>
<text class="sv-t" text-anchor="middle" x="111" y="72">en las mercancías</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="111" y="92">servidumbre a las personas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="111" y="107">→ subordinación a objetos;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="111" y="122">nadie pilota el proceso</text>
<rect class="sv-box-blue" height="106" rx="2" width="166" x="208" y="36"></rect>
<text class="sv-tb" text-anchor="middle" x="291" y="56">Plusvalía relativa</text>
<text class="sv-tb" text-anchor="middle" x="291" y="72">bajo la competencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="291" y="92">abaratar el consumo obrero:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="291" y="107">cooperación → manufactura</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="291" y="122">→ maquinaria</text>
<rect class="sv-box" height="106" rx="2" width="166" x="388" y="36"></rect>
<text class="sv-t" text-anchor="middle" x="471" y="56">Segregación de</text>
<text class="sv-t" text-anchor="middle" x="471" y="72">la clase obrera</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="471" y="92">dirigentes / apéndices de la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="471" y="107">máquina / población sobrante:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="471" y="122">la contradicción es la forma</text>
<rect class="sv-box-green" height="106" rx="2" width="166" x="568" y="36"></rect>
<text class="sv-tgr" text-anchor="middle" x="651" y="56">Límite histórico</text>
<text class="sv-tgr" text-anchor="middle" x="651" y="72">del propio desarrollo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="92">lucha de clases → Estado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="107">centraliza el capital; con-</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="122">ciencia técnico-científica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="137">→ control consciente</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="194" x2="208" y1="89" y2="89"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="374" x2="388" y1="89" y2="89"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="554" x2="568" y1="89" y2="89"></line>
<text class="sv-t3" x="20" y="182">2. LA NEGACIÓN DEL CAPITAL VISTA POR EL RETROVISOR</text>
<path class="sv-line-red" d="M420 396 V300 H100 V396" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="260" y="204">Illich, Polanyi, Schumacher, decrecimiento</text>
<text class="sv-t2" text-anchor="middle" x="260" y="220">don, convivialidad, lo pequeño:</text>
<text class="sv-t2" text-anchor="middle" x="260" y="236">dependencia personal restaurada</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="260" y="252">enfrentan al capital desde un supuesto exterior:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="260" y="268">el comercio local protege a los «peores capitalistas»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="260" y="284">= romanticismo económico (Marx, Lenin)</text>
<path class="sv-line-red" d="M330 396 V350 H160 V396" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="245" y="322">Castoriadis, Marcuse</text>
<text class="sv-t2" text-anchor="middle" x="245" y="338">la máquina como dominio</text>
<text class="sv-t3" x="450" y="204">Benjamin (Tesis): contra el progreso</text>
<text class="sv-t3" x="450" y="218">socialdemócrata; marco común de un</text>
<text class="sv-t3" x="450" y="232">«marxismo no progresista»</text>
<text class="sv-t3" x="450" y="322">réplica de Mattick: la técnica sólo es</text>
<text class="sv-t3" x="450" y="336">dominio bajo la forma capital</text>
<text class="sv-t3" x="450" y="350">(«una máquina de hilar sólo en</text>
<text class="sv-t3" x="450" y="364">determinadas condiciones es capital»)</text>
<text class="sv-t3" text-anchor="end" x="740" y="384">LOS TRES ESTADIOS (GRUNDRISSE)</text>
<rect class="sv-box" height="70" rx="2" width="220" x="20" y="396"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="418">1. Dependencia personal</text>
<text class="sv-t2" text-anchor="middle" x="130" y="434">esclavitud, vasallaje,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="449">parentesco</text>
<rect class="sv-box-blue" height="70" rx="2" width="220" x="270" y="396"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="418">2. Independencia personal</text>
<text class="sv-t2" text-anchor="middle" x="380" y="434">fundada en la dependencia de las</text>
<text class="sv-t2" text-anchor="middle" x="380" y="449">cosas: capital, mercancía, máquina</text>
<rect class="sv-box-green" height="70" rx="2" width="220" x="520" y="396"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="418">3. Libre individualidad</text>
<text class="sv-t2" text-anchor="middle" x="630" y="434">control consciente de la</text>
<text class="sv-t2" text-anchor="middle" x="630" y="449">producción social</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="240" x2="270" y1="431" y2="431"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="490" x2="520" y1="431" y2="431"></line>
<text class="sv-t3" x="20" y="486">el estadio 2 crea las condiciones del 3:</text>
<text class="sv-t3" x="20" y="500">maquinaria, obrero colectivo, centralización</text>
<path class="sv-line-dash" d="M505 466 C 525 548, 600 548, 630 470" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="130" y="530">repudiar la maquinaria</text>
<text class="sv-t2" text-anchor="middle" x="130" y="546">es abrazar la enajenación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="562">(a menudo, encomio velado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="577">del pequeño capital)</text>
<rect class="sv-box-gold" height="124" rx="2" width="350" x="390" y="548"></rect>
<text class="sv-tg" text-anchor="middle" x="565" y="570">ecosocialismo con planificación</text>
<text class="sv-t2" text-anchor="middle" x="565" y="588">veta rescatable si impulsa el control obrero</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="565" y="606">Riechmann, Sacristán, Löwy: fuerzas productivas-destructivas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="565" y="622">acierto: el carácter contradictorio del progreso</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="565" y="638">riesgo proudhoniano: escindir «lado bueno» y «lado malo»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="565" y="654">y perder la unidad: lo «bueno» llega a través de lo «malo»</text>
<rect class="sv-soft" height="72" rx="2" width="350" x="20" y="600"></rect>
<text class="sv-t3" x="30" y="618">LEYENDA</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="30" x2="60" y1="634" y2="634"></line>
<text class="sv-t3" x="70" y="638">sucesión de los estadios</text>
<line class="sv-line-red" marker-end="url(#m1-9-arrow)" x1="30" x2="60" y1="650" y2="650"></line>
<text class="sv-t3" x="70" y="654">retorno al estadio 1 (corrientes criticadas)</text>
<line class="sv-line-dash" marker-end="url(#m1-9-arrow)" x1="30" x2="60" y1="666" y2="666"></line>
<text class="sv-t3" x="70" y="670">veta rescatable hacia el estadio 3</text>
</svg>
