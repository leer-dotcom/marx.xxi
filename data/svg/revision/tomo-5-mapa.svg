<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 5: de la ley del valor y el sistema interestatal al imperialismo y la hegemonía estadounidense, cuyo declive abre la multipolaridad; las desviaciones campista y anticampista, la cuestión colonial, la independencia política de clase y la doble delimitación derrotismo/defensismo, el estalinismo como genealogía del campismo y destructor de la Comintern, y la Internacional comunista cuyo horizonte es abolir el valor. Cada arista indica los artículos que la desarrollan; al pie, leyenda de colores y clave de los cinco artículos." viewBox="0 0 760 540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
