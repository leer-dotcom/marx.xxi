<svg xmlns="http://www.w3.org/2000/svg" aria-label="Línea temporal de 1848 a 1919 sobre dos columnas enfrentadas: programa socialdemócrata de Kautsky y programa comunista de Luxemburg, Pannekoek y Lenin, con un nodo intermedio para Lenin antes de 1914 y una franja final con la tesis de la autora y los límites comunes a ambas tradiciones" role="img" viewBox="0 0 760 692" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<line class="sv-line" marker-end="url(#m2-1-arrow)" x1="30" x2="740" y1="70" y2="70"/>
<circle class="sv-dot-b" cx="50" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="50" y="42">1848–71</text>
<text class="sv-t2" text-anchor="middle" x="50" y="92">Marx: Brumario,</text>
<text class="sv-t2" text-anchor="middle" x="50" y="106">Comuna</text>
<circle class="sv-dot" cx="135" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="135" y="42">1891</text>
<text class="sv-t2" text-anchor="middle" x="135" y="92">Programa</text>
<text class="sv-t2" text-anchor="middle" x="135" y="106">de Erfurt</text>
<circle class="sv-dot" cx="215" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="215" y="42">1895</text>
<text class="sv-t2" text-anchor="middle" x="215" y="92">Introducción</text>
<text class="sv-t2" text-anchor="middle" x="215" y="106">de Engels</text>
<circle class="sv-dot-b" cx="295" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="295" y="42">1905–06</text>
<text class="sv-t2" text-anchor="middle" x="295" y="92">Rev. rusa /</text>
<text class="sv-t2" text-anchor="middle" x="295" y="106">Huelga de masas</text>
<circle class="sv-dot" cx="375" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="375" y="42">1910</text>
<text class="sv-t2" text-anchor="middle" x="375" y="92">Luxemburg vs</text>
<text class="sv-t2" text-anchor="middle" x="375" y="106">Kautsky</text>
<circle class="sv-dot" cx="455" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="455" y="42">1911–12</text>
<text class="sv-t2" text-anchor="middle" x="455" y="92">Kautsky vs</text>
<text class="sv-t2" text-anchor="middle" x="455" y="106">Pannekoek</text>
<circle class="sv-dot" cx="540" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="540" y="42">1914</text>
<text class="sv-t2" text-anchor="middle" x="540" y="92">4 de agosto:</text>
<text class="sv-t2" text-anchor="middle" x="540" y="106">créditos</text>
<text class="sv-t2" text-anchor="middle" x="540" y="120">de guerra</text>
<circle class="sv-dot-b" cx="625" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="625" y="42">1917</text>
<text class="sv-t2" text-anchor="middle" x="625" y="92">El Estado y</text>
<text class="sv-t2" text-anchor="middle" x="625" y="106">la revolución</text>
<circle class="sv-dot-b" cx="705" cy="70" r="5"/>
<text class="sv-t3" text-anchor="middle" x="705" y="42">1919</text>
<text class="sv-t2" text-anchor="middle" x="705" y="92">III</text>
<text class="sv-t2" text-anchor="middle" x="705" y="106">Internacional</text>
<line class="sv-line-dash" x1="415" x2="415" y1="112" y2="130"/>
<text class="sv-t3" text-anchor="middle" x="415" y="146">los debates de 1910–1912 gestan dos doctrinas</text>
<line class="sv-line" marker-end="url(#m2-1-arrow)" x1="415" x2="170" y1="152" y2="174"/>
<line class="sv-line" marker-end="url(#m2-1-arrow)" x1="415" x2="590" y1="152" y2="174"/>
<rect class="sv-box-red" height="392" rx="2" width="280" x="30" y="176"/>
<rect class="sv-box-blue" height="392" rx="2" width="280" x="450" y="176"/>
<text class="sv-tr" text-anchor="middle" x="170.0" y="200">Programa socialdemócrata</text>
<text class="sv-t3" text-anchor="middle" x="170.0" y="216">Erfurt · Engels 1895 · Kautsky</text>
<text class="sv-tb" text-anchor="middle" x="590.0" y="200">Programa comunista</text>
<text class="sv-t3" text-anchor="middle" x="590.0" y="216">Luxemburg · Pannekoek · Lenin 1917</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="244">Estado como instrumento neutro</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="259" style="font-size:12px">apoderarse de él es el objetivo final de la revolución</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="280">Necesidad histórica como ley universal</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="295" style="font-size:12px">«no hacer la revolución, sino usarla» (Kautsky, 1881)</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="316">Mayorías parlamentarias</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="331" style="font-size:12px">acumular votos y organización hasta la «batalla final»</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="352">Revolución dentro del Estado</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="367" style="font-size:12px">«enérgico desplazamiento de fuerzas en el estado»</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="388">Huelga de masas sólo como «golpe último»</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="403" style="font-size:12px">subordinada al avance parlamentario</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="424">Conquistas como concesiones</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="446">Etapismo: hoy demostraciones,</text>
<text class="sv-t2" text-anchor="middle" x="170.0" y="461" style="font-size:12px">mañana la revolución</text>
<text class="sv-t" text-anchor="middle" x="170.0" y="482">«Vieja y probada táctica»</text>
<text class="sv-t" text-anchor="middle" x="590.0" y="244">Lucha de masas como estrategia</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="259" style="font-size:12px">Luxemburg 1905: no un fin en sí, sino parte</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="273" style="font-size:12px">de la toma del poder por el proletariado</text>
<text class="sv-t" text-anchor="middle" x="590.0" y="294">La fuerza «descansa fuera»</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="309" style="font-size:12px">del parlamento: la burguesía «no nos va a ofrecer</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="323" style="font-size:12px">los medios formales para desalojarla pacíficamente»</text>
<text class="sv-t" text-anchor="middle" x="590.0" y="344">Destrucción del Estado</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="359" style="font-size:12px">«todas las revoluciones perfeccionaron</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="373" style="font-size:12px">este aparato en vez de destruirlo» (Marx)</text>
<text class="sv-t" text-anchor="middle" x="590.0" y="394">Organización independiente</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="409" style="font-size:12px">partido «propio, distinto y opuesto</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="423" style="font-size:12px">a todos los viejos partidos»</text>
<text class="sv-t" text-anchor="middle" x="590.0" y="444">Soviets contra parlamentos</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="459" style="font-size:12px">Lenin 1917: república de soviets,</text>
<text class="sv-t2" text-anchor="middle" x="590.0" y="473" style="font-size:12px">no república parlamentaria</text>
<text class="sv-t3" text-anchor="middle" x="170.0" y="554">reeditada por la nueva socialdemocracia</text>
<text class="sv-t3" text-anchor="middle" x="590.0" y="512">límite (Pannekoek): poder burgués</text>
<text class="sv-t3" text-anchor="middle" x="590.0" y="526">como «fortaleza estatal», escisión</text>
<text class="sv-t3" text-anchor="middle" x="590.0" y="540">entre explotación económica</text>
<text class="sv-t3" text-anchor="middle" x="590.0" y="554">y dominación política</text>
<rect class="sv-box-gold" height="58" rx="2" width="116" x="322" y="300"/>
<text class="sv-tg" text-anchor="middle" x="380.0" y="324">Lenin</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="342">antes de 1914</text>
<line class="sv-line-dash" x1="322" x2="310" y1="329.0" y2="329.0"/>
<line class="sv-line-dash" x1="438" x2="450" y1="329.0" y2="329.0"/>
<text class="sv-t3" text-anchor="middle" x="380.0" y="378">Erfurt como modelo,</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="392">apoyo a Kautsky</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="406">en 1910, ¿Qué hacer?</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="420">(1902) inspirado en</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="434">Kautsky, ninguna</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="448">diferencia teórica</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="462">hasta 1914; pero «sin</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="476">modelos listos» (1899)</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="490">y, desde 1905,</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="504">organización</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="518">independiente del</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="532">proletariado</text>
<rect class="sv-soft" height="98" rx="2" width="710" x="25" y="582"/>
<text class="sv-t3" text-anchor="middle" x="380" y="600">continuidades y ruptura: ni antagonismo absoluto II/III ni «traición» de 1914</text>
<text class="sv-t2" text-anchor="middle" x="380" y="620" style="font-size:12px">1914 no fue traición ni error de cálculo: consolidó tendencias arraigadas desde Erfurt, Engels 1895 y Kautsky.</text>
<text class="sv-t2" text-anchor="middle" x="380" y="636" style="font-size:12px">Límites comunes a ambas tradiciones: confianza en la caída inminente del capitalismo, recepción insuficiente</text>
<text class="sv-t2" text-anchor="middle" x="380" y="652" style="font-size:12px">de la Crítica de la Economía Política e incomprensión del alcance del poder burgués.</text>
<line class="sv-line" marker-end="url(#m2-1-arrow)" x1="150" x2="190" y1="668" y2="668"/>
<text class="sv-t3" text-anchor="start" x="198" y="672">gesta / desemboca en</text>
<line class="sv-line-dash" x1="400" x2="440" y1="668" y2="668"/>
<text class="sv-t3" text-anchor="start" x="448" y="672">continuidad entre tradiciones</text>
</svg>
