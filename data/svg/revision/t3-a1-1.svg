<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la premisa gramsciana y el problema de partida; después, la cadena de mediaciones desde la cosmovisión capitalista hasta la conciencia socialista pasando por los bloques culturales y la crisis de acumulación, con el nudo gordiano y la fórmula táctica; abajo, pirámide de los tres medios (teoría, propaganda, agitación) con flechas a los dos objetivos (unificación y hegemonización), las tres derivas por absolutización, la advertencia sobre el pathos escéptico, la lección histórica rusa y el arte como modo de expresión de la agitación" role="img" viewBox="0 0 760 704" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>

<text class="sv-t3" x="12" y="20">PREMISA: LA ACTUALIDAD DE LA REVOLUCIÓN (LENIN, GRAMSCI)</text>
<rect class="sv-soft" height="60" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="22" y="46" style="font-size:12px">La cultura sólo importa dentro del problema de la toma del poder: el proletariado debe ser clase culturalmente dirigente antes de</text>
<text class="sv-t2" x="22" y="61" style="font-size:12px">ser políticamente dominante (actualiza, no niega, la dictadura del proletariado). Problema de partida: para la conciencia</text>
<text class="sv-t2" x="22" y="76" style="font-size:12px">espontánea el socialismo está «descartado a priori» del campo de lo posible (relato burgués del «fin de la historia»).</text>

<text class="sv-t3" x="12" y="108">CADENA DE MEDIACIONES: EL CAMPO DE LA LUCHA CULTURAL</text>
<rect class="sv-box-ink" height="114" rx="2" width="172" x="12" y="116"></rect>
<text class="sv-tw" text-anchor="middle" x="98" y="136">Cosmovisión capitalista</text>
<text class="sv-tw" text-anchor="middle" x="98" y="153" style="font-size:12px;font-weight:400;letter-spacing:0">imagen general del mundo:</text>
<text class="sv-tw" text-anchor="middle" x="98" y="167" style="font-size:12px;font-weight:400;letter-spacing:0">formas naturalizadas, raíz</text>
<text class="sv-tw" text-anchor="middle" x="98" y="181" style="font-size:12px;font-weight:400;letter-spacing:0">estable, ligada a las</text>
<text class="sv-tw" text-anchor="middle" x="98" y="195" style="font-size:12px;font-weight:400;letter-spacing:0">relaciones de producción</text>
<text class="sv-tw" text-anchor="middle" x="98" y="209" style="font-size:12px;font-weight:400;letter-spacing:0">(mercancía, parlamento…)</text>
<path class="sv-line" d="M184 173 H198" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-blue" height="114" rx="2" width="172" x="200" y="116"></rect>
<text class="sv-t" text-anchor="middle" x="286" y="136">Bloques culturales</text>
<text class="sv-t2" text-anchor="middle" x="286" y="153" style="font-size:12px">modos de vida por clase:</text>
<text class="sv-t2" text-anchor="middle" x="286" y="167" style="font-size:12px">élites · clases medias ·</text>
<text class="sv-t2" text-anchor="middle" x="286" y="181" style="font-size:12px">proletariado</text>
<text class="sv-t2" text-anchor="middle" x="286" y="195" style="font-size:12px">(ahí se libra la lucha</text>
<text class="sv-t2" text-anchor="middle" x="286" y="209" style="font-size:12px">cultural concreta)</text>
<path class="sv-line" d="M372 173 H386" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-red" height="114" rx="2" width="172" x="388" y="116"></rect>
<text class="sv-t" text-anchor="middle" x="474" y="136">Crisis de acumulación</text>
<text class="sv-t2" text-anchor="middle" x="474" y="153" style="font-size:12px">punto de sutura: lo natural</text>
<text class="sv-t2" text-anchor="middle" x="474" y="167" style="font-size:12px">se vuelve problemático</text>
<text class="sv-t2" text-anchor="middle" x="474" y="181" style="font-size:12px">proletarización, Estado</text>
<text class="sv-t2" text-anchor="middle" x="474" y="195" style="font-size:12px">autoritario, destrucción</text>
<text class="sv-t2" text-anchor="middle" x="474" y="209" style="font-size:12px">ecológica, guerra</text>
<path class="sv-line" d="M560 173 H574" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-green" height="114" rx="2" width="172" x="576" y="116"></rect>
<text class="sv-t" text-anchor="middle" x="662" y="136">Conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="662" y="153" style="font-size:12px">interviene en el bloque</text>
<text class="sv-t2" text-anchor="middle" x="662" y="167" style="font-size:12px">proletario en crisis</text>
<text class="sv-t2" text-anchor="middle" x="662" y="181" style="font-size:12px">forma político-cultural</text>
<text class="sv-t2" text-anchor="middle" x="662" y="195" style="font-size:12px">de la teoría; sólo esbozo</text>
<text class="sv-t2" text-anchor="middle" x="662" y="209" style="font-size:12px">de cosmovisión comunista</text>

<rect class="sv-soft" height="72" rx="2" width="736" x="12" y="240"></rect>
<text class="sv-t3" x="22" y="256">NUDO GORDIANO Y FÓRMULA TÁCTICA</text>
<text class="sv-t2" x="22" y="272" style="font-size:12px">La cosmovisión no se derriba de frente: ni la crítica teórica anula su validez social ni basta el «cambio cultural en general»</text>
<text class="sv-t2" x="22" y="287" style="font-size:12px">(de eso ya se encarga el capitalismo). Sólo indirectamente, a través de la crisis: a la cosmovisión capitalista se la enfrenta</text>
<text class="sv-t2" x="22" y="302" style="font-size:12px">mediante la conciencia socialista en el campo del bloque cultural proletario en crisis. La táctica cultural es transversal a toda lucha.</text>

<text class="sv-t3" x="12" y="336">TRES MEDIOS JERARQUIZADOS</text>
<text class="sv-t3" x="330" y="336">DOS OBJETIVOS</text>
<text class="sv-t3" x="528" y="336">DERIVAS POR ABSOLUTIZACIÓN</text>
<rect class="sv-box-red" height="48" rx="2" width="120" x="80" y="346"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="366">Agitación</text>
<text class="sv-t2" text-anchor="middle" x="140" y="382" style="font-size:12px">afectos, hechos</text>
<rect class="sv-box-blue" height="48" rx="2" width="180" x="50" y="402"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="422">Propaganda</text>
<text class="sv-t2" text-anchor="middle" x="140" y="438" style="font-size:12px;letter-spacing:0">razón, nexo coyuntura-estrategia</text>
<rect class="sv-box" height="48" rx="2" width="240" x="20" y="458"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="478">Teoría</text>
<text class="sv-t2" text-anchor="middle" x="140" y="494">base científica (CEP + bolchevismo)</text>
<text class="sv-t3" x="20" y="526">jerarquía: teoría &gt; propaganda &gt; agitación</text>
<text class="sv-t3" x="20" y="542">proporcionalidad: ninguna desconectada</text>
<text class="sv-t3" x="20" y="558">de las demás</text>
<path class="sv-line" d="M200 370 H328" marker-end="url(#m3-1-arrow)"></path>
<path class="sv-line" d="M230 426 H328" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-green" height="66" rx="2" width="186" x="330" y="346"></rect>
<text class="sv-t" text-anchor="middle" x="423" y="364">Hegemonización</text>
<text class="sv-t2" text-anchor="middle" x="423" y="380" style="font-size:12px">nueva cultura política</text>
<text class="sv-t2" text-anchor="middle" x="423" y="393" style="font-size:12px">proletaria: socialismo como</text>
<text class="sv-t2" text-anchor="middle" x="423" y="406" style="font-size:12px">horizonte, partido como agente</text>
<rect class="sv-box-green" height="66" rx="2" width="186" x="330" y="418"></rect>
<text class="sv-t" text-anchor="middle" x="423" y="436">Unificación</text>
<text class="sv-t2" text-anchor="middle" x="423" y="452" style="font-size:12px">debate racional + juventud</text>
<text class="sv-t2" text-anchor="middle" x="423" y="465" style="font-size:12px">→ estructura centralizada y</text>
<text class="sv-t2" text-anchor="middle" x="423" y="478" style="font-size:12px">organizaciones juveniles</text>
<rect class="sv-soft" height="60" rx="2" width="418" x="330" y="490"></rect>
<text class="sv-t3" x="338" y="505">ADVERTENCIA</text>
<text class="sv-t2" x="338" y="519" style="font-size:11.5px">la crisis produce sobre todo un pathos escéptico de doble filo (desconfianza hacia todo</text>
<text class="sv-t2" x="338" y="532" style="font-size:11.5px">horizonte de cambio): sin agencia revolucionaria no hay transformación cultural real;</text>
<text class="sv-t2" x="338" y="545" style="font-size:11.5px">evitar el mesianismo proletkulturalista y el espontaneísmo cultural o económico</text>
<rect class="sv-box" height="48" rx="2" width="220" x="528" y="346"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="366">Solo agitación → oportunismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="382">socialdemocracia</text>
<rect class="sv-box" height="48" rx="2" width="220" x="528" y="402"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="422">Solo propaganda → sectarismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="438">marxismo-leninismo actual</text>
<rect class="sv-box" height="48" rx="2" width="220" x="528" y="458"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="478">Solo teoría → academicismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="494">marxismo occidental</text>

<rect class="sv-box-blue" height="132" rx="2" width="360" x="12" y="560"></rect>
<text class="sv-tb" x="22" y="580">Lección histórica: del círculo a las masas</text>
<text class="sv-t2" x="22" y="597" style="font-size:12px">Plejánov, Kremer y Mártov: la agitación cambia el paradigma</text>
<text class="sv-t2" x="22" y="611" style="font-size:12px">del sectarismo conspirativo al partido de masas; Lenin (¿Qué hacer?)</text>
<text class="sv-t2" x="22" y="625" style="font-size:12px">corrige su economicismo con la agitación política.</text>
<text class="sv-t2" x="22" y="643" style="font-size:12px">Hoy: tras una fase de constitución eminentemente propagandística,</text>
<text class="sv-t2" x="22" y="657" style="font-size:12px">hace falta un modelo renovado donde la agitación cobre relevancia</text>
<text class="sv-t2" x="22" y="671" style="font-size:12px">(no es lo mismo constituir que expandir).</text>
<rect class="sv-box-gold" height="132" rx="2" width="360" x="388" y="560"></rect>
<text class="sv-tg" x="398" y="580">Arte = modo de expresión de la agitación</text>
<text class="sv-t2" x="398" y="597" style="font-size:12px">Modos de expresión a actualizar: movilización, medios digitales</text>
<text class="sv-t2" x="398" y="611" style="font-size:12px">y audiovisuales, redes sociales y streaming, arte.</text>
<text class="sv-t2" x="398" y="629" style="font-size:12px">Artista colectivo (órgano técnico del partido, rama del obrero</text>
<text class="sv-t2" x="398" y="643" style="font-size:12px">colectivo) + arte socialista (expresión estética de la conciencia</text>
<text class="sv-t2" x="398" y="657" style="font-size:12px">socialista que prima las formas populares: arte urbano, hip hop),</text>
<text class="sv-t2" x="398" y="671" style="font-size:12px">frente a la autonomía burguesa del arte (mercantilización) y a la</text>
<text class="sv-t2" x="398" y="685" style="font-size:12px">estética marxista de la derrota (Sartre, Adorno).</text>
</svg>
