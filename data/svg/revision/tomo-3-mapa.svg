<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 3: las crisis de acumulación y ecológica producen proletarización y agrietan la cosmovisión capitalista; la táctica cultural expande la conciencia socialista, que funda la independencia política, cuya forma acabada es el Partido Comunista, mediador del Estado-Comuna y precondición de la hegemonía socialista; las formas organizativas transitorias y las escalas territoriales construyen el Partido, mientras reformismo, espontaneísmo y sectarismo lo obstaculizan. Cada arista indica los artículos que la desarrollan; al pie, leyenda de colores y clave de los ocho artículos." viewBox="0 0 760 700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
