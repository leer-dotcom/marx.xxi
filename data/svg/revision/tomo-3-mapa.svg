<text class="sv-t2" style="font-size:10px" text-anchor="middle" x="108" y="312">frente de mujeres, consejos, juventud,</text>
<text class="sv-t2" style="font-size:10px" text-anchor="middle" x="108" y="325">marcos territoriales, artista colectivo</text>
