<text class="sv-t3" x="30" y="606">hegemonía y Estado · negro: Partido (eje) · verde: formas y escalas organizativas</text>
<text class="sv-t3" x="30" y="620">gris y discontinua: desviaciones que obstaculizan · (n): artículos</text>
