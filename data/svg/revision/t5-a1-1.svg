<svg xmlns="http://www.w3.org/2000/svg" aria-label="Escala móvil del sistema interestatal en seis niveles, del hegemón a los territorios bajo dominación extrema, con los cuatro rasgos que fijan la posición de cada país y la distinción entre imperialismo como propiedad estructural y países imperialistas" role="img" viewBox="0 0 760 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="235" y="26">ESCALA MÓVIL DEL SISTEMA INTERESTATAL</text>
<rect class="sv-box-red" height="62" rx="2" width="250" x="110" y="44"></rect>
<text class="sv-t" text-anchor="middle" x="235" y="63">Hegemón</text>
<text class="sv-t2" text-anchor="middle" x="235" y="78.5">EE. UU.</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="235" y="94">garante amplio del orden global</text>
<rect class="sv-box-gold" height="62" rx="2" width="290" x="90" y="114"></rect>
<text class="sv-t" text-anchor="middle" x="235" y="133">Imperialismos secundarios</text>
<text class="sv-t2" text-anchor="middle" x="235" y="148.5">Europa occ., Japón, Canadá</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="235" y="164">no dirigen solos el orden: OTAN, AUKUS</text>
<rect class="sv-box-blue" height="62" rx="2" width="330" x="70" y="184"></rect>
<text class="sv-t" text-anchor="middle" x="235" y="203">Aspirantes</text>
<text class="sv-t2" text-anchor="middle" x="235" y="218.5">China (no consolidado)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="235" y="234">proyección monetaria y militar aún no comparable</text>
<rect class="sv-box" height="62" rx="2" width="370" x="50" y="254"></rect>
<text class="sv-t" text-anchor="middle" x="235" y="273">Dependientes con proyección regional</text>
<text class="sv-t2" text-anchor="middle" x="235" y="288.5">Rusia, Brasil, Irán</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="235" y="304">coerción regional pese a productividad media o baja</text>
<rect class="sv-box" height="62" rx="2" width="410" x="30" y="324"></rect>
<text class="sv-t" text-anchor="middle" x="235" y="343">Dependientes en sentido fuerte</text>
<text class="sv-t2" text-anchor="middle" x="235" y="358.5">restricción externa: deuda, devaluación, austeridad</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="235" y="374">Sur Global · Estado gestor interno de la subordinación externa</text>
<rect class="sv-box-ink" height="62" rx="2" width="450" x="10" y="394"></rect>
<text class="sv-tw" text-anchor="middle" x="235" y="413">Territorios bajo dominación extrema</text>
<text class="sv-tw" text-anchor="middle" style="font-size:13px" x="235" y="428.5">Palestina, Sáhara, Haití</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12px" x="235" y="444">ocupación, saqueo, negación violenta de toda soberanía</text>
<text class="sv-t3" text-anchor="middle" x="235" y="470">↑ poder de subordinación · ↓ subordinación sufrida</text>
<text class="sv-t3" text-anchor="middle" x="620" y="26">RASGOS QUE FIJAN LA POSICIÓN</text>
<rect class="sv-box-blue" height="48" rx="2" width="260" x="490" y="44"></rect>
<text class="sv-t" text-anchor="middle" x="620" y="63">Exportación estructural</text>
<text class="sv-t" text-anchor="middle" x="620" y="80">de capital</text>
<rect class="sv-box-blue" height="48" rx="2" width="260" x="490" y="102"></rect>
<text class="sv-t" text-anchor="middle" x="620" y="121">Respaldo estatal</text>
<text class="sv-t2" text-anchor="middle" x="620" y="138">diplomático, jurídico, militar</text>
<rect class="sv-box-blue" height="48" rx="2" width="260" x="490" y="160"></rect>
<text class="sv-t" text-anchor="middle" x="620" y="179">Posición monetaria</text>
<text class="sv-t" text-anchor="middle" x="620" y="196">y financiera fuerte</text>
<rect class="sv-box-blue" height="48" rx="2" width="260" x="490" y="218"></rect>
<text class="sv-t" text-anchor="middle" x="620" y="237">Control de fuerzas productivas</text>
<text class="sv-t2" text-anchor="middle" x="620" y="254">de vanguardia y nodos logísticos</text>
<path class="sv-line-dash" d="M490 155 L466 155" marker-end="url(#m5-1-arrow)"></path>
<rect class="sv-box-red" height="98" rx="2" width="260" x="490" y="282"></rect>
<text class="sv-tr" text-anchor="middle" x="620" y="304">Posiciones móviles</text>
<text class="sv-t2" text-anchor="middle" x="620" y="319">se ganan o se pierden en las crisis:</text>
<text class="sv-t2" text-anchor="middle" x="620" y="334">la desvalorización se descarga</text>
<text class="sv-t2" text-anchor="middle" x="620" y="349">sobre los espacios más débiles</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="620" y="364">(Rusia aspira a ascender por la vía de la guerra)</text>
<rect class="sv-box-red" height="110" rx="2" width="260" x="490" y="392"></rect>
<text class="sv-tr" text-anchor="middle" x="620" y="414">Distinción central</text>
<text class="sv-t2" text-anchor="middle" x="620" y="429">imperialismo = propiedad estructural</text>
<text class="sv-t2" text-anchor="middle" x="620" y="444">del sistema interestatal;</text>
<text class="sv-t2" text-anchor="middle" x="620" y="459">países imperialistas = los que convierten</text>
<text class="sv-t2" text-anchor="middle" x="620" y="474">su lugar en la acumulación mundial en</text>
<text class="sv-t2" text-anchor="middle" x="620" y="489">poder sostenido de subordinación</text>
</svg>
