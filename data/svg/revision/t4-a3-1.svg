<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escalera ascendente de niveles de organización y conciencia, desde la lucha económica hasta el socialismo, con la desviación propia de cada peldaño anotada debajo de cada caja y una nota con la tesis del artículo" viewBox="0 0 760 820" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="18">ESCALERA DE LA BATALLA POR LA DEMOCRACIA</text>
<text class="sv-t3" x="748" y="18" text-anchor="end">EN OLIVA: DESVIACIÓN EN CADA PELDAÑO</text>
<path class="sv-line-dash" d="M12 770 L12 40" marker-end="url(#m4-3-arrow)"/>
<text class="sv-t3" x="22" y="40">+ organización · + conciencia</text>
<rect class="sv-soft" rx="2" x="30" y="60" width="312" height="126"/>
<text class="sv-t3" x="40" y="77">TESIS</text>
<text class="sv-t2" x="40" y="94" style="font-size:12px">Prepararse para la acción política es la condición</text>
<text class="sv-t2" x="40" y="108" style="font-size:12px">de la independencia política del proletariado:</text>
<text class="sv-t2" x="40" y="122" style="font-size:12px">influir en el curso general de los acontecimientos</text>
<text class="sv-t2" x="40" y="136" style="font-size:12px">y no ser arrastrado por fuerzas políticas ajenas.</text>
<text class="sv-t2" x="40" y="150" style="font-size:12px">La defensa del derecho del pueblo a gobernar, llevada</text>
<text class="sv-t2" x="40" y="164" style="font-size:12px">hasta el final, es el derecho a derrocar el gobierno</text>
<text class="sv-t2" x="40" y="178" style="font-size:12px">e instaurar otro dirigido por la mayoría pobre.</text>
<rect class="sv-box" rx="2" x="30" y="656" width="178" height="96"/>
<text class="sv-t" text-anchor="middle" x="119" y="674">Lucha económica</text>
<text class="sv-t2" text-anchor="middle" x="119" y="690" style="font-size:12px">sindicato: escuela de unión</text>
<text class="sv-t2" text-anchor="middle" x="119" y="704" style="font-size:12px">necesaria pero insuficiente:</text>
<text class="sv-t2" text-anchor="middle" x="119" y="718" style="font-size:12px">parcial, temporal, sectorial</text>
<text class="sv-t2" text-anchor="middle" x="119" y="732" style="font-size:12px">(Proudhon, Blanc, Bernstein,</text>
<text class="sv-t2" text-anchor="middle" x="119" y="746" style="font-size:12px">economicistas, mencheviques)</text>
<rect class="sv-box" rx="2" x="138" y="536" width="178" height="96"/>
<text class="sv-t" text-anchor="middle" x="227" y="554">Acción política</text>
<text class="sv-t2" text-anchor="middle" x="227" y="570" style="font-size:12px">partido · programa propio</text>
<text class="sv-t2" text-anchor="middle" x="227" y="584" style="font-size:12px">organización superior que</text>
<text class="sv-t2" text-anchor="middle" x="227" y="598" style="font-size:12px">lucha contra el Estado</text>
<text class="sv-t2" text-anchor="middle" x="227" y="612" style="font-size:12px">militante = tribuno popular,</text>
<text class="sv-t2" text-anchor="middle" x="227" y="626" style="font-size:12px">no secretario de tradeunion</text>
<rect class="sv-box-blue" rx="2" x="246" y="416" width="178" height="110"/>
<text class="sv-tb" text-anchor="middle" x="335" y="434" style="font-size:12.6px;letter-spacing:0">Derechos políticos = armas</text>
<text class="sv-t2" text-anchor="middle" x="335" y="450" style="font-size:12px">reunión · asociación · huelga</text>
<text class="sv-t2" text-anchor="middle" x="335" y="464" style="font-size:12px">expresión · sufragio universal</text>
<text class="sv-t2" text-anchor="middle" x="335" y="478" style="font-size:12px">cartismo: 1.er partido obrero</text>
<text class="sv-t2" text-anchor="middle" x="335" y="492" style="font-size:12px">prensa: organizador colectivo</text>
<text class="sv-t2" text-anchor="middle" x="335" y="506" style="font-size:12px">parlamento: tribuna y medidor</text>
<text class="sv-t2" text-anchor="middle" x="335" y="520" style="font-size:12px">ciudadanía civil para todos</text>
<rect class="sv-box" rx="2" x="354" y="296" width="178" height="96"/>
<text class="sv-t" text-anchor="middle" x="443" y="314">República democrática</text>
<text class="sv-t2" text-anchor="middle" x="443" y="330" style="font-size:12px">síntesis del programa mínimo</text>
<text class="sv-t2" text-anchor="middle" x="443" y="344" style="font-size:12px">asamblea única · revocabilidad</text>
<text class="sv-t2" text-anchor="middle" x="443" y="358" style="font-size:12px">abolir burocracia · milicia</text>
<text class="sv-t2" text-anchor="middle" x="443" y="372" style="font-size:12px">forma específica de la</text>
<text class="sv-t2" text-anchor="middle" x="443" y="386" style="font-size:12px">dictadura del proletariado</text>
<rect class="sv-box" rx="2" x="462" y="176" width="178" height="96"/>
<text class="sv-t" text-anchor="middle" x="551" y="194">Toma del poder</text>
<text class="sv-t2" text-anchor="middle" x="551" y="210" style="font-size:12px">gobierno provisional</text>
<text class="sv-t2" text-anchor="middle" x="551" y="224" style="font-size:12px">revolucionario</text>
<text class="sv-t2" text-anchor="middle" x="551" y="238" style="font-size:12px">«el primer paso: la conquista</text>
<text class="sv-t2" text-anchor="middle" x="551" y="252" style="font-size:12px">de la democracia» (Manifiesto)</text>
<text class="sv-t2" text-anchor="middle" x="551" y="266" style="font-size:12px">derecho a derrocar el gobierno</text>
<rect class="sv-box-red" rx="2" x="570" y="56" width="178" height="96"/>
<text class="sv-tr" text-anchor="middle" x="659" y="74">Socialismo</text>
<text class="sv-t2" text-anchor="middle" x="659" y="90" style="font-size:12px">emancipación económica</text>
<text class="sv-t2" text-anchor="middle" x="659" y="104" style="font-size:12px">democracia y socialismo</text>
<text class="sv-t2" text-anchor="middle" x="659" y="118" style="font-size:12px">no son fases separadas</text>
<text class="sv-t2" text-anchor="middle" x="659" y="132" style="font-size:12px">recordar 1789-1793,</text>
<text class="sv-t2" text-anchor="middle" x="659" y="146" style="font-size:12px">no 1848-1850</text>
<path class="sv-line" d="M173 656 L173 634" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M281 536 L281 528" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M389 416 L389 394" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M497 296 L497 274" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M605 176 L605 154" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line-dash" d="M156 752 L156 764"/>
<text class="sv-tg" text-anchor="middle" x="156" y="779" style="font-size:11.5px;letter-spacing:0">economicismo</text>
<path class="sv-line-dash" d="M264 632 L264 644"/>
<text class="sv-tg" text-anchor="middle" x="264" y="659" style="font-size:11.5px;letter-spacing:0">blanquismo /</text>
<text class="sv-tg" text-anchor="middle" x="264" y="673" style="font-size:11.5px;letter-spacing:0">terrorismo:</text>
<text class="sv-tg" text-anchor="middle" x="264" y="687" style="font-size:11.5px;letter-spacing:0">minoría sin masas</text>
<path class="sv-line-dash" d="M372 526 L372 538"/>
<text class="sv-tg" text-anchor="middle" x="372" y="553" style="font-size:11.5px;letter-spacing:0">cretinismo</text>
<text class="sv-tg" text-anchor="middle" x="372" y="567" style="font-size:11.5px;letter-spacing:0">parlamentario</text>
<path class="sv-line-dash" d="M480 392 L480 404"/>
<text class="sv-tg" text-anchor="middle" x="480" y="419" style="font-size:11.5px;letter-spacing:0">derechos plenos</text>
<text class="sv-tg" text-anchor="middle" x="480" y="433" style="font-size:11.5px;letter-spacing:0">sin destruir</text>
<text class="sv-tg" text-anchor="middle" x="480" y="447" style="font-size:11.5px;letter-spacing:0">el Estado</text>
<path class="sv-line-dash" d="M588 272 L588 284"/>
<text class="sv-tg" text-anchor="middle" x="588" y="299" style="font-size:11.5px;letter-spacing:0">vía parlamentaria</text>
<text class="sv-tg" text-anchor="middle" x="588" y="313" style="font-size:11.5px;letter-spacing:0">pacífica (la burguesía</text>
<text class="sv-tg" text-anchor="middle" x="588" y="327" style="font-size:11.5px;letter-spacing:0">rompe su legalidad)</text>
<path class="sv-line-dash" d="M696 152 L696 164"/>
<text class="sv-tg" text-anchor="middle" x="696" y="179" style="font-size:11.5px;letter-spacing:0">separar democracia</text>
<text class="sv-tg" text-anchor="middle" x="696" y="193" style="font-size:11.5px;letter-spacing:0">y socialismo</text>
</svg>
