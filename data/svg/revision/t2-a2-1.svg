<svg xmlns="http://www.w3.org/2000/svg" aria-label="Cadena causal en dos fases: fase ascendente que produce la socialdemocracia clásica (con una nota sobre su contenido material: salario indirecto, dependencia, redistribución y nacionalismo) y fase de crisis que, pasando por la fragmentación de la clase y el péndulo integración-resistencialismo, desemboca en el populismo, su moderación y la represión; una salida alternativa lleva a la autoorganización socialista" role="img" viewBox="0 0 760 684" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="start" x="20" y="22">FASE 1 · ascenso de la acumulación</text>
<rect class="sv-box" height="50" rx="2" width="160" x="20" y="32"/>
<text class="sv-t" text-anchor="middle" x="100" y="53">Desarrollo de las</text>
<text class="sv-t" text-anchor="middle" x="100" y="69">fuerzas productivas</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="180" x2="205" y1="57" y2="57"/>
<rect class="sv-box" height="50" rx="2" width="160" x="205" y="32"/>
<text class="sv-t" text-anchor="middle" x="285" y="53">Unidad relativa</text>
<text class="sv-t" text-anchor="middle" x="285" y="69">de la clase</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="365" x2="390" y1="57" y2="57"/>
<rect class="sv-box" height="50" rx="2" width="160" x="390" y="32"/>
<text class="sv-t" text-anchor="middle" x="470" y="53">Centralización de</text>
<text class="sv-t" text-anchor="middle" x="470" y="69">capital en el Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="550" x2="575" y1="57" y2="57"/>
<rect class="sv-box-red" height="50" rx="2" width="160" x="575" y="32"/>
<text class="sv-tr" text-anchor="middle" x="655" y="53" style="font-size:13.4px;letter-spacing:0">Socialdemocracia clásica</text>
<text class="sv-t2" text-anchor="middle" x="655" y="69">salario indirecto</text>
<rect class="sv-soft" height="96" rx="2" width="560" x="20" y="92"/>
<text class="sv-t3" text-anchor="start" x="30" y="108">contenido material de la socialdemocracia clásica</text>
<text class="sv-t2" text-anchor="start" x="30" y="124" style="font-size:12px">Las «concesiones» del Estado (sanidad, educación, pensiones) son salario indirecto o diferido:</text>
<text class="sv-t2" text-anchor="start" x="30" y="138" style="font-size:12px">valor ya producido por la clase. Aplican la ley del valor, no la violan desde fuera.</text>
<text class="sv-t2" text-anchor="start" x="30" y="152" style="font-size:12px">Reproduce la dependencia de la clase respecto al capital y al Estado-nación: «el movimiento</text>
<text class="sv-t2" text-anchor="start" x="30" y="166" style="font-size:12px">obrero personifica políticamente su propia explotación». Paradoja: necesita que al capital le vaya bien;</text>
<text class="sv-t2" text-anchor="start" x="30" y="180" style="font-size:12px">de ahí el énfasis en la redistribución (que presupone la explotación) y la deriva nacionalista.</text>
<line class="sv-line-dash" x1="655" x2="655" y1="82" y2="130"/>
<text class="sv-t3" text-anchor="middle" x="700" y="112">ofensiva</text>
<text class="sv-t3" text-anchor="middle" x="700" y="126">neoliberal</text>
<path class="sv-line-dash" d="M655 130 L655 200 L140 200 L140 214" marker-end="url(#m2-2-arrow)"/>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="655" x2="582" y1="130" y2="130"/>
<text class="sv-t3" text-anchor="start" x="20" y="210">FASE 2 · crisis</text>
<rect class="sv-box" height="50" rx="2" width="160" x="20" y="216"/>
<text class="sv-t2" text-anchor="middle" x="100" y="234">Automatización,</text>
<text class="sv-t2" text-anchor="middle" x="100" y="248">internacionalización</text>
<text class="sv-t2" text-anchor="middle" x="100" y="262">y desempleo</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="180" x2="205" y1="241" y2="241"/>
<rect class="sv-box" height="50" rx="2" width="160" x="205" y="216"/>
<text class="sv-t" text-anchor="middle" x="285" y="237">Fragmentación de</text>
<text class="sv-t" text-anchor="middle" x="285" y="253">la clase en estratos</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="365" x2="390" y1="241" y2="241"/>
<rect class="sv-box" height="50" rx="2" width="160" x="390" y="216"/>
<text class="sv-t" text-anchor="middle" x="470" y="237">Crisis de la social-</text>
<text class="sv-t" text-anchor="middle" x="470" y="253">democracia clásica</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="550" x2="575" y1="241" y2="241"/>
<rect class="sv-box-gold" height="50" rx="2" width="160" x="575" y="216"/>
<text class="sv-tg" text-anchor="middle" x="655" y="237">Ciudadanismo</text>
<text class="sv-t2" text-anchor="middle" x="655" y="253">interclasista</text>
<text class="sv-t3" text-anchor="start" x="20" y="280">aparece invertida como «fin de la lucha de clases»</text>
<path class="sv-line" d="M655 266 L655 278 L420 278 L420 298" marker-end="url(#m2-2-arrow)"/>
<path class="sv-line" d="M655 278 L645 278 L645 298" marker-end="url(#m2-2-arrow)"/>
<rect class="sv-box" height="50" rx="2" width="180" x="330" y="300"/>
<text class="sv-t" text-anchor="middle" x="420" y="321">Integración:</text>
<text class="sv-t2" text-anchor="middle" x="420" y="337">demandas al Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" marker-start="url(#m2-2-arrow)" x1="512" x2="553" y1="325" y2="325"/>
<rect class="sv-box" height="50" rx="2" width="180" x="555" y="300"/>
<text class="sv-t" text-anchor="middle" x="645" y="321">Resistencialismo:</text>
<text class="sv-t2" text-anchor="middle" x="645" y="337">«afuera» del capital</text>
<text class="sv-t3" text-anchor="middle" x="532" y="368">péndulo movimentista:</text>
<text class="sv-t3" text-anchor="middle" x="532" y="382">ambos polos se agotan</text>
<text class="sv-t3" text-anchor="middle" x="532" y="396">en el Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="420" x2="420" y1="350" y2="408"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="645" x2="645" y1="350" y2="408"/>
<rect class="sv-box-red" height="96" rx="2" width="405" x="330" y="410"/>
<text class="sv-tr" text-anchor="middle" x="532" y="430">POPULISMO: «ciudadanismo para tiempos de crisis»</text>
<text class="sv-t2" text-anchor="middle" x="532" y="446" style="font-size:12px">síntesis de ciudadanismo y movimentismo (Podemos, Syriza, Sumar)</text>
<text class="sv-t2" text-anchor="middle" x="532" y="461" style="font-size:12px">Pueblo · Líder · anti-pueblo («casta») · lógica de la demanda</text>
<text class="sv-t2" text-anchor="middle" x="532" y="476" style="font-size:12px">«quien demanda confiesa una incapacidad» · voluntarismo: basta elegir bien</text>
<text class="sv-t2" text-anchor="middle" x="532" y="491" style="font-size:12px">ilusión: un capitalismo sin contradicciones (visto desde la circulación)</text>
<rect class="sv-box-gold" height="96" rx="2" width="250" x="20" y="410"/>
<text class="sv-tg" text-anchor="middle" x="145" y="430">Programa de las clases medias</text>
<text class="sv-t2" text-anchor="middle" x="145" y="447">segmentos altos de la clase</text>
<text class="sv-t2" text-anchor="middle" x="145" y="462">trabajadora y pequeña burguesía:</text>
<text class="sv-t2" text-anchor="middle" x="145" y="477">frenar su desposesión</text>
<text class="sv-t2" text-anchor="middle" x="145" y="492">canalizándola por el Estado</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="270" x2="330" y1="458.0" y2="458.0"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="425" x2="425" y1="506" y2="540"/>
<rect class="sv-box" height="76" rx="2" width="220" x="330" y="540"/>
<text class="sv-t" text-anchor="middle" x="440" y="558">Moderación de promesas</text>
<text class="sv-t2" text-anchor="middle" x="440" y="573">→ cinismo</text>
<text class="sv-t2" text-anchor="middle" x="440" y="587" style="font-size:12px">del «régimen del 78» a «que se cumpla</text>
<text class="sv-t2" text-anchor="middle" x="440" y="600" style="font-size:12px">la Constitución»; limosnas presentadas</text>
<text class="sv-t2" text-anchor="middle" x="440" y="612" style="font-size:12px">como conquistas</text>
<line class="sv-line-red" marker-end="url(#m2-2-arrow)" x1="550" x2="570" y1="578.0" y2="578.0"/>
<rect class="sv-box-ink" height="76" rx="2" width="165" x="570" y="540"/>
<text class="sv-tw" text-anchor="middle" x="652" y="574">Miedo → represión</text>
<text class="sv-tw" text-anchor="middle" x="652" y="592">(Cádiz, Chile)</text>
<rect class="sv-box-green" height="76" rx="2" width="250" x="20" y="540"/>
<text class="sv-tgr" text-anchor="middle" x="145" y="574">Salida: revuelta espontánea</text>
<text class="sv-tgr" text-anchor="middle" x="145" y="592">→ autoorganización socialista</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="330" x2="270" y1="604" y2="604"/>
<rect class="sv-soft" height="40" rx="2" width="715" x="20" y="632"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="32" x2="66" y1="646" y2="646"/>
<text class="sv-t3" text-anchor="start" x="72" y="650">encadenamiento causal</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="230" x2="264" y1="646" y2="646"/>
<text class="sv-t3" text-anchor="start" x="270" y="650">contenido real / salida</text>
<line class="sv-line-red" marker-end="url(#m2-2-arrow)" x1="440" x2="474" y1="646" y2="646"/>
<text class="sv-t3" text-anchor="start" x="480" y="650">cuando la máquina de ilusiones se atasca</text>
<text class="sv-t3" text-anchor="start" x="32" y="665">la única bifurcación real es la autoorganización de la clase en un movimiento socialista</text>
</svg>
