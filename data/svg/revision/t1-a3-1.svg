<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la tesis de Sanjuán (separación entre orden lógico-sistemático e historiográfico) y el movimiento de Barcina. Matriz de dos por dos que cruza el método (reflejo especular o cesura kantiana frente a mediación) con la historicidad del capital (exterior o interior); el materialismo vulgar y el dualismo de Sanjuán comparten la negación de la praxis, y la dialéctica mínima de Barcina ocupa el cuadrante de mediación y límite interior. Debajo, por qué mediación (Hegel, Mito de lo Dado, determinación formal), el círculo de la acumulación originaria y las dos lecturas de ese capítulo." role="img" viewBox="0 0 760 740" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: LA TESIS DE SANJUÁN Y EL MOVIMIENTO DE BARCINA</text>
<rect class="sv-soft" height="72" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="42">Sanjuán: separación tajante entre el orden lógico-sistemático (exposición de las categorías) y el orden historiográfico;</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">los pasajes históricos de El Capital sólo ilustran o completan la exposición donde ésta topa con su límite: la acumulación</text>
<text class="sv-t2" style="font-size:12px" x="30" y="70">originaria, que rompe el «círculo vicioso» de la presuposición del capital. Concreto real ≠ concreto de pensamiento.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="88">Barcina: acepta reconstruir «la formulación coherente» y la vuelve contra Sanjuán: negar la separación abstracta → mediación.</text>
<text class="sv-t3" x="140" y="120">MÉTODO →</text>
<text class="sv-t" text-anchor="middle" x="290" y="136">Reflejo especular / cesura kantiana</text>
<text class="sv-t" text-anchor="middle" x="600" y="136">Mediación forma-contenido, sistema-historia</text>
<text class="sv-t3" x="15" y="210">HISTORICIDAD</text>
<text class="sv-t2" x="15" y="226">exterior al capital</text>
<text class="sv-t3" x="15" y="390">HISTORICIDAD</text>
<text class="sv-t2" x="15" y="406">interior al capital</text>
<rect class="sv-soft" height="166" rx="2" width="300" x="140" y="144"></rect>
<rect class="sv-soft" height="166" rx="2" width="300" x="450" y="144"></rect>
<rect class="sv-soft" height="166" rx="2" width="300" x="140" y="320"></rect>
<rect class="sv-soft" height="166" rx="2" width="300" x="450" y="320"></rect>
<rect class="sv-box" height="100" rx="2" width="135" x="150" y="154"></rect>
<text class="sv-t" text-anchor="middle" x="217" y="172" style="font-size:13.4px;letter-spacing:0">Materialismo vulgar</text>
<text class="sv-t2" text-anchor="middle" x="217" y="187">primacía de las</text>
<text class="sv-t2" text-anchor="middle" x="217" y="201">fuerzas productivas,</text>
<text class="sv-t2" text-anchor="middle" x="217" y="215">leyes técnicas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="217" y="230">«leyes del devenir»;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="217" y="244">deshistoriza la forma</text>
<rect class="sv-box" height="100" rx="2" width="135" x="295" y="154"></rect>
<text class="sv-t" text-anchor="middle" x="362" y="172" style="font-size:12.8px;letter-spacing:0">Dualismo de Sanjuán</text>
<text class="sv-t2" text-anchor="middle" x="362" y="187">cesura kantiana;</text>
<text class="sv-t2" text-anchor="middle" x="362" y="201">superación como</text>
<text class="sv-t2" text-anchor="middle" x="362" y="215">contingencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="362" y="230">«irreductible»: decisión</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="362" y="244">arbitraria e infundada</text>
<rect class="sv-box-red" height="40" rx="2" width="280" x="150" y="262"></rect>
<text class="sv-tr" text-anchor="middle" x="290" y="280">comparten: negación</text>
<text class="sv-tr" text-anchor="middle" x="290" y="295">de la praxis revolucionaria</text>
<rect class="sv-line-dash" height="146" rx="2" width="280" x="460" y="154"></rect>
<text class="sv-t2" text-anchor="middle" x="600" y="212">cuadrante inconsistente:</text>
<text class="sv-t2" text-anchor="middle" x="600" y="228">la mediación deriva el límite</text>
<text class="sv-t2" text-anchor="middle" x="600" y="244">de la lógica interna del capital</text>
<rect class="sv-line-dash" height="146" rx="2" width="280" x="150" y="330"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="380">cuadrante inconsistente:</text>
<text class="sv-t2" text-anchor="middle" x="290" y="396">el reflejo introduce</text>
<text class="sv-t2" text-anchor="middle" x="290" y="412">la transitoriedad ad hoc</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="290" y="432">(lo que hace Sanjuán al afirmar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="290" y="446">el carácter transitorio del capital)</text>
<rect class="sv-box-green" height="146" rx="2" width="280" x="460" y="330"></rect>
<text class="sv-tgr" text-anchor="middle" x="600" y="352">Dialéctica mínima (Barcina)</text>
<text class="sv-t2" text-anchor="middle" x="600" y="370">el capital produce y reproduce</text>
<text class="sv-t2" text-anchor="middle" x="600" y="385">los supuestos de su superación:</text>
<text class="sv-t2" text-anchor="middle" x="600" y="400">antagonismo de clase</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="600" y="415">(producción social / apropiación privada)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="600" y="430">límite histórico interior; Grundrisse: las condiciones</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="600" y="444">actuales «se presentan como aboliéndose a sí mismas»</text>
<text class="sv-t" text-anchor="middle" x="600" y="466">→ teoría revolucionaria</text>
<rect class="sv-soft" height="60" rx="2" width="720" x="20" y="498"></rect>
<text class="sv-t3" x="30" y="515">POR QUÉ MEDIACIÓN: LA CRÍTICA EPISTEMOLÓGICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="531">Hegel (certeza sensible): no hay inmediatez sin mediación conceptual («Mito de lo Dado», Sellars); un concreto real exterior al</text>
<text class="sv-t2" style="font-size:12px" x="30" y="545">concepto es un contrasentido. Marx atiende a la determinación formal (M-D-M → D-M-D'): las formas engendran su propio contenido.</text>
<text class="sv-t3" x="20" y="582">LA ACUMULACIÓN ORIGINARIA COMO CÍRCULO (AUFHEBUNG)</text>
<rect class="sv-box" height="44" rx="2" width="200" x="20" y="592"></rect>
<text class="sv-t" text-anchor="middle" x="120" y="610">Presupuestos</text>
<text class="sv-t2" text-anchor="middle" x="120" y="625">trabajador / condiciones objetivas</text>
<rect class="sv-box" height="44" rx="2" width="200" x="280" y="592"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="610">Resultados</text>
<text class="sv-t2" text-anchor="middle" x="380" y="625">reproducción de la relación</text>
<rect class="sv-box-blue" height="44" rx="2" width="200" x="540" y="592"></rect>
<text class="sv-tb" text-anchor="middle" x="640" y="610">Presupuestos ampliados</text>
<text class="sv-t2" text-anchor="middle" x="640" y="625">conservados y cancelados</text>
<line class="sv-line" marker-end="url(#m1-3-arrow)" x1="220" x2="280" y1="614" y2="614"></line>
<line class="sv-line" marker-end="url(#m1-3-arrow)" x1="480" x2="540" y1="614" y2="614"></line>
<path class="sv-line-red" d="M640 636 V660 H120 V638" marker-end="url(#m1-3-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="673">reproducción ampliada</text>
<rect class="sv-soft" height="52" rx="2" width="720" x="20" y="682"></rect>
<text class="sv-t3" x="30" y="699">DOS LECTURAS DEL CAPÍTULO</text>
<text class="sv-t2" style="font-size:12px" x="30" y="714">Sanjuán: sólo «explicita los presupuestos fácticos» de la exposición. Barcina: cancelar (Aufhebung) es también conservar y reproducir</text>
<text class="sv-t2" style="font-size:12px" x="30" y="728">ampliadamente: la reproducción de la relación capitalista pone los supuestos de las relaciones comunistas (asociación de productores).</text>
</svg>
