<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la metáfora del tenedor y la sopa: la utilidad de la socialdemocracia depende de las condiciones históricas. Curva en arco de la acumulación en el tiempo: en la pendiente ascendente, la socialdemocracia como etapa hacia el comunismo (argumento 2); en la cima, la contradicción en movimiento; en la descendente, la gestión pragmática del capitalismo sin crecimiento (argumento 1) sobre una zona sombreada de devastación ecológica; los dos argumentos no coinciden en el tiempo. Abajo, la socialdemocracia de la desacumulación como contrapeso parcial y débil, y la devastación ecológica que no puede deshacer: superar, no gestionar" role="img" viewBox="0 0 760 790" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-13-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="58" rx="2" width="720" x="20" y="12"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="28" style="font-size:10.5px">La metáfora: los tenedores no tienen nada de malo… hasta que te sirven sopa</text>
<text class="sv-t2" text-anchor="middle" x="380" y="44" style="font-size:11.5px">la utilidad de la socialdemocracia no depende de su naturaleza interna sino de las condiciones históricas:</text>
<text class="sv-t2" text-anchor="middle" x="380" y="59" style="font-size:11.5px">buena para ciertas cosas en ciertas situaciones; en otras, peor que inútil</text>
<path class="sv-soft" d="M560 560 L740 560 L740 470 Z"></path>
<line class="sv-line" marker-end="url(#m2-13-arrow)" x1="40" x2="740" y1="580" y2="580"></line>
<line class="sv-line" marker-end="url(#m2-13-arrow)" x1="40" x2="40" y1="580" y2="78"></line>
<text class="sv-t3" text-anchor="start" x="50" y="94">acumulación / valor</text>
<text class="sv-t3" text-anchor="start" x="48" y="598">tiempo</text>
<path class="sv-line-red" d="M60 560 Q380 -220 700 560"></path>
<circle class="sv-dot" cx="380" cy="170" r="5"></circle>
<circle class="sv-dot" cx="700" cy="560" r="5"></circle>
<rect class="sv-box-gold" height="84" rx="2" width="350" x="205" y="80"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="100">Contradicción en movimiento (Grundrisse)</text>
<text class="sv-t3" text-anchor="middle" x="380" y="115" style="font-size:10px">la expansión produce su propio fin</text>
<text class="sv-t2" text-anchor="middle" x="380" y="131" style="font-size:11px">la fase expansiva guiada por la producción industrial termina;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="145" style="font-size:11px">si no se ha salido del capitalismo, la era del movimiento obrero</text>
<text class="sv-t2" text-anchor="middle" x="380" y="159" style="font-size:11px">histórico se desvanece al descender el arco de la acumulación</text>
<text class="sv-t3" text-anchor="end" x="750" y="180">los dos argumentos son incompatibles:</text>
<text class="sv-t3" text-anchor="end" x="750" y="194">no forman una contradicción dialéctica,</text>
<text class="sv-t3" text-anchor="end" x="750" y="208">no hay síntesis: simplemente no coinciden</text>
<text class="sv-tr" text-anchor="end" x="750" y="225">no coinciden en el tiempo: hay que elegir</text>
<rect class="sv-box-blue" height="186" rx="2" width="210" x="170" y="350"></rect>
<text class="sv-tb" text-anchor="middle" x="275.0" y="370">Argumento 2: etapa hacia</text>
<text class="sv-tb" text-anchor="middle" x="275.0" y="386">el comunismo</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="402" style="font-size:11px">mediación capitalismo → comunismo:</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="416" style="font-size:11px">la clase consolida sus victorias, toma</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="430" style="font-size:11px">conciencia y poder de clase, avanza</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="444" style="font-size:11px">a su autorrealización y autoabolición</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="458" style="font-size:11px">(movimiento obrero industrial)</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="472" style="font-size:11px">depende de una fracción ascendente</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="486" style="font-size:11px">y unida de trabajadores industriales:</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="500" style="font-size:11px">fenómeno ligado al crecimiento: el</text>
<text class="sv-t2" text-anchor="middle" x="275.0" y="514" style="font-size:11px">valor crece junto con la productividad</text>
<text class="sv-t3" text-anchor="middle" x="275.0" y="530">fase ascendente del arco</text>
<rect class="sv-box-red" height="186" rx="2" width="210" x="385" y="350"></rect>
<text class="sv-tr" text-anchor="middle" x="490.0" y="370">Argumento 1: gestión pragmática</text>
<text class="sv-tr" text-anchor="middle" x="490.0" y="386">del capitalismo sin crecimiento</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="402" style="font-size:11px">cuando el libre mercado colapsa sin</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="416" style="font-size:11px">crecimiento: planificación (producción</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="430" style="font-size:11px">y distribución centralizadas en un</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="444" style="font-size:11px">Estado controlado por los productores)</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="458" style="font-size:11px">promesa: «producción capitalista sin</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="472" style="font-size:11px">capitalistas», eficiente e igualitaria;</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="486" style="font-size:11px">no cumplida: dependió de recursos y</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="500" style="font-size:11px">trabajo de colonias y periferias</text>
<text class="sv-t2" text-anchor="middle" x="490.0" y="514" style="font-size:11px">hoy: desacumulación (ver abajo)</text>
<text class="sv-t3" text-anchor="middle" x="490.0" y="530">fase descendente del arco</text>
<text class="sv-tr" text-anchor="end" x="690" y="554">devastación ecológica</text>
<rect class="sv-box" height="164" rx="2" width="350" x="20" y="612"></rect>
<text class="sv-t" text-anchor="middle" x="195" y="634">La socialdemocracia de la desacumulación</text>
<text class="sv-t2" text-anchor="middle" x="195" y="652" style="font-size:11px">las condiciones que socavan el movimiento obrero impulsan la</text>
<text class="sv-t2" text-anchor="middle" x="195" y="666" style="font-size:11px">desacumulación: la productividad ya permite satisfacer las</text>
<text class="sv-t2" text-anchor="middle" x="195" y="680" style="font-size:11px">necesidades lejos del pleno empleo; el único límite es la</text>
<text class="sv-t2" text-anchor="middle" x="195" y="694" style="font-size:11px">propiedad privada (hay que acceder a un salario para comer)</text>
<text class="sv-t2" text-anchor="middle" x="195" y="708" style="font-size:11px">contrapeso parcial: alivia la miseria del trabajo y la del</text>
<text class="sv-t2" text-anchor="middle" x="195" y="722" style="font-size:11px">no-trabajo aceptando ambas; «solución cuantitativa a un</text>
<text class="sv-t2" text-anchor="middle" x="195" y="736" style="font-size:11px">problema cualitativo»; débil: adjunto de un capitalismo débil,</text>
<text class="sv-t2" text-anchor="middle" x="195" y="750" style="font-size:11px">sin recursos para transformaciones dramáticas</text>
<text class="sv-t2" text-anchor="middle" x="195" y="764" style="font-size:11px">(sin despreciar por ello las luchas obreras del presente)</text>
<rect class="sv-box-red" height="164" rx="2" width="350" x="390" y="612"></rect>
<text class="sv-tr" text-anchor="middle" x="565" y="634">Devastación ecológica y salida</text>
<text class="sv-t2" text-anchor="middle" x="565" y="652" style="font-size:11px">las mismas condiciones que socavaron la acumulación (alta</text>
<text class="sv-t2" text-anchor="middle" x="565" y="666" style="font-size:11px">productividad, dominio del capital constante, demanda voraz</text>
<text class="sv-t2" text-anchor="middle" x="565" y="680" style="font-size:11px">de productos naturales) han traído la devastación ecológica,</text>
<text class="sv-t2" text-anchor="middle" x="565" y="694" style="font-size:11px">que la socialdemocracia no puede deshacer a la velocidad que</text>
<text class="sv-t2" text-anchor="middle" x="565" y="708" style="font-size:11px">la supervivencia exige: pervive como técnica de gestión,</text>
<text class="sv-t2" text-anchor="middle" x="565" y="722" style="font-size:11px">no como poder social</text>
<text class="sv-t3" text-anchor="middle" x="565" y="742">la socialdemocracia es un tenedor</text>
<text class="sv-t3" text-anchor="middle" x="565" y="756" style="font-size:10px">y estamos ante un plato de sopa («in the soup»: en problemas)</text>
<text class="sv-tr" text-anchor="middle" x="565" y="770">superar, no gestionar</text>
</svg>
