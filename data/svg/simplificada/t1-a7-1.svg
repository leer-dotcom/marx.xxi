<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: el leninismo como cuenta pendiente, el ¿Qué hacer? como acción de vanguardia y el reproche de intelectualismo. Círculos concéntricos: en el centro las luchas económicas y sindicales (embrión de conciencia sólo en el momento álgido), rodeadas por el movimiento de clase del proletariado (comunidad política, unitaria pero no uniforme) y, como sector más avanzado dentro de ese anillo, la vanguardia y la teoría revolucionaria. Dos flechas salen del centro: espontáneamente hacia el oportunismo y, mediante lucha teórica y organización, hacia el potencial revolucionario. A la derecha, la línea temporal rusa 1880, 1890 y 1900. Debajo, por qué la conciencia desde fuera no es inversión idealista; la ambivalencia del proletariado, la teoría como condición de posibilidad y la vanguardia como parte de un todo en movimiento; y la conclusión sobre la hipostatización soviética y el proletariado ausente de hoy." role="img" viewBox="0 0 760 696" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-7-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: UNA CUENTA PENDIENTE CON EL LENINISMO</text>
<rect class="sv-soft" height="30" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="43">Leninismo: experiencias revolucionarias inspiradas por Lenin; el ¿Qué hacer? es una «acción de vanguardia», no «intelectualismo».</text>
<circle class="sv-box-blue" cx="270" cy="240" r="140"></circle>
<circle class="sv-box" cx="270" cy="230" r="70"></circle>
<text class="sv-t" text-anchor="middle" x="270" y="224">Luchas económicas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="240">sindicales, restringidas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="255">«embrión» de conciencia</text>
<text class="sv-tb" text-anchor="middle" x="270" y="318">Movimiento de clase</text>
<text class="sv-tb" text-anchor="middle" x="270" y="333">del proletariado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="349">unitario pero no uniforme</text>
<rect class="sv-box-red" height="44" rx="2" width="200" x="170" y="96"></rect>
<text class="sv-tr" text-anchor="middle" x="270" y="115">Vanguardia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="270" y="132">teoría revolucionaria; parte del todo</text>
<line class="sv-line-red" marker-end="url(#m1-7-arrow)" x1="270" x2="270" y1="158" y2="142"></line>
<text class="sv-t3" x="282" y="156">elevan su conciencia</text>
<text class="sv-t3" x="20" y="76">desde fuera de la lucha económica, pero dentro del movimiento</text>
<path class="sv-line-dash" d="M140 80 V104 H168"></path>
<path class="sv-line-dash" marker-end="url(#m1-7-arrow)" d="M200 230 H130 V402"></path>
<text class="sv-t3" text-anchor="end" x="122" y="352">espontáneamente:</text>
<text class="sv-t3" text-anchor="end" x="122" y="366">en las luchas</text>
<rect class="sv-box" height="46" rx="2" width="220" x="20" y="404"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="424">Oportunismo</text>
<text class="sv-t2" style="font-size:11.8px" text-anchor="middle" x="130" y="441">Bernstein: «el movimiento lo es todo»</text>
<path class="sv-line-red" marker-end="url(#m1-7-arrow)" d="M340 230 H410 V402"></path>
<text class="sv-t3" x="418" y="352">lucha teórica</text>
<text class="sv-t3" x="418" y="366">y organización</text>
<rect class="sv-box-red" height="46" rx="2" width="240" x="290" y="404"></rect>
<text class="sv-tr" text-anchor="middle" x="410" y="424">Potencial revolucionario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="410" y="441">autonegación del proletariado</text>
<text class="sv-t3" x="560" y="76">EL CASO RUSO</text>
<line class="sv-line" marker-end="url(#m1-7-arrow)" x1="575" x2="575" y1="88" y2="384"></line>
<circle class="sv-dot" cx="575" cy="104" r="5"></circle>
<text class="sv-t" x="589" y="100">1880</text>
<text class="sv-t2" style="font-size:12px" x="589" y="116">núcleos intelectuales</text>
<text class="sv-t2" style="font-size:12px" x="589" y="130">sin movimiento (Plejánov)</text>
<circle class="sv-dot" cx="575" cy="200" r="5"></circle>
<text class="sv-t" x="589" y="196">1890</text>
<text class="sv-t2" style="font-size:12px" x="589" y="212">oleada huelguística:</text>
<text class="sv-t2" style="font-size:12px" x="589" y="226">conciencia «embrionaria»</text>
<circle class="sv-dot" cx="575" cy="296" r="5"></circle>
<text class="sv-t" x="589" y="292">1900</text>
<text class="sv-t2" style="font-size:12px" x="589" y="308">economismo → oportunismo;</text>
<text class="sv-t2" style="font-size:12px" x="589" y="322">«conciencia desde fuera»</text>
<text class="sv-t3" x="20" y="474">POR QUÉ LA «CONCIENCIA DESDE FUERA» NO ES INVERSIÓN IDEALISTA NI PASIVIDAD DE LAS MASAS</text>
<rect class="sv-soft" height="30" rx="2" width="720" x="20" y="482"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="501">La conciencia es activa y constitutiva («no sólo refleja el mundo, lo crea», Lenin); la teoría es conciencia del movimiento.</text>
<text class="sv-t3" x="20" y="536">TRES PRESUPUESTOS QUE SOSTIENEN EL ESQUEMA</text>
<rect class="sv-box-blue" height="56" rx="2" width="230" x="20" y="544"></rect>
<text class="sv-tb" style="font-size:13px" text-anchor="middle" x="135" y="564">Ambivalencia del proletariado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135" y="580">capital (fuerza de trabajo) y</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135" y="594">no-capital (trabajo vivo)</text>
<rect class="sv-box" height="56" rx="2" width="230" x="265" y="544"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="380" y="564">Teoría ≠ movimiento revolucionario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="580">condición de posibilidad,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="594">no el movimiento mismo</text>
<rect class="sv-box-red" height="56" rx="2" width="230" x="510" y="544"></rect>
<text class="sv-tr" style="font-size:13px" text-anchor="middle" x="625" y="564">Vanguardia: parte de un todo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625" y="580">avanzadilla de una fuerza en</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625" y="594">movimiento: «impulsando adelante»</text>
<text class="sv-t3" x="20" y="624">CONCLUSIÓN</text>
<rect class="sv-soft" height="30" rx="2" width="720" x="20" y="632"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="651">La vanguardia autosustentada es dogma soviético, no de Lenin; hoy el proletariado está ausente: dotarse de un cuerpo propio.</text>
<text class="sv-t3" text-anchor="middle" x="380" y="684">flecha de color: realización organizada · flecha discontinua: deriva espontánea · puntos: ubicación de la vanguardia</text>
</svg>
