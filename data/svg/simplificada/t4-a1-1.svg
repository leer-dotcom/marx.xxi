<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el fundamento: la soberanía del pueblo choca con el Estado oligárquico y funda el derecho a la revolución. En medio, la cadena causal de la revolución desde la contradicción del capitalismo hasta el Estado-comuna. Abajo, el ciclo pendular entre auge (hablar francés) y reflujo (hablar alemán) con las dos desviaciones oportunistas a los lados y la tarea presente: construir el partido" role="img" viewBox="0 0 760 572" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">FUNDAMENTO: DE LA SOBERANÍA DEL PUEBLO AL DERECHO A LA REVOLUCIÓN</text>
<rect class="sv-box-blue" height="60" rx="2" width="212" x="20" y="26"></rect>
<text class="sv-tb" text-anchor="middle" x="126" y="44">Soberanía del pueblo</text>
<text class="sv-t2" text-anchor="middle" x="126" y="59" style="font-size:12px">democracia íntegra: representantes</text>
<text class="sv-t2" text-anchor="middle" x="126" y="73" style="font-size:12px">revocables, asamblea única, milicia</text>
<rect class="sv-box" height="60" rx="2" width="212" x="274" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="44">Estado oligárquico</text>
<text class="sv-t2" text-anchor="middle" x="380" y="59" style="font-size:12px">blinda a la minoría capitalista;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="73" style="font-size:12px">afirmar la soberanía exige destruirlo</text>
<rect class="sv-box-red" height="60" rx="2" width="212" x="528" y="26"></rect>
<text class="sv-tr" text-anchor="middle" x="634" y="44">Derecho a la revolución</text>
<text class="sv-t2" text-anchor="middle" x="634" y="59" style="font-size:12px">revocar el orden oligárquico en nombre</text>
<text class="sv-t2" text-anchor="middle" x="634" y="73" style="font-size:12px">de la soberanía · autoemancipación</text>
<path class="sv-line" d="M232 56 H272" marker-end="url(#m4-1-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="253" y="49">choca</text>
<path class="sv-line" d="M486 56 H526" marker-end="url(#m4-1-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="507" y="49">funda</text>
<line class="sv-line-dash" x1="20" x2="740" y1="100" y2="100"></line>
<text class="sv-t3" x="20" y="118">LÓGICA DE LA REVOLUCIÓN (cadena causal)</text>
<rect class="sv-box" height="64" rx="2" width="168" x="20" y="128"></rect>
<text class="sv-t" text-anchor="middle" x="104" y="146">Contradicción</text>
<text class="sv-t2" text-anchor="middle" x="104" y="160">del capitalismo</text>
<text class="sv-t2" text-anchor="middle" x="104" y="173" style="font-size:12px">producción social frente a</text>
<text class="sv-t2" text-anchor="middle" x="104" y="186" style="font-size:12px">apropiación privada</text>
<rect class="sv-box" height="64" rx="2" width="168" x="204" y="128"></rect>
<text class="sv-t" text-anchor="middle" x="288" y="146">Crisis política general</text>
<text class="sv-t3" text-anchor="middle" x="288" y="160">arriba no pueden</text>
<text class="sv-t3" text-anchor="middle" x="288" y="173">abajo no quieren</text>
<text class="sv-t2" text-anchor="middle" x="288" y="186" style="font-size:12px">no se «hace»: se utiliza</text>
<rect class="sv-box" height="64" rx="2" width="168" x="388" y="128"></rect>
<text class="sv-t" text-anchor="middle" x="472" y="146">Masas + partido</text>
<text class="sv-t3" text-anchor="middle" x="472" y="160">factor subjetivo</text>
<text class="sv-t2" text-anchor="middle" x="472" y="173" style="font-size:12px">sin partido de masas el viejo</text>
<text class="sv-t2" text-anchor="middle" x="472" y="186" style="font-size:12px">gobierno nunca «cae» solo</text>
<rect class="sv-box" height="64" rx="2" width="168" x="572" y="128"></rect>
<text class="sv-t" text-anchor="middle" x="656" y="146">Mayoría decisiva</text>
<text class="sv-t2" text-anchor="middle" x="656" y="160">se verifica en la lucha</text>
<text class="sv-t2" text-anchor="middle" x="656" y="173" style="font-size:12px">partido como única salida;</text>
<text class="sv-t2" text-anchor="middle" x="656" y="186" style="font-size:12px">parlamento: índice, no centro</text>
<path class="sv-line" d="M188 160 H202" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line" d="M372 160 H386" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line" d="M556 160 H570" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line" d="M656 192 V206" marker-end="url(#m4-1-arrow)"></path>
<rect class="sv-box" height="64" rx="2" width="168" x="572" y="208"></rect>
<text class="sv-t" text-anchor="middle" x="656" y="226">Golpe definitivo</text>
<text class="sv-t2" text-anchor="middle" x="656" y="240">insurrección u otra forma</text>
<text class="sv-t2" text-anchor="middle" x="656" y="253" style="font-size:12px">táctica, no principio; se apoya</text>
<text class="sv-t2" text-anchor="middle" x="656" y="266" style="font-size:12px">en el auge de la clase</text>
<rect class="sv-box" height="64" rx="2" width="168" x="388" y="208"></rect>
<text class="sv-t" text-anchor="middle" x="472" y="226">Destrucción de la</text>
<text class="sv-t" text-anchor="middle" x="472" y="241">máquina</text>
<text class="sv-t3" text-anchor="middle" x="472" y="254">burocrático-militar</text>
<text class="sv-t2" text-anchor="middle" x="472" y="267" style="font-size:12px">condición de toda revolución</text>
<rect class="sv-box-red" height="64" rx="2" width="168" x="204" y="208"></rect>
<text class="sv-tr" text-anchor="middle" x="288" y="226">Estado-comuna</text>
<text class="sv-t2" text-anchor="middle" x="288" y="240">democracia íntegra</text>
<text class="sv-t2" text-anchor="middle" x="288" y="253" style="font-size:12px">forma política de la</text>
<text class="sv-t2" text-anchor="middle" x="288" y="266" style="font-size:12px">dictadura del proletariado</text>
<rect class="sv-soft" height="64" rx="2" width="168" x="20" y="208"></rect>
<text class="sv-t2" text-anchor="middle" x="104" y="238">Construcción</text>
<text class="sv-t2" text-anchor="middle" x="104" y="252">del socialismo</text>
<path class="sv-line" d="M572 240 H558" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line-red" d="M388 240 H374" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line-dash" d="M204 240 H190" marker-end="url(#m4-1-arrow)"></path>
<line class="sv-line-dash" x1="20" x2="740" y1="286" y2="286"></line>
<text class="sv-t3" x="20" y="304">CICLO AUGE ↔ REFLUJO: dos lenguajes del mismo partido</text>
<rect class="sv-box-gold" height="70" rx="2" width="160" x="20" y="318"></rect>
<text class="sv-tg" text-anchor="middle" x="100" y="336" style="font-size:12.8px">Oportunismo</text>
<text class="sv-tg" text-anchor="middle" x="100" y="350" style="font-size:12.8px">de derecha</text>
<text class="sv-t2" text-anchor="middle" x="100" y="365" style="font-size:12px">integrarse en el Estado</text>
<text class="sv-t2" text-anchor="middle" x="100" y="379" style="font-size:12px">absolutiza las reformas</text>
<rect class="sv-box-blue" height="70" rx="2" width="165" x="200" y="318"></rect>
<text class="sv-tb" text-anchor="middle" x="282.5" y="336">«Hablar alemán»</text>
<text class="sv-t2" text-anchor="middle" x="282.5" y="351">reflujo · acumulación</text>
<text class="sv-t3" text-anchor="middle" x="282.5" y="365">paciente de fuerzas</text>
<text class="sv-t2" text-anchor="middle" x="282.5" y="379" style="font-size:12px">partido de oposición extrema</text>
<rect class="sv-box-red" height="70" rx="2" width="165" x="395" y="318"></rect>
<text class="sv-tr" text-anchor="middle" x="477.5" y="336">«Hablar francés»</text>
<text class="sv-t2" text-anchor="middle" x="477.5" y="351">auge · ofensiva</text>
<text class="sv-t3" text-anchor="middle" x="477.5" y="365">insurreccional</text>
<text class="sv-t2" text-anchor="middle" x="477.5" y="379" style="font-size:12px">única salida a la crisis</text>
<rect class="sv-box-gold" height="70" rx="2" width="160" x="580" y="318"></rect>
<text class="sv-tg" text-anchor="middle" x="660" y="336">Oportunismo</text>
<text class="sv-tg" text-anchor="middle" x="660" y="351">de izquierda</text>
<text class="sv-t3" text-anchor="middle" x="660" y="365">voluntarismo</text>
<text class="sv-t2" text-anchor="middle" x="660" y="379" style="font-size:12px">no sabe retirarse</text>
<path class="sv-line" d="M365 338 C 375 320, 385 320, 393 338" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line" d="M395 368 C 385 386, 375 386, 367 368" marker-end="url(#m4-1-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="318">auge</text>
<text class="sv-t3" text-anchor="middle" x="380" y="398">reflujo</text>
<path class="sv-line-dash" d="M200 353 H182" marker-end="url(#m4-1-arrow)"></path>
<path class="sv-line-dash" d="M560 353 H578" marker-end="url(#m4-1-arrow)"></path>
<text class="sv-t3" x="20" y="408">desviación</text>
<text class="sv-t3" text-anchor="end" x="740" y="408">desviación</text>
<path class="sv-line-red" d="M282 390 C 282 440, 477 440, 477 392" marker-end="url(#m4-1-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="380" y="458">«Para poder hablar francés hay que aprender primero a hablar alemán»</text>
<rect class="sv-soft" height="62" rx="2" width="720" x="20" y="472"></rect>
<text class="sv-t3" x="30" y="490">HOY: ni situación revolucionaria ni partido revolucionario de masas</text>
<text class="sv-t2" x="30" y="508" style="font-size:12.5px">Tarea prioritaria: «hablar alemán», construir el partido de masas de oposición extrema, reservándose el derecho a la revolución.</text>
<text class="sv-t2" x="30" y="525" style="font-size:12.5px">Esa amenaza latente da fuerza incluso a las reformas: reforma y revolución no se oponen en abstracto.</text>
<line class="sv-line" x1="20" x2="50" y1="556" y2="556" marker-end="url(#m4-1-arrow)"></line>
<text class="sv-t3" x="58" y="560">secuencia del proceso</text>
<line class="sv-line-dash" x1="202" x2="232" y1="556" y2="556" marker-end="url(#m4-1-arrow)"></line>
<text class="sv-t3" x="240" y="560">deriva · desviación / continuación</text>
<line class="sv-line-red" x1="456" x2="486" y1="556" y2="556" marker-end="url(#m4-1-arrow)"></line>
<text class="sv-t3" x="494" y="560">tesis central del artículo</text>
</svg>
