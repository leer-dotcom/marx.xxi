<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: la dialéctica como lógica de la enajenación y la ambigüedad de la potencialidad del ser genérico; debajo, la distinción entre externalización y enajenación (Testa, Adorno). Contraste entre el modelo procesual de la alienación, una secuencia lineal de esencia, externalización, enajenación y recuperación, y el modelo de la seipseigualdad auto-escindida, un bucle en que la práctica externalizante, la enajenación en dinero y valor, la retroyección y la determinabilidad reconocida ex post se encadenan sin punto libre de enajenación. Debajo, el dilema inmanencia-trascendencia que el bucle disuelve, con la réplica de la explotación y la objeción empirista, y la consecuencia para el imperativo comunista: la historia nos desposee aun cuando nos provee del único recurso para nuestra liberación." role="img" viewBox="0 0 760 626" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: UNA AMBIGÜEDAD EN LA POTENCIALIDAD DEL SER GENÉRICO</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">La dialéctica es la lógica de la enajenación; su «sangre universal» es la negatividad autorrelacionada del ser genérico.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">Ambigüedad: si prácticas y formas (dinero, valor) se co-constituyen, ¿con qué parámetro medir el potencial no actualizado?</text>
<rect class="sv-box-green" height="48" rx="2" width="720" x="20" y="78"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="98">Externalización (Entäusserung) y enajenación (Entfremdung): la distinción de Testa, con Adorno</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="116">Toda enajenación es externalización, pero no toda externalización es enajenación: segunda naturaleza reificada que subyuga.</text>
<text class="sv-t3" x="20" y="150">MODELO PROCESUAL (POR ESTADIOS)</text>
<text class="sv-t3" x="20" y="165">LA LECTURA QUE BRASSIER CRITICA</text>
<rect class="sv-box" height="46" rx="2" width="320" x="20" y="176"></rect>
<text class="sv-t" text-anchor="middle" x="180" y="196">Esencia originaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180" y="213">ser genérico como sustancia, esencia fija</text>
<rect class="sv-box" height="46" rx="2" width="320" x="20" y="240"></rect>
<text class="sv-t" text-anchor="middle" x="180" y="260">Externalización</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180" y="277">Entäusserung: el Espíritu se emancipa de la necesidad</text>
<rect class="sv-box-red" height="46" rx="2" width="320" x="20" y="304"></rect>
<text class="sv-tr" text-anchor="middle" x="180" y="324">Enajenación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180" y="341">Entfremdung: segunda naturaleza, nueva subyugación</text>
<rect class="sv-box" height="46" rx="2" width="320" x="20" y="368"></rect>
<text class="sv-t" text-anchor="middle" x="180" y="388">Liberación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180" y="405">recuperación de la esencia perdida</text>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180" x2="180" y1="222" y2="240"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180" x2="180" y1="286" y2="304"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="180" x2="180" y1="350" y2="368"></line>
<text class="sv-tr" text-anchor="middle" x="180" y="436">crítica: reifica los momentos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="180" y="453">«la enajenación es la sombra de la externalización»</text>
<text class="sv-t3" x="370" y="150">SEIPSEIGUALDAD AUTO-ESCINDIDA (BUCLE)</text>
<text class="sv-t3" x="370" y="165">LA LECTURA DE BRASSIER</text>
<rect class="sv-box-blue" height="56" rx="2" width="170" x="370" y="176"></rect>
<text class="sv-tb" text-anchor="middle" x="455" y="195">Práctica</text>
<text class="sv-tb" text-anchor="middle" x="455" y="210">externalizante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455" y="226">el ser genérico produce</text>
<rect class="sv-box-red" height="56" rx="2" width="170" x="570" y="176"></rect>
<text class="sv-tr" text-anchor="middle" x="655" y="198">Enajenación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655" y="214">dinero, valor:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655" y="227">«poder enajenado»</text>
<rect class="sv-box" height="56" rx="2" width="170" x="570" y="290"></rect>
<text class="sv-t" text-anchor="middle" x="655" y="309">Retroyección</text>
<text class="sv-t" text-anchor="middle" x="655" y="324">de precondiciones</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="655" y="340">una no-libertad previa</text>
<rect class="sv-box" height="56" rx="2" width="170" x="370" y="290"></rect>
<text class="sv-t" text-anchor="middle" x="455" y="309">Determinabilidad</text>
<text class="sv-t" text-anchor="middle" x="455" y="324">reconocida ex post</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="455" y="340">universalidad negativa</text>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="540" x2="570" y1="204" y2="204"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="655" x2="655" y1="232" y2="290"></line>
<line class="sv-line" marker-end="url(#m1-5-arrow)" x1="570" x2="540" y1="318" y2="318"></line>
<line class="sv-line-red" marker-end="url(#m1-5-arrow)" x1="455" x2="455" y1="290" y2="232"></line>
<text class="sv-t3" x="463" y="265">nueva externalización</text>
<text class="sv-tr" text-anchor="middle" x="555" y="372">no hay punto libre de enajenación</text>
<text class="sv-t2" text-anchor="middle" x="555" y="390">la potencialidad se determina ex post, no ex ante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="555" y="407">la sujeción es también capacitación</text>
<text class="sv-t3" text-anchor="middle" x="555" y="428">flecha gris: sucesión · flecha de color: cierre del bucle</text>
<rect class="sv-box-gold" height="68" rx="2" width="720" x="20" y="470"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="491">DILEMA QUE EL BUCLE DISUELVE (inmanencia / trascendencia)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="509">o el ser genérico se funde con las relaciones vigentes (no deficientes), o las trasciende como esencia ahistórica (idealismo)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="526">Disolución: la determinabilidad genérica no preexiste a su enajenación en dinero y valor: deviene posible a través de ella.</text>
<text class="sv-t3" x="20" y="558">CONSECUENCIA: ENAJENANDO LA LIBERTAD (EL IMPERATIVO COMUNISTA)</text>
<rect class="sv-soft" height="50" rx="2" width="720" x="20" y="566"></rect>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="583">El comunismo no recupera una esencia perdida: hace apropiables como obra nuestra las posibilidades generadas por la enajenación.</text>
<text class="sv-t" text-anchor="middle" x="380" y="605">«La historia nos desposee aun cuando nos provee del único recurso para nuestra liberación»</text>
</svg>
