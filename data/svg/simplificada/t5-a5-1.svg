<svg xmlns="http://www.w3.org/2000/svg" aria-label="Embudo de maduración y depuración de las tres Internacionales, con la base social, el legado, lo que cada una expulsó y la causa de su ocaso; debajo, los epígonos y el escenario actual, y la nueva Internacional de los comunistas con sus fundamentos y las lecciones de los orígenes" role="img" viewBox="0 0 760 562" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="230" y="24">MADURACIÓN Y DEPURACIÓN DEL INTERNACIONALISMO</text>
<text class="sv-t3" text-anchor="middle" x="600" y="24">QUÉ APORTÓ · A QUIÉN EXPULSÓ · POR QUÉ CAYÓ</text>
<path class="sv-box" d="M20 40 L440 40 L400 116 L60 116 Z"></path>
<text class="sv-t" text-anchor="middle" x="230" y="64">I Internacional (AIT, 1864-1876)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="82">todas las corrientes: sindicatos, proudhonianos,</text>
<text class="sv-t2" text-anchor="middle" x="230" y="98">bakuninistas, marxistas</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="62">legado: conquista del poder político, autoemancipación</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="78">expulsa: proudhonianos y bakuninistas</text>
<text class="sv-t3" x="455" y="94">ocaso: no logra constituirse en partido</text>
<path class="sv-box-blue" d="M60 128 L400 128 L360 204 L100 204 Z"></path>
<text class="sv-tb" text-anchor="middle" x="230" y="152">II Internacional (1889-1914)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="170">sin anarquistas: partidos obreros</text>
<text class="sv-t2" text-anchor="middle" x="230" y="186">de masas con hegemonía marxista</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="150">legado: los medios de la política obrera (1.º de Mayo, prensa)</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="166">expulsa: anarquistas (1891-1896)</text>
<text class="sv-t3" x="455" y="182">ocaso: brecha palabras-hechos (1914)</text>
<path class="sv-box-red" d="M100 216 L360 216 L320 292 L140 292 Z"></path>
<text class="sv-tr" text-anchor="middle" x="230" y="240">III Internacional (1919-1943)</text>
<text class="sv-t2" text-anchor="middle" x="230" y="258">solo comunistas: ruptura</text>
<text class="sv-t2" text-anchor="middle" x="230" y="274">con el oportunismo</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="238">legado: 4 primeros congresos, «un paso más», no un modelo</text>
<text class="sv-t2" style="font-size:11.5px" x="455" y="254">excluye: reformistas y centristas</text>
<text class="sv-t3" x="455" y="270">ocaso: subordinación al Estado soviético</text>
<path class="sv-line-red" d="M230 292 L230 308" marker-end="url(#m5-5-arrow)"></path>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="310"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="326">EPÍGONOS Y ESCENARIO ACTUAL</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="343">Cominform (1947) · IV Internacional rota en 21 «cuartas» · bordiguismo, hoxhaísmo, maoísmo · hoy: sectas + hegemonía reformista</text>
<path class="sv-line-red" d="M380 350 L380 366" marker-end="url(#m5-5-arrow)"></path>
<rect class="sv-box-ink" height="44" rx="2" width="720" x="20" y="368"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="386">Hoy: una nueva Internacional de los comunistas</text>
<text class="sv-tw" text-anchor="middle" x="380" y="403">acuerdos programáticos · acción política internacional · partidos continentales · ni apologética ni adanismo</text>
<rect class="sv-box" height="62" rx="2" width="352" x="20" y="424"></rect>
<text class="sv-t" text-anchor="middle" x="196" y="442">Qué Internacional: fundamentos</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="459">acción política independiente + breve programa general;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="196" y="472">unidad por acuerdos, no por autoridad doctrinal</text>
<rect class="sv-box" height="62" rx="2" width="352" x="388" y="424"></rect>
<text class="sv-t" text-anchor="middle" x="564" y="442">Lecciones de los orígenes de cada Internacional</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="459">I: tareas donde el marco nacional es insuficiente (Palestina);</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="564" y="472">II: jornadas comunes; III: ruptura con el reformismo</text>
<rect class="sv-soft" height="52" rx="2" width="720" x="20" y="498"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="514">MÉTODO Y LEYENDA</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11px" x="380" y="530">ni apologética («cosplay») ni adanismo («alzheimer»); el internacionalismo es el «test de Litmus» de la independencia política</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="545">flecha = sucesión histórica · el embudo se estrecha = depuración de corrientes · a la derecha: legado, a quién expulsó y causa de la caída</text>
</svg>
