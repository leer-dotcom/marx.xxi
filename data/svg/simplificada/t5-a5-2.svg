<svg xmlns="http://www.w3.org/2000/svg" aria-label="Línea temporal 1864-1943 de las tres Internacionales en tres bloques, uno por Internacional, con sus congresos y rupturas decisivas y la tarea de cada una" role="img" viewBox="0 0 760 584" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
