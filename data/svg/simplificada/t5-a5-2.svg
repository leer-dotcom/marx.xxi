<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="562">cada bloque es una Internacional, con su periodo y la tarea que le asigna Aguiriano · arriba/abajo sólo por espacio</text>
<text class="sv-t3" text-anchor="middle" style="font-size:10px" x="380" y="575">entre bloques hay 13 años (1876-1889) y 5 (1914-1919) sin Internacional</text>
