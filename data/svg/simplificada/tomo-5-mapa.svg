<text class="sv-t3" text-anchor="end" x="718" y="189">exige</text>
<text class="sv-t3" text-anchor="end" x="718" y="203">(1, 3, 5)</text>
<path class="sv-line" marker-end="url(#m5-s-arrow)" d="M540 212 V193 H620 V174"/>
<text class="sv-t3" x="546" y="207">criterio (1, 3, 5)</text>
<rect class="sv-box" rx="2" x="10" y="28" width="164" height="54"/>
<text class="sv-t" text-anchor="middle" x="92" y="47">Ley del valor</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="92" y="63">mercado mundial</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="92" y="77">dinero, crédito, deuda, renta</text>
<rect class="sv-box" rx="2" x="202" y="28" width="164" height="54"/>
<text class="sv-t" text-anchor="middle" x="284" y="47">Estado capitalista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="63">sistema interestatal</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="77">jerárquico, bajo la ley del valor</text>
<rect class="sv-box-red" rx="2" x="394" y="28" width="164" height="54"/>
<text class="sv-tr" text-anchor="middle" x="476" y="47">Imperialismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="476" y="63">forma política</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="476" y="77">del mercado mundial</text>
<rect class="sv-box-gold" rx="2" x="586" y="28" width="164" height="54"/>
<text class="sv-tg" text-anchor="middle" x="668" y="47">Hegemonía de EE. UU.</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="668" y="63">dólar, OTAN, FMI, bases</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="668" y="77">liquidez, reglas, coerción</text>
<rect class="sv-box-ink" rx="2" x="10" y="120" width="164" height="54"/>
<text class="sv-tw" style="font-size:13.5px" text-anchor="middle" x="92" y="139">Internacional comunista</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="92" y="155">partido de masas internacional</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="92" y="169">sobre acuerdos programáticos</text>
<rect class="sv-box-gold" rx="2" x="394" y="120" width="164" height="54"/>
<text class="sv-tg" style="font-size:13px" text-anchor="middle" x="476" y="139">Multipolaridad / BRICS+</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="476" y="155">China, Rusia</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="476" y="169">reconfiguración, no superación</text>
<rect class="sv-box-green" rx="2" x="586" y="120" width="164" height="54"/>
<text class="sv-tgr" style="font-size:13px" text-anchor="middle" x="668" y="139">Derrotismo / defensismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="668" y="155">doble delimitación táctica</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="668" y="169">propio bloque / país agredido</text>
<rect class="sv-box-blue" rx="2" x="202" y="212" width="164" height="54"/>
<text class="sv-tb" text-anchor="middle" x="284" y="231">Campismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="247">frentes con el bloque rival</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="261">ve «revoluciones de colores»</text>
<rect class="sv-box-green" rx="2" x="394" y="212" width="164" height="54"/>
<text class="sv-tgr" text-anchor="middle" x="476" y="231">Independencia política</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="476" y="247">de clase</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="476" y="261">pactos tácticos, no frentes</text>
<rect class="sv-box-red" rx="2" x="586" y="212" width="164" height="54"/>
<text class="sv-tr" text-anchor="middle" x="668" y="231">Cuestión colonial</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="668" y="247">Palestina: lucha anticolonial</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="668" y="261">dos Estados = proyecto colonial</text>
<rect class="sv-box-blue" rx="2" x="202" y="318" width="164" height="54"/>
<text class="sv-tb" text-anchor="middle" x="284" y="337">Estalinismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="353">socialismo en un solo país</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="284" y="367">la retirada como principio</text>
<rect class="sv-box-blue" rx="2" x="586" y="318" width="164" height="54"/>
<text class="sv-tb" text-anchor="middle" x="668" y="337">Anticampismo abstracto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="668" y="353">«eterno 1914»</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="668" y="367">KKE, «pirámide imperialista»</text>
<rect class="sv-soft" rx="2" x="10" y="390" width="740" height="112"/>
<text class="sv-t3" x="20" y="408">rojo: imperialismo y cuestión colonial · dorado: orden existente (hegemonía, multipolaridad) · verde: política proletaria</text>
<text class="sv-t3" x="20" y="422">(independencia de clase, derrotismo/defensismo) · azul: desviaciones (campismo, anticampismo, estalinismo) · negro: la tarea</text>
<text class="sv-t3" x="20" y="436">flecha roja: delimitación política y horizonte · (n): artículos que desarrollan la relación</text>
<text class="sv-t2" style="font-size:11.5px" x="20" y="456">1 · Seijo — Imperialismo: teoría, coyuntura e internacionalismo</text>
<text class="sv-t2" style="font-size:11.5px" x="20" y="470">2 · Gómez — Estados Unidos como potencia imperial</text>
<text class="sv-t2" style="font-size:11.5px" x="20" y="484">3 · Miasni — El tablero mundial, Palestina y la lucha antimperialista</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="456">4 · Volodia — Romper el hielo: la revolución mundial (1914-1949)</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="470">5 · Aguiriano — Proletarios del mundo, uníos: las tres Internacionales</text>
</svg>
