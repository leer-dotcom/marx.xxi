<text class="sv-t3" text-anchor="middle" x="323" y="304">test de Litmus (1, 4, 5)</text>
<path class="sv-line-red" marker-end="url(#m5-s-arrow)" d="M586 345 H520 V266"/>
<text class="sv-t3" text-anchor="end" x="514" y="310">la vacía (1, 3)</text>
