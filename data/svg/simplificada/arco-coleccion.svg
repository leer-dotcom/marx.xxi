<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arco temático de los cinco volúmenes: del marxismo como teoría a la organización internacional; cada volumen presupone el anterior" role="img" viewBox="0 0 760 284" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0-arc" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">EL ARCO DE LA COLECCIÓN: DE LA CRÍTICA TEÓRICA A LA ORGANIZACIÓN INTERNACIONAL</text>
<rect class="sv-box" rx="2" x="20.0" y="40" width="138" height="112"/>
<text class="sv-tr" text-anchor="middle" x="89.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 1 · 2021</text>
<text class="sv-t" text-anchor="middle" x="89.0" y="79">Qué marxismo</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="96" style="font-size:11.5px">«Un marxismo para</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="110" style="font-size:11.5px">el siglo XXI»</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="129" style="font-size:12px">unidad teoría-política</text>
<text class="sv-t3" text-anchor="middle" x="89.0" y="145" style="font-size:10px">15 artículos</text>
<rect class="sv-box" rx="2" x="165.5" y="40" width="138" height="112"/>
<text class="sv-tr" text-anchor="middle" x="234.5" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 2 · 2022</text>
<text class="sv-t" text-anchor="middle" x="234.5" y="79" style="font-size:13.4px;letter-spacing:0">Deslinde de campos</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="96" style="font-size:11.5px">«Contra la</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="110" style="font-size:11.5px">socialdemocracia»</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="129" style="font-size:12px">frente al reformismo</text>
<text class="sv-t3" text-anchor="middle" x="234.5" y="145" style="font-size:10px">13 artículos</text>
<rect class="sv-box" rx="2" x="311.0" y="40" width="138" height="112"/>
<text class="sv-tr" text-anchor="middle" x="380.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 3 · 2024</text>
<text class="sv-t" text-anchor="middle" x="380.0" y="79">Independencia</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="96" style="font-size:11.5px">«Independencia</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="110" style="font-size:11.5px">política»</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="129" style="font-size:12px">construir el partido</text>
<text class="sv-t3" text-anchor="middle" x="380.0" y="145" style="font-size:10px">8 artículos</text>
<rect class="sv-box" rx="2" x="456.5" y="40" width="138" height="112"/>
<text class="sv-tr" text-anchor="middle" x="525.5" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 4 · 2025</text>
<text class="sv-t" text-anchor="middle" x="525.5" y="79" style="font-size:13.4px;letter-spacing:0">Revolución y Estado</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="96" style="font-size:11.5px">«El derecho a</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="110" style="font-size:11.5px">la revolución»</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="129" style="font-size:12px">Estado y Comuna</text>
<text class="sv-t3" text-anchor="middle" x="525.5" y="145" style="font-size:10px">7 artículos</text>
<rect class="sv-box" rx="2" x="602.0" y="40" width="138" height="112"/>
<text class="sv-tr" text-anchor="middle" x="671.0" y="60" style="font-size:13.1px;letter-spacing:0">VOLUMEN 5 · 2026</text>
<text class="sv-t" text-anchor="middle" x="671.0" y="79" style="font-size:13.4px;letter-spacing:0">Internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="96" style="font-size:11.5px">«Internacionalismo</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="110" style="font-size:11.5px">proletario»</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="129" style="font-size:12px">guerra e Internacional</text>
<text class="sv-t3" text-anchor="middle" x="671.0" y="145" style="font-size:10px">5 artículos</text>
<path class="sv-line-red" d="M89.0 180 H671.0" marker-end="url(#m0-arc)"/>
<text class="sv-t3" text-anchor="middle" x="380" y="170" style="font-size:10.5px">CADA VOLUMEN PRESUPONE EL ANTERIOR</text>
<circle class="sv-dot" cx="89.0" cy="180" r="6"/>
<text class="sv-t2" text-anchor="middle" x="89.0" y="209" style="font-size:12px">Totalidad, crisis, Hegel,</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="224" style="font-size:12px">fetichismo, proletariado</text>
<text class="sv-t2" text-anchor="middle" x="89.0" y="239" style="font-size:12px">ausente, comunidad ilusoria</text>
<circle class="sv-dot" cx="234.5" cy="180" r="6"/>
<text class="sv-t2" text-anchor="middle" x="234.5" y="209" style="font-size:12px">Estado no neutral, dominio</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="224" style="font-size:12px">impersonal, redistribuir</text>
<text class="sv-t2" text-anchor="middle" x="234.5" y="239" style="font-size:12px">≠ criticar, populismo</text>
<circle class="sv-dot" cx="380.0" cy="180" r="6"/>
<text class="sv-t2" text-anchor="middle" x="380.0" y="209" style="font-size:12px">Conciencia, hegemonía,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="224" style="font-size:12px">partido antes de la crisis,</text>
<text class="sv-t2" text-anchor="middle" x="380.0" y="239" style="font-size:12px">proletarización juvenil</text>
<circle class="sv-dot" cx="525.5" cy="180" r="6"/>
<text class="sv-t2" text-anchor="middle" x="525.5" y="209" style="font-size:12px">Giro autoritario, derechos</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="224" style="font-size:12px">como armas, democracia =</text>
<text class="sv-t2" text-anchor="middle" x="525.5" y="239" style="font-size:12px">dictadura del proletariado</text>
<circle class="sv-dot" cx="671.0" cy="180" r="6"/>
<text class="sv-t2" text-anchor="middle" x="671.0" y="209" style="font-size:12px">Derrotismo, Palestina, balance</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="224" style="font-size:12px">del estalinismo, ni OTAN ni</text>
<text class="sv-t2" text-anchor="middle" x="671.0" y="239" style="font-size:12px">BRICS+, nueva Internacional</text>
<text class="sv-t3" text-anchor="middle" x="380" y="266">TEORÍA  →  CRÍTICA DE LOS &quot;FALSOS AMIGOS&quot;  →  SUJETO  →  PODER  →  ESCALA MUNDIAL</text>
</svg>
