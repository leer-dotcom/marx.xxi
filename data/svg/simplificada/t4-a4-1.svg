<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arriba, teoría del castigo: definición del giro autoritario, balanza entre políticas sociales y castigo inclinada hacia el castigo, y correlato ideológico; en medio, línea temporal de las reformas penales españolas de 1973 a 2023 con su contexto y su efecto; abajo, la conclusión del artículo" viewBox="0 0 760 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" rx="2" x="12" y="12" width="240" height="100"/>
<text class="sv-t3" x="22" y="29">GIRO AUTORITARIO DEL ESTADO</text>
<text class="sv-t2" x="22" y="46" style="font-size:12px;letter-spacing:0">más poder del Estado capitalista</text>
<text class="sv-t2" x="22" y="60" style="font-size:12px;letter-spacing:0">sobre la sociedad: ofensiva jurídica</text>
<text class="sv-t2" x="22" y="74" style="font-size:12px;letter-spacing:0">gradual, policía militarizada.</text>
<text class="sv-t2" x="22" y="88" style="font-size:12px;letter-spacing:0">Respuesta de la burguesía en crisis</text>
<text class="sv-t2" x="22" y="102" style="font-size:12px;letter-spacing:0">de acumulación: «mantener el orden».</text>
<rect class="sv-box-green" rx="2" x="264" y="22" width="120" height="34"/>
<text class="sv-tgr" x="324" y="36" text-anchor="middle">Zanahoria</text>
<text class="sv-t2" x="324" y="50" text-anchor="middle">políticas sociales</text>
<rect class="sv-box-red" rx="2" x="404" y="62" width="120" height="34"/>
<text class="sv-tr" x="464" y="76" text-anchor="middle">Palo</text>
<text class="sv-t2" x="464" y="90" text-anchor="middle">castigo · represión</text>
<line class="sv-line" x1="324" y1="60" x2="464" y2="100"/>
<path class="sv-box-ink" d="M394 82 L382 106 L406 106 z"/>
<text class="sv-t3" x="394" y="122" text-anchor="middle">crisis de acumulación →</text>
<text class="sv-t3" x="394" y="136" text-anchor="middle">el fiel se inclina hacia el castigo</text>
<text class="sv-t2" x="394" y="153" text-anchor="middle" style="font-size:12px;letter-spacing:0">concesiones cuando el orden peligra,</text>
<text class="sv-t2" x="394" y="167" text-anchor="middle" style="font-size:12px;letter-spacing:0">castigo en el declive económico</text>
<rect class="sv-soft" rx="2" x="536" y="12" width="212" height="100"/>
<text class="sv-t3" x="546" y="29">CORRELATO IDEOLÓGICO</text>
<text class="sv-t2" x="546" y="46" style="font-size:12px;letter-spacing:0">concesión y castigo: dos caras</text>
<text class="sv-t2" x="546" y="60" style="font-size:12px;letter-spacing:0">de la misma moneda.</text>
<text class="sv-t2" x="546" y="74" style="font-size:12px;letter-spacing:0">Fetichismo jurídico vs. origen</text>
<text class="sv-t2" x="546" y="88" style="font-size:12px;letter-spacing:0">social de toda categoría: la</text>
<text class="sv-t2" x="546" y="102" style="font-size:12px;letter-spacing:0">delincuencia tiene raíces sociales.</text>
<text class="sv-t3" x="20" y="196">REFORMAS PENALES 1973-2023 · en versalitas, el contexto desencadenante</text>
<line class="sv-line" x1="20" y1="296" x2="744" y2="296" marker-end="url(#m4-4-arrow)"/>
<circle class="sv-dot" cx="108" cy="296" r="5"/>
<text class="sv-t" x="108" y="314" text-anchor="middle">1973</text>
<line class="sv-line-dash" x1="108" y1="318" x2="108" y2="322"/>
<rect class="sv-box" rx="2" x="20" y="322" width="176" height="78"/>
<text class="sv-t" x="108" y="340" text-anchor="middle">CP franquista</text>
<text class="sv-t2" x="108" y="354" text-anchor="middle" style="font-size:12px;letter-spacing:0">vigente hasta 1996</text>
<text class="sv-t2" x="108" y="367" text-anchor="middle" style="font-size:12px;letter-spacing:0">Ley Penitenciaria: individualiza</text>
<text class="sv-t2" x="108" y="380" text-anchor="middle" style="font-size:12px;letter-spacing:0">a los presos</text>
<text class="sv-t3" x="108" y="394" text-anchor="middle" style="font-size:11px;letter-spacing:0">Transición</text>
<circle class="sv-dot" cx="200" cy="296" r="5"/>
<text class="sv-t" x="200" y="314" text-anchor="middle">1983</text>
<line class="sv-line-dash" x1="200" y1="284" x2="200" y2="290"/>
<rect class="sv-box" rx="2" x="112" y="206" width="176" height="78"/>
<text class="sv-t" x="200" y="224" text-anchor="middle">Reforma parcial</text>
<text class="sv-t2" x="200" y="238" text-anchor="middle" style="font-size:12px;letter-spacing:0">LO 8/1983, anticipo del CP</text>
<text class="sv-t2" x="200" y="251" text-anchor="middle" style="font-size:12px;letter-spacing:0">medidas progresistas</text>
<text class="sv-t2" x="200" y="264" text-anchor="middle" style="font-size:12px;letter-spacing:0">desmontadas por la «mano dura»</text>
<text class="sv-t3" x="200" y="278" text-anchor="middle" style="font-size:11px;letter-spacing:0">fin de la Transición</text>
<circle class="sv-dot" cx="292" cy="296" r="5"/>
<text class="sv-t" x="292" y="314" text-anchor="middle">1995</text>
<line class="sv-line-dash" x1="292" y1="318" x2="292" y2="322"/>
<rect class="sv-box-red" rx="2" x="204" y="322" width="176" height="78"/>
<text class="sv-tr" x="292" y="340" text-anchor="middle" style="font-size:13px;letter-spacing:0">Nuevo CP (LO 10/1995)</text>
<text class="sv-t2" x="292" y="354" text-anchor="middle" style="font-size:12px;letter-spacing:0">Libro I humanizador vs. parte</text>
<text class="sv-t2" x="292" y="367" text-anchor="middle" style="font-size:12px;letter-spacing:0">especial de «tolerancia cero»</text>
<text class="sv-t2" x="292" y="380" text-anchor="middle" style="font-size:12px;letter-spacing:0">más represor que el de 1973</text>
<text class="sv-t3" x="292" y="394" text-anchor="middle" style="font-size:11px;letter-spacing:0">fin de la Guerra Fría</text>
<circle class="sv-dot" cx="384" cy="296" r="5"/>
<text class="sv-t" x="384" y="314" text-anchor="middle">2003</text>
<line class="sv-line-dash" x1="384" y1="284" x2="384" y2="290"/>
<rect class="sv-box" rx="2" x="296" y="206" width="176" height="78"/>
<text class="sv-t" x="384" y="224" text-anchor="middle">LO 15/2003</text>
<text class="sv-t2" x="384" y="238" text-anchor="middle" style="font-size:12px;letter-spacing:0">prisión mínima de 6 a 3 meses</text>
<text class="sv-t2" x="384" y="251" text-anchor="middle" style="font-size:12px;letter-spacing:0">más conductas leves pasan</text>
<text class="sv-t2" x="384" y="264" text-anchor="middle" style="font-size:12px;letter-spacing:0">a la vía penal</text>
<text class="sv-t3" x="384" y="278" text-anchor="middle" style="font-size:11px;letter-spacing:0">post-11S · Patriot Act</text>
<circle class="sv-dot" cx="476" cy="296" r="5"/>
<text class="sv-t" x="476" y="314" text-anchor="middle">2015</text>
<line class="sv-line-dash" x1="476" y1="318" x2="476" y2="322"/>
<rect class="sv-box-red" rx="2" x="388" y="322" width="176" height="78"/>
<text class="sv-tr" x="476" y="340" text-anchor="middle" style="font-size:13px;letter-spacing:0">LO 1/2015 + Ley Mordaza</text>
<text class="sv-t2" x="476" y="354" text-anchor="middle" style="font-size:12px;letter-spacing:0">252 artículos modificados</text>
<text class="sv-t2" x="476" y="367" text-anchor="middle" style="font-size:12px;letter-spacing:0">prisión permanente revisable</text>
<text class="sv-t2" x="476" y="380" text-anchor="middle" style="font-size:12px;letter-spacing:0">la policía, «juez y verdugo»</text>
<text class="sv-t3" x="476" y="394" text-anchor="middle" style="font-size:11px;letter-spacing:0">crisis 2008 · protestas (15M)</text>
<circle class="sv-dot" cx="568" cy="296" r="5"/>
<text class="sv-t" x="568" y="314" text-anchor="middle">2022</text>
<line class="sv-line-dash" x1="568" y1="284" x2="568" y2="290"/>
<rect class="sv-box" rx="2" x="480" y="206" width="176" height="78"/>
<text class="sv-t" x="568" y="224" text-anchor="middle">Sedición fuera</text>
<text class="sv-t2" x="568" y="238" text-anchor="middle" style="font-size:12px;letter-spacing:0">LO 14/2022: malversación sin</text>
<text class="sv-t2" x="568" y="251" text-anchor="middle" style="font-size:12px;letter-spacing:0">enriquecimiento rebajada</text>
<text class="sv-t2" x="568" y="264" text-anchor="middle" style="font-size:12px;letter-spacing:0">desórdenes agravados: 5 años</text>
<text class="sv-t3" x="568" y="278" text-anchor="middle" style="font-size:11px;letter-spacing:0">procés · feminismo</text>
<circle class="sv-dot" cx="660" cy="296" r="5"/>
<text class="sv-t" x="660" y="314" text-anchor="middle">2023</text>
<line class="sv-line-dash" x1="660" y1="318" x2="660" y2="322"/>
<rect class="sv-box-gold" rx="2" x="572" y="322" width="176" height="78"/>
<text class="sv-tg" x="660" y="340" text-anchor="middle">Ley de Amnistía</text>
<text class="sv-t2" x="660" y="354" text-anchor="middle" style="font-size:12px;letter-spacing:0">perdona los delitos del procés</text>
<text class="sv-t2" x="660" y="367" text-anchor="middle" style="font-size:12px;letter-spacing:0">la ley como producto</text>
<text class="sv-t2" x="660" y="380" text-anchor="middle" style="font-size:12px;letter-spacing:0">de la correlación de fuerzas</text>
<text class="sv-t3" x="660" y="394" text-anchor="middle" style="font-size:11px;letter-spacing:0">procés</text>
<rect class="sv-soft" rx="2" x="12" y="416" width="736" height="52"/>
<text class="sv-t3" x="22" y="433">CONCLUSIÓN</text>
<text class="sv-t2" x="22" y="449" style="font-size:12px;letter-spacing:0">El castigo es el funcionamiento normal del Estado capitalista, no una anomalía: se expande en las crisis con leyes simbólicas e ineficaces.</text>
<text class="sv-t2" x="22" y="463" style="font-size:12px;letter-spacing:0">Las leyes son productos de la correlación de fuerzas: la lucha por los mínimos derechos políticos se une a la conquista de derechos plenos.</text>
</svg>
