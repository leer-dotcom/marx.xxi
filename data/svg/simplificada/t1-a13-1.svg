<svg xmlns="http://www.w3.org/2000/svg" aria-label="Marco superior: la relación orgánica entre capital y Estado (Estado político separado, Artous). Cadena causal en dos niveles. Nivel global: acumulación mundial, centro y periferia, transferencia de valor al centro, imposibilidad de compensar con productividad, superexplotación y profundización neoliberal. Nivel de la ciudadanía: ciudadanía marshalliana, neoliberalización, despojo de derechos sociales con deuda e individuación, derechos civiles y políticos formales y anticiudadanía. Una flecha de salida apunta a la ciudadanía sustantiva centrada en lo común. Leyenda de líneas al pie." role="img" viewBox="0 0 760 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-13-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="52" rx="2" width="720" x="20" y="18"></rect>
<text class="sv-t" x="30" y="40">MARCO · LA RELACIÓN ORGÁNICA ENTRE CAPITAL Y ESTADO</text>
<text class="sv-t2" style="font-size:12px" x="30" y="58">«Estado político separado» fundado en la ciudadanía igualitaria (Artous); centro–periferia mediados por Estados (Salama)</text>
<text class="sv-t3" x="20" y="90">NIVEL GLOBAL: LA DEPENDENCIA</text>
<rect class="sv-box" height="60" rx="2" width="220" x="20" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="122">Acumulación a escala mundial</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="138">constituye Estados-nación centrales</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="152">y periféricos a la vez</text>
<rect class="sv-box" height="60" rx="2" width="220" x="270" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="122">Centro / periferia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="138">unidad diferenciada (Osorio):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="152">capitalismo desarrollado y dependiente</text>
<rect class="sv-box-gold" height="60" rx="2" width="220" x="520" y="100"></rect>
<text class="sv-tg" text-anchor="middle" x="630" y="122">Transferencia de valor</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="138">al centro (intercambio desigual):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="152">plusvalor de la periferia al centro</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="240" x2="270" y1="130" y2="130"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="490" x2="520" y1="130" y2="130"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="630" x2="630" y1="160" y2="188"></line>
<rect class="sv-box" height="60" rx="2" width="220" x="520" y="188"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="210">No puede compensar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="226">baja composición orgánica:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="240">no cabe elevar la productividad</text>
<rect class="sv-box-red" height="60" rx="2" width="220" x="270" y="188"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="210">Superexplotación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="226">jornada, intensidad, salario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="240">bajo el valor; ejército de reserva</text>
<rect class="sv-box" height="60" rx="2" width="220" x="20" y="188"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="210">El neoliberalismo la profundiza</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="226">privatización, reprimarización,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="240">financiarización, precarización</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="520" x2="490" y1="218" y2="218"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="270" x2="240" y1="218" y2="218"></line>
<path class="sv-line-dash" marker-end="url(#m1-13-arrow)" d="M130 248 V272 H380 V300"></path>
<text class="sv-t3" x="140" y="266">restauración del poder de clase</text>
<text class="sv-t3" x="20" y="292">NIVEL DE LA CIUDADANÍA</text>
<rect class="sv-box-blue" height="60" rx="2" width="220" x="20" y="300"></rect>
<text class="sv-tb" text-anchor="middle" x="130" y="322">Ciudadanía marshalliana</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="338">1930-1970: derechos sociales,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="352">pero reafirma la lógica del capital</text>
<rect class="sv-box" height="60" rx="2" width="220" x="270" y="300"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="322">Neoliberalización</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="338">desde 1973 (Harvey, Garretón):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="352">Estado mínimo para los subalternos</text>
<rect class="sv-box" height="60" rx="2" width="220" x="520" y="300"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="322">Despojo + deuda + individuación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="338">empresario de sí (Lazzarato);</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="352">«todos son deudores»</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="240" x2="270" y1="330" y2="330"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="490" x2="520" y1="330" y2="330"></line>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="630" x2="630" y1="360" y2="388"></line>
<rect class="sv-box" height="60" rx="2" width="220" x="520" y="388"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="410">Derechos civiles y políticos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="426">formales sin los sociales:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="440">regresión respecto a Marshall</text>
<rect class="sv-box-red" height="60" rx="2" width="220" x="270" y="388"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="410">Anticiudadanía</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="426">incompatible con el liberalismo;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="440">Estados periféricos, engranaje</text>
<rect class="sv-box-green" height="60" rx="2" width="220" x="20" y="388"></rect>
<text class="sv-tgr" text-anchor="middle" x="130" y="410">Ciudadanía sustantiva</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="426">interdependencia en lo común;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="440">por construir, fuera del capital</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="520" x2="490" y1="418" y2="418"></line>
<line class="sv-line-red" marker-end="url(#m1-13-arrow)" x1="270" x2="240" y1="418" y2="418"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="474">salida: fuera de la lógica del intercambio y de la propiedad estatal, desde el sur</text>
<line class="sv-line" marker-end="url(#m1-13-arrow)" x1="20" x2="48" y1="498" y2="498"></line>
<text class="sv-t3" x="56" y="502">encadenamiento causal</text>
<line class="sv-line-dash" marker-end="url(#m1-13-arrow)" x1="250" x2="278" y1="498" y2="498"></line>
<text class="sv-t3" x="286" y="502">del nivel global al de la ciudadanía</text>
<line class="sv-line-red" marker-end="url(#m1-13-arrow)" x1="550" x2="578" y1="498" y2="498"></line>
<text class="sv-t3" x="586" y="502">salida fuera del capital</text>
</svg>
