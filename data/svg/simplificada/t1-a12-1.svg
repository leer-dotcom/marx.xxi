<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: lo real como intimidación, la economía como su saber y el realismo capitalista, con la caverna de Platón. Debajo, diagrama en capas tipo máscara sobre lo real: el emblema democrático, el semblante de la democracia parlamentaria (orientaciones, gran centro blando, voto del miedo, endogamia democrática) y el real capitalista. Una flecha vertical, el acontecimiento que divide el semblante, atraviesa las capas y conduce a un recuadro de salida: la hipótesis comunista, con sus elementos, su sujeto, el aristocratismo para todos, un solo mundo y la democracia como igualdad." role="img" viewBox="0 0 760 408" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-12-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="52" rx="2" width="720" x="20" y="18"></rect>
<text class="sv-t" x="30" y="40">PUNTO DE PARTIDA · LO REAL COMO INTIMIDACIÓN</text>
<text class="sv-t2" style="font-size:12px" x="30" y="58">lo real se impone; la economía detenta su saber; realismo capitalista (Fisher): no se imagina alternativa; caverna de Platón</text>
<rect class="sv-box-gold" height="70" rx="2" width="470" x="20" y="90"></rect>
<text class="sv-tg" x="30" y="112">CAPA 1 · EMBLEMA DEMOCRÁTICO</text>
<text class="sv-t2" x="30" y="132">lo intocable del sistema simbólico; legitima todo en su nombre;</text>
<text class="sv-t2" x="30" y="148">demócrata egoísta, juventud eterna, «opinión autoritaria»</text>
<rect class="sv-box-blue" height="86" rx="2" width="470" x="20" y="176"></rect>
<text class="sv-tb" x="30" y="198">CAPA 2 · SEMBLANTE: DEMOCRACIA PARLAMENTARIA</text>
<text class="sv-t2" x="30" y="218">alternancia dentro del capital: cuatro orientaciones, «gran centro blando»;</text>
<text class="sv-t2" x="30" y="234">voto del miedo: el miedo valida al Estado; el canalla es el otro;</text>
<text class="sv-t2" x="30" y="250">endogamia: «un demócrata quiere únicamente a otro demócrata»</text>
<rect class="sv-box-ink" height="70" rx="2" width="470" x="20" y="278"></rect>
<text class="sv-tw" x="30" y="300">CAPA 3 · REAL CAPITALISTA</text>
<text class="sv-tw" x="30" y="320">negocios e intereses, no buenas intenciones; saqueo imperial;</text>
<text class="sv-tw" x="30" y="336">«democracia imaginaria»: obra que el capital interpreta</text>
<line class="sv-line-red" marker-end="url(#m1-12-arrow)" x1="520" x2="520" y1="348" y2="98"></line>
<text class="sv-tr" text-anchor="middle" x="520" y="376">acontecimiento político (no falsa división):</text>
<text class="sv-t2" text-anchor="middle" x="520" y="392">dividir el semblante, arrancar la máscara</text>
<line class="sv-line-red" marker-end="url(#m1-12-arrow)" x1="520" x2="550" y1="219" y2="219"></line>
<rect class="sv-box-green" height="232" rx="2" width="190" x="550" y="90"></rect>
<text class="sv-tgr" text-anchor="middle" x="645" y="114">Hipótesis comunista</text>
<text class="sv-t2" text-anchor="middle" x="645" y="138">fin del capitalismo</text>
<text class="sv-t2" text-anchor="middle" x="645" y="154">desprivatizar la producción</text>
<text class="sv-t2" text-anchor="middle" x="645" y="170">extinción del Estado</text>
<text class="sv-t2" text-anchor="middle" x="645" y="186">fin de la división</text>
<text class="sv-t2" text-anchor="middle" x="645" y="200">manual / intelectual</text>
<text class="sv-t2" text-anchor="middle" x="645" y="222">sujeto no prefijado,</text>
<text class="sv-t2" text-anchor="middle" x="645" y="236">internacionalista</text>
<text class="sv-t2" text-anchor="middle" x="645" y="258">aristocratismo para todos</text>
<text class="sv-t2" text-anchor="middle" x="645" y="280">«existe un solo mundo»</text>
<text class="sv-t2" text-anchor="middle" x="645" y="302">democracia = igualdad</text>
</svg>
