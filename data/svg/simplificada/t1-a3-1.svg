<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la tesis de Sanjuán (separación entre orden lógico-sistemático e historiográfico) y el movimiento de Barcina. Matriz de dos por dos que cruza el método (reflejo especular o cesura kantiana frente a mediación) con la historicidad del capital (exterior o interior); el materialismo vulgar y el dualismo de Sanjuán comparten la negación de la praxis, y la dialéctica mínima de Barcina ocupa el cuadrante de mediación y límite interior. Debajo, por qué mediación (Hegel, Mito de lo Dado, determinación formal), el círculo de la acumulación originaria y las dos lecturas de ese capítulo." role="img" viewBox="0 0 760 646" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: LA TESIS DE SANJUÁN Y EL MOVIMIENTO DE BARCINA</text>
<rect class="sv-soft" height="48" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="42">Sanjuán: separación tajante entre orden lógico-sistemático y orden historiográfico; la acumulación originaria rompe el «círculo vicioso».</text>
<text class="sv-t2" style="font-size:12px" x="30" y="60">Barcina: acepta reconstruir «la formulación coherente» y la vuelve contra Sanjuán: negar la separación abstracta → mediación.</text>
<text class="sv-t3" x="140" y="96">MÉTODO →</text>
<text class="sv-t" text-anchor="middle" x="290" y="112">Reflejo especular / cesura kantiana</text>
<text class="sv-t" text-anchor="middle" x="600" y="112">Mediación forma-contenido, sistema-historia</text>
<text class="sv-t3" x="15" y="185">HISTORICIDAD</text>
<text class="sv-t2" x="15" y="201">exterior al capital</text>
<text class="sv-t3" x="15" y="333">HISTORICIDAD</text>
<text class="sv-t2" x="15" y="349">interior al capital</text>
<rect class="sv-soft" height="138" rx="2" width="300" x="140" y="120"></rect>
<rect class="sv-soft" height="138" rx="2" width="300" x="450" y="120"></rect>
<rect class="sv-soft" height="138" rx="2" width="300" x="140" y="268"></rect>
<rect class="sv-soft" height="138" rx="2" width="300" x="450" y="268"></rect>
<rect class="sv-box" height="78" rx="2" width="135" x="150" y="130"></rect>
<text class="sv-t" text-anchor="middle" x="217" y="148" style="font-size:13.4px;letter-spacing:0">Materialismo vulgar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="217" y="165">primacía de las</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="217" y="179">fuerzas productivas;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="217" y="193">deshistoriza la forma</text>
<rect class="sv-box" height="78" rx="2" width="135" x="295" y="130"></rect>
<text class="sv-t" text-anchor="middle" x="362" y="148" style="font-size:12.8px;letter-spacing:0">Dualismo de Sanjuán</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="362" y="165">cesura kantiana;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="362" y="179">superación como</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="362" y="193">contingencia arbitraria</text>
<rect class="sv-box-red" height="36" rx="2" width="280" x="150" y="214"></rect>
<text class="sv-tr" text-anchor="middle" x="290" y="230">comparten: negación</text>
<text class="sv-tr" text-anchor="middle" x="290" y="245">de la praxis revolucionaria</text>
<rect class="sv-line-dash" height="120" rx="2" width="280" x="460" y="130"></rect>
<text class="sv-t2" text-anchor="middle" x="600" y="180">cuadrante inconsistente:</text>
<text class="sv-t2" text-anchor="middle" x="600" y="196">la mediación deriva el límite</text>
<text class="sv-t2" text-anchor="middle" x="600" y="212">de la lógica interna del capital</text>
<rect class="sv-line-dash" height="120" rx="2" width="280" x="150" y="278"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="328">cuadrante inconsistente:</text>
<text class="sv-t2" text-anchor="middle" x="290" y="344">el reflejo introduce</text>
<text class="sv-t2" text-anchor="middle" x="290" y="360">la transitoriedad ad hoc</text>
<rect class="sv-box-green" height="120" rx="2" width="280" x="460" y="278"></rect>
<text class="sv-tgr" text-anchor="middle" x="600" y="300">Dialéctica mínima (Barcina)</text>
<text class="sv-t2" text-anchor="middle" x="600" y="320">el capital produce y reproduce</text>
<text class="sv-t2" text-anchor="middle" x="600" y="335">los supuestos de su superación:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="600" y="351">antagonismo de clase, límite histórico interior</text>
<text class="sv-t" text-anchor="middle" x="600" y="378">→ teoría revolucionaria</text>
<rect class="sv-soft" height="46" rx="2" width="720" x="20" y="420"></rect>
<text class="sv-t3" x="30" y="437">POR QUÉ MEDIACIÓN: LA CRÍTICA EPISTEMOLÓGICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="454">Hegel: no hay inmediatez sin mediación conceptual («Mito de lo Dado»); determinación formal: las formas engendran su propio contenido.</text>
<text class="sv-t3" x="20" y="490">LA ACUMULACIÓN ORIGINARIA COMO CÍRCULO (AUFHEBUNG)</text>
<rect class="sv-box" height="44" rx="2" width="200" x="20" y="500"></rect>
<text class="sv-t" text-anchor="middle" x="120" y="518">Presupuestos</text>
<text class="sv-t2" text-anchor="middle" x="120" y="533">trabajador / condiciones objetivas</text>
<rect class="sv-box" height="44" rx="2" width="200" x="280" y="500"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="518">Resultados</text>
<text class="sv-t2" text-anchor="middle" x="380" y="533">reproducción de la relación</text>
<rect class="sv-box-blue" height="44" rx="2" width="200" x="540" y="500"></rect>
<text class="sv-tb" text-anchor="middle" x="640" y="518">Presupuestos ampliados</text>
<text class="sv-t2" text-anchor="middle" x="640" y="533">conservados y cancelados</text>
<line class="sv-line" marker-end="url(#m1-3-arrow)" x1="220" x2="280" y1="522" y2="522"></line>
<line class="sv-line" marker-end="url(#m1-3-arrow)" x1="480" x2="540" y1="522" y2="522"></line>
<path class="sv-line-red" d="M640 544 V568 H120 V546" marker-end="url(#m1-3-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="581">reproducción ampliada</text>
<rect class="sv-soft" height="46" rx="2" width="720" x="20" y="592"></rect>
<text class="sv-t3" x="30" y="609">DOS LECTURAS DEL CAPÍTULO</text>
<text class="sv-t2" style="font-size:12px" x="30" y="626">Sanjuán: sólo «explicita los presupuestos fácticos». Barcina: cancelar (Aufhebung) es también conservar y reproducir ampliadamente.</text>
</svg>
