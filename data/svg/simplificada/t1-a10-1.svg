<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la derrota del ciclo revolucionario del siglo XX (giro de los setenta, contrarrevolución conservadora, caída de la URSS) desemboca en el nodo negro de derrota histórica y posmodernidad. De él parten tres caminos: a la izquierda la vía positiva de los movimientos parciales y las organizaciones comunistas reformistas; a la derecha la vía negativa vulgar de la reacción y los rojipardos; ambas desembocan en un callejón sin salida que reproduce las dinámicas posmodernas. En el centro, la tercera postura atraviesa y supera la posmodernidad hacia un nuevo movimiento comunista construido desde abajo. Abajo, las premisas de ese potencial bloque y la leyenda." role="img" viewBox="0 0 760 518" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-10-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="52" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="34">Derrota del ciclo revolucionario del siglo XX</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="52">giro de los setenta, «contrarrevolución conservadora», caída de la URSS: el capitalismo aparece como invencible</text>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="66" y2="84"></line>
<rect class="sv-box-ink" height="52" rx="2" width="340" x="210" y="84"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="106">DERROTA HISTÓRICA → POSMODERNIDAD</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="380" y="124">modernidad cansada, crisis de los metarrelatos</text>
<path class="sv-line" d="M380 136 V156 H130 V176" marker-end="url(#m1-10-arrow)"></path>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="136" y2="176"></line>
<path class="sv-line" d="M380 136 V156 H630 V176" marker-end="url(#m1-10-arrow)"></path>
<rect class="sv-box" height="80" rx="2" width="220" x="20" y="176"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="198">Vía positiva</text>
<text class="sv-t2" text-anchor="middle" x="130" y="216">movimientos parciales;</text>
<text class="sv-t2" text-anchor="middle" x="130" y="231">organizaciones reformistas:</text>
<text class="sv-t2" text-anchor="middle" x="130" y="246">economicismo, burocracia</text>
<rect class="sv-box-green" height="80" rx="2" width="220" x="270" y="176"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="198">Tercera postura</text>
<text class="sv-t2" text-anchor="middle" x="380" y="216">comprender la posmodernidad,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="231">atravesarla y superarla;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="246">recuperar la totalidad</text>
<rect class="sv-box" height="80" rx="2" width="220" x="520" y="176"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="198">Vía negativa vulgar</text>
<text class="sv-t2" text-anchor="middle" x="630" y="216">reacción y «rojipardos»:</text>
<text class="sv-t2" text-anchor="middle" x="630" y="231">nostalgia, nación, familia,</text>
<text class="sv-t2" text-anchor="middle" x="630" y="246">Estado fuerte</text>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="130" x2="130" y1="256" y2="290"></line>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="380" x2="380" y1="256" y2="290"></line>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="630" x2="630" y1="256" y2="290"></line>
<rect class="sv-box-red" height="56" rx="2" width="220" x="20" y="290"></rect>
<text class="sv-tr" text-anchor="middle" x="130" y="312">Callejón sin salida</text>
<text class="sv-t2" text-anchor="middle" x="130" y="330">actor secundario del capital</text>
<rect class="sv-box-red" height="56" rx="2" width="220" x="520" y="290"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="312">Callejón sin salida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="330">reproduce las dinámicas posmodernas</text>
<line class="sv-line-dash" x1="240" x2="270" y1="318" y2="318"></line>
<line class="sv-line-dash" x1="490" x2="520" y1="318" y2="318"></line>
<rect class="sv-box-green" height="56" rx="2" width="220" x="270" y="290"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="312">Nuevo movimiento comunista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="330">bloque construido desde abajo</text>
<text class="sv-t3" text-anchor="middle" x="380" y="372">ambas vías laterales reproducen la posmodernidad; sólo la central la atraviesa</text>
<rect class="sv-soft" height="98" rx="2" width="720" x="20" y="386"></rect>
<text class="sv-t3" x="30" y="404">PREMISAS DEL POTENCIAL BLOQUE (TERCERA POSTURA)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="422">· reelaborar el marxismo desde sus propias bases (universalidad, totalidad, sujeto revolucionario)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="437">· proletariado universal y heterogéneo: igualdad de las opresiones, raíz común en la sociedad de clases</text>
<text class="sv-t2" style="font-size:12px" x="30" y="452">· asumir la derrota del ciclo del siglo XX y criticar sus experiencias; situarse en el capitalismo tardío</text>
<text class="sv-t2" style="font-size:12px" x="30" y="467">· recuperar el internacionalismo frente al repliegue nacional: espacios comunes desde abajo</text>
<line class="sv-line-red" marker-end="url(#m1-10-arrow)" x1="20" x2="48" y1="504" y2="504"></line>
<text class="sv-t3" x="56" y="508">vía que atraviesa la posmodernidad</text>
<line class="sv-line" marker-end="url(#m1-10-arrow)" x1="360" x2="388" y1="504" y2="504"></line>
<text class="sv-t3" x="396" y="508">vías que se cierran</text>
<line class="sv-line-dash" x1="590" x2="618" y1="504" y2="504"></line>
<text class="sv-t3" x="626" y="508">mismo callejón</text>
</svg>
