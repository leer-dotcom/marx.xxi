<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la metáfora del tenedor y la sopa: la utilidad de la socialdemocracia depende de las condiciones históricas. Curva en arco de la acumulación en el tiempo: en la pendiente ascendente, la socialdemocracia como etapa hacia el comunismo (argumento 2); en la cima, la contradicción en movimiento; en la descendente, la gestión pragmática del capitalismo sin crecimiento (argumento 1) sobre una zona sombreada de devastación ecológica; los dos argumentos no coinciden en el tiempo. Abajo, la socialdemocracia de la desacumulación como contrapeso parcial y débil, y la devastación ecológica que no puede deshacer: superar, no gestionar" role="img" viewBox="0 0 760 544" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-13-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="12"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="29" style="font-size:11px">La metáfora: los tenedores no tienen nada de malo… hasta que te sirven sopa</text>
<text class="sv-t2" text-anchor="middle" x="380" y="46" style="font-size:11.5px">la utilidad de la socialdemocracia depende de las condiciones históricas: en ciertas situaciones, peor que inútil</text>
<path class="sv-soft" d="M560 400 L740 400 L740 330 Z"></path>
<line class="sv-line" marker-end="url(#m2-13-arrow)" x1="40" x2="740" y1="420" y2="420"></line>
<line class="sv-line" marker-end="url(#m2-13-arrow)" x1="40" x2="40" y1="420" y2="64"></line>
<text class="sv-t3" text-anchor="start" x="50" y="80">acumulación / valor</text>
<text class="sv-t3" text-anchor="start" x="48" y="438">tiempo</text>
<path class="sv-line-red" d="M60 400 Q380 -100 700 400"></path>
<circle class="sv-dot" cx="380" cy="150" r="5"></circle>
<circle class="sv-dot" cx="700" cy="400" r="5"></circle>
<rect class="sv-box-gold" height="62" rx="2" width="350" x="205" y="68"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="88">Contradicción en movimiento (Grundrisse)</text>
<text class="sv-t3" text-anchor="middle" x="380" y="104">la expansión produce su propio fin</text>
<text class="sv-t2" text-anchor="middle" x="380" y="121" style="font-size:11.5px">la era del movimiento obrero se desvanece al descender el arco</text>
<text class="sv-t3" text-anchor="end" x="750" y="160">los dos argumentos son incompatibles:</text>
<text class="sv-t3" text-anchor="end" x="750" y="174">no coinciden en el tiempo:</text>
<text class="sv-tr" text-anchor="end" x="750" y="192">hay que elegir</text>
<rect class="sv-box-blue" height="92" rx="2" width="210" x="170" y="270"></rect>
<text class="sv-tb" text-anchor="middle" x="275" y="290">Argumento 2: etapa hacia</text>
<text class="sv-tb" text-anchor="middle" x="275" y="306">el comunismo</text>
<text class="sv-t2" text-anchor="middle" x="275" y="322" style="font-size:11.5px">la clase toma conciencia y poder</text>
<text class="sv-t2" text-anchor="middle" x="275" y="336" style="font-size:11.5px">(movimiento obrero industrial)</text>
<text class="sv-t3" text-anchor="middle" x="275" y="353">fase ascendente del arco</text>
<rect class="sv-box-red" height="92" rx="2" width="210" x="385" y="270"></rect>
<text class="sv-tr" text-anchor="middle" x="490" y="290">Argumento 1: gestión pragmática</text>
<text class="sv-tr" text-anchor="middle" x="490" y="306">del capitalismo sin crecimiento</text>
<text class="sv-t2" text-anchor="middle" x="490" y="322" style="font-size:11.5px">planificación: «producción capitalista</text>
<text class="sv-t2" text-anchor="middle" x="490" y="336" style="font-size:11.5px">sin capitalistas»; hoy: desacumulación</text>
<text class="sv-t3" text-anchor="middle" x="490" y="353">fase descendente del arco</text>
<text class="sv-tr" text-anchor="end" x="690" y="394">devastación ecológica</text>
<rect class="sv-box" height="78" rx="2" width="350" x="20" y="452"></rect>
<text class="sv-t" text-anchor="middle" x="195" y="474">La socialdemocracia de la desacumulación</text>
<text class="sv-t2" text-anchor="middle" x="195" y="491" style="font-size:11.5px">contrapeso parcial a la miseria del trabajo y del no-trabajo</text>
<text class="sv-t2" text-anchor="middle" x="195" y="506" style="font-size:11.5px">débil: adjunto de un capitalismo débil, sin recursos</text>
<text class="sv-t3" text-anchor="middle" x="195" y="523">«solución cuantitativa a un problema cualitativo»</text>
<rect class="sv-box-red" height="78" rx="2" width="350" x="390" y="452"></rect>
<text class="sv-tr" text-anchor="middle" x="565" y="474">Devastación ecológica y salida</text>
<text class="sv-t2" text-anchor="middle" x="565" y="491" style="font-size:11.5px">pervive como técnica de gestión, no como poder social</text>
<text class="sv-t3" text-anchor="middle" x="565" y="507">es un tenedor ante un plato de sopa</text>
<text class="sv-tr" text-anchor="middle" x="565" y="524">superar, no gestionar</text>
</svg>
