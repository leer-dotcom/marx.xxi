<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: la lectura de la Tesis XI como primado de la razón práctica y la crítica de Adorno al visado práctico. Tres posiciones sobre la relación entre teoría y praxis: dualismo absoluto del positivismo, identidad inmediata del activismo y, en el centro, la discontinuidad o tensión máxima de Adorno, con una flecha de ida y vuelta entre teoría y praxis verdadera. Dos notas: el respiro de la teoría (la filosofía sigue viva porque se dejó pasar el momento de su realización) y la respuesta al Gran Hotel Abismo (pensar es un hacer; falsa actividad según Žižek). Debajo, la cadena principio de intercambio, pensamiento identificante, pensamiento cosificado y praxis ilusoria, fundada en la identidad como protoforma de la ideología, y la conclusión: sólo en la máxima tensión, praxis dinamizadora y teoría sin engaños." role="img" viewBox="0 0 760 562" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: LA TESIS XI LEÍDA COMO PRIMADO DE LA RAZÓN PRÁCTICA</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">Lectura habitual de la Tesis XI: consumación práctica inmediata de la teoría. Adorno se opone al «visado práctico»:</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">degrada la teoría «al papel de criada»; todo pensamiento tiene un telos práctico, pero no debe imponérsele.</text>
<text class="sv-t3" x="20" y="90">TRES POSICIONES Y UNA TENSIÓN</text>
<rect class="sv-box" height="56" rx="2" width="220" x="20" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="120">Dualismo absoluto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="136">positivismo: teoría y praxis</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="130" y="150">separadas; el mundo como Otro</text>
<rect class="sv-box-green" height="56" rx="2" width="220" x="270" y="100"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="120">Discontinuidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="136">tensión máxima (Adorno):</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="150">no-identidad en la identidad</text>
<rect class="sv-box-red" height="56" rx="2" width="220" x="520" y="100"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="120">Identidad inmediata</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="136">activismo: la teoría como criada;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="150">objetividad constituida por el sujeto</text>
<line class="sv-line-dash" x1="240" x2="270" y1="128" y2="128"></line>
<line class="sv-line-dash" x1="490" x2="520" y1="128" y2="128"></line>
<text class="sv-t2" style="font-size:11.5px" text-anchor="start" x="20" y="178">dualidad e identidad son compatibles</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="start" x="20" y="192">(el objeto como obstáculo a superar)</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="end" x="740" y="178">invertir las tornas no arregla nada:</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="end" x="740" y="192">el divorcio aplaza la consumación</text>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="380" x2="380" y1="156" y2="204"></line>
<rect class="sv-box-blue" height="48" rx="2" width="220" x="130" y="204"></rect>
<text class="sv-tb" text-anchor="middle" x="240" y="224">Teoría</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="240" y="241">figura no idéntica de la praxis</text>
<rect class="sv-box-blue" height="48" rx="2" width="220" x="410" y="204"></rect>
<text class="sv-tb" text-anchor="middle" x="520" y="224">Praxis verdadera</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="520" y="241">analiza las tensiones objetivas</text>
<line class="sv-line-red" marker-end="url(#m1-6-arrow)" marker-start="url(#m1-6-arrow)" x1="350" x2="410" y1="228" y2="228"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="274">la contemplación es un momento de la praxis; pensar es un hacer</text>
<text class="sv-t3" x="20" y="296">POR QUÉ LA TEORÍA TIENE UN «RESPIRO»</text>
<text class="sv-t3" x="390" y="296">CONTRA EL «GRAN HOTEL ABISMO» (LUKÁCS)</text>
<rect class="sv-soft" height="46" rx="2" width="350" x="20" y="304"></rect>
<rect class="sv-soft" height="46" rx="2" width="350" x="390" y="304"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="322">«La filosofía sigue viva porque se dejó pasar el momento</text>
<text class="sv-t2" style="font-size:12px" x="30" y="337">de su realización»: un respiro que es un crimen no aprovechar.</text>
<text class="sv-t2" style="font-size:12px" x="400" y="322">Pensar es un hacer. Žižek: actuar puede ser una manera</text>
<text class="sv-t2" style="font-size:12px" x="400" y="337">de no actuar (falsa actividad del neurótico obsesivo).</text>
<text class="sv-t3" x="20" y="378">CADENA DE CORRESPONDENCIAS · FUNDAMENTO: LA IDENTIDAD ES LA PROTOFORMA DE LA IDEOLOGÍA</text>
<rect class="sv-box" height="60" rx="2" width="160" x="20" y="388"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="408">Principio de</text>
<text class="sv-t" text-anchor="middle" x="100" y="423">intercambio</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="440">iguala lo desigual</text>
<rect class="sv-box" height="60" rx="2" width="160" x="200" y="388"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="408">Pensamiento</text>
<text class="sv-t" text-anchor="middle" x="280" y="423">identificante</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="440">anula las diferencias</text>
<rect class="sv-box-red" height="60" rx="2" width="160" x="380" y="388"></rect>
<text class="sv-tr" text-anchor="middle" x="460" y="408">Pensamiento</text>
<text class="sv-tr" text-anchor="middle" x="460" y="423">cosificado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="440">programa instrumental</text>
<rect class="sv-box-red" height="60" rx="2" width="160" x="580" y="388"></rect>
<text class="sv-tr" text-anchor="middle" x="660" y="410">Praxis ilusoria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="660" y="426">activismo irreflexivo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="660" y="440">que refuerza el hechizo</text>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="180" x2="200" y1="418" y2="418"></line>
<line class="sv-line" marker-end="url(#m1-6-arrow)" x1="360" x2="380" y1="418" y2="418"></line>
<line class="sv-line-red" marker-end="url(#m1-6-arrow)" marker-start="url(#m1-6-arrow)" x1="540" x2="580" y1="418" y2="418"></line>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="380" y="470">la identidad imita la falsa identidad de sujeto y objeto y perpetúa «el principio del sojuzgamiento»</text>
<rect class="sv-box-green" height="48" rx="2" width="720" x="20" y="482"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="502">Sólo en la máxima tensión dialéctica entre teoría y praxis: una praxis dinamizadora y una teoría sin engaños</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="520">«si teoría y praxis no son inmediatamente uno, ni absolutamente distintas, su relación es una relación de discontinuidad»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="552">flecha doble de color: ida y vuelta (tensión) · flecha gris: paso · línea discontinua: polos rechazados</text>
</svg>
