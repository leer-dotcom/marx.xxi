<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, matriz de tres acuerdos compartidos y un desacuerdo entre socialdemocracia y socialismo; en medio, la cadena del primer argumento: socialidad disociada, compulsión M a M prima, capital como valor-en-proceso, subordinación de capitalistas y Estado, reformas decisivas rescindidas o superación; abajo, cadena causal desde la proliferación de sistemas nacionales de innovación hasta el estancamiento secular, que bifurca en barbarie o socialización de la inversión" role="img" viewBox="0 0 760 566" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-9-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="start" x="20" y="22">PUNTO DE PARTIDA · tres acuerdos y un desacuerdo</text>
<rect class="sv-box-red" height="26" rx="2" width="250" x="230" y="30"></rect>
<text class="sv-tr" text-anchor="middle" x="355" y="47">Socialdemocracia</text>
<rect class="sv-box-blue" height="26" rx="2" width="250" x="490" y="30"></rect>
<text class="sv-tb" text-anchor="middle" x="615" y="47">Socialismo</text>
<rect class="sv-soft" height="26" rx="2" width="200" x="20" y="62"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="79">1. florecimiento humano parcial</text>
<rect class="sv-box" height="26" rx="2" width="510" x="230" y="62"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="79">acuerdo: el capitalismo lo impulsó</text>
<rect class="sv-soft" height="26" rx="2" width="200" x="20" y="92"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="109">2. limitado y precario</text>
<rect class="sv-box" height="26" rx="2" width="510" x="230" y="92"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="109">acuerdo: recursos para el beneficio privado</text>
<rect class="sv-soft" height="26" rx="2" width="200" x="20" y="122"></rect>
<text class="sv-t2" text-anchor="middle" x="120" y="139">3. imperativo de un mundo mejor</text>
<rect class="sv-box" height="26" rx="2" width="510" x="230" y="122"></rect>
<text class="sv-t2" text-anchor="middle" x="485" y="139">acuerdo: florecimiento más allá del capitalismo</text>
<rect class="sv-soft" height="44" rx="2" width="200" x="20" y="152"></rect>
<text class="sv-t" text-anchor="middle" x="120" y="171">4. los defectos son…</text>
<text class="sv-t3" text-anchor="middle" x="120" y="187">el desacuerdo</text>
<rect class="sv-box-red" height="44" rx="2" width="250" x="230" y="152"></rect>
<text class="sv-t2" text-anchor="middle" x="355" y="171">remediables con regulación</text>
<text class="sv-t3" text-anchor="middle" x="355" y="187">codeterminación, renta mínima…</text>
<rect class="sv-box-blue" height="44" rx="2" width="250" x="490" y="152"></rect>
<text class="sv-t2" text-anchor="middle" x="615" y="171">intrínsecos: «features, not bugs»</text>
<text class="sv-t3" text-anchor="middle" x="615" y="187">valorización como fin → superación</text>
<text class="sv-t3" text-anchor="start" x="20" y="226">ARGUMENTO 1 · qué es el capital (El Capital, Marx)</text>
<rect class="sv-box" height="44" rx="2" width="170" x="20" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="253">Socialidad disociada</text>
<text class="sv-t2" text-anchor="middle" x="105" y="269" style="font-size:12px">sin coordinación social</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="190" x2="200" y1="256" y2="256"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="200" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="285" y="253">Compulsión M → M′</text>
<text class="sv-t2" text-anchor="middle" x="285" y="269" style="font-size:12px">valorización como fin</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="370" x2="380" y1="256" y2="256"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="380" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="465" y="253" style="font-size:13px">Capital: valor-en-proceso</text>
<text class="sv-t2" text-anchor="middle" x="465" y="269" style="font-size:12px">poder real sobre el mundo</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="550" x2="560" y1="256" y2="256"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="560" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="645" y="253">Todo subordinado</text>
<text class="sv-t2" text-anchor="middle" x="645" y="269" style="font-size:11.5px">también capitalistas y Estado</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="645" x2="645" y1="278" y2="292"></line>
<rect class="sv-box-ink" height="42" rx="2" width="720" x="20" y="292"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="310" style="font-size:13px">Los males que lamenta la socialdemocracia son rasgos del sistema;</text>
<text class="sv-tw" text-anchor="middle" x="380" y="326" style="font-size:13px">una reforma decisiva se rescinde o se inserta en la superación del capitalismo</text>
<text class="sv-t3" text-anchor="start" x="20" y="360">ARGUMENTO 2 · en qué se ha convertido el capitalismo</text>
<rect class="sv-box" height="44" rx="2" width="170" x="20" y="368"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="386">Proliferan los sistemas</text>
<text class="sv-t2" text-anchor="middle" x="105" y="402">nacionales de innovación</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="190" x2="205" y1="390" y2="390"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="205" y="368"></rect>
<text class="sv-t" text-anchor="middle" x="290" y="386">Duplicación rápida</text>
<text class="sv-t2" text-anchor="middle" x="290" y="402">de las innovaciones</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="375" x2="390" y1="390" y2="390"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="390" y="368"></rect>
<text class="sv-t" text-anchor="middle" x="475" y="386">Ventana de ganancia</text>
<text class="sv-t2" text-anchor="middle" x="475" y="402">extraordinaria más corta</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="560" x2="575" y1="390" y2="390"></line>
<rect class="sv-box" height="44" rx="2" width="170" x="575" y="368"></rect>
<text class="sv-t" text-anchor="middle" x="660" y="386">Sobreacumulación</text>
<text class="sv-t2" text-anchor="middle" x="660" y="402">en los sectores dinámicos</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="660" x2="660" y1="412" y2="436"></line>
<rect class="sv-box" height="40" rx="2" width="170" x="575" y="436"></rect>
<text class="sv-t" text-anchor="middle" x="660" y="452">Caída de la tasa</text>
<text class="sv-t2" text-anchor="middle" x="660" y="468">de ganancia</text>
<line class="sv-line" marker-end="url(#m2-9-arrow)" x1="575" x2="552" y1="456" y2="456"></line>
<rect class="sv-box-ink" height="40" rx="2" width="260" x="290" y="436"></rect>
<text class="sv-tw" text-anchor="middle" x="420" y="452">Estancamiento secular</text>
<text class="sv-tw" text-anchor="middle" x="420" y="468">«no habrá más eras doradas»</text>
<text class="sv-t3" text-anchor="end" x="278" y="453" style="font-size:11px">por exceso de innovación,</text>
<text class="sv-t3" text-anchor="end" x="278" y="467" style="font-size:11px">no por escasez (vs. Gordon)</text>
<path class="sv-line" marker-end="url(#m2-9-arrow)" d="M420 476 V490 H210 V504"></path>
<path class="sv-line" marker-end="url(#m2-9-arrow)" d="M420 476 V490 H580 V504"></path>
<rect class="sv-box-red" height="44" rx="2" width="320" x="50" y="506"></rect>
<text class="sv-tr" text-anchor="middle" x="210" y="525">Formas brutales de valorización: barbarie</text>
<text class="sv-t2" text-anchor="middle" x="210" y="541" style="font-size:12px">guerra al trabajo · propiedad intelectual · burbujas</text>
<rect class="sv-box-green" height="44" rx="2" width="320" x="420" y="506"></rect>
<text class="sv-tgr" text-anchor="middle" x="580" y="525">Socialización radical de la inversión</text>
<text class="sv-t2" text-anchor="middle" x="580" y="541" style="font-size:12px">socialismo (el Green New Deal no basta)</text>
</svg>
