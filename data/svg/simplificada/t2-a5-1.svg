<svg xmlns="http://www.w3.org/2000/svg" aria-label="Cuatro capas: marco de la crítica (externa, desde la CEP, cuatro pilares presentes incluso en la TRS); triángulo de posiciones con la estrategia socialista en el vértice frente a eclecticismo y antifeminismo; cadena causal desde la necesidad de reproducir la fuerza de trabajo hasta la opresión de género y la incorporación contradictoria de la mujer; y matriz de las cuatro separaciones criticadas con la respuesta de la crítica de la economía política; al pie, la conclusión" role="img" viewBox="0 0 760 660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" height="42" rx="2" width="720" x="20" y="16"/>
<text class="sv-t" text-anchor="middle" x="380" y="34">Marco: crítica externa desde la CEP (la crítica inmanente del feminismo queda pendiente)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50" style="font-size:12px">cuatro pilares a criticar, presentes incluso en las Teorías de la Reproducción Social (TRS)</text>
<rect class="sv-box-green" height="44" rx="2" width="320" x="220" y="70"/>
<text class="sv-tgr" text-anchor="middle" x="380" y="88">Estrategia socialista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="105" style="font-size:12px">lo particular en y a través de lo universal · arma: CEP</text>
<line class="sv-line-dash" marker-end="url(#m2-5-arrow)" x1="300" x2="190" y1="114" y2="134"/>
<line class="sv-line-dash" marker-end="url(#m2-5-arrow)" x1="460" x2="570" y1="114" y2="134"/>
<rect class="sv-box-red" height="56" rx="2" width="340" x="20" y="134"/>
<text class="sv-tr" text-anchor="middle" x="190" y="152">Eclecticismo sociologista</text>
<text class="sv-t2" text-anchor="middle" x="190" y="168" style="font-size:12px">lo universal disuelto en particulares</text>
<text class="sv-t2" text-anchor="middle" x="190" y="182" style="font-size:12px">marxismo completado desde fuera: feminismo + nacionalismo</text>
<rect class="sv-box-red" height="56" rx="2" width="340" x="400" y="134"/>
<text class="sv-tr" text-anchor="middle" x="570" y="152">Antifeminismo reaccionario</text>
<text class="sv-t2" text-anchor="middle" x="570" y="168" style="font-size:12px">lo particular disuelto en lo abstracto</text>
<text class="sv-t2" text-anchor="middle" x="570" y="182" style="font-size:12px">universal vacío: el obrero fabril masculino</text>
<line class="sv-line-dash" x1="360" x2="400" y1="162" y2="162"/>
<text class="sv-t3" text-anchor="middle" x="380" y="212">dos caras de una misma moneda: comparten la oposición abstracta universal / particular</text>
<text class="sv-t3" x="20" y="234">GÉNESIS DE LA OPRESIÓN DE GÉNERO</text>
<rect class="sv-box" height="56" rx="2" width="170" x="20" y="242"/>
<text class="sv-t" text-anchor="middle" x="105" y="260">Capital social global</text>
<text class="sv-t2" text-anchor="middle" x="105" y="276" style="font-size:12px">reproduce la clase obrera:</text>
<text class="sv-t2" text-anchor="middle" x="105" y="290" style="font-size:12px">fuerza de trabajo = mercancía</text>
<rect class="sv-box" height="56" rx="2" width="170" x="203" y="242"/>
<text class="sv-t" text-anchor="middle" x="288" y="260">Familia nuclear</text>
<text class="sv-t2" text-anchor="middle" x="288" y="276" style="font-size:12px">heterosexual (fijada por</text>
<text class="sv-t2" text-anchor="middle" x="288" y="290" style="font-size:12px">el Estado) · salario único</text>
<rect class="sv-box" height="56" rx="2" width="170" x="386" y="242"/>
<text class="sv-t" text-anchor="middle" x="471" y="260">División sexual</text>
<text class="sv-t2" text-anchor="middle" x="471" y="276" style="font-size:12px">del trabajo: puesta por el</text>
<text class="sv-t2" text-anchor="middle" x="471" y="290" style="font-size:12px">capital, no por la biología</text>
<rect class="sv-box-red" height="56" rx="2" width="170" x="569" y="242"/>
<text class="sv-tr" text-anchor="middle" x="654" y="260">División de género</text>
<text class="sv-t2" text-anchor="middle" x="654" y="276" style="font-size:12px">opresión: el capital dicta</text>
<text class="sv-t2" text-anchor="middle" x="654" y="290" style="font-size:12px">qué relaciones valen</text>
<line class="sv-line" marker-end="url(#m2-5-arrow)" x1="190" x2="203" y1="270" y2="270"/>
<line class="sv-line" marker-end="url(#m2-5-arrow)" x1="373" x2="386" y1="270" y2="270"/>
<line class="sv-line" marker-end="url(#m2-5-arrow)" x1="556" x2="569" y1="270" y2="270"/>
<line class="sv-line-dash" marker-end="url(#m2-5-arrow)" x1="288" x2="288" y1="298" y2="320"/>
<rect class="sv-box" height="56" rx="2" width="194" x="179" y="322"/>
<text class="sv-t" text-anchor="middle" x="276" y="340">Incorporación</text>
<text class="sv-t2" text-anchor="middle" x="276" y="356" style="font-size:12px">contradictoria de la mujer</text>
<text class="sv-t2" text-anchor="middle" x="276" y="370" style="font-size:12px">a la producción (gran industria)</text>
<line class="sv-line" marker-end="url(#m2-5-arrow)" x1="373" x2="386" y1="350" y2="350"/>
<rect class="sv-box-gold" height="56" rx="2" width="354" x="386" y="322"/>
<text class="sv-tg" text-anchor="middle" x="563" y="340">Competencia intraclase y regulación estatal</text>
<text class="sv-t2" text-anchor="middle" x="563" y="356" style="font-size:12px">salarios más bajos · Estado: confinamiento doméstico</text>
<text class="sv-t2" text-anchor="middle" x="563" y="370" style="font-size:12px">«ejército de reserva doméstico» → doble jornada</text>
<text class="sv-t2" text-anchor="middle" x="380" y="398" style="font-size:11.5px">la familia no tiene lógica autónoma: la determinan las necesidades de acumulación del capital</text>
<text class="sv-t3" x="20" y="420">CUATRO SEPARACIONES CRITICADAS</text>
<rect class="sv-box-ink" height="24" rx="2" width="300" x="20" y="428"/>
<text class="sv-tw" text-anchor="middle" x="170" y="445">Separación (también en la TRS)</text>
<rect class="sv-box-ink" height="24" rx="2" width="410" x="330" y="428"/>
<text class="sv-tw" text-anchor="middle" x="535" y="445">Respuesta de la CEP</text>
<rect class="sv-box" height="26" rx="2" width="300" x="20" y="460"/>
<text class="sv-t" text-anchor="middle" x="170" y="478" style="font-size:12.5px">Valor naturalizado (salario doméstico)</text>
<rect class="sv-box-blue" height="26" rx="2" width="410" x="330" y="460"/>
<text class="sv-tb" text-anchor="middle" x="535" y="478" style="font-size:12.5px">Trabajo doméstico: necesario pero improductivo</text>
<rect class="sv-box" height="26" rx="2" width="300" x="20" y="492"/>
<text class="sv-t" text-anchor="middle" x="170" y="510" style="font-size:12.5px">Producción / reproducción (dos lógicas)</text>
<rect class="sv-box-blue" height="26" rx="2" width="410" x="330" y="492"/>
<text class="sv-tb" text-anchor="middle" x="535" y="510" style="font-size:12.5px">Unidad bajo el capital social global</text>
<rect class="sv-box" height="26" rx="2" width="300" x="20" y="524"/>
<text class="sv-t" text-anchor="middle" x="170" y="542" style="font-size:12.5px">Teoría / historia (Arruzza vs Meiksins Wood)</text>
<rect class="sv-box-blue" height="26" rx="2" width="410" x="330" y="524"/>
<text class="sv-tb" text-anchor="middle" x="535" y="542" style="font-size:12.5px">Historicidad derivada de la lógica inmanente del capital</text>
<rect class="sv-box" height="26" rx="2" width="300" x="20" y="556"/>
<text class="sv-t" text-anchor="middle" x="170" y="574" style="font-size:12.5px">Reconocimiento / redistribución (Fraser–Butler)</text>
<rect class="sv-box-blue" height="26" rx="2" width="410" x="330" y="556"/>
<text class="sv-tb" text-anchor="middle" x="535" y="574" style="font-size:12.5px">El Estado no es neutro: «ilusión del estado social»</text>
<rect class="sv-box-ink" height="42" rx="2" width="720" x="20" y="592"/>
<text class="sv-tw" text-anchor="middle" x="380" y="610">Conclusión: la unidad de clase se construye en la práctica, no por decreto</text>
<text class="sv-tw" text-anchor="middle" x="380" y="626" style="font-size:12px">combatir las formas ideológicas de la competencia (transfobia, homofobia, racismo, machismo)</text>
<text class="sv-t3" text-anchor="middle" x="380" y="652">flecha continua = produce / deriva en · discontinua = supera (triángulo) o desencadena (incorporación)</text>
</svg>
