<svg xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de bifurcación: de la crisis ecológica como crisis capitalista y orgánica (multidimensional, procesual, contradicción interna; no revolucionaria por sí misma) se pasa a la proletarización de las clases medias y la sociedad en tercios, con el mecanismo que la produce (fin de los modos de vida y de la apropiación barata), que se abre en tres salidas (escenario progresista, escenario conservador y recomposición del proletariado); esta última se despliega en una escalera de hegemonía socialista precedida por el candado de la independencia política, mientras un recuadro contrasta la hegemonía populista con la gramsciana; abajo, la crítica del populismo verde y la autonomía de lo político en versión verde, y los apuntes estratégicos finales con la cita de Gramsci" role="img" viewBox="0 0 760 612" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="40" rx="2" width="360" x="200" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="39">Crisis ecológica = crisis capitalista = crisis orgánica</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="64"></rect>
<text class="sv-t2" x="20" y="81" style="font-size:11.5px;letter-spacing:0">Multidimensional, procesual (degradación, no apocalipsis), contradicción interna del capital, que «organiza la naturaleza misma».</text>
<text class="sv-t2" x="20" y="96" style="font-size:11.5px;letter-spacing:0">Orgánica (Gramsci): «resquebrajamiento de los fundamentos» de la sociedad dominante; no revolucionaria por sí misma.</text>
<path class="sv-line" d="M380 104 V118" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-gold" height="60" rx="2" width="480" x="140" y="120"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="141">Proletarización de las clases medias del centro</text>
<text class="sv-t2" text-anchor="middle" x="380" y="158">«sociedad en tercios»: patriciado rentista · en proletarización · excluidos</text>
<text class="sv-t2" text-anchor="middle" x="380" y="173" style="font-size:11.2px;letter-spacing:0">la crisis hace saltar los modos de vida de clase media y la apropiación barata (tierra, energía, alimentos)</text>
<path class="sv-line" d="M380 180 V196 H122 V212" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 180 V212" marker-end="url(#m3-6-arrow)"></path>
<path class="sv-line" d="M380 196 H638 V212" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-red" height="64" rx="2" width="220" x="12" y="214"></rect>
<text class="sv-tr" text-anchor="middle" x="122" y="235">Escenario progresista</text>
<text class="sv-t2" text-anchor="middle" x="122" y="251" style="font-size:12px">socialdemocracia verde, errejonismo:</text>
<text class="sv-t2" text-anchor="middle" x="122" y="266" style="font-size:12px">clase media + restos de clase obrera</text>
<rect class="sv-box-red" height="64" rx="2" width="220" x="270" y="214"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="235">Escenario conservador</text>
<text class="sv-t2" text-anchor="middle" x="380" y="251" style="font-size:12px">derecha radical: la clase media</text>
<text class="sv-t2" text-anchor="middle" x="380" y="266" style="font-size:12px">contra el proletariado migrante</text>
<rect class="sv-box-green" height="64" rx="2" width="220" x="528" y="214"></rect>
<text class="sv-tgr" text-anchor="middle" x="638" y="235">Tercera opción</text>
<text class="sv-t2" text-anchor="middle" x="638" y="251" style="font-size:12px">el proletariado se recompone como</text>
<text class="sv-t2" text-anchor="middle" x="638" y="266" style="font-size:12px">sujeto y subordina a la clase media</text>
<text class="sv-t3" text-anchor="middle" x="246" y="302">ambos escenarios pueden aislar a la clase media y abrir la tercera opción</text>
<text class="sv-t3" text-anchor="middle" x="246" y="318">sin fuerza organizada, el doble poder favorece a la burguesía</text>
<text class="sv-t3" x="12" y="340">DOS SENTIDOS DE HEGEMONÍA</text>
<rect class="sv-box-red" height="64" rx="2" width="165" x="12" y="348"></rect>
<text class="sv-tr" text-anchor="middle" x="94" y="370">Hegemonía populista</text>
<text class="sv-t2" text-anchor="middle" x="94" y="387" style="font-size:12.2px;letter-spacing:0">discurso, «sentidos comunes»</text>
<text class="sv-t2" text-anchor="middle" x="94" y="402" style="font-size:12.2px;letter-spacing:0">alianzas interclasistas</text>
<text class="sv-t3" text-anchor="middle" x="192" y="384">vs</text>
<rect class="sv-box-blue" height="64" rx="2" width="165" x="207" y="348"></rect>
<text class="sv-tb" text-anchor="middle" x="289" y="370">Hegemonía gramsciana</text>
<text class="sv-t2" text-anchor="middle" x="289" y="387" style="font-size:12.2px;letter-spacing:0">unidad de lo económico,</text>
<text class="sv-t2" text-anchor="middle" x="289" y="402" style="font-size:12.2px;letter-spacing:0">lo político y lo militar</text>
<path class="sv-line-red" d="M638 278 V324" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-ink" height="68" rx="2" width="348" x="400" y="326"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="347">Candado: independencia política primero</text>
<text class="sv-tw" text-anchor="middle" x="574" y="365">Movimiento Socialista → Partido → Estado Socialista</text>
<text class="sv-tw" text-anchor="middle" x="574" y="383" style="font-size:11.4px;letter-spacing:0">desplegar la hegemonía antes del candado = liquidacionismo</text>
<path class="sv-line" d="M454 394 V438" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="54" rx="2" width="108" x="400" y="440"></rect>
<text class="sv-t" text-anchor="middle" x="454" y="458">1. Unificar</text>
<text class="sv-t2" text-anchor="middle" x="454" y="473" style="font-size:11.6px;letter-spacing:0">el tercio en</text>
<text class="sv-t2" text-anchor="middle" x="454" y="488" style="font-size:11.6px;letter-spacing:0">proletarización</text>
<path class="sv-line" d="M508 467 H518" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="54" rx="2" width="108" x="520" y="420"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="438">2. Subordinar</text>
<text class="sv-t2" text-anchor="middle" x="574" y="453" style="font-size:11.6px;letter-spacing:0">sectores al</text>
<text class="sv-t2" text-anchor="middle" x="574" y="468" style="font-size:11.6px;letter-spacing:0">proyecto comunista</text>
<path class="sv-line" d="M628 447 H638" marker-end="url(#m3-6-arrow)"></path>
<rect class="sv-box-green" height="54" rx="2" width="108" x="640" y="400"></rect>
<text class="sv-t" text-anchor="middle" x="694" y="418">3. Apoyos</text>
<text class="sv-t2" text-anchor="middle" x="694" y="433" style="font-size:11.6px;letter-spacing:0">tácticos, con</text>
<text class="sv-t2" text-anchor="middle" x="694" y="448" style="font-size:11.3px;letter-spacing:0">separación orgánica</text>
<text class="sv-t3" text-anchor="middle" x="574" y="512">principal: 1 · secundario y contingente: 2 y 3</text>
<text class="sv-t3" x="12" y="536">CONTRA EL POPULISMO VERDE Y LA AUTONOMÍA DE LO POLÍTICO «VERDE»</text>
<rect class="sv-box-red" height="60" rx="2" width="420" x="12" y="544"></rect>
<text class="sv-tr" text-anchor="middle" x="222" y="565" style="font-size:12.6px;letter-spacing:0">Populismo verde (Tejero, Santiago Muiño, Green New Deal)</text>
<text class="sv-t2" text-anchor="middle" x="222" y="582" style="font-size:11.2px;letter-spacing:0">reedita a Tronti: renuncia a la lucha económica, reduce la política al Estado;</text>
<text class="sv-t2" text-anchor="middle" x="222" y="596" style="font-size:11.2px;letter-spacing:0">«la clase obrera no puede tomar la máquina del Estado tal como está»</text>
<text class="sv-t3" x="448" y="536">APUNTES ESTRATÉGICOS</text>
<rect class="sv-box-green" height="60" rx="2" width="300" x="448" y="544"></rect>
<text class="sv-tgr" text-anchor="middle" x="598" y="565">Frente a la crisis ecológica</text>
<text class="sv-t2" text-anchor="middle" x="598" y="582" style="font-size:11.2px;letter-spacing:0">autodefensa socialista también del «cuerpo inorgánico»;</text>
<text class="sv-t2" text-anchor="middle" x="598" y="596" style="font-size:11.2px;letter-spacing:0">Gramsci: «la fuerza permanentemente organizada»</text>
</svg>
