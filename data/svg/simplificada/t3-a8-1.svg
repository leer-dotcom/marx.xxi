<svg xmlns="http://www.w3.org/2000/svg" aria-label="Triángulo de tendencias del movimiento obrero con el marxismo en el vértice superior y espontaneísmo y reformismo como vértices complementarios; debajo, la ecuación independencia política igual a partido igual a fusión de socialismo y movimiento, con los seis pilares del partido; a la derecha, qué deshacer y la escalera del proceso socialista desde la oposición revolucionaria hasta la sociedad sin clases; en medio, tres cajas con las cinco tesis de Marx y Engels y la política como lucha general, qué hace el partido (autogobierno, mayoría, centralismo democrático) y el diagnóstico del presente (socialdemocracia, espontaneísmo, 15-M y Podemos); al pie, línea temporal anotada de la constitución de la clase en partido de 1848 a 1917 y la cita final de Marx" role="img" viewBox="0 0 760 614" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-8-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="20">TRES TENDENCIAS DEL MOVIMIENTO OBRERO · OBJETIVAS, NO IDENTIDADES</text>
<rect class="sv-box-green" height="44" rx="2" width="210" x="135" y="30"></rect>
<text class="sv-tgr" text-anchor="middle" x="240" y="50">Revolucionaria-política</text>
<text class="sv-t2" text-anchor="middle" x="240" y="66" style="font-size:11.7px;letter-spacing:0">marxismo: acción política independiente</text>
<path class="sv-line" d="M200 74 L110 112"></path>
<path class="sv-line" d="M280 74 L370 112"></path>
<rect class="sv-box-red" height="50" rx="2" width="200" x="12" y="114"></rect>
<text class="sv-tr" text-anchor="middle" x="112" y="135" style="font-size:13.4px;letter-spacing:0">Espontaneísmo / movimentismo</text>
<text class="sv-t2" text-anchor="middle" x="112" y="151" style="font-size:11.6px;letter-spacing:0">acción directa, antipolítica, consejos</text>
<rect class="sv-box-red" height="50" rx="2" width="200" x="268" y="114"></rect>
<text class="sv-tr" text-anchor="middle" x="368" y="135">Reformismo</text>
<text class="sv-t2" text-anchor="middle" x="368" y="151" style="font-size:11.6px;letter-spacing:0">colaboración de clases, gobernar</text>
<path class="sv-line-red" d="M212 139 H268" marker-end="url(#m3-8-arrow)" marker-start="url(#m3-8-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="240" y="186">complementarios: el movimiento es el cuerpo, el partido reformista la cabeza</text>
<text class="sv-t3" text-anchor="middle" x="240" y="202">(la antipolítica no es alternativa política: sanciona las opciones existentes)</text>
<rect class="sv-box-ink" height="36" rx="2" width="456" x="12" y="212"></rect>
<text class="sv-tw" text-anchor="middle" x="240" y="235" style="font-size:13px;letter-spacing:0">Independencia política = Partido = Fusión socialismo + movimiento proletario</text>
<text class="sv-t3" x="12" y="262">SEIS PILARES DEL PARTIDO</text>
<rect class="sv-box" height="30" rx="2" width="146" x="12" y="270"></rect>
<text class="sv-t" text-anchor="middle" x="85" y="290">Conciencia socialista</text>
<rect class="sv-box" height="30" rx="2" width="146" x="167" y="270"></rect>
<text class="sv-t" text-anchor="middle" x="240" y="290" style="font-size:13.3px;letter-spacing:0">Independencia política</text>
<rect class="sv-box" height="30" rx="2" width="146" x="322" y="270"></rect>
<text class="sv-t" text-anchor="middle" x="395" y="290">Carácter de masas</text>
<rect class="sv-box" height="30" rx="2" width="146" x="12" y="308"></rect>
<text class="sv-t" text-anchor="middle" x="85" y="328" style="font-size:11.9px;letter-spacing:0">Centralismo democrático</text>
<rect class="sv-box" height="30" rx="2" width="146" x="167" y="308"></rect>
<text class="sv-t" text-anchor="middle" x="240" y="328">Internacionalismo</text>
<rect class="sv-box" height="30" rx="2" width="146" x="322" y="308"></rect>
<text class="sv-t" text-anchor="middle" x="395" y="328">Lucha por el poder</text>
<text class="sv-t3" text-anchor="middle" x="240" y="356">bolchevismo = «encarnación ejemplar del marxismo revolucionario»</text>

<rect class="sv-box-red" height="64" rx="2" width="248" x="500" y="14"></rect>
<text class="sv-tr" text-anchor="middle" x="624" y="35">Qué deshacer</text>
<text class="sv-t2" text-anchor="middle" x="624" y="52" style="font-size:12px">yugo socialdemócrata, sectarismo,</text>
<text class="sv-t2" text-anchor="middle" x="624" y="67" style="font-size:12px">economicismo, oportunismo</text>
<text class="sv-t3" x="500" y="102">PROCESO SOCIALISTA</text>
<rect class="sv-box-green" height="44" rx="2" width="122" x="626" y="112"></rect>
<text class="sv-t" text-anchor="middle" x="687" y="131">Sociedad</text>
<text class="sv-t" text-anchor="middle" x="687" y="147">sin clases</text>
<rect class="sv-box-blue" height="44" rx="2" width="122" x="584" y="170"></rect>
<text class="sv-t" text-anchor="middle" x="645" y="189">Estado Socialista</text>
<text class="sv-t2" text-anchor="middle" x="645" y="205">forma-comuna</text>
<rect class="sv-box-blue" height="44" rx="2" width="122" x="542" y="228"></rect>
<text class="sv-t" text-anchor="middle" x="603" y="247">Partido</text>
<text class="sv-t" text-anchor="middle" x="603" y="263">Comunista</text>
<rect class="sv-box-gold" height="70" rx="2" width="122" x="500" y="286"></rect>
<text class="sv-tg" text-anchor="middle" x="561" y="306">Hoy: oposición</text>
<text class="sv-tg" text-anchor="middle" x="561" y="322">revolucionaria</text>
<text class="sv-t2" text-anchor="middle" x="561" y="338" style="font-size:12.5px;letter-spacing:0">fase de movimiento,</text>
<text class="sv-t2" text-anchor="middle" x="561" y="352" style="font-size:12.5px;letter-spacing:0">ruptura y unificación</text>
<path class="sv-line" d="M561 286 V274" marker-end="url(#m3-8-arrow)"></path>
<path class="sv-line" d="M603 228 V216" marker-end="url(#m3-8-arrow)"></path>
<path class="sv-line" d="M645 170 V158" marker-end="url(#m3-8-arrow)"></path>
<text class="sv-t2" text-anchor="middle" x="685" y="300" style="font-size:10.8px;letter-spacing:0">hostil al Estado</text>
<text class="sv-t2" text-anchor="middle" x="685" y="313" style="font-size:10.8px;letter-spacing:0">burgués; prepara,</text>
<text class="sv-t2" text-anchor="middle" x="685" y="326" style="font-size:10.8px;letter-spacing:0">educa y organiza</text>

<text class="sv-t3" x="12" y="380">LÍNEA DE MARX Y ENGELS · QUÉ HACE EL PARTIDO · EL PRESENTE</text>
<rect class="sv-box" height="60" rx="2" width="236" x="12" y="388"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="407">Cinco tesis y la política</text>
<text class="sv-t2" text-anchor="middle" x="130" y="423" style="font-size:11px;letter-spacing:0">emancipación por el proletariado mismo, en el</text>
<text class="sv-t2" text-anchor="middle" x="130" y="437" style="font-size:11px;letter-spacing:0">socialismo, por acción política propia: Partido</text>
<rect class="sv-box-blue" height="60" rx="2" width="236" x="262" y="388"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="407">El partido de masas</text>
<text class="sv-t2" text-anchor="middle" x="380" y="423" style="font-size:11px;letter-spacing:0">autogobierno de la clase; «del proyecto</text>
<text class="sv-t2" text-anchor="middle" x="380" y="437" style="font-size:11px;letter-spacing:0">revolucionario a la mayoría»; centralismo</text>
<rect class="sv-box-gold" height="60" rx="2" width="236" x="512" y="388"></rect>
<text class="sv-tg" text-anchor="middle" x="630" y="407">Presente: sólo política burguesa</text>
<text class="sv-t2" text-anchor="middle" x="630" y="423" style="font-size:11px;letter-spacing:0">socialdemocracia + espontaneísmo (Podemos)</text>
<text class="sv-t2" text-anchor="middle" x="630" y="437" style="font-size:11px;letter-spacing:0">«sin política propia, la política la harán otros»</text>

<text class="sv-t3" x="12" y="472">CONSTITUCIÓN DE LA CLASE EN PARTIDO</text>
<path class="sv-line" d="M20 522 H740"></path>
<circle class="sv-dot" cx="40" cy="522" r="4"></circle>
<text class="sv-t2" x="12" y="500">Cartismo</text>
<text class="sv-t2" x="12" y="512" style="font-size:10.2px;letter-spacing:0">primer partido obrero</text>
<circle class="sv-dot" cx="125" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="125" y="541">1848 · Circular 1850</text>
<text class="sv-t2" text-anchor="middle" x="125" y="553" style="font-size:10.2px;letter-spacing:0">independencia de la pequeña burguesía</text>
<circle class="sv-dot" cx="210" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="210" y="500">AIT 1864–72</text>
<text class="sv-t2" text-anchor="middle" x="210" y="512" style="font-size:10.2px;letter-spacing:0">partido propio, contra Bakunin</text>
<circle class="sv-dot" cx="295" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="295" y="541">Comuna 1871</text>
<text class="sv-t2" text-anchor="middle" x="295" y="553" style="font-size:10.2px;letter-spacing:0">derrota por falta de partido</text>
<circle class="sv-dot" cx="380" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="380" y="500">Gotha 1875</text>
<text class="sv-t2" text-anchor="middle" x="380" y="512" style="font-size:10.2px;letter-spacing:0">seis críticas de Marx</text>
<circle class="sv-dot" cx="465" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="465" y="541">Circular 1879</text>
<text class="sv-t2" text-anchor="middle" x="465" y="553" style="font-size:10.2px;letter-spacing:0">«¡que monten otro partido!»</text>
<circle class="sv-dot" cx="550" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="550" y="500">II Internacional</text>
<text class="sv-t2" text-anchor="middle" x="550" y="512" style="font-size:10.2px;letter-spacing:0">1889; bancarrota 1914</text>
<circle class="sv-dot" cx="635" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="middle" x="635" y="541">1912 · 1914</text>
<text class="sv-t2" text-anchor="middle" x="635" y="553" style="font-size:10.2px;letter-spacing:0">ruptura con los liquidadores</text>
<circle class="sv-dot" cx="720" cy="522" r="4"></circle>
<text class="sv-t2" text-anchor="end" x="748" y="500">1917 · III Int.</text>
<text class="sv-t2" text-anchor="end" x="748" y="512" style="font-size:10.2px;letter-spacing:0">frente a la Comuna: el Partido</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="566"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="583" style="font-size:11.6px;letter-spacing:0">Marx: «prepararla mediante una agitación constante contra la política de las clases dominantes […]; en caso contrario,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="598" style="font-size:11.6px;letter-spacing:0">la clase obrera será un juguete en sus manos». La unificación es resultado, no requisito, de andar la vía de la independencia.</text>
</svg>
