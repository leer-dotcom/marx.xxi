<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, banda de partida: la contradicción práctica del capitalismo da lugar a la misión histórica del proletariado y ésta a la conciencia socialista, definida frente a la conciencia económica y la oportunista; debajo, cadena de medios y fines encadenados: recomposición de las fuerzas comunistas, partido independiente, toma del poder y socialismo, con una nota sobre la necesidad práctica y la libertad; abajo a la izquierda, triángulo que opone la conciencia socialista al dogmatismo de la secta (con su deriva en el leninismo de Stalin y el pensamiento Mao) y al oportunismo ecléctico, y la nota de que el dogma se refuta a sí mismo; abajo a la derecha, cajas concéntricas de la difusión desde el intelectual colectivo hasta el partido de masas, con la figura del tribuno popular y la cita final" role="img" viewBox="0 0 760 574" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="20">PUNTO DE PARTIDA: DE LA CONTRADICCIÓN PRÁCTICA DEL CAPITALISMO A LA CONCIENCIA SOCIALISTA</text>
<rect class="sv-box" height="64" rx="2" width="232" x="12" y="30"></rect>
<text class="sv-t" text-anchor="middle" x="128" y="50">Contradicción práctica</text>
<text class="sv-t2" text-anchor="middle" x="128" y="66" style="font-size:12px;letter-spacing:0">los medios materiales desbordan el fin</text>
<text class="sv-t2" text-anchor="middle" x="128" y="81" style="font-size:12px;letter-spacing:0">y emerge un fin nuevo: el individuo pleno</text>
<path class="sv-line-dash" d="M246 62 H262" marker-end="url(#m3-3-arrow)"></path>
<rect class="sv-box" height="64" rx="2" width="232" x="264" y="30"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="50" style="font-size:13px;letter-spacing:0">Misión histórica del proletariado</text>
<text class="sv-t2" text-anchor="middle" x="380" y="66" style="font-size:12px;letter-spacing:0">conquistar el poder político e</text>
<text class="sv-t2" text-anchor="middle" x="380" y="81" style="font-size:12px;letter-spacing:0">introducir mediante él el socialismo</text>
<path class="sv-line-dash" d="M498 62 H514" marker-end="url(#m3-3-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="232" x="516" y="30"></rect>
<text class="sv-tgr" text-anchor="middle" x="632" y="50">Conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="632" y="66" style="font-size:12px;letter-spacing:0">conciencia del objetivo final y sus medios,</text>
<text class="sv-t2" text-anchor="middle" x="632" y="81" style="font-size:12px;letter-spacing:0">frente a la económica y a la oportunista</text>

<text class="sv-t3" x="12" y="124">NECESIDAD PRÁCTICA: «PARA ALCANZAR X SON NECESARIOS LOS MEDIOS Y»</text>
<path class="sv-line" d="M520 120 H546" marker-end="url(#m3-3-arrow)"></path>
<text class="sv-t3" x="552" y="124">es medio para</text>
<path class="sv-line-dash" d="M650 120 H676" marker-end="url(#m3-3-arrow)"></path>
<text class="sv-t3" x="682" y="124">da lugar a</text>
<rect class="sv-box" height="60" rx="2" width="165" x="12" y="134"></rect>
<text class="sv-t" text-anchor="middle" x="94" y="156">Recomposición de las</text>
<text class="sv-t" text-anchor="middle" x="94" y="172">fuerzas comunistas</text>
<text class="sv-t3" text-anchor="middle" x="94" y="187">medio</text>
<path class="sv-line" d="M177 164 H200" marker-end="url(#m3-3-arrow)"></path>
<rect class="sv-box-blue" height="60" rx="2" width="165" x="202" y="134"></rect>
<text class="sv-t" text-anchor="middle" x="284" y="156">Partido político</text>
<text class="sv-t" text-anchor="middle" x="284" y="172">independiente</text>
<text class="sv-t3" text-anchor="middle" x="284" y="187">fin → medio</text>
<path class="sv-line" d="M367 164 H390" marker-end="url(#m3-3-arrow)"></path>
<rect class="sv-box-blue" height="60" rx="2" width="165" x="392" y="134"></rect>
<text class="sv-t" text-anchor="middle" x="474" y="156">Toma del poder</text>
<text class="sv-t" text-anchor="middle" x="474" y="172">político</text>
<text class="sv-t3" text-anchor="middle" x="474" y="187">fin → medio</text>
<path class="sv-line" d="M557 164 H580" marker-end="url(#m3-3-arrow)"></path>
<rect class="sv-box-green" height="60" rx="2" width="166" x="582" y="134"></rect>
<text class="sv-t" text-anchor="middle" x="665" y="156">Socialismo</text>
<text class="sv-t2" text-anchor="middle" x="665" y="172" style="font-size:10.9px;letter-spacing:0">desarrollo pleno de los individuos</text>
<text class="sv-t3" text-anchor="middle" x="665" y="187">fin</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="204"></rect>
<text class="sv-t2" x="20" y="221" style="font-size:11.5px;letter-spacing:0">Necesidad teleológica, no causal: «la libertad es la conciencia de la necesidad», hacerse cargo de los medios que el fin exige.</text>
<text class="sv-t2" x="20" y="236" style="font-size:11.5px;letter-spacing:0">Hoy, sin partido independiente, el primer paso es recuperar el objetivo final y los principios generales del marxismo.</text>

<text class="sv-t3" x="12" y="272">RAZONES FRENTE A RECETAS</text>
<rect class="sv-box-green" height="56" rx="2" width="196" x="88" y="290"></rect>
<text class="sv-t" text-anchor="middle" x="186" y="310">Conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="186" y="326" style="font-size:11.6px;letter-spacing:0">razones objetivas y comunicables</text>
<text class="sv-t2" text-anchor="middle" x="186" y="340" style="font-size:11.6px;letter-spacing:0">«fórmula en construcción»</text>
<path class="sv-line-dash" d="M140 352 L80 440"></path>
<path class="sv-line-dash" d="M232 352 L292 440"></path>
<text class="sv-t3" text-anchor="end" x="100" y="400">se opone a</text>
<text class="sv-t3" x="272" y="400">se opone a</text>
<rect class="sv-box-red" height="72" rx="2" width="172" x="12" y="442"></rect>
<text class="sv-tr" text-anchor="middle" x="98" y="464">Dogmatismo / secta</text>
<text class="sv-t2" text-anchor="middle" x="98" y="480" style="font-size:11.9px;letter-spacing:0">receta, autoridad externa,</text>
<text class="sv-t2" text-anchor="middle" x="98" y="495" style="font-size:11.9px;letter-spacing:0">«porque lo dice el marxismo»</text>
<text class="sv-t2" text-anchor="middle" x="98" y="510" style="font-size:11.9px;letter-spacing:0">(«leninismo» de Stalin, Mao)</text>
<rect class="sv-box-red" height="72" rx="2" width="172" x="196" y="442"></rect>
<text class="sv-tr" text-anchor="middle" x="282" y="464" style="font-size:12.9px;letter-spacing:0">Oportunismo / eclecticismo</text>
<text class="sv-t2" text-anchor="middle" x="282" y="480" style="font-size:12px;letter-spacing:0">sacrifica el fin, modas teóricas,</text>
<text class="sv-t2" text-anchor="middle" x="282" y="495" style="font-size:11.8px;letter-spacing:0">conciencia económica, horizonte</text>
<text class="sv-t2" text-anchor="middle" x="282" y="510" style="font-size:12px;letter-spacing:0">de lo inmediato, sin principios</text>
<rect class="sv-soft" height="40" rx="2" width="376" x="12" y="526"></rect>
<text class="sv-t2" x="20" y="543" style="font-size:11.3px;letter-spacing:0">El dogma se refuta a sí mismo: toda autoridad es concedida activamente;</text>
<text class="sv-t2" x="20" y="558" style="font-size:11.3px;letter-spacing:0">somos responsables en primera persona de lo que pensamos (Ilustración).</text>

<text class="sv-t3" x="400" y="272">DIFUSIÓN: DE LA CABEZA AL PARTIDO DE MASAS</text>
<rect class="sv-box" height="234" rx="2" width="348" x="400" y="284"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="304">Partido de masas políticamente independiente</text>
<rect class="sv-box-blue" height="192" rx="2" width="308" x="420" y="316"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="336">Sentido común / Weltanschauung</text>
<text class="sv-t2" text-anchor="middle" x="574" y="351">traducción a «distintos idiomas»</text>
<rect class="sv-box-gold" height="136" rx="2" width="268" x="440" y="362"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="382">Maquinaria de propaganda y agitación</text>
<text class="sv-t2" text-anchor="middle" x="574" y="398">propagandista · agitador · tribuno popular</text>
<rect class="sv-box-ink" height="78" rx="2" width="228" x="460" y="410"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="432">Intelectual colectivo</text>
<text class="sv-tw" text-anchor="middle" x="574" y="450">«la cabeza, pero nada más</text>
<text class="sv-tw" text-anchor="middle" x="574" y="466">que la cabeza»: teoría y principios</text>
<rect class="sv-soft" height="40" rx="2" width="348" x="400" y="526"></rect>
<text class="sv-t2" text-anchor="middle" x="574" y="543" style="font-size:11.6px;letter-spacing:0">Conciencia activa: «si ha de ser el agente de la revolución,</text>
<text class="sv-t2" text-anchor="middle" x="574" y="558" style="font-size:11.6px;letter-spacing:0">el proletariado debe saber que lo es, o no lo será en absoluto»</text>
</svg>
