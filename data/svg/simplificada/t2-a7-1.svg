<svg xmlns="http://www.w3.org/2000/svg" aria-label="Franja con los discursos rechazados sobre la despoblación; cadena causal desde la acumulación de capital, por dos vías agraria y urbana, hasta el desarrollo geográfico desigual (con sus concreciones españolas) y la brecha territorial con el proletariado rural y el ruralismo; debajo, tabla que compara las respuestas neoliberal europea, socialdemócrata rural y territorialista con la posición socialista en diagnóstico, ejemplos, interlocutor y límite; al pie, la necesidad recíproca" role="img" viewBox="0 0 760 656" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-7-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="16"/>
<text class="sv-t" text-anchor="middle" x="380" y="34">Lo que se rechaza: la despoblación como fenómeno natural e irreversible de la modernización</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50" style="font-size:11.5px">foto fija y victimismo campo / ciudad · explicaciones «culturales» · conspiración urbana</text>
<rect class="sv-box-ink" height="40" rx="2" width="240" x="260" y="68"/>
<text class="sv-tw" text-anchor="middle" x="380" y="86">Acumulación de capital</text>
<text class="sv-tw" text-anchor="middle" x="380" y="101" style="font-size:11.5px">con el Estado como capitalista colectivo</text>
<path class="sv-line" marker-end="url(#m2-7-arrow)" d="M300 108 V124 H105 V132"/>
<path class="sv-line" marker-end="url(#m2-7-arrow)" d="M460 108 V124 H660 V132"/>
<text class="sv-t3" x="20" y="116">(a) vía agraria</text>
<text class="sv-t3" text-anchor="end" x="740" y="116">(b) vía urbana</text>
<rect class="sv-box" height="56" rx="2" width="170" x="20" y="134"/>
<text class="sv-t" text-anchor="middle" x="105" y="152">Caída de rentabilidad</text>
<text class="sv-t2" text-anchor="middle" x="105" y="168" style="font-size:12px">del sector primario, contenida</text>
<text class="sv-t2" text-anchor="middle" x="105" y="182" style="font-size:12px">concentrando la propiedad</text>
<rect class="sv-box" height="56" rx="2" width="170" x="205" y="134"/>
<text class="sv-t" text-anchor="middle" x="290" y="152">Concentración de tierras</text>
<text class="sv-t2" text-anchor="middle" x="290" y="168" style="font-size:12px">+ mecanización → expulsión</text>
<text class="sv-t2" text-anchor="middle" x="290" y="182" style="font-size:12px">de trabajadores, renta del suelo</text>
<rect class="sv-box" height="56" rx="2" width="170" x="390" y="134"/>
<text class="sv-t" text-anchor="middle" x="475" y="152">Concentración en</text>
<text class="sv-t2" text-anchor="middle" x="475" y="168" style="font-size:12px">terciario y finanzas, para</text>
<text class="sv-t2" text-anchor="middle" x="475" y="182" style="font-size:12px">compensar la caída de rentas</text>
<rect class="sv-box" height="56" rx="2" width="170" x="575" y="134"/>
<text class="sv-t" text-anchor="middle" x="660" y="152">Aglomeraciones</text>
<text class="sv-t2" text-anchor="middle" x="660" y="168" style="font-size:12px">urbanas de consumidores</text>
<text class="sv-t2" text-anchor="middle" x="660" y="182" style="font-size:12px">para acelerar la venta</text>
<line class="sv-line" marker-end="url(#m2-7-arrow)" x1="190" x2="205" y1="162" y2="162"/>
<line class="sv-line" marker-end="url(#m2-7-arrow)" x1="560" x2="575" y1="162" y2="162"/>
<path class="sv-line" marker-end="url(#m2-7-arrow)" d="M290 190 V202 H340 V212"/>
<path class="sv-line" marker-end="url(#m2-7-arrow)" d="M660 190 V202 H420 V212"/>
<rect class="sv-box-blue" height="44" rx="2" width="260" x="250" y="214"/>
<text class="sv-tb" text-anchor="middle" x="380" y="232">Desarrollo geográfico desigual</text>
<text class="sv-t2" text-anchor="middle" x="380" y="248" style="font-size:11.5px">(Smith, Harvey): concentra y vacía territorios</text>
<rect class="sv-soft" height="44" rx="2" width="210" x="20" y="214"/>
<text class="sv-t2" text-anchor="middle" x="125" y="232" style="font-size:11px">la despoblación no es causa ni</text>
<text class="sv-t2" text-anchor="middle" x="125" y="245" style="font-size:11px">consecuencia: una fase · fetichiza el espacio</text>
<rect class="sv-box-gold" height="44" rx="2" width="210" x="530" y="214"/>
<text class="sv-tg" text-anchor="middle" x="635" y="232">Concreciones en España</text>
<text class="sv-t2" text-anchor="middle" x="635" y="248" style="font-size:11px">desarrollismo · burbuja 97-07 · Madrid</text>
<line class="sv-line-dash" marker-end="url(#m2-7-arrow)" x1="530" x2="510" y1="236" y2="236"/>
<line class="sv-line-dash" marker-end="url(#m2-7-arrow)" x1="230" x2="250" y1="236" y2="236"/>
<line class="sv-line" marker-end="url(#m2-7-arrow)" x1="380" x2="380" y1="258" y2="280"/>
<rect class="sv-box-red" height="56" rx="2" width="720" x="20" y="282"/>
<text class="sv-tr" text-anchor="middle" x="380" y="300">Brecha territorial</text>
<text class="sv-t2" text-anchor="middle" x="380" y="316" style="font-size:11.5px">proletariado rural desprotegido · ruralismo interclasista · acumulación ilimitada frente a límites naturales</text>
<text class="sv-t2" text-anchor="middle" x="380" y="330" style="font-size:11.5px">fractura del proletariado según el lugar de residencia: sin empleo, sin vivienda, sin acceso a prestaciones</text>
<text class="sv-t3" x="20" y="362">TRES RESPUESTAS Y UNA POSICIÓN</text>
<rect class="sv-soft" height="36" rx="2" width="152" x="114" y="370"/>
<text class="sv-t" text-anchor="middle" x="190" y="393">Neoliberal europea</text>
<rect class="sv-soft" height="36" rx="2" width="152" x="272" y="370"/>
<text class="sv-t" text-anchor="middle" x="348" y="386" style="font-size:13px">Socialdemocracia</text>
<text class="sv-t" text-anchor="middle" x="348" y="400" style="font-size:13px">rural (nueva)</text>
<rect class="sv-soft" height="36" rx="2" width="152" x="430" y="370"/>
<text class="sv-t" text-anchor="middle" x="506" y="386" style="font-size:13px">Territorialismo</text>
<text class="sv-t" text-anchor="middle" x="506" y="400" style="font-size:13px">anticapitalista</text>
<rect class="sv-box-green" height="36" rx="2" width="152" x="588" y="370"/>
<text class="sv-tgr" text-anchor="middle" x="664" y="393">Posición socialista</text>
<rect class="sv-soft" height="36" rx="2" width="88" x="20" y="412"/>
<text class="sv-t" text-anchor="middle" x="64" y="435" style="font-size:13px">Diagnóstico</text>
<rect class="sv-box" height="36" rx="2" width="152" x="114" y="412"/>
<text class="sv-t2" text-anchor="middle" x="190" y="427" style="font-size:11px">«círculos viciosos»,</text>
<text class="sv-t2" text-anchor="middle" x="190" y="440" style="font-size:11px">economía como caja negra</text>
<rect class="sv-box" height="36" rx="2" width="152" x="272" y="412"/>
<text class="sv-t2" text-anchor="middle" x="348" y="427" style="font-size:11px">«España vaciada»:</text>
<text class="sv-t2" text-anchor="middle" x="348" y="440" style="font-size:11px">el Estado debe cambiar</text>
<rect class="sv-box" height="36" rx="2" width="152" x="430" y="412"/>
<text class="sv-t2" text-anchor="middle" x="506" y="427" style="font-size:11px">territorio como sujeto,</text>
<text class="sv-t2" text-anchor="middle" x="506" y="440" style="font-size:11px">idealización de lo rural</text>
<rect class="sv-box-green" height="36" rx="2" width="152" x="588" y="412"/>
<text class="sv-t2" text-anchor="middle" x="664" y="427" style="font-size:11px">fase del desarrollo</text>
<text class="sv-t2" text-anchor="middle" x="664" y="440" style="font-size:11px">geográfico desigual</text>
<rect class="sv-soft" height="36" rx="2" width="88" x="20" y="454"/>
<text class="sv-t" text-anchor="middle" x="64" y="477" style="font-size:13px">Ejemplos</text>
<rect class="sv-box" height="36" rx="2" width="152" x="114" y="454"/>
<text class="sv-t2" text-anchor="middle" x="190" y="469" style="font-size:11px">LEADER / CLLD, fondos</text>
<text class="sv-t2" text-anchor="middle" x="190" y="482" style="font-size:11px">Next Generation</text>
<rect class="sv-box" height="36" rx="2" width="152" x="272" y="454"/>
<text class="sv-t2" text-anchor="middle" x="348" y="469" style="font-size:11px">Teruel Existe, Soria Ya!:</text>
<text class="sv-t2" text-anchor="middle" x="348" y="482" style="font-size:11px">PAC, vivienda rural</text>
<rect class="sv-box" height="36" rx="2" width="152" x="430" y="454"/>
<text class="sv-t2" text-anchor="middle" x="506" y="469" style="font-size:11px">soberanismos, agroecología,</text>
<text class="sv-t2" text-anchor="middle" x="506" y="482" style="font-size:11px">luchas: uranio, fracking</text>
<rect class="sv-box-green" height="36" rx="2" width="152" x="588" y="454"/>
<text class="sv-t2" text-anchor="middle" x="664" y="469" style="font-size:11px">articular proletariado</text>
<text class="sv-t2" text-anchor="middle" x="664" y="482" style="font-size:11px">rural y urbano</text>
<rect class="sv-soft" height="36" rx="2" width="88" x="20" y="496"/>
<text class="sv-t" text-anchor="middle" x="64" y="519" style="font-size:13px">Interlocutor</text>
<rect class="sv-box" height="36" rx="2" width="152" x="114" y="496"/>
<text class="sv-t2" text-anchor="middle" x="190" y="518" style="font-size:11px">UE y PAC</text>
<rect class="sv-box" height="36" rx="2" width="152" x="272" y="496"/>
<text class="sv-t2" text-anchor="middle" x="348" y="511" style="font-size:11px">Estado, administración</text>
<text class="sv-t2" text-anchor="middle" x="348" y="524" style="font-size:11px">autonómica</text>
<rect class="sv-box" height="36" rx="2" width="152" x="430" y="496"/>
<text class="sv-t2" text-anchor="middle" x="506" y="518" style="font-size:11px">vecindad, territorio</text>
<rect class="sv-box-green" height="36" rx="2" width="152" x="588" y="496"/>
<text class="sv-t2" text-anchor="middle" x="664" y="511" style="font-size:11px">proletariado rural y</text>
<text class="sv-t2" text-anchor="middle" x="664" y="524" style="font-size:11px">urbano, como clase</text>
<rect class="sv-soft" height="36" rx="2" width="88" x="20" y="538"/>
<text class="sv-t" text-anchor="middle" x="64" y="561" style="font-size:13px">Límite</text>
<rect class="sv-box" height="36" rx="2" width="152" x="114" y="538"/>
<text class="sv-t2" text-anchor="middle" x="190" y="553" style="font-size:11px">subordinada a la PAC:</text>
<text class="sv-t2" text-anchor="middle" x="190" y="566" style="font-size:11px">«nacida muerta»</text>
<rect class="sv-box" height="36" rx="2" width="152" x="272" y="538"/>
<text class="sv-t2" text-anchor="middle" x="348" y="553" style="font-size:11px">programa de clases</text>
<text class="sv-t2" text-anchor="middle" x="348" y="566" style="font-size:11px">medias, utópico</text>
<rect class="sv-box" height="36" rx="2" width="152" x="430" y="538"/>
<text class="sv-t2" text-anchor="middle" x="506" y="553" style="font-size:11px">oculta intereses</text>
<text class="sv-t2" text-anchor="middle" x="506" y="566" style="font-size:11px">de clase opuestos</text>
<rect class="sv-box-green" height="36" rx="2" width="152" x="588" y="538"/>
<text class="sv-tgr" text-anchor="middle" x="664" y="553" style="font-size:11px">control socialista</text>
<text class="sv-tgr" text-anchor="middle" x="664" y="566" style="font-size:11px">del espacio</text>
<rect class="sv-box-ink" height="42" rx="2" width="720" x="20" y="584"/>
<text class="sv-tw" text-anchor="middle" x="380" y="602">Necesidad recíproca: proceso socialista y mundo rural</text>
<text class="sv-tw" text-anchor="middle" x="380" y="618" style="font-size:11.5px">sin controlar el territorio despoblado el proceso socialista fracasa; el proletariado rural necesita independencia de clase</text>
<text class="sv-t3" text-anchor="middle" x="380" y="648">flecha continua = produce · discontinua = se concreta en / explica</text>
</svg>
