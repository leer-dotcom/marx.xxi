<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, las dos definiciones analíticas de Hägglund: socialdemocracia como redistribución sin tocar la producción de valor y socialismo democrático como revaluación revolucionaria del valor. A la izquierda, pirámide de dependencia: la producción de valor capitalista sostiene la riqueza disponible, que sostiene el Estado de bienestar y la renta básica, con un bucle de retroalimentación negativa y la crisis de los 70; a la derecha, matriz que muestra que neoliberalismo y socialdemocracia solo tocan la distribución, mientras el socialismo democrático toca también la producción de valor, con la renta básica universal como síntoma y la conclusión: redistribuir no es criticar el capitalismo" role="img" viewBox="0 0 760 504" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-12-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="60" rx="2" width="720" x="20" y="12"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="32">Dos definiciones analíticas (Hägglund, Esta vida)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="49" style="font-size:11.5px">Socialdemocracia: redistribución sin lidiar con la producción de valor</text>
<text class="sv-t2" text-anchor="middle" x="380" y="64" style="font-size:11.5px">Socialismo democrático: revaluación revolucionaria del valor; abolir el trabajo asalariado</text>
<text class="sv-t" text-anchor="start" x="20" y="104">Dependencia asimétrica</text>
<text class="sv-t3" text-anchor="start" x="20" y="121">el bienestar depende del capitalismo,</text>
<text class="sv-t3" text-anchor="start" x="20" y="135">no el capitalismo del bienestar</text>
<rect class="sv-box-red" height="58" rx="2" width="300" x="30" y="148"></rect>
<text class="sv-tr" text-anchor="middle" x="180" y="170">Estado de bienestar / renta básica</text>
<text class="sv-t2" text-anchor="middle" x="180" y="187" style="font-size:11.5px">conquista del capitalismo «blando» del siglo XX</text>
<text class="sv-t2" text-anchor="middle" x="180" y="201" style="font-size:11.5px">sólo toca la distribución</text>
<rect class="sv-box" height="44" rx="2" width="270" x="45" y="240"></rect>
<text class="sv-t" text-anchor="middle" x="180" y="259">Riqueza disponible</text>
<text class="sv-t2" text-anchor="middle" x="180" y="275" style="font-size:11.5px">generada por la explotación del salariado</text>
<rect class="sv-box-ink" height="60" rx="2" width="320" x="20" y="318"></rect>
<text class="sv-tw" text-anchor="middle" x="180" y="339">Producción de valor capitalista</text>
<text class="sv-tw" text-anchor="middle" x="180" y="356" style="font-size:12px">trabajo asalariado para el beneficio</text>
<text class="sv-tw" text-anchor="middle" x="180" y="371" style="font-size:11px">su fin queda fuera de toda deliberación democrática</text>
<line class="sv-line" marker-end="url(#m2-12-arrow)" x1="180" x2="180" y1="318" y2="284"></line>
<text class="sv-t3" text-anchor="start" x="190" y="305">financia</text>
<line class="sv-line" marker-end="url(#m2-12-arrow)" x1="180" x2="180" y1="240" y2="206"></line>
<text class="sv-t3" text-anchor="start" x="190" y="227">financia</text>
<path class="sv-line-dash" d="M330 177 H362 V348 H342" marker-end="url(#m2-12-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="366" y="266" style="font-size:11px">bucle</text>
<text class="sv-t3" text-anchor="middle" x="180" y="402" style="font-size:11px">Bucle de retroalimentación negativa (línea discontinua)</text>
<text class="sv-t2" text-anchor="middle" x="180" y="418" style="font-size:11.5px">menos explotación → menos riqueza para bienestar y RBU</text>
<text class="sv-t2" text-anchor="middle" x="180" y="433" style="font-size:11.5px">crisis de los 70: menos riqueza → estrategias neoliberales</text>
<text class="sv-t" text-anchor="middle" x="570" y="104">¿Qué transforma cada posición?</text>
<text class="sv-t3" text-anchor="middle" x="547" y="134">la distribución</text>
<text class="sv-t3" text-anchor="middle" x="547" y="148">de la riqueza</text>
<text class="sv-t3" text-anchor="middle" x="677" y="134">la producción</text>
<text class="sv-t3" text-anchor="middle" x="677" y="148">(medida) del valor</text>
<text class="sv-t2" text-anchor="end" x="478" y="190">Neoliberalismo</text>
<rect class="sv-box-green" height="50" rx="2" width="125" x="485" y="160"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="181">sí</text>
<text class="sv-t3" text-anchor="middle" x="547" y="199" style="font-size:11px">privatizaciones</text>
<rect class="sv-box-red" height="50" rx="2" width="125" x="615" y="160"></rect>
<text class="sv-tr" text-anchor="middle" x="677" y="190">no</text>
<text class="sv-t2" text-anchor="end" x="478" y="241">Social-</text>
<text class="sv-t2" text-anchor="end" x="478" y="255">democracia</text>
<rect class="sv-box-green" height="50" rx="2" width="125" x="485" y="218"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="239">sí</text>
<text class="sv-t3" text-anchor="middle" x="547" y="257" style="font-size:11px">redistribuye</text>
<rect class="sv-box-red" height="50" rx="2" width="125" x="615" y="218"></rect>
<text class="sv-tr" text-anchor="middle" x="677" y="248">no</text>
<text class="sv-t2" text-anchor="end" x="478" y="299">Socialismo</text>
<text class="sv-t2" text-anchor="end" x="478" y="313">democrático</text>
<rect class="sv-box-green" height="50" rx="2" width="125" x="485" y="276"></rect>
<text class="sv-tgr" text-anchor="middle" x="547" y="306">sí</text>
<rect class="sv-box-green" height="50" rx="2" width="125" x="615" y="276"></rect>
<text class="sv-tgr" text-anchor="middle" x="677" y="297">sí: revaluación</text>
<text class="sv-t3" text-anchor="middle" x="677" y="315" style="font-size:11px">del valor</text>
<rect class="sv-line-dash" height="174" rx="2" width="133" x="611" y="156"></rect>
<text class="sv-t3" text-anchor="middle" x="612" y="350">neoliberalismo y socialdemocracia comparten</text>
<text class="sv-t3" text-anchor="middle" x="612" y="364">la misma contradicción del valor</text>
<rect class="sv-soft" height="56" rx="2" width="340" x="400" y="380"></rect>
<text class="sv-t3" text-anchor="middle" x="570" y="398" style="font-size:11px">La renta básica universal como síntoma</text>
<text class="sv-t2" text-anchor="middle" x="570" y="414" style="font-size:11.5px">nunca cuestiona la medida ni la producción del valor;</text>
<text class="sv-t2" text-anchor="middle" x="570" y="429" style="font-size:11.5px">depende del salariado y perpetúa esa dependencia</text>
<text class="sv-t3" text-anchor="middle" x="570" y="462" style="font-size:11px">Conclusión</text>
<text class="sv-t2" text-anchor="middle" x="570" y="478" style="font-size:11.5px">«criticar la distribución de la riqueza —y defender su redistribución—</text>
<text class="sv-t2" text-anchor="middle" x="570" y="493" style="font-size:11.5px">no es una crítica del capitalismo»</text>
</svg>
