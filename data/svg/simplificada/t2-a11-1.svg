<svg xmlns="http://www.w3.org/2000/svg" aria-label="Péndulo cuyo eje es el ideal de un capitalismo sin contradicciones, del que cuelgan dos polos que se refuerzan, el servilismo reformista y el voluntarismo anarquista, y que desembocan ambos en la melancolía de izquierda; arriba, la premisa reformista y por qué las reformas socializadoras exacerban las contradicciones; fuera del péndulo, la salida: reforma subordinada al fin socialista y partido independiente" role="img" viewBox="0 0 760 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-11-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-gold" height="66" rx="2" width="520" x="120" y="12"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="32">Ideal de un capitalismo sin contradicciones</text>
<text class="sv-t2" text-anchor="middle" x="380" y="48" style="font-size:11.5px">«ideal regulativo»: tarea infinita · crítica de Luxemburgo a Bernstein</text>
<text class="sv-t3" text-anchor="middle" x="380" y="65">«caballo de Troya» del pensamiento de izquierda</text>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="86"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="102" style="font-size:11px">La premisa reformista: el capitalismo puede «perfeccionarse» atenuando sus contradicciones</text>
<text class="sv-t2" text-anchor="middle" x="380" y="118" style="font-size:11.5px">pero las reformas «socializadoras» las exacerban: las crisis son esenciales a la reproducción del capital</text>
<circle class="sv-dot" cx="380" cy="126" r="5"></circle>
<line class="sv-line" x1="380" x2="150" y1="126" y2="160"></line>
<line class="sv-line" x1="380" x2="610" y1="126" y2="160"></line>
<rect class="sv-box-red" height="108" rx="2" width="240" x="30" y="160"></rect>
<text class="sv-tr" text-anchor="middle" x="150" y="183">Servilismo reformista</text>
<text class="sv-t2" text-anchor="middle" x="150" y="201">parlamento y Estado de bienestar</text>
<text class="sv-t2" text-anchor="middle" x="150" y="217">DSA / Jacobin: sermón redistributivo</text>
<text class="sv-t2" text-anchor="middle" x="150" y="233">refuerza el salariado, prepara la crisis</text>
<text class="sv-t3" text-anchor="middle" x="150" y="255">Bernstein: el movimiento lo es todo</text>
<rect class="sv-box-red" height="108" rx="2" width="240" x="490" y="160"></rect>
<text class="sv-tr" text-anchor="middle" x="610" y="183">Voluntarismo / anarquismo</text>
<text class="sv-t2" text-anchor="middle" x="610" y="201">«acciones mágicas»: ladrillo, ocupación</text>
<text class="sv-t2" text-anchor="middle" x="610" y="217">BLM, Occupy, zonas autónomas</text>
<text class="sv-t2" text-anchor="middle" x="610" y="233">complemento callejero del reformismo</text>
<text class="sv-t3" text-anchor="middle" x="610" y="255">utopismo abstracto</text>
<line class="sv-line-red" marker-end="url(#m2-11-arrow)" marker-start="url(#m2-11-arrow)" x1="272" x2="488" y1="214" y2="214"></line>
<text class="sv-tr" text-anchor="middle" x="380" y="205">se refuerzan</text>
<text class="sv-t3" text-anchor="middle" x="380" y="231" style="font-size:11px">mala infinitud: vacilación sin fin</text>
<text class="sv-t3" text-anchor="middle" x="380" y="245" style="font-size:11px">dos caras de la misma moneda</text>
<path class="sv-line" marker-end="url(#m2-11-arrow)" d="M150 268 V288 H260 V308"></path>
<path class="sv-line" marker-end="url(#m2-11-arrow)" d="M610 268 V288 H500 V308"></path>
<rect class="sv-box" height="60" rx="2" width="380" x="190" y="308"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="328">Melancolía de izquierda (Benjamin)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="345" style="font-size:11.5px">cinismo: proyecto imposible, fracasos como derrota trágica</text>
<text class="sv-t2" text-anchor="middle" x="380" y="360" style="font-size:11.5px">antirracismo abstracto; en su extremo, afropesimismo</text>
<text class="sv-t3" text-anchor="middle" x="660" y="300">fuera del péndulo</text>
<rect class="sv-box-blue" height="96" rx="2" width="160" x="580" y="308"></rect>
<text class="sv-tb" text-anchor="middle" x="660" y="329">Salida (Luxemburgo)</text>
<text class="sv-t2" text-anchor="middle" x="660" y="347">reforma subordinada</text>
<text class="sv-t2" text-anchor="middle" x="660" y="363">al fin socialista</text>
<text class="sv-t2" text-anchor="middle" x="660" y="379">partido independiente</text>
<text class="sv-t2" text-anchor="middle" x="660" y="395">abolir el salariado</text>
<text class="sv-t3" text-anchor="middle" x="380" y="390" style="font-size:11px">«el reformismo es el muerto viviente de la lucha por el socialismo»</text>
</svg>
