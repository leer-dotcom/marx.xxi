<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arriba, línea de tratados de 1948 a 2009 y dos notas (forma del Estado capitalista; la UE como revolución por arriba); en medio, organigrama del poder en la Unión Europea como triángulo invertido: de los ejecutivos nacionales al Consejo Europeo, la Comisión, el Consejo de la UE y el BCE, con el Parlamento subordinado, el TJUE constitucionalizando los tratados y el proletariado europeo sin referéndum ni fiscalización; abajo, las cuatro posiciones sobre los Estados Unidos de Europa" viewBox="0 0 760 668" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="20" y="20">TRATADOS: UNA CONSTITUCIÓN SIN PROCESO CONSTITUYENTE</text>
<line class="sv-line" x1="20" y1="48" x2="744" y2="48" marker-end="url(#m4-6-arrow)"/>
<circle class="sv-dot" cx="70" cy="48" r="4"/>
<text class="sv-t3" x="70" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1948</text>
<text class="sv-t2" x="70" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Benelux</text>
<circle class="sv-dot" cx="160" cy="48" r="4"/>
<text class="sv-t3" x="160" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1951</text>
<text class="sv-t2" x="160" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">CECA</text>
<circle class="sv-dot" cx="250" cy="48" r="4"/>
<text class="sv-t3" x="250" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1958</text>
<text class="sv-t2" x="250" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Roma</text>
<circle class="sv-dot" cx="340" cy="48" r="4"/>
<text class="sv-t3" x="340" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1987</text>
<text class="sv-t2" x="340" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Acta Única</text>
<circle class="sv-dot" cx="430" cy="48" r="4"/>
<text class="sv-t3" x="430" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1992</text>
<text class="sv-t2" x="430" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Maastricht</text>
<circle class="sv-dot" cx="520" cy="48" r="4"/>
<text class="sv-t3" x="520" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">1997</text>
<text class="sv-t2" x="520" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Ámsterdam</text>
<circle class="sv-dot" cx="610" cy="48" r="4"/>
<text class="sv-t3" x="610" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">2003</text>
<text class="sv-t2" x="610" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Niza</text>
<circle class="sv-dot" cx="700" cy="48" r="4"/>
<text class="sv-t3" x="700" y="38" text-anchor="middle" style="font-size:11px;letter-spacing:0">2009</text>
<text class="sv-t2" x="700" y="66" text-anchor="middle" style="font-size:12px;letter-spacing:0">Lisboa</text>
<text class="sv-t3" x="20" y="82" style="font-size:11px;letter-spacing:0">aprobados sin consulta popular o ignorando los rechazos · Tratado Constitucional (2004) anulado → Lisboa</text>
<rect class="sv-soft" rx="2" x="20" y="94" width="360" height="48"/>
<text class="sv-t3" x="30" y="111">FORMA DEL ESTADO CAPITALISTA</text>
<text class="sv-t2" x="30" y="128" style="font-size:12px;letter-spacing:0">forma política del poder de la burguesía; los derechos políticos</text>
<text class="sv-t2" x="30" y="141" style="font-size:12px;letter-spacing:0">son conquistas proletarias siempre en riesgo (Termidor, Franco)</text>
<rect class="sv-soft" rx="2" x="392" y="94" width="348" height="48"/>
<text class="sv-t3" x="402" y="111">LA UE COMO «REVOLUCIÓN POR ARRIBA»</text>
<text class="sv-t2" x="402" y="128" style="font-size:12px;letter-spacing:0">las élites diseñan el cambio contra las clases populares:</text>
<text class="sv-t2" x="402" y="141" style="font-size:12px;letter-spacing:0">bloque imperialista que anula la participación obrera</text>
<rect class="sv-box-ink" rx="2" x="180" y="154" width="400" height="46"/>
<text class="sv-tw" x="380" y="172" text-anchor="middle">EJECUTIVOS NACIONALES</text>
<text class="sv-tw" x="380" y="188" text-anchor="middle" style="font-size:12.5px;letter-spacing:0">avance de los ejecutivos sobre los legislativos nacionales</text>
<path class="sv-line" d="M380 200 V220" marker-end="url(#m4-6-arrow)"/>
<rect class="sv-box-red" rx="2" x="250" y="222" width="260" height="50"/>
<text class="sv-tr" x="380" y="240" text-anchor="middle">CONSEJO EUROPEO (no electo)</text>
<text class="sv-t2" x="380" y="255" text-anchor="middle" style="font-size:12px;letter-spacing:0">cámara privada de los jefes de gobierno</text>
<text class="sv-t2" x="380" y="268" text-anchor="middle" style="font-size:12px;letter-spacing:0">fija el rumbo: rescates, NextGen, rearme</text>
<text class="sv-t3" x="20" y="236">Conferencias</text>
<text class="sv-t3" x="20" y="249">Intergubernamentales:</text>
<text class="sv-t3" x="20" y="262">constitución sin</text>
<text class="sv-t3" x="20" y="275">proceso constituyente</text>
<text class="sv-t3" x="740" y="236" text-anchor="end">rechazos ignorados:</text>
<text class="sv-t3" x="740" y="249" text-anchor="end">Dinamarca, Francia,</text>
<text class="sv-t3" x="740" y="262" text-anchor="end">Países Bajos, Irlanda</text>
<path class="sv-line" d="M300 272 V284 H130 V298" marker-end="url(#m4-6-arrow)"/>
<path class="sv-line" d="M380 272 V298" marker-end="url(#m4-6-arrow)"/>
<path class="sv-line" d="M460 272 V284 H630 V298" marker-end="url(#m4-6-arrow)"/>
<text class="sv-t3" x="136" y="295" style="font-size:11px;letter-spacing:0">nombra</text>
<rect class="sv-box" rx="2" x="20" y="300" width="220" height="64"/>
<text class="sv-t" x="130" y="318" text-anchor="middle">COMISIÓN</text>
<text class="sv-t2" x="130" y="333" text-anchor="middle" style="font-size:12px;letter-spacing:0">monopolio de la iniciativa</text>
<text class="sv-t2" x="130" y="346" text-anchor="middle" style="font-size:12px;letter-spacing:0">comisarios a dedo, sin veto individual</text>
<text class="sv-t3" x="130" y="360" text-anchor="middle" style="font-size:11px;letter-spacing:0">Spitzenkandidaten ignorados (2019)</text>
<rect class="sv-box" rx="2" x="270" y="300" width="220" height="64"/>
<text class="sv-t" x="380" y="318" text-anchor="middle">CONSEJO DE LA UE</text>
<text class="sv-t2" x="380" y="333" text-anchor="middle" style="font-size:12px;letter-spacing:0">ejecutivos que legislan</text>
<text class="sv-t2" x="380" y="346" text-anchor="middle" style="font-size:12px;letter-spacing:0">anula las enmiendas del Parlamento</text>
<text class="sv-t3" x="380" y="360" text-anchor="middle" style="font-size:11px;letter-spacing:0">proc. legislativo especial</text>
<rect class="sv-box" rx="2" x="520" y="300" width="220" height="64"/>
<text class="sv-t" x="630" y="318" text-anchor="middle">BCE</text>
<text class="sv-t2" x="630" y="333" text-anchor="middle" style="font-size:12px;letter-spacing:0">política monetaria blindada</text>
<text class="sv-t2" x="630" y="346" text-anchor="middle" style="font-size:12px;letter-spacing:0">independiente, mandato de inflación</text>
<text class="sv-t3" x="630" y="360" text-anchor="middle" style="font-size:11px;letter-spacing:0">arts. 125 · 127 · 130 TFUE</text>
<path class="sv-line-dash" d="M380 364 V384" marker-end="url(#m4-6-arrow)"/>
<text class="sv-t3" x="390" y="378">codecisión limitada</text>
<rect class="sv-box-blue" rx="2" x="270" y="386" width="220" height="50"/>
<text class="sv-tb" x="380" y="404" text-anchor="middle">PARLAMENTO EUROPEO</text>
<text class="sv-t2" x="380" y="419" text-anchor="middle" style="font-size:12px;letter-spacing:0">único órgano electo</text>
<text class="sv-t2" x="380" y="432" text-anchor="middle" style="font-size:12px;letter-spacing:0">sin iniciativa: sólo aprueba o rechaza</text>
<text class="sv-t3" x="500" y="408">«ni tiene poder</text>
<text class="sv-t3" x="500" y="421">ni es legislativo»</text>
<path class="sv-line" d="M130 364 V481 H178" marker-end="url(#m4-6-arrow)"/>
<path class="sv-line" d="M630 364 V481 H582" marker-end="url(#m4-6-arrow)"/>
<path class="sv-line" d="M380 436 V454" marker-end="url(#m4-6-arrow)"/>
<rect class="sv-box-gold" rx="2" x="180" y="456" width="400" height="50"/>
<text class="sv-tg" x="380" y="474" text-anchor="middle">TJUE: constitucionaliza los tratados</text>
<text class="sv-t2" x="380" y="489" text-anchor="middle" style="font-size:12px;letter-spacing:0">efecto directo · primacía · reconocimiento mutuo</text>
<text class="sv-t2" x="380" y="502" text-anchor="middle" style="font-size:12px;letter-spacing:0">sin control democrático · Viking, Laval: contra la huelga</text>
<text class="sv-t3" x="20" y="474">ordoliberalismo:</text>
<text class="sv-t3" x="20" y="487">reglas fuera del</text>
<text class="sv-t3" x="20" y="500">debate político</text>
<text class="sv-t3" x="740" y="474" text-anchor="end">PEC: 3 % · 60 %</text>
<text class="sv-t3" x="740" y="487" text-anchor="end">no bail-out</text>
<text class="sv-t3" x="740" y="500" text-anchor="end">austeridad al sur</text>
<path class="sv-line-dash" d="M380 506 V526" marker-end="url(#m4-6-arrow)"/>
<rect class="sv-soft" rx="2" x="20" y="528" width="720" height="38"/>
<text class="sv-t" x="380" y="544" text-anchor="middle">PROLETARIADO EUROPEO</text>
<text class="sv-t2" x="380" y="559" text-anchor="middle">sin referéndum, sin fiscalización, sin participación en las decisiones</text>
<text class="sv-t3" x="20" y="584" style="font-size:11px;letter-spacing:0">LOS ESTADOS UNIDOS DE EUROPA: CUATRO POSICIONES · «ninguna revolución nacional sobrevivirá si no se transforma en europea»</text>
<rect class="sv-box" rx="2" x="20" y="594" width="176" height="64"/>
<text class="sv-t" x="108" y="612" text-anchor="middle">UE oligárquica</text>
<text class="sv-t2" x="108" y="627" text-anchor="middle" style="font-size:12px;letter-spacing:0">europeísmo de los partidos</text>
<text class="sv-t2" x="108" y="640" text-anchor="middle" style="font-size:12px;letter-spacing:0">tradicionales: centralización</text>
<text class="sv-t2" x="108" y="653" text-anchor="middle" style="font-size:12px;letter-spacing:0">político-militar (ReArm)</text>
<rect class="sv-box" rx="2" x="204" y="594" width="176" height="64"/>
<text class="sv-t" x="292" y="612" text-anchor="middle">Fragmentación</text>
<text class="sv-t2" x="292" y="627" text-anchor="middle" style="font-size:11.5px;letter-spacing:0">nacionalismo de extrema derecha</text>
<text class="sv-t2" x="292" y="640" text-anchor="middle" style="font-size:12px;letter-spacing:0">(y chovinismo de izquierda):</text>
<text class="sv-t2" x="292" y="653" text-anchor="middle" style="font-size:12px;letter-spacing:0">naturaliza el Estado-nación</text>
<rect class="sv-box" rx="2" x="388" y="594" width="176" height="64"/>
<text class="sv-t" x="476" y="612" text-anchor="middle">EE. UU. de Europa</text>
<text class="sv-t2" x="476" y="627" text-anchor="middle" style="font-size:12px;letter-spacing:0">Kautsky: vía de paz capitalista</text>
<text class="sv-t2" x="476" y="640" text-anchor="middle" style="font-size:12px;letter-spacing:0">Lenin: bajo el capitalismo,</text>
<text class="sv-t2" x="476" y="653" text-anchor="middle" style="font-size:12px;letter-spacing:0">imposible o reaccionaria</text>
<rect class="sv-box-red" rx="2" x="572" y="594" width="176" height="64"/>
<text class="sv-tr" x="660" y="612" text-anchor="middle">EE. UU. Socialistas</text>
<text class="sv-t2" x="660" y="627" text-anchor="middle" style="font-size:12px;letter-spacing:0">consigna «invulnerable» ligada</text>
<text class="sv-t2" x="660" y="640" text-anchor="middle" style="font-size:12px;letter-spacing:0">al derrocamiento revolucionario</text>
<text class="sv-t2" x="660" y="653" text-anchor="middle" style="font-size:12px;letter-spacing:0">hoy: disolver la UE y los Estados</text>
</svg>
