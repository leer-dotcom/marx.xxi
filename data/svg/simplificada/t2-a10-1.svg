<svg xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama de bifurcación: la crisis ecosocial se ramifica en tecnoutopismo, catastrofismo y pacto verde; la versión crítica del pacto verde (negacionismo verde, reforma permanente) sigue una estrategia neogramsciana que confía en el Estado capitalista, atraviesa el embudo de los mecanismos de contención del Estado y las tres contingencias de actuar contra la acumulación, y desemboca en transición capitalista, ecofascismo o colapso; la vía del poder socialista independiente, con las reformas como medio, conduce al comunismo sin crecimiento; una nota recoge los referentes históricos del manifiesto" role="img" viewBox="0 0 760 636" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-10-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="44" rx="2" width="250" x="255" y="12"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="31">Crisis ecosocial</text>
<text class="sv-tw" text-anchor="middle" x="380" y="47" style="font-size:11.5px">inflación de 2022, carestía, revueltas</text>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M380 56 V72 H105 V90"></path>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M380 56 V72 H275 V90"></path>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M380 56 V72 H580 V90"></path>
<rect class="sv-box" height="44" rx="2" width="150" x="30" y="90"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="109">Tecnoutopismo</text>
<text class="sv-t3" text-anchor="middle" x="105" y="125">innovación salvadora</text>
<rect class="sv-box" height="44" rx="2" width="150" x="200" y="90"></rect>
<text class="sv-t" text-anchor="middle" x="275" y="109">Catastrofismo</text>
<text class="sv-t3" text-anchor="middle" x="275" y="125">colapsología, huida</text>
<text class="sv-t3" text-anchor="middle" x="190" y="154">apolíticos: descartados por el pacto verde</text>
<rect class="sv-box-green" height="44" rx="2" width="300" x="430" y="90"></rect>
<text class="sv-tgr" text-anchor="middle" x="580" y="109">Pacto verde / Green New Deal</text>
<text class="sv-t3" text-anchor="middle" x="580" y="125">proyecto político: relanzar la acumulación</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="134" y2="158"></line>
<rect class="sv-box" height="74" rx="2" width="300" x="430" y="158"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="178">Versión crítica: Tejero y Santiago</text>
<text class="sv-t2" text-anchor="middle" x="580" y="194" style="font-size:12.5px">diagnóstico: descarbonizar, eficiencia, circular</text>
<text class="sv-t2" text-anchor="middle" x="580" y="209" style="font-size:12.5px">medios: Estado, elecciones, capitales «verdes»</text>
<text class="sv-t3" text-anchor="middle" x="580" y="225">«negacionismo verde» · «reforma permanente»</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="232" y2="256"></line>
<rect class="sv-box" height="44" rx="2" width="300" x="430" y="256"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="275">Estrategia neogramsciana</text>
<text class="sv-t2" text-anchor="middle" x="580" y="291" style="font-size:12px">bloque histórico con capitales «verdes»; lo electoral</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="300" y2="324"></line>
<rect class="sv-box" height="44" rx="2" width="300" x="430" y="324"></rect>
<text class="sv-t" text-anchor="middle" x="580" y="343">El Estado capitalista</text>
<text class="sv-t2" text-anchor="middle" x="580" y="359" style="font-size:12px">instancia separada; de clase, pero no instrumento</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="368" y2="392"></line>
<path class="sv-box-red" d="M430 392 L730 392 L700 452 L460 452 Z"></path>
<text class="sv-tr" text-anchor="middle" x="580" y="412">Mecanismos de contención del Estado</text>
<text class="sv-t2" text-anchor="middle" x="580" y="429" style="font-size:11.5px">procedimientos · intereses de aparatos · lógica estatal</text>
<text class="sv-t2" text-anchor="middle" x="580" y="444" style="font-size:11.5px">cooptación de representantes (Syriza)</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="580" x2="580" y1="452" y2="472"></line>
<rect class="sv-soft" height="58" rx="2" width="300" x="430" y="472"></rect>
<text class="sv-t3" text-anchor="middle" x="580" y="488" style="font-size:11px">¿puede el Estado ir contra la acumulación?</text>
<text class="sv-t2" text-anchor="middle" x="580" y="504" style="font-size:11.5px">sí, pero: pierde recursos · conflicto con el capital</text>
<text class="sv-t2" text-anchor="middle" x="580" y="518" style="font-size:11.5px">peores condiciones de vida → inviable electoralmente</text>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M580 530 V544 H390 V558"></path>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M580 530 V544 H540 V558"></path>
<path class="sv-line" marker-end="url(#m2-10-arrow)" d="M580 530 V544 H675 V558"></path>
<rect class="sv-box" height="44" rx="2" width="140" x="320" y="558"></rect>
<text class="sv-t" text-anchor="middle" x="390" y="577">Transición verde</text>
<text class="sv-t2" text-anchor="middle" x="390" y="593">capitalista</text>
<rect class="sv-box" height="44" rx="2" width="130" x="475" y="558"></rect>
<text class="sv-t" text-anchor="middle" x="540" y="585">Ecofascismo</text>
<rect class="sv-box" height="44" rx="2" width="110" x="620" y="558"></rect>
<text class="sv-t" text-anchor="middle" x="675" y="585">Colapso</text>
<text class="sv-t3" text-anchor="middle" x="525" y="624">la crisis decidirá entre estas salidas si no hay poder independiente</text>
<path class="sv-line-dash" marker-end="url(#m2-10-arrow)" d="M430 222 H180 V256"></path>
<text class="sv-t3" text-anchor="start" x="195" y="240" style="font-size:10.5px">la discrepancia está en los medios,</text>
<text class="sv-t3" text-anchor="start" x="195" y="253" style="font-size:10.5px">no en el diagnóstico</text>
<rect class="sv-box-blue" height="58" rx="2" width="300" x="30" y="256"></rect>
<text class="sv-tb" text-anchor="middle" x="180" y="276">Poder socialista independiente</text>
<text class="sv-t2" text-anchor="middle" x="180" y="292" style="font-size:12.5px">reformas como medio, revolución como fin</text>
<text class="sv-t2" text-anchor="middle" x="180" y="307" style="font-size:12.5px">(Luxemburgo frente al falso dilema)</text>
<line class="sv-line" marker-end="url(#m2-10-arrow)" x1="180" x2="180" y1="314" y2="338"></line>
<rect class="sv-box-blue" height="44" rx="2" width="250" x="55" y="338"></rect>
<text class="sv-tb" text-anchor="middle" x="180" y="357">Comunismo sin crecimiento</text>
<text class="sv-t3" text-anchor="middle" x="180" y="374">frente a la transición capitalista</text>
<rect class="sv-soft" height="76" rx="2" width="300" x="30" y="402"></rect>
<text class="sv-t3" text-anchor="middle" x="180" y="419" style="font-size:10.5px">LOS REFERENTES HISTÓRICOS DEL MANIFIESTO</text>
<text class="sv-t2" text-anchor="middle" x="180" y="437" style="font-size:11.5px">New Deal y «espíritu del 45»: presión obrera hoy ausente</text>
<text class="sv-t2" text-anchor="middle" x="180" y="452" style="font-size:11.5px">ofensiva neoliberal: revolución de y para las élites</text>
<text class="sv-t2" text-anchor="middle" x="180" y="467" style="font-size:11.5px">«larga marcha» de los Verdes: camino a ninguna parte</text>
</svg>
