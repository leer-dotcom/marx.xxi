<svg xmlns="http://www.w3.org/2000/svg" aria-label="Cadena causal en dos fases: fase ascendente que produce la socialdemocracia clásica (con una nota sobre su contenido material: salario indirecto, dependencia, redistribución y nacionalismo) y fase de crisis que, pasando por la fragmentación de la clase y el péndulo integración-resistencialismo, desemboca en el populismo, su moderación y la represión; una salida alternativa lleva a la autoorganización socialista" role="img" viewBox="0 0 760 590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="start" x="20" y="22">FASE 1 · ascenso de la acumulación</text>
<rect class="sv-box" height="50" rx="2" width="160" x="20" y="32"/>
<text class="sv-t" text-anchor="middle" x="100" y="53">Desarrollo de las</text>
<text class="sv-t" text-anchor="middle" x="100" y="69">fuerzas productivas</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="180" x2="205" y1="57" y2="57"/>
<rect class="sv-box" height="50" rx="2" width="160" x="205" y="32"/>
<text class="sv-t" text-anchor="middle" x="285" y="53">Unidad relativa</text>
<text class="sv-t" text-anchor="middle" x="285" y="69">de la clase</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="365" x2="390" y1="57" y2="57"/>
<rect class="sv-box" height="50" rx="2" width="160" x="390" y="32"/>
<text class="sv-t" text-anchor="middle" x="470" y="53">Centralización de</text>
<text class="sv-t" text-anchor="middle" x="470" y="69">capital en el Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="550" x2="575" y1="57" y2="57"/>
<rect class="sv-box-red" height="50" rx="2" width="160" x="575" y="32"/>
<text class="sv-tr" text-anchor="middle" x="655" y="53" style="font-size:13.4px;letter-spacing:0">Socialdemocracia clásica</text>
<text class="sv-t2" text-anchor="middle" x="655" y="69">salario indirecto</text>
<rect class="sv-soft" height="54" rx="2" width="560" x="20" y="92"/>
<text class="sv-t3" text-anchor="start" x="30" y="108">contenido material de la socialdemocracia clásica</text>
<text class="sv-t2" text-anchor="start" x="30" y="124" style="font-size:12px">Las «concesiones» (sanidad, pensiones) son salario indirecto: valor ya producido por la clase.</text>
<text class="sv-t2" text-anchor="start" x="30" y="138" style="font-size:12px">Reproducen la dependencia del capital y del Estado-nación: redistribución y deriva nacionalista.</text>
<line class="sv-line-dash" x1="655" x2="655" y1="82" y2="118"/>
<text class="sv-t3" text-anchor="middle" x="700" y="104">ofensiva</text>
<text class="sv-t3" text-anchor="middle" x="700" y="118">neoliberal</text>
<path class="sv-line-dash" d="M655 118 V160 H140 V172" marker-end="url(#m2-2-arrow)"/>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="655" x2="582" y1="118" y2="118"/>
<text class="sv-t3" text-anchor="start" x="20" y="168">FASE 2 · crisis</text>
<rect class="sv-box" height="50" rx="2" width="160" x="20" y="174"/>
<text class="sv-t2" text-anchor="middle" x="100" y="192">Automatización,</text>
<text class="sv-t2" text-anchor="middle" x="100" y="206">internacionalización</text>
<text class="sv-t2" text-anchor="middle" x="100" y="220">y desempleo</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="180" x2="205" y1="199" y2="199"/>
<rect class="sv-box" height="50" rx="2" width="160" x="205" y="174"/>
<text class="sv-t" text-anchor="middle" x="285" y="195">Fragmentación de</text>
<text class="sv-t" text-anchor="middle" x="285" y="211">la clase en estratos</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="365" x2="390" y1="199" y2="199"/>
<rect class="sv-box" height="50" rx="2" width="160" x="390" y="174"/>
<text class="sv-t" text-anchor="middle" x="470" y="195">Crisis de la social-</text>
<text class="sv-t" text-anchor="middle" x="470" y="211">democracia clásica</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="550" x2="575" y1="199" y2="199"/>
<rect class="sv-box-gold" height="50" rx="2" width="160" x="575" y="174"/>
<text class="sv-tg" text-anchor="middle" x="655" y="195">Ciudadanismo</text>
<text class="sv-t2" text-anchor="middle" x="655" y="211">interclasista</text>
<text class="sv-t3" text-anchor="start" x="20" y="238">aparece invertida como «fin de la lucha de clases»</text>
<path class="sv-line" d="M655 224 V236 H420 V256" marker-end="url(#m2-2-arrow)"/>
<path class="sv-line" d="M655 236 H645 V256" marker-end="url(#m2-2-arrow)"/>
<rect class="sv-box" height="50" rx="2" width="180" x="330" y="258"/>
<text class="sv-t" text-anchor="middle" x="420" y="279">Integración:</text>
<text class="sv-t2" text-anchor="middle" x="420" y="295">demandas al Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" marker-start="url(#m2-2-arrow)" x1="512" x2="553" y1="283" y2="283"/>
<rect class="sv-box" height="50" rx="2" width="180" x="555" y="258"/>
<text class="sv-t" text-anchor="middle" x="645" y="279">Resistencialismo:</text>
<text class="sv-t2" text-anchor="middle" x="645" y="295">«afuera» del capital</text>
<text class="sv-t3" text-anchor="middle" x="532" y="326">péndulo movimentista:</text>
<text class="sv-t3" text-anchor="middle" x="532" y="340">ambos polos se agotan</text>
<text class="sv-t3" text-anchor="middle" x="532" y="354">en el Estado</text>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="420" x2="420" y1="308" y2="366"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="645" x2="645" y1="308" y2="366"/>
<rect class="sv-box-red" height="70" rx="2" width="405" x="330" y="368"/>
<text class="sv-tr" text-anchor="middle" x="532" y="388">POPULISMO: «ciudadanismo para tiempos de crisis»</text>
<text class="sv-t2" text-anchor="middle" x="532" y="405" style="font-size:12px">síntesis de ciudadanismo y movimentismo (Podemos, Syriza, Sumar)</text>
<text class="sv-t2" text-anchor="middle" x="532" y="420" style="font-size:12px">Pueblo · Líder · anti-pueblo («casta») · lógica de la demanda</text>
<rect class="sv-box-gold" height="70" rx="2" width="250" x="20" y="368"/>
<text class="sv-tg" text-anchor="middle" x="145" y="388">Programa de las clases medias</text>
<text class="sv-t2" text-anchor="middle" x="145" y="405">frenar su desposesión</text>
<text class="sv-t2" text-anchor="middle" x="145" y="420">canalizándola por el Estado</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="270" x2="330" y1="403" y2="403"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="425" x2="425" y1="438" y2="466"/>
<rect class="sv-box" height="56" rx="2" width="220" x="330" y="468"/>
<text class="sv-t" text-anchor="middle" x="440" y="486">Moderación de promesas</text>
<text class="sv-t2" text-anchor="middle" x="440" y="501">→ cinismo</text>
<text class="sv-t2" text-anchor="middle" x="440" y="516" style="font-size:12px">limosnas presentadas como conquistas</text>
<line class="sv-line-red" marker-end="url(#m2-2-arrow)" x1="550" x2="570" y1="496" y2="496"/>
<rect class="sv-box-ink" height="56" rx="2" width="165" x="570" y="468"/>
<text class="sv-tw" text-anchor="middle" x="652" y="492">Miedo → represión</text>
<text class="sv-tw" text-anchor="middle" x="652" y="510">(Cádiz, Chile)</text>
<rect class="sv-box-green" height="56" rx="2" width="250" x="20" y="468"/>
<text class="sv-tgr" text-anchor="middle" x="145" y="492">Salida: revuelta espontánea</text>
<text class="sv-tgr" text-anchor="middle" x="145" y="510">→ autoorganización socialista</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="330" x2="270" y1="512" y2="512"/>
<rect class="sv-soft" height="40" rx="2" width="715" x="20" y="540"/>
<line class="sv-line" marker-end="url(#m2-2-arrow)" x1="32" x2="66" y1="554" y2="554"/>
<text class="sv-t3" text-anchor="start" x="72" y="558">encadenamiento causal</text>
<line class="sv-line-dash" marker-end="url(#m2-2-arrow)" x1="230" x2="264" y1="554" y2="554"/>
<text class="sv-t3" text-anchor="start" x="270" y="558">contenido real / salida</text>
<line class="sv-line-red" marker-end="url(#m2-2-arrow)" x1="440" x2="474" y1="554" y2="554"/>
<text class="sv-t3" text-anchor="start" x="480" y="558">cuando la máquina de ilusiones se atasca</text>
<text class="sv-t3" text-anchor="start" x="32" y="573">la única bifurcación real es la autoorganización de la clase en un movimiento socialista</text>
</svg>
