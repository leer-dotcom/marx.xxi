<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: el feminismo actual como movimiento de masas interclasista frente a un movimiento obrero en declive, la lección bolchevique y la necesidad de ruptura. Línea temporal en cuatro estaciones: Paleolítico igualitario, agricultura y ganadería con división sexual del trabajo, propiedad privada con familia patriarcal y capitalismo con familia monogámica moderna e igualdad formal, con lo que se hereda en cada paso. En medio, el enfoque marxista: sistema de sexo-género de Rubin, familia monogámica moderna como lugar concreto de la opresión, herencia más tendencias objetivas (brecha salarial, crítica de la funcionalidad) y la cuestión trans. Debajo, el ciclo de la lógica reformista de la identidad en siete pasos, desde el ascenso de la lucha espontánea hasta la integración en el Estado, y la tarea: una teoría marxista de las opresiones específicas contra el esencialismo." role="img" viewBox="0 0 760 654" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-8-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">PUNTO DE PARTIDA: EL MARXISMO ANTE LA CUESTIÓN DE SEXO-GÉNERO</text>
<rect class="sv-soft" height="30" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="43">El feminismo de hoy es un movimiento de masas interclasista y reformista; en su base «sólo se puede rascar mediante la ruptura».</text>
<text class="sv-t3" x="20" y="78">HISTORIA MATERIALISTA DE LA OPRESIÓN DE SEXO-GÉNERO (ENGELS, MORGAN, ANTROPOLOGÍA ACTUAL)</text>
<rect class="sv-box" height="50" rx="2" width="160" x="20" y="86"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="104">Paleolítico</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="118">comunidades igualitarias,</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="131">sin división sexual</text>
<rect class="sv-box" height="50" rx="2" width="160" x="195" y="86"></rect>
<text class="sv-t" text-anchor="middle" x="275" y="104">Agricultura, ganadería</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="275" y="118">división sexual del</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="275" y="131">trabajo, sin prejuicios</text>
<rect class="sv-box-gold" height="50" rx="2" width="180" x="370" y="86"></rect>
<text class="sv-tg" text-anchor="middle" x="460" y="104">Propiedad privada</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="118">familia patriarcal;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="131">subordinación jurídica</text>
<rect class="sv-box-red" height="50" rx="2" width="175" x="565" y="86"></rect>
<text class="sv-tr" text-anchor="middle" x="652.5" y="104">Capitalismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652.5" y="118">familia monogámica moderna</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652.5" y="131">+ igualdad formal</text>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="180" x2="195" y1="111" y2="111"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="355" x2="370" y1="111" y2="111"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="550" x2="565" y1="111" y2="111"></line>
<text class="sv-t3" text-anchor="middle" x="100" y="152">también mujeres en la caza</text>
<text class="sv-t3" text-anchor="middle" x="275" y="152">lega: roles productivos</text>
<text class="sv-t3" text-anchor="middle" x="460" y="152">lega: herencia vs. ganado</text>
<text class="sv-t3" text-anchor="middle" x="652" y="152">hereda: carga doméstica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="176">el feminismo es expresión social de las nuevas relaciones de producción: cada «ola» sigue a un pico de incorporación femenina al salario</text>
<text class="sv-tr" text-anchor="middle" x="380" y="195">hoy: posición disimétrica sin patriarcado institucional; opresión «íntegramente capitalista»</text>
<text class="sv-t3" x="20" y="220">UN ENFOQUE MARXISTA</text>
<rect class="sv-box-gold" height="56" rx="2" width="230" x="20" y="228"></rect>
<text class="sv-tg" style="font-size:13px" text-anchor="middle" x="135" y="248">Sistema de sexo-género (Rubin)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135" y="264">transforma la sexualidad biológica en</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="135" y="278">productos de la actividad humana</text>
<rect class="sv-box-red" height="56" rx="2" width="230" x="265" y="228"></rect>
<text class="sv-tr" style="font-size:13px" text-anchor="middle" x="380" y="248">Familia monogámica moderna</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="264">lugar concreto de la opresión;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="278">no hay patriarcado que superar</text>
<rect class="sv-box-blue" height="56" rx="2" width="230" x="510" y="228"></rect>
<text class="sv-tb" style="font-size:13px" text-anchor="middle" x="625" y="248">Herencia + tendencias objetivas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625" y="264">brecha salarial: herencia patriarcal</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="625" y="278">+ capital, no conspiración</text>
<text class="sv-t3" x="20" y="308">LA CUESTIÓN TRANS</text>
<rect class="sv-soft" height="30" rx="2" width="720" x="20" y="316"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="335">Hecho empírico (se explica, no se debate); división en el seno de la clase obrera: compromiso explícito contra la transfobia.</text>
<text class="sv-t3" x="20" y="372">LÓGICA REFORMISTA DE LA IDENTIDAD (CICLO)</text>
<rect class="sv-box" height="56" rx="2" width="160" x="20" y="382"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="401">1. Ascenso de la</text>
<text class="sv-t" text-anchor="middle" x="100" y="416">lucha espontánea</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="432">cambio socioeconómico</text>
<rect class="sv-box" height="56" rx="2" width="160" x="200" y="382"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="401">2. Pugna por la</text>
<text class="sv-t" text-anchor="middle" x="280" y="416">representación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="432">puestos, fama, proyectos</text>
<rect class="sv-box" height="56" rx="2" width="160" x="380" y="382"></rect>
<text class="sv-t" text-anchor="middle" x="460" y="401">3. Cooptación</text>
<text class="sv-t" text-anchor="middle" x="460" y="416">estatal y mediática</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="432">de los más absorbibles</text>
<rect class="sv-box-blue" height="56" rx="2" width="180" x="560" y="382"></rect>
<text class="sv-tb" text-anchor="middle" x="650" y="401">4. Blindaje de la</text>
<text class="sv-tb" text-anchor="middle" x="650" y="416">identidad oprimida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="650" y="432">cohesiona la amalgama</text>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="180" x2="200" y1="410" y2="410"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="360" x2="380" y1="410" y2="410"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="540" x2="560" y1="410" y2="410"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="650" x2="650" y1="438" y2="482"></line>
<text class="sv-t3" text-anchor="end" x="642" y="464">pugna por la tarta finita de la representación</text>
<rect class="sv-box-blue" height="56" rx="2" width="180" x="560" y="482"></rect>
<text class="sv-tb" text-anchor="middle" x="650" y="502">5. Esencialismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="650" y="518">identidad como causa</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="650" y="532">presocial, metahistórica</text>
<rect class="sv-box-red" height="56" rx="2" width="160" x="380" y="482"></rect>
<text class="sv-tr" text-anchor="middle" x="460" y="501">6. Ocultamiento de</text>
<text class="sv-tr" text-anchor="middle" x="460" y="516">las relaciones sociales</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="532">filtro: «casos aislados»</text>
<rect class="sv-box-ink" height="56" rx="2" width="160" x="200" y="482"></rect>
<text class="sv-tw" text-anchor="middle" x="280" y="501">7. Integración</text>
<text class="sv-tw" text-anchor="middle" x="280" y="516">en el Estado</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="280" y="532">metaboliza lo absorbible</text>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="560" x2="540" y1="510" y2="510"></line>
<line class="sv-line" marker-end="url(#m1-8-arrow)" x1="380" x2="360" y1="510" y2="510"></line>
<path class="sv-line-dash" marker-end="url(#m1-8-arrow)" d="M200 510 H100 V440"></path>
<text class="sv-t3" x="20" y="562">sin horizonte comunista, el ciclo se repite: ruptura política e ideológica como única salida</text>
<rect class="sv-box-green" height="48" rx="2" width="720" x="20" y="574"></rect>
<text class="sv-tgr" text-anchor="middle" x="380" y="594">Tarea: una teoría marxista de las formas específicas de opresión capitalista, contra el esencialismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="612">el esencialismo es cristalización ideológica del reformismo y reproduce sus lógicas: la identidad pasa de resultado a causa</text>
<text class="sv-t3" text-anchor="middle" x="380" y="644">flecha gris: sucesión (lo que cada estación lega a la siguiente) · flecha discontinua: el ciclo vuelve a empezar</text>
</svg>
