<text class="sv-tgr" text-anchor="middle" x="108" y="230">Formas organizativas</text>
<text class="sv-tgr" text-anchor="middle" x="108" y="247">transitorias</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="108" y="261">frente de mujeres, consejos,</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="108" y="272">juventud, artista colectivo</text>
<rect class="sv-box-gold" rx="2" x="292" y="210" width="176" height="66"/>
<text class="sv-tg" text-anchor="middle" x="380" y="236">Independencia política</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="257">objetivo estratégico de la fase</text>
<rect class="sv-box-gold" rx="2" x="564" y="210" width="176" height="66"/>
<text class="sv-tg" text-anchor="middle" x="652" y="232">Hegemonía socialista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652" y="250">no populista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652" y="266">económica · política · militar</text>
<rect class="sv-box-green" rx="2" x="20" y="312" width="176" height="54"/>
<text class="sv-tgr" text-anchor="middle" x="108" y="331">Escalas: Estado,</text>
<text class="sv-tgr" text-anchor="middle" x="108" y="347">Europa, internacional</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="108" y="361">sin legitimar ningún marco</text>
