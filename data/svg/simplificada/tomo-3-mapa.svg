<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="652" y="541">esquematismo, secta de círculo</text>
<rect class="sv-soft" rx="2" x="20" y="486" width="496" height="118"/>
<text class="sv-t3" x="30" y="504">rojo: condiciones materiales · azul: conciencia y táctica · dorado: independencia,</text>
<text class="sv-t3" x="30" y="518">hegemonía y Estado · negro: Partido (eje) · verde: formas y escalas organizativas</text>
<text class="sv-t3" x="30" y="532">gris y discontinua: desviaciones que obstaculizan · (n): artículos</text>
<text class="sv-t2" style="font-size:11.5px" x="30" y="552">1 · Bizkarra y Beitia — Lucha cultural</text>
<text class="sv-t2" style="font-size:11.5px" x="30" y="566">2 · Ruiz — Economía política del declive</text>
<text class="sv-t2" style="font-size:11.5px" x="30" y="580">3 · Fernández Barcina — Conciencia socialista</text>
<text class="sv-t2" style="font-size:11.5px" x="30" y="594">4 · Pérez — Frente socialista de mujeres</text>
<text class="sv-t2" style="font-size:11.5px" x="274" y="552">5 · Juncales y Liber — Todos los territorios</text>
<text class="sv-t2" style="font-size:11.5px" x="274" y="566">6 · Gallardo — Crisis ecológica y hegemonía</text>
<text class="sv-t2" style="font-size:11.5px" x="274" y="580">7 · Miasni — Acerca del esquematismo</text>
<text class="sv-t2" style="font-size:11.5px" x="274" y="594">8 · Aguiriano — ¿Qué (des)hacer? El Partido</text>
