<rect class="sv-box-red" rx="2" x="292" y="30" width="176" height="54"/>
<text class="sv-tr" text-anchor="middle" x="380" y="50">Crisis de acumulación</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="68">declive capitalista</text>
