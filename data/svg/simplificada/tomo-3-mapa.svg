<text class="sv-tb" text-anchor="middle" x="652" y="139">Táctica cultural</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652" y="155">unificar · hegemonizar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="652" y="169">lucha cultural socialista</text>
