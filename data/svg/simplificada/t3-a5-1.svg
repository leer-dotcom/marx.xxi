<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, qué significa organizar el socialismo: recomponer al proletariado como sujeto político hacia el Partido, con la organización como mediación entre subjetividades y conciencia socialista. A la izquierda, mapa de capas superpuestas (tejido global, Unión Europea, Estado español, naciones oprimidas y el resto, megaciudad, provincia, ruralidad y barrio) articuladas por el trabajo político; a la derecha, los dos límites de la táctica, la propuesta de marcos de referencia racionales y la regla de acumulación de fuerzas; debajo, las tres respuestas descartadas: federalismo, nacionalismo revolucionario y nacionalismo español, y la conclusión: hacer políticamente posible lo estratégicamente necesario" role="img" viewBox="0 0 760 556" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="20">QUÉ SIGNIFICA «ORGANIZAR EL SOCIALISMO EN TODOS LOS TERRITORIOS»</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="20" y="45" style="font-size:11.5px;letter-spacing:0">Recomponer al proletariado como sujeto político en tránsito hacia el Partido: una constelación de organizaciones que permeen en todo</text>
<text class="sv-t2" x="20" y="60" style="font-size:11.5px;letter-spacing:0">contexto. La organización es mediación entre las subjetividades existentes y la conciencia socialista: las atiende para transformarlas.</text>

<text class="sv-t3" x="12" y="92">CAPAS SUPERPUESTAS</text>
<rect class="sv-box" height="240" rx="2" width="360" x="12" y="102"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="122">Tejido global · organización internacional</text>
<text class="sv-t2" text-anchor="middle" x="192" y="137" style="font-size:11.3px;letter-spacing:0">premisa: la organización ha de ser internacional</text>
<rect class="sv-box-blue" height="186" rx="2" width="320" x="32" y="146"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="166">Unión Europea · escala mínima</text>
<text class="sv-t2" text-anchor="middle" x="192" y="181" style="font-size:11.3px;letter-spacing:0">bloque supraestatal: misma necesidad, sin europeísmo</text>
<rect class="sv-box-gold" height="132" rx="2" width="280" x="52" y="190"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="210">Estado español · marco ineludible</text>
<text class="sv-t2" text-anchor="middle" x="192" y="225" style="font-size:11px;letter-spacing:0">marco de la acumulación y de las luchas espontáneas</text>
<rect class="sv-box-red" height="44" rx="2" width="120" x="68" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="128" y="253" style="font-size:12.2px;letter-spacing:0">Naciones oprimidas</text>
<text class="sv-t2" text-anchor="middle" x="128" y="269" style="font-size:10.7px;letter-spacing:0">Cataluña, Euskal Herria</text>
<rect class="sv-box" height="44" rx="2" width="120" x="196" y="234"></rect>
<text class="sv-t" text-anchor="middle" x="256" y="253">«El resto»</text>
<text class="sv-t2" text-anchor="middle" x="256" y="269" style="font-size:11px;letter-spacing:0">heterogéneo, no nación</text>
<rect class="sv-box-green" height="36" rx="2" width="248" x="68" y="284"></rect>
<text class="sv-t" text-anchor="middle" x="192" y="300" style="font-size:13px;letter-spacing:0">Megaciudad · provincia · ruralidad</text>
<text class="sv-t2" text-anchor="middle" x="192" y="314" style="font-size:11px;letter-spacing:0">islas turistificadas · barrio</text>
<text class="sv-tr" text-anchor="middle" x="192" y="364">El trabajo político articula las capas</text>
<text class="sv-t2" text-anchor="middle" x="192" y="380" style="font-size:11.3px;letter-spacing:0">no adscripción a una sola; «actúa localmente» borra la mediación</text>

<text class="sv-t3" x="400" y="92">DOS LÍMITES DE LA TÁCTICA</text>
<rect class="sv-box" height="48" rx="2" width="348" x="400" y="102"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="122">Articularse a escala estatal y europea</text>
<text class="sv-t2" text-anchor="middle" x="574" y="139" style="font-size:12px">sin legitimar el marco: ni nacionalismo ni europeísmo</text>
<rect class="sv-box" height="48" rx="2" width="348" x="400" y="160"></rect>
<text class="sv-t" text-anchor="middle" x="574" y="180">Trabajar las particularidades nacionales</text>
<text class="sv-t2" text-anchor="middle" x="574" y="197" style="font-size:12px">desde el internacionalismo, sin negarlas ni mistificarlas</text>
<path class="sv-line" d="M574 208 V222" marker-end="url(#m3-5-arrow)"></path>
<rect class="sv-box-ink" height="68" rx="2" width="348" x="400" y="224"></rect>
<text class="sv-tw" text-anchor="middle" x="574" y="246">Propuesta: marcos de referencia</text>
<text class="sv-tw" text-anchor="middle" x="574" y="264">racionales y estratégicos</text>
<text class="sv-tw" text-anchor="middle" x="574" y="282" style="font-size:11.4px;letter-spacing:0">criterio: capacidad de intervenir políticamente a esa escala</text>
<rect class="sv-soft" height="40" rx="2" width="348" x="400" y="300"></rect>
<text class="sv-t2" text-anchor="middle" x="574" y="317" style="font-size:11.3px;letter-spacing:0">Fase actual: el proletariado no puede disputar territorios;</text>
<text class="sv-t2" text-anchor="middle" x="574" y="332" style="font-size:11.3px;letter-spacing:0">acumulación de fuerzas y elección táctica de dónde ponerlas</text>

<text class="sv-t3" x="12" y="408">TRES RESPUESTAS EN VÍA MUERTA</text>
<rect class="sv-box-red" height="60" rx="2" width="235" x="12" y="418"></rect>
<text class="sv-tr" text-anchor="middle" x="129" y="440">Federalismo</text>
<text class="sv-t2" text-anchor="middle" x="129" y="457" style="font-size:12px">negación abstracta de la opresión</text>
<text class="sv-t2" text-anchor="middle" x="129" y="471" style="font-size:12px">nacional → acaba en nacionalismo español</text>
<rect class="sv-box-red" height="60" rx="2" width="235" x="262" y="418"></rect>
<text class="sv-tr" text-anchor="middle" x="379" y="440">Nacionalismo revolucionario</text>
<text class="sv-t2" text-anchor="middle" x="379" y="457" style="font-size:12px">equipara opresiones no equiparables</text>
<text class="sv-t2" text-anchor="middle" x="379" y="471" style="font-size:12px">→ muleta de la socialdemocracia</text>
<rect class="sv-box-red" height="60" rx="2" width="235" x="513" y="418"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="440">Nacionalismo español</text>
<text class="sv-t2" text-anchor="middle" x="630" y="457" style="font-size:12px">patriotismo del PCE en la guerra</text>
<text class="sv-t2" text-anchor="middle" x="630" y="471" style="font-size:12px">→ nuevo españolismo de masas tras el 1-O</text>
<text class="sv-t2" text-anchor="middle" x="380" y="498" style="font-size:11.6px;letter-spacing:0">todas asumen mistificaciones nacionalistas… o su negación abstracta</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="508"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="525" style="font-size:11.6px;letter-spacing:0">Conclusión: frente a las inercias (voluntarismo identitario, inmediatismo local), marcos adoptados racional y</text>
<text class="sv-t2" text-anchor="middle" x="380" y="540" style="font-size:11.6px;letter-spacing:0">estratégicamente: «hacer políticamente posible lo estratégicamente necesario»</text>
</svg>
