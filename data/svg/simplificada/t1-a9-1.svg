<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la forma capitalista del desarrollo en cuatro pasos: producción delegada en las mercancías, plusvalía relativa bajo la competencia, segregación de la clase obrera y límite histórico (lucha de clases, centralización en el Estado, control consciente). Abajo, la línea de los tres estadios de los Grundrisse: dependencia personal, independencia personal fundada en la dependencia de las cosas y libre individualidad. Dos flechas de retorno, del segundo al primer estadio, señalan las corrientes criticadas: Castoriadis y Marcuse, Illich, Polanyi, Schumacher y el decrecimiento, con la réplica de Mattick y la nota sobre Benjamin. Una flecha discontinua hacia delante marca el ecosocialismo con planificación como veta rescatable, con su acierto y su riesgo proudhoniano." role="img" viewBox="0 0 760 586" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-9-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="20">1. LA FORMA CAPITALISTA DEL DESARROLLO DE LAS FUERZAS PRODUCTIVAS</text>
<rect class="sv-soft" height="96" rx="2" width="720" x="20" y="28"></rect>
<rect class="sv-box" height="80" rx="2" width="166" x="28" y="36"></rect>
<text class="sv-t" text-anchor="middle" x="111" y="56">Producción delegada</text>
<text class="sv-t" text-anchor="middle" x="111" y="72">en las mercancías</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="111" y="91">subordinación a objetos;</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="111" y="106">nadie pilota el proceso</text>
<rect class="sv-box-blue" height="80" rx="2" width="166" x="208" y="36"></rect>
<text class="sv-tb" text-anchor="middle" x="291" y="56">Plusvalía relativa</text>
<text class="sv-tb" text-anchor="middle" x="291" y="72">bajo la competencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="291" y="91">cooperación → manufactura</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="291" y="106">→ maquinaria</text>
<rect class="sv-box" height="80" rx="2" width="166" x="388" y="36"></rect>
<text class="sv-t" text-anchor="middle" x="471" y="56">Segregación de</text>
<text class="sv-t" text-anchor="middle" x="471" y="72">la clase obrera</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="471" y="91">dirigentes / apéndices de la</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="471" y="106">máquina / población sobrante</text>
<rect class="sv-box-green" height="80" rx="2" width="166" x="568" y="36"></rect>
<text class="sv-tgr" text-anchor="middle" x="651" y="56">Límite histórico</text>
<text class="sv-tgr" text-anchor="middle" x="651" y="72">del propio desarrollo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="91">lucha de clases → Estado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="651" y="106">→ control consciente</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="194" x2="208" y1="76" y2="76"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="374" x2="388" y1="76" y2="76"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="554" x2="568" y1="76" y2="76"></line>
<text class="sv-t3" x="20" y="152">2. LA NEGACIÓN DEL CAPITAL VISTA POR EL RETROVISOR</text>
<path class="sv-line-red" d="M420 330 V226 H100 V330" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="260" y="174">Illich, Polanyi, Schumacher, decrecimiento</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="260" y="190">don, convivialidad, lo pequeño: dependencia personal restaurada</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="260" y="206">= romanticismo económico (Marx, Lenin)</text>
<path class="sv-line-red" d="M330 330 V282 H160 V330" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="245" y="252">Castoriadis, Marcuse</text>
<text class="sv-t2" text-anchor="middle" x="245" y="268">la máquina como dominio</text>
<text class="sv-t3" x="470" y="174">Benjamin (Tesis): contra el progreso</text>
<text class="sv-t3" x="470" y="188">socialdemócrata; «marxismo no progresista»</text>
<text class="sv-t3" x="470" y="252">réplica de Mattick: la técnica sólo es</text>
<text class="sv-t3" x="470" y="266">dominio bajo la forma capital</text>
<text class="sv-t3" text-anchor="end" x="740" y="318">LOS TRES ESTADIOS (GRUNDRISSE)</text>
<rect class="sv-box" height="70" rx="2" width="220" x="20" y="330"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="352">1. Dependencia personal</text>
<text class="sv-t2" text-anchor="middle" x="130" y="368">esclavitud, vasallaje,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="383">parentesco</text>
<rect class="sv-box-blue" height="70" rx="2" width="220" x="270" y="330"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="352">2. Independencia personal</text>
<text class="sv-t2" text-anchor="middle" x="380" y="368">fundada en la dependencia de las</text>
<text class="sv-t2" text-anchor="middle" x="380" y="383">cosas: capital, mercancía, máquina</text>
<rect class="sv-box-green" height="70" rx="2" width="220" x="520" y="330"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="352">3. Libre individualidad</text>
<text class="sv-t2" text-anchor="middle" x="630" y="368">control consciente de la</text>
<text class="sv-t2" text-anchor="middle" x="630" y="383">producción social</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="240" x2="270" y1="365" y2="365"></line>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="490" x2="520" y1="365" y2="365"></line>
<text class="sv-t3" x="20" y="420">el estadio 2 crea las condiciones del 3:</text>
<text class="sv-t3" x="20" y="434">maquinaria, obrero colectivo, centralización</text>
<path class="sv-line-dash" d="M505 400 C 525 472, 600 472, 630 404" marker-end="url(#m1-9-arrow)"></path>
<text class="sv-tr" text-anchor="middle" x="130" y="468">repudiar la maquinaria</text>
<text class="sv-t2" text-anchor="middle" x="130" y="484">es abrazar la enajenación</text>
<rect class="sv-box-gold" height="70" rx="2" width="350" x="390" y="472"></rect>
<text class="sv-tg" text-anchor="middle" x="565" y="494">ecosocialismo con planificación</text>
<text class="sv-t2" text-anchor="middle" x="565" y="512">veta rescatable si impulsa el control obrero</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="565" y="529">riesgo proudhoniano: escindir «lado bueno» y «lado malo»</text>
<line class="sv-line" marker-end="url(#m1-9-arrow)" x1="20" x2="48" y1="568" y2="568"></line>
<text class="sv-t3" x="56" y="572">sucesión de los estadios</text>
<line class="sv-line-red" marker-end="url(#m1-9-arrow)" x1="240" x2="268" y1="568" y2="568"></line>
<text class="sv-t3" x="276" y="572">retorno al estadio 1 (corrientes criticadas)</text>
<line class="sv-line-dash" marker-end="url(#m1-9-arrow)" x1="590" x2="618" y1="568" y2="568"></line>
<text class="sv-t3" x="626" y="572">veta rescatable</text>
</svg>
