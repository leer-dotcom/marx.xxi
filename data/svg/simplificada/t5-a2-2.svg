<svg xmlns="http://www.w3.org/2000/svg" aria-label="Línea temporal de la hegemonía estadounidense de 1944 a 2008 con sus hitos y las cuatro fases: contención, rollback y neoliberalismo, hegemonía sin contrapeso y declive con giro agresivo, cada una con su contenido" role="img" viewBox="0 0 760 436" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
