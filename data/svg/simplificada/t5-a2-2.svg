<text class="sv-t2" text-anchor="middle" x="678" y="56">de privatización</text>
<path class="sv-line-dash" d="M732 100 L732 120"></path>
<circle class="sv-dot-b" cx="732" cy="100" r="4"></circle>
<text class="sv-t3" text-anchor="middle" x="726" y="134">2008</text>
<text class="sv-t2" text-anchor="middle" x="726" y="152">crisis: fin</text>
<text class="sv-t2" text-anchor="middle" x="726" y="167">del impulso</text>
<rect class="sv-box-green" height="24" rx="2" width="332" x="20" y="186"></rect>
<text class="sv-t3" text-anchor="middle" x="186" y="202">1945-1965</text>
<rect class="sv-box-gold" height="24" rx="2" width="200" x="356" y="186"></rect>
<text class="sv-t3" text-anchor="middle" x="456" y="202">1965-1991</text>
<rect class="sv-box-blue" height="24" rx="2" width="100" x="560" y="186"></rect>
<text class="sv-t3" text-anchor="middle" x="610" y="202">1991-2008</text>
<rect class="sv-box-red" height="24" rx="2" width="82" x="664" y="186"></rect>
<text class="sv-t3" text-anchor="middle" x="705" y="202">2008-hoy</text>
<rect class="sv-box-green" height="42" rx="2" width="720" x="20" y="224"></rect>
<text class="sv-tgr" text-anchor="start" x="30" y="243">1945-1965 · Contención: concesiones (zanahoria) y palo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="259">concesiones a la clase obrera occidental y al Sur Global; palo: agresión militar y contrainsurgencia (Corea)</text>
<rect class="sv-box-gold" height="42" rx="2" width="720" x="20" y="272"></rect>
<text class="sv-tg" text-anchor="start" x="30" y="291">1965-1991 · Rollback y neoliberalismo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="307">caída de la tasa de ganancia: las concesiones se retiran; laboratorios neoliberales: Indonesia y Chile</text>
<rect class="sv-box-blue" height="42" rx="2" width="720" x="20" y="320"></rect>
<text class="sv-tb" text-anchor="start" x="30" y="339">1991-2008 · Hegemonía sin contrapeso</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="355">OTAN al Este; Consenso de Washington vía FMI y Banco Mundial; Oriente Medio como eje coercitivo</text>
<rect class="sv-box-red" height="42" rx="2" width="720" x="20" y="368"></rect>
<text class="sv-tr" text-anchor="start" x="30" y="387">2008-hoy · Declive y giro agresivo</text>
<text class="sv-t2" text-anchor="start" style="font-size:12px" x="30" y="403">agotamiento productivo y pérdida de supremacía tecnológica; China como amenaza: orden más militarista y neocolonial</text>
<text class="sv-t3" text-anchor="middle" x="380" y="428">espaciado no proporcional; los hitos alternan arriba y abajo sólo por legibilidad</text>
</svg>
