<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tres pilares fundidos del poder imperial estadounidense: financiero-monetario, normativo-institucional y militar, sobre la base de la apropiación de plusvalor global; arriba, por qué el mercado mundial necesita un hegemón; abajo, las socias del dominio y sus fisuras" role="img" viewBox="0 0 760 438" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="46" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="33">Hegemonía estadounidense</text>
<text class="sv-tw" text-anchor="middle" style="font-size:13px" x="380" y="50">un orden particular presentado como interés universal (coerción + consentimiento)</text>
<rect class="sv-box" height="46" rx="2" width="720" x="20" y="72"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="91">Por qué hace falta un hegemón</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="108">mercado mundial fragmentado en Estados, sin banco central ni marco jurídico: el hegemón provee liquidez, reglas y coerción</text>
<rect class="sv-box-gold" height="120" rx="2" width="234" x="20" y="140"></rect>
<text class="sv-tg" text-anchor="middle" x="137" y="164">Financiero-monetario</text>
<text class="sv-t2" text-anchor="middle" x="137" y="186">dólar como dinero mundial</text>
<text class="sv-t2" text-anchor="middle" x="137" y="206">FMI y Banco Mundial: deuda</text>
<text class="sv-t2" text-anchor="middle" x="137" y="226">sanciones y SWIFT</text>
<text class="sv-t3" text-anchor="middle" x="137" y="250">«guerra por otros medios»</text>
<path class="sv-line-dash" d="M137 118 L137 136" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M137 292 L137 264" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box-blue" height="120" rx="2" width="234" x="263" y="140"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="164">Normativo-institucional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="186">Bretton Woods (1944)</text>
<text class="sv-t2" text-anchor="middle" x="380" y="206">Consenso de Washington</text>
<text class="sv-t2" text-anchor="middle" x="380" y="226">orden «basado en reglas»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="250" style="font-size:11px">reproducir la correlación de fuerzas</text>
<path class="sv-line-dash" d="M380 118 L380 136" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M380 292 L380 264" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box-red" height="120" rx="2" width="234" x="506" y="140"></rect>
<text class="sv-tr" text-anchor="middle" x="623" y="164">Militar</text>
<text class="sv-t2" text-anchor="middle" x="623" y="186">OTAN (1949)</text>
<text class="sv-t2" text-anchor="middle" x="623" y="206">complejo militar-industrial</text>
<text class="sv-t2" text-anchor="middle" x="623" y="226">~520 bases en el exterior</text>
<text class="sv-t3" text-anchor="middle" x="623" y="250">garantía última del orden</text>
<path class="sv-line-dash" d="M623 118 L623 136" marker-end="url(#m5-2-arrow)"></path>
<path class="sv-line" d="M623 292 L623 264" marker-end="url(#m5-2-arrow)"></path>
<rect class="sv-box" height="48" rx="2" width="720" x="20" y="292"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="312">Base: apropiación de plusvalor global</text>
<text class="sv-t2" text-anchor="middle" x="380" y="329">cadenas globales de valor · división salarial internacional · intercambio desigual</text>
<rect class="sv-box-green" height="48" rx="2" width="354" x="20" y="356"></rect>
<text class="sv-tgr" text-anchor="middle" x="197" y="376">Socias del dominio</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="197" y="393">burguesías de Europa occ., Japón y Corea del Sur</text>
<rect class="sv-box-red" height="48" rx="2" width="354" x="386" y="356"></rect>
<text class="sv-tr" text-anchor="middle" x="563" y="376">Fisuras: un sistema bajo tensión</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="563" y="393">crisis de rentabilidad desde los 70 · ascenso de China</text>
<path class="sv-line-dash" d="M20 424 L46 424" marker-end="url(#m5-2-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="52" y="428">se concreta en</text>
<path class="sv-line" d="M170 424 L196 424" marker-end="url(#m5-2-arrow)"></path>
<text class="sv-t3" text-anchor="start" x="202" y="428">sostiene</text>
</svg>
