<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 1 con doce nodos: crítica de la economía política y totalidad, dialéctica hegeliana, crisis, ideología burguesa, fetichismo, comunismo, clase obrera organizada, salidas falsas, opresiones específicas y vida cotidiana, Estado y democracia, teoría y praxis, y derrota histórica y posmodernidad, unidos por aristas etiquetadas que indican en qué artículos se desarrolla cada relación; al pie, la clave de los quince artículos." viewBox="0 0 760 540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-mapa-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<path class="sv-line" marker-end="url(#m1-mapa-arrow)" d="M98 48 V22 H470 V48"/>
<text class="sv-t3" text-anchor="middle" x="284" y="17">la crisis como escasez de plusvalía (1)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="198" y1="70" x2="184" y2="70"/>
<text class="sv-t3" text-anchor="middle" x="191" y="41">contra el kantismo (3)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="98" y1="108" x2="98" y2="190"/>
<text class="sv-t3" x="104" y="132">el capital es</text>
<text class="sv-t3" x="104" y="146">relación social (1, 2)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="284" y1="108" x2="284" y2="190"/>
<text class="sv-t3" x="290" y="132">de la esencia al</text>
<text class="sv-t3" x="290" y="146">concepto (4, 5)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="470" y1="108" x2="470" y2="190"/>
<text class="sv-t3" x="476" y="132">facilita, no garantiza,</text>
<text class="sv-t3" x="476" y="146">la subjetividad (1)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="656" y1="108" x2="656" y2="190"/>
<text class="sv-t3" text-anchor="end" x="650" y="170">reformismo (1, 2, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="384" y1="212" x2="370" y2="212"/>
<text class="sv-t3" text-anchor="middle" x="377" y="168">abole la forma-valor</text>
<text class="sv-t3" text-anchor="middle" x="377" y="182">(1, 7, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="60" y1="250" x2="60" y2="332"/>
<text class="sv-t3" x="66" y="306">vida cotidiana</text>
<text class="sv-t3" x="66" y="320">(8, 13, 14, 15)</text>
<path class="sv-line" marker-end="url(#m1-mapa-arrow)" d="M150 250 V290 H240 V332"/>
<text class="sv-t3" x="156" y="270">formas alienadas</text>
<text class="sv-t3" x="156" y="284">(2, 11, 12, 13)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="284" y1="250" x2="284" y2="332"/>
<text class="sv-t3" x="290" y="270">extinción del Estado</text>
<text class="sv-t3" x="290" y="284">(4, 12, 13)</text>
<path class="sv-line-dash" marker-end="url(#m1-mapa-arrow)" d="M620 250 V296 H304 V332"/>
<text class="sv-t3" x="312" y="312">integración estatal</text>
<text class="sv-t3" x="312" y="326">(7, 8, 11)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="470" y1="332" x2="470" y2="250"/>
<text class="sv-t3" x="476" y="272">condición del</text>
<text class="sv-t3" x="476" y="286">movimiento (6, 7)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="656" y1="332" x2="656" y2="250"/>
<text class="sv-t3" x="662" y="272">dos vías</text>
<text class="sv-t3" x="662" y="286">falsas (9, 10)</text>
<line class="sv-line" marker-end="url(#m1-mapa-arrow)" x1="570" y1="354" x2="556" y2="354"/>
<text class="sv-t3" text-anchor="middle" x="563" y="410">respiro del pensamiento (6, 10)</text>
<rect class="sv-box-ink" rx="2" x="12" y="48" width="172" height="60"/>
<text class="sv-tw" text-anchor="middle" x="98" y="68">Crítica de la economía</text>
<text class="sv-tw" text-anchor="middle" x="98" y="85">política · totalidad</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="98" y="101">ciencia · filosofía · política</text>
<rect class="sv-box" rx="2" x="198" y="48" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="284" y="68">Dialéctica</text>
<text class="sv-t" text-anchor="middle" x="284" y="85">hegeliana</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="101">esencia · concepto · alienación</text>
<rect class="sv-box" rx="2" x="384" y="48" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="470" y="68">Crisis y caída de la</text>
<text class="sv-t" text-anchor="middle" x="470" y="85">tasa de ganancia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="470" y="101">inmanente a la acumulación</text>
<rect class="sv-box" rx="2" x="570" y="48" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="656" y="68">Ideología burguesa:</text>
<text class="sv-t" text-anchor="middle" x="656" y="85">escisión de esferas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="656" y="101">producción vs. distribución</text>
<rect class="sv-box-red" rx="2" x="12" y="190" width="172" height="60"/>
<text class="sv-tr" text-anchor="middle" x="98" y="210">Fetichismo: dinero,</text>
<text class="sv-tr" text-anchor="middle" x="98" y="227">Estado, Ley</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="98" y="243">poder social enajenado</text>
<rect class="sv-box-green" rx="2" x="198" y="190" width="172" height="60"/>
<text class="sv-tgr" text-anchor="middle" x="284" y="210">Comunismo: asociación</text>
<text class="sv-tgr" text-anchor="middle" x="284" y="227">de productores libres</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="243">abolición de la forma-valor</text>
<rect class="sv-box-blue" rx="2" x="384" y="190" width="172" height="60"/>
<text class="sv-tb" text-anchor="middle" x="470" y="210">Clase obrera organizada</text>
<text class="sv-tb" text-anchor="middle" x="470" y="227">movimiento de clase</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="470" y="243">auto-organización desde abajo</text>
<rect class="sv-box-red" rx="2" x="570" y="190" width="172" height="60"/>
<text class="sv-tr" text-anchor="middle" x="656" y="210">Salidas falsas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="656" y="227">reformismo · nostalgia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="656" y="243">identidad esencializada</text>
<rect class="sv-box" rx="2" x="12" y="332" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="98" y="352">Opresiones específicas</text>
<text class="sv-t" text-anchor="middle" x="98" y="369">y vida cotidiana</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="98" y="385">sexo-género · eros · deuda</text>
<rect class="sv-box-gold" rx="2" x="198" y="332" width="172" height="60"/>
<text class="sv-tg" text-anchor="middle" x="284" y="352">Estado, democracia</text>
<text class="sv-tg" text-anchor="middle" x="284" y="369">y ciudadanía</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="284" y="385">comunidad ilusoria · semblante</text>
<rect class="sv-box" rx="2" x="384" y="332" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="470" y="352">Teoría y praxis</text>
<text class="sv-t" text-anchor="middle" x="470" y="369">vanguardia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="470" y="385">contra el activismo irreflexivo</text>
<rect class="sv-box" rx="2" x="570" y="332" width="172" height="60"/>
<text class="sv-t" text-anchor="middle" x="656" y="352">Derrota histórica</text>
<text class="sv-t" text-anchor="middle" x="656" y="369">y posmodernidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="656" y="385">realismo capitalista</text>
<rect class="sv-soft" rx="2" x="12" y="418" width="732" height="112"/>
<text class="sv-t3" x="24" y="436">flecha: un concepto fundamenta o conduce a otro · discontinua: igual, arista larga · (n): artículos que la desarrollan</text>
<text class="sv-t2" style="font-size:12px" x="24" y="456">1 · Ruiz — La crisis del capital</text>
<text class="sv-t2" style="font-size:12px" x="24" y="471">2 · Aguiriano — Marx sin atributos</text>
<text class="sv-t2" style="font-size:12px" x="24" y="486">3 · Fernández Barcina — Historia y sistema</text>
<text class="sv-t2" style="font-size:12px" x="24" y="501">4 · Moreno Tonda — Hegel y Marx, libertad</text>
<text class="sv-t2" style="font-size:12px" x="24" y="516">5 · Brassier — Extraña igualdad</text>
<text class="sv-t2" style="font-size:12px" x="268" y="456">6 · Fernández Bustos — Teoría y praxis</text>
<text class="sv-t2" style="font-size:12px" x="268" y="471">7 · Plana — El legado del leninismo</text>
<text class="sv-t2" style="font-size:12px" x="268" y="486">8 · Bedmar — Frente al feminismo</text>
<text class="sv-t2" style="font-size:12px" x="268" y="501">9 · Rodríguez Rojo — Romanticismo económico</text>
<text class="sv-t2" style="font-size:12px" x="268" y="516">10 · Rodríguez Cueto — Posmodernidad</text>
<text class="sv-t2" style="font-size:12px" x="512" y="456">11 · Clarke — Comunidad ilusoria</text>
<text class="sv-t2" style="font-size:12px" x="512" y="471">12 · Najarro — Badiou y la democracia</text>
<text class="sv-t2" style="font-size:12px" x="512" y="486">13 · Vidal-Molina/Vargas-Muñoz — Ciudadanía</text>
<text class="sv-t2" style="font-size:12px" x="512" y="501">14 · Arconada — El eros enajenado</text>
<text class="sv-t2" style="font-size:12px" x="512" y="516">15 · Del Pino — El fantasma de Marx</text>
</svg>
