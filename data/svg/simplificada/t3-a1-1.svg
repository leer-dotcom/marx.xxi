<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la premisa gramsciana y el problema de partida; después, la cadena de mediaciones desde la cosmovisión capitalista hasta la conciencia socialista pasando por los bloques culturales y la crisis de acumulación, con el nudo gordiano y la fórmula táctica; abajo, pirámide de los tres medios (teoría, propaganda, agitación) con flechas a los dos objetivos (unificación y hegemonización), las tres derivas por absolutización, la advertencia sobre el pathos escéptico, la lección histórica rusa y el arte como modo de expresión de la agitación" role="img" viewBox="0 0 760 544" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>

<text class="sv-t3" x="12" y="20">PREMISA: LA ACTUALIDAD DE LA REVOLUCIÓN (LENIN, GRAMSCI)</text>
<rect class="sv-soft" height="44" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="22" y="46" style="font-size:12px">La cultura sólo importa en el problema de la toma del poder: clase culturalmente dirigente antes que políticamente dominante.</text>
<text class="sv-t2" x="22" y="62" style="font-size:12px">Problema de partida: para la conciencia espontánea el socialismo está «descartado a priori» («fin de la historia»).</text>

<text class="sv-t3" x="12" y="92">CADENA DE MEDIACIONES: EL CAMPO DE LA LUCHA CULTURAL</text>
<rect class="sv-box-ink" height="64" rx="2" width="172" x="12" y="100"></rect>
<text class="sv-tw" text-anchor="middle" x="98" y="121">Cosmovisión capitalista</text>
<text class="sv-tw" text-anchor="middle" x="98" y="138" style="font-size:12px;font-weight:400;letter-spacing:0">formas naturalizadas, raíz</text>
<text class="sv-tw" text-anchor="middle" x="98" y="153" style="font-size:12px;font-weight:400;letter-spacing:0">(mercancía, parlamento…)</text>
<path class="sv-line" d="M184 132 H198" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-blue" height="64" rx="2" width="172" x="200" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="286" y="121">Bloques culturales</text>
<text class="sv-t2" text-anchor="middle" x="286" y="138" style="font-size:12px">modos de vida por clase: élites,</text>
<text class="sv-t2" text-anchor="middle" x="286" y="153" style="font-size:12px">clases medias, proletariado</text>
<path class="sv-line" d="M372 132 H386" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-red" height="64" rx="2" width="172" x="388" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="474" y="121">Crisis de acumulación</text>
<text class="sv-t2" text-anchor="middle" x="474" y="138" style="font-size:12px">punto de sutura: lo natural</text>
<text class="sv-t2" text-anchor="middle" x="474" y="153" style="font-size:12px">se vuelve problemático</text>
<path class="sv-line" d="M560 132 H574" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="172" x="576" y="100"></rect>
<text class="sv-t" text-anchor="middle" x="662" y="121">Conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="662" y="138" style="font-size:12px">interviene en el bloque</text>
<text class="sv-t2" text-anchor="middle" x="662" y="153" style="font-size:12px">proletario en crisis</text>

<rect class="sv-soft" height="54" rx="2" width="736" x="12" y="176"></rect>
<text class="sv-t3" x="22" y="192">NUDO GORDIANO Y FÓRMULA TÁCTICA</text>
<text class="sv-t2" x="22" y="208" style="font-size:12px">La cosmovisión no se derriba de frente, sólo indirectamente a través de la crisis: conciencia socialista en el campo</text>
<text class="sv-t2" x="22" y="223" style="font-size:12px">del bloque cultural proletario en crisis. La táctica cultural es transversal a toda lucha.</text>

<text class="sv-t3" x="12" y="256">TRES MEDIOS JERARQUIZADOS</text>
<text class="sv-t3" x="330" y="256">DOS OBJETIVOS</text>
<text class="sv-t3" x="528" y="256">DERIVAS POR ABSOLUTIZACIÓN</text>
<rect class="sv-box-red" height="46" rx="2" width="120" x="80" y="266"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="285">Agitación</text>
<text class="sv-t2" text-anchor="middle" x="140" y="302" style="font-size:12px">afectos, hechos</text>
<rect class="sv-box-blue" height="46" rx="2" width="180" x="50" y="320"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="339">Propaganda</text>
<text class="sv-t2" text-anchor="middle" x="140" y="356" style="font-size:12px;letter-spacing:0">razón, nexo coyuntura-estrategia</text>
<rect class="sv-box" height="46" rx="2" width="240" x="20" y="374"></rect>
<text class="sv-t" text-anchor="middle" x="140" y="393">Teoría</text>
<text class="sv-t2" text-anchor="middle" x="140" y="410">base científica (CEP + bolchevismo)</text>
<text class="sv-t3" x="20" y="440">jerarquía: teoría &gt; propaganda &gt; agitación</text>
<text class="sv-t3" x="20" y="456">proporcionalidad: ninguna desconectada</text>
<path class="sv-line" d="M200 289 H328" marker-end="url(#m3-1-arrow)"></path>
<path class="sv-line" d="M230 343 H328" marker-end="url(#m3-1-arrow)"></path>
<rect class="sv-box-green" height="46" rx="2" width="186" x="330" y="266"></rect>
<text class="sv-t" text-anchor="middle" x="423" y="285">Hegemonización</text>
<text class="sv-t2" text-anchor="middle" x="423" y="302" style="font-size:12px">nueva cultura política proletaria</text>
<rect class="sv-box-green" height="46" rx="2" width="186" x="330" y="320"></rect>
<text class="sv-t" text-anchor="middle" x="423" y="339">Unificación</text>
<text class="sv-t2" text-anchor="middle" x="423" y="356" style="font-size:12px">debate racional + juventud</text>
<rect class="sv-soft" height="46" rx="2" width="418" x="330" y="428"></rect>
<text class="sv-t3" x="338" y="443">ADVERTENCIA</text>
<text class="sv-t2" x="338" y="458" style="font-size:11.5px">la crisis produce sobre todo un pathos escéptico: sin agencia revolucionaria</text>
<text class="sv-t2" x="338" y="470" style="font-size:11.5px">no hay transformación cultural real (ni mesianismo ni espontaneísmo)</text>
<rect class="sv-box" height="46" rx="2" width="220" x="528" y="266"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="285">Solo agitación → oportunismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="302">socialdemocracia</text>
<rect class="sv-box" height="46" rx="2" width="220" x="528" y="320"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="339">Solo propaganda → sectarismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="356">marxismo-leninismo actual</text>
<rect class="sv-box" height="46" rx="2" width="220" x="528" y="374"></rect>
<text class="sv-tr" text-anchor="middle" x="638" y="393">Solo teoría → academicismo</text>
<text class="sv-t2" text-anchor="middle" x="638" y="410">marxismo occidental</text>

<rect class="sv-box-blue" height="58" rx="2" width="360" x="12" y="482"></rect>
<text class="sv-tb" x="22" y="502">Lección histórica: del círculo a las masas</text>
<text class="sv-t2" x="22" y="519" style="font-size:12px">La agitación cambia el paradigma: del sectarismo conspirativo</text>
<text class="sv-t2" x="22" y="533" style="font-size:12px">al partido de masas. Hoy: constituir no es lo mismo que expandir.</text>
<rect class="sv-box-gold" height="58" rx="2" width="360" x="388" y="482"></rect>
<text class="sv-tg" x="398" y="502">Arte = modo de expresión de la agitación</text>
<text class="sv-t2" x="398" y="519" style="font-size:12px">Artista colectivo (órgano técnico del partido) + arte socialista</text>
<text class="sv-t2" x="398" y="533" style="font-size:12px">(formas populares), frente a la autonomía burguesa del arte.</text>
</svg>
