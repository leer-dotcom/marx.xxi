<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición en dos columnas entre el republicanismo y la crítica marxiana de la economía política, en nueve filas: salario, tipo de dominio, diagnóstico, papel del Estado, remedio, fetichismo, tipo de crítica, revolución y concepto de libertad; con el mérito y el límite de la lectura republicana arriba y la crítica del voluntarismo redistributivo abajo" role="img" viewBox="0 0 760 590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="28">mérito de la lectura republicana: desenterrar la herencia republicana de Marx (1793) frente al marxismo vulgar</text>
<text class="sv-t3" text-anchor="middle" x="380" y="42">límite: la continuidad diluye su originalidad y reduce su programa a la democracia revolucionaria jacobina</text>
<rect class="sv-box-red" height="44" rx="2" width="275" x="175" y="54"/>
<text class="sv-tr" text-anchor="middle" x="312" y="72">Republicanismo</text>
<text class="sv-t3" text-anchor="middle" x="312" y="88">Kant · Domènech · Liria-Alegre · Polanyi</text>
<rect class="sv-box-blue" height="44" rx="2" width="275" x="465" y="54"/>
<text class="sv-tb" text-anchor="middle" x="602" y="72">Marx</text>
<text class="sv-t3" text-anchor="middle" x="602" y="88">crítica de la economía política</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="106"/>
<text class="sv-t" text-anchor="middle" x="90" y="132">El salario</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="106"/>
<text class="sv-t2" text-anchor="middle" x="312" y="123.5">Servicio que no se vende (Kant):</text>
<text class="sv-t2" text-anchor="middle" x="312" y="139.5">«esclavitud a tiempo parcial»</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="106"/>
<text class="sv-t2" text-anchor="middle" x="602" y="123.5">Venta real de fuerza de trabajo;</text>
<text class="sv-t2" text-anchor="middle" x="602" y="139.5">media una «esclavitud absoluta»</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="154"/>
<text class="sv-t" text-anchor="middle" x="90" y="172">Tipo de</text>
<text class="sv-t" text-anchor="middle" x="90" y="188">dominio</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="154"/>
<text class="sv-t2" text-anchor="middle" x="312" y="171.5">Personal y directo</text>
<text class="sv-t2" text-anchor="middle" x="312" y="187.5">(loi de famille, amo y siervo)</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="154"/>
<text class="sv-t2" text-anchor="middle" x="602" y="171.5">Impersonal: el capital como sujeto,</text>
<text class="sv-t2" text-anchor="middle" x="602" y="187.5">relación global de reproducción</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="202"/>
<text class="sv-t" text-anchor="middle" x="90" y="220">Diagnóstico del</text>
<text class="sv-t" text-anchor="middle" x="90" y="236">capitalismo</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="202"/>
<text class="sv-t2" text-anchor="middle" x="312" y="219.5">Ficción jurídica, «confusión» interesada</text>
<text class="sv-t2" text-anchor="middle" x="312" y="235.5">de la economía política (Polanyi)</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="202"/>
<text class="sv-t2" text-anchor="middle" x="602" y="219.5">Forma social necesaria: la práctica,</text>
<text class="sv-t2" text-anchor="middle" x="602" y="235.5">no la intención, hace la mercancía</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="250"/>
<text class="sv-t" text-anchor="middle" x="90" y="268">Papel del</text>
<text class="sv-t" text-anchor="middle" x="90" y="284">Estado</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="250"/>
<text class="sv-t2" text-anchor="middle" x="312" y="267.5">Soberanía que decide</text>
<text class="sv-t2" text-anchor="middle" x="312" y="283.5">qué es y qué no es mercancía</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="250"/>
<text class="sv-t2" text-anchor="middle" x="602" y="267.5">Sometido a las leyes de la</text>
<text class="sv-t2" text-anchor="middle" x="602" y="283.5">reproducción social (Hegel)</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="298"/>
<text class="sv-t" text-anchor="middle" x="90" y="324">Remedio</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="298"/>
<text class="sv-t2" text-anchor="middle" x="312" y="315.5">Desmercantilizar tierra, dinero y</text>
<text class="sv-t2" text-anchor="middle" x="312" y="331.5">trabajo; renta básica</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="298"/>
<text class="sv-t2" text-anchor="middle" x="602" y="315.5">Abolir a la vez el trabajo asalariado</text>
<text class="sv-t2" text-anchor="middle" x="602" y="331.5">y la forma-mercancía</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="346"/>
<text class="sv-t" text-anchor="middle" x="90" y="372">Fetichismo</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="346"/>
<text class="sv-t2" text-anchor="middle" x="312" y="363.5">«Advertencia propedéutica»</text>
<text class="sv-t2" text-anchor="middle" x="312" y="379.5">sin papel en El Capital</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="346"/>
<text class="sv-t2" text-anchor="middle" x="602" y="363.5">Núcleo: relaciones de poder</text>
<text class="sv-t2" text-anchor="middle" x="602" y="379.5">objetivadas como «leyes económicas»</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="394"/>
<text class="sv-t" text-anchor="middle" x="90" y="412">Tipo de</text>
<text class="sv-t" text-anchor="middle" x="90" y="428">crítica</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="394"/>
<text class="sv-t2" text-anchor="middle" x="312" y="411.5">Normativa y dogmática:</text>
<text class="sv-t2" text-anchor="middle" x="312" y="427.5">derechos inalienables</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="394"/>
<text class="sv-t2" text-anchor="middle" x="602" y="411.5">Inmanente: el capital crea las</text>
<text class="sv-t2" text-anchor="middle" x="602" y="427.5">condiciones de su superación</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="442"/>
<text class="sv-t" text-anchor="middle" x="90" y="468">Revolución</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="442"/>
<text class="sv-t2" text-anchor="middle" x="312" y="459.5">Democracia revolucionaria jacobina;</text>
<text class="sv-t2" text-anchor="middle" x="312" y="475.5">límite: proceso constituyente nacional</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="442"/>
<text class="sv-t2" text-anchor="middle" x="602" y="459.5">Afirmar el trabajo social</text>
<text class="sv-t2" text-anchor="middle" x="602" y="475.5">negando su forma privada</text>
<rect class="sv-soft" height="42" rx="2" width="140" x="20" y="490"/>
<text class="sv-t" text-anchor="middle" x="90" y="516">Libertad</text>
<rect class="sv-box" height="42" rx="2" width="275" x="174.5" y="490"/>
<text class="sv-t2" text-anchor="middle" x="312" y="507.5">Independencia civil (sui iuris);</text>
<text class="sv-t2" text-anchor="middle" x="312" y="523.5">de hecho, un «amo justo»</text>
<rect class="sv-box" height="42" rx="2" width="275" x="464.5" y="490"/>
<text class="sv-t2" text-anchor="middle" x="602" y="507.5">«No tener ningún amo»:</text>
<text class="sv-t2" text-anchor="middle" x="602" y="523.5">libertad absoluta</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="540"/>
<text class="sv-tr" text-anchor="middle" x="380" y="558">toda redistribución presupone una acumulación capitalista exitosa</text>
<text class="sv-t2" text-anchor="middle" x="380" y="575" style="font-size:12px">crítica del voluntarismo: «para pagar una renta básica hace falta dinero» que ya circule bajo la lógica capitalista</text>
</svg>
