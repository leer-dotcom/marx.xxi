<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, árbol genealógico de las familias del comunismo según el momento de la caída, seguido de tres cajas: qué es el esquematismo (ortodoxos y revisionistas, con los invariantes del programa), los tres factores que bloquearon la superación y por qué hoy no sirven los supuestos de la Komintern; en medio, las cuatro condiciones históricas del frente único con la marca de que hoy solo se cumple la cuarta; abajo, matriz de contraste en tres filas entre el canon trotskista (Programa de Transición, frente único, consejos como doble poder) y la propuesta del Movimiento Socialista (reformas como acumulación de fuerzas, independencia política primero, consejos socialistas); al pie, las cuatro condiciones del debate estratégico racional" role="img" viewBox="0 0 760 590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-7-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-ink" height="44" rx="2" width="150" x="12" y="14"></rect>
<text class="sv-tw" text-anchor="middle" x="87" y="32" style="font-size:12.5px;letter-spacing:0">Comunismo del siglo XX</text>
<text class="sv-tw" text-anchor="middle" x="87" y="48">«¿cuándo se jodió?»</text>
<path class="sv-line" d="M162 36 H170" marker-end="url(#m3-7-arrow)"></path>
<rect class="sv-soft" height="44" rx="2" width="106" x="172" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="225" y="32" style="font-size:13.2px;letter-spacing:0">Kronstadt</text>
<text class="sv-t2" text-anchor="middle" x="225" y="48">1921</text>
<path class="sv-line" d="M278 36 H288" marker-end="url(#m3-7-arrow)"></path>
<rect class="sv-soft" height="44" rx="2" width="106" x="288" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="341" y="32" style="font-size:13.2px;letter-spacing:0">Socialismo en</text>
<text class="sv-t2" text-anchor="middle" x="341" y="48">un solo país</text>
<path class="sv-line" d="M394 36 H404" marker-end="url(#m3-7-arrow)"></path>
<rect class="sv-soft" height="44" rx="2" width="106" x="404" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="457" y="32" style="font-size:13.2px;letter-spacing:0">XX Congreso</text>
<text class="sv-t2" text-anchor="middle" x="457" y="48">del PCUS</text>
<path class="sv-line" d="M510 36 H520" marker-end="url(#m3-7-arrow)"></path>
<rect class="sv-soft" height="44" rx="2" width="106" x="520" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="573" y="32" style="font-size:13.2px;letter-spacing:0">Ruptura</text>
<text class="sv-t2" text-anchor="middle" x="573" y="48">sino-soviética</text>
<path class="sv-line" d="M626 36 H636" marker-end="url(#m3-7-arrow)"></path>
<rect class="sv-soft" height="44" rx="2" width="106" x="636" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="689" y="32" style="font-size:13.2px;letter-spacing:0">Checoslovaquia,</text>
<text class="sv-t2" text-anchor="middle" x="689" y="48">Yeltsin…</text>
<text class="sv-t3" text-anchor="middle" x="380" y="76">cada «momento de la caída» funda una familia: sectas homogéneas dedicadas a la exégesis</text>
<text class="sv-t3" x="12" y="100">QUÉ ES EL ESQUEMATISMO, QUÉ LO BLOQUEÓ Y POR QUÉ HOY NO SIRVEN LOS VIEJOS MOLDES</text>
<rect class="sv-box" height="64" rx="2" width="236" x="12" y="108"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="127">Ortodoxos y revisionistas</text>
<text class="sv-t2" text-anchor="middle" x="130" y="143" style="font-size:11.5px;letter-spacing:0">ortodoxos: aplicar mecánicamente un patrón</text>
<text class="sv-t2" text-anchor="middle" x="130" y="158" style="font-size:11.5px;letter-spacing:0">revisionistas: renunciar a los invariantes</text>
<rect class="sv-box" height="64" rx="2" width="236" x="262" y="108"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="127">Tres factores de bloqueo</text>
<text class="sv-t2" text-anchor="middle" x="380" y="143" style="font-size:11.5px;letter-spacing:0">estancamiento en la URSS · el «jefe traidor»</text>
<text class="sv-t2" text-anchor="middle" x="380" y="158" style="font-size:11.5px;letter-spacing:0">· marxismo = experiencia soviética</text>
<rect class="sv-box-gold" height="64" rx="2" width="236" x="512" y="108"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="127">Hoy: supuestos disueltos</text>
<text class="sv-t2" text-anchor="middle" x="630" y="143" style="font-size:11.5px;letter-spacing:0">«el proletariado es una suma de individuos,</text>
<text class="sv-t2" text-anchor="middle" x="630" y="158" style="font-size:11.5px;letter-spacing:0">no un sujeto político» → apropiación crítica</text>
<text class="sv-t3" x="12" y="196">CONDICIONES DEL FRENTE ÚNICO (AÑOS 20): HOY SOLO SE CUMPLE LA CUARTA</text>
<rect class="sv-box" height="56" rx="2" width="172" x="12" y="204"></rect>
<text class="sv-t" text-anchor="middle" x="98" y="224">Sociedad obrera paralela</text>
<text class="sv-t2" text-anchor="middle" x="98" y="239" style="font-size:10.2px;letter-spacing:0">sindicatos, cooperativas, mutuas</text>
<text class="sv-tr" text-anchor="middle" x="98" y="254">hoy: no</text>
<rect class="sv-box" height="56" rx="2" width="172" x="200" y="204"></rect>
<text class="sv-t" text-anchor="middle" x="286" y="224">Komintern activa</text>
<text class="sv-t2" text-anchor="middle" x="286" y="239" style="font-size:10.2px;letter-spacing:0">partidos con línea definida</text>
<text class="sv-tr" text-anchor="middle" x="286" y="254">hoy: no</text>
<rect class="sv-box" height="56" rx="2" width="172" x="388" y="204"></rect>
<text class="sv-t" text-anchor="middle" x="474" y="224">Guerra y saber militar</text>
<text class="sv-t2" text-anchor="middle" x="474" y="239" style="font-size:10.2px;letter-spacing:0">jerarquías y Estados debilitados</text>
<text class="sv-tr" text-anchor="middle" x="474" y="254">hoy: no</text>
<rect class="sv-box-green" height="56" rx="2" width="172" x="576" y="204"></rect>
<text class="sv-t" text-anchor="middle" x="662" y="224">Crisis económica</text>
<text class="sv-t2" text-anchor="middle" x="662" y="239" style="font-size:10.2px;letter-spacing:0">estallidos de masas contra la miseria</text>
<text class="sv-tgr" text-anchor="middle" x="662" y="254">hoy: sí</text>
<text class="sv-t3" text-anchor="middle" x="187" y="288">CANON TROTSKISTA</text>
<text class="sv-t3" text-anchor="middle" x="573" y="288">PROPUESTA DEL MOVIMIENTO SOCIALISTA</text>
<rect class="sv-box-red" height="64" rx="2" width="350" x="12" y="296"></rect>
<text class="sv-tr" text-anchor="middle" x="187" y="317">Programa de Transición (1938)</text>
<text class="sv-t2" text-anchor="middle" x="187" y="334" style="font-size:12px">condiciones objetivas dadas; solo falta dirección:</text>
<text class="sv-t2" text-anchor="middle" x="187" y="349" style="font-size:12px">demandas transitorias</text>
<path class="sv-line" d="M364 328 H396" marker-end="url(#m3-7-arrow)" marker-start="url(#m3-7-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="350" x="398" y="296"></rect>
<text class="sv-tgr" text-anchor="middle" x="573" y="317">Reformas como acumulación de fuerzas</text>
<text class="sv-t2" text-anchor="middle" x="573" y="334" style="font-size:12px">tecnología organizativa, propaganda, combatividad</text>
<text class="sv-t2" text-anchor="middle" x="573" y="349" style="font-size:12px">(ej.: Sindicato de Vivienda Socialista de Euskal Herria)</text>
<rect class="sv-box-red" height="64" rx="2" width="350" x="12" y="370"></rect>
<text class="sv-tr" text-anchor="middle" x="187" y="391">Frente único</text>
<text class="sv-t2" text-anchor="middle" x="187" y="408" style="font-size:12px">sindical: organizaciones de masas no comunistas;</text>
<text class="sv-t2" text-anchor="middle" x="187" y="423" style="font-size:12px">político: «gobierno obrero» = burgués «con mono azul»</text>
<path class="sv-line" d="M364 402 H396" marker-end="url(#m3-7-arrow)" marker-start="url(#m3-7-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="350" x="398" y="370"></rect>
<text class="sv-tgr" text-anchor="middle" x="573" y="391">Independencia política primero</text>
<text class="sv-t2" text-anchor="middle" x="573" y="408" style="font-size:12px">fase prepartidaria: consejos, frentes, unificación,</text>
<text class="sv-t2" text-anchor="middle" x="573" y="423" style="font-size:12px">hegemonización (el frente sindical sigue válido)</text>
<rect class="sv-box-red" height="64" rx="2" width="350" x="12" y="444"></rect>
<text class="sv-tr" text-anchor="middle" x="187" y="465">Consejos como doble poder</text>
<text class="sv-t2" text-anchor="middle" x="187" y="482" style="font-size:12px">órganos territoriales bajo dirección del Partido</text>
<text class="sv-t2" text-anchor="middle" x="187" y="497" style="font-size:12px">o consejos de fábrica procesuales (Gramsci)</text>
<path class="sv-line" d="M364 476 H396" marker-end="url(#m3-7-arrow)" marker-start="url(#m3-7-arrow)"></path>
<rect class="sv-box-green" height="64" rx="2" width="350" x="398" y="444"></rect>
<text class="sv-tgr" text-anchor="middle" x="573" y="465">Consejos socialistas</text>
<text class="sv-t2" text-anchor="middle" x="573" y="482" style="font-size:12px">medio para reconstituir el Partido y preparar</text>
<text class="sv-t2" text-anchor="middle" x="573" y="497" style="font-size:12px">la destrucción del Estado burgués</text>
<text class="sv-t3" text-anchor="middle" x="380" y="532">«ninguna ortodoxia ha demostrado la validez de sus propuestas en los países centrales del capitalismo contemporáneo»</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="542"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="559" style="font-size:11.6px;letter-spacing:0">Condiciones del debate estratégico racional: sinceridad y honestidad · abandonar el patrimonialismo organizativo y las peleas</text>
<text class="sv-t2" text-anchor="middle" x="380" y="574" style="font-size:11.6px;letter-spacing:0">de siglas · dejar la exégesis escolástica por la demostración lógica y práctica · unificación programática → unificación organizativa</text>
</svg>
