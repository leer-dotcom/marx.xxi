<svg xmlns="http://www.w3.org/2000/svg" aria-label="Franja inicial con el punto de partida (independencia de clase e ideológica); a la izquierda, la cadena causal desde la acumulación originaria hasta el dominio impersonal y sus tendencias; a la derecha, la crítica de las tesis monopolistas, la matriz de dos por dos de los momentos keynesianos según su motor y su efecto sobre la dependencia proletaria, la secuencia histórica y la crítica de la ideología keynesiana; al pie, la conclusión política" role="img" viewBox="0 0 760 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" height="46" rx="2" width="720" x="20" y="20"/>
<text class="sv-t" text-anchor="middle" x="380" y="40">Punto de partida: independencia de clase (Hal Draper) exige independencia ideológica</text>
<text class="sv-t2" text-anchor="middle" x="380" y="57" style="font-size:12px">«ninguna política efectiva se deriva de la mala caracterización del objeto» → investigar precio y competencia</text>
<text class="sv-t3" text-anchor="middle" x="170" y="86">Cadena lógica: el origen de precios y competencia</text>
<rect class="sv-box-red" height="40" rx="2" width="300" x="20" y="96"/>
<text class="sv-tr" text-anchor="middle" x="170" y="114">Acumulación originaria</text>
<text class="sv-t2" text-anchor="middle" x="170" y="130" style="font-size:12px">separación productores / medios de producción</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="170" x2="170" y1="136" y2="150"/>
<rect class="sv-box" height="40" rx="2" width="300" x="20" y="152"/>
<text class="sv-t" text-anchor="middle" x="170" y="170">Trabajo privado e independiente</text>
<text class="sv-t2" text-anchor="middle" x="170" y="186" style="font-size:12px">producción sin plan común: parcelas escindidas</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="170" x2="170" y1="192" y2="206"/>
<rect class="sv-box" height="40" rx="2" width="300" x="20" y="208"/>
<text class="sv-t" text-anchor="middle" x="170" y="226">Mercado central</text>
<text class="sv-t2" text-anchor="middle" x="170" y="242" style="font-size:12px">«porque hay mercado, ponemos precio» (no al revés)</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="170" x2="170" y1="248" y2="262"/>
<rect class="sv-box" height="40" rx="2" width="300" x="20" y="264"/>
<text class="sv-t" text-anchor="middle" x="170" y="282">Sistema de precios + competencia</text>
<text class="sv-t2" text-anchor="middle" x="170" y="298" style="font-size:12px">competencia por la plusvalía · y por el salario</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="170" x2="170" y1="304" y2="318"/>
<rect class="sv-box" height="40" rx="2" width="300" x="20" y="320"/>
<text class="sv-t" text-anchor="middle" x="170" y="338">Dominio impersonal</text>
<text class="sv-t2" text-anchor="middle" x="170" y="354" style="font-size:12px">capitalistas = personificaciones del capital</text>
<line class="sv-line" marker-end="url(#m2-4-arrow)" x1="170" x2="170" y1="360" y2="374"/>
<rect class="sv-box-ink" height="40" rx="2" width="300" x="20" y="376"/>
<text class="sv-tw" text-anchor="middle" x="170" y="394">Tendencias inmanentes de la acumulación</text>
<text class="sv-tw" text-anchor="middle" x="170" y="410" style="font-size:12px">↓ ganancia · ↓ condiciones de vida · paro</text>
<text class="sv-t3" text-anchor="middle" x="170" y="440">origen clasista del precio y de la competencia</text>
<text class="sv-t2" text-anchor="middle" x="170" y="457" style="font-size:12px">sin competencia, tendencias «resolubles» por el Estado</text>
<text class="sv-t3" text-anchor="middle" x="540" y="86">Contraste: la lectura monopolista</text>
<rect class="sv-box-gold" height="60" rx="2" width="400" x="340" y="96"/>
<text class="sv-tg" text-anchor="middle" x="540" y="114">Tesis monopolistas (Lenin, Baran y Sweezy)</text>
<text class="sv-t2" text-anchor="middle" x="540" y="131" style="font-size:12px">precios fijados por mark-up «a voluntad» del tejido monopólico;</text>
<text class="sv-t2" text-anchor="middle" x="540" y="146" style="font-size:12px">pero el oligopolio es resultado e intensificación de la competencia</text>
<path class="sv-line-dash" d="M340 126 H332 V284 H320" marker-end="url(#m2-4-arrow)"/>
<text class="sv-t" text-anchor="middle" x="540" y="180">Dos tipos de «momento keynesiano»</text>
<text class="sv-t3" text-anchor="middle" x="514" y="198">reduce la dependencia</text>
<text class="sv-t3" text-anchor="middle" x="667" y="198">refuerza la dependencia</text>
<rect class="sv-soft" height="64" rx="2" width="94" x="340" y="206"/>
<text class="sv-t2" text-anchor="middle" x="387" y="234">motor:</text>
<text class="sv-t" text-anchor="middle" x="387" y="250" style="font-size:13.6px">lucha obrera</text>
<rect class="sv-box-green" height="64" rx="2" width="148" x="440" y="206"/>
<text class="sv-tgr" text-anchor="middle" x="514" y="228">Estado de bienestar</text>
<text class="sv-t2" text-anchor="middle" x="514" y="244" style="font-size:12px">posguerra: servicios</text>
<text class="sv-t2" text-anchor="middle" x="514" y="258" style="font-size:12px">arrancados por la lucha</text>
<rect class="sv-box" height="64" rx="2" width="146" x="594" y="206"/>
<text class="sv-t2" text-anchor="middle" x="667" y="242">—</text>
<rect class="sv-soft" height="72" rx="2" width="94" x="340" y="278"/>
<text class="sv-t2" text-anchor="middle" x="387" y="300">motor:</text>
<text class="sv-t" text-anchor="middle" x="387" y="316" style="font-size:13.6px">inversión</text>
<text class="sv-t" text-anchor="middle" x="387" y="331" style="font-size:13.6px">decadente</text>
<rect class="sv-box" height="72" rx="2" width="148" x="440" y="278"/>
<text class="sv-t2" text-anchor="middle" x="514" y="318">—</text>
<rect class="sv-box-red" height="72" rx="2" width="146" x="594" y="278"/>
<text class="sv-tr" text-anchor="middle" x="667" y="298" style="font-size:12.5px">Plan Roosevelt (post-29)</text>
<text class="sv-tr" text-anchor="middle" x="667" y="313" style="font-size:12.5px">post-2008 · ERTEs 2020</text>
<text class="sv-tr" text-anchor="middle" x="667" y="328" style="font-size:12.5px">rescates, topes 2022</text>
<text class="sv-t3" text-anchor="middle" x="667" y="344">ofensiva del capital</text>
<text class="sv-t2" text-anchor="middle" x="540" y="366" style="font-size:11.5px">las reformas-sostén desaparecen cuando el capital no las necesita;</text>
<text class="sv-t2" text-anchor="middle" x="540" y="380" style="font-size:11.5px">ambos tipos comparten la ideología keynesiana</text>
<rect class="sv-soft" height="40" rx="2" width="400" x="340" y="388"/>
<text class="sv-t3" text-anchor="middle" x="540" y="404">Secuencia histórica de la intervención</text>
<text class="sv-t2" text-anchor="middle" x="540" y="421" style="font-size:11.5px">1929 · posguerra · años 70: neoliberalismo · 2008 · 2020 · 2022</text>
<rect class="sv-box-gold" height="76" rx="2" width="400" x="340" y="438"/>
<text class="sv-tg" text-anchor="middle" x="540" y="456">Ideología keynesiana (hoy)</text>
<text class="sv-t2" text-anchor="middle" x="540" y="472" style="font-size:12px">Estado como instrumento neutro · reparto justo</text>
<text class="sv-t2" text-anchor="middle" x="540" y="487" style="font-size:12px">niega la competencia · culpa a «los ricos» de la inflación</text>
<text class="sv-t3" text-anchor="middle" x="540" y="504">igual que liberales y fascistas</text>
<path class="sv-line-dash" d="M340 476 H332 V396 H320" marker-end="url(#m2-4-arrow)"/>
<rect class="sv-box-ink" height="46" rx="2" width="720" x="20" y="526"/>
<text class="sv-tw" text-anchor="middle" x="380" y="544">Frente a la ideología keynesiana, organización comunista</text>
<text class="sv-tw" text-anchor="middle" x="380" y="561" style="font-size:12px">abolir los precios, la competencia, el capital · la socialdemocracia no es aliada ni «mientras tanto»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="590">flecha continua = deriva de · línea discontinua = lo que esa lectura ignora o niega</text>
</svg>
