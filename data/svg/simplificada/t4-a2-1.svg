<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, cadena causal de la competencia entre capitales a la guerra imperialista y el recorte de derechos, con el bucle por el que la guerra relanza la acumulación; en medio, los tres invariantes de la posición marxista; abajo, triángulo de respuestas: centrismo y frente-populismo, frentismo antiimperialista, y en el vértice el derrotismo revolucionario doble con sus cuatro mediaciones" role="img" viewBox="0 0 760 618" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="16">DE LA COMPETENCIA A LA GUERRA (cadena causal)</text>
<rect class="sv-box" height="66" rx="2" width="140" x="12" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="82" y="44">Competencia</text>
<text class="sv-t" text-anchor="middle" x="82" y="59.5">entre capitales</text>
<text class="sv-t2" text-anchor="middle" x="82" y="75" style="font-size:12px">expulsa trabajo vivo</text>
<rect class="sv-box" height="66" rx="2" width="140" x="160" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="230" y="44">Caída de la tasa</text>
<text class="sv-t" text-anchor="middle" x="230" y="59.5">de ganancia</text>
<text class="sv-t2" text-anchor="middle" x="230" y="75">sobreproducción</text>
<rect class="sv-box" height="66" rx="2" width="140" x="308" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="378" y="44">Nacionalismo</text>
<text class="sv-t" text-anchor="middle" x="378" y="59.5">económico</text>
<text class="sv-t2" text-anchor="middle" x="378" y="75">aranceles · rearme</text>
<rect class="sv-box-red" height="66" rx="2" width="140" x="456" y="26"></rect>
<text class="sv-tr" text-anchor="middle" x="526" y="44">Guerra</text>
<text class="sv-tr" text-anchor="middle" x="526" y="59">imperialista</text>
<text class="sv-t2" text-anchor="middle" x="526" y="75" style="font-size:12px">EE. UU. frente a China</text>
<rect class="sv-box" height="66" rx="2" width="140" x="604" y="26"></rect>
<text class="sv-t" text-anchor="middle" x="674" y="44">Austeridad y</text>
<text class="sv-t" text-anchor="middle" x="674" y="59.5">recorte de</text>
<text class="sv-t" text-anchor="middle" x="674" y="75">derechos políticos</text>
<text class="sv-t2" text-anchor="middle" x="674" y="88" style="font-size:12px">reverso del belicismo</text>
<path class="sv-line" d="M152 59 H158" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line" d="M300 59 H306" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line-red" d="M448 59 H454" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line" d="M596 59 H602" marker-end="url(#m4-2-arrow)"></path>
<path class="sv-line-dash" d="M526 92 V104 H230 V94" marker-end="url(#m4-2-arrow)"></path>
<text class="sv-t3" text-anchor="middle" x="378" y="118">la guerra destruye capital aceleradamente y puede relanzar la acumulación</text>
<text class="sv-t3" x="12" y="142">LA POSICIÓN DEL MARXISMO REVOLUCIONARIO: tres invariantes (no una copia mecánica del pasado)</text>
<rect class="sv-box-red" height="58" rx="2" width="736" x="12" y="150"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="168" style="font-size:12.5px">1 · Derrotismo: oponerse al propio bloque en nombre de la unidad del proletariado internacional</text>
<text class="sv-t2" text-anchor="middle" x="380" y="184" style="font-size:12.5px">2 · Oposición a la guerra imperialista sin pacifismo: se apoyan las guerras emancipatorias</text>
<text class="sv-t2" text-anchor="middle" x="380" y="200" style="font-size:12.5px">3 · Todo acto orientado a la conquista del poder: «convertir la guerra imperialista en guerra civil»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="222" style="font-size:11px">el defensismo de Marx y Engels fue legítimo; el de la II Internacional en 1914, una traición</text>
<text class="sv-t3" x="12" y="244">¿QUÉ RESPUESTA? TRES RESPUESTAS ANTE LA GUERRA: el fetiche de la unidad frente al derrotismo doble</text>
<rect class="sv-box-gold" height="66" rx="2" width="236" x="12" y="252"></rect>
<text class="sv-tg" text-anchor="middle" x="130" y="270">Centrismo / frente-populismo</text>
<text class="sv-t2" text-anchor="middle" x="130" y="285">unidad con la propia burguesía</text>
<text class="sv-t3" text-anchor="middle" x="130" y="298">OTAN · PSOE-Sumar · LFI</text>
<text class="sv-t2" text-anchor="middle" x="130" y="311" style="font-size:12px">social-imperialismo con frases socialistas</text>
<rect class="sv-box-gold" height="66" rx="2" width="236" x="512" y="252"></rect>
<text class="sv-tg" text-anchor="middle" x="630" y="270">Frentismo antiimperialista</text>
<text class="sv-t2" text-anchor="middle" x="630" y="285">unidad con las burguesías rivales</text>
<text class="sv-t3" text-anchor="middle" x="630" y="298">BRICS · multipolarismo</text>
<text class="sv-t2" text-anchor="middle" x="630" y="311" style="font-size:12px">«el enemigo de mi enemigo es mi amigo»</text>
<line class="sv-line-dash" x1="248" x2="512" y1="296" y2="296"></line>
<text class="sv-t3" text-anchor="middle" x="380" y="290">fetiche de la unidad</text>
<text class="sv-t3" text-anchor="middle" x="380" y="311" style="font-size:11px">ambas comparten el social-pacifismo</text>
<rect class="sv-box-red" height="64" rx="2" width="300" x="230" y="350"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="368">Derrotismo revolucionario doble</text>
<text class="sv-t2" text-anchor="middle" x="380" y="382.5">el enemigo principal está en casa,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="396.5">pero sin amistad con las rivales</text>
<text class="sv-t2" text-anchor="middle" x="380" y="410" style="font-size:12px">independencia de clase + internacionalismo</text>
<path class="sv-line-dash" d="M130 318 L270 350"></path>
<path class="sv-line-dash" d="M630 318 L490 350"></path>
<text class="sv-t3" text-anchor="middle" x="175" y="346">ni OTAN…</text>
<text class="sv-t3" text-anchor="middle" x="585" y="346">…ni BRICS</text>
<path class="sv-line-red" d="M380 414 V450" marker-end="url(#m4-2-arrow)"></path>
<text class="sv-t3" x="390" y="436">mediaciones: aterrizar los principios</text>
<rect class="sv-box-blue" height="62" rx="2" width="178" x="12" y="452"></rect>
<text class="sv-tb" text-anchor="middle" x="101" y="470">Derechos políticos</text>
<text class="sv-t2" text-anchor="middle" x="101" y="485">condición de la actividad</text>
<text class="sv-t2" text-anchor="middle" x="101" y="499" style="font-size:12px">comunista organizada</text>
<rect class="sv-box-blue" height="62" rx="2" width="178" x="198" y="452"></rect>
<text class="sv-tb" text-anchor="middle" x="287" y="470">Medidas transicionales</text>
<text class="sv-t2" text-anchor="middle" x="287" y="485">pan, paz y tierra · créditos</text>
<text class="sv-t2" text-anchor="middle" x="287" y="499" style="font-size:12px">«todo el poder a los soviets»</text>
<rect class="sv-box-blue" height="62" rx="2" width="178" x="384" y="452"></rect>
<text class="sv-tb" text-anchor="middle" x="473" y="470">Política militar</text>
<text class="sv-t2" text-anchor="middle" x="473" y="485">republicano-democrática</text>
<text class="sv-t2" text-anchor="middle" x="473" y="499" style="font-size:12px">fraternizar, no desertar</text>
<rect class="sv-box-blue" height="62" rx="2" width="178" x="570" y="452"></rect>
<text class="sv-tb" text-anchor="middle" x="659" y="470">Partido internacional</text>
<text class="sv-t2" text-anchor="middle" x="659" y="485">orientaciones vinculantes</text>
<text class="sv-t2" text-anchor="middle" x="659" y="499" style="font-size:12px">se construye en todo momento</text>
<rect class="sv-soft" height="52" rx="2" width="736" x="12" y="528"></rect>
<text class="sv-t3" x="22" y="544">EL COMUNISMO, «UNA TENSA CUERDA SOBRE UN PRECIPICIO»</text>
<text class="sv-t2" x="22" y="562" style="font-size:12px">ni coalición oportunista ni minorías conspirativas: convertir la tendencia a la guerra en construcción partidaria</text>
<line class="sv-line" x1="20" x2="50" y1="602" y2="602" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="58" y="606">causa → efecto</text>
<line class="sv-line-dash" x1="163" x2="193" y1="602" y2="602" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="201" y="606">relación · crítica</text>
<line class="sv-line-red" x1="329" x2="359" y1="602" y2="602" marker-end="url(#m4-2-arrow)"></line>
<text class="sv-t3" x="367" y="606">eje de la respuesta marxista</text>
</svg>
