<svg xmlns="http://www.w3.org/2000/svg" aria-label="Mapa de las once tesis que atraviesan los cinco volúmenes y cómo se encadenan: del marxismo como método al diagnóstico del capital, la crítica de los falsos amigos, la independencia política y sus tres dimensiones, hasta el horizonte comunista" role="img" viewBox="0 0 760 610" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0-fin" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">EL ARGUMENTO COMPARTIDO: DE LA CRÍTICA DE LA ECONOMÍA POLÍTICA A LA INTERNACIONAL</text>
<rect class="sv-box" rx="2" x="20" y="36" width="720" height="50"/>
<text class="sv-t" text-anchor="middle" x="380" y="55" style="font-size:13.4px;letter-spacing:0">Punto de partida: el marxismo es ciencia, filosofía y política a la vez, y sólo vive como organizador</text>
<text class="sv-t2" text-anchor="middle" x="380" y="70" style="font-size:11.5px">ni marxismo-dogma ni marxismo-académico: la crítica de la economía política es un arma para la revolución</text>
<text class="sv-t3" text-anchor="middle" x="380" y="81" style="font-size:9.5px">VOLÚMENES 1 · 3 · 5</text>
<path class="sv-line" d="M380 86 V114" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="392" y="104">diagnóstico</text>
<rect class="sv-box-red" rx="2" x="20" y="114" width="194" height="64"/>
<rect class="sv-box-red" rx="2" x="283" y="114" width="194" height="64"/>
<rect class="sv-box-red" rx="2" x="546" y="114" width="194" height="64"/>
<text class="sv-tr" text-anchor="middle" x="117" y="133">Capital como totalidad</text>
<text class="sv-t2" text-anchor="middle" x="117" y="148" style="font-size:11.5px">valor, crisis, fetichismo</text>
<text class="sv-t2" text-anchor="middle" x="117" y="161" style="font-size:11.5px">sujeto impersonal, no élites ni casta</text>
<text class="sv-t3" text-anchor="middle" x="117" y="173" style="font-size:9.5px">V 1 · 2 · 3 · 5</text>
<text class="sv-tr" text-anchor="middle" x="380" y="133">Crisis de acumulación</text>
<text class="sv-t2" text-anchor="middle" x="380" y="148" style="font-size:11.5px">declive, guerra, ecología</text>
<text class="sv-t2" text-anchor="middle" x="380" y="161" style="font-size:11.5px">inmanente: tasa de ganancia</text>
<text class="sv-t3" text-anchor="middle" x="380" y="173" style="font-size:9.5px">V 1 · 2 · 3 · 5</text>
<text class="sv-tr" text-anchor="middle" x="643" y="133">Estado = forma política</text>
<text class="sv-t2" text-anchor="middle" x="643" y="148" style="font-size:11.5px">del capital, no árbitro</text>
<text class="sv-t2" text-anchor="middle" x="643" y="161" style="font-size:11.5px">no se conquista: se destruye</text>
<text class="sv-t3" text-anchor="middle" x="643" y="173" style="font-size:9.5px">V 1 · 2 · 3 · 4</text>
<path class="sv-line" d="M214 146 H283" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="middle" x="248.5" y="138" style="font-size:10.5px">produce</text>
<path class="sv-line" d="M477 146 H546" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="middle" x="511.5" y="126" style="font-size:10.5px">giro</text>
<text class="sv-t3" text-anchor="middle" x="511.5" y="138" style="font-size:10.5px">autoritario</text>
<rect class="sv-box-gold" rx="2" x="110" y="206" width="540" height="64"/>
<text class="sv-tg" text-anchor="middle" x="380" y="225">Falsos amigos: socialdemocracia, populismo, campismo, sectarismo</text>
<text class="sv-t2" text-anchor="middle" x="380" y="240" style="font-size:11.5px">comparten la escisión producción/distribución y dependen del Estado</text>
<text class="sv-t2" text-anchor="middle" x="380" y="253" style="font-size:11.5px">oportunismo e izquierdismo: reversos simétricos, más peligrosos que los enemigos declarados</text>
<text class="sv-t3" text-anchor="middle" x="380" y="265" style="font-size:9.5px">V 1 · 2 · 3 · 4 · 5</text>
<path class="sv-line" d="M380 178 V206" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="392" y="196">respuestas insuficientes</text>
<path class="sv-line-dash" d="M117 178 V242 H110"/>
<path class="sv-line-dash" d="M643 178 V242 H650"/>
<text class="sv-t3" text-anchor="end" x="105" y="234" style="font-size:10px">naturalizan</text>
<text class="sv-t3" text-anchor="end" x="105" y="246" style="font-size:10px">el valor</text>
<text class="sv-t3" text-anchor="start" x="655" y="234" style="font-size:10px">dependen</text>
<text class="sv-t3" text-anchor="start" x="655" y="246" style="font-size:10px">del Estado</text>
<path class="sv-line-red" d="M380 270 V298" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="392" y="288">deslinde de campos</text>
<rect class="sv-box-ink" rx="2" x="20" y="298" width="460" height="64"/>
<text class="sv-tw" text-anchor="middle" x="250" y="317">INDEPENDENCIA POLÍTICA DEL PROLETARIADO</text>
<text class="sv-tw" text-anchor="middle" x="250" y="333" style="font-size:12px;font-weight:400">= Partido = socialismo + movimiento obrero</text>
<text class="sv-tw" text-anchor="middle" x="250" y="347" style="font-size:11.5px;font-weight:400">debe existir antes de la crisis: en el estallido «ya es tarde»</text>
<text class="sv-tw" text-anchor="middle" x="250" y="359" style="font-size:9.5px;font-weight:400;letter-spacing:.06em">V 1 · 3 · 4 · 5</text>
<rect class="sv-box-gold" rx="2" x="500" y="298" width="240" height="64"/>
<text class="sv-tg" text-anchor="middle" x="620" y="317" style="font-size:12.5px">Balance histórico: ni calco ni negación</text>
<text class="sv-t2" text-anchor="middle" x="620" y="333" style="font-size:11px">bolcheviques = forma madura de la clase</text>
<text class="sv-t2" text-anchor="middle" x="620" y="346" style="font-size:11px">estalinismo = adaptación al aislamiento</text>
<text class="sv-t3" text-anchor="middle" x="620" y="359" style="font-size:9.5px">V 1 · 2 · 3 · 4 · 5</text>
<path class="sv-line-dash" d="M500 330 H480"/>
<text class="sv-t3" text-anchor="middle" x="490" y="324" style="font-size:9.5px">lección</text>
<path class="sv-line" d="M136 362 V398" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="146" y="384">sujeto</text>
<path class="sv-line" d="M250 362 V380 H380 V398" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="end" x="296" y="376">poder</text>
<path class="sv-line" d="M440 362 V380 H624 V398" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="546" y="376">escala</text>
<rect class="sv-box-blue" rx="2" x="20" y="398" width="232" height="64"/>
<rect class="sv-box-blue" rx="2" x="264" y="398" width="232" height="64"/>
<rect class="sv-box-blue" rx="2" x="508" y="398" width="232" height="64"/>
<text class="sv-tb" text-anchor="middle" x="136" y="417">Conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="136" y="432" style="font-size:11.5px">racional y comunicable;</text>
<text class="sv-t2" text-anchor="middle" x="136" y="445" style="font-size:11.5px">teoría, propaganda, agitación</text>
<text class="sv-t3" text-anchor="middle" x="136" y="457" style="font-size:9.5px">SUJETO · V 1 · 3</text>
<text class="sv-tb" text-anchor="middle" x="380" y="417">Estado-Comuna</text>
<text class="sv-t2" text-anchor="middle" x="380" y="432" style="font-size:11.5px">derecho a la revolución;</text>
<text class="sv-t2" text-anchor="middle" x="380" y="445" style="font-size:11px">democracia = dictadura del proletariado</text>
<text class="sv-t3" text-anchor="middle" x="380" y="457" style="font-size:9.5px">PODER · V 1 · 4</text>
<text class="sv-tb" text-anchor="middle" x="624" y="417">Internacional</text>
<text class="sv-t2" text-anchor="middle" x="624" y="432" style="font-size:11.5px">derrotismo en el propio bloque;</text>
<text class="sv-t2" text-anchor="middle" x="624" y="445" style="font-size:11px">ni OTAN ni BRICS; nueva Internacional</text>
<text class="sv-t3" text-anchor="middle" x="624" y="457" style="font-size:9.5px">ESCALA · V 2 · 3 · 4 · 5</text>
<path class="sv-line" d="M380 462 V490" marker-end="url(#m0-fin)"/>
<text class="sv-t3" text-anchor="start" x="390" y="480">realiza</text>
<rect class="sv-box-green" rx="2" x="110" y="490" width="540" height="64"/>
<text class="sv-tgr" text-anchor="middle" x="380" y="509">Horizonte: asociación de productores libres</text>
<text class="sv-t2" text-anchor="middle" x="380" y="524" style="font-size:11.5px">que regulan conscientemente su metabolismo con la naturaleza</text>
<text class="sv-t2" text-anchor="middle" x="380" y="537" style="font-size:11.5px">abolición de las clases, del salario, de la propiedad privada, de la familia burguesa y del Estado</text>
<text class="sv-t3" text-anchor="middle" x="380" y="549" style="font-size:9.5px">EN TODOS LOS VOLÚMENES, CASI LITERALMENTE</text>
<rect class="sv-soft" rx="2" x="20" y="566" width="720" height="38"/>
<text class="sv-t3" text-anchor="middle" x="380" y="581" style="font-size:9.5px">FLECHA CONTINUA: ENCADENAMIENTO DEL ARGUMENTO · LÍNEA DISCONTINUA: PRESUPUESTO NO CUESTIONADO O LECCIÓN ASUMIDA</text>
<text class="sv-t3" text-anchor="middle" x="380" y="596" style="font-size:9.5px">V N = VOLÚMENES DONDE SE DESARROLLA · NEGRO: RESPUESTA DE LA COLECCIÓN · ORO: LO QUE RECHAZA Y LO QUE APRENDE</text>
</svg>
