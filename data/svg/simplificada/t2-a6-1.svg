<svg xmlns="http://www.w3.org/2000/svg" aria-label="Punto de partida (la salud como pretexto ideológico y el Estado de bienestar como gobierno psicológico); línea temporal de tres etapas de la normalidad psicológica, de la fábrica a la salud mental como sistema; el concepto de salud mental como ausencia cuyo referente es la norma; el ciclo central de ideal de normalidad, medición de la desviación, diagnóstico, terapia o reconocimiento, readaptación y refuerzo de la normalidad, con el eclecticismo socialdemócrata y la paradoja del discurso terapéutico al lado; y la conclusión que deslinda la crítica de conservadores y liberales" role="img" viewBox="0 0 760 614" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-6-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<rect class="sv-soft" height="42" rx="2" width="720" x="20" y="16"/>
<text class="sv-t" text-anchor="middle" x="380" y="34">Punto de partida: la salud ensalzada en abstracto es un pretexto ideológico</text>
<text class="sv-t2" text-anchor="middle" x="380" y="51" style="font-size:11.5px">el Estado de bienestar nació para gobernar la salud mental de los gobernados (Rose) · salud y enfermedad están socialmente mediadas</text>
<rect class="sv-box" height="74" rx="2" width="230" x="20" y="72"/>
<text class="sv-t3" text-anchor="middle" x="135" y="90">ETAPA 1 · primera mitad del s. XX</text>
<text class="sv-t" text-anchor="middle" x="135" y="108">La fábrica</text>
<text class="sv-t2" text-anchor="middle" x="135" y="124" style="font-size:12px">Mayo, taylorismo, «gran familia»</text>
<text class="sv-t2" text-anchor="middle" x="135" y="138" style="font-size:12px">autoridad desde dentro del individuo</text>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="250" x2="265" y1="112" y2="112"/>
<rect class="sv-box" height="74" rx="2" width="230" x="265" y="72"/>
<text class="sv-t3" text-anchor="middle" x="380" y="90">ETAPA 2 · último tercio del s. XX</text>
<text class="sv-t" text-anchor="middle" x="380" y="108">Subsunción total de la vida</text>
<text class="sv-t2" text-anchor="middle" x="380" y="124" style="font-size:12px">deslocalización, desapego laboral</text>
<text class="sv-t2" text-anchor="middle" x="380" y="138" style="font-size:12px">provisión mixta pública-privada</text>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="495" x2="510" y1="112" y2="112"/>
<rect class="sv-box-red" height="74" rx="2" width="230" x="510" y="72"/>
<text class="sv-t3" text-anchor="middle" x="625" y="90">ETAPA 3 · siglo XXI</text>
<text class="sv-tr" text-anchor="middle" x="625" y="108">Salud mental como sistema</text>
<text class="sv-t2" text-anchor="middle" x="625" y="124" style="font-size:12px">liberada de la cadena productiva</text>
<text class="sv-t2" text-anchor="middle" x="625" y="138" style="font-size:12px">la socialdemocracia, beneficiaria</text>
<text class="sv-t2" text-anchor="middle" x="380" y="166" style="font-size:11.5px">el eslogan «no necesitas un psicólogo, necesitas un sindicato» es anacrónico: trabajo y no-trabajo se retroalimentan</text>
<text class="sv-t3" text-anchor="middle" x="380" y="184">en las tres etapas opera el mismo ciclo, sobre el mismo concepto</text>
<rect class="sv-box" height="42" rx="2" width="720" x="20" y="192"/>
<text class="sv-t" text-anchor="middle" x="380" y="210">Salud mental = una ausencia: equilibrio nunca concretado</text>
<text class="sv-t2" text-anchor="middle" x="380" y="227" style="font-size:12px">se discute la forma y nunca el contenido del concepto · el referente real no es la biografía sino un ideal: la normalidad</text>
<line class="sv-line-dash" marker-end="url(#m2-6-arrow)" x1="270" x2="270" y1="234" y2="256"/>
<rect class="sv-box-ink" height="44" rx="2" width="160" x="190" y="258"/>
<text class="sv-tw" text-anchor="middle" x="270" y="276" style="font-size:13px">Ideal de normalidad</text>
<text class="sv-tw" text-anchor="middle" x="270" y="292" style="font-size:11px">«espejismo» inalcanzable</text>
<rect class="sv-box" height="44" rx="2" width="160" x="360" y="330"/>
<text class="sv-t" text-anchor="middle" x="440" y="348" style="font-size:13px">Medición de la desviación</text>
<text class="sv-t2" text-anchor="middle" x="440" y="364" style="font-size:11px">¿rebasa el límite de lo tolerable?</text>
<rect class="sv-box-red" height="44" rx="2" width="160" x="360" y="410"/>
<text class="sv-tr" text-anchor="middle" x="440" y="428" style="font-size:13px">Diagnóstico / enfermedad</text>
<text class="sv-t2" text-anchor="middle" x="440" y="444" style="font-size:11px">reflejo deformado de la salud</text>
<rect class="sv-box" height="44" rx="2" width="160" x="190" y="482"/>
<text class="sv-t" text-anchor="middle" x="270" y="500" style="font-size:13px">Terapia / reconocimiento</text>
<text class="sv-t2" text-anchor="middle" x="270" y="516" style="font-size:11px">la oferta antecede a la demanda</text>
<rect class="sv-box" height="44" rx="2" width="160" x="20" y="410"/>
<text class="sv-t" text-anchor="middle" x="100" y="428" style="font-size:13px">Readaptación al</text>
<text class="sv-t2" text-anchor="middle" x="100" y="444" style="font-size:11px">sentido común capitalista</text>
<rect class="sv-box" height="44" rx="2" width="160" x="20" y="330"/>
<text class="sv-t" text-anchor="middle" x="100" y="348" style="font-size:13px">Refuerzo de la normalidad</text>
<text class="sv-t2" text-anchor="middle" x="100" y="364" style="font-size:11px">la exclusión confirma la norma</text>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="350" x2="390" y1="296" y2="330"/>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="440" x2="440" y1="374" y2="410"/>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="390" x2="350" y1="454" y2="482"/>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="190" x2="150" y1="482" y2="454"/>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="100" x2="100" y1="410" y2="374"/>
<line class="sv-line" marker-end="url(#m2-6-arrow)" x1="150" x2="190" y1="330" y2="296"/>
<text class="sv-t2" text-anchor="middle" x="270" y="382">ciclo de la normalidad</text>
<text class="sv-t2" text-anchor="middle" x="270" y="398">psicológica</text>
<text class="sv-t2" text-anchor="middle" x="270" y="416" style="font-size:11px">extender el sentido</text>
<text class="sv-t2" text-anchor="middle" x="270" y="429" style="font-size:11px">común capitalista</text>
<rect class="sv-box-gold" height="66" rx="2" width="200" x="540" y="258"/>
<text class="sv-tg" text-anchor="middle" x="640" y="276">Eclecticismo socialdemócrata</text>
<text class="sv-t2" text-anchor="middle" x="640" y="293" style="font-size:11.5px">ley de salud mental (UP, 2021):</text>
<text class="sv-t2" text-anchor="middle" x="640" y="307" style="font-size:11.5px">«tendencias», no medidas</text>
<path class="sv-line-dash" d="M540 312 H530 V504 H350" marker-end="url(#m2-6-arrow)"/>
<rect class="sv-box-gold" height="80" rx="2" width="200" x="540" y="340"/>
<text class="sv-tg" text-anchor="middle" x="640" y="358">Paradoja del discurso</text>
<text class="sv-t2" text-anchor="middle" x="640" y="375" style="font-size:11.5px">terapéutico universal: si todos</text>
<text class="sv-t2" text-anchor="middle" x="640" y="389" style="font-size:11.5px">en terapia, «perpetuo</text>
<text class="sv-t2" text-anchor="middle" x="640" y="403" style="font-size:11.5px">enquistamiento del conflicto»</text>
<rect class="sv-box-ink" height="46" rx="2" width="720" x="20" y="540"/>
<text class="sv-tw" text-anchor="middle" x="380" y="558">Conclusión: la crítica apunta a la totalidad y a la praxis revolucionaria</text>
<text class="sv-tw" text-anchor="middle" x="380" y="575" style="font-size:11.5px">vías rechazadas: conservadurismo · privatización liberal → sólo la praxis socialista aspira a extinguir el desamparo y el sufrimiento</text>
<text class="sv-t3" text-anchor="middle" x="380" y="604">flecha continua = paso del ciclo / sucesión de etapas · discontinua = alimenta o fundamenta</text>
</svg>
