<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, la triple operación de la economía política, desde el individuo abstracto poseedor de mercancías hasta la fórmula trinitaria, con el carácter ideológico, burgués y fetichista de la economía política y la forma-salario como origen de la apariencia; abajo, un árbol en que la concepción burguesa de la producción se ramifica en economía política clásica, socialdemocracia, estalinismo y teoría radical contemporánea, frente al nodo de Marx y la conclusión: ni economicismo ni pluralismo de esferas." role="img" viewBox="0 0 760 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="22">LA TRIPLE OPERACIÓN DE LA ECONOMÍA POLÍTICA</text>
<rect class="sv-box" height="58" rx="2" width="132" x="20" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="86" y="54">Punto de partida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="86" y="70">individuo abstracto</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="86" y="84">poseedor de mercancías</text>
<rect class="sv-box" height="58" rx="2" width="132" x="167" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="233" y="54">1. Separar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233" y="70">forma social /</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233" y="84">contenido natural</text>
<rect class="sv-box" height="58" rx="2" width="132" x="314" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="54">2. Naturalizar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="70">el contenido</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="84">(la producción)</text>
<rect class="sv-box" height="58" rx="2" width="132" x="461" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="527" y="54">3. Naturalizar</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="527" y="70">la forma</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="527" y="84">(la distribución)</text>
<rect class="sv-box-gold" height="58" rx="2" width="132" x="608" y="34"></rect>
<text class="sv-tg" text-anchor="middle" x="674" y="54">Fórmula trinitaria</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="674" y="70">capital, tierra, trabajo:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="674" y="84">interés, renta, salario</text>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="152" x2="167" y1="63" y2="63"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="299" x2="314" y1="63" y2="63"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="446" x2="461" y1="63" y2="63"></line>
<line class="sv-line" marker-end="url(#m1-2-arrow)" x1="593" x2="608" y1="63" y2="63"></line>
<rect class="sv-soft" height="60" rx="2" width="720" x="20" y="104"></rect>
<text class="sv-t3" x="30" y="122">POR QUÉ ES IDEOLOGÍA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="138">ideológica, burguesa y fetichista: naturaliza lo histórico,</text>
<text class="sv-t2" style="font-size:12px" x="30" y="152">las relaciones burguesas y las cosas con poderes sociales</text>
<text class="sv-t3" x="425" y="122">DE DÓNDE NACE LA APARIENCIA (MARX)</text>
<text class="sv-t2" style="font-size:12px" x="425" y="138">forma-salario: el valor de la fuerza de trabajo aparece</text>
<text class="sv-t2" style="font-size:12px" x="425" y="152">como valor del trabajo y oculta el plustrabajo</text>
<line class="sv-line-dash" marker-end="url(#m1-2-arrow)" x1="380" x2="380" y1="164" y2="198"></line>
<text class="sv-t3" x="390" y="185">naturaliza las apariencias</text>
<rect class="sv-box-red" height="48" rx="2" width="360" x="200" y="198"></rect>
<text class="sv-tr" text-anchor="middle" x="380" y="218">Raíz común: concepción burguesa de la producción</text>
<text class="sv-t2" text-anchor="middle" x="380" y="235">como base técnica + relaciones de distribución</text>
<path class="sv-line" d="M380 246 V262 H100 V280" marker-end="url(#m1-2-arrow)"></path>
<path class="sv-line" d="M380 246 V262 H280 V280" marker-end="url(#m1-2-arrow)"></path>
<path class="sv-line" d="M380 246 V262 H460 V280" marker-end="url(#m1-2-arrow)"></path>
<path class="sv-line" d="M380 246 V262 H647 V280" marker-end="url(#m1-2-arrow)"></path>
<rect class="sv-box" height="62" rx="2" width="170" x="15" y="280"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="300">Economía política clásica</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="317">Smith, Mill: sólo la política</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="100" y="331">distorsiona la «armonía»</text>
<rect class="sv-box" height="62" rx="2" width="170" x="195" y="280"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="300">Socialdemocracia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="317">Kautsky: reformismo, retoques</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="280" y="331">en la distribución</text>
<rect class="sv-box" height="62" rx="2" width="170" x="375" y="280"></rect>
<text class="sv-t" text-anchor="middle" x="460" y="300">«Marxismo ortodoxo»</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="317">estalinista: primacía de las</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="460" y="331">fuerzas productivas</text>
<rect class="sv-box" height="62" rx="2" width="185" x="555" y="280"></rect>
<text class="sv-t" text-anchor="middle" x="647" y="300">Teoría «radical» actual</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="317">Brown, Deleuze-Guattari:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="647" y="331">«Marx failed to consider»</text>
<text class="sv-t3" text-anchor="middle" x="380" y="361">afirmación del proletariado: imagen negativa de la ideología burguesa</text>
<text class="sv-tr" text-anchor="middle" x="380" y="384">frente a todas ellas</text>
<rect class="sv-box-ink" height="54" rx="2" width="600" x="80" y="394"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="416">MARX: la contradicción está dentro de la producción (valor de uso / valor);</text>
<text class="sv-tw" text-anchor="middle" x="380" y="434">el capital es una relación social; el fetichismo es real</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="460"></rect>
<text class="sv-t3" x="30" y="477">CONCLUSIÓN</text>
<text class="sv-t2" style="font-size:12px" x="30" y="493">Ni economicismo ni «pluralismo» de esferas autónomas: crítica revolucionaria de las relaciones sociales objetivadas en ellas.</text>
</svg>
