<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Árbol genealógico de Podemos: tres raíces (eurocomunista, populista y trotskista), cada una descrita en su caja, convergen en el tronco Podemos 2014 y se ramifican en purgas, techo electoral y gobierno de coalición; a los lados, las dos escenas de 2014 y el paso de la impugnación a la administración del Estado; debajo, el eje temporal del 15M y la conclusión con las tareas" viewBox="0 0 760 558" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-5-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="130" y="18" text-anchor="middle">RAÍZ 1 · (ex)eurocomunista</text>
<rect class="sv-box" rx="2" x="20" y="28" width="220" height="30"/>
<text class="sv-t2" x="130" y="48" text-anchor="middle">Frentes populares</text>
<path class="sv-line" d="M130 58 V66" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="20" y="68" width="220" height="30"/>
<text class="sv-t2" x="130" y="88" text-anchor="middle">Vías nacionales al socialismo</text>
<path class="sv-line" d="M130 98 V106" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="20" y="108" width="220" height="60"/>
<text class="sv-t" x="130" y="126" text-anchor="middle">Eurocomunismo</text>
<text class="sv-t2" x="130" y="141" text-anchor="middle" style="font-size:12px;letter-spacing:0">renuncia abierta a la estrategia marxista:</text>
<text class="sv-t2" x="130" y="155" text-anchor="middle" style="font-size:12px;letter-spacing:0">ministerialismo, sin destruir el Estado</text>
<path class="sv-line" d="M130 168 V176" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box-gold" rx="2" x="20" y="178" width="220" height="50"/>
<text class="sv-tg" x="130" y="195" text-anchor="middle">PCE · IU (Anguita)</text>
<text class="sv-t2" x="130" y="210" text-anchor="middle" style="font-size:12px;letter-spacing:0">programa reformista y socialdemócrata;</text>
<text class="sv-t2" x="130" y="223" text-anchor="middle" style="font-size:12px;letter-spacing:0">su sentido común acabó dominando</text>
<text class="sv-t3" x="380" y="18" text-anchor="middle">RAÍZ 2 · populista</text>
<rect class="sv-box" rx="2" x="270" y="28" width="220" height="30"/>
<text class="sv-t2" x="380" y="48" text-anchor="middle">Experiencias nacional-populares</text>
<path class="sv-line" d="M380 58 V66" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="270" y="68" width="220" height="30"/>
<text class="sv-t2" x="380" y="88" text-anchor="middle">Laclau y Mouffe (academia)</text>
<path class="sv-line" d="M380 98 V106" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="270" y="108" width="220" height="60"/>
<text class="sv-t" x="380" y="126" text-anchor="middle">Hipótesis populista</text>
<text class="sv-t2" x="380" y="141" text-anchor="middle" style="font-size:12px;letter-spacing:0">demandas insatisfechas articuladas por</text>
<text class="sv-t2" x="380" y="155" text-anchor="middle" style="font-size:12px;letter-spacing:0">un líder carismático: pueblo vs. casta</text>
<path class="sv-line" d="M380 168 V176" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box-gold" rx="2" x="270" y="178" width="220" height="50"/>
<text class="sv-tg" x="380" y="195" text-anchor="middle">Errejonismo</text>
<text class="sv-t2" x="380" y="210" text-anchor="middle" style="font-size:12px;letter-spacing:0">mayor crecimiento, pero en minoría;</text>
<text class="sv-t2" x="380" y="223" text-anchor="middle" style="font-size:12px;letter-spacing:0">neutralizado → Más País</text>
<text class="sv-t3" x="630" y="18" text-anchor="middle">RAÍZ 3 · trotskista (SU)</text>
<rect class="sv-box" rx="2" x="520" y="28" width="220" height="30"/>
<text class="sv-t2" x="630" y="48" text-anchor="middle">IV Internacional · SU / Mandel</text>
<path class="sv-line" d="M630 58 V66" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="520" y="68" width="220" height="30"/>
<text class="sv-t2" x="630" y="88" text-anchor="middle">Entrismo sui generis</text>
<path class="sv-line" d="M630 98 V106" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="520" y="108" width="220" height="60"/>
<text class="sv-t" x="630" y="126" text-anchor="middle">Partido amplio anticapitalista</text>
<text class="sv-t2" x="630" y="141" text-anchor="middle" style="font-size:12px;letter-spacing:0">unidad con el reformismo, que siempre</text>
<text class="sv-t2" x="630" y="155" text-anchor="middle" style="font-size:12px;letter-spacing:0">prevalece = colaboración de clase</text>
<path class="sv-line" d="M630 168 V176" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box-gold" rx="2" x="520" y="178" width="220" height="50"/>
<text class="sv-tg" x="630" y="195" text-anchor="middle">Anticapitalistas</text>
<text class="sv-t2" x="630" y="210" text-anchor="middle" style="font-size:12px;letter-spacing:0">desfigura el partido y la dictadura</text>
<text class="sv-t2" x="630" y="223" text-anchor="middle" style="font-size:12px;letter-spacing:0">del proletariado</text>
<path class="sv-line" d="M130 228 V242 H300 V256" marker-end="url(#m4-5-arrow)"/>
<path class="sv-line" d="M380 228 V256" marker-end="url(#m4-5-arrow)"/>
<path class="sv-line" d="M630 228 V242 H460 V256" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box-red" rx="2" x="250" y="258" width="260" height="66"/>
<text class="sv-tr" x="380" y="276" text-anchor="middle">PODEMOS (2014)</text>
<text class="sv-t2" x="380" y="291" text-anchor="middle" style="font-size:12px;letter-spacing:0">máquina de guerra electoral (Blitzkrieg)</text>
<text class="sv-t2" x="380" y="304" text-anchor="middle" style="font-size:12px;letter-spacing:0">dirección reducida, democracia plebiscitaria</text>
<text class="sv-t2" x="380" y="317" text-anchor="middle" style="font-size:12px;letter-spacing:0">su rápido ascenso fue también su condena</text>
<rect class="sv-soft" rx="2" x="20" y="250" width="222" height="80"/>
<text class="sv-t3" x="30" y="267">LAS DOS ESCENAS DE 2014</text>
<text class="sv-t2" x="30" y="284" style="font-size:12px;letter-spacing:0">22-M: Marchas de la Dignidad (clase,</text>
<text class="sv-t2" x="30" y="297" style="font-size:12px;letter-spacing:0">trabajo de base) · 17-E: Podemos</text>
<text class="sv-t2" x="30" y="310" style="font-size:12px;letter-spacing:0">cierra la fase movimientista del 15M</text>
<text class="sv-t2" x="30" y="323" style="font-size:12px;letter-spacing:0">y abre la institucional</text>
<rect class="sv-soft" rx="2" x="518" y="250" width="222" height="80"/>
<text class="sv-t3" x="528" y="267">DEL 15M AL GOBIERNO</text>
<text class="sv-t2" x="528" y="284" style="font-size:12px;letter-spacing:0">de impugnar el régimen del 78 a</text>
<text class="sv-t2" x="528" y="297" style="font-size:12px;letter-spacing:0">administrar un Estado capitalista en</text>
<text class="sv-t2" x="528" y="310" style="font-size:12px;letter-spacing:0">crisis: barniz social que sentó las</text>
<text class="sv-t2" x="528" y="323" style="font-size:12px;letter-spacing:0">bases del auge reaccionario</text>
<path class="sv-line-dash" d="M300 324 V336 H130 V348" marker-end="url(#m4-5-arrow)"/>
<path class="sv-line-dash" d="M380 324 V348" marker-end="url(#m4-5-arrow)"/>
<path class="sv-line-dash" d="M460 324 V336 H630 V348" marker-end="url(#m4-5-arrow)"/>
<rect class="sv-box" rx="2" x="20" y="350" width="220" height="50"/>
<text class="sv-t" x="130" y="368" text-anchor="middle">Purgas y escisiones</text>
<text class="sv-t2" x="130" y="383" text-anchor="middle" style="font-size:12px;letter-spacing:0">Más País · salida de Anticapitalistas</text>
<text class="sv-t2" x="130" y="396" text-anchor="middle" style="font-size:12px;letter-spacing:0">organización sólo en manos de Iglesias</text>
<rect class="sv-box" rx="2" x="270" y="350" width="220" height="50"/>
<text class="sv-t" x="380" y="368" text-anchor="middle">Techo electoral 2015-16</text>
<text class="sv-t2" x="380" y="383" text-anchor="middle" style="font-size:12px;letter-spacing:0">sin sorpasso · guerra mediática y judicial</text>
<text class="sv-t2" x="380" y="396" text-anchor="middle" style="font-size:12px;letter-spacing:0">Syriza ante la Troika; recuperación</text>
<rect class="sv-box" rx="2" x="520" y="350" width="220" height="50"/>
<text class="sv-t" x="630" y="368" text-anchor="middle">Gobierno de coalición</text>
<text class="sv-t2" x="630" y="383" text-anchor="middle" style="font-size:12px;letter-spacing:0">administración del Estado en crisis</text>
<text class="sv-t2" x="630" y="396" text-anchor="middle" style="font-size:12px;letter-spacing:0">el sentido común de IU, con Iglesias</text>
<text class="sv-t3" x="20" y="420">flecha continua: filiación y confluencia · discontinua: desenlace · eje: fases del ciclo del 15M</text>
<line class="sv-line" x1="20" y1="448" x2="740" y2="448" marker-end="url(#m4-5-arrow)"/>
<circle class="sv-dot-b" cx="90" cy="448" r="5"/>
<text class="sv-tb" x="90" y="435" text-anchor="middle">2011</text>
<text class="sv-t2" x="90" y="467" text-anchor="middle">15M: movimiento</text>
<circle class="sv-dot-b" cx="290" cy="448" r="5"/>
<text class="sv-tb" x="290" y="435" text-anchor="middle">2014</text>
<text class="sv-t2" x="290" y="467" text-anchor="middle">institucionalización</text>
<circle class="sv-dot-b" cx="480" cy="448" r="5"/>
<text class="sv-tb" x="480" y="435" text-anchor="middle">2015-2016</text>
<text class="sv-t2" x="480" y="467" text-anchor="middle">techo electoral</text>
<circle class="sv-dot-b" cx="660" cy="448" r="5"/>
<text class="sv-tb" x="660" y="435" text-anchor="middle">2020</text>
<text class="sv-t2" x="660" y="467" text-anchor="middle">gobierno</text>
<rect class="sv-soft" rx="2" x="20" y="484" width="720" height="62"/>
<text class="sv-t3" x="30" y="501">CONCLUSIÓN · TAREAS</text>
<text class="sv-t2" x="30" y="518" style="font-size:12px;letter-spacing:0">Las tres familias renunciaron al programa comunista; su posibilismo sólo siembra desilusión y echa leña al fuego reaccionario.</text>
<text class="sv-t2" x="30" y="532" style="font-size:12px;letter-spacing:0">Tarea: recomponer al proletariado como sujeto político independiente (partido comunista) antes de cualquier alianza táctica.</text>
</svg>
