<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, las preguntas de Kollontai de 1910 como punto de partida; debajo, dos columnas con línea temporal central: a la izquierda la secuencia histórica de Zetkin a Lenin (1896-1921), con la incorporación al salario como premisa y el debate entre delegadas alemanas y austriacas; a la derecha la secuencia actual desde el economicismo y la incorporación al salario hasta la descomposición del proletariado; ambas convergen en el nodo central frente socialista de mujeres como forma transitoria para construir el Partido, flanqueado por los dos errores a evitar y seguido de dos filas con sus siete funciones y del objetivo de una militancia integral" role="img" viewBox="0 0 760 688" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="12" y="20">PUNTO DE PARTIDA: LAS PREGUNTAS DE KOLLONTAI (COPENHAGUE, 1910) SIGUEN VIGENTES</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="20" y="45" style="font-size:11.5px;letter-spacing:0">«¿Qué es el movimiento socialista de mujeres? ¿No es simplemente una rama del feminismo burgués? ¿Por qué no es absorbido</text>
<text class="sv-t2" x="20" y="60" style="font-size:11.5px;letter-spacing:0">por el movimiento obrero?» Siguen vigentes: el ciclo del siglo XX no superó la opresión específica de las mujeres trabajadoras.</text>
<text class="sv-t3" x="12" y="92">HISTORIA · 1896–1921</text>
<text class="sv-t3" text-anchor="end" x="748" y="92">ACTUALIDAD</text>

<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="102"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="121" style="font-size:13.2px;letter-spacing:0">Zetkin: «cuestión femenina moderna»</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="137" style="font-size:12px;letter-spacing:0">lucha de clase; voto como instrumento</text>
<path class="sv-line" d="M129.5 146 V154" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="156"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="175" style="font-size:12.6px;letter-spacing:0">Trabajo asalariado → activación política</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="191" style="font-size:12px;letter-spacing:0">derechos políticos como «necesidad urgente»</text>
<path class="sv-line" d="M129.5 200 V208" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="210"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="229">Conferencias de 1907 y 1910</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="245" style="font-size:12px;letter-spacing:0">agrupación de mujeres proletarias (debate)</text>
<path class="sv-line" d="M129.5 254 V262" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="264"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="283">Principio-guía y Directrices</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="299" style="font-size:12px;letter-spacing:0">agitación socialista, no feminista</text>
<path class="sv-line" d="M129.5 308 V316" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="318"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="337">III Congreso de la Comintern</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="353" style="font-size:12px;letter-spacing:0">tesis para la propaganda entre las mujeres</text>
<path class="sv-line" d="M129.5 362 V370" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-blue" height="44" rx="2" width="235" x="12" y="372"></rect>
<text class="sv-t" text-anchor="middle" x="129.5" y="391">Lenin: organismos específicos</text>
<text class="sv-t2" text-anchor="middle" x="129.5" y="407" style="font-size:12px;letter-spacing:0">del partido, no organizaciones separadas</text>

<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="102"></rect>
<text class="sv-t" text-anchor="middle" x="630.5" y="121" style="font-size:13.7px;letter-spacing:0">Economicismo + salarización masiva</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="136" style="font-size:12px;letter-spacing:0">años 60-70: condiciones del feminismo;</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="149" style="font-size:12px;letter-spacing:0">división del proletariado por género o raza</text>
<path class="sv-line" d="M630.5 154 V162" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="164"></rect>
<text class="sv-t" text-anchor="middle" x="630.5" y="183">Feminismo hegemónico</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="198" style="font-size:12px;letter-spacing:0">moviliza, pero sin programa emancipador:</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="211" style="font-size:12px;letter-spacing:0">normatividad reformista</text>
<path class="sv-line" d="M630.5 216 V224" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="226"></rect>
<text class="sv-t" text-anchor="middle" x="630.5" y="245">Sujetos devaluados, miseria moral</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="260" style="font-size:12px;letter-spacing:0">identidades interclasistas → reformismo;</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="273" style="font-size:12px;letter-spacing:0">violencia que atomiza la clase</text>
<path class="sv-line" d="M630.5 278 V286" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="288"></rect>
<text class="sv-t" text-anchor="middle" x="630.5" y="307">Ofensiva burguesa actual</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="322" style="font-size:12px;letter-spacing:0">precariedad, cuidados, violencia,</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="335" style="font-size:12px;letter-spacing:0">privatización, discurso reaccionario</text>
<path class="sv-line" d="M630.5 340 V348" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-gold" height="52" rx="2" width="235" x="513" y="350"></rect>
<text class="sv-t" text-anchor="middle" x="630.5" y="369">Descomposición del proletariado</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="384" style="font-size:12px;letter-spacing:0">tarea: unir la lucha contra las opresiones</text>
<text class="sv-t2" text-anchor="middle" x="630.5" y="397" style="font-size:12px;letter-spacing:0">con la estrategia socialista</text>

<path class="sv-line-dash" d="M380 102 V110"></path>
<path class="sv-line-dash" d="M380 130 V164"></path>
<path class="sv-line-dash" d="M380 184 V218"></path>
<path class="sv-line-dash" d="M380 238 V272"></path>
<path class="sv-line-dash" d="M380 292 V326"></path>
<path class="sv-line-dash" d="M380 346 V380"></path>
<path class="sv-line-dash" d="M380 400 V430"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="124">1896</text>
<text class="sv-t3" text-anchor="middle" x="380" y="178">premisa</text>
<text class="sv-t3" text-anchor="middle" x="380" y="232">1907–1910</text>
<text class="sv-t3" text-anchor="middle" x="380" y="286">1896 · 1920</text>
<text class="sv-t3" text-anchor="middle" x="380" y="340">1921</text>
<text class="sv-t3" text-anchor="middle" x="380" y="394">Lenin</text>

<path class="sv-line" d="M129.5 416 V440 H300 V450" marker-end="url(#m3-4-arrow)"></path>
<path class="sv-line" d="M630.5 402 V440 H460 V450" marker-end="url(#m3-4-arrow)"></path>
<rect class="sv-box-ink" height="48" rx="2" width="410" x="175" y="452"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="473">Frente socialista de mujeres</text>
<text class="sv-tw" text-anchor="middle" x="380" y="491">forma transitoria para construir el Partido Comunista</text>
<rect class="sv-box-red" height="48" rx="2" width="150" x="12" y="452"></rect>
<text class="sv-tr" text-anchor="middle" x="87" y="472">Error: identitarismo</text>
<text class="sv-t2" text-anchor="middle" x="87" y="488" style="font-size:11.4px;letter-spacing:0">«oprimido = revolucionario»</text>
<rect class="sv-box-red" height="48" rx="2" width="150" x="598" y="452"></rect>
<text class="sv-tr" text-anchor="middle" x="673" y="472" style="font-size:11.7px;letter-spacing:0">Error: falso universalismo</text>
<text class="sv-t2" text-anchor="middle" x="673" y="488" style="font-size:11.4px;letter-spacing:0">niega las diferencias</text>

<text class="sv-t3" x="12" y="524">FUNCIONES DEL FRENTE</text>
<path class="sv-line" d="M380 500 V532 M101 532 H659 M101 532 V542 M287 532 V542 M473 532 V542 M659 532 V542 M194 532 V596 M380 532 V596 M566 532 V596"></path>
<rect class="sv-box-green" height="44" rx="2" width="178" x="12" y="542"></rect>
<text class="sv-t2" text-anchor="middle" x="101" y="560" style="font-size:12px">Desmontar la identidad</text>
<text class="sv-t2" text-anchor="middle" x="101" y="575" style="font-size:12px">interclasista «mujer»</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="198" y="542"></rect>
<text class="sv-t2" text-anchor="middle" x="287" y="560" style="font-size:12px">Romper con el</text>
<text class="sv-t2" text-anchor="middle" x="287" y="575" style="font-size:12px">programa reformista</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="384" y="542"></rect>
<text class="sv-t2" text-anchor="middle" x="473" y="560" style="font-size:12px">Difundir conciencia socialista</text>
<text class="sv-t2" text-anchor="middle" x="473" y="575" style="font-size:12px">entre las mujeres proletarias</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="570" y="542"></rect>
<text class="sv-t2" text-anchor="middle" x="659" y="560" style="font-size:12px">Conectar el programa con</text>
<text class="sv-t2" text-anchor="middle" x="659" y="575" style="font-size:12px">la forma concreta de la opresión</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="105" y="596"></rect>
<text class="sv-t2" text-anchor="middle" x="194" y="614" style="font-size:12px">Neutralizar la función</text>
<text class="sv-t2" text-anchor="middle" x="194" y="629" style="font-size:12px">de la opresión</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="291" y="596"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="614" style="font-size:12px">Mejorar condiciones de vida</text>
<text class="sv-t2" text-anchor="middle" x="380" y="629" style="font-size:12px">→ participación política</text>
<rect class="sv-box-green" height="44" rx="2" width="178" x="477" y="596"></rect>
<text class="sv-t2" text-anchor="middle" x="566" y="614" style="font-size:12px">Educar en ética comunista</text>
<text class="sv-t2" text-anchor="middle" x="566" y="629" style="font-size:12px">dentro y fuera del partido</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="648"></rect>
<text class="sv-t2" text-anchor="middle" x="380" y="665" style="font-size:12px;letter-spacing:0">Objetivo: una militancia integral (las mujeres como activos políticos en su totalidad),</text>
<text class="sv-t2" text-anchor="middle" x="380" y="680" style="font-size:12px;letter-spacing:0">no militancias parciales que convierten la fragmentación social en fragmentación política</text>
</svg>
