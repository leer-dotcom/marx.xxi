<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, las herramientas del análisis marxista de coyuntura; después, línea temporal en tres ciclos de acumulación (keynesiano, neoliberal y nuevo keynesianismo de ofensiva, dividido en dominancia monetaria y fiscal) con la tasa de ganancia descendiendo en escalones; debajo, las lecciones de cada tramo, que fundamentan las cinco conclusiones estratégicas y convergen en el nodo final: Partido independiente a escala europea e internacional" role="img" viewBox="0 0 760 670" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m3-2-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>

<text class="sv-t3" x="12" y="20">MÉTODO: ANÁLISIS MARXISTA DE COYUNTURA («CONOCER PARA TRANSFORMAR»)</text>
<rect class="sv-soft" height="40" rx="2" width="736" x="12" y="28"></rect>
<text class="sv-t2" x="22" y="45" style="font-size:12px">Dos herramientas: el ciclo de acumulación (periodo entre crisis severas; cada ciclo relanza la acumulación en condiciones</text>
<text class="sv-t2" x="22" y="60" style="font-size:12px">más precarias) y la perspectiva de clase (la reproducción capitalista es ya ofensiva del capital sobre el trabajo).</text>

<text class="sv-tr" x="12" y="90">tasa de ganancia: cae en escalones y nunca recupera los niveles previos</text>
<path class="sv-line-red" d="M20 104 H200 L230 124 H430 L460 144 H745"></path>
<circle class="sv-dot" cx="215" cy="114" r="5"></circle><text class="sv-t3" text-anchor="middle" x="215" y="142">crisis 70s</text>
<circle class="sv-dot" cx="445" cy="134" r="5"></circle><text class="sv-t3" text-anchor="middle" x="445" y="162">crisis 2008</text>

<rect class="sv-box-blue" height="60" rx="2" width="200" x="12" y="172"></rect>
<text class="sv-t" text-anchor="middle" x="112" y="192">Ciclo keynesiano · 1945–70s</text>
<text class="sv-t2" text-anchor="middle" x="112" y="209" style="font-size:12px">integración sistémica, pacto</text>
<text class="sv-t2" text-anchor="middle" x="112" y="224" style="font-size:12px">interclasista «de pies de barro»</text>
<rect class="sv-box-gold" height="60" rx="2" width="220" x="224" y="172"></rect>
<text class="sv-t" text-anchor="middle" x="334" y="192">Ciclo neoliberal · 70s/80s–2008</text>
<text class="sv-t2" text-anchor="middle" x="334" y="209" style="font-size:12px">ofensiva de clase: Estado + mercado,</text>
<text class="sv-t2" text-anchor="middle" x="334" y="224" style="font-size:12px">UE como dispositivo, financiarización</text>
<rect class="sv-box-red" height="60" rx="2" width="292" x="456" y="172"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="192">Nuevo keynesianismo de ofensiva · 2008–</text>
<text class="sv-t2" text-anchor="middle" x="602" y="209" style="font-size:12px">el Estado sostiene a un capital estructuralmente</text>
<text class="sv-t2" text-anchor="middle" x="602" y="224" style="font-size:12px">débil; la guerra mundial se vuelve factible</text>
<path class="sv-line" d="M602 232 V242" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box" height="44" rx="2" width="292" x="456" y="244"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="262">Dominancia monetaria · 2008–2020</text>
<text class="sv-t2" text-anchor="middle" x="602" y="278" style="font-size:11.5px">Banco Central, austeridad de clase, liberalismo autoritario</text>
<path class="sv-line" d="M602 288 V298" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box" height="44" rx="2" width="292" x="456" y="300"></rect>
<text class="sv-t" text-anchor="middle" x="602" y="318">Dominancia fiscal · pandemia–</text>
<text class="sv-t2" text-anchor="middle" x="602" y="334" style="font-size:11.5px">política industrial, inflación, rearme, guerras delegadas</text>

<path class="sv-line-dash" d="M112 232 V354" marker-end="url(#m3-2-arrow)"></path>
<path class="sv-line-dash" d="M334 232 V354" marker-end="url(#m3-2-arrow)"></path>
<path class="sv-line-dash" d="M602 344 V354" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-soft" height="52" rx="2" width="200" x="12" y="356"></rect>
<text class="sv-tb" text-anchor="middle" x="112" y="374">Lección</text>
<text class="sv-t2" text-anchor="middle" x="112" y="389" style="font-size:12px">el reformismo fracasa incluso</text>
<text class="sv-t2" text-anchor="middle" x="112" y="403" style="font-size:12px">como proyecto armonizador</text>
<rect class="sv-soft" height="52" rx="2" width="220" x="224" y="356"></rect>
<text class="sv-tb" text-anchor="middle" x="334" y="374">Lección</text>
<text class="sv-t2" text-anchor="middle" x="334" y="389" style="font-size:12px">no ideología sino reacción de clase;</text>
<text class="sv-t2" text-anchor="middle" x="334" y="403" style="font-size:12px">cada ciclo deja bases más endebles</text>
<rect class="sv-soft" height="52" rx="2" width="292" x="456" y="356"></rect>
<text class="sv-tb" text-anchor="middle" x="602" y="374">Lección</text>
<text class="sv-t2" text-anchor="middle" x="602" y="389" style="font-size:12px">austeridad de clase, liberalismo</text>
<text class="sv-t2" text-anchor="middle" x="602" y="403" style="font-size:12px">autoritario, rearme y guerra</text>
<path class="sv-line" d="M112 408 V420 H378"></path>
<path class="sv-line" d="M334 408 V420"></path>
<path class="sv-line" d="M602 408 V420 H382"></path>
<path class="sv-line" d="M380 420 V442" marker-end="url(#m3-2-arrow)"></path>
<text class="sv-t3" x="12" y="436">CINCO CONCLUSIONES ESTRATÉGICAS</text>
<text class="sv-t3" text-anchor="end" x="748" y="436">discontinua: deja una lección · continua: fundamenta</text>
<rect class="sv-box" height="28" rx="2" width="736" x="12" y="444"></rect>
<text class="sv-t" x="22" y="463" style="font-size:13px">1 · Escala europea</text>
<text class="sv-t2" x="196" y="463" style="font-size:12px">Europa es el espacio mínimo de la organización socialista; horizonte final: internacional.</text>
<rect class="sv-box" height="28" rx="2" width="736" x="12" y="478"></rect>
<text class="sv-t" x="22" y="497" style="font-size:13px">2 · Juventud</text>
<text class="sv-t2" x="196" y="497" style="font-size:12px">la juventud es el nuevo proletariado masivo: la primera expresión política será juvenil.</text>
<rect class="sv-box" height="28" rx="2" width="736" x="12" y="512"></rect>
<text class="sv-t" x="22" y="531" style="font-size:13px">3 · Frentes del bienestar</text>
<text class="sv-t2" x="196" y="531" style="font-size:12px">las luchas por sanidad, educación, pensiones… unifican a la clase contra capital y Estado.</text>
<rect class="sv-box" height="28" rx="2" width="736" x="12" y="546"></rect>
<text class="sv-t" x="22" y="565" style="font-size:13px">4 · Crisis y Partido</text>
<text class="sv-t2" x="196" y="565" style="font-size:12px">la crisis es el horizonte, pero el gobierno nunca «caerá» si no se le «hace caer» (Gramsci).</text>
<rect class="sv-box" height="28" rx="2" width="736" x="12" y="580"></rect>
<text class="sv-t" x="22" y="599" style="font-size:13px">5 · Guerra mundial</text>
<text class="sv-t2" x="196" y="599" style="font-size:12px">necesidad sistémica del capital: no hay paz sin un poder socialista organizado a nivel global.</text>
<path class="sv-line" d="M380 608 V620" marker-end="url(#m3-2-arrow)"></path>
<rect class="sv-box-ink" height="40" rx="2" width="460" x="150" y="622"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="640">Partido independiente, a escala europea como mínimo e internacional</text>
<text class="sv-tw" text-anchor="middle" x="380" y="656">construido antes de la crisis: «paciencia estratégica»</text>
</svg>
