<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tabla de oposición entre la Esquerra Independentista con su Unitat Popular y el Movimiento Socialista en nueve filas, precedida por la hipótesis de que la Unitat Popular expresa los intereses de la clase media, y debajo el silogismo tachado opresión nacional, conciencia de clase, socialismo con sus tres refutaciones" role="img" viewBox="0 0 760 612" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m2-8-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-soft" height="28" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-t3" text-anchor="start" x="32" y="32">HIPÓTESIS</text>
<text class="sv-t2" text-anchor="middle" x="420" y="32" style="font-size:12px">la Unitat Popular expresa los intereses de la clase media; «nacionalismo revolucionario» es un oxímoron</text>
<rect class="sv-box-red" height="36" rx="2" width="280" x="150" y="52"></rect>
<text class="sv-tr" text-anchor="middle" x="290" y="68">Esquerra Independentista</text>
<text class="sv-t3" text-anchor="middle" x="290" y="82">Unitat Popular</text>
<rect class="sv-box-blue" height="36" rx="2" width="300" x="440" y="52"></rect>
<text class="sv-tb" text-anchor="middle" x="590" y="68">Movimiento Socialista</text>
<text class="sv-t3" text-anchor="middle" x="590" y="82">comunismo como totalidad</text>
<rect class="sv-soft" height="32" rx="2" width="120" x="20" y="96"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="117">Marco</text>
<rect class="sv-box" height="32" rx="2" width="280" x="150" y="96"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="117">tres ejes: nacional · social · género</text>
<rect class="sv-box" height="32" rx="2" width="300" x="440" y="96"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="117">totalidad: las opresiones son poder burgués</text>
<rect class="sv-soft" height="32" rx="2" width="120" x="20" y="134"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="155">Sujeto</text>
<rect class="sv-box" height="32" rx="2" width="280" x="150" y="134"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="155">«clases populares», nación, interclasismo</text>
<rect class="sv-box" height="32" rx="2" width="300" x="440" y="134"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="155">proletariado políticamente independiente</text>
<rect class="sv-soft" height="32" rx="2" width="120" x="20" y="172"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="193">Horizonte</text>
<rect class="sv-box" height="32" rx="2" width="280" x="150" y="172"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="193">independencia → socialismo (etapismo)</text>
<rect class="sv-box" height="32" rx="2" width="300" x="440" y="172"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="193">internacionalismo proletario</text>
<rect class="sv-soft" height="44" rx="2" width="120" x="20" y="210"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="229">Nación y</text>
<text class="sv-t" text-anchor="middle" x="80" y="244">cultura</text>
<rect class="sv-box" height="44" rx="2" width="280" x="150" y="210"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="229">nación esencializada;</text>
<text class="sv-t2" text-anchor="middle" x="290" y="244">«identidad de país»</text>
<rect class="sv-box" height="44" rx="2" width="300" x="440" y="210"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="229">nacionalidad: conciencia del productor de</text>
<text class="sv-t2" text-anchor="middle" x="590" y="244">mercancías; acabar con la dominación</text>
<rect class="sv-soft" height="40" rx="2" width="120" x="20" y="260"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="277">Relación con</text>
<text class="sv-t" text-anchor="middle" x="80" y="292">el Estado</text>
<rect class="sv-box" height="40" rx="2" width="280" x="150" y="260"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="285">acción institucional, municipalismo</text>
<rect class="sv-box" height="40" rx="2" width="300" x="440" y="260"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="285">extinción del Estado; poder independiente</text>
<rect class="sv-soft" height="40" rx="2" width="120" x="20" y="306"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="323">Reformas y</text>
<text class="sv-t" text-anchor="middle" x="80" y="338">demandas</text>
<rect class="sv-box" height="40" rx="2" width="280" x="150" y="306"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="331">nacen y mueren en la necesidad inmediata</text>
<rect class="sv-box" height="40" rx="2" width="300" x="440" y="306"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="331">evidencian el carácter de clase del Estado</text>
<rect class="sv-soft" height="40" rx="2" width="120" x="20" y="352"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="369">Toma del</text>
<text class="sv-t" text-anchor="middle" x="80" y="384">poder</text>
<rect class="sv-box" height="40" rx="2" width="280" x="150" y="352"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="377">desgaste defensivo, ciclos electorales</text>
<rect class="sv-box" height="40" rx="2" width="300" x="440" y="352"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="377">construcción de organización comunista</text>
<rect class="sv-soft" height="40" rx="2" width="120" x="20" y="398"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="415">Movimiento</text>
<text class="sv-t" text-anchor="middle" x="80" y="430">popular</text>
<rect class="sv-box" height="40" rx="2" width="280" x="150" y="398"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="423">militantes «enviados» a colectivos locales</text>
<rect class="sv-box" height="40" rx="2" width="300" x="440" y="398"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="423">socializar tesis, espacios de encuadramiento</text>
<rect class="sv-soft" height="32" rx="2" width="120" x="20" y="444"></rect>
<text class="sv-t" text-anchor="middle" x="80" y="465">Identidad</text>
<rect class="sv-box" height="32" rx="2" width="280" x="150" y="444"></rect>
<text class="sv-t2" text-anchor="middle" x="290" y="465">nacionalismo + obrerismo</text>
<rect class="sv-box" height="32" rx="2" width="300" x="440" y="444"></rect>
<text class="sv-t2" text-anchor="middle" x="590" y="465">la clase como relación a superar</text>
<text class="sv-t3" text-anchor="start" x="20" y="496">EL SILOGISMO QUE SE DERRUMBA · «la independencia facilita el socialismo»</text>
<rect class="sv-box" height="36" rx="2" width="170" x="60" y="504"></rect>
<text class="sv-t" text-anchor="middle" x="145" y="527">Opresión nacional</text>
<rect class="sv-box" height="36" rx="2" width="170" x="295" y="504"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="527">Conciencia de clase</text>
<rect class="sv-box" height="36" rx="2" width="170" x="530" y="504"></rect>
<text class="sv-t" text-anchor="middle" x="615" y="527">Socialismo</text>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="230" x2="295" y1="522" y2="522"></line>
<line class="sv-line" marker-end="url(#m2-8-arrow)" x1="465" x2="530" y1="522" y2="522"></line>
<line class="sv-line-red" x1="50" x2="710" y1="550" y2="496"></line>
<text class="sv-tr" text-anchor="middle" x="380" y="568">1 · la independencia crea un nuevo Estado burgués en competencia interestatal</text>
<text class="sv-tr" text-anchor="middle" x="380" y="585">2 · conciencia nacional ≠ conciencia de clase (el caso del País Valenciano)</text>
<text class="sv-tr" text-anchor="middle" x="380" y="602">3 · ninguna independencia histórica derivó en un Estado socialista</text>
</svg>
