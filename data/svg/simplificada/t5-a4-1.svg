<svg xmlns="http://www.w3.org/2000/svg" aria-label="Inversión de la jerarquía entre medios y fines con el socialismo en un solo país, con los dos pilares internacionalistas de Lenin que desaparecen; debajo, los tres pilares del estalinismo con sus antecedentes de preguerra y el mecanismo material de su retorno" role="img" viewBox="0 0 760 530" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m5-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" text-anchor="middle" x="380" y="22">INVERSIÓN DE LA JERARQUÍA ENTRE MEDIOS Y FINES</text>
<path class="sv-line-dash" d="M380 32 L380 274"></path>
<text class="sv-t3" text-anchor="middle" x="195" y="44">ANTES · 1917-1923 · retiradas reconocidas</text>
<rect class="sv-box" height="44" rx="2" width="280" x="55" y="56"></rect>
<text class="sv-t" text-anchor="middle" x="195" y="75">Estado soviético</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="195" y="92">defendido a cualquier precio, pero no como fin en sí</text>
<path class="sv-line" d="M195 100 L195 146" marker-end="url(#m5-4-arrow)"></path>
<text class="sv-t3" x="203" y="127">instrumento subordinado a</text>
<rect class="sv-box-red" height="44" rx="2" width="280" x="55" y="148"></rect>
<text class="sv-tr" text-anchor="middle" x="195" y="175">Revolución mundial</text>
<text class="sv-t" text-anchor="middle" x="195" y="214">Los dos pilares del programa de Lenin:</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="231">1 · el poder soviético, soporte de la revolución mundial</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="195" y="246">2 · la revolución aislada se hunde si no se extiende</text>
<text class="sv-t2" text-anchor="middle" x="195" y="266">Brest-Litovsk y NEP: zigzags reversibles</text>
<text class="sv-t3" text-anchor="middle" x="565" y="44">DESPUÉS · 1924- · la retirada como avance</text>
<rect class="sv-box" height="44" rx="2" width="280" x="425" y="56"></rect>
<text class="sv-t" text-anchor="middle" x="565" y="75">Revolución mundial</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="565" y="92">proletariado mundial y Comintern</text>
<path class="sv-line-red" d="M565 100 L565 146" marker-end="url(#m5-4-arrow)"></path>
<text class="sv-t3" x="573" y="127">instrumento de la defensa de</text>
<rect class="sv-box-ink" height="44" rx="2" width="280" x="425" y="148"></rect>
<text class="sv-tw" text-anchor="middle" x="565" y="175">Estado soviético (URSS)</text>
<text class="sv-t" text-anchor="middle" x="565" y="214">Socialismo en un solo país (Stalin, 1924-26):</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="565" y="231">la capitulación convertida en principio;</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="565" y="246">el aislamiento se vuelve programa positivo</text>
<text class="sv-t2" text-anchor="middle" x="565" y="266">1929, Gran Viraje: huida hacia adelante como ofensiva</text>
<rect class="sv-soft" height="40" rx="2" width="720" x="20" y="284"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="301">LO QUE SE DISPUTABA EN 1924-26 NO ERA SI CONSTRUIR EL SOCIALISMO, SINO LA JERARQUÍA</text>
<text class="sv-t2" text-anchor="middle" style="font-size:11.5px" x="380" y="318">¿la extensión de la revolución es condición de construir el socialismo en la URSS, o al revés?</text>
<text class="sv-t3" text-anchor="middle" x="380" y="350">LOS TRES PILARES DEL ESTALINISMO Y SUS ANTECEDENTES DE PREGUERRA</text>
<rect class="sv-box-gold" height="94" rx="2" width="220" x="20" y="362"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="384">Socialismo en un solo país</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="130" y="401">construcción nacionalmente delimitada</text>
<text class="sv-t2" text-anchor="middle" x="130" y="421">← socialismo nacional de Lassalle,</text>
<text class="sv-t2" text-anchor="middle" x="130" y="436">Dühring, Schäffle y Vollmar</text>
<rect class="sv-box-gold" height="94" rx="2" width="220" x="270" y="362"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="384">Estado permanente</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="401">el Estado ya no debe extinguirse</text>
<text class="sv-t2" text-anchor="middle" x="380" y="421">← «Estado popular libre» /</text>
<text class="sv-t2" text-anchor="middle" x="380" y="436">«Estado de todo el pueblo»</text>
<rect class="sv-box-gold" height="94" rx="2" width="220" x="520" y="362"></rect>
<text class="sv-t" text-anchor="middle" x="630" y="384">Estatalización = socialismo</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="630" y="401">burócratas propietarios de cargos</text>
<text class="sv-t2" text-anchor="middle" x="630" y="421">← socialismo de Estado</text>
<text class="sv-t2" text-anchor="middle" x="630" y="436">bismarckiano</text>
<path class="sv-line" d="M380 456 L380 468" marker-end="url(#m5-4-arrow)"></path>
<rect class="sv-box" height="46" rx="2" width="720" x="20" y="470"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="489">Mecanismo del retorno: adaptación de un aparato, no adhesión deliberada</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12px" x="380" y="506">concesión táctica → presentada como principio teórico → rehabilitación de una posición derrotada décadas atrás</text>
</svg>
