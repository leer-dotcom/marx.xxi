<svg xmlns="http://www.w3.org/2000/svg" aria-label="Línea temporal con tres hitos, Mayo del 68 y la crisis de 1970, el giro neoliberal de 1976 a 1986 y la caída del Muro en 1989, que desemboca en el bloque del Realismo Capitalista (Fisher, Williams, Jameson, Anderson). Debajo, una caja sobre el neoliberalismo como restauración conservadora que lleva a la publicidad y al fetichismo. Dos flechas de retorno de Marx atraviesan el bloque: el fetichismo de la mercancía y la lucha de clases, con los nombres de sus mediadores y sus explicaciones. Al pie, la conclusión: Marx de estudio obligatorio; clase junto a género, raza y etnia." role="img" viewBox="0 0 760 538" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-15-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="22">LÍNEA TEMPORAL</text>
<rect class="sv-box" height="70" rx="2" width="170" x="20" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="105" y="56">Mayo 68 / crisis 1970</text>
<text class="sv-t2" text-anchor="middle" x="105" y="72">anhelos de libertad;</text>
<text class="sv-t2" text-anchor="middle" x="105" y="87">límites del capital</text>
<rect class="sv-box" height="70" rx="2" width="170" x="210" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="295" y="56">1976-1986</text>
<text class="sv-t2" text-anchor="middle" x="295" y="72">giro neoliberal, Thatcher;</text>
<text class="sv-t2" text-anchor="middle" x="295" y="87">abandono de Marx</text>
<rect class="sv-box" height="70" rx="2" width="170" x="400" y="34"></rect>
<text class="sv-t" text-anchor="middle" x="485" y="56">1989</text>
<text class="sv-t2" text-anchor="middle" x="485" y="72">caída del Muro;</text>
<text class="sv-t2" text-anchor="middle" x="485" y="87">«fin de la historia»</text>
<line class="sv-line" marker-end="url(#m1-15-arrow)" x1="190" x2="210" y1="66" y2="66"></line>
<line class="sv-line" marker-end="url(#m1-15-arrow)" x1="380" x2="400" y1="66" y2="66"></line>
<line class="sv-line" marker-end="url(#m1-15-arrow)" x1="570" x2="590" y1="66" y2="66"></line>
<rect class="sv-box-ink" height="420" rx="2" width="150" x="590" y="20"></rect>
<text class="sv-tw" text-anchor="middle" x="665" y="46">REALISMO</text>
<text class="sv-tw" text-anchor="middle" x="665" y="62">CAPITALISTA</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="665" y="78">(Fisher)</text>
<text class="sv-tw" text-anchor="middle" x="665" y="100">cancelación del futuro</text>
<text class="sv-tw" text-anchor="middle" x="665" y="118">homo oeconomicus</text>
<text class="sv-tw" text-anchor="middle" x="665" y="136">plebeyización</text>
<text class="sv-tw" text-anchor="middle" x="665" y="154">ilusión del fin</text>
<text class="sv-tw" text-anchor="middle" x="665" y="170">de las clases</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="665" y="194">«más fácil pensar el fin</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="665" y="207">del mundo que el fin del</text>
<text class="sv-tw" style="font-size:11px" text-anchor="middle" x="665" y="220">capitalismo» (Jameson)</text>
<text class="sv-tw" text-anchor="middle" x="665" y="392">bajo la superficie:</text>
<text class="sv-tw" text-anchor="middle" x="665" y="408">desigualdad y</text>
<text class="sv-tw" text-anchor="middle" x="665" y="424">lucha de clases</text>
<rect class="sv-box-gold" height="66" rx="2" width="550" x="20" y="126"></rect>
<text class="sv-tg" x="30" y="146">EL NEOLIBERALISMO COMO RESTAURACIÓN CONSERVADORA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="164">«huida hacia delante» ante los límites del capital; «revolución conservadora» (Bourdieu)</text>
<text class="sv-t2" style="font-size:12px" x="30" y="179">la publicidad levanta los nuevos dioses del consumo: fetichismo de la mercancía</text>
<line class="sv-line" marker-end="url(#m1-15-arrow)" x1="280" x2="280" y1="104" y2="126"></line>
<line class="sv-line" marker-end="url(#m1-15-arrow)" x1="200" x2="200" y1="192" y2="222"></line>
<text class="sv-t3" x="300" y="214">EL RETORNO DE MARX</text>
<rect class="sv-box-red" height="56" rx="2" width="260" x="20" y="222"></rect>
<text class="sv-tr" text-anchor="middle" x="150" y="244">Fetichismo de la mercancía</text>
<text class="sv-t2" text-anchor="middle" x="150" y="261">consumo, publicidad, cosificación</text>
<line class="sv-line-red" marker-end="url(#m1-15-arrow)" x1="280" x2="700" y1="250" y2="250"></line>
<text class="sv-t3" x="290" y="276">mediadores: Benjamin, Barthes,</text>
<text class="sv-t3" x="290" y="290">Baudrillard, Bourdieu, Žižek</text>
<text class="sv-t2" style="font-size:12px" x="290" y="306">el consumo como sistema de significación</text>
<text class="sv-t2" style="font-size:12px" x="290" y="320">crea la ilusión del fin de las clases</text>
<rect class="sv-box-red" height="56" rx="2" width="260" x="20" y="332"></rect>
<text class="sv-tr" text-anchor="middle" x="150" y="354">Lucha de clases</text>
<text class="sv-t2" text-anchor="middle" x="150" y="371">venta de la fuerza de trabajo</text>
<line class="sv-line-red" marker-end="url(#m1-15-arrow)" x1="280" x2="700" y1="360" y2="360"></line>
<text class="sv-t3" x="290" y="386">concentración del capital, fin del trabajo:</text>
<text class="sv-t3" x="290" y="400">Žižek, Olin Wright, Frase, Bastani</text>
<text class="sv-t2" style="font-size:12px" x="290" y="416">el capital constante desplaza al variable;</text>
<text class="sv-t2" style="font-size:12px" x="290" y="430">respuesta: renta básica universal</text>
<text class="sv-t2" x="20" y="462">las dos flechas atraviesan el bloque: lo que el realismo capitalista declara desaparecido sigue operando</text>
<rect class="sv-box-green" height="52" rx="2" width="720" x="20" y="474"></rect>
<text class="sv-tgr" x="30" y="494">CONCLUSIÓN</text>
<text class="sv-t2" style="font-size:12px" x="30" y="512">Marx sigue siendo de estudio obligatorio; la dominación de clase debe pensarse junto al género, la raza, la etnia</text>
</svg>
