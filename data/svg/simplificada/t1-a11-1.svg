<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, el punto de partida: auge de movimientos culturales y declive de la clase, con la tentación populista y la exigencia de un compromiso crítico. Debajo, doble vía desde un nodo central de disolución de la comunidad real bajo el dinero y la Ley: una vía superior de reapropiación alienada que conduce a las comunidades ilusorias (religión, nación, Estado, derechos) y, en un desvío, a los partidos socialistas que imitan al Estado; una vía inferior de reapropiación real que pasa por la socialización del trabajo, la auto-organización de la clase, la democracia de la clase como un todo y el control social de la producción. Flechas de crítica positiva conectan ambas vías. Abajo, el pronóstico de Marx, el dilema actual del socialismo y la leyenda." role="img" viewBox="0 0 760 562" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-11-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box" height="52" rx="2" width="720" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="380" y="34">Punto de partida (1988): movimientos culturales y declive de la clase</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="52">movimientos religiosos y nacionales; tentación populista; Clarke: el compromiso con ellos ha de ser crítico</text>
<rect class="sv-box-ink" height="70" rx="2" width="200" x="20" y="226"></rect>
<text class="sv-tw" text-anchor="middle" x="120" y="250">Disolución de la</text>
<text class="sv-tw" text-anchor="middle" x="120" y="267">comunidad real</text>
<text class="sv-tw" text-anchor="middle" x="120" y="284">bajo el dinero y la Ley</text>
<text class="sv-t3" x="20" y="316">alienación de los poderes sociales</text>
<text class="sv-t3" x="20" y="330">(histórica, no psicológica)</text>
<path class="sv-line-red" d="M220 248 H270 V146 H300" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tr" x="20" y="136">REAPROPIACIÓN ALIENADA</text>
<text class="sv-t3" x="20" y="152">la lucha por la humanidad aparece</text>
<text class="sv-t3" x="20" y="166">como lucha por derechos y Estado</text>
<rect class="sv-box-red" height="84" rx="2" width="200" x="300" y="106"></rect>
<text class="sv-tr" text-anchor="middle" x="400" y="130">Comunidades ilusorias</text>
<text class="sv-t2" text-anchor="middle" x="400" y="147">religión, nación, Estado,</text>
<text class="sv-t2" text-anchor="middle" x="400" y="162">derechos: compensan la falta</text>
<text class="sv-t2" text-anchor="middle" x="400" y="177">de comunidad real</text>
<line class="sv-line-dash" marker-end="url(#m1-11-arrow)" x1="500" x2="540" y1="146" y2="146"></line>
<text class="sv-t3" text-anchor="middle" x="520" y="98">desvío</text>
<rect class="sv-box" height="84" rx="2" width="200" x="540" y="106"></rect>
<text class="sv-t" text-anchor="middle" x="640" y="130">Partidos socialistas</text>
<text class="sv-t2" text-anchor="middle" x="640" y="147">orientados al poder estatal:</text>
<text class="sv-t2" text-anchor="middle" x="640" y="162">imitan la comunidad ilusoria</text>
<text class="sv-t2" text-anchor="middle" x="640" y="177">del Estado (fracaso contingente)</text>
<path class="sv-line-dash" d="M400 190 V296" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tgr" x="408" y="214">crítica positiva:</text>
<text class="sv-t2" x="408" y="230">reconocer las aspiraciones genuinas</text>
<text class="sv-t2" x="408" y="245">bajo la forma alienada</text>
<path class="sv-line-red" d="M220 274 H270 V331 H300" marker-end="url(#m1-11-arrow)"></path>
<text class="sv-tgr" x="20" y="372">REAPROPIACIÓN REAL</text>
<text class="sv-t3" x="20" y="388">única base para superar las</text>
<text class="sv-t3" x="20" y="402">formas alienadas de existencia</text>
<rect class="sv-box-green" height="70" rx="2" width="200" x="300" y="296"></rect>
<text class="sv-tgr" text-anchor="middle" x="400" y="320">Socialización del trabajo</text>
<text class="sv-t2" text-anchor="middle" x="400" y="337">el capital reúne a los obreros:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="353">fundamento de nuevas comunidades</text>
<rect class="sv-box-green" height="70" rx="2" width="200" x="540" y="296"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="320">Auto-organización</text>
<text class="sv-t2" text-anchor="middle" x="640" y="337">de la clase obrera:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="353">único medio de resolver conflictos</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="500" x2="540" y1="331" y2="331"></line>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="640" x2="640" y1="366" y2="382"></line>
<rect class="sv-box-green" height="70" rx="2" width="200" x="540" y="382"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="406">Democracia de la clase</text>
<text class="sv-t2" text-anchor="middle" x="640" y="423">como un todo:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="640" y="439">no silencia a las minorías</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="540" x2="500" y1="417" y2="417"></line>
<rect class="sv-box-green" height="70" rx="2" width="200" x="300" y="382"></rect>
<text class="sv-tgr" text-anchor="middle" x="400" y="406">Control social de</text>
<text class="sv-t2" text-anchor="middle" x="400" y="423">la producción: comunidad real</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="400" y="439">poderes colectivos del trabajo</text>
<rect class="sv-soft" height="62" rx="2" width="720" x="20" y="470"></rect>
<text class="sv-t3" x="30" y="488">EL PRONÓSTICO DE MARX Y EL DILEMA ACTUAL</text>
<text class="sv-t2" style="font-size:12px" x="30" y="506">Marx esperaba un progreso de la conciencia religiosa → política → social; subestimó la resiliencia de las dos primeras</text>
<text class="sv-t2" style="font-size:12px" x="30" y="521">dilema: disolverse en un partido liberal-democrático o renovarse con nuevas formas de organización de la clase como un todo</text>
<line class="sv-line-red" marker-end="url(#m1-11-arrow)" x1="20" x2="48" y1="550" y2="550"></line>
<text class="sv-t3" x="56" y="554">vías de reapropiación</text>
<line class="sv-line" marker-end="url(#m1-11-arrow)" x1="270" x2="298" y1="550" y2="550"></line>
<text class="sv-t3" x="306" y="554">sucesión en la vía real</text>
<line class="sv-line-dash" marker-end="url(#m1-11-arrow)" x1="530" x2="558" y1="550" y2="550"></line>
<text class="sv-t3" x="566" y="554">desvío / crítica positiva</text>
</svg>
