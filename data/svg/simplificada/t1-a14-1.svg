<svg xmlns="http://www.w3.org/2000/svg" aria-label="Triángulo de Penrose cuyos tres lados son la inmediatez y expropiación del tiempo, el control-estimulación y el empoderamiento bajo la mirada masculina, y el singular como no-lugar; en el centro, el eros enajenado como mercancías relacionadas frente a relaciones mercantilizadas. Cajas laterales describen cada lado, con los modelos del empoderamiento (femme fatale, Carrie Bradshaw) y la anotación final de la autora sobre la superación parcial. Debajo, una línea causal: tiempo abstracto laboral, aceleración de toda la vida, apps de citas, complicidad exigida a contrarreloj y frustración con autoculpa." role="img" viewBox="0 0 760 528" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-14-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="22">TRIÁNGULO DE PENROSE: UNA FIGURA SIN SALIDA</text>
<rect class="sv-soft" height="52" rx="2" width="300" x="440" y="8"></rect>
<text class="sv-t3" x="450" y="24">NOTA</text>
<text class="sv-t2" style="font-size:12px" x="450" y="40">la autora llama «triángulo de Penrose» al circuito del</text>
<text class="sv-t2" style="font-size:12px" x="450" y="54">empoderamiento; aquí se extiende a los tres lados</text>
<path class="sv-box-red" d="M380 40 L528 319 L491 319 L380 102 Z"></path>
<path class="sv-box-blue" d="M528 319 L232 319 L254 289 L491 289 Z"></path>
<path class="sv-box-gold" d="M232 319 L380 40 L399 71 L269 319 Z"></path>
<text class="sv-tr" text-anchor="middle" x="380" y="236">EROS ENAJENADO</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="252">«mercancías relacionadas»:</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="266">la mercancía como única</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="280">forma de experiencia</text>
<rect class="sv-box-gold" height="70" rx="2" width="180" x="20" y="110"></rect>
<text class="sv-tg" text-anchor="middle" x="110" y="132">Inmediatez</text>
<text class="sv-t2" text-anchor="middle" x="110" y="149">expropiación del tiempo;</text>
<text class="sv-t2" text-anchor="middle" x="110" y="164">el otro como información</text>
<line class="sv-line-dash" x1="200" x2="316" y1="150" y2="160"></line>
<rect class="sv-box-red" height="84" rx="2" width="180" x="560" y="110"></rect>
<text class="sv-tr" text-anchor="middle" x="650" y="132">Control-estimulación</text>
<text class="sv-t2" text-anchor="middle" x="650" y="149">liberalización sexual;</text>
<text class="sv-t2" text-anchor="middle" x="650" y="164">empoderamiento bajo</text>
<text class="sv-t2" text-anchor="middle" x="650" y="179">la mirada masculina</text>
<line class="sv-line-dash" x1="560" x2="444" y1="150" y2="160"></line>
<rect class="sv-box-blue" height="66" rx="2" width="460" x="150" y="340"></rect>
<text class="sv-tb" text-anchor="middle" x="380" y="362">Singular como no-lugar</text>
<text class="sv-t2" text-anchor="middle" x="380" y="379">soltería como negación de sí; enajenación relacional</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="394">no-lugar (De Certeau, Augé): vía de paso, nunca destino</text>
<line class="sv-line-dash" x1="380" x2="380" y1="319" y2="340"></line>
<rect class="sv-soft" height="76" rx="2" width="180" x="20" y="200"></rect>
<text class="sv-t3" x="30" y="218">ANOTACIÓN FINAL</text>
<text class="sv-t2" style="font-size:12px" x="30" y="234">entenderlo como consecuencia</text>
<text class="sv-t2" style="font-size:12px" x="30" y="248">histórica permite superarlo</text>
<text class="sv-t2" style="font-size:12px" x="30" y="262">parcialmente</text>
<rect class="sv-box" height="76" rx="2" width="180" x="560" y="214"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="650" y="236">Modelos del empoderamiento</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="252">femme fatale (male gaze);</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="265">Carrie Bradshaw: consumir</text>
<text class="sv-t2" style="font-size:11.5px" text-anchor="middle" x="650" y="278">y ser consumida</text>
<line class="sv-line-dash" x1="560" x2="500" y1="250" y2="250"></line>
<text class="sv-t3" x="20" y="434">LÍNEA CAUSAL</text>
<rect class="sv-box" height="72" rx="2" width="134" x="20.0" y="444"></rect>
<text class="sv-t" text-anchor="middle" x="87.0" y="464">Tiempo abstracto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="87.0" y="480">en el trabajo (Kurz)</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="87.0" y="495">del quehacer al</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="87.0" y="508">cronómetro (Vega)</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="154.0" x2="166.5" y1="466" y2="466"></line>
<rect class="sv-box" height="72" rx="2" width="134" x="166.5" y="444"></rect>
<text class="sv-t" text-anchor="middle" x="233.5" y="464">Aceleración de</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="233.5" y="480">toda la vida</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="233.5" y="495">falta de tiempo;</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="233.5" y="508">culto a la velocidad</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="300.5" x2="313.0" y1="466" y2="466"></line>
<rect class="sv-box" height="72" rx="2" width="134" x="313.0" y="444"></rect>
<text class="sv-t" text-anchor="middle" x="380.0" y="464">Apps de citas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="480">match → cita →</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380.0" y="495">evaluación</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380.0" y="508">según la «química»</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="447.0" x2="459.5" y1="466" y2="466"></line>
<rect class="sv-box" height="72" rx="2" width="134" x="459.5" y="444"></rect>
<text class="sv-t" style="font-size:13px" text-anchor="middle" x="526.5" y="464">Complicidad exigida</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="526.5" y="480">a contrarreloj</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="495">expectativa irreal</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="526.5" y="508">(productos narrativos)</text>
<line class="sv-line" marker-end="url(#m1-14-arrow)" x1="593.5" x2="606.0" y1="466" y2="466"></line>
<rect class="sv-box-red" height="72" rx="2" width="134" x="606.0" y="444"></rect>
<text class="sv-tr" text-anchor="middle" x="673.0" y="464">Frustración</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="673.0" y="480">y autoculpa</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="673.0" y="495">«soy incapaz de</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="673.0" y="508">enamorarme»</text>
</svg>
