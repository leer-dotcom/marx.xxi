<svg xmlns="http://www.w3.org/2000/svg" aria-label="Oposición entre la teoría de la realización y la teoría de la valorización (causa, síntoma, crítica, raíz teórica e implicación política), y cadena cíclica de la valorización: competencia, innovación, composición orgánica, caída de la tasa de ganancia contrarrestada por la tasa de explotación, detención de la acumulación, crisis, concentración y nueva fase de acumulación; abajo, la conclusión política: sólo la clase trabajadora organizada puede abolir el capital." role="img" viewBox="0 0 760 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-1-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">DOS EXPLICACIONES MARXISTAS DE LA CRISIS</text>
<rect class="sv-soft" height="222" rx="2" width="350" x="20" y="24"></rect>
<rect class="sv-box-blue" height="32" rx="2" width="330" x="30" y="34"></rect>
<text class="sv-tb" text-anchor="middle" x="195" y="55">Teoría de la realización (subconsumismo)</text>
<text class="sv-t3" x="30" y="86">CAUSA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="101">contradicción producción-consumo; anarquía del mercado</text>
<text class="sv-t3" x="30" y="120">SÍNTOMA LEÍDO COMO CAUSA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="135">sobreproducción, demanda insuficiente, salarios bajos</text>
<text class="sv-t3" x="30" y="154">CRÍTICA DE RUIZ</text>
<text class="sv-t2" style="font-size:12px" x="30" y="169">la demanda insuficiente es efecto, no causa</text>
<text class="sv-t3" x="30" y="188">RAÍZ TEÓRICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="203">escisión entre lo económico y lo social: más Keynes que Marx</text>
<text class="sv-t3" x="30" y="222">IMPLICACIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="237">reformismo keynesiano: capitalismo injusto pero eterno</text>
<rect class="sv-soft" height="222" rx="2" width="350" x="390" y="24"></rect>
<rect class="sv-box-red" height="32" rx="2" width="330" x="400" y="34"></rect>
<text class="sv-tr" text-anchor="middle" x="565" y="55">Teoría de la valorización (rentabilidad)</text>
<text class="sv-t3" x="400" y="86">CAUSA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="101">rentabilidad: la crisis nace en la acumulación misma</text>
<text class="sv-t3" x="400" y="120">LO QUE SE VE COMO SÍNTOMA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="135">mercancías invendibles = escasez de plusvalía</text>
<text class="sv-t3" x="400" y="154">LEY TENDENCIAL</text>
<text class="sv-t2" style="font-size:12px" x="400" y="169">caída de la tasa de ganancia por ↑ productividad</text>
<text class="sv-t3" x="400" y="188">RAÍZ TEÓRICA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="203">totalidad (Lukács): economía y sociedad son una unidad</text>
<text class="sv-t3" x="400" y="222">IMPLICACIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="400" y="237">crisis inherente al capital; sólo cabe su abolición</text>
<text class="sv-t3" x="20" y="270">CADENA CÍCLICA DE LA VALORIZACIÓN</text>
<rect class="sv-box" height="44" rx="2" width="160" x="20" y="282"></rect>
<text class="sv-t" text-anchor="middle" x="100" y="308">Competencia</text>
<rect class="sv-box" height="44" rx="2" width="160" x="200" y="282"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="301">Innovación técnica</text>
<text class="sv-t2" text-anchor="middle" x="280" y="316">(más capital fijo)</text>
<rect class="sv-box" height="44" rx="2" width="160" x="380" y="282"></rect>
<text class="sv-t" text-anchor="middle" x="460" y="301">↑ composición</text>
<text class="sv-t" text-anchor="middle" x="460" y="316">orgánica del capital</text>
<rect class="sv-box-red" height="44" rx="2" width="160" x="560" y="282"></rect>
<text class="sv-tr" text-anchor="middle" x="640" y="308">↓ tasa de ganancia</text>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="180" x2="200" y1="304" y2="304"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="360" x2="380" y1="304" y2="304"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="540" x2="560" y1="304" y2="304"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="640" x2="640" y1="326" y2="392"></line>
<text class="sv-t3" x="650" y="362">ley tendencial</text>
<rect class="sv-soft" height="42" rx="2" width="360" x="200" y="337"></rect>
<text class="sv-t3" x="208" y="353">FACTOR CONTRARRESTANTE FUNDAMENTAL</text>
<text class="sv-t2" style="font-size:12px" x="208" y="369">↑ tasa de explotación: se dirime por la lucha de clases, no técnicamente</text>
<rect class="sv-box" height="44" rx="2" width="160" x="560" y="392"></rect>
<text class="sv-t" text-anchor="middle" x="640" y="411">Detención de</text>
<text class="sv-t" text-anchor="middle" x="640" y="426">la acumulación</text>
<rect class="sv-box-ink" height="44" rx="2" width="160" x="380" y="392"></rect>
<text class="sv-tw" text-anchor="middle" x="460" y="411">CRISIS</text>
<text class="sv-tw" text-anchor="middle" x="460" y="426">reajuste violento</text>
<rect class="sv-box" height="44" rx="2" width="160" x="200" y="392"></rect>
<text class="sv-t" text-anchor="middle" x="280" y="411">↑ concentración</text>
<text class="sv-t" text-anchor="middle" x="280" y="426">↑ tasa de explotación</text>
<rect class="sv-box-blue" height="44" rx="2" width="160" x="20" y="392"></rect>
<text class="sv-tb" text-anchor="middle" x="100" y="411">Nueva fase</text>
<text class="sv-tb" text-anchor="middle" x="100" y="426">de acumulación</text>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="560" x2="540" y1="414" y2="414"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="380" x2="360" y1="414" y2="414"></line>
<line class="sv-line" marker-end="url(#m1-1-arrow)" x1="200" x2="180" y1="414" y2="414"></line>
<line class="sv-line-red" marker-end="url(#m1-1-arrow)" x1="100" x2="100" y1="392" y2="326"></line>
<text class="sv-t3" x="108" y="356">el ciclo</text>
<text class="sv-t3" x="108" y="370">se reabre</text>
<rect class="sv-soft" height="48" rx="2" width="720" x="20" y="456"></rect>
<text class="sv-t3" x="30" y="473">CONCLUSIÓN POLÍTICA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="490">La crisis es un «mecanismo sanador» que nadie puede evitar; la miseria sola no basta: hace falta un proyecto organizado.</text>
</svg>
