<svg xmlns="http://www.w3.org/2000/svg" aria-label="Matriz de las tres posiciones socialistas ante la cuestión colonial —indiferentista, etapista o multipolarista e independencia política— con su tesis, su ejemplo histórico, su resultado y su forma actual ante Palestina e Irán, y debajo las tareas desde el centro imperialista" role="img" viewBox="0 0 760 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect class="sv-box" height="44" rx="2" width="220" x="20" y="14"></rect>
<text class="sv-t" text-anchor="middle" x="130" y="41">Posición indiferentista</text>
<rect class="sv-box-gold" height="44" rx="2" width="220" x="270" y="14"></rect>
<text class="sv-tg" text-anchor="middle" x="380" y="34">Posición etapista</text>
<text class="sv-t2" text-anchor="middle" x="380" y="50">hoy: multipolarismo</text>
<rect class="sv-box-red" height="44" rx="2" width="220" x="520" y="14"></rect>
<text class="sv-tr" text-anchor="middle" x="630" y="41">Independencia política</text>
<rect class="sv-box" height="58" rx="2" width="220" x="20" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="130" y="103">la opresión nacional no pesa;</text>
<text class="sv-t2" text-anchor="middle" x="130" y="118">solo la lucha de clases «pura»</text>
<rect class="sv-box-gold" height="58" rx="2" width="220" x="270" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="380" y="103">primero la liberación nacional,</text>
<text class="sv-t2" text-anchor="middle" x="380" y="118">después el socialismo</text>
<rect class="sv-box-red" height="58" rx="2" width="220" x="520" y="70"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="86">TESIS</text>
<text class="sv-t2" text-anchor="middle" x="630" y="103">fuerza proletaria propia;</text>
<text class="sv-t2" text-anchor="middle" x="630" y="118">alianzas sin ceder la dirección</text>
<rect class="sv-box" height="58" rx="2" width="220" x="20" y="140"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="156">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="130" y="173">Palestina como choque entre</text>
<text class="sv-t2" text-anchor="middle" x="130" y="188">Estados, no lucha anticolonial</text>
<rect class="sv-box-gold" height="58" rx="2" width="220" x="270" y="140"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="156">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="380" y="173">frente único antimperialista:</text>
<text class="sv-t2" text-anchor="middle" x="380" y="188">Turquía, China, Irán 1979</text>
<rect class="sv-box-red" height="58" rx="2" width="220" x="520" y="140"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="156">EJEMPLO</text>
<text class="sv-t2" text-anchor="middle" x="630" y="173">tesis Lenin–Roy (1920);</text>
<text class="sv-t2" text-anchor="middle" x="630" y="188">China, Cuba y Vietnam</text>
<rect class="sv-box" height="58" rx="2" width="220" x="20" y="210"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="226">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="130" y="243">impotencia; alimenta</text>
<text class="sv-t" text-anchor="middle" x="130" y="258">a los socialimperialistas</text>
<rect class="sv-box-gold" height="58" rx="2" width="220" x="270" y="210"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="226">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="380" y="243">subordinación o aniquilamiento</text>
<text class="sv-t" text-anchor="middle" x="380" y="258">de los comunistas</text>
<rect class="sv-box-red" height="58" rx="2" width="220" x="520" y="210"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="226">RESULTADO</text>
<text class="sv-t" text-anchor="middle" x="630" y="243">enlaza anticolonialismo</text>
<text class="sv-t" text-anchor="middle" x="630" y="258">y socialismo</text>
<rect class="sv-box" height="58" rx="2" width="220" x="20" y="280"></rect>
<text class="sv-t3" text-anchor="middle" x="130" y="296">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="313">«indiferentismo impotente</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="130" y="328">y cómplice» ante Irán</text>
<rect class="sv-box-gold" height="58" rx="2" width="220" x="270" y="280"></rect>
<text class="sv-t3" text-anchor="middle" x="380" y="296">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="313">un mundo multipolar</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="380" y="328">reproduce la dominación</text>
<rect class="sv-box-red" height="58" rx="2" width="220" x="520" y="280"></rect>
<text class="sv-t3" text-anchor="middle" x="630" y="296">HOY: PALESTINA E IRÁN (2026)</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="313">defensa de Irán sin cerrar filas</text>
<text class="sv-t2" text-anchor="middle" style="font-size:12.5px" x="630" y="328">con la República Islámica</text>
<rect class="sv-box-ink" height="46" rx="2" width="720" x="20" y="350"></rect>
<text class="sv-tw" text-anchor="middle" x="380" y="369">Tareas desde el centro imperialista</text>
<text class="sv-tw" text-anchor="middle" style="font-size:12.5px" x="380" y="386">fin del comercio de armas con Israel · boicot efectivo · lucha contra las bases y la OTAN en el propio territorio</text>
<text class="sv-t3" text-anchor="middle" x="380" y="418">no identificar la crisis de la hegemonía de EE. UU. con la crisis del imperialismo</text>
</svg>
