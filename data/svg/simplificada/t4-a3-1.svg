<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escalera ascendente de niveles de organización y conciencia, desde la lucha económica hasta el socialismo, con la desviación propia de cada peldaño anotada debajo de cada caja y una nota con la tesis del artículo" viewBox="0 0 760 576" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-3-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<text class="sv-t3" x="12" y="18">ESCALERA DE LA BATALLA POR LA DEMOCRACIA</text>
<text class="sv-t3" x="748" y="18" text-anchor="end">EN OLIVA: DESVIACIÓN EN CADA PELDAÑO</text>
<path class="sv-line-dash" d="M12 552 V40" marker-end="url(#m4-3-arrow)"/>
<text class="sv-t3" x="22" y="40">+ organización · + conciencia</text>
<rect class="sv-soft" rx="2" x="30" y="60" width="312" height="92"/>
<text class="sv-t3" x="40" y="77">TESIS</text>
<text class="sv-t2" x="40" y="94" style="font-size:12px">Prepararse para la acción política es la condición</text>
<text class="sv-t2" x="40" y="108" style="font-size:12px">de la independencia política del proletariado:</text>
<text class="sv-t2" x="40" y="122" style="font-size:12px">influir en el curso de los acontecimientos</text>
<text class="sv-t2" x="40" y="136" style="font-size:12px">y no ser arrastrado por fuerzas políticas ajenas.</text>
<rect class="sv-box" rx="2" x="30" y="466" width="178" height="66"/>
<text class="sv-t" text-anchor="middle" x="119" y="484">Lucha económica</text>
<text class="sv-t2" text-anchor="middle" x="119" y="499" style="font-size:12px">sindicato: escuela de unión</text>
<text class="sv-t2" text-anchor="middle" x="119" y="512" style="font-size:12px">necesaria pero insuficiente:</text>
<text class="sv-t2" text-anchor="middle" x="119" y="525" style="font-size:12px">parcial, temporal, sectorial</text>
<rect class="sv-box" rx="2" x="138" y="384" width="178" height="66"/>
<text class="sv-t" text-anchor="middle" x="227" y="402">Acción política</text>
<text class="sv-t2" text-anchor="middle" x="227" y="417" style="font-size:12px">partido · programa propio</text>
<text class="sv-t2" text-anchor="middle" x="227" y="430" style="font-size:12px">organización superior que</text>
<text class="sv-t2" text-anchor="middle" x="227" y="443" style="font-size:12px">lucha contra el Estado</text>
<rect class="sv-box-blue" rx="2" x="246" y="302" width="178" height="66"/>
<text class="sv-tb" text-anchor="middle" x="335" y="320" style="font-size:12.6px;letter-spacing:0">Derechos políticos = armas</text>
<text class="sv-t2" text-anchor="middle" x="335" y="335" style="font-size:12px">reunión · asociación · huelga</text>
<text class="sv-t2" text-anchor="middle" x="335" y="348" style="font-size:12px">expresión · sufragio universal</text>
<text class="sv-t2" text-anchor="middle" x="335" y="361" style="font-size:12px">parlamento: tribuna y medidor</text>
<rect class="sv-box" rx="2" x="354" y="220" width="178" height="66"/>
<text class="sv-t" text-anchor="middle" x="443" y="238">República democrática</text>
<text class="sv-t2" text-anchor="middle" x="443" y="253" style="font-size:12px">síntesis del programa mínimo</text>
<text class="sv-t2" text-anchor="middle" x="443" y="266" style="font-size:12px">asamblea única · revocabilidad</text>
<text class="sv-t2" text-anchor="middle" x="443" y="279" style="font-size:12px">abolir burocracia · milicia</text>
<rect class="sv-box" rx="2" x="462" y="138" width="178" height="66"/>
<text class="sv-t" text-anchor="middle" x="551" y="156">Toma del poder</text>
<text class="sv-t2" text-anchor="middle" x="551" y="171" style="font-size:12px">gobierno provisional</text>
<text class="sv-t2" text-anchor="middle" x="551" y="184" style="font-size:12px">«el primer paso: la conquista</text>
<text class="sv-t2" text-anchor="middle" x="551" y="197" style="font-size:12px">de la democracia» (Manifiesto)</text>
<rect class="sv-box-red" rx="2" x="570" y="56" width="178" height="66"/>
<text class="sv-tr" text-anchor="middle" x="659" y="74">Socialismo</text>
<text class="sv-t2" text-anchor="middle" x="659" y="89" style="font-size:12px">emancipación económica</text>
<text class="sv-t2" text-anchor="middle" x="659" y="102" style="font-size:12px">democracia y socialismo</text>
<text class="sv-t2" text-anchor="middle" x="659" y="115" style="font-size:12px">no son fases separadas</text>
<path class="sv-line" d="M173 466 V452" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M281 384 V370" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M389 302 V288" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M497 220 V206" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line" d="M605 138 V124" marker-end="url(#m4-3-arrow)"/>
<path class="sv-line-dash" d="M156 532 V544"/>
<text class="sv-tg" text-anchor="middle" x="156" y="559" style="font-size:11.5px;letter-spacing:0">economicismo</text>
<path class="sv-line-dash" d="M264 450 V462"/>
<text class="sv-tg" text-anchor="middle" x="264" y="477" style="font-size:11.5px;letter-spacing:0">blanquismo /</text>
<text class="sv-tg" text-anchor="middle" x="264" y="491" style="font-size:11.5px;letter-spacing:0">terrorismo:</text>
<text class="sv-tg" text-anchor="middle" x="264" y="505" style="font-size:11.5px;letter-spacing:0">minoría sin masas</text>
<path class="sv-line-dash" d="M372 368 V380"/>
<text class="sv-tg" text-anchor="middle" x="372" y="395" style="font-size:11.5px;letter-spacing:0">cretinismo</text>
<text class="sv-tg" text-anchor="middle" x="372" y="409" style="font-size:11.5px;letter-spacing:0">parlamentario</text>
<path class="sv-line-dash" d="M480 286 V298"/>
<text class="sv-tg" text-anchor="middle" x="480" y="313" style="font-size:11.5px;letter-spacing:0">derechos plenos</text>
<text class="sv-tg" text-anchor="middle" x="480" y="327" style="font-size:11.5px;letter-spacing:0">sin destruir el Estado</text>
<path class="sv-line-dash" d="M588 204 V216"/>
<text class="sv-tg" text-anchor="middle" x="588" y="231" style="font-size:11.5px;letter-spacing:0">vía parlamentaria</text>
<text class="sv-tg" text-anchor="middle" x="588" y="245" style="font-size:11.5px;letter-spacing:0">pacífica</text>
<path class="sv-line-dash" d="M696 122 V134"/>
<text class="sv-tg" text-anchor="middle" x="696" y="149" style="font-size:11.5px;letter-spacing:0">separar democracia</text>
<text class="sv-tg" text-anchor="middle" x="696" y="163" style="font-size:11.5px;letter-spacing:0">y socialismo</text>
</svg>
