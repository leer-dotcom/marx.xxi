<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceptual del volumen 4: en el centro el derecho a la revolución, fundado por la soberanía popular, puesto a la orden del día por la crisis revolucionaria y ejercido por el partido comunista; revoca el Estado capitalista, cuyo giro autoritario recorta los derechos políticos que son condición del partido; partido y crisis conquistan el Estado-Comuna, que realiza la soberanía popular y cuya pérdida genera oportunismo e izquierdismo; la guerra imperialista acelera el giro autoritario y el derrotismo exige un internacionalismo que es condición de supervivencia del Estado-Comuna. Cada arista indica los artículos que la desarrollan; al pie, leyenda de colores y clave de los siete artículos." viewBox="0 0 760 578" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m4-s-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"/></marker></defs>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M660 48 V18 H14 V180 H40"/>
<text class="sv-t3" text-anchor="middle" x="380" y="14">la realiza plenamente: pueblo armado, revocabilidad, fin de la separación de poderes (1, 7)</text>
<path class="sv-line-dash" marker-end="url(#m4-s-arrow)" d="M620 48 V34 H123 V48"/>
<text class="sv-t3" text-anchor="middle" x="380" y="30">su pérdida (5, 7)</text>
<path class="sv-line-dash" marker-end="url(#m4-s-arrow)" d="M720 62 H752 V430 H123 V408"/>
<text class="sv-t3" text-anchor="middle" x="380" y="445">su pérdida (5, 7)</text>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M720 270 H740 V78 H720"/>
<text class="sv-t3" text-anchor="middle" transform="rotate(-90 731 174)" x="731" y="174">condición de supervivencia (2, 6, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="206" y1="70" x2="297" y2="70"/>
<text class="sv-t3" text-anchor="middle" x="251" y="63">la presupone</text>
<text class="sv-t3" text-anchor="middle" x="251" y="86">falsamente</text>
<text class="sv-t3" text-anchor="middle" x="251" y="99">(1, 2, 5, 7)</text>
<line class="sv-line-red" marker-end="url(#m4-s-arrow)" x1="380" y1="102" x2="380" y2="150"/>
<text class="sv-t3" text-anchor="end" x="373" y="130">a la orden del día (1)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="463" y1="70" x2="554" y2="70"/>
<text class="sv-t3" text-anchor="middle" x="508" y="63">mayoría</text>
<text class="sv-t3" text-anchor="middle" x="508" y="86">decisiva (1, 3)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="637" y1="150" x2="637" y2="102"/>
<text class="sv-t3" text-anchor="end" x="630" y="130">conquista del poder (1, 3, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="206" y1="172" x2="297" y2="172"/>
<text class="sv-t3" text-anchor="middle" x="251" y="165">funda</text>
<text class="sv-t3" text-anchor="middle" x="251" y="188">(1, 3, 7)</text>
<line class="sv-line-red" marker-end="url(#m4-s-arrow)" x1="554" y1="172" x2="463" y2="172"/>
<text class="sv-t3" text-anchor="middle" x="508" y="165">ejerce y</text>
<text class="sv-t3" text-anchor="middle" x="508" y="188">prepara</text>
<text class="sv-t3" text-anchor="middle" x="508" y="201">(1, 3, 7)</text>
<path class="sv-line-red" marker-end="url(#m4-s-arrow)" d="M330 204 V228 H160 V252"/>
<text class="sv-t3" x="214" y="223">revoca (1, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="123" y1="354" x2="123" y2="306"/>
<text class="sv-t3" x="129" y="347">se integra (2, 5, 7)</text>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M160 306 V330 H330 V354"/>
<text class="sv-t3" x="170" y="324">produce en la crisis (2, 4, 6)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="380" y1="354" x2="380" y2="306"/>
<text class="sv-t3" x="387" y="338">recorta (4, 6)</text>
<path class="sv-line" marker-end="url(#m4-s-arrow)" d="M430 252 V228 H700 V204"/>
<text class="sv-t3" x="470" y="222">condición de posibilidad (3, 4, 6, 7)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="554" y1="376" x2="463" y2="376"/>
<text class="sv-t3" text-anchor="middle" x="508" y="369">acelera</text>
<text class="sv-t3" text-anchor="middle" x="508" y="392">(2, 4, 6)</text>
<line class="sv-line" marker-end="url(#m4-s-arrow)" x1="637" y1="354" x2="637" y2="306"/>
<text class="sv-t3" text-anchor="end" x="630" y="324">derrotismo: lo exige (2, 6, 7)</text>
<rect class="sv-box" rx="2" x="40" y="48" width="166" height="54"/>
<text class="sv-t" text-anchor="middle" x="123" y="67">Izquierdismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="123" y="83">sectarismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="123" y="97">fetichismo del momento</text>
<rect class="sv-box-red" rx="2" x="297" y="48" width="166" height="54"/>
<text class="sv-tr" text-anchor="middle" x="380" y="68">Crisis revolucionaria</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="88">hoy no la hay: «hablar alemán»</text>
<rect class="sv-box-blue" rx="2" x="554" y="48" width="166" height="54"/>
<text class="sv-tb" text-anchor="middle" x="637" y="67">Estado-Comuna</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="83">república democrática</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="97">programa mínimo</text>
<rect class="sv-box-blue" rx="2" x="40" y="150" width="166" height="54"/>
<text class="sv-tb" text-anchor="middle" x="123" y="169">Soberanía popular</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="123" y="185">democracia íntegra</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="123" y="199">autoemancipación</text>
<rect class="sv-box-red" rx="2" x="297" y="150" width="166" height="54"/>
<text class="sv-tr" text-anchor="middle" x="380" y="169">Derecho a la revolución</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="185">núcleo del volumen</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="380" y="199">nadie lo concede ni lo niega</text>
<rect class="sv-box-green" rx="2" x="554" y="150" width="166" height="54"/>
<text class="sv-tgr" text-anchor="middle" x="637" y="169">Partido comunista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="185">de masas</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="199">prepara, conquista, ejerce</text>
<rect class="sv-box-ink" rx="2" x="40" y="252" width="166" height="54"/>
<text class="sv-tw" text-anchor="middle" x="123" y="271">Estado capitalista</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="123" y="287">imperio de la Ley</text>
<text class="sv-tw" style="font-size:12px" text-anchor="middle" x="123" y="301">separación · oligarquía</text>
<rect class="sv-box-green" rx="2" x="297" y="252" width="166" height="54"/>
<text class="sv-tgr" text-anchor="middle" x="380" y="271">Derechos políticos</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="287">armas, no fines</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="301">conquistas proletarias</text>
<rect class="sv-box-blue" rx="2" x="554" y="252" width="166" height="54"/>
<text class="sv-tb" text-anchor="middle" x="637" y="271">Internacionalismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="287">partido europeo</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="637" y="301">EE. UU. Socialistas de Europa</text>
<rect class="sv-box" rx="2" x="40" y="354" width="166" height="54"/>
<text class="sv-t" text-anchor="middle" x="123" y="373">Oportunismo</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="123" y="389">reformismo, frentismo</text>
<text class="sv-t2" style="font-size:11px" text-anchor="middle" x="123" y="403">centrismo, partidos amplios</text>
<rect class="sv-box-gold" rx="2" x="297" y="354" width="166" height="54"/>
<text class="sv-tg" text-anchor="middle" x="380" y="373">Giro autoritario</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="389">penal · UE · rearme</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="380" y="403">responde a la crisis</text>
<rect class="sv-box-gold" rx="2" x="554" y="354" width="166" height="54"/>
<text class="sv-tg" text-anchor="middle" x="637" y="373">Guerra imperialista</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="389">derrotismo doble</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="637" y="403">ni OTAN ni BRICS</text>
<rect class="sv-soft" rx="2" x="40" y="456" width="680" height="112"/>
<text class="sv-t3" x="50" y="474">rojo: derecho a la revolución y crisis · verde: partido y derechos políticos · negro: Estado capitalista</text>
<text class="sv-t3" x="50" y="488">dorado: giro autoritario y guerra · azul: soberanía, Estado-Comuna e internacionalismo · blanco: desviaciones</text>
<text class="sv-t3" x="50" y="502">flecha roja: aristas del derecho a la revolución · discontinua: pérdida del Estado-Comuna · (n): artículos</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="522">1 · Volodia — Sobre el derecho a la revolución</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="536">2 · Seijo — Socialismo y guerra: derrotismo</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="550">3 · Santander — La batalla por la democracia</text>
<text class="sv-t2" style="font-size:11.5px" x="50" y="564">4 · Jugo — Giro autoritario: reformas penales</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="522">5 · Miasni — 15M, Podemos y sus raíces</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="536">6 · Ruiz — Giro autoritario y poder oligárquico en la UE</text>
<text class="sv-t2" style="font-size:11.5px" x="390" y="550">7 · Aguiriano — ¡Viva la Comuna! Marxismo y Estado</text>
</svg>
