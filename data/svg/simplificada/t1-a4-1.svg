<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, por qué volver a Hegel (repetir Lenin; la Lógica es emancipadora). Tres filas paralelas de tránsito: lógica del ser, de la esencia y del concepto; familia, sociedad civil y Estado; premodernidad, reino de la necesidad y reino de la libertad. Una barrera marca el bloqueo bajo el capitalismo entre la segunda y la tercera columna (el Estado sometido al mercado; situación objetivamente irracional), con la nota de que esto no va contra Hegel; una flecha alternativa salta hacia la asociación libre de productores. Abajo, del pseudoactivismo a la refundación teórica." role="img" viewBox="0 0 760 462" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<text class="sv-t3" x="20" y="16">POR QUÉ VOLVER A HEGEL</text>
<rect class="sv-soft" height="44" rx="2" width="720" x="20" y="24"></rect>
<text class="sv-t2" style="font-size:12px" x="30" y="41">Repetir el gesto de Lenin: sacar al marxismo del «fango» del Diamat con la mano amiga de Hegel y repensar la emancipación.</text>
<text class="sv-t2" style="font-size:12px" x="30" y="56">La Lógica es emancipadora: las categorías son formas que estructuran la conciencia y la relación con lo real.</text>
<text class="sv-t3" x="15" y="108">LÓGICA</text>
<text class="sv-t3" x="15" y="168">ETICIDAD</text>
<text class="sv-t3" x="15" y="228">HISTORIA</text>
<rect class="sv-box" height="48" rx="2" width="200" x="100" y="80"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="108">Lógica del ser</text>
<rect class="sv-box-blue" height="48" rx="2" width="200" x="315" y="80"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="100">Lógica de la esencia</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="415" y="117">oposición, apariencia, reflexión</text>
<rect class="sv-box-green" height="48" rx="2" width="200" x="530" y="80"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="100">Lógica del concepto</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="117">«el concepto es lo libre»</text>
<rect class="sv-box" height="48" rx="2" width="200" x="100" y="140"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="168">Familia</text>
<rect class="sv-box-blue" height="48" rx="2" width="200" x="315" y="140"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="160">Sociedad civil</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="415" y="177">mercado: sistema de necesidades</text>
<rect class="sv-box-green" height="48" rx="2" width="200" x="530" y="140"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="160">Estado</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="177">libertad concreta</text>
<rect class="sv-box" height="48" rx="2" width="200" x="100" y="200"></rect>
<text class="sv-t" text-anchor="middle" x="200" y="220">(premoderno)</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="200" y="237">relación inmediata y natural</text>
<rect class="sv-box-blue" height="48" rx="2" width="200" x="315" y="200"></rect>
<text class="sv-tb" text-anchor="middle" x="415" y="220">Reino de la necesidad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="415" y="237">capitalismo</text>
<rect class="sv-box-green" height="48" rx="2" width="200" x="530" y="200"></rect>
<text class="sv-tgr" text-anchor="middle" x="630" y="220">Reino de la libertad</text>
<text class="sv-t2" style="font-size:12px" text-anchor="middle" x="630" y="237">comunismo</text>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="104" y2="104"></line>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="164" y2="164"></line>
<line class="sv-line" marker-end="url(#m1-4-arrow)" x1="300" x2="315" y1="224" y2="224"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="104" y2="104"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="164" y2="164"></line>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="515" x2="530" y1="224" y2="224"></line>
<line class="sv-line-red" x1="522" x2="522" y1="70" y2="258"></line>
<rect class="sv-soft" height="60" rx="2" width="310" x="430" y="266"></rect>
<text class="sv-tr" x="438" y="283">bloqueo bajo el capitalismo:</text>
<text class="sv-t2" style="font-size:12px" x="438" y="299">el Estado, sometido al mercado, no realiza la libertad:</text>
<text class="sv-t2" style="font-size:12px" x="438" y="313">situación objetivamente irracional</text>
<rect class="sv-soft" height="60" rx="2" width="380" x="20" y="266"></rect>
<text class="sv-t3" x="28" y="283">ESTO NO VA CONTRA HEGEL, SINO A SU FAVOR</text>
<text class="sv-t2" style="font-size:12px" x="28" y="299">«lo racional es real» no canoniza lo inmediato; bajo el capitalismo</text>
<text class="sv-t2" style="font-size:12px" x="28" y="313">no hay tránsito de la esencia al concepto (Abazari, Pippin)</text>
<path class="sv-line-red" d="M415 248 V358 H540" marker-end="url(#m1-4-arrow)"></path>
<rect class="sv-box-green" height="48" rx="2" width="200" x="540" y="334"></rect>
<text class="sv-tgr" text-anchor="middle" x="640" y="354">Asociación libre</text>
<text class="sv-t2" text-anchor="middle" x="640" y="371">de productores (comuna)</text>
<text class="sv-tr" x="20" y="354">salto: abolición de la propiedad privada,</text>
<text class="sv-t2" x="20" y="371">el trabajo asalariado y la familia burguesa</text>
<line class="sv-line-dash" marker-end="url(#m1-4-arrow)" x1="20" x2="50" y1="396" y2="396"></line>
<text class="sv-t3" x="58" y="400">tránsito que exige el concepto, bloqueado bajo el capitalismo</text>
<line class="sv-line-red" marker-end="url(#m1-4-arrow)" x1="470" x2="500" y1="396" y2="396"></line>
<text class="sv-t3" x="508" y="400">única transición real: el salto</text>
<rect class="sv-soft" height="42" rx="2" width="720" x="20" y="410"></rect>
<text class="sv-t3" x="30" y="427">TAREA</text>
<text class="sv-t2" style="font-size:12px" x="30" y="443">pasar del pseudoactivismo a una refundación teórica: pensar aquí y hoy qué es ser libre (un marxismo hegeliano).</text>
</svg>
