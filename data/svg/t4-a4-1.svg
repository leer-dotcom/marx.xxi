<svg xmlns="http://www.w3.org/2000/svg" aria-label="Arriba, balanza entre políticas sociales y castigo inclinada hacia el castigo; abajo, línea temporal de las reformas penales españolas de 1973 a 2023 con su contexto y su efecto" role="img" viewBox="0 0 760 330">
<defs><marker id="m4-4-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="sv-arrow"></path></marker></defs>
<rect class="sv-box-green" height="34" rx="2" width="140" x="150" y="12"></rect><text class="sv-tgr" text-anchor="middle" x="220" y="26">Zanahoria</text><text class="sv-t2" text-anchor="middle" x="220" y="40">políticas sociales</text>
<rect class="sv-box-red" height="34" rx="2" width="140" x="470" y="42"></rect><text class="sv-tr" text-anchor="middle" x="540" y="56">Palo</text><text class="sv-t2" text-anchor="middle" x="540" y="70">castigo · represión</text>
<line class="sv-line" x1="220" x2="540" y1="46" y2="76"></line>
<path class="sv-box-ink" d="M380 61 L368 84 L392 84 z"></path>
<text class="sv-t3" text-anchor="middle" x="380" y="98">crisis de acumulación → el fiel se inclina hacia el castigo</text>
<text class="sv-t3" x="612" y="30">concesión y castigo:</text><text class="sv-t3" x="612" y="43">dos caras de la</text><text class="sv-t3" x="612" y="56">misma moneda</text>
<line class="sv-line" marker-end="url(#m4-4-arrow)" x1="30" x2="738" y1="200" y2="200"></line>
<circle class="sv-dot" cx="80" cy="200" r="5"></circle><circle class="sv-dot" cx="182" cy="200" r="5"></circle><circle class="sv-dot" cx="283" cy="200" r="5"></circle><circle class="sv-dot" cx="385" cy="200" r="5"></circle><circle class="sv-dot" cx="487" cy="200" r="5"></circle><circle class="sv-dot" cx="588" cy="200" r="5"></circle><circle class="sv-dot" cx="690" cy="200" r="5"></circle>
<text class="sv-t" text-anchor="middle" x="80" y="217">1973</text><text class="sv-t" text-anchor="middle" x="182" y="217">1983</text><text class="sv-t" text-anchor="middle" x="283" y="217">1995</text><text class="sv-t" text-anchor="middle" x="385" y="217">2003</text><text class="sv-t" text-anchor="middle" x="487" y="217">2015</text><text class="sv-t" text-anchor="middle" x="588" y="217">2022</text><text class="sv-t" text-anchor="middle" x="690" y="217">2023</text>
<line class="sv-line-dash" x1="80" x2="80" y1="205" y2="236"></line>
<rect class="sv-box" height="76" rx="2" width="120" x="20" y="238"></rect><text class="sv-t" text-anchor="middle" x="80" y="256">CP franquista</text><text class="sv-t2" text-anchor="middle" x="80" y="271">vigente hasta 1996</text><text class="sv-t2" text-anchor="middle" x="80" y="286">Ley Penitenciaria</text><text class="sv-t3" text-anchor="middle" x="80" y="302">Transición</text>
<line class="sv-line-dash" x1="182" x2="182" y1="195" y2="186"></line>
<rect class="sv-box" height="76" rx="2" width="120" x="122" y="108"></rect><text class="sv-t" text-anchor="middle" x="182" y="126">Reforma parcial</text><text class="sv-t2" text-anchor="middle" x="182" y="141">medidas progresistas</text><text class="sv-t2" text-anchor="middle" x="182" y="156">desmontadas por la</text><text class="sv-t3" text-anchor="middle" x="182" y="172">«mano dura»</text>
<line class="sv-line-dash" x1="283" x2="283" y1="205" y2="236"></line>
<rect class="sv-box-red" height="76" rx="2" width="120" x="223" y="238"></rect><text class="sv-tr" text-anchor="middle" x="283" y="256">Nuevo CP</text><text class="sv-t2" text-anchor="middle" x="283" y="271">«tolerancia cero»</text><text class="sv-t2" text-anchor="middle" x="283" y="286">fin de redenciones</text><text class="sv-t2" text-anchor="middle" x="283" y="302">más represor que 1973</text>
<line class="sv-line-dash" x1="385" x2="385" y1="195" y2="186"></line>
<rect class="sv-box" height="76" rx="2" width="120" x="325" y="108"></rect><text class="sv-t" text-anchor="middle" x="385" y="126">LO 15/2003</text><text class="sv-t2" text-anchor="middle" x="385" y="141">prisión mín. 3 meses</text><text class="sv-t2" text-anchor="middle" x="385" y="156">más vía penal</text><text class="sv-t3" text-anchor="middle" x="385" y="172">post-11S</text>
<line class="sv-line-dash" x1="487" x2="487" y1="205" y2="236"></line>
<rect class="sv-box-red" height="76" rx="2" width="120" x="427" y="238"></rect><text class="sv-tr" text-anchor="middle" x="487" y="256">CP + Ley Mordaza</text><text class="sv-t2" text-anchor="middle" x="487" y="271">prisión permanente</text><text class="sv-t2" text-anchor="middle" x="487" y="286">vía administrativa</text><text class="sv-t3" text-anchor="middle" x="487" y="302">crisis 2008 · 15M</text>
<line class="sv-line-dash" x1="588" x2="588" y1="195" y2="186"></line>
<rect class="sv-box" height="76" rx="2" width="120" x="528" y="108"></rect><text class="sv-t" text-anchor="middle" x="588" y="126">Sedición fuera</text><text class="sv-t2" text-anchor="middle" x="588" y="141">desórdenes agravados</text><text class="sv-t2" text-anchor="middle" x="588" y="156">«solo sí es sí»</text><text class="sv-t3" text-anchor="middle" x="588" y="172">procés</text>
<line class="sv-line-dash" x1="690" x2="690" y1="205" y2="236"></line>
<rect class="sv-box-gold" height="76" rx="2" width="118" x="630" y="238"></rect><text class="sv-tg" text-anchor="middle" x="689" y="256">Ley de Amnistía</text><text class="sv-t2" text-anchor="middle" x="689" y="271">la ley como producto</text><text class="sv-t2" text-anchor="middle" x="689" y="286">de la correlación</text><text class="sv-t3" text-anchor="middle" x="689" y="302">de fuerzas</text>
</svg>
