<svg xmlns="http://www.w3.org/2000/svg" aria-label="Mapa conceptual del volumen 5: de la ley del valor y el sistema interestatal al imperialismo y la hegemonía estadounidense, las desviaciones campista y anticampista, la cuestión colonial, la independencia política de clase, el estalinismo y la Internacional comunista" role="img" viewBox="0 0 760 370">
