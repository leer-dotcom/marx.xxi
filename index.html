<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lector de Marx XXI</title>
  <meta name="apple-mobile-web-app-title" content="Lector M·XXI">
  <meta name="application-name" content="Lector M·XXI">
  <meta name="description" content="Lector de Marx XXI (cinco volúmenes) y Nuevo Ciclo (revista trimestral): textos íntegros con guía de estudio de cada artículo, tesis comunes, síntesis de la colección, glosario, subrayados y notas. Funciona sin conexión.">
  <meta name="theme-color" content="#2c332f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Alegreya+SC:wght@400;500&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="data/diagram.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplicar el tema antes de pintar para evitar parpadeo
    try { var s = JSON.parse(localStorage.getItem('mx.settings') || '{}'); if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>
  <header class="appbar" id="appbar">
    <div class="lead">
      <button class="icon-btn" data-open-menu aria-label="Menú" title="Menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="icon-btn" id="btn-back" aria-label="Volver" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <a class="brand" href="#/"><span class="brand-pre">Lector de</span> Marx XXI</a>
    <div class="appbar-title" id="appbar-title"></div>
    <nav class="appbar-actions" aria-label="Herramientas">
      <a class="icon-btn" href="#/buscar" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></a>
      <button class="icon-btn" data-share aria-label="Compartir enlace" title="Compartir enlace"><svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg></button>
    </nav>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <dialog id="menu" class="drawer" aria-label="Menú">
    <div class="drawer-head">
      <a class="drawer-brand" href="#/"><span class="brand-pre">Lector de</span> Marx XXI</a>
      <button class="icon-btn" data-close aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <nav class="drawer-body" id="menu-body" aria-label="Secciones"></nav>
  </dialog>

  <dialog id="zoom" class="zoom" aria-label="Esquema ampliado">
    <div class="zoom-stage" id="zoom-stage"></div>
    <p class="zoom-caption" id="zoom-caption"></p>
    <div class="zoom-bar">
      <button class="icon-btn" data-zstep="-1" aria-label="Esquema anterior" title="Anterior (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="zoom-pos" class="zoom-pos"></span>
      <button class="icon-btn" data-zstep="1" aria-label="Esquema siguiente" title="Siguiente (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="zoom-sep"></span>
      <button class="icon-btn" data-z="-" aria-label="Reducir" title="Reducir (−)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button type="button" id="zoom-level" data-z="0" aria-label="Ajustar a la pantalla" title="Ajustar a la pantalla (0)">100 %</button>
      <button class="icon-btn" data-z="+" aria-label="Ampliar" title="Ampliar (+)"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      <span class="zoom-sep"></span>
      <button class="icon-btn" data-close aria-label="Cerrar" title="Cerrar (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="update" id="update" role="status" hidden><span>Hay una versión nueva del lector</span><button type="button" class="btn" data-update>Actualizar</button></div>

  <noscript><p style="padding:20px">Esta aplicación necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
